<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱商场 🛍️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Blob 动画用于盲盒结果弹窗 */
        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(10px, -20px) scale(1.1); } 66% { transform: translate(-10px, 10px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        .animate-blob { animation: blob 5s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { background-color: #f43f5e; color: white; border-color: #f43f5e; box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.2); }
        .tab-inactive { background-color: white; color: #6b7280; border-color: #e5e7eb; }

        /* 子选项卡样式 */
        .subtab-active { background-color: #fff1f2; color: #f43f5e; font-weight: bold; }
        .subtab-inactive { color: #9ca3af; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 pb-20">
    
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-500 flex items-center justify-center gap-2">
                🛍️ 恋爱商场
            </h1>
        </div>
        <div class="w-9 h-9"></div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <!-- 积分余额卡片 -->
        <div class="w-full bg-gradient-to-r from-rose-400 to-pink-500 rounded-2xl p-4 shadow-md text-white flex justify-between items-center mb-6 relative overflow-hidden">
            <div class="absolute -right-2 -top-2 text-6xl opacity-20">🪙</div>
            <div class="relative z-10">
                <p class="text-xs text-rose-100 mb-1">我的小金库 (<span id="identityText">-</span>)</p>
                <div class="flex items-baseline gap-1">
                    <span class="text-3xl font-bold" id="myPoints">--</span>
                    <span class="text-sm">积分</span>
                </div>
            </div>
            <button onclick="refreshData()" class="relative z-10 bg-white/20 hover:bg-white/30 backdrop-blur-sm p-2 rounded-full transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <!-- 选项卡导航 -->
        <div class="flex gap-2 w-full mb-6 p-1 bg-gray-100 rounded-full">
            <button onclick="switchTab('mall')" id="tab_mall" class="flex-1 py-2 rounded-full text-sm font-bold transition-all tab-active">逛商场</button>
            <button onclick="switchTab('inventory')" id="tab_inventory" class="flex-1 py-2 rounded-full text-sm font-bold transition-all tab-inactive">我的仓库</button>
            <button onclick="switchTab('verify')" id="tab_verify" class="flex-1 py-2 rounded-full text-sm font-bold transition-all tab-inactive">核销中心</button>
        </div>

        <!-- 加载状态 -->
        <div id="loadingView" class="w-full flex flex-col items-center py-10 animate-fade-in">
            <div class="text-4xl animate-bounce mb-3">📦</div>
            <p class="text-rose-400 font-bold">正在整理货架...</p>
        </div>

        <!-- 视图区 -->
        <div id="contentView" class="w-full hidden">
            
            <!-- 1. 商场视图 -->
            <div id="view_mall" class="w-full animate-fade-in hidden">
                <div class="flex w-full mb-4 bg-white rounded-xl shadow-sm overflow-hidden p-1 gap-1 border border-gray-100">
                    <button onclick="switchSubTab('props')" id="subtab_props" class="flex-1 py-2 text-sm rounded-lg transition-colors subtab-active">🎁 道具</button>
                    <button onclick="switchSubTab('pets')" id="subtab_pets" class="flex-1 py-2 text-sm rounded-lg transition-colors subtab-inactive hover:bg-gray-50">🐾 宠物</button>
                </div>
                <div id="mall_props" class="w-full animate-fade-in">
                    <div id="blindBoxContainer" class="mb-3"></div>
                    <div class="grid grid-cols-2 gap-3" id="mallGrid"></div>
                </div>
                <div id="mall_pets" class="w-full animate-fade-in hidden">
                    <div class="grid grid-cols-2 gap-3" id="petsGrid"></div>
                </div>
            </div>

            <!-- 2. 仓库视图 -->
            <div id="view_inventory" class="w-full animate-fade-in hidden">
                <div class="flex w-full mb-4 bg-white rounded-xl shadow-sm overflow-hidden p-1 gap-1 border border-gray-100">
                    <button onclick="switchInventorySubTab('props')" id="inv_subtab_props" class="flex-1 py-2 text-sm rounded-lg transition-colors subtab-active">🎁 我的道具</button>
                    <button onclick="switchInventorySubTab('pets')" id="inv_subtab_pets" class="flex-1 py-2 text-sm rounded-lg transition-colors subtab-inactive hover:bg-gray-50">🐾 宠物道具</button>
                </div>
                
                <div id="inventory_props" class="space-y-3 animate-fade-in"></div>
                <div id="inventory_pets" class="space-y-3 animate-fade-in hidden"></div>
            </div>

            <!-- 3. 核销视图 -->
            <div id="view_verify" class="w-full animate-fade-in hidden">
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-rose-100 mb-6 text-center">
                    <h3 class="font-bold text-gray-800 mb-2">核销对方的使用码</h3>
                    <p class="text-xs text-gray-500 mb-4">当对方在仓库点击使用物品后，会生成一个6位码。在此处输入核销后，物品才正式生效。</p>
                    <div class="flex gap-2">
                        <input type="text" id="verifyInput" placeholder="输入6位使用码" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-center font-mono font-bold text-lg focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 uppercase">
                        <button onclick="verifyCode()" class="bg-rose-500 text-white px-5 py-2 rounded-xl font-bold shadow-sm hover:bg-rose-600 transition-colors">核销</button>
                    </div>
                </div>
                <div class="text-left w-full">
                    <h4 class="text-sm font-bold text-gray-700 mb-3 ml-1">对方待核销的请求</h4>
                    <div class="space-y-3" id="partnerPendingList"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-[70] whitespace-nowrap"></div>

    <!-- 确认购买弹窗 -->
    <div id="buyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform" id="buyModalContent">
            <div class="text-center mb-4">
                <span id="buyIcon" class="text-5xl block mb-2"></span>
                <h3 id="buyName" class="font-bold text-gray-800 text-xl"></h3>
                <p id="buyDesc" class="text-sm text-gray-500 mt-1"></p>
            </div>
            <div class="bg-rose-50 rounded-xl p-3 flex justify-between items-center mb-6">
                <span class="text-sm text-gray-600 font-medium">需要支付</span>
                <span class="text-rose-500 font-bold text-lg"><span id="buyPrice"></span> 积分</span>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal('buyModal', 'buyModalContent')" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-colors">取消</button>
                <button id="confirmBuyBtn" class="flex-1 py-2.5 bg-rose-500 text-white rounded-xl font-bold shadow-md hover:bg-rose-600 transition-colors">确认购买</button>
            </div>
        </div>
    </div>

    <!-- 新增：出售数量选择弹窗 -->
    <div id="sellModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform" id="sellModalContent">
            <div class="flex items-center justify-between mb-5 pb-4 border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <span id="sellIcon" class="text-3xl"></span>
                    <div>
                        <h3 id="sellName" class="font-bold text-gray-800"></h3>
                        <p class="text-xs text-gray-500 mt-0.5">回收价: <span id="sellUnitPrice" class="font-bold text-amber-500"></span> 积分/个</p>
                    </div>
                </div>
                <div class="text-xs text-gray-400 bg-gray-50 px-2 py-1 rounded-md">8折回收</div>
            </div>
            
            <div class="mb-6 flex flex-col items-center">
                <p class="text-sm text-gray-600 font-medium mb-3">请选择出售数量</p>
                <div class="flex items-center gap-4 bg-gray-50 p-2 rounded-2xl border border-gray-100">
                    <button onclick="changeSellQty(-1)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-600 rounded-xl shadow-sm border border-gray-200 active:scale-95 transition text-lg font-bold hover:text-rose-500">-</button>
                    <span id="sellQtyDisplay" class="text-2xl font-black text-gray-800 w-12 text-center">1</span>
                    <button onclick="changeSellQty(1)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-600 rounded-xl shadow-sm border border-gray-200 active:scale-95 transition text-lg font-bold hover:text-rose-500">+</button>
                </div>
            </div>

            <div class="bg-amber-50 rounded-xl p-3 flex justify-between items-center mb-6 border border-amber-100">
                <span class="text-sm text-gray-600 font-medium">预计可获得</span>
                <span class="text-amber-500 font-bold text-lg">+<span id="sellTotalPrice"></span> 积分</span>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('sellModal', 'sellModalContent')" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-colors">取消</button>
                <button onclick="confirmSellStep()" class="flex-1 py-2.5 bg-gradient-to-r from-amber-400 to-orange-400 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all">确认出售</button>
            </div>
        </div>
    </div>

    <!-- 新增：二次确认出售弹窗 -->
    <div id="confirmSellModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform text-center" id="confirmSellModalContent">
            <div class="text-5xl mb-3">⚠️</div>
            <h3 class="font-bold text-gray-800 text-lg mb-3">最终确认</h3>
            <p id="confirmSellText" class="text-sm text-gray-600 mb-6 leading-relaxed"></p>
            
            <div class="flex gap-3">
                <button onclick="closeModal('confirmSellModal', 'confirmSellModalContent')" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-colors">点错了</button>
                <button onclick="executeSell()" class="flex-1 py-2.5 bg-rose-500 text-white rounded-xl font-bold shadow-md hover:bg-rose-600 transition-colors">确定卖出</button>
            </div>
        </div>
    </div>
    
    <!-- 盲盒抽取结果弹窗 (简略，保留原有结构) -->
    <div id="blindBoxResultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-50 transition-transform text-center relative overflow-hidden" id="blindBoxResultModalContent">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-purple-200 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-pink-200 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-2000"></div>
            <h3 class="font-bold text-gray-800 text-lg mb-6 relative z-10 flex items-center justify-center gap-2"><span>🎉</span> 盲盒开启成功！</h3>
            <div class="mb-6 relative z-10 flex flex-col items-center">
                <div class="text-8xl animate-pop mb-4 filter drop-shadow-md" id="bbResultIcon"></div>
                <h4 class="font-black text-2xl text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500" id="bbResultName"></h4>
                <p class="text-sm text-gray-500 mt-2 font-medium" id="bbResultDesc"></p>
            </div>
            <button onclick="closeBbModal()" class="relative z-10 w-full py-3.5 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl font-bold shadow-lg shadow-pink-200 hover:opacity-90 active:scale-95 transition-all">开心收下</button>
        </div>
    </div>

    <!-- 使用码与核销弹窗 -->
    <div id="codeModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform text-center" id="codeModalContent">
            <h3 class="font-bold text-gray-800 text-lg mb-1">物品使用申请已生成</h3>
            <p class="text-xs text-gray-500 mb-5">请将此码发送给对方，核销后即代表使用成功</p>
            <div class="bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl p-4 mb-5">
                <span id="generatedCode" class="text-3xl font-mono font-bold text-rose-500 tracking-widest"></span>
            </div>
            <button onclick="copyCodeAndClose()" class="w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow-md hover:bg-rose-600 transition-colors">复制核销码并关闭</button>
        </div>
    </div>

    <div id="verifySuccessModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform text-center" id="verifySuccessModalContent">
            <div class="text-6xl mb-4 animate-pop">🎉</div>
            <h3 class="font-bold text-gray-800 text-xl mb-2">核销成功！</h3>
            <p class="text-sm text-gray-500 mb-6">对方的 <span id="verifiedItemName" class="font-bold text-rose-500"></span> 已正式生效，快去履行吧~</p>
            <button onclick="closeModal('verifySuccessModal', 'verifySuccessModalContent')" class="w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow-md hover:bg-rose-600 transition-colors">我知道啦</button>
        </div>
    </div>

    <input type="text" id="clipboardInput" class="hidden absolute -left-9999">

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; 
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('identityText').innerText = myIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_FILE = `data/${myIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const PARTNER_FILE = `data/${partnerIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        
        const SCWP_FILE = 'data/scwp.json'; 
        const CWSP_FILE = 'data/cwsp.json'; 
        const CW_FILE = 'data/cw.json';     

        let mallItems = []; 
        let petItems = [];  
        
        let myData = { points: 50, inventory: {}, pendingUses: [], sha: null }; 
        let partnerData = { points: 50, inventory: {}, pendingUses: [], sha: null };
        let cwData = { sha: null }; 

        // 交易与出售状态管理
        let currentBuyingItem = null;
        let sellState = { id: null, type: null, maxQty: 0, qty: 1, unitPrice: 0, itemDef: null };

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        window.onload = async function() {
            await refreshData();
        };

        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (response.status === 404) return { data: null, sha: null };
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                console.error("Fetch Error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update Error:", error);
                return { success: false };
            }
        }

        async function refreshData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');

            const [myRes, partnerRes, scwpRes, cwspRes, cwRes] = await Promise.all([
                fetchFile(MY_FILE), fetchFile(PARTNER_FILE), fetchFile(SCWP_FILE), 
                fetchFile(CWSP_FILE), fetchFile(CW_FILE)
            ]);

            if (myRes.error || partnerRes.error || scwpRes.error || cwspRes.error || cwRes.error) {
                showToast("获取数据失败，请检查网络或Token");
                return;
            }

            if (scwpRes.data && Array.isArray(scwpRes.data)) {
                mallItems = scwpRes.data;
            } else {
                mallItems = [
                    { id: 'truth', name: '真心话卷', price: 3, icon: '🙊', desc: '强制对方如实回答一个问题' },
                    { id: 'peace', name: '和解卷', price: 10, icon: '🕊️', desc: '吵架时使用，无条件和好如初' }
                ];
            }

            if (cwspRes.data && Array.isArray(cwspRes.data)) {
                petItems = cwspRes.data;
            } else {
                petItems = [
                    { id: 'pet_food', name: '高级罐头', price: 15, icon: '🥫', desc: '美味的宠物罐头' },
                    { id: 'pet_toy', name: '毛绒玩具', price: 20, icon: '🪀', desc: '宠物最喜欢的互动玩具' }
                ];
            }

            if (myRes.data) {
                myData = { ...myData, ...myRes.data, sha: myRes.sha };
                if(typeof myData.points !== 'number') myData.points = 50;
                if(!myData.inventory) myData.inventory = {};
                if(!myData.pendingUses) myData.pendingUses = [];
            }
            if (partnerRes.data) {
                partnerData = { ...partnerData, ...partnerRes.data, sha: partnerRes.sha };
                if(!partnerData.pendingUses) partnerData.pendingUses = [];
            }

            if (cwRes.data) {
                cwData = { ...cwRes.data, sha: cwRes.sha };
            }
            if (!cwData[myIdentity]) cwData[myIdentity] = { inventory: {} };
            if (!cwData[partnerIdentity]) cwData[partnerIdentity] = { inventory: {} };
            if (!cwData.shared) cwData.shared = { inventory: {} }; 
            if (!cwData.equipped) cwData.equipped = []; 

            document.getElementById('myPoints').innerText = myData.points;
            renderMall();
            renderInventory();
            renderVerify();

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            
            switchTab('mall'); 
            switchSubTab('props');
        }

        function switchTab(tabName) {
            ['mall', 'inventory', 'verify'].forEach(name => {
                const btn = document.getElementById(`tab_${name}`);
                const view = document.getElementById(`view_${name}`);
                if (name === tabName) {
                    btn.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all tab-active";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2 rounded-full text-sm font-bold transition-all tab-inactive";
                    view.classList.add('hidden');
                }
            });
        }

        function switchSubTab(tabName) {
            const propsBtn = document.getElementById('subtab_props');
            const petsBtn = document.getElementById('subtab_pets');
            const propsView = document.getElementById('mall_props');
            const petsView = document.getElementById('mall_pets');

        // ---------- 新增：出售相关逻辑 ----------
        function promptSell(itemId, type) {
            const list = type === 'pet' ? petItems : mallItems;
            const itemDef = list.find(i => i.id === itemId);
            if (!itemDef) return;

            let maxQty = 0;
            if (type === 'pet') {
                maxQty = cwData[myIdentity].inventory[itemId] || 0;
            } else {
                maxQty = myData.inventory[itemId] || 0;
            }

            if (maxQty <= 0) return;

            // 8折出售，四舍五入
            const unitPrice = Math.round((itemDef.price || 0) * 0.8);

            sellState = { id: itemId, type, maxQty, qty: 1, unitPrice, itemDef };

            updateSellModalUI();
            openModal('sellModal', 'sellModalContent');
        }

        function changeSellQty(delta) {
            let newQty = sellState.qty + delta;
            if (newQty < 1) newQty = 1;
            if (newQty > sellState.maxQty) newQty = sellState.maxQty;
            sellState.qty = newQty;
            updateSellModalUI();
        }

        function updateSellModalUI() {
            document.getElementById('sellIcon').innerText = sellState.itemDef.icon;
            document.getElementById('sellName').innerText = sellState.itemDef.name;
            document.getElementById('sellUnitPrice').innerText = sellState.unitPrice;
            document.getElementById('sellQtyDisplay').innerText = sellState.qty;
            document.getElementById('sellTotalPrice').innerText = sellState.qty * sellState.unitPrice;
        }

        function confirmSellStep() {
            closeModal('sellModal', 'sellModalContent');
            
            const totalPoints = sellState.qty * sellState.unitPrice;
            document.getElementById('confirmSellText').innerHTML = `确定要以 <span class="text-amber-500 font-bold text-lg">${totalPoints} 积分</span> 的价格，<br/>出售 <span class="font-bold text-gray-800">${sellState.qty}</span> 个 【${sellState.itemDef.name}】 吗？<br/><span class="text-xs text-gray-400 mt-2 block">此操作不可撤销，积分将立即到账。</span>`;
            
            setTimeout(() => {
                openModal('confirmSellModal', 'confirmSellModalContent');
            }, 300); // 等待上一个弹窗关闭动画
        }

        async function executeSell() {
            closeModal('confirmSellModal', 'confirmSellModalContent');
            showToast("正在回收处理中...");

            const { id, type, qty, unitPrice, itemDef } = sellState;
            const totalPrice = qty * unitPrice;

            // 本地状态更新
            myData.points += totalPrice;

            if (type === 'pet') {
                cwData[myIdentity].inventory[id] -= qty;
                if (cwData[myIdentity].inventory[id] <= 0) delete cwData[myIdentity].inventory[id];
            } else {
                myData.inventory[id] -= qty;
                if (myData.inventory[id] <= 0) delete myData.inventory[id];
            }

            // 同步云端防冲突
            const [latestMy, latestCw] = await Promise.all([
                fetchFile(MY_FILE),
                type === 'pet' ? fetchFile(CW_FILE) : Promise.resolve({sha: cwData.sha})
            ]);
            
            if (latestMy.sha) myData.sha = latestMy.sha;
            if (type === 'pet' && latestCw.sha) cwData.sha = latestCw.sha;

            const myRes = await updateFile(MY_FILE, { 
                points: myData.points, 
                inventory: myData.inventory, 
                pendingUses: myData.pendingUses 
            }, myData.sha, `Sell ${qty} ${itemDef.name}`);

            let cwRes = { success: true };
            if (type === 'pet' && myRes.success) {
                const cwPayload = { ...cwData };
                delete cwPayload.sha;
                cwRes = await updateFile(CW_FILE, cwPayload, cwData.sha, `Sell Pet Item ${itemDef.name}`);
            }

            if (myRes.success && cwRes.success) {
                myData.sha = myRes.sha;
                if (type === 'pet') cwData.sha = cwRes.sha;
                
                document.getElementById('myPoints').innerText = myData.points;
                renderInventory();
                showToast(`🎉 出售成功，获得 ${totalPrice} 积分!`);
            } else {
                // 失败回滚
                myData.points -= totalPrice;
                if (type === 'pet') {
                    cwData[myIdentity].inventory[id] = (cwData[myIdentity].inventory[id] || 0) + qty;
                } else {
                    myData.inventory[id] = (myData.inventory[id] || 0) + qty;
                }
                showToast("网络错误，出售失败，请重试");
                document.getElementById('myPoints').innerText = myData.points;
                renderInventory();
            }
        }

        // ---------- 原有购买与使用逻辑 ----------
        function promptBuyBlindBox() {
            if (mallItems.length === 0) return showToast("商场商品还在准备中哦~");
            if (myData.points < 10) return showToast("🪙 积分不足，快去做任务赚积分吧！");
            
            currentBuyingItem = { id: 'blind_box', type: 'prop', name: '惊喜盲盒', price: 10, icon: '🎁', desc: '随机抽取商场内的任意一件道具！' };
            document.getElementById('buyIcon').innerText = currentBuyingItem.icon;
            document.getElementById('buyName').innerText = currentBuyingItem.name;
            document.getElementById('buyDesc').innerText = currentBuyingItem.desc;
            document.getElementById('buyPrice').innerText = currentBuyingItem.price;
            document.getElementById('confirmBuyBtn').onclick = executeBuy;
            openModal('buyModal', 'buyModalContent');
        }

        function promptBuy(itemId, type = 'prop') {
            const list = type === 'pet' ? petItems : mallItems;
            const item = list.find(i => i.id === itemId);
            if (!item) return;
            
            if (type === 'pet' && item.gmcs !== undefined) {
                const currentCount = item.sfgy === 1 ? (cwData.shared.inventory[item.id] || 0) : (cwData[myIdentity].inventory[item.id] || 0);
                if (currentCount >= item.gmcs) return showToast("❌ 已经达到该物品的限购次数啦！");
            }

            if (myData.points < item.price) return showToast("🪙 积分不足，快去做任务赚积分吧！");

            currentBuyingItem = { ...item, type };
            document.getElementById('buyIcon').innerText = item.icon;
            document.getElementById('buyName').innerText = item.name;
            document.getElementById('buyDesc').innerText = item.desc;
            document.getElementById('buyPrice').innerText = item.price;
            document.getElementById('confirmBuyBtn').onclick = executeBuy;
            openModal('buyModal', 'buyModalContent');
        }

        async function executeBuy() {
            const item = currentBuyingItem;
            closeModal('buyModal', 'buyModalContent');
            showToast("正在付款处理中，请稍候...");

            let itemToGive = item;
            let isBlindBox = false;

            if (item.id === 'blind_box') {
                isBlindBox = true;
                itemToGive = mallItems[Math.floor(Math.random() * mallItems.length)];
            }

            myData.points -= item.price; 
            
            if (item.type === 'pet') {
                if (itemToGive.sfgy === 1) {
                    if (!cwData.shared.inventory[itemToGive.id]) cwData.shared.inventory[itemToGive.id] = 0;
                    cwData.shared.inventory[itemToGive.id] += 1;
                } else {
                    if (!cwData[myIdentity].inventory[itemToGive.id]) cwData[myIdentity].inventory[itemToGive.id] = 0;
                    cwData[myIdentity].inventory[itemToGive.id] += 1;
                }
            } else {
                myData.inventory[itemToGive.id] = (myData.inventory[itemToGive.id] || 0) + 1;
            }

            const [latestMy, latestCw] = await Promise.all([
                fetchFile(MY_FILE),
                item.type === 'pet' ? fetchFile(CW_FILE) : Promise.resolve({sha: cwData.sha})
            ]);
            
            if (latestMy.sha) myData.sha = latestMy.sha;
            if (item.type === 'pet' && latestCw.sha) cwData.sha = latestCw.sha;

            const myRes = await updateFile(MY_FILE, { points: myData.points, inventory: myData.inventory, pendingUses: myData.pendingUses }, myData.sha, `Buy ${isBlindBox ? 'Blind Box' : item.name}`);

            let cwRes = { success: true };
            if (item.type === 'pet' && myRes.success) {
                const cwPayload = { ...cwData };
                delete cwPayload.sha;
                cwRes = await updateFile(CW_FILE, cwPayload, cwData.sha, `Buy Pet ${item.name} for ${myIdentity}`);
            }

            if (myRes.success && cwRes.success) {
                myData.sha = myRes.sha;
                if (item.type === 'pet') cwData.sha = cwRes.sha;
                document.getElementById('myPoints').innerText = myData.points;
                renderInventory();
                renderMall(); 
                
                if (isBlindBox) {
                    showBlindBoxResult(itemToGive);
                } else {
                    showToast(`🎉 成功获得【${item.name}】!`);
                    switchTab('inventory');
                }
            } else {
                myData.points += item.price;
                if (item.type === 'pet') {
                    if (itemToGive.sfgy === 1) cwData.shared.inventory[itemToGive.id] -= 1;
                    else cwData[myIdentity].inventory[itemToGive.id] -= 1;
                } else {
                    myData.inventory[itemToGive.id] -= 1;
                }
                showToast("网络错误，购买未能完成");
                renderInventory();
                document.getElementById('myPoints').innerText = myData.points;
            }
        }

        async function usePetItem(itemId) {
            const itemDef = petItems.find(i => i.id === itemId) || { name: itemId };
            if (!cwData[myIdentity].inventory[itemId] || cwData[myIdentity].inventory[itemId] <= 0) return showToast("物品数量不足");

            cwData[myIdentity].inventory[itemId] -= 1;
            showToast("正在喂给宠物...");
            
            const latestCw = await fetchFile(CW_FILE);
            if (latestCw.sha) {
                cwData.sha = latestCw.sha;
                if (latestCw.data) {
                    cwData.level = latestCw.data.level !== undefined ? latestCw.data.level : cwData.level;
                    cwData.hunger = latestCw.data.hunger !== undefined ? latestCw.data.hunger : cwData.hunger;
                }
            }

            let effectMsg = "";
            if (itemId === 'cwsjk') { 
                cwData.level = (cwData.level || 0) + 1;
                effectMsg = "宠物升了 1 级！";
            } else if (itemId === 'cwsw') { 
                const addHunger = Math.floor(Math.random() * 51) + 50; 
                cwData.hunger = (cwData.hunger || 0) + addHunger;
                if (cwData.hunger > 100) cwData.hunger = 100; 
                effectMsg = `饱腹值增加了 ${addHunger}！`;
            }

            const cwPayload = { ...cwData };
            delete cwPayload.sha;
            const res = await updateFile(CW_FILE, cwPayload, cwData.sha, `Use Pet Item ${itemDef.name}`);

            if (res.success) {
                cwData.sha = res.sha;
                renderInventory();
                showToast(`🎉 成功使用【${itemDef.name}】! ${effectMsg}`);
            } else {
                cwData[myIdentity].inventory[itemId] += 1;
                if (itemId === 'cwsjk') cwData.level -= 1;
                showToast("网络错误，使用失败");
            }
        }

        async function toggleEquipPetItem(itemId, isEquip) {
            const itemDef = petItems.find(i => i.id === itemId) || { name: itemId };
            showToast("正在为宠物换装...");
            
            const latestCw = await fetchFile(CW_FILE);
            if (latestCw.sha) {
                cwData.sha = latestCw.sha;
                if (latestCw.data) cwData.equipped = latestCw.data.equipped || [];
            }
            if (!cwData.equipped) cwData.equipped = [];

            if (isEquip) {
                if (!cwData.equipped.includes(itemId)) cwData.equipped.push(itemId);
            } else {
                cwData.equipped = cwData.equipped.filter(id => id !== itemId);
            }

            const cwPayload = { ...cwData };
            delete cwPayload.sha;
            const res = await updateFile(CW_FILE, cwPayload, cwData.sha, `${isEquip ? 'Equip' : 'Unequip'} Pet Item ${itemDef.name}`);

            if (res.success) {
                cwData.sha = res.sha;
                renderInventory(); 
                showToast(`🎉 成功${isEquip ? '穿戴' : '卸下'}了【${itemDef.name}】!`);
            } else {
                if (isEquip) cwData.equipped = cwData.equipped.filter(id => id !== itemId);
                else cwData.equipped.push(itemId);
                showToast("网络错误，换装失败");
            }
        }

        async function useItem(itemId) {
            const itemDef = mallItems.find(i => i.id === itemId) || { name: itemId };
            
            myData.inventory[itemId] -= 1;
            if (myData.inventory[itemId] < 0) myData.inventory[itemId] = 0;

            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
            let code = '';
            for(let i=0; i<6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

            myData.pendingUses.push({ code: code, itemId: itemId, time: Date.now(), status: 'pending' });
            
            showToast("生成使用码中...");
            const latest = await fetchFile(MY_FILE);
            if(latest.sha) myData.sha = latest.sha;

            const res = await updateFile(MY_FILE, { points: myData.points, inventory: myData.inventory, pendingUses: myData.pendingUses }, myData.sha, `Use ${itemDef.name}`);

            if (res.success) {
                myData.sha = res.sha;
                renderInventory();
                document.getElementById('generatedCode').innerText = code;
                openModal('codeModal', 'codeModalContent');
            } else {
                myData.inventory[itemId] += 1;
                myData.pendingUses.pop();
                showToast("网络错误，使用失败");
            }
        }

        async function verifyCode() {
            const inputEl = document.getElementById('verifyInput');
            const code = inputEl.value.trim().toUpperCase();

            if (!code || code.length !== 6) return showToast("请输入完整的6位使用码！");

            const recordIndex = partnerData.pendingUses.findIndex(p => p.code === code && p.status === 'pending');
            if (recordIndex === -1) return showToast("❌ 核销失败：找不到该使用码，或已被核销");

            const record = partnerData.pendingUses[recordIndex];
            const itemDef = mallItems.find(i => i.id === record.itemId) || { name: record.itemId };

            showToast("核销中...");
            partnerData.pendingUses[recordIndex].status = 'verified';

            const latest = await fetchFile(PARTNER_FILE);
            if(latest.sha) partnerData.sha = latest.sha;

            const res = await updateFile(PARTNER_FILE, { points: partnerData.points, inventory: partnerData.inventory, pendingUses: partnerData.pendingUses }, partnerData.sha, `Verify code ${code}`);

            if (res.success) {
                partnerData.sha = res.sha;
                inputEl.value = '';
                renderVerify();
                document.getElementById('verifiedItemName').innerText = `【${itemDef.name}】`;
                openModal('verifySuccessModal', 'verifySuccessModalContent');
            } else {
                partnerData.pendingUses[recordIndex].status = 'pending';
                showToast("网络错误，核销失败");
            }
        }

        function openModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                if (contentId === 'blindBoxResultModalContent') {
                     content.classList.remove('scale-50');
                } else {
                     content.classList.remove('scale-95');
                }
                content.classList.add('scale-100');
            });
        }

        function closeModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            if (contentId === 'blindBoxResultModalContent') {
                content.classList.add('scale-50');
            } else {
                content.classList.add('scale-95');
            }
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function copyCodeAndClose() {
            const code = document.getElementById('generatedCode').innerText;
            const input = document.getElementById('clipboardInput');
            input.value = `请求核销！\n使用码：${code}\n快去恋爱商场核销吧~`;
            input.classList.remove('hidden');
            input.select();
            document.execCommand('copy');
            input.classList.add('hidden');
            
            closeModal('codeModal', 'codeModalContent');
            showToast("已复制核销码，快发给TA吧！");
        }

        function copySpecificCode(code) {
            const input = document.getElementById('clipboardInput');
            input.value = `请求核销！\n使用码：${code}\n快去恋爱商场核销吧~`;
            input.classList.remove('hidden');
            input.select();
            document.execCommand('copy');
            input.classList.add('hidden');
            
            showToast("已复制核销码，快发给TA吧！");
        }

        let toastTimeout;
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            
            toast.classList.remove('toast-animate');
            void toast.offsetWidth; 
            toast.classList.add('toast-animate'); 
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

    </script>
</body>
</html>
