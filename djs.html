<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时光纪念碑 ⏳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 引入 Noto Sans SC (正文) 和 Nunito (圆润的现代数字字体) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 15px 40px rgba(255, 175, 195, 0.35);
        }

        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            /* 还原截图中的唯美淡粉色虚化背景 */
            background-color: #fff0f5; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 228, 235, 1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 230, 240, 1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 240, 245, 1) 0%, transparent 60%);
            background-attachment: fixed;
            overflow-x: hidden; 
            min-height: 100vh;
            color: #475569;
        }
        
        /* 针对数字的圆润字体优化 */
        .font-num { 
            font-family: 'Nunito', sans-serif; 
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* 悬浮动画 */
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-8px); } 
            100% { transform: translateY(0px); } 
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        /* 弹窗及交互动画 */
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 30px); } 
            15% { opacity: 1; transform: translate(-50%, 0); } 
            85% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3.5s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pop { 0% { transform: scale(0.7); opacity: 0;} 50% { transform: scale(1.15); opacity: 1;} 100% { transform: scale(1); opacity: 1;} }
        .animate-pop { animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .num-container {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            height: 1.1em;
            line-height: 1.1em;
            vertical-align: bottom;
        }
        .num-scroller {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .num-scroller.no-transition {
            transition: none !important;
        }
        .num-item {
            height: 1.1em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 核心毛玻璃卡片类 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        
        /* 内部元素的毛玻璃 */
        .inner-glass {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 15px rgba(255, 180, 200, 0.15);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 全屏飘落特效 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            animation: fall linear forwards;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateY(5vh) rotate(45deg) scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.8); opacity: 0; }
        }
        
        /* 定制化原生日期时间选择器样式 */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start py-6 px-4 pb-28 relative">
    
    <!-- 飘落特效层 -->
    <div id="confetti-canvas" class="hidden"></div>

    <header class="text-center mb-6 max-w-md w-full flex justify-between items-center px-2 z-10 relative">
        <button onclick="showToast('这里是返回上一页的动作')" class="p-2.5 bg-white/70 backdrop-blur-md text-rose-400 rounded-full shadow-sm border border-white hover:bg-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <div class="animate-float">
            <h1 class="text-xl font-black text-rose-400 flex items-center justify-center gap-2 tracking-widest">
                <span class="text-2xl">✨</span> 时光纪念碑
            </h1>
        </div>
        <button onclick="refreshData()" class="p-2.5 bg-white/70 backdrop-blur-md text-rose-400 rounded-full shadow-sm border border-white hover:bg-white transition-colors group">
            <svg class="w-5 h-5 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </header>

    <main class="w-full max-w-md flex flex-col items-center relative z-10">
        
        <!-- 加载状态 -->
        <div id="loadingView" class="w-full flex flex-col items-center py-24 animate-fade-in">
            <div class="text-6xl animate-bounce mb-6 drop-shadow-sm">🌸</div>
            <p class="text-rose-400 font-bold tracking-widest text-lg">读取恋爱宇宙中...</p>
        </div>

        <div id="contentView" class="w-full hidden">
            
            <!-- 正数日：纪念碑核心，采用毛玻璃质感 -->
            <div class="w-full glass-card rounded-[2.5rem] p-8 text-rose-500 mb-8 relative overflow-hidden group">
                <!-- 装饰背景光晕 -->
                <div class="absolute -right-8 -top-8 text-9xl opacity-[0.07] transform rotate-12 transition-transform group-hover:rotate-45 group-hover:scale-110 duration-700 ease-out">💖</div>
                <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-pink-100/50 rounded-full blur-3xl"></div>
                
                <div class="relative z-10 text-center">
                    <div class="flex items-center justify-center gap-3 mb-6">
                        <div class="h-[2px] w-8 bg-gradient-to-r from-transparent to-rose-200 rounded-full"></div>
                        <p class="text-sm text-rose-400 font-black tracking-widest">我们的相爱时光</p>
                        <button onclick="promptEditStartDate()" class="text-rose-300 hover:text-rose-500 transition-all bg-white/50 hover:bg-white rounded-full p-1.5 shadow-sm border border-white">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                        <div class="h-[2px] w-8 bg-gradient-to-l from-transparent to-rose-200 rounded-full"></div>
                    </div>
                    
                    <!-- 动态翻页天数 -->
                    <div class="flex justify-center items-end gap-1.5 mb-8">
                        <div class="text-[5.5rem] leading-[1] font-black font-num tracking-tighter drop-shadow-sm text-rose-500 num-container h-[1em]" id="days-container">
                            <div class="num-scroller" id="days-scroller">
                                <div class="num-item">0</div>
                            </div>
                        </div>
                        <span class="text-2xl font-black mb-3 text-rose-400">天</span>
                    </div>

                    <!-- 时分秒面板 (毛玻璃内嵌卡片) -->
                    <div class="grid grid-cols-3 gap-3 inner-glass rounded-2xl p-4">
                        <div class="flex flex-col items-center">
                            <div class="text-3xl font-black font-num num-container text-rose-500" id="hours-container">
                                <div class="num-scroller" id="hours-scroller"><div class="num-item">00</div></div>
                            </div>
                            <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Hours</span>
                        </div>
                        <div class="flex flex-col items-center border-x border-rose-100/50">
                            <div class="text-3xl font-black font-num num-container text-rose-500" id="mins-container">
                                <div class="num-scroller" id="mins-scroller"><div class="num-item">00</div></div>
                            </div>
                            <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Mins</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <div class="text-3xl font-black font-num num-container text-rose-500" id="secs-container">
                                <div class="num-scroller" id="secs-scroller"><div class="num-item">00</div></div>
                            </div>
                            <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Secs</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 倒数日：未来节点 -->
            <div class="w-full px-1">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-black text-rose-500 flex items-center gap-2">
                        <span class="text-xl">✨</span> 期待的日子
                    </h2>
                    <div class="text-xs text-rose-300 font-bold bg-white/60 px-3 py-1 rounded-full shadow-sm border border-white">滑动可删除</div>
                </div>
                
                <div class="space-y-4" id="countdownList">
                    <!-- JS 动态渲染倒数日列表 -->
                </div>
            </div>

        </div>
    </main>

    <!-- 浮动添加按钮 -->
    <button onclick="promptAddCountdown()" class="fixed bottom-8 right-6 w-16 h-16 bg-white rounded-full shadow-[0_10px_30px_rgba(255,175,195,0.6)] border-2 border-rose-50 flex items-center justify-center text-rose-400 transform hover:scale-110 hover:-translate-y-1 active:scale-95 transition-all duration-300 z-40 hidden group" id="fabBtn">
        <svg class="w-8 h-8 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- 弹窗提示 -->
    <div id="toast" class="fixed bottom-32 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-md text-rose-500 px-6 py-3.5 rounded-full shadow-[0_10px_30px_rgba(255,175,195,0.4)] border border-white text-sm font-black hidden z-[80] whitespace-nowrap flex items-center gap-2">
        <span id="toastIcon">✨</span>
        <span id="toastMsg">提示内容</span>
    </div>

    <!-- 添加/编辑 倒数日弹窗 -->
    <div id="eventModal" class="fixed inset-0 bg-rose-900/20 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-card w-full sm:max-w-sm rounded-t-[2.5rem] sm:rounded-[2.5rem] p-7 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 relative" id="eventModalContent">
            <!-- 顶部小把手 -->
            <div class="w-12 h-1.5 bg-rose-200/50 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <!-- 关闭按钮 -->
            <button onclick="closeModal('eventModal', 'eventModalContent')" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center bg-rose-50 text-rose-400 rounded-full hover:bg-rose-100 transition-colors hidden sm:flex">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h3 class="font-black text-rose-500 text-xl mb-6 text-center flex items-center justify-center gap-2 tracking-widest">
                <span class="text-2xl animate-pop" style="animation-delay: 0.1s">✨</span> 记录期待
            </h3>
            
            <div class="space-y-5 mb-8">
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">EVENT NAME</label>
                    <input type="text" id="eventName" placeholder="例如：某人的生日、一周年纪念" class="w-full inner-glass rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <!-- 这里倒数日仍然保留精确到天的逻辑，因为倒数日常规只看到天 -->
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">TARGET DATE</label>
                    <input type="date" id="eventDate" class="w-full inner-glass rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">CHOOSE ICON</label>
                    <div class="grid grid-cols-6 gap-2 inner-glass p-2.5 rounded-2xl" id="iconSelector">
                        <!-- Icons inserted by JS -->
                    </div>
                    <input type="hidden" id="eventIcon" value="🎉">
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="closeModal('eventModal', 'eventModalContent')" class="flex-1 py-3.5 bg-white text-rose-400 rounded-2xl font-black shadow-sm border border-rose-50 hover:bg-rose-50 active:scale-95 transition-all sm:hidden">取消</button>
                <button onclick="saveEvent()" class="flex-1 py-3.5 bg-rose-400 text-white rounded-2xl font-black shadow-[0_8px_20px_rgba(251,113,133,0.4)] hover:bg-rose-500 hover:-translate-y-0.5 active:scale-95 transition-all">保存节点</button>
            </div>
        </div>
    </div>

    <!-- 编辑起始日弹窗 -->
    <div id="startModal" class="fixed inset-0 bg-rose-900/20 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-card rounded-[2.5rem] w-full max-w-sm p-8 transform scale-95 transition-transform duration-300 text-center relative" id="startModalContent">
            <!-- 关闭按钮 -->
            <button onclick="closeModal('startModal', 'startModalContent')" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-rose-50 text-rose-400 rounded-full hover:bg-rose-100 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="text-5xl mb-4 animate-float mt-2">💖</div>
            <h3 class="font-black text-rose-500 text-xl mb-2 text-center tracking-wider">修改相爱起始日</h3>
            <p class="text-xs text-rose-300 mb-6 text-center font-bold">时光的起点，精确到那一秒</p>
            
            <!-- 改为 datetime-local 支持到具体时间 -->
            <input type="datetime-local" id="startDateInput" step="1" class="w-full inner-glass rounded-2xl px-4 py-3.5 text-sm font-black text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 mb-8 text-center tracking-wide">
            
            <button onclick="saveStartDate()" class="w-full py-4 bg-rose-400 text-white rounded-2xl font-black shadow-[0_8px_20px_rgba(251,113,133,0.4)] hover:bg-rose-500 active:scale-95 transition-all">确认修改</button>
        </div>
    </div>

    <!-- 庆祝特效弹窗 (毛玻璃) -->
    <div id="celebrateModal" class="fixed inset-0 bg-white/40 backdrop-blur-md z-[70] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-500">
        <div class="glass-card rounded-[3rem] w-full max-w-sm p-10 transform scale-50 transition-transform duration-500 text-center relative overflow-hidden" id="celebrateModalContent">
            
            <button onclick="closeCelebModal()" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center bg-rose-50 text-rose-400 rounded-full hover:bg-rose-100 transition-colors z-20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="absolute inset-0 bg-white/40 z-0"></div> <!-- 增加底色提亮 -->
            
            <div class="text-7xl mb-6 animate-pop drop-shadow-sm relative z-10" id="celebIcon" style="animation-delay: 0.2s">🎉</div>
            <h2 class="font-black text-3xl text-rose-500 mb-3 animate-fade-in relative z-10" id="celebTitle">纪念日快乐！</h2>
            <p class="text-sm text-rose-400 mb-10 font-bold leading-relaxed animate-fade-in relative z-10" style="animation-delay: 0.2s">期待已久的这一天终于到来啦！<br>愿这一天充满无限惊喜。</p>
            
            <button onclick="closeCelebModal()" class="w-full py-4 bg-rose-400 text-white rounded-2xl font-black text-lg shadow-[0_10px_25px_rgba(251,113,133,0.4)] hover:bg-rose-500 hover:-translate-y-1 active:scale-95 transition-all duration-300 relative z-10 animate-fade-in" style="animation-delay: 0.4s">
                一起庆祝吧！
            </button>
        </div>
    </div>

    <script>
        // ----------------- 基础配置与鉴权 -----------------
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken'); 
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const DJS_FILE = `data/djs.json`;

        const ICONS = ['🎉', '🎂', '✈️', '🎁', '💍', '🎬', '🏖️', '🥂', '🏠', '🚗', '🎡', '🌟', '🎮', '🎵', '💐', '🎓', '🌙', '🧸'];

        let djsData = {
            sha: null,
            startDate: "2023-01-01T00:00:00", // 更新默认值为带时间的格式
            countdowns: [] 
        };
        let timerInterval = null;
        let hasCelebratedToday = false;
        
        let lastValues = { days: -1, hours: -1, mins: -1, secs: -1 };

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        async function fetchFile(filePath) {
            if(!GITHUB_TOKEN) return fetchLocal(); 
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null, isNew: true };
                if (!response.ok) throw new Error('Network response not ok');
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                return fetchLocal();
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            if(!GITHUB_TOKEN) return updateLocal(contentObj);
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                updateLocal(contentObj);
                return { success: true, sha: res.content.sha };
            } catch (error) {
                return updateLocal(contentObj);
            }
        }

        function fetchLocal() {
            return new Promise(resolve => {
                const localData = localStorage.getItem('djs_app_data');
                setTimeout(() => {
                    if(localData) {
                        resolve({ data: JSON.parse(localData), sha: 'local_sha_' + Date.now() });
                    } else {
                        resolve({ 
                            data: {
                                startDate: "2023-05-20T13:14:00",
                                countdowns: [
                                    { id: "evt_demo1", title: "跨年夜", date: "2024-12-31", icon: "🎉" }
                                ]
                            }, 
                            sha: 'local_sha_init' 
                        });
                    }
                }, 400); 
            });
        }
        function updateLocal(data) {
            return new Promise(resolve => {
                localStorage.setItem('djs_app_data', JSON.stringify(data));
                resolve({ success: true, sha: 'local_sha_new_' + Date.now() });
            });
        }

        window.onload = async function() {
            initIconSelector();
            await refreshData();
        };

        async function refreshData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('fabBtn').classList.add('hidden');

            const res = await fetchFile(DJS_FILE);
            if (res.data) {
                // 兼容老数据：如果老数据只存了日期 "2023-05-20" ，则自动补全时间
                let sDate = res.data.startDate || "2023-01-01T00:00:00";
                if(sDate.length <= 10) sDate += "T00:00:00"; 
                
                djsData.startDate = sDate;
                djsData.countdowns = res.data.countdowns || [];
                djsData.sha = res.sha;
            }

            lastValues = { days: -1, hours: -1, mins: -1, secs: -1 };
            startTimer();
            renderCountdowns();
            checkCelebrations();

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            document.getElementById('fabBtn').classList.remove('hidden');
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimerUI(); 
            timerInterval = setInterval(updateTimerUI, 1000);
        }

        function updateTimerUI() {
            // 直接读取完整的 startDate，精确到秒
            const start = new Date(djsData.startDate);
            const now = new Date();
            const diff = now - start;

            if (diff < 0) {
                updateRollingNumber('days', 0);
                updateRollingNumber('hours', 0, true);
                updateRollingNumber('mins', 0, true);
                updateRollingNumber('secs', 0, true);
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            if(d !== lastValues.days) { updateRollingNumber('days', d); lastValues.days = d; }
            if(h !== lastValues.hours) { updateRollingNumber('hours', h, true); lastValues.hours = h; }
            if(m !== lastValues.mins) { updateRollingNumber('mins', m, true); lastValues.mins = m; }
            if(s !== lastValues.secs) { updateRollingNumber('secs', s, true); lastValues.secs = s; }
        }

        function updateRollingNumber(idPrefix, newValue, padZero = false) {
            const displayValue = padZero ? String(newValue).padStart(2, '0') : String(newValue);
            const scroller = document.getElementById(`${idPrefix}-scroller`);
            if(!scroller) return;

            const currentEl = scroller.lastElementChild;
            if (currentEl && currentEl.innerText === displayValue) return;

            const newEl = document.createElement('div');
            newEl.className = 'num-item';
            newEl.innerText = displayValue;
            scroller.appendChild(newEl);

            if(scroller.children.length === 1) return;

            requestAnimationFrame(() => {
                scroller.style.transform = `translateY(-${(scroller.children.length - 1) * 100}%)`;
            });

            setTimeout(() => {
                if (scroller.children.length > 1) {
                    scroller.classList.add('no-transition'); 
                    while (scroller.children.length > 1) {
                        scroller.removeChild(scroller.firstChild);
                    }
                    scroller.style.transform = `translateY(0)`; 
                    void scroller.offsetWidth; 
                    scroller.classList.remove('no-transition'); 
                }
            }, 600); 
        }

        function renderCountdowns() {
            const listContainer = document.getElementById('countdownList');
            const now = new Date();
            now.setHours(0,0,0,0);

            let enriched = djsData.countdowns.map(item => {
                const target = new Date(item.date);
                target.setHours(0,0,0,0);
                const diffTime = target - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return { ...item, diffDays, isPast: diffDays < 0 };
            });

            enriched.sort((a, b) => {
                if(a.isPast === b.isPast) {
                    return a.isPast ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
                }
                return a.isPast ? 1 : -1;
            });

            if (enriched.length === 0) {
                listContainer.innerHTML = `
                    <div class="inner-glass rounded-[2rem] p-10 text-center flex flex-col items-center">
                        <div class="text-4xl mb-3 opacity-60 animate-float">☁️</div>
                        <p class="text-sm text-rose-300 font-bold">暂时还没有记录未来的日子哦，<br>点击右下角添加一个吧！</p>
                    </div>`;
                return;
            }

            listContainer.innerHTML = enriched.map(item => {
                const dateStr = item.date;
                let statusHtml = '';
                let cardClass = 'inner-glass shadow-sm';
                let iconBg = 'bg-white text-rose-400 border border-rose-50 shadow-sm';
                
                if (item.diffDays === 0) {
                    statusHtml = `<span class="bg-rose-400 text-white px-3.5 py-1.5 rounded-full text-xs font-black animate-pulse shadow-md">就在今天!</span>`;
                    cardClass = 'bg-white border-2 border-rose-200 shadow-md transform scale-[1.02] relative z-10';
                } else if (item.diffDays > 0) {
                    statusHtml = `
                        <div class="text-right flex items-baseline gap-1">
                            <div class="text-[10px] text-rose-300 font-black tracking-widest uppercase">还有</div>
                            <div class="text-3xl font-black font-num text-rose-400 tracking-tighter drop-shadow-sm">${item.diffDays}</div>
                            <div class="text-xs text-rose-300 font-bold">天</div>
                        </div>`;
                } else {
                    statusHtml = `
                        <div class="text-right flex items-baseline gap-1 opacity-60">
                            <div class="text-[10px] text-slate-400 font-black tracking-widest uppercase">已过</div>
                            <div class="text-2xl font-black font-num text-slate-500 tracking-tighter">${Math.abs(item.diffDays)}</div>
                            <div class="text-[10px] text-slate-400 font-bold">天</div>
                        </div>`;
                    cardClass = 'bg-white/40 border border-white/50 opacity-90';
                    iconBg = 'bg-slate-100 text-slate-400';
                }

                return `
                <div class="relative overflow-hidden rounded-[1.5rem] group cursor-pointer touch-pan-y">
                    <div class="absolute inset-0 bg-red-400 flex justify-end items-center pr-6">
                        <button onclick="deleteEvent('${item.id}')" class="text-white hover:scale-110 active:scale-95 transition-transform p-2">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    <div class="p-4 border transition-transform duration-300 ease-out flex items-center justify-between ${cardClass} relative z-10 group-hover:-translate-x-16 active:-translate-x-20">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 ${iconBg} rounded-[1.2rem] flex items-center justify-center text-3xl">
                                ${item.icon}
                            </div>
                            <div>
                                <h4 class="font-black text-slate-700 text-lg leading-tight mb-1">${item.title}</h4>
                                <p class="text-[11px] font-bold text-rose-300 tracking-wider uppercase font-num">${dateStr}</p>
                            </div>
                        </div>
                        <div>
                            ${statusHtml}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function initIconSelector() {
            const container = document.getElementById('iconSelector');
            container.innerHTML = ICONS.map(icon => `
                <button type="button" onclick="selectIcon(this, '${icon}')" class="icon-btn w-full aspect-square flex items-center justify-center rounded-xl text-2xl transition-all hover:bg-white hover:shadow-sm ${icon === '🎉' ? 'bg-white shadow-md ring-2 ring-rose-300 transform scale-110' : ''}">
                    ${icon}
                </button>
            `).join('');
        }

        function selectIcon(btn, icon) {
            document.querySelectorAll('.icon-btn').forEach(b => {
                b.classList.remove('bg-white', 'shadow-md', 'ring-2', 'ring-rose-300', 'transform', 'scale-110');
            });
            btn.classList.add('bg-white', 'shadow-md', 'ring-2', 'ring-rose-300', 'transform', 'scale-110');
            document.getElementById('eventIcon').value = icon;
        }

        function promptAddCountdown() {
            document.getElementById('eventName').value = '';
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('eventDate').value = tomorrow.toISOString().split('T')[0];
            
            selectIcon(document.querySelector('.icon-btn'), '🎉');
            openModal('eventModal', 'eventModalContent');
        }

        async function saveEvent() {
            const title = document.getElementById('eventName').value.trim();
            const dateStr = document.getElementById('eventDate').value;
            const icon = document.getElementById('eventIcon').value;

            if(!title || !dateStr) {
                showToast("✍️", "请填写完整信息哦~");
                return;
            }

            const newEvent = {
                id: 'evt_' + Date.now(),
                title: title,
                date: dateStr,
                icon: icon
            };

            djsData.countdowns.push(newEvent);
            await syncData("Add new countdown");
            closeModal('eventModal', 'eventModalContent');
        }

        async function deleteEvent(id) {
            djsData.countdowns = djsData.countdowns.filter(item => item.id !== id);
            await syncData("Delete countdown");
        }

        function promptEditStartDate() {
            // 将内部存储的日期转换为适合 datetime-local 的格式 (YYYY-MM-DDTHH:mm)
            let d = new Date(djsData.startDate);
            if (isNaN(d)) d = new Date();
            
            // 解决时区偏移问题
            const tzOffset = d.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(d - tzOffset)).toISOString().slice(0, 16);
            
            document.getElementById('startDateInput').value = localISOTime;
            openModal('startModal', 'startModalContent');
        }

        async function saveStartDate() {
            const newDateStr = document.getElementById('startDateInput').value;
            if(!newDateStr) return;
            
            // 确保如果用户输入的只有分，保存时可以被正确解析
            // datetime-local 返回的值形如 "2023-05-20T13:14"
            djsData.startDate = newDateStr + (newDateStr.length === 16 ? ":00" : "");
            
            lastValues = { days: -1, hours: -1, mins: -1, secs: -1 };
            startTimer(); 
            
            await syncData("Update start date precision");
            closeModal('startModal', 'startModalContent');
        }

        async function syncData(message) {
            showToast("⏳", "正在保存记忆...");
            const res = await updateFile(DJS_FILE, {
                startDate: djsData.startDate,
                countdowns: djsData.countdowns
            }, djsData.sha, message);

            if(res.success) {
                djsData.sha = res.sha;
                renderCountdowns();
                checkCelebrations();
                showToast("✨", "保存成功！");
            } else {
                showToast("❌", "保存失败，请稍后再试");
            }
        }

        function checkCelebrations() {
            if (hasCelebratedToday) return;

            const now = new Date();
            now.setHours(0,0,0,0);

            const todaysEvents = djsData.countdowns.filter(item => {
                const target = new Date(item.date);
                target.setHours(0,0,0,0);
                return target.getTime() === now.getTime();
            });

            if (todaysEvents.length > 0) {
                const evt = todaysEvents[0];
                document.getElementById('celebIcon').innerText = evt.icon;
                document.getElementById('celebTitle').innerText = evt.title;
                openModal('celebrateModal', 'celebrateModalContent');
                startConfetti();
                hasCelebratedToday = true;
            }
        }

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.classList.remove('hidden');
            canvas.innerHTML = '';
            
            const emojisArray = ['🌸', '✨', '💖', '🎉', '🎊', '🎀', '⭐', '🎈'];
            
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.innerText = emojisArray[Math.floor(Math.random() * emojisArray.length)];
                    
                    const left = Math.random() * 100; 
                    const size = Math.random() * 25 + 15; 
                    const duration = Math.random() * 3 + 2.5; 
                    const delay = Math.random() * 0.5;
                    
                    particle.style.left = left + 'vw';
                    particle.style.top = '-10vh';
                    particle.style.fontSize = size + 'px';
                    particle.style.animationDuration = duration + 's';
                    particle.style.animationDelay = delay + 's';
                    particle.style.transformOrigin = 'center';
                    
                    canvas.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), (duration + delay) * 1000);
                }, i * 50); 
            }
            setTimeout(stopConfetti, 8000);
        }

        function stopConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            setTimeout(() => {
                canvas.classList.add('hidden');
                canvas.innerHTML = '';
            }, 1000); 
        }

        function closeCelebModal() {
            closeModal('celebrateModal', 'celebrateModalContent');
            setTimeout(stopConfetti, 4000);
        }

        function openModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            
            void modal.offsetWidth;

            modal.classList.remove('opacity-0');
            
            if(window.innerWidth < 640 && contentId === 'eventModalContent') {
                content.classList.remove('translate-y-full');
                content.classList.add('translate-y-0');
            } else {
                content.classList.remove('scale-50', 'scale-95');
                content.classList.add('scale-100');
            }
        }

        function closeModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            
            modal.classList.add('opacity-0');
            
            if(window.innerWidth < 640 && contentId === 'eventModalContent') {
                content.classList.remove('translate-y-0');
                content.classList.add('translate-y-full');
            } else {
                content.classList.remove('scale-100');
                if (contentId === 'celebrateModalContent') {
                    content.classList.add('scale-50');
                } else {
                    content.classList.add('scale-95');
                }
            }
            
            setTimeout(() => { 
                modal.classList.add('hidden'); 
            }, 300); 
        }

        function showToast(icon, msg) { 
            const toast = document.getElementById('toast'); 
            document.getElementById('toastIcon').innerText = icon;
            document.getElementById('toastMsg').innerText = msg;
            
            toast.classList.remove('toast-animate', 'hidden'); 
            void toast.offsetWidth; 
            
            toast.classList.add('toast-animate'); 
            
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3500); 
        }
    </script>
</body>
</html>
