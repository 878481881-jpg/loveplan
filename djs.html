<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时光纪念碑 ⏳</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入农历/公历转换库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            /* 统一 index.html 的背景风格 */
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden; 
            min-height: 100vh;
            color: #475569;
        }
        
        .font-num { 
            font-family: 'Nunito', 'SF Pro Display', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-8px); } 
            100% { transform: translateY(0px); } 
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 30px); } 
            15% { opacity: 1; transform: translate(-50%, 0); } 
            85% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3.5s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pop { 0% { transform: scale(0.7); opacity: 0;} 50% { transform: scale(1.15); opacity: 1;} 100% { transform: scale(1); opacity: 1;} }
        .animate-pop { animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .num-container {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            height: 1.1em;
            line-height: 1.1em;
            vertical-align: bottom;
        }
        .num-scroller {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .num-scroller.no-transition {
            transition: none !important;
        }
        .num-item {
            height: 1.1em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            animation: fall linear forwards;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateY(5vh) rotate(45deg) scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.8); opacity: 0; }
        }
        
        input[type="datetime-local"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover,
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start py-6 px-4 pb-28 relative">
    
    <!-- 飘落特效层 -->
    <div id="confetti-canvas" class="hidden"></div>

    <header class="text-center mb-5 max-w-md w-full flex justify-between items-center px-2 z-10 relative">
        <a href="index.html" class="w-10 h-10 bg-white text-rose-500 rounded-full shadow-sm flex items-center justify-center border border-rose-100 hover:shadow-md active:scale-95 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div class="animate-float">
            <h1 class="text-xl font-black text-rose-500 flex items-center justify-center gap-2 tracking-widest">
                <span class="text-2xl">✨</span> 时光纪念碑
            </h1>
        </div>
        <button onclick="refreshData()" class="p-2.5 bg-white text-rose-400 rounded-full shadow-sm border border-rose-100 hover:shadow-md transition-all group">
            <svg class="w-5 h-5 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </header>

    <!-- 选项卡切换 -->
    <div class="flex bg-white/80 backdrop-blur-md rounded-full p-1 border-2 border-rose-50 shadow-sm mb-6 w-full max-w-[16rem] mx-auto z-10 relative">
        <button id="btnTabAnniv" onclick="switchTab('anniv')" class="flex-1 py-2 rounded-full bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold shadow-md transition-all text-sm tracking-widest">纪念碑</button>
        <button id="btnTabArgue" onclick="switchTab('argue')" class="flex-1 py-2 rounded-full text-rose-400 font-bold hover:bg-rose-50 transition-all text-sm tracking-widest">吵架簿</button>
    </div>

    <main class="w-full max-w-md flex flex-col items-center relative z-10">
        
        <!-- 加载状态 -->
        <div id="loadingView" class="w-full flex flex-col items-center py-24 animate-fade-in">
            <div class="text-6xl animate-bounce mb-6 drop-shadow-sm">🌸</div>
            <p class="text-rose-400 font-bold tracking-widest text-lg">读取恋爱宇宙中...</p>
        </div>

        <div id="contentView" class="w-full hidden">
            
            <!-- ===================== 选项卡 1: 纪念碑 ===================== -->
            <div id="tab-anniv" class="w-full animate-fade-in">
                <!-- 正数日：纪念碑核心 (实心卡片风格) -->
                <div class="w-full bg-white rounded-[2.5rem] p-8 text-rose-500 mb-8 relative overflow-hidden group border-2 border-rose-100 shadow-[0_8px_30px_rgb(225,29,72,0.08)]">
                    <div class="absolute -right-8 -top-8 text-9xl opacity-[0.05] transform rotate-12 transition-transform group-hover:rotate-45 group-hover:scale-110 duration-700 ease-out pointer-events-none">💖</div>
                    <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-pink-100/40 rounded-full blur-3xl pointer-events-none"></div>
                    
                    <div class="relative z-10 text-center">
                        <div class="flex items-center justify-center gap-3 mb-6">
                            <div class="h-[2px] w-8 bg-gradient-to-r from-transparent to-rose-200 rounded-full"></div>
                            <p class="text-sm text-rose-400 font-black tracking-widest">我们的相爱时光</p>
                            <button onclick="promptEditStartDate()" class="text-rose-300 hover:text-rose-500 transition-all bg-rose-50 hover:bg-rose-100 rounded-full p-1.5 shadow-sm border border-rose-100">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <div class="h-[2px] w-8 bg-gradient-to-l from-transparent to-rose-200 rounded-full"></div>
                        </div>
                        
                        <div class="flex justify-center items-end gap-1.5 mb-8">
                            <div class="text-[5.5rem] leading-[1] font-black font-num tracking-tighter drop-shadow-sm text-rose-500 num-container h-[1em]" id="days-container">
                                <div class="num-scroller" id="days-scroller"><div class="num-item">0</div></div>
                            </div>
                            <span class="text-2xl font-black mb-3 text-rose-400">天</span>
                        </div>

                        <div class="grid grid-cols-3 gap-3 bg-rose-50/50 border border-rose-100 rounded-2xl p-4 shadow-sm">
                            <div class="flex flex-col items-center">
                                <div class="text-3xl font-black font-num num-container text-rose-500" id="hours-container">
                                    <div class="num-scroller" id="hours-scroller"><div class="num-item">00</div></div>
                                </div>
                                <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Hours</span>
                            </div>
                            <div class="flex flex-col items-center border-x border-rose-200/50">
                                <div class="text-3xl font-black font-num num-container text-rose-500" id="mins-container">
                                    <div class="num-scroller" id="mins-scroller"><div class="num-item">00</div></div>
                                </div>
                                <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Mins</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="text-3xl font-black font-num num-container text-rose-500" id="secs-container">
                                    <div class="num-scroller" id="secs-scroller"><div class="num-item">00</div></div>
                                </div>
                                <span class="text-[10px] text-rose-300 mt-1.5 font-black uppercase tracking-widest">Secs</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 倒数日：未来节点 -->
                <div class="w-full px-1">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-black text-rose-500 flex items-center gap-2">
                            <span class="text-xl">✨</span> 期待的日子
                        </h2>
                        <div class="text-xs text-rose-300 font-bold bg-white px-3 py-1 rounded-full shadow-sm border border-rose-100">左滑可删除</div>
                    </div>
                    <div class="space-y-4" id="countdownList">
                        <!-- JS 动态渲染 -->
                    </div>
                </div>
            </div>

            <!-- ===================== 选项卡 2: 吵架簿 ===================== -->
            <div id="tab-argue" class="w-full hidden animate-fade-in px-1">
                <!-- 和平共处卡片 -->
                <div class="w-full bg-white rounded-[2.5rem] p-8 border-2 border-rose-100 shadow-[0_8px_30px_rgb(225,29,72,0.08)] mb-8 relative overflow-hidden group text-center">
                    <div class="absolute -right-8 -top-8 text-9xl opacity-[0.05] transform rotate-12 pointer-events-none">🕊️</div>
                    <p class="text-sm text-rose-400 font-black tracking-widest mb-4">我们已经和平共处了</p>
                    <div class="flex justify-center items-end gap-1.5 mb-4 text-rose-500">
                        <span class="text-[5rem] leading-[1] font-black font-num tracking-tighter drop-shadow-sm" id="peaceDays">0</span>
                        <span class="text-2xl font-black mb-3">天</span>
                    </div>
                    <p class="text-xs text-gray-400 font-bold bg-gray-50 inline-block px-3 py-1 rounded-full border border-gray-100" id="peaceDateText">读取中...</p>
                </div>

                <!-- 吵架列表区 -->
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-black text-rose-500 flex items-center gap-2">
                        <span class="text-xl">💢</span> 吵架记录簿
                    </h2>
                    <div class="text-xs text-rose-300 font-bold bg-white px-3 py-1 rounded-full shadow-sm border border-rose-100">左滑可删除</div>
                </div>
                <div class="space-y-4" id="argumentList">
                    <!-- JS 动态渲染 -->
                </div>
            </div>

        </div>
    </main>

    <!-- 浮动添加按钮 (支持状态切换) -->
    <button onclick="handleFabClick()" class="fixed bottom-8 right-6 w-16 h-16 bg-gradient-to-r from-rose-400 to-pink-500 rounded-full shadow-[0_10px_30px_rgba(255,175,195,0.6)] border-2 border-white flex items-center justify-center text-white transform hover:scale-110 hover:-translate-y-1 active:scale-95 transition-all duration-300 z-40 hidden group" id="fabBtn">
        <svg class="w-8 h-8 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- 弹窗提示 -->
    <div id="toast" class="fixed bottom-32 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur-md text-white px-6 py-3.5 rounded-full shadow-xl border border-gray-700 text-sm font-black hidden z-[80] whitespace-nowrap flex items-center gap-2">
        <span id="toastIcon">✨</span>
        <span id="toastMsg">提示内容</span>
    </div>

    <!-- ===================== 倒数日添加弹窗 ===================== -->
    <div id="eventModal" class="fixed inset-0 bg-rose-900/30 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-xl w-full sm:max-w-sm rounded-t-[2.5rem] sm:rounded-[2.5rem] border-t-4 sm:border-4 border-rose-100 shadow-2xl p-7 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 relative" id="eventModalContent">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            <button onclick="closeModal('eventModal', 'eventModalContent')" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-400 rounded-full hover:bg-rose-50 hover:text-rose-500 transition-colors hidden sm:flex font-bold">✕</button>
            
            <h3 class="font-black text-rose-500 text-xl mb-6 text-center flex items-center justify-center gap-2 tracking-widest">
                <span class="text-2xl animate-pop" style="animation-delay: 0.1s">✨</span> 记录期待
            </h3>
            
            <div class="space-y-5 mb-8">
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">EVENT NAME</label>
                    <input type="text" id="eventName" placeholder="例如：某人的生日、一周年" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">TARGET DATE</label>
                    <input type="date" id="eventDate" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1 tracking-wider">CHOOSE ICON</label>
                    <div class="grid grid-cols-6 gap-2 bg-rose-50/50 border border-rose-100 p-2.5 rounded-2xl" id="iconSelector"></div>
                    <input type="hidden" id="eventIcon" value="🎉">
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="closeModal('eventModal', 'eventModalContent')" class="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-2xl font-black shadow-sm hover:bg-gray-200 active:scale-95 transition-all sm:hidden">取消</button>
                <button onclick="saveEvent()" class="flex-1 py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl font-black shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all">保存节点</button>
            </div>
        </div>
    </div>

    <!-- ===================== 吵架记录添加弹窗 ===================== -->
    <div id="argueModal" class="fixed inset-0 bg-rose-900/30 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-end sm:justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-xl w-full sm:max-w-sm rounded-t-[2.5rem] sm:rounded-[2.5rem] border-t-4 sm:border-4 border-rose-100 shadow-2xl p-7 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 relative" id="argueModalContent">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            <button onclick="closeModal('argueModal', 'argueModalContent')" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-400 rounded-full hover:bg-rose-50 hover:text-rose-500 transition-colors hidden sm:flex font-bold">✕</button>
            
            <h3 class="font-black text-rose-500 text-xl mb-6 text-center flex items-center justify-center gap-2 tracking-widest">
                <span class="text-2xl animate-pop" style="animation-delay: 0.1s">💢</span> 记录摩擦
            </h3>
            
            <div class="space-y-5 mb-8">
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1">起因 (WHY)</label>
                    <input type="text" id="argueReason" placeholder="例如：晚上没理我 / 打游戏不回消息" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1">日期 (WHEN)</label>
                    <input type="date" id="argueDate" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-black text-rose-300 mb-1.5 ml-1">解决 (WHO)</label>
                    <select id="argueApology" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all">
                        <option value="自然和好">自然和好 🕊️</option>
                        <option value="哼哼先低头">哼哼先低头 👦🏻</option>
                        <option value="亲亲先低头">亲亲先低头 👧🏻</option>
                    </select>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="closeModal('argueModal', 'argueModalContent')" class="flex-1 py-3.5 bg-gray-100 text-gray-500 rounded-2xl font-black shadow-sm hover:bg-gray-200 active:scale-95 transition-all sm:hidden">取消</button>
                <button onclick="saveArgument()" class="flex-1 py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl font-black shadow-lg hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all">保存记录</button>
            </div>
        </div>
    </div>

    <!-- 起始日弹窗 -->
    <div id="startModal" class="fixed inset-0 bg-rose-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white/95 backdrop-blur-xl border-4 border-rose-100 shadow-2xl rounded-[2.5rem] w-full max-w-sm p-8 transform scale-95 transition-transform duration-300 text-center relative" id="startModalContent">
            <button onclick="closeModal('startModal', 'startModalContent')" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-400 rounded-full hover:bg-rose-50 hover:text-rose-500 font-bold transition-colors">✕</button>

            <div class="text-5xl mb-4 animate-float mt-2">💖</div>
            <h3 class="font-black text-rose-500 text-xl mb-2 text-center tracking-wider">修改相爱起始日</h3>
            <p class="text-xs text-rose-300 mb-6 text-center font-bold">时光的起点，精确到那一秒</p>
            
            <input type="datetime-local" id="startDateInput" step="1" class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl px-4 py-3.5 text-sm font-black text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-300 mb-8 text-center tracking-wide">
            
            <button onclick="saveStartDate()" class="w-full py-4 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl font-black shadow-lg hover:shadow-xl active:scale-95 transition-all">确认修改</button>
        </div>
    </div>

    <!-- 庆祝特效弹窗 -->
    <div id="celebrateModal" class="fixed inset-0 bg-white/60 backdrop-blur-md z-[70] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-500">
        <div class="bg-white/95 backdrop-blur-xl border-4 border-rose-100 shadow-2xl rounded-[3rem] w-full max-w-sm p-10 transform scale-50 transition-transform duration-500 text-center relative overflow-hidden" id="celebrateModalContent">
            <button onclick="closeCelebModal()" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center bg-gray-50 text-gray-400 rounded-full hover:bg-rose-50 hover:text-rose-500 font-bold transition-colors z-20">✕</button>
            <div class="absolute inset-0 bg-pink-50/30 z-0"></div>
            <div class="text-7xl mb-6 animate-pop drop-shadow-sm relative z-10" id="celebIcon" style="animation-delay: 0.2s">🎉</div>
            <h2 class="font-black text-3xl text-rose-500 mb-3 animate-fade-in relative z-10" id="celebTitle">纪念日快乐！</h2>
            <p class="text-sm text-rose-400 mb-10 font-bold leading-relaxed animate-fade-in relative z-10" style="animation-delay: 0.2s">期待已久的这一天终于到来啦！<br>愿这一天充满无限惊喜。</p>
            <button onclick="closeCelebModal()" class="w-full py-4 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl font-black text-lg shadow-lg hover:shadow-xl hover:-translate-y-1 active:scale-95 transition-all duration-300 relative z-10 animate-fade-in" style="animation-delay: 0.4s">
                一起庆祝吧！
            </button>
        </div>
    </div>

    <script>
        // ----------------- 原生移动端左滑删除逻辑 -----------------
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            const front = e.target.closest('.swipe-front');
            document.querySelectorAll('.swipe-front').forEach(el => {

            if (!front || touchStartX === 0) return;
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;
            if (Math.abs(deltaY) > Math.abs(deltaX)) return;
            if (deltaX < 0 && deltaX >= -80) {
                front.style.transform = `translateX(${deltaX}px)`;
            }
        }, { passive: true });

            const front = e.target.closest('.swipe-front');

            front.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            if (deltaX < -35) front.style.transform = 'translateX(-70px)';

        // ================= 数据存取 =================
        async function fetchFile(filePath) {
            if(!GITHUB_TOKEN) return fetchLocal(); 
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null, isNew: true };
                if (!response.ok) throw new Error('Network response not ok');
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                return fetchLocal();
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            if(!GITHUB_TOKEN) return updateLocal(contentObj);
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                updateLocal(contentObj);
                return { success: true, sha: res.content.sha };
            } catch (error) {
                return updateLocal(contentObj);
            }
        }

        function fetchLocal() {
            return new Promise(resolve => {

                setTimeout(() => {
                    if(localData) {
                        let parsed = JSON.parse(localData);
                        if(!parsed.arguments) parsed.arguments = [];
                        resolve({ data: parsed, sha: 'local_sha_' + Date.now() });
                    } else {
                        resolve({ 
                            data: { startDate: "2023-05-20T13:14:00", countdowns: [], arguments: [] }, 
                            sha: 'local_sha_init' 
                        });
                    }
                }, 400); 
            });
        }
        function updateLocal(data) {
            return new Promise(resolve => {
                localStorage.setItem('djs_app_data', JSON.stringify(data));
                resolve({ success: true, sha: 'local_sha_new_' + Date.now() });
            });
        }

        function updateTimerUI() {
            const start = new Date(djsData.startDate);
            const now = new Date();
            const diff = now - start;
            if (diff < 0) {
                updateRollingNumber('days', 0); updateRollingNumber('hours', 0, true);
                updateRollingNumber('mins', 0, true); updateRollingNumber('secs', 0, true);
                return;
            }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            if(d !== lastValues.days) { updateRollingNumber('days', d); lastValues.days = d; }
            if(h !== lastValues.hours) { updateRollingNumber('hours', h, true); lastValues.hours = h; }
            if(m !== lastValues.mins) { updateRollingNumber('mins', m, true); lastValues.mins = m; }
            if(s !== lastValues.secs) { updateRollingNumber('secs', s, true); lastValues.secs = s; }
        }

        function updateRollingNumber(idPrefix, newValue, padZero = false) {
            const displayValue = padZero ? String(newValue).padStart(2, '0') : String(newValue);
            const scroller = document.getElementById(`${idPrefix}-scroller`);
            if(!scroller) return;
            const currentEl = scroller.lastElementChild;
            if (currentEl && currentEl.innerText === displayValue) return;

            const newEl = document.createElement('div');
            newEl.className = 'num-item'; newEl.innerText = displayValue;
            scroller.appendChild(newEl);
            if(scroller.children.length === 1) return;

            requestAnimationFrame(() => { scroller.style.transform = `translateY(-${(scroller.children.length - 1) * 100}%)`; });
            setTimeout(() => {
                if (scroller.children.length > 1) {
                    scroller.classList.add('no-transition'); 
                    while (scroller.children.length > 1) scroller.removeChild(scroller.firstChild);
                    scroller.style.transform = `translateY(0)`; 
                    void scroller.offsetWidth; 
                    scroller.classList.remove('no-transition'); 
                }
            }, 600); 
        }

        function renderCountdowns() {

                if (d.getTime() < now.getTime()) d.setFullYear(currentYear + 1);
                return d;
            };

            const getNextLunarDate = (lMonth, lDay) => {
                if (typeof Lunar === 'undefined') return new Date(); 
                let lDate = Lunar.fromYmd(currentYear, lMonth, lDay);
                let sDate = lDate.getSolar();
                let d = new Date(sDate.getYear(), sDate.getMonth() - 1, sDate.getDay());
                if (d.getTime() < now.getTime()) {
                    lDate = Lunar.fromYmd(currentYear + 1, lMonth, lDay);
                    sDate = lDate.getSolar();
                    d = new Date(sDate.getYear(), sDate.getMonth() - 1, sDate.getDay());

                return d;

        async function deleteEvent(id) {
            djsData.countdowns = djsData.countdowns.filter(item => item.id !== id);
            await syncData("Delete countdown");
        }

        function promptEditStartDate() {
            let d = new Date(djsData.startDate); if (isNaN(d)) d = new Date();
            const tzOffset = d.getTimezoneOffset() * 60000;
            document.getElementById('startDateInput').value = (new Date(d - tzOffset)).toISOString().slice(0, 16);
            openModal('startModal', 'startModalContent');
        }

        async function saveStartDate() {
            const newDateStr = document.getElementById('startDateInput').value;
            if(!newDateStr) return;
            djsData.startDate = newDateStr + (newDateStr.length === 16 ? ":00" : "");
            lastValues = { days: -1, hours: -1, mins: -1, secs: -1 };
            startTimer(); 
            await syncData("Update start date");
            closeModal('startModal', 'startModalContent');
        }

        async function syncData(message) {
            showToast("⏳", "正在保存记忆...");
            const res = await updateFile(DJS_FILE, {
                startDate: djsData.startDate,
                countdowns: djsData.countdowns,
                arguments: djsData.arguments // 同步吵架记录
            }, djsData.sha, message);

            if(res.success) {
                djsData.sha = res.sha;
                renderCountdowns();
                renderArguments();
                checkCelebrations();
                showToast("✨", "保存成功！");
            } else {
                showToast("❌", "保存失败，请稍后再试");
            }
        }

        function checkCelebrations() {
            if (hasCelebratedToday) return;
            const now = new Date(); now.setHours(0,0,0,0);
            const todaysEvents = djsData.countdowns.filter(item => {
                const target = new Date(item.date); target.setHours(0,0,0,0);
                return target.getTime() === now.getTime();
            });
            if (todaysEvents.length > 0) {
                const evt = todaysEvents[0];
                document.getElementById('celebIcon').innerText = evt.icon;
                document.getElementById('celebTitle').innerText = evt.title;
                openModal('celebrateModal', 'celebrateModalContent');
                startConfetti(); hasCelebratedToday = true;
            }
        }

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.classList.remove('hidden'); canvas.innerHTML = '';
            const emojisArray = ['🌸', '✨', '💖', '🎉', '🎊', '🎀', '⭐', '🎈'];
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.innerText = emojisArray[Math.floor(Math.random() * emojisArray.length)];
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.top = '-10vh';
                    particle.style.fontSize = Math.random() * 25 + 15 + 'px';
                    const duration = Math.random() * 3 + 2.5, delay = Math.random() * 0.5;
                    particle.style.animationDuration = duration + 's';
                    particle.style.animationDelay = delay + 's';
                    canvas.appendChild(particle);
                    setTimeout(() => particle.remove(), (duration + delay) * 1000);
                }, i * 50); 
            }
            setTimeout(stopConfetti, 8000);
        }

        function stopConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            setTimeout(() => { canvas.classList.add('hidden'); canvas.innerHTML = ''; }, 1000); 
        }

        function closeCelebModal() { closeModal('celebrateModal', 'celebrateModalContent'); setTimeout(stopConfetti, 4000); }

        function openModal(bgId, contentId) {
            const modal = document.getElementById(bgId), content = document.getElementById(contentId);
            modal.classList.remove('hidden'); void modal.offsetWidth; modal.classList.remove('opacity-0');
            if(window.innerWidth < 640 && contentId.includes('ModalContent') && !contentId.includes('start') && !contentId.includes('celeb')) {
                content.classList.remove('translate-y-full'); content.classList.add('translate-y-0');
            } else {
                content.classList.remove('scale-50', 'scale-95'); content.classList.add('scale-100');
            }
        }

        function closeModal(bgId, contentId) {
            const modal = document.getElementById(bgId), content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            if(window.innerWidth < 640 && contentId.includes('ModalContent') && !contentId.includes('start') && !contentId.includes('celeb')) {
                content.classList.remove('translate-y-0'); content.classList.add('translate-y-full');
            } else {
                content.classList.remove('scale-100');
                if (contentId === 'celebrateModalContent') content.classList.add('scale-50');
                else content.classList.add('scale-95');
            }
            setTimeout(() => modal.classList.add('hidden'), 300); 
        }

        function showToast(icon, msg) { 
            const toast = document.getElementById('toast'); 
            document.getElementById('toastIcon').innerText = icon; document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('toast-animate', 'hidden'); void toast.offsetWidth; 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3500); 
        }
    </script>
</body>
</html>
