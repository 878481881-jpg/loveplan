<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>笨鸟先飞 🐥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-pink: #f43f5e;
            --brand-pink-light: #fda4af;
            --bg-pink: #fff1f2;
        }

        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: var(--bg-pink); 
            background-image: radial-gradient(#fecdd3 1px, transparent 1px); 
            background-size: 24px 24px; 
            overflow-x: hidden;
            color: #333;
            /* 阻止移动端下拉刷新和橡皮筋效果 */
            overscroll-behavior-y: contain;
        }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 20px); } 
            10% { opacity: 1; transform: translate(-50%, 0); } 
            90% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes pop { 
            0% { transform: scale(0.8); opacity: 0;} 
            50% { transform: scale(1.1); opacity: 1;} 
            100% { transform: scale(1); opacity: 1;} 
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 3/4;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px -5px rgba(244, 63, 94, 0.2), 
                        0 0 0 6px white, 
                        0 0 0 10px var(--brand-pink-light);
            background: #87CEEB; /* 天空蓝 */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* 阻止画布上的默认手势 */
        }

        .points-card {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px -6px rgba(244, 63, 94, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        /* 游戏内 UI 覆盖层 */
        .game-ui-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* 让点击穿透到 canvas */
            z-index: 10;
        }

        .game-btn {
            pointer-events: auto; /* 按钮恢复可点击 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 pb-24">

    <!-- Header Area -->
    <header class="w-full max-w-md flex justify-between items-center mb-6 relative">
        <a href="index.html" class="w-10 h-10 bg-white text-rose-500 rounded-full shadow-sm flex items-center justify-center border border-rose-50 active:scale-95 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-black text-rose-500 flex items-center gap-2 absolute left-1/2 transform -translate-x-1/2">
            🐥 笨鸟先飞
        </h1>
        <div class="w-10 h-10"></div>
    </header>
    
    <!-- 导航栏 -->
    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="wheel.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">幸运转盘</a>
        <a href="moqi.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-100 transition-all text-sm whitespace-nowrap">默契考验</a>
        <a href="#" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">笨鸟先飞</a>
        <a href="eyes.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">眼疾手快</a>
    </div>

    <main class="w-full max-w-md flex flex-col items-center relative gap-6">
        
        <!-- Stats Card (Points & High Score) -->
        <div class="points-card w-full p-5 text-white flex justify-between items-center">
            <div class="relative z-10 flex flex-col gap-2">
                <div class="flex items-center gap-1.5 opacity-90">
                    <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full backdrop-blur-sm" id="identityText">-</span>
                    <span class="text-sm font-medium">的积分</span>
                </div>
                <div class="flex items-baseline gap-1">
                    <span class="text-4xl font-black tracking-tight drop-shadow-sm" id="myPoints">--</span>
                </div>
            </div>
            
            <div class="relative z-10 flex flex-col items-end gap-2 text-right">
                <div class="text-sm font-medium opacity-90">🏆 历史最高分</div>
                <div class="text-3xl font-black text-yellow-300 drop-shadow-md" id="highScoreDisplay">--</div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="w-full flex justify-between items-end px-2">
            <div class="text-xs text-gray-500 flex flex-col gap-1 font-medium">
                <span class="flex items-center gap-1">✨ 每次游玩消耗 <b class="text-rose-500">1</b> 积分</span>
                <span class="flex items-center gap-1">👆 点击画面让小鸟跳跃</span>
            </div>
            <button onclick="openRewardsModal()" class="bg-gradient-to-r from-amber-400 to-orange-400 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md shadow-amber-200 flex items-center gap-1.5 active:scale-95 transition-transform animate-float">
                <span>🎁</span>成就奖励
            </button>
        </div>

        <div class="game-container" id="gameBox">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Game Over / Start Overlay -->
            <div class="game-ui-overlay" id="startScreen">
                <button onclick="requestStartGame()" class="game-btn bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-lg font-black py-3 px-8 rounded-full shadow-xl border-4 border-white transition-transform animate-pop" id="startBtn">
                    开始游戏 (-1分)
                </button>
            </div>

            <!-- In-game score -->
            <div class="absolute top-4 left-0 w-full text-center z-10 pointer-events-none hidden" id="ingameScoreBox">
                <span class="text-5xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]" id="currentScore">0</span>
            </div>

            <!-- Loading overlay during API calls -->
            <div id="gameLoadingOverlay" class="loading-overlay hidden">
                <div class="flex flex-col items-center gap-3">
                    <svg class="animate-spin h-10 w-10 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm font-bold text-gray-700" id="loadingText">扣除积分中...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Rewards Modal -->
    <div id="rewardsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-50 transition-transform flex flex-col max-h-[80vh]" id="rewardsModalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                    🏆 历史得分奖励
                </h3>
                <button onclick="closeRewardsModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto no-scrollbar flex-1 -mx-2 px-2" id="rewardsList">
                <!-- Dynamic List -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full shadow-lg text-sm font-medium hidden z-[70] whitespace-nowrap"></div>

    <script>
        // --- Config & Auth ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html';
        }

        document.getElementById('identityText').innerText = myIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        // 积分文件
        const MY_POINTS_FILE = `data/${myIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        // 游戏记录文件 (hfly.json 或 qfly.json)
        const MY_FLY_FILE = `data/${myIdentity === '哼哼' ? 'hfly' : 'qfly'}.json`;

        let myData = { points: 0, inventory: {}, pendingUses: [], sha: null };
        let gameData = { bestScore: 0, playCount: 0, claimedRewards: [], sha: null };

        // 奖励档位配置
        const REWARD_TIERS = [
            { score: 5, points: 2 },
            { score: 10, points: 5 },
            { score: 50, points: 10 },
            { score: 100, points: 15 },
            { score: 200, points: 20 },
            { score: 300, points: 30 },
            { score: 500, points: 50 },
            { score: 800, points: 70 },
            { score: 1000, points: 100 }
        ];

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        // --- GitHub API Helpers ---
        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null };
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                console.error("Fetch error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update error:", error);
                return { success: false };
            }
        }

        // --- Data Loading ---
        async function refreshData() {
            document.getElementById('myPoints').innerText = '...';
            document.getElementById('highScoreDisplay').innerText = '...';

            const [pointsRes, flyRes] = await Promise.all([
                fetchFile(MY_POINTS_FILE),
                fetchFile(MY_FLY_FILE)
            ]);

            if (pointsRes.data && !pointsRes.error) {
                myData = { ...myData, ...pointsRes.data, sha: pointsRes.sha };
                if(typeof myData.points !== 'number') myData.points = 0;
            }

            if (flyRes.data && !flyRes.error) {
                gameData = { ...gameData, ...flyRes.data, sha: flyRes.sha };
                if(typeof gameData.bestScore !== 'number') gameData.bestScore = 0;
                if(!Array.isArray(gameData.claimedRewards)) gameData.claimedRewards = [];
            } else if (flyRes.data === null) {
                // 文件不存在，初始化
                gameData = { bestScore: 0, playCount: 0, claimedRewards: [], sha: null };
            }

            document.getElementById('myPoints').innerText = myData.points;
            document.getElementById('highScoreDisplay').innerText = gameData.bestScore;
        }

        // --- Game Logic ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let frames = 0;
        let animationId;
        
        // 游戏状态: 'START', 'PLAYING', 'GAMEOVER'
        let gameState = 'START'; 
        let score = 0;

        // 逻辑分辨率，保证不同设备速度一致
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 480;

        // 小鸟属性
        const bird = {
            x: 50,
            y: 150,
            width: 34,
            height: 24,
            velocity: 0,
            gravity: 0.25,
            jumpStrength: -5.5,
            rotation: 0,
            draw: function() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                
                // 根据速度旋转小鸟
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                ctx.rotate(this.rotation);
                
                ctx.font = "32px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🐥", 0, 0); // 使用 emoji 作为小鸟
                
                ctx.restore();
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                
                // 触底检测
                if (this.y + this.height >= GAME_HEIGHT - ground.height) {
                    this.y = GAME_HEIGHT - ground.height - this.height;
                    this.velocity = 0;
                    triggerGameOver();
                }
                // 触顶检测
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            jump: function() {
                this.velocity = this.jumpStrength;
            }
        };

        // 管道
        const pipes = {
            items: [],
            width: 50,
            gap: 120, // 上下管道间距
            dx: 2.5,  // 移动速度
            draw: function() {
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    
                    // 渐变管身颜色
                    let grad = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
                    grad.addColorStop(0, '#4ade80'); // 绿色
                    grad.addColorStop(1, '#22c55e');
                    
                    ctx.fillStyle = grad;
                    
                    // 上管道
                    ctx.fillRect(p.x, 0, this.width, p.top);
                    // 上管道帽
                    ctx.fillRect(p.x - 2, p.top - 20, this.width + 4, 20);
                    
                    // 下管道
                    ctx.fillRect(p.x, p.bottom, this.width, GAME_HEIGHT - p.bottom - ground.height);
                    // 下管道帽
                    ctx.fillRect(p.x - 2, p.bottom, this.width + 4, 20);
                    
                    // 管道边框
                    ctx.strokeStyle = '#166534';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, 0, this.width, p.top);
                    ctx.strokeRect(p.x, p.bottom, this.width, GAME_HEIGHT - p.bottom - ground.height);
                }
            },
            update: function() {
                // 每 100 帧生成一个新管道
                if (frames % 100 === 0) {
                    // 随机上管道高度，保证下管道在可视范围内
                    let minHeight = 50;
                    let maxHeight = GAME_HEIGHT - ground.height - this.gap - minHeight;
                    let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                    
                    this.items.push({
                        x: GAME_WIDTH,
                        top: topHeight,
                        bottom: topHeight + this.gap,
                        passed: false
                    });
                }
                
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    p.x -= this.dx;
                    
                    // 碰撞检测
                    // 鸟的 hitbox 略小于实际绘制，手感更好
                    let birdHitX = bird.x + 8;
                    let birdHitY = bird.y + 8;
                    let birdHitW = bird.width - 16;
                    let birdHitH = bird.height - 16;

                    if (birdHitX + birdHitW > p.x && birdHitX < p.x + this.width) {
                        // 在管道 X 范围内，检查 Y 轴
                        if (birdHitY < p.top || birdHitY + birdHitH > p.bottom) {
                            triggerGameOver();
                        }
                    }
                    
                    // 计分
                    if (p.x + this.width < bird.x && !p.passed) {
                        score++;
                        document.getElementById('currentScore').innerText = score;
                        p.passed = true;
                    }
                    
                    // 移除屏幕外的管道
                    if (p.x + this.width < 0) {
                        this.items.shift();
                        i--; // 调整索引
                    }
                }
            },
            reset: function() {
                this.items = [];
            }
        };

        // 地面
        const ground = {
            height: 60,
            x: 0,
            dx: 2.5,
            draw: function() {
                ctx.fillStyle = '#ded895';
                ctx.fillRect(0, GAME_HEIGHT - this.height, GAME_WIDTH, this.height);
                
                // 地面条纹装饰
                ctx.fillStyle = '#c5b85a';
                for(let i = 0; i < GAME_WIDTH / 20 + 2; i++) {
                    ctx.fillRect(this.x + i * 30, GAME_HEIGHT - this.height, 10, this.height);
                }
            },
            update: function() {
                this.x = (this.x - this.dx) % 30; // 循环移动产生条纹动画
            }
        };

        // 背景云朵
        const background = {
            draw: function() {
                ctx.fillStyle = '#87CEEB'; // 每次清除画布顺便画背景
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                // 简单的静态云朵点缀
                ctx.beginPath();
                ctx.arc(60, 100, 20, 0, Math.PI * 2);
                ctx.arc(80, 100, 25, 0, Math.PI * 2);
                ctx.arc(100, 100, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(260, 200, 15, 0, Math.PI * 2);
                ctx.arc(280, 200, 20, 0, Math.PI * 2);
                ctx.arc(300, 200, 15, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        function resizeCanvas() {
            // 设置内部逻辑分辨率
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            // CSS 尺寸已由 .game-container 的宽高比控制，这里只需要初始化画一次即可
            if (gameState === 'START') {
                background.draw();
                ground.draw();
                bird.draw();
            }
        }

        async function requestStartGame() {
            if (myData.points < 1) {
                showToast("🪙 积分不够啦，快去赚点积分再来！");
                return;
            }

            // 扣除积分
            const overlay = document.getElementById('gameLoadingOverlay');
            const loadText = document.getElementById('loadingText');
            loadText.innerText = "扣除积分中...";
            overlay.classList.remove('hidden');
            
            // 先获取最新的积分数据避免冲突
            const freshPointsRes = await fetchFile(MY_POINTS_FILE);
            if (freshPointsRes.error) {
                overlay.classList.add('hidden');
                showToast("网络错误，无法扣除积分");
                return;
            }

            let latestPoints = (freshPointsRes.data?.points || 0);
            if (latestPoints < 1) {
                overlay.classList.add('hidden');
                showToast("积分不够啦！");
                refreshData(); // 同步 UI
                return;
            }

            // 扣 1 分
            const newPoints = latestPoints - 1;
            const updateRes = await updateFile(MY_POINTS_FILE, {
                points: newPoints,
                inventory: freshPointsRes.data?.inventory || myData.inventory,
                pendingUses: freshPointsRes.data?.pendingUses || myData.pendingUses
            }, freshPointsRes.sha, `Played Flappy Bird (-1 point)`);

            overlay.classList.add('hidden');

            if (updateRes.success) {
                // 扣除成功，开始游戏
                myData.points = newPoints;
                myData.sha = updateRes.sha;
                document.getElementById('myPoints').innerText = myData.points;
                
                startGameLoop();
            } else {
                showToast("网络同步失败，请重试");
            }
        }

        function startGameLoop() {
            // 重置状态
            bird.y = 150;
            bird.velocity = 0;
            pipes.reset();
            frames = 0;
            score = 0;
            
            document.getElementById('currentScore').innerText = score;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('ingameScoreBox').classList.remove('hidden');
            
            gameState = 'PLAYING';
            bird.jump(); // 初始跳跃一下
            
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        function loop() {
            if (gameState !== 'PLAYING') return;
            
            background.draw();
            pipes.draw();
            pipes.update();
            ground.draw();
            ground.update();
            bird.draw();
            bird.update();
            
            frames++;
            animationId = requestAnimationFrame(loop);
        }

        async function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('ingameScoreBox').classList.add('hidden');
            
            // 显示结算画面
            const startScreen = document.getElementById('startScreen');
            const startBtn = document.getElementById('startBtn');
            
            let isNewRecord = score > gameData.bestScore;
            
            startScreen.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center animate-pop text-center max-w-[240px]">
                    <h2 class="text-2xl font-black text-rose-500 mb-2">游戏结束</h2>
                    <div class="text-gray-500 text-sm mb-4">本次得分</div>
                    <div class="text-6xl font-black text-gray-800 mb-4">${score}</div>
                    ${isNewRecord && score > 0 ? `<div class="text-xs bg-yellow-100 text-yellow-600 px-3 py-1 rounded-full font-bold mb-4 animate-bounce">🎉 新纪录!</div>` : ''}
                    <button onclick="requestStartGame()" class="game-btn w-full bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold py-3 rounded-xl shadow-md transition-all">
                        再玩一次 (-1分)
                    </button>
                </div>
            `;
            startScreen.classList.remove('hidden');

            // 如果打破记录，同步到云端
            if (isNewRecord && score > 0) {
                const overlay = document.getElementById('gameLoadingOverlay');
                document.getElementById('loadingText').innerText = "上传新纪录中...";
                overlay.classList.remove('hidden');

                // 获取最新的 fly 文件 sha
                const freshFlyRes = await fetchFile(MY_FLY_FILE);
                
                let latestPlayCount = (freshFlyRes.data?.playCount || 0) + 1;
                let latestBest = freshFlyRes.data?.bestScore || 0;
                
                // 再次确认是否真打破了记录 (防止多设备覆盖)
                if (score > latestBest) {
                    const updateFlyRes = await updateFile(MY_FLY_FILE, {
                        bestScore: score,
                        playCount: latestPlayCount
                    }, freshFlyRes.sha, `New high score: ${score}`);
                    
                    if (updateFlyRes.success) {
                        gameData.bestScore = score;
                        gameData.playCount = latestPlayCount;
                        gameData.sha = updateFlyRes.sha;
                        document.getElementById('highScoreDisplay').innerText = score;
                        showToast("🏆 新纪录已保存！");
                    } else {
                        showToast("记录上传失败");
                    }
                }
                overlay.classList.add('hidden');
            } else {
                 // 即使没破纪录，静默更新下游戏次数 (可选，为了节省请求这里暂时不更新次数，仅破纪录更新)
            }
        }

        // 输入处理
        function handleInput(e) {
            // 防止默认行为，比如双击放大、页面滚动
            if(e.type === 'touchstart') e.preventDefault(); 
            
            if (gameState === 'PLAYING') {
                bird.jump();
            }
        }

        // 绑定事件到 canvas
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        // 工具函数
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

        // --- Rewards Logic ---
        function openRewardsModal() {
            renderRewards();
            const modal = document.getElementById('rewardsModal');
            const content = document.getElementById('rewardsModalContent');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-50');
                content.classList.add('scale-100');
            });
        }

        function closeRewardsModal() {
            const modal = document.getElementById('rewardsModal');
            const content = document.getElementById('rewardsModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-50');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function renderRewards() {
            const list = document.getElementById('rewardsList');
            let html = '';
            
            REWARD_TIERS.forEach(tier => {
                const isClaimed = gameData.claimedRewards && gameData.claimedRewards.includes(tier.score);
                const canClaim = !isClaimed && gameData.bestScore >= tier.score;
                
                let btnHtml = '';
                if (isClaimed) {
                    btnHtml = `<button disabled class="text-[11px] font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-400 cursor-not-allowed">已领取</button>`;
                } else if (canClaim) {
                    btnHtml = `<button onclick="claimReward(this, ${tier.score}, ${tier.points})" class="text-[11px] font-bold px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 active:scale-95 text-white shadow-md transition-all">领取</button>`;
                } else {
                    btnHtml = `<div class="text-[11px] font-medium text-gray-400 px-2 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>未解锁</div>`;
                }
                
                html += `
                <div class="flex justify-between items-center bg-gray-50 border border-gray-100 rounded-xl p-3 mb-2 transition-colors ${canClaim ? 'border-amber-200 bg-amber-50/30' : ''}">
                    <div>
                        <div class="font-bold text-gray-700 text-sm">达到 ${tier.score} 分</div>
                        <div class="text-[11px] text-amber-600 font-medium flex items-center gap-1 mt-0.5">🪙 奖励 ${tier.points} 积分</div>
                    </div>
                    <div>
                        ${btnHtml}
                    </div>
                </div>
                `;
            });
            list.innerHTML = html;
        }

        async function claimReward(btn, scoreThreshold, rewardPoints) {
            const originalText = btn.innerText;
            btn.innerText = "领取中...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.disabled = true;

            try {
                // 1. 获取最新飞鸟记录
                const freshFlyRes = await fetchFile(MY_FLY_FILE);
                if (freshFlyRes.error) throw new Error("网络错误");
                
                let latestClaimed = freshFlyRes.data?.claimedRewards || [];
                if (latestClaimed.includes(scoreThreshold)) {
                    gameData.claimedRewards = latestClaimed; // 同步本地
                    renderRewards();
                    throw new Error("该奖励已领取！");
                }
                
                let latestBest = freshFlyRes.data?.bestScore || 0;
                if (latestBest < scoreThreshold) {
                    throw new Error("最高分未达到要求！");
                }

                // 2. 获取最新积分
                const freshPointsRes = await fetchFile(MY_POINTS_FILE);
                if (freshPointsRes.error) throw new Error("获取积分失败");

                let latestPoints = freshPointsRes.data?.points || 0;
                let newPoints = latestPoints + rewardPoints;

                // 3. 更新积分文件
                const pointsUpdateRes = await updateFile(MY_POINTS_FILE, {
                    ...freshPointsRes.data,
                    points: newPoints
                }, freshPointsRes.sha, `Flappy reward (Score ${scoreThreshold}): +${rewardPoints}`);

                if (!pointsUpdateRes.success) throw new Error("积分发放失败");

                // 4. 更新记录文件，标记为已领取
                latestClaimed.push(scoreThreshold);
                const flyUpdateRes = await updateFile(MY_FLY_FILE, {
                    ...freshFlyRes.data,
                    claimedRewards: latestClaimed
                }, freshFlyRes.sha, `Claimed reward for score ${scoreThreshold}`);

                // 更新本地数据与 UI
                myData.points = newPoints;
                myData.sha = pointsUpdateRes.sha;
                gameData.claimedRewards = latestClaimed;
                if (flyUpdateRes.success) gameData.sha = flyUpdateRes.sha;

                document.getElementById('myPoints').innerText = myData.points;
                showToast(`🎉 成功领取 ${rewardPoints} 积分！`);
                renderRewards();

            } catch (err) {
                showToast(err.message || "领取失败，请重试");
                btn.innerText = originalText;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
            }
        }

        // 初始化
        window.onload = function() {
            resizeCanvas();
            refreshData(); 
        };
        
    </script>
</body>
</html>
