<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的恋爱ing 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hover-spin-slow:hover {
            animation: spin-slow 3s linear infinite;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #fff1f2; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f472b6; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4 relative">
    
    <!-- 左上角「✨ 更多功能」统一入口 & 下拉展开卡片 -->
    <div class="fixed top-4 left-4 md:top-6 md:left-6 z-50">
        <!-- 使用 relative 容器包裹，让下拉菜单基于按钮定位 -->
        <div class="relative flex flex-col items-start">
            
            <!-- 按钮 -->
            <button id="moreFeaturesBtn" onclick="toggleMoreFeatures()" class="flex items-center gap-1 md:gap-1.5 bg-white/90 backdrop-blur-sm px-4 py-2 md:px-5 md:py-2.5 rounded-full shadow-sm border-2 border-rose-100 text-rose-500 hover:bg-rose-50 hover:shadow-md transition-all group relative z-10">
                <span class="text-base md:text-lg hover-spin-slow">✨</span>
                <span class="text-xs md:text-sm font-bold">更多功能</span>
            </button>

            <!-- 向下展开的毛玻璃菜单栏 -->
            <div id="sideFeatureCard" class="absolute top-full left-0 mt-3 bg-white/60 backdrop-blur-xl border-2 border-white/70 rounded-2xl p-3 shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-[11.5rem] transform opacity-0 scale-90 -translate-y-3 pointer-events-none transition-all duration-300 ease-out origin-top-left">
                
                <div class="mb-2 border-b border-rose-100/50 pb-2 px-1">
                    <h2 class="text-sm font-black text-rose-500 drop-shadow-sm">✨ 探索更多</h2>
                </div>
                
                <!-- 单列菜单布局 -->
                <div class="flex flex-col gap-2">
                    
                    <!-- 次要功能 1: 商场 -->
                    <a href="shop.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">🛍️</span>
                        <span class="text-xs md:text-sm font-bold text-rose-600 tracking-wide">商场</span>
                    </a>

                    <!-- 次要功能 2: 恋爱档案馆 -->
                    <a href="dag.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">🗂️</span>
                        <span class="text-xs md:text-sm font-bold text-rose-600 tracking-wide">档案馆</span>
                    </a>

                    <!-- 次要功能 3: 恋爱成就 -->
                    <a href="chengjiu.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">🏆</span>
                        <span class="text-xs md:text-sm font-bold text-rose-600 tracking-wide">成就</span>
                    </a>
                    
                    <!-- 次要功能 3: 恋爱成就 -->
                    <a href="djs.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">🪦</span>
                        <span class="text-xs md:text-sm font-bold text-rose-600 tracking-wide">纪念碑</span>
                    </a>
                    <!-- 次要功能 3: 恋爱成就 -->
                    <a href="cqg.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">🐷</span>
                        <span class="text-xs md:text-sm font-bold text-rose-600 tracking-wide">存钱罐</span>
                    </a>
                    <!-- 次要功能 3: 恋爱成就 -->
                    <a href="qd.html" class="flex items-center gap-3 py-2.5 px-3 bg-gradient-to-r from-white/90 to-white/40 hover:from-rose-50 hover:to-white backdrop-blur-md border border-white/80 rounded-xl shadow-sm hover:shadow-md transform hover:translate-x-1 transition-all group">
                        <span class="text-lg group-hover:scale-110 transition-transform">📅</span>

                    </a>
                    <!-- 未来功能占位符 -->
                    <div class="flex items-center gap-3 py-2 px-3 bg-white/30 backdrop-blur-sm border border-dashed border-rose-200/70 rounded-xl opacity-70">
                        <span class="text-lg">🔒</span>
                        <span class="text-[11px] md:text-xs font-medium text-rose-400 tracking-wide">更多待解锁</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Token验证弹窗 -->
    <div id="tokenModal" class="fixed inset-0 bg-pink-50/90 z-[60] flex items-center justify-center transition-opacity duration-300 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl border-2 border-rose-100">
            <h2 class="text-2xl font-bold text-rose-500 mb-2">🔐 连接云端 🔐</h2>
            <p class="text-gray-500 text-sm mb-6">请输入您的 GitHub Token<br>以同步双方的数据 (仅保存在本地)</p>
            <input type="password" id="githubTokenInput" placeholder="ghp_xxxxxxxxxxxxxxx" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 mb-6 text-sm text-center">
            <button onclick="saveAndTestToken()" id="tokenSubmitBtn" class="w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-full shadow-md hover:shadow-lg transition">连接并保存</button>
        </div>
    </div>

    <!-- 身份确认弹窗 -->
    <div id="identityModal" class="fixed inset-0 bg-pink-50/90 z-[60] flex items-center justify-center transition-opacity duration-300 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl border-2 border-rose-100">
            <h2 class="text-2xl font-bold text-rose-500 mb-2">💖 确认身份 💖</h2>
            <p class="text-gray-500 text-sm mb-8">请选择你的专属身份<br>文案会自动生成发给对方的专属称呼哦~</p>
            <div class="flex gap-4 justify-center">
                <button onclick="setIdentity('哼哼')" class="w-28 py-3 bg-rose-50 text-rose-600 font-bold rounded-full hover:bg-rose-100 transition shadow-sm border border-rose-100">我是 哼哼</button>
                <button onclick="setIdentity('亲亲')" class="w-28 py-3 bg-rose-50 text-rose-600 font-bold rounded-full hover:bg-rose-100 transition shadow-sm border border-rose-100">我是 亲亲</button>
            </div>
        </div>
    </div>

    <!-- 优化后的更新日志弹窗 -->
    <div id="updateModal" class="fixed inset-0 bg-pink-50/90 z-[70] flex items-center justify-center transition-opacity duration-300 hidden backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-6 md:p-8 max-w-md w-full mx-4 text-center shadow-2xl border-4 border-rose-100 flex flex-col max-h-[85vh] relative">
            <!-- 装饰 -->
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-white rounded-full p-3 shadow-md border-2 border-rose-100">
                <span class="text-3xl">✨</span>
            </div>
            
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-pink-500 mt-4 mb-6 shrink-0 tracking-wide">
                更新日志
            </h2>
            
            <!-- 动态加载的滚动内容区域 -->
            <div id="updateLogContainer" class="overflow-y-auto custom-scrollbar pr-3 mb-6 space-y-5 text-left flex-grow">
                <div class="text-center text-rose-300 py-8 animate-pulse text-sm font-medium">
                    正在读取时光机中的记录...
                </div>
            </div>
            
            <button onclick="closeUpdateModal()" class="w-full py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all shrink-0">
                我知道啦
            </button>
        </div>
    </div>
    
    <!-- 主菜单 -->
    <div id="mainMenu" class="hidden flex flex-col items-center w-full max-w-md mt-16 md:mt-0 relative z-10">
        <header class="text-center mb-8 md:mb-10 animate-float">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-rose-500 mb-2 drop-shadow-sm">
                💌 我们的恋爱ing 💖
            </h1>
            <p class="text-rose-400 text-xs sm:text-sm md:text-base">
                记录属于我们的心动瞬间
            </p>
        </header>

        <div class="w-full bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-sm border-2 border-rose-100 text-center mb-6">
            <p class="text-gray-500 text-sm">你是 <span id="identityLabel" class="font-bold text-rose-500 text-lg"></span></p>
        </div>
        
        <!-- 主功能区：双列网格布局 -->
        <div class="w-full grid grid-cols-2 gap-3 md:gap-4 mb-4">
            
            <!-- 按钮 1 -->
            <a href="pet.html" class="flex flex-col items-center justify-center py-5 px-2 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all text-center">

                <span class="text-sm font-bold tracking-wide">前往 养儿子</span>
            </a>
            
            <!-- 按钮 2 -->
            <a href="task.html" class="flex flex-col items-center justify-center py-5 px-2 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all text-center">
                <span class="text-3xl mb-1.5">🎁</span>
                <span class="text-sm font-bold tracking-wide">前往 小任务</span>
            </a>

            <!-- 按钮 3 -->
            <a href="diary.html" class="flex flex-col items-center justify-center py-5 px-2 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all text-center">
                <span class="text-3xl mb-1.5">📔</span>
                <span class="text-sm font-bold tracking-wide">前往 悄悄话</span>
            </a>
            
            <!-- 按钮 4 -->
            <a href="moqi.html" class="flex flex-col items-center justify-center py-5 px-2 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all text-center">
                <span class="text-3xl mb-1.5">💰</span>
                <span class="text-sm font-bold tracking-wide">前往 赚积分</span>
            </a>

            <!-- 按钮 5 -->
            <a href="movie.html" class="flex flex-col items-center justify-center py-5 px-2 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-2xl shadow-md hover:shadow-lg transform hover:-translate-y-1 transition-all text-center">
                <span class="text-3xl mb-1.5">🎬</span>
                <span class="text-sm font-bold tracking-wide">前往 看电影</span>
            </a> 
            
            <!-- 为保持平衡的占位符区域 -->
            <div class="flex flex-col items-center justify-center py-5 px-2 bg-rose-50/50 border-2 border-dashed border-rose-200 text-rose-300 rounded-2xl text-center">
                <span class="text-2xl mb-1.5 opacity-50">💕</span>
                <span class="text-xs font-medium tracking-wide">未完待续</span>
            </div>
            
        </div>
    </div>

    <!-- 左下角版本号 -->
    <div class="fixed bottom-6 left-6 z-40">
        <span id="versionDisplay" onclick="showUpdateModal()" class="text-rose-400 text-sm md:text-base cursor-pointer font-medium hover:text-rose-600 bg-white/80 px-3 py-1.5 rounded-full shadow-sm border border-rose-100 transition-all drop-shadow-sm flex items-center gap-1.5">
            <span>🏷️</span> <span id="versionText">版本：读取中</span>
        </span>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap"></div>

    <script>
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        
        window.onload = function() {
            checkConfig();
            loadUpdateLog();
        };

        // ====== 侧边展开卡片逻辑 ======
        let isMoreFeaturesOpen = false;
        
        function toggleMoreFeatures() {
            const card = document.getElementById('sideFeatureCard');
            isMoreFeaturesOpen = !isMoreFeaturesOpen;
            
            if (isMoreFeaturesOpen) {
                // 展开：淡入、复原缩放、复原位移
                card.classList.remove('opacity-0', 'scale-90', '-translate-y-3', 'pointer-events-none');
                card.classList.add('opacity-100', 'scale-100', 'translate-y-0', 'pointer-events-auto');
            } else {
                // 收起：淡出、缩小、向上位移
                card.classList.remove('opacity-100', 'scale-100', 'translate-y-0', 'pointer-events-auto');
                card.classList.add('opacity-0', 'scale-90', '-translate-y-3', 'pointer-events-none');
            }
        }

        // 监听全局点击事件，点击空白处自动收起卡片
        document.addEventListener('click', function(event) {
            const card = document.getElementById('sideFeatureCard');
            const btn = document.getElementById('moreFeaturesBtn');
            
            // 如果卡片是打开状态，且点击的区域既不在卡片内，也不在按钮上，就收起
            if (isMoreFeaturesOpen && !card.contains(event.target) && !btn.contains(event.target)) {
                toggleMoreFeatures();
            }
        });
        // ======================================

        function checkConfig() {
            const token = localStorage.getItem('loveGacha_githubToken');
            const identity = localStorage.getItem('loveGacha_myIdentity');

            if (!token) {
                document.getElementById('tokenModal').classList.remove('hidden');
                document.getElementById('mainMenu').classList.add('hidden');
            } else if (!identity) {
                document.getElementById('tokenModal').classList.add('hidden');
                document.getElementById('identityModal').classList.remove('hidden');
                document.getElementById('mainMenu').classList.add('hidden');
            } else {
                document.getElementById('tokenModal').classList.add('hidden');
                document.getElementById('identityModal').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('mainMenu').classList.add('flex');
                document.getElementById('identityLabel').innerText = identity;
            }
        }

        async function saveAndTestToken() {
            const inputToken = document.getElementById('githubTokenInput').value.trim();
            if (!inputToken) { showToast("Token不能为空哦！"); return; }
            
            const btn = document.getElementById('tokenSubmitBtn');
            btn.innerText = "正在连接..."; btn.disabled = true;

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${inputToken}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (response.ok) {
                    localStorage.setItem('loveGacha_githubToken', inputToken);
                    localStorage.removeItem('loveGacha_myIdentity'); // 新增：连接/重连成功后，强制清除旧身份，触发重新选择
                    showToast("GitHub 连接成功！🎉");
                    checkConfig();
                    loadUpdateLog(); // 连接成功后立即拉取更新日志
                } else {
                    showToast("连接失败，请检查 Token 及仓库名称！");
                }
            } catch (err) {
                showToast("网络请求失败，请稍后再试。");
            } finally {
                btn.innerText = "连接并保存"; btn.disabled = false;
            }
        }

        function setIdentity(id) {
            localStorage.setItem('loveGacha_myIdentity', id);
            showToast(`欢迎回来，${id}！`);
            checkConfig();
        }

        // Base64 解码解决中文乱码
        function base64ToUtf8(str) {
            return decodeURIComponent(escape(atob(str)));
        }

        // 获取并渲染更新日志
        async function loadUpdateLog() {
            const container = document.getElementById('updateLogContainer');
            const versionText = document.getElementById('versionText');
            const token = localStorage.getItem('loveGacha_githubToken');
            
            try {
                if (!token) {
                    versionText.innerText = `版本：待连接`;
                    container.innerHTML = '<div class="text-center text-rose-400 py-8 text-sm font-medium">请先连接云端后查看更新记录哦~</div>';
                    return;
                }

                // 通过 GitHub API 获取文件内容，彻底解决跨域和本地读取问题
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/gxgg.json`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (response.status === 401) {
                    localStorage.removeItem('loveGacha_githubToken');
                    localStorage.removeItem('loveGacha_myIdentity'); // 新增：Token失效时一并清除身份缓存
                    showToast("Token 已失效或错误，请重新连接！");
                    checkConfig(); // 重新执行配置检查，会自动展示 Token 弹窗
                    return;
                }

                if (response.status === 404) {
                    versionText.innerText = `版本：未创建`;
                    container.innerHTML = '<div class="text-center text-rose-400 py-8 text-sm font-medium">还没有更新公告呢，<br>请去访问 edit_gxgg.html 创建第一条吧~</div>';
                    return;
                }

                if (!response.ok) throw new Error('Network response was not ok');
                
                const fileData = await response.json();
                const contentStr = base64ToUtf8(fileData.content);
                const data = JSON.parse(contentStr);
                
                // 更新左下角版本号
                versionText.innerText = `版本：${data.currentVersion || '1.0'}`;

                // 渲染弹窗内容
                container.innerHTML = ''; 

                if (!data.updates || data.updates.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-8">暂无更新记录</div>';
                    return;
                }

                data.updates.forEach((update, index) => {
                    const isLatest = index === 0;
                    const card = document.createElement('div');
                    
                    // 为最新版本设置特殊的视觉效果
                    card.className = `relative rounded-2xl p-5 border ${
                        isLatest 
                        ? 'bg-gradient-to-br from-rose-50 to-pink-50/50 border-rose-200 shadow-sm' 
                        : 'bg-white border-rose-100/60'
                    } transition-all`;
                    
                    let featuresHtml = update.features.map(f => `
                        <li class="flex items-start gap-2.5 text-gray-600 text-sm leading-relaxed w-full">
                            <span class="text-rose-400 mt-0.5 shrink-0 text-[10px]">🌸</span>
                            <span class="font-medium whitespace-pre-line break-words flex-1">${f}</span>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        ${isLatest ? '<div class="absolute -top-3 -right-2 bg-gradient-to-r from-rose-400 to-pink-400 text-white text-xs px-2.5 py-1 rounded-full shadow-md transform rotate-6 font-bold tracking-wider">LATEST</div>' : ''}
                        <div class="flex items-end justify-between gap-2 mb-3 border-b ${isLatest ? 'border-rose-200/80' : 'border-gray-100'} pb-3">
                            <h3 class="font-black text-lg ${isLatest ? 'text-rose-500' : 'text-gray-700'} tracking-wide">
                                v${update.version}
                            </h3>
                            ${update.date ? `<span class="text-xs text-gray-400 font-semibold bg-gray-50 px-2 py-1 rounded-md">${update.date}</span>` : ''}
                        </div>
                        <ul class="space-y-3">
                            ${featuresHtml}
                        </ul>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("加载更新日志失败:", error);
                container.innerHTML = '<div class="text-center text-rose-400 py-8 text-sm font-medium">无法加载更新日志<br>请确保已创建 gxgg.json 文件哦~</div>';
                versionText.innerText = `版本：未知`;
            }
        }

        function showUpdateModal() {
            document.getElementById('updateModal').classList.remove('hidden');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.remove('hidden'); toast.classList.add('toast-animate');
            setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3000);
        }
    </script>
</body>
</html>
