<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的恋爱ing 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- ======================================================== -->
    <!-- ⬇️⬇️⬇️ 添加以下代码以设置 Safari 主屏幕图标 ⬇️⬇️⬇️ -->
    <!-- 说明：这里假设您的图片文件名为 apple-touch-icon.png 且放在根目录下 -->
    <!-- ======================================================== -->
    
    <!-- 用于高分辨率 iPhone 的图标 (180x180) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- 防止 iOS 自动添加光泽效果 (可选，建议添加) -->
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">

    <!-- ======================================================== -->
    <!-- ⬆️⬆️⬆️ 核心修改结束 ⬆️⬆️⬆️ -->
    <!-- ======================================================== -->
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }

        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hover-spin-slow:hover {
            animation: spin-slow 3s linear infinite;
        }

        /* 弹窗跳出动画 */
        @keyframes pop { 
            0% { transform: scale(0.8); } 
            50% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }
        .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #fff1f2; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #f472b6; 
        }
    </style>
</head>
<!-- ... (余下的 <body> 代码保持不变) ... -->
