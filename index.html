    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }

        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f472b6; }
    </style>
</head>

        async function fetchFile(filePath) {
            try {
                // 增加时间戳，破坏缓存
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`
                        // 已移除 Cache-Control 防止跨域报错
                    }
                });
                
                if (response.status === 401 || response.status === 403) {
                    return { authError: true };
                }
                
                // 404代表文件还未创建，属于正常现象
                if (response.status === 404) {
                    return { data: {}, sha: null }; 
                }
                
                if (!response.ok) {
                    return { error: true };
                }
                
                const result = await response.json();
                let parsedData = {};
                
                try {
                    const base64Str = result.content.replace(/\s/g, '');
                    const contentStr = decodeURIComponent(escape(atob(base64Str)));
                    parsedData = JSON.parse(contentStr || '{}');
                } catch (parseError) {
                    console.warn(`[容错处理] ${filePath} JSON 解析失败，将以空对象覆写原文件。`, parseError);
                    parsedData = {}; 
                }
                
                return { data: parsedData, sha: result.sha };
            } catch (error) {
                console.error(`读取 ${filePath} 失败:`, error);
                return { error: true };
            }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const contentStr = JSON.stringify(newData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(contentStr))); 
                
                const body = {
                    message: `Update love data`,
                    content: encodedContent
                };
                if (sha) body.sha = sha; // 必须提供当前的sha才能覆盖已存在的文件

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(body)
                });
                
                if (response.status === 401 || response.status === 403) {
                    return { authError: true };
                }

                if (!response.ok) {
                    console.error(`写入失败，状态码: ${response.status}`);
                    return { success: false, sha: sha };
                }

                const result = await response.json();
                if (result.content && result.content.sha) {
                    return { success: true, sha: result.content.sha };
                }
                return { success: false, sha: sha };
            } catch (error) {
                console.error(`写入 ${filePath} 失败:`, error);
                return { success: false, sha: sha };
            }
        }

        async function fetchAllData(isBackground = false) {
            if (!isBackground) {

            // 同时请求4个文件（抽卡数据 + 日记数据）
            const [resH, resQ, resHRj, resQRj] = await Promise.all([
                fetchFile(FILE_H),
                fetchFile(FILE_Q),
                fetchFile(FILE_H_RJ),
                fetchFile(FILE_Q_RJ)
            ]);
            
            if (resH.authError || resQ.authError || resHRj.authError || resQRj.authError) {
                showToast("Token已失效或无权限，请重新输入！");
                resetToken();
                return false; 
            }

            if (resH.error || resQ.error || resHRj.error || resQRj.error) {
                if (!isBackground) showToast("读取云端数据失败，请检查网络或仓库名是否正确！");
                isLoading = false;
                if (!isFlipped) document.getElementById('cardFrontText').innerText = "点击抽取";
                return false;
            }
            
            // 绑定抽卡数据
            dataH = resH.data; shaH = resH.sha;
            dataQ = resQ.data; shaQ = resQ.sha;
            
            // 绑定日记数据，如果未初始化数组则初始化为空数组
            dataHRj = resHRj.data; shaHRj = resHRj.sha;
            dataQRj = resQRj.data; shaQRj = resQRj.sha;
            if (!dataHRj.diaries) dataHRj.diaries = [];
            if (!dataQRj.diaries) dataQRj.diaries = [];
            
            if (!isBackground) {
                isLoading = false;
                if (!isFlipped) document.getElementById('cardFrontText').innerText = "点击抽取";
            }
            return true;
        }

        // ==========================================
        async function saveDiary() {
            const input = document.getElementById('diaryInput');
            const text = input.value.trim();
            if (!text) {
                showToast("日记内容不能为空哦~");
                return;
            }

            const btn = document.getElementById('saveDiaryBtn');
            btn.innerText = "正在保存...";
            btn.disabled = true;

            // 获取对应的日记本数据变量 (Hrj / Qrj)
            const myDataRj = myIdentity === '哼哼' ? dataHRj : dataQRj;
            let myShaRj = myIdentity === '哼哼' ? shaHRj : shaQRj;
            const myPathRj = myIdentity === '哼哼' ? FILE_H_RJ : FILE_Q_RJ;

            if (!myDataRj.diaries) myDataRj.diaries = [];

            // 获取本地精准时间 (YYYY-MM-DD HH:mm:ss)
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const date = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            const timeStr = `${year}-${month}-${date} ${hours}:${minutes}:${seconds}`;

            // 添加到本地日记数组的最前方
            myDataRj.diaries.unshift({
                time: timeStr,
                content: text
            });

            renderDiaryUI(); // 先在本地预览更新

            // 上传到对应的 RJ 文件
            const uploadRes = await updateFile(myPathRj, myDataRj, myShaRj);
            if (uploadRes.success) {
                if (myIdentity === '哼哼') shaHRj = uploadRes.sha;
                else shaQRj = uploadRes.sha;
                showToast("日记保存成功！📔");
                input.value = ""; 
            } else {
                showToast("保存失败，请检查网络重试。");
                myDataRj.diaries.shift(); // 上传失败时撤回本地插入的数据
                renderDiaryUI();
            }

            btn.innerText = "写进日记本 ✍️";
            btn.disabled = false;
        }

        function renderDiaryUI() {
            if (currentTab !== 'diary' || !myIdentity) return; 

            const myDataRj = myIdentity === '哼哼' ? dataHRj : dataQRj;
            const partnerDataRj = myIdentity === '哼哼' ? dataQRj : dataHRj;

            document.getElementById('myDiaryTitle').innerText = `${myIdentity}的日记`;
            document.getElementById('partnerDiaryTitle').innerText = `${partnerIdentity}的日记`;

            const myContainer = document.getElementById('myDiaryList');
            const partnerContainer = document.getElementById('partnerDiaryList');

            const renderEntries = (container, diaries, isSelf) => {
                if (!diaries || diaries.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 text-center mt-6">还没有记录哦~</p>';
                    return;
                }
                
                let html = '';
                diaries.forEach(entry => {
                    const bgClass = isSelf ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100';
                    const timeClass = isSelf ? 'text-emerald-500' : 'text-rose-400';
                    html += `
                        <div class="p-3 rounded-xl border ${bgClass} break-words animate-fade-in shadow-sm">
                            <div class="text-[10px] font-bold ${timeClass} mb-1.5 flex items-center gap-1">
                                <span>🕒</span> ${entry.time}
                            </div>
                            <div class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${entry.content}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            };

            renderEntries(myContainer, myDataRj.diaries, true);
            renderEntries(partnerContainer, partnerDataRj.diaries, false);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            toast.classList.add('toast-animate');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-animate');
            }, 3000); 
        }

        function copyTask() {
            const textToCopy = `【今日心动任务】\n${currentTaskText}\n\n—— ${partnerIdentity}，这是我们今天要一起做的事哦！`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast("复制成功！快去发给TA吧~");
                }).catch(() => fallbackCopyTextToClipboard(textToCopy));
            } else {
                fallbackCopyTextToClipboard(textToCopy);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const input = document.getElementById('clipboardInput');
            input.value = text;
            input.classList.remove('hidden');
            input.select();
            input.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast("复制成功！快去发给TA吧~");
            } catch (err) {
                showToast("复制失败，请手动截图~");
            }
            input.classList.add('hidden');
        }
    </script>
</body>
</html>
