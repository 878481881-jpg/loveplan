<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日任务 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #fdf2f8; background-image: radial-gradient(#fbcfe8 1px, transparent 1px); background-size: 20px 20px; overflow-x: hidden; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4">

   <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-500 flex items-center justify-center gap-2">
                💌 我们的心动任务
            </h1>
        </div>
        <div class="w-9 h-9"></div> <!-- 占位保持居中 -->
    </header>
 

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 顶部主导航 -->
        <div class="flex space-x-4 mb-5 w-full justify-center">
            <a href="index.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm">返回首页</a>
            <a href="task.html" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm">每日任务</a>
        </div>

        <!-- 功能选项卡（抽取/日历/许愿） -->
        <div class="flex bg-white/70 p-1.5 rounded-full mb-6 w-full max-w-sm border border-rose-200 shadow-sm backdrop-blur-sm gap-1">
            <button id="tab-draw" class="flex-1 py-1.5 text-sm font-bold rounded-full bg-rose-500 text-white shadow transition-all" onclick="switchTab('draw')">抽取任务</button>
            <button id="tab-calendar" class="flex-1 py-1.5 text-sm font-bold rounded-full text-rose-500 hover:bg-rose-100 transition-all" onclick="switchTab('calendar')">时光日历</button>
            <button id="tab-diy" class="flex-1 py-1.5 text-sm font-bold rounded-full text-rose-500 hover:bg-rose-100 transition-all" onclick="switchTab('diy')">偷塞愿望</button>
        </div>

        <div class="w-full relative min-h-[600px] flex justify-center pb-10">
            
            <!-- 【视图 1】抽取任务 -->
            <div id="view-draw" class="w-full flex flex-col items-center transition-opacity duration-300">
                <!-- 卡片容器 -->
                <div class="relative w-72 h-96 cursor-pointer perspective-1000 group" id="cardContainer" onclick="drawCard()">
                    <div id="cardInner" class="w-full h-full relative transform-style-3d card-transition shadow-xl rounded-2xl">
                        <!-- 卡片正面 -->
                        <div class="absolute w-full h-full bg-gradient-to-br from-rose-300 to-pink-400 rounded-2xl backface-hidden flex flex-col items-center justify-center border-4 border-white border-opacity-50">
                            <div class="text-6xl mb-4">🎁</div>
                            <h2 class="text-white text-2xl font-bold tracking-widest" id="cardFrontText">加载中...</h2>
                            <p class="text-pink-100 text-sm mt-2">365件恋爱小事</p>
                        </div>

                        <!-- 卡片背面 -->
                        <div class="absolute w-full h-full bg-white rounded-2xl backface-hidden rotate-y-180 flex flex-col items-center justify-between p-6 border-4 border-rose-200">
                            <div class="text-center w-full">
                                <span id="cardCategory" class="inline-block px-3 py-1 bg-rose-100 text-rose-600 rounded-full text-xs font-bold mb-4">类别</span>
                                <div id="cardEmoji" class="text-5xl mb-4 mt-2">✨</div>
                            </div>
                            <div class="flex-grow flex items-center justify-center">
                                <p id="cardText" class="text-gray-700 text-lg font-medium text-center leading-relaxed">任务内容...</p>
                            </div>
                            <div class="text-gray-400 text-xs mt-4" id="cardNumber">#000</div>
                        </div>
                    </div>
                </div>

                <!-- 操作区 -->
                <div class="mt-8 flex flex-col items-center gap-3 w-full max-w-xs opacity-0 pointer-events-none transition-opacity duration-500" id="actionButtons">
                    <button onclick="copyTask()" class="px-8 py-3 bg-white border border-rose-200 text-rose-500 font-bold rounded-full shadow-sm hover:shadow transform hover:-translate-y-0.5 transition-all flex items-center justify-center w-full">
                        <span id="copyBtnText">复制发送 💬</span>
                    </button>
                    
                    <div id="myTaskActionArea" class="w-full flex flex-col items-center gap-2 mt-2">
                        <textarea id="mySecretInput" rows="2" class="w-full px-4 py-2 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 resize-none text-gray-700 placeholder-rose-300" placeholder="写一句给TA的悄悄话，完成任务后TA才能看到哦..."></textarea>
                        <button id="completeMyTaskBtn" onclick="saveSecretMessageAndComplete()" class="w-full py-3 bg-gradient-to-r from-emerald-400 to-teal-400 text-white font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center">
                            ✅ 标记我已完成
                        </button>
                    </div>
                    <div id="myTaskDoneText" class="hidden w-full text-center py-2 bg-emerald-50 text-emerald-600 rounded-full border border-emerald-100 text-sm font-bold mt-2">
                        🎉 今日任务已完成，悄悄话已封存！
                    </div>
                    <p class="text-rose-400 text-xs text-center mt-2">✨ 今日任务已抽取，已自动同步云端 ✨</p>
                </div>
                
                <!-- 对方的任务状态区 -->
                <div id="partnerStatusArea" class="mt-6 w-full max-w-xs bg-white rounded-2xl p-4 shadow-sm border-2 border-rose-100 hidden opacity-0 transition-opacity duration-500">
                    <h3 class="text-sm font-bold text-rose-500 mb-2 flex items-center justify-center gap-2">
                        <span>💞</span> <span id="partnerTitle">对方的任务</span>
                    </h3>
                    <div id="partnerTaskContent" class="text-center text-gray-600 text-sm bg-rose-50 rounded-xl p-3 min-h-[80px] flex items-center justify-center">
                        <span class="animate-pulse">正在悄悄看TA抽了什么... 👀</span>
                    </div>
                </div>
            </div> 

            <!-- 【视图 2】时光日历 -->
            <div id="view-calendar" class="w-full flex-col items-center hidden max-w-sm animate-fade-in">
                <div class="bg-white w-full rounded-2xl p-5 shadow-sm border border-rose-100">
                    <div class="flex justify-between items-center mb-5 px-1">
                        <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-rose-50 rounded-xl text-rose-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h3 id="calMonthYear" class="font-bold text-rose-600 text-lg tracking-wide">202X年 X月</h3>
                        <button onclick="changeMonth(1)" class="p-1.5 hover:bg-rose-50 rounded-xl text-rose-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-400 mb-3">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    
                    <div id="calGrid" class="grid grid-cols-7 gap-1.5 text-center">
                        <!-- 日历网格由 JS 填充 -->
                    </div>
                    
                    <div class="mt-6 pt-4 border-t border-rose-50 flex justify-center gap-5 text-xs text-gray-500 font-medium">
                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm"></span> 已完成</div>
                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-400 shadow-sm"></span> 未完成</div>
                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-gray-200"></span> 待探索</div>
                    </div>
                </div>
            </div>

            <!-- 【视图 3】偷塞愿望 -->
            <div id="view-diy" class="w-full flex-col items-center hidden max-w-sm animate-fade-in">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 w-full mb-6">
                    <h3 class="font-bold text-rose-500 mb-2 flex items-center gap-2">
                        <span>🤫</span> 偷偷塞入新愿望
                    </h3>
                    <p class="text-xs text-gray-400 mb-4 leading-relaxed">你在这里写下的愿望，将会有 <span class="font-bold text-rose-400">30%</span> 的概率在对方日常抽卡时被当做“专属任务”抽出哦！</p>
                    
                    <textarea id="diyInput" rows="3" class="w-full p-3 border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 resize-none text-sm text-gray-700 placeholder-rose-300 mb-4" placeholder="写下你想让TA为你做的一件事，或你们一起去完成的心愿... (例如：今天必须给我买一杯奶茶)"></textarea>
                    
                    <button onclick="submitDiy(event)" class="w-full py-3 bg-gradient-to-r from-purple-400 to-pink-500 text-white font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center">
                        悄悄放入卡池 ✨
                    </button>
                </div>

                <div class="w-full text-left mb-3 px-2">
                    <h3 class="text-sm font-bold text-gray-600 flex items-center gap-2">
                        <span>📝</span> 我塞过的愿望
                    </h3>
                </div>
                
                <div id="diyList" class="w-full space-y-3 pb-8">
                    <!-- 列表由 JS 渲染 -->
                </div>
            </div>

        </div> 
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-gray-400 text-xs underline hover:text-rose-400 transition-colors block mb-2">
                返回首页 (当前: <span id="currentIdentityLabel">-</span>)
            </a>
        </div>
    </main>

    <!-- 历史记录详情弹窗 (Modal) -->
    <div id="historyModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl w-full max-w-sm max-h-[85vh] shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col" id="historyModalContent">
            <!-- 头部区 -->
            <div class="p-5 border-b border-rose-100 flex justify-between items-center bg-rose-50/50 rounded-t-3xl shrink-0">
                <h3 class="font-bold text-rose-600 text-lg" id="historyModalDate">📅 回忆</h3>
                <button onclick="closeHistory()" class="text-gray-400 hover:text-rose-500 bg-white rounded-full p-1 shadow-sm transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- 内容滚动区 -->
            <div class="p-5 overflow-y-auto no-scrollbar space-y-4" id="historyModalBody">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-[60] whitespace-nowrap"></div>
    <input type="text" id="clipboardInput" class="hidden absolute -left-9999">

        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (response.status === 404) return { data: {}, sha: null }; 
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(contentStr || '{}'), sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (!response.ok) return { success: false, sha: sha };
                
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

            if (resH.authError || resQ.authError) { showToast("Token失效，请重新登录"); setTimeout(()=>window.location.href='index.html', 1500); return false; }
            if (resH.error || resQ.error) {

                if (!isFlipped) document.getElementById('cardFrontText').innerText = "点击抽取"; return false;

        }

            const partnerData = myIdentity === '哼哼' ? dataQ : dataH;

                renderFlippedCard(myData[todayStr], true); renderUI();

            }

            // --- 偷塞愿望 (DIY) 抽取逻辑 ---
            const partnerDIYs = partnerData['DIY_TASKS'] || [];
            const myUsedDIYs = myData['USED_DIY'] || [];
            const availableDIYs = partnerDIYs.filter(t => !myUsedDIYs.includes(t.id));

            let taskObj;
            // 如果有可用的DIY愿望，且满足一定概率（30%）
            if (availableDIYs.length > 0 && Math.random() < 0.3) {
                const pickedDIY = availableDIYs[Math.floor(Math.random() * availableDIYs.length)];
                taskObj = JSON.parse(JSON.stringify(pickedDIY)); // 深拷贝防止污染
                taskObj.isDIY = true;
                
                // 记录我已经抽过这个愿望
                if(!myData['USED_DIY']) myData['USED_DIY'] = [];
                myData['USED_DIY'].push(taskObj.id);
            } else {
                const pickedNormal = tasks[Math.floor(Math.random() * tasks.length)];
                taskObj = JSON.parse(JSON.stringify(pickedNormal));
            }

            taskObj.myTaskCompleted = false; 
            taskObj.secretMessage = "";
            myData[todayStr] = taskObj; 
            
            const upRes = await updateFile(myPath, myData, mySha);

            renderFlippedCard(taskObj, true); renderUI(); isLoading = false;
        }

        }

        function renderHistoryCard(owner, taskObj, isMe) {
            if (!taskObj) return `<div class="bg-gray-50 rounded-2xl p-4 text-center text-sm text-gray-400 border border-gray-100 border-dashed">${owner} 这天没有抽卡</div>`;
            
            let diyTag = taskObj.isDIY ? `<span class="inline-block px-2 py-0.5 bg-gradient-to-r from-purple-400 to-pink-400 text-white text-[10px] rounded-full ml-2 shadow-sm font-bold">专属愿望✨</span>` : '';
            
            let secretHtml = '';
            if (taskObj.myTaskCompleted) {
                let msg = taskObj.secretMessage || "TA害羞没有留悄悄话~";
                secretHtml = `
                    <div class="mt-4 bg-emerald-50 rounded-xl p-3 border border-emerald-100 relative">
                        <div class="absolute -top-2.5 left-4 bg-emerald-100 text-emerald-700 text-[10px] px-2.5 py-0.5 rounded-full font-bold shadow-sm border border-emerald-50">留下的悄悄话</div>
                        <p class="text-sm text-emerald-700 mt-1">${msg}</p>
                    </div>
                `;
            } else {
                secretHtml = `
                    <div class="mt-4 bg-gray-50 rounded-xl p-3 border border-gray-100 text-center">
                        <span class="text-xs text-gray-400 flex items-center justify-center gap-1.5">🔒 任务未完成，悄悄话未解锁</span>
                    </div>
                `;
            }

            let statusTag = taskObj.myTaskCompleted ? 
                `<span class="text-[11px] text-emerald-500 font-bold flex items-center bg-emerald-50 px-2 py-1 rounded-full"><svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg> 已完成</span>` : 
                `<span class="text-[11px] text-rose-400 font-bold flex items-center bg-rose-50 px-2 py-1 rounded-full">○ 待完成</span>`;

            return `
                <div class="border ${isMe ? 'border-rose-200 bg-rose-50/40' : 'border-blue-200 bg-blue-50/40'} rounded-2xl p-4 shadow-sm relative overflow-hidden transition-all hover:shadow-md">
                    <div class="flex justify-between items-center mb-3">
                        <div class="font-bold text-sm ${isMe ? 'text-rose-500' : 'text-blue-500'} flex items-center">
                            <span class="bg-white rounded-full p-1 mr-1.5 shadow-sm">${isMe ? '🐰' : '🐱'}</span>
                            ${owner} ${diyTag}
                        </div>
                        ${statusTag}
                    </div>
                    
                    <div class="flex items-start gap-3 mt-2 bg-white/60 p-3 rounded-xl">
                        <div class="text-3xl">${taskObj.emoji}</div>
                        <div class="flex-1">
                            <span class="text-[10px] font-bold text-gray-500 bg-white px-2 py-0.5 rounded-full border border-gray-200 mb-1.5 inline-block shadow-sm">${taskObj.category}</span>
                            <p class="text-sm text-gray-700 font-medium leading-relaxed">${taskObj.text}</p>
                        </div>
                    </div>
                    ${secretHtml}
                </div>
            `;
        }

        function closeHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.add('opacity-0');
            document.getElementById('historyModalContent').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function submitDiy(event) {
            const input = document.getElementById('diyInput');
            const text = input.value.trim();
            if(!text) { showToast("愿望内容不能为空哦~"); return; }
            
            const btn = event.currentTarget;
            const oldText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 塞入中...`;
            btn.disabled = true;

            await fetchAllData(true); // 保证数据最新
            
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            const myPath = myIdentity === '哼哼' ? FILE_H : FILE_Q;
            let mySha = myIdentity === '哼哼' ? shaH : shaQ;
            
            if(!myData['DIY_TASKS']) myData['DIY_TASKS'] = [];
            
            const newTask = {
                id: 'diy_' + Date.now(),
                category: "专属愿望",
                emoji: "✨",
                text: text
            };
            
            myData['DIY_TASKS'].push(newTask);
            
            const upRes = await updateFile(myPath, myData, mySha);
            if(upRes.success) {
                if(myIdentity === '哼哼') shaH = upRes.sha; else shaQ = upRes.sha;
                showToast("成功塞入愿望池！🤫");
                input.value = '';
                renderDiyList();
            } else {
                showToast("保存失败，请重试");
                myData['DIY_TASKS'].pop(); 
            }
            
            btn.innerHTML = oldText;
            btn.disabled = false;
        }

        function renderDiyList() {
            const listContainer = document.getElementById('diyList');
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            const diys = myData['DIY_TASKS'] || [];
            const partnerData = myIdentity === '哼哼' ? dataQ : dataH;
            const partnerUsed = partnerData['USED_DIY'] || [];
            
            if(diys.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 text-xs py-10 bg-white/50 rounded-2xl border border-gray-200 border-dashed">还没有塞入过愿望哦<br><span class="mt-1 inline-block">快给TA制造一点小惊喜吧~</span></div>`;
                return;
            }
            
            let html = '';
            [...diys].reverse().forEach(task => {
                const isDrawn = partnerUsed.includes(task.id);
                const statusHtml = isDrawn ? 
                    `<span class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full font-bold border border-emerald-200">TA已抽中 🎉</span>` : 
                    `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full border border-gray-200">潜伏中 🤫</span>`;
                    
                const dateCreated = new Date(parseInt(task.id.split('_')[1]));
                const dateStr = `${dateCreated.getMonth()+1}月${dateCreated.getDate()}日`;
                    
                html += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-rose-50 flex items-start gap-3 relative overflow-hidden transition-all hover:shadow-md">
                        ${isDrawn ? '<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-400"></div>' : '<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gray-200"></div>'}
                        <div class="text-2xl pt-0.5 ml-1">✨</div>
                        <div class="flex-1">
                            <p class="text-sm text-gray-700 font-medium mb-2 leading-snug">${task.text}</p>
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] text-gray-400 font-medium">${dateStr} 塞入</span>
                                ${statusHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.remove('hidden'); toast.classList.add('toast-animate'); setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3000); }
        function copyTask() {
            const txt = `【今日心动任务】\n${currentTaskText}\n\n—— ${partnerIdentity}，这是我们今天要一起做的事哦！`;
            const input = document.getElementById('clipboardInput'); input.value = txt; input.classList.remove('hidden'); input.select(); document.execCommand('copy'); input.classList.add('hidden'); showToast("复制成功！快去发给TA吧~");
        }
    </script>
</body>
</html>
