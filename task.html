<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日任务 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 核心改动：加入 overscroll-none 防止 iOS 橡皮筋回弹效果 */
        html, body { height: 100%; overscroll-behavior-y: none; }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #fdf2f8; background-image: radial-gradient(#fbcfe8 1px, transparent 1px); background-size: 20px 20px; overflow-x: hidden; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<!-- 改动点：将 min-h-screen 改为 h-[100dvh] 锁定高度，增加 overflow-hidden 且减少外边距 padding -->
<body class="h-[100dvh] w-screen flex flex-col items-center justify-between py-2 px-4 overflow-hidden">

   <header class="flex-shrink-0 text-center mb-2 animate-float mt-1 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-xl font-bold text-rose-500 flex items-center justify-center gap-1">
                💌 我们的心动任务
            </h1>
        </div>
        <div class="w-8 h-8"></div> <!-- 占位保持居中 -->
    </header>
 
    <!-- 改动点：main 设置为 flex-1 撑满剩余空间，并限制内容溢出 -->
    <main class="w-full max-w-md flex flex-col items-center flex-1 h-full overflow-hidden">

        <!-- 功能选项卡 -->
        <div class="flex-shrink-0 flex bg-white/70 p-1 rounded-full mb-2 w-full max-w-sm border border-rose-200 shadow-sm backdrop-blur-sm gap-1">
            <button id="tab-draw" class="flex-1 py-1.5 text-sm font-bold rounded-full bg-rose-500 text-white shadow transition-all" onclick="switchTab('draw')">抽取任务</button>
            <button id="tab-calendar" class="flex-1 py-1.5 text-sm font-bold rounded-full text-rose-500 hover:bg-rose-100 transition-all" onclick="switchTab('calendar')">时光日历</button>
            <button id="tab-diy" class="flex-1 py-1.5 text-sm font-bold rounded-full text-rose-500 hover:bg-rose-100 transition-all" onclick="switchTab('diy')">偷塞愿望</button>
        </div>

        <!-- 视图容器：去掉固定最低高度，改为 flex-1 填满中间区域 -->
        <div class="w-full h-full flex-1 relative flex justify-center overflow-hidden pb-1">
            
            <!-- 【视图 1】抽取任务 -->
            <div id="view-draw" class="w-full h-full flex flex-col items-center justify-center transition-opacity duration-300 overflow-hidden">
                <!-- 卡片容器：改为响应式宽高，取代原本写死的 w-72 h-96 -->
                <div class="relative w-[55vw] max-w-[220px] h-[32vh] max-h-[300px] min-h-[180px] cursor-pointer perspective-1000 group flex-shrink-0" id="cardContainer" onclick="drawCard()">
                    <div id="cardInner" class="w-full h-full relative transform-style-3d card-transition shadow-xl rounded-2xl">
                        <!-- 卡片正面 -->
                        <div class="absolute w-full h-full bg-gradient-to-br from-rose-300 to-pink-400 rounded-2xl backface-hidden flex flex-col items-center justify-center border-4 border-white border-opacity-50">
                            <div class="text-5xl mb-2">🎁</div>
                            <h2 class="text-white text-xl font-bold tracking-widest" id="cardFrontText">加载中...</h2>
                            <p class="text-pink-100 text-xs mt-2">365件恋爱小事</p>
                        </div>

                        <!-- 卡片背面 -->
                        <div class="absolute w-full h-full bg-white rounded-2xl backface-hidden rotate-y-180 flex flex-col items-center justify-between p-4 border-4 border-rose-200">
                            <div class="text-center w-full">
                                <span id="cardCategory" class="inline-block px-3 py-1 bg-rose-100 text-rose-600 rounded-full text-xs font-bold mb-2">类别</span>
                                <div id="cardEmoji" class="text-4xl mb-2 mt-1">✨</div>
                            </div>
                            <div class="flex-grow flex items-center justify-center overflow-y-auto no-scrollbar">
                                <p id="cardText" class="text-gray-700 text-sm font-medium text-center leading-relaxed">任务内容...</p>
                            </div>
                            <div class="text-gray-400 text-[10px] mt-2" id="cardNumber">#000</div>
                        </div>
                    </div>
                </div>

                <!-- 操作区：压缩边距，防止超出 -->
                <div class="mt-3 flex flex-col items-center gap-2 w-full max-w-xs flex-shrink-0 opacity-0 pointer-events-none transition-opacity duration-500" id="actionButtons">
                    <button onclick="copyTask()" class="px-6 py-2 bg-white border border-rose-200 text-rose-500 text-sm font-bold rounded-full shadow-sm hover:shadow transform hover:-translate-y-0.5 transition-all flex items-center justify-center w-full">
                        <span id="copyBtnText">复制发送 💬</span>
                    </button>
                    
                    <div id="myTaskActionArea" class="w-full flex flex-col items-center gap-2 mt-1">
                        <textarea id="mySecretInput" rows="1" class="w-full px-3 py-1.5 text-xs border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 resize-none text-gray-700 placeholder-rose-300" placeholder="写一句给TA的悄悄话..."></textarea>
                        <button id="completeMyTaskBtn" onclick="saveSecretMessageAndComplete()" class="w-full py-2 bg-gradient-to-r from-emerald-400 to-teal-400 text-white text-sm font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center">
                            ✅ 标记我已完成
                        </button>
                    </div>
                    <div id="myTaskDoneText" class="hidden w-full text-center py-1.5 bg-emerald-50 text-emerald-600 rounded-full border border-emerald-100 text-xs font-bold mt-1">
                        🎉 任务已完成，悄悄话已封存！
                    </div>
                    <p class="text-rose-400 text-[10px] text-center mt-1">✨ 今日任务已抽取，已自动同步云端 ✨</p>
                </div>
                
                <!-- 对方的任务状态区 -->
                <div id="partnerStatusArea" class="mt-2 w-full max-w-xs bg-white rounded-xl p-3 shadow-sm border-2 border-rose-100 flex-shrink-0 hidden opacity-0 transition-opacity duration-500">
                    <h3 class="text-xs font-bold text-rose-500 mb-1.5 flex items-center justify-center gap-1">
                        <span>💞</span> <span id="partnerTitle">对方的任务</span>
                    </h3>
                    <div id="partnerTaskContent" class="text-center text-gray-600 text-xs bg-rose-50 rounded-xl p-2 min-h-[60px] flex items-center justify-center">
                        <span class="animate-pulse">正在悄悄看TA抽了什么... 👀</span>
                    </div>
                </div>
            </div> 

            <!-- 【视图 2】时光日历 -->
            <div id="view-calendar" class="w-full h-full flex-col items-center justify-center hidden max-w-sm animate-fade-in overflow-hidden">
                <div class="bg-white w-full rounded-2xl p-4 shadow-sm border border-rose-100 flex flex-col max-h-[85vh]">
                    <div class="flex justify-between items-center mb-3 px-1 flex-shrink-0">
                        <button onclick="changeMonth(-1)" class="p-1 hover:bg-rose-50 rounded-xl text-rose-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h3 id="calMonthYear" class="font-bold text-rose-600 text-base tracking-wide">202X年 X月</h3>
                        <button onclick="changeMonth(1)" class="p-1 hover:bg-rose-50 rounded-xl text-rose-400 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2 flex-shrink-0">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    
                    <div id="calGrid" class="grid grid-cols-7 gap-1 text-center flex-1">
                        <!-- 日历网格由 JS 填充 -->
                    </div>
                    
                    <div class="mt-3 pt-3 border-t border-rose-50 flex justify-center gap-4 text-[10px] text-gray-500 font-medium flex-shrink-0">
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 shadow-sm"></span> 已完成</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-400 shadow-sm"></span> 未完成</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-gray-200"></span> 待探索</div>
                    </div>
                </div>
            </div>

            <!-- 【视图 3】偷塞愿望 -->
            <div id="view-diy" class="w-full h-full flex-col items-center hidden max-w-sm animate-fade-in overflow-hidden">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 w-full mb-3 flex-shrink-0">
                    <h3 class="font-bold text-rose-500 mb-1 flex items-center gap-1 text-sm">
                        <span>🤫</span> 偷偷塞入新愿望
                    </h3>
                    <p class="text-[10px] text-gray-400 mb-3 leading-relaxed">写下的愿望将有 <span class="font-bold text-rose-400">30%</span> 概率被TA当作专属任务抽出！</p>
                    
                    <textarea id="diyInput" rows="2" class="w-full p-2.5 border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 resize-none text-xs text-gray-700 placeholder-rose-300 mb-3" placeholder="写下你想让TA为你做的一件事..."></textarea>
                    
                    <button onclick="submitDiy(event)" class="w-full py-2 bg-gradient-to-r from-purple-400 to-pink-500 text-white font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-xs flex justify-center items-center">
                        悄悄放入卡池 ✨
                    </button>
                </div>

                <div class="w-full text-left mb-1 px-2 flex-shrink-0">
                    <h3 class="text-xs font-bold text-gray-600 flex items-center gap-1">
                        <span>📝</span> 我塞过的愿望
                    </h3>
                </div>
                
                <!-- 列表改为局部滚动，防止外部页面被撑开 -->
                <div id="diyList" class="w-full flex-1 overflow-y-auto no-scrollbar space-y-2 pb-2">
                    <!-- 列表由 JS 渲染 -->
                </div>
            </div>

        </div> 
        
        <div class="mt-2 text-center flex-shrink-0 pb-2">
            <a href="index.html" class="text-gray-400 text-[10px] underline hover:text-rose-400 transition-colors block mb-1">
                返回首页 (当前: <span id="currentIdentityLabel">-</span>)
            </a>
        </div>
    </main>

    <!-- 历史记录详情弹窗不变 -->
    <div id="historyModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl w-full max-w-sm max-h-[85vh] shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col" id="historyModalContent">
            <!-- 头部区 -->
            <div class="p-4 border-b border-rose-100 flex justify-between items-center bg-rose-50/50 rounded-t-3xl shrink-0">
                <h3 class="font-bold text-rose-600 text-base" id="historyModalDate">📅 回忆</h3>
                <button onclick="closeHistory()" class="text-gray-400 hover:text-rose-500 bg-white rounded-full p-1 shadow-sm transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- 内容滚动区 -->
            <div class="p-4 overflow-y-auto no-scrollbar space-y-3" id="historyModalBody">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2 rounded-full shadow-lg text-xs font-medium hidden z-[60] whitespace-nowrap"></div>
    <input type="text" id="clipboardInput" class="hidden absolute -left-9999">

    <!-- Script 部分保持完全一致，不需要改动 -->
    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; 
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        document.getElementById('copyBtnText').innerText = `复制发给${partnerIdentity} 💬`;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_H = 'data/h.json'; 
        const FILE_Q = 'data/q.json'; 
        const FILE_TASKS = 'data/mrrw.json'; 

        let isFlipped = false, currentTaskText = "", isAnimating = false, isLoading = true; 
        let dataH = {}, dataQ = {}, shaH = null, shaQ = null;
        let dataTasks = [], shaTasks = null; 
        
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        
        let pollInterval = null;
        let currentCalYear = now.getFullYear();
        let currentCalMonth = now.getMonth();

        window.onload = async function() {
            await fetchAllData(false);
            if(myIdentity) { 
                renderUI(); 
                startPolling(); 
                renderCalendar(); 
            }
        };

        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (response.status === 404) return { data: {}, sha: null }; 
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(contentStr || '{}'), sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (!response.ok) return { success: false, sha: sha };
                
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        async function fetchAllData(isBg = false) {
            if (!isBg) { isLoading = true; if (!isFlipped) document.getElementById('cardFrontText').innerText = "加载中..."; }
            
            const [resH, resQ, resTasks] = await Promise.all([fetchFile(FILE_H), fetchFile(FILE_Q), fetchFile(FILE_TASKS)]);
            
            if (resH.authError || resQ.authError || resTasks.authError) { showToast("Token失效，请重新登录"); setTimeout(()=>window.location.href='index.html', 1500); return false; }
            if (resH.error || resQ.error || resTasks.error) {
                if (!isBg) showToast("读取云端数据失败！"); isLoading = false;
                if (!isFlipped) document.getElementById('cardFrontText').innerText = "点击抽取"; return false;
            }
            
            dataH = resH.data; shaH = resH.sha; 
            dataQ = resQ.data; shaQ = resQ.sha;
            
            dataTasks = Array.isArray(resTasks.data) ? resTasks.data : [];
            shaTasks = resTasks.sha;

            if (!isBg) { isLoading = false; if (!isFlipped) document.getElementById('cardFrontText').innerText = "点击抽取"; }
            return true;
        }

        function switchTab(tab) {
            ['draw', 'calendar', 'diy'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                view.classList.add('hidden');
                view.classList.remove('flex');
                
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('bg-rose-500', 'text-white', 'shadow');
                btn.classList.add('text-rose-500', 'hover:bg-rose-100');
            });
            
            const activeView = document.getElementById(`view-${tab}`);
            activeView.classList.remove('hidden');
            activeView.classList.add('flex');
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('bg-rose-500', 'text-white', 'shadow');
            activeBtn.classList.remove('text-rose-500', 'hover:bg-rose-100');

            if (tab === 'calendar') {
                renderCalendar();
                fetchAllData(true).then(()=>renderCalendar());
            }
            if (tab === 'diy') {
                renderDiyList();
                fetchAllData(true).then(()=>renderDiyList());
            }
        }

        function renderUI() {
            const myTodayData = myIdentity === '哼哼' ? dataH[todayStr] : dataQ[todayStr];
            const partnerTodayData = myIdentity === '哼哼' ? dataQ[todayStr] : dataH[todayStr];

            if (myTodayData && !isFlipped) {
                renderFlippedCard(myTodayData, false); document.getElementById('cardFrontText').innerText = "今日已抽取";
            } else if (!isFlipped) {
                document.getElementById('cardFrontText').innerText = "点击抽取";
            }

            if (isFlipped && myTodayData) {
                const actionArea = document.getElementById('myTaskActionArea'), doneText = document.getElementById('myTaskDoneText');
                if (myTodayData.myTaskCompleted) { actionArea.classList.add('hidden'); doneText.classList.remove('hidden'); }
                else { actionArea.classList.remove('hidden'); doneText.classList.add('hidden'); }
            }
            updatePartnerUI(partnerTodayData);
        }

        function startPolling() { 
            if (pollInterval) clearInterval(pollInterval); 
            pollInterval = setInterval(async () => { 
                if(await fetchAllData(true)) {
                    renderUI();
                    if(document.getElementById('view-calendar').classList.contains('flex')) renderCalendar();
                    if(document.getElementById('view-diy').classList.contains('flex')) renderDiyList();
                } 
            }, 60000); 
        }

        function updatePartnerUI(pTask) {
            const area = document.getElementById('partnerStatusArea'), title = document.getElementById('partnerTitle'), content = document.getElementById('partnerTaskContent');
            area.classList.remove('hidden', 'opacity-0'); title.innerText = `${partnerIdentity} 今日的任务`;
            
            if (pTask) {
                let msgHtml = pTask.myTaskCompleted ? 
                    `<div class="mt-2 w-full bg-emerald-50 text-emerald-600 text-[10px] p-2 rounded-lg border border-emerald-100 text-left animate-fade-in relative"><div class="absolute -top-1.5 left-2 bg-emerald-100 text-emerald-600 text-[8px] px-1.5 rounded-full font-bold">留下的悄悄话</div><span class="break-words mt-1 block">${pTask.secretMessage || "TA害羞没有留悄悄话~"}</span></div>` : 
                    `<div class="mt-2 w-full bg-gray-50 text-gray-400 text-[10px] p-1.5 rounded-lg border border-gray-100 flex items-center justify-center gap-1">🔒 <span>待解锁...</span></div>`;
                
                let diyTag = pTask.isDIY ? `<span class="text-[9px] font-bold text-white mb-1 bg-gradient-to-r from-purple-400 to-pink-400 px-1.5 py-0.5 rounded-full shadow-sm ml-1">专属愿望✨</span>` : `<span class="text-[9px] font-bold text-rose-400 mb-1 bg-white px-1.5 py-0.5 rounded-full border border-rose-100 ml-1">【${pTask.category}】</span>`;

                content.innerHTML = `<div class="flex flex-col items-center justify-center p-1 w-full animate-fade-in"><span class="text-2xl mb-1">${pTask.emoji}</span><div class="flex items-center justify-center">${diyTag}</div><span class="font-medium text-gray-700 leading-snug mt-1 block w-full text-[11px]">${pTask.text}</span>${msgHtml}</div>`;
                content.classList.remove('animate-pulse');
            } else {
                content.innerHTML = `<span class="animate-pulse block py-2 text-gray-500">TA还没抽卡哦 👀</span>`; content.classList.add('animate-pulse');
            }
        }

        async function drawCard() {
            if (isLoading) { showToast("正在同步数据，请稍等..."); return; }
            if (isAnimating || isFlipped) return;
            isAnimating = true; isLoading = true; document.getElementById('cardFrontText').innerText = "生成中...";

            if (!(await fetchAllData(true))) { isAnimating = false; isLoading = false; return; }
            
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            let mySha = myIdentity === '哼哼' ? shaH : shaQ;
            const myPath = myIdentity === '哼哼' ? FILE_H : FILE_Q;
            const partnerData = myIdentity === '哼哼' ? dataQ : dataH;

            if (myData[todayStr]) {
                renderFlippedCard(myData[todayStr], true); renderUI();
                isAnimating = false; isLoading = false; document.getElementById('cardFrontText').innerText = "今日已抽取"; return;
            }

            const partnerDIYs = partnerData['DIY_TASKS'] || [];
            const myUsedDIYs = myData['USED_DIY'] || [];
            const availableDIYs = partnerDIYs.filter(t => !myUsedDIYs.includes(t.id));

            let taskObj;
            let pickedIndex = -1; 

            if (availableDIYs.length > 0 && Math.random() < 0.3) {
                const pickedDIY = availableDIYs[Math.floor(Math.random() * availableDIYs.length)];
                taskObj = JSON.parse(JSON.stringify(pickedDIY)); 
                taskObj.isDIY = true;
                
                if(!myData['USED_DIY']) myData['USED_DIY'] = [];
                myData['USED_DIY'].push(taskObj.id);
            } else {
                if (dataTasks.length === 0) {
                    showToast("日常任务池已经被你们抽空啦！快去补充吧~");
                    isAnimating = false; isLoading = false;
                    document.getElementById('cardFrontText').innerText = "点击抽取"; 
                    return;
                }
                
                pickedIndex = Math.floor(Math.random() * dataTasks.length);
                const pickedNormal = dataTasks[pickedIndex];
                taskObj = JSON.parse(JSON.stringify(pickedNormal));
            }

            taskObj.myTaskCompleted = false; 
            taskObj.secretMessage = "";
            myData[todayStr] = taskObj; 
            
            const upRes = await updateFile(myPath, myData, mySha);
            
            if (upRes.success) { 
                if (myIdentity === '哼哼') shaH = upRes.sha; else shaQ = upRes.sha; 
                
                if (pickedIndex !== -1) {
                    dataTasks.splice(pickedIndex, 1);
                    const upResTasks = await updateFile(FILE_TASKS, dataTasks, shaTasks);
                    if (upResTasks.success) {
                        shaTasks = upResTasks.sha; 
                    }
                }
                
                renderFlippedCard(taskObj, true); 
                renderUI(); 
            } else {
                showToast("抽取失败，请重新点击抽取！");
                delete myData[todayStr]; 
                document.getElementById('cardFrontText').innerText = "点击抽取";
            }
            
            isAnimating = false; 
            isLoading = false;
        }

        function renderFlippedCard(task, animate) {
            currentTaskText = task.text; 
            
            const catElem = document.getElementById('cardCategory');
            if(task.isDIY) {
                catElem.innerText = '✨专属愿望✨';
                catElem.className = "inline-block px-2 py-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-full text-[10px] font-bold mb-2 shadow-sm";
                document.getElementById('cardNumber').innerText = `🤫 偷偷塞给你的`;
            } else {
                catElem.innerText = task.category;
                catElem.className = "inline-block px-2 py-1 bg-rose-100 text-rose-600 rounded-full text-[10px] font-bold mb-2";
                document.getElementById('cardNumber').innerText = `#${task.id ? task.id.toString().padStart(3, '0') : '000'}`;
            }
            
            document.getElementById('cardEmoji').innerText = task.emoji;
            document.getElementById('cardText').innerText = task.text; 

            const cardInner = document.getElementById('cardInner'); isFlipped = true;
            if (animate) {
                cardInner.classList.add('rotate-y-180');
                setTimeout(() => { document.getElementById('actionButtons').classList.remove('opacity-0', 'pointer-events-none'); isAnimating = false; }, 600);
            } else {
                cardInner.style.transition = 'none'; cardInner.classList.add('rotate-y-180'); void cardInner.offsetWidth; cardInner.style.transition = ''; 
                document.getElementById('actionButtons').classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        async function saveSecretMessageAndComplete() {
            const btn = document.getElementById('completeMyTaskBtn'), msg = document.getElementById('mySecretInput').value.trim();
            btn.innerHTML = `封存中...`; 
            btn.disabled = true;

            const myData = myIdentity === '哼哼' ? dataH : dataQ, myPath = myIdentity === '哼哼' ? FILE_H : FILE_Q;
            let mySha = myIdentity === '哼哼' ? shaH : shaQ;

            if (myData[todayStr]) {
                myData[todayStr].myTaskCompleted = true; myData[todayStr].secretMessage = msg;
                const upRes = await updateFile(myPath, myData, mySha);
                if (upRes.success) {
                    if (myIdentity === '哼哼') shaH = upRes.sha; else shaQ = upRes.sha;
                    showToast("已标记完成！悄悄话已封存💌"); renderUI(); 
                } else { showToast("保存失败"); myData[todayStr].myTaskCompleted = false; }
            }
            btn.innerHTML = "✅ 标记完成"; btn.disabled = false;
        }

        function changeMonth(delta) {
            currentCalMonth += delta;
            if(currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
            if(currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calMonthYear').innerText = `${currentCalYear}年 ${currentCalMonth + 1}月`;
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            
            const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
            const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
            
            for(let i=0; i<firstDay; i++) {
                grid.innerHTML += `<div></div>`;
            }
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            for(let i=1; i<=daysInMonth; i++) {
                const cellDate = new Date(currentCalYear, currentCalMonth, i);
                const dateStr = `${currentCalYear}-${String(currentCalMonth+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                let dH = dataH[dateStr];
                let dQ = dataQ[dateStr];
                
                let statusHtml = '';
                let isFuture = cellDate > today;
                let cellClass = "w-full aspect-square flex flex-col items-center justify-center rounded-lg border transition-all ";
                
                if (isFuture) {
                    cellClass += "text-gray-300 border-transparent bg-gray-50/30";
                } else {
                    if (dH || dQ) {
                        cellClass += "border-rose-100 bg-white hover:bg-rose-50 hover:-translate-y-0.5 shadow-sm cursor-pointer";
                        let hCompleted = dH ? dH.myTaskCompleted : false;
                        let qCompleted = dQ ? dQ.myTaskCompleted : false;
                        
                        if(dH && dQ && hCompleted && qCompleted) {
                            statusHtml = `<div class="flex gap-0.5 mt-0.5"><span class="w-1 h-1 bg-emerald-400 rounded-full"></span><span class="w-1 h-1 bg-emerald-400 rounded-full"></span></div>`;
                        } else {
                            statusHtml = `<div class="flex gap-0.5 mt-0.5">
                                <span class="w-1 h-1 rounded-full ${dH ? (hCompleted?'bg-emerald-400':'bg-rose-400') : 'bg-gray-200'}"></span>
                                <span class="w-1 h-1 rounded-full ${dQ ? (qCompleted?'bg-emerald-400':'bg-rose-400') : 'bg-gray-200'}"></span>
                            </div>`;
                        }
                    } else {
                        cellClass += "border-transparent text-gray-400 cursor-pointer hover:bg-gray-50";
                    }
                }

                let isToday = dateStr === todayStr;
                let todayMark = isToday ? `<div class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-rose-500 border border-white rounded-full"></div>` : '';
                let dateNumClass = (isToday && !(dH||dQ)) ? "font-bold text-rose-500" : "font-medium";

                grid.innerHTML += `
                    <div class="${cellClass} relative" ${isFuture ? '' : `onclick="showHistory('${dateStr}')"`}>
                        ${todayMark}
                        <span class="${dateNumClass} text-xs">${i}</span>
                        ${statusHtml}
                    </div>
                `;
            }
        }

        function showHistory(dateStr) {
            const dH = dataH[dateStr];
            const dQ = dataQ[dateStr];
            if (!dH && !dQ) {
                showToast("这一天没有记录哦~");
                return;
            }
            
            document.getElementById('historyModalDate').innerText = `📅 ${dateStr} 回忆`;
            
            let html = '';
            html += renderHistoryCard('哼哼', dH, myIdentity === '哼哼');
            html += renderHistoryCard('亲亲', dQ, myIdentity === '亲亲');

            document.getElementById('historyModalBody').innerHTML = html;
            
            const modal = document.getElementById('historyModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('historyModalContent').classList.remove('scale-95');
            }, 10);
        }

        function renderHistoryCard(owner, taskObj, isMe) {
            if (!taskObj) return `<div class="bg-gray-50 rounded-xl p-3 text-center text-xs text-gray-400 border border-gray-100 border-dashed">${owner} 这天没有抽卡</div>`;
            
            let diyTag = taskObj.isDIY ? `<span class="inline-block px-1.5 py-0.5 bg-gradient-to-r from-purple-400 to-pink-400 text-white text-[9px] rounded-full ml-1.5 shadow-sm font-bold">专属愿望✨</span>` : '';
            
            let secretHtml = '';
            if (taskObj.myTaskCompleted) {
                let msg = taskObj.secretMessage || "TA害羞没有留悄悄话~";
                secretHtml = `
                    <div class="mt-3 bg-emerald-50 rounded-lg p-2 border border-emerald-100 relative">
                        <div class="absolute -top-2 left-3 bg-emerald-100 text-emerald-700 text-[9px] px-2 py-0.5 rounded-full font-bold shadow-sm border border-emerald-50">留下的悄悄话</div>
                        <p class="text-xs text-emerald-700 mt-1">${msg}</p>
                    </div>
                `;
            } else {
                secretHtml = `
                    <div class="mt-3 bg-gray-50 rounded-lg p-2 border border-gray-100 text-center">
                        <span class="text-[10px] text-gray-400 flex items-center justify-center gap-1">🔒 任务未完成，悄悄话未解锁</span>
                    </div>
                `;
            }

            let statusTag = taskObj.myTaskCompleted ? 
                `<span class="text-[9px] text-emerald-500 font-bold flex items-center bg-emerald-50 px-1.5 py-0.5 rounded-full"><svg class="w-2.5 h-2.5 mr-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg> 已完成</span>` : 
                `<span class="text-[9px] text-rose-400 font-bold flex items-center bg-rose-50 px-1.5 py-0.5 rounded-full">○ 待完成</span>`;

            return `
                <div class="border ${isMe ? 'border-rose-200 bg-rose-50/40' : 'border-blue-200 bg-blue-50/40'} rounded-xl p-3 shadow-sm relative overflow-hidden transition-all">
                    <div class="flex justify-between items-center mb-2">
                        <div class="font-bold text-xs ${isMe ? 'text-rose-500' : 'text-blue-500'} flex items-center">
                            <span class="bg-white rounded-full p-0.5 mr-1 shadow-sm">${isMe ? '🐰' : '🐱'}</span>
                            ${owner} ${diyTag}
                        </div>
                        ${statusTag}
                    </div>
                    
                    <div class="flex items-start gap-2 mt-1 bg-white/60 p-2 rounded-lg">
                        <div class="text-2xl">${taskObj.emoji}</div>
                        <div class="flex-1">
                            <span class="text-[9px] font-bold text-gray-500 bg-white px-1.5 py-0.5 rounded-full border border-gray-200 mb-1 inline-block shadow-sm">${taskObj.category}</span>
                            <p class="text-xs text-gray-700 font-medium leading-relaxed">${taskObj.text}</p>
                        </div>
                    </div>
                    ${secretHtml}
                </div>
            `;
        }

        function closeHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.add('opacity-0');
            document.getElementById('historyModalContent').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function submitDiy(event) {
            const input = document.getElementById('diyInput');
            const text = input.value.trim();
            if(!text) { showToast("愿望内容不能为空哦~"); return; }
            
            const btn = event.currentTarget;
            const oldText = btn.innerHTML;
            btn.innerHTML = `塞入中...`;
            btn.disabled = true;

            await fetchAllData(true); 
            
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            const myPath = myIdentity === '哼哼' ? FILE_H : FILE_Q;
            let mySha = myIdentity === '哼哼' ? shaH : shaQ;
            
            if(!myData['DIY_TASKS']) myData['DIY_TASKS'] = [];
            
            const newTask = {
                id: 'diy_' + Date.now(),
                category: "专属愿望",
                emoji: "✨",
                text: text
            };
            
            myData['DIY_TASKS'].push(newTask);
            
            const upRes = await updateFile(myPath, myData, mySha);
            if(upRes.success) {
                if(myIdentity === '哼哼') shaH = upRes.sha; else shaQ = upRes.sha;
                showToast("成功塞入愿望池！🤫");
                input.value = '';
                renderDiyList();
            } else {
                showToast("保存失败，请重试");
                myData['DIY_TASKS'].pop(); 
            }
            
            btn.innerHTML = oldText;
            btn.disabled = false;
        }

        function renderDiyList() {
            const listContainer = document.getElementById('diyList');
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            const diys = myData['DIY_TASKS'] || [];
            const partnerData = myIdentity === '哼哼' ? dataQ : dataH;
            const partnerUsed = partnerData['USED_DIY'] || [];
            
            if(diys.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 text-[10px] py-6 bg-white/50 rounded-xl border border-gray-200 border-dashed">还没有塞入过愿望哦<br><span class="mt-1 inline-block">快给TA制造一点小惊喜吧~</span></div>`;
                return;
            }
            
            let html = '';
            [...diys].reverse().forEach(task => {
                const isDrawn = partnerUsed.includes(task.id);
                const statusHtml = isDrawn ? 
                    `<span class="text-[9px] bg-emerald-100 text-emerald-600 px-1.5 py-0.5 rounded-full font-bold border border-emerald-200">TA已抽中 🎉</span>` : 
                    `<span class="text-[9px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full border border-gray-200">潜伏中 🤫</span>`;
                    
                const dateCreated = new Date(parseInt(task.id.split('_')[1]));
                const dateStr = `${dateCreated.getMonth()+1}月${dateCreated.getDate()}日`;
                    
                html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-rose-50 flex items-start gap-2 relative overflow-hidden transition-all">
                        ${isDrawn ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-400"></div>' : '<div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-200"></div>'}
                        <div class="text-xl pt-0.5 ml-1">✨</div>
                        <div class="flex-1">
                            <p class="text-xs text-gray-700 font-medium mb-1.5 leading-snug">${task.text}</p>
                            <div class="flex items-center justify-between">
                                <span class="text-[9px] text-gray-400 font-medium">${dateStr} 塞入</span>
                                ${statusHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.remove('hidden'); toast.classList.add('toast-animate'); setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3000); }
        function copyTask() {
            const txt = `【今日心动任务】\n${currentTaskText}\n\n—— ${partnerIdentity}，这是我们今天要一起做的事哦！`;
            const input = document.getElementById('clipboardInput'); input.value = txt; input.classList.remove('hidden'); input.select(); document.execCommand('copy'); input.classList.add('hidden'); showToast("复制成功！");
        }
    </script>
</body>
</html>
