<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>默契大考验 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05), 0 2px 4px -1px rgba(225, 29, 72, 0.03);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 relative">
    
    <!-- 全局加载遮罩 -->
    <div id="globalLoader" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <svg class="animate-spin h-10 w-10 text-rose-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-rose-600 font-medium" id="loaderText">正在同步数据...</span>
    </div>

    <header class="text-center w-full max-w-md animate-float mt-2 mb-4">
        <h1 class="text-3xl font-bold text-rose-500 mb-1 drop-shadow-sm flex items-center justify-center gap-2">
            <span>✨</span> 默契大考验 <span>✨</span>
        </h1>
        <p class="text-rose-400 text-sm">有多懂彼此？测测就知道！</p>
    </header>

    <div class="w-full max-w-md glass-panel rounded-2xl p-4 mb-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-rose-200 to-pink-300 flex items-center justify-center text-xl shadow-sm border-2 border-white">
                <span id="myAvatar">🐰</span>
            </div>
            <div>
                <div class="text-xs text-gray-500 mb-0.5">我的身份</div>
                <div class="font-bold text-rose-600" id="myIdentityName">加载中...</div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-500 mb-0.5">我的积分 🪙</div>
            <div class="font-black text-2xl text-amber-500 drop-shadow-sm flex items-center justify-end gap-1">
                <span id="myPoints">--</span>
            </div>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <div class="flex bg-white/70 p-1.5 rounded-full mb-6 w-full shadow-sm border border-rose-200 backdrop-blur-sm gap-1 relative z-10">
            <button id="tab-ask" class="flex-1 py-2 text-sm font-bold rounded-full bg-rose-500 text-white shadow-md transition-all flex justify-center items-center gap-1" onclick="switchTab('ask')">
                <span>🤔</span> 我来提问
            </button>
            <button id="tab-answer" class="flex-1 py-2 text-sm font-bold rounded-full text-rose-500 hover:bg-rose-100 transition-all flex justify-center items-center gap-1 relative" onclick="switchTab('answer')">
                <span>🎯</span> 我来回答
                <!-- 未答红点 -->
                <span id="pendingBadge" class="absolute top-1 right-3 flex h-2.5 w-2.5 hidden">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
                </span>
            </button>
        </div>

        <div class="w-full relative min-h-[500px] flex justify-center pb-10">
            
            <div id="view-ask" class="w-full flex flex-col items-center transition-opacity duration-300">
                
                <div class="w-full glass-panel p-5 rounded-2xl mb-6 relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 text-6xl opacity-10 rotate-12">❓</div>
                    <h3 class="font-bold text-rose-600 mb-4 flex items-center gap-2">
                        <span class="bg-rose-100 text-rose-500 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span> 
                        出一道题考考TA
                    </h3>
                    
                    <div class="space-y-4 relative z-10">
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-1 block">问题内容 (消耗 1 积分)</label>
                            <textarea id="qInput" rows="2" class="w-full px-4 py-3 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 bg-white/80 resize-none" placeholder="例如：我最喜欢喝的奶茶是哪家？"></textarea>
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-emerald-600 mb-1 block">👉 正确答案 (TA选对TA得2分)</label>
                            <input type="text" id="aCorrect" class="w-full px-4 py-2 text-sm border-2 border-emerald-100 rounded-xl focus:outline-none focus:border-emerald-400 bg-emerald-50/30 text-emerald-800" placeholder="写下真实答案">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-bold text-gray-400 mb-1 block">迷惑选项 1</label>
                                <input type="text" id="aWrong1" class="w-full px-3 py-2 text-sm border-2 border-gray-100 rounded-xl focus:outline-none focus:border-rose-300" placeholder="干扰项">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-400 mb-1 block">迷惑选项 2</label>
                                <input type="text" id="aWrong2" class="w-full px-3 py-2 text-sm border-2 border-gray-100 rounded-xl focus:outline-none focus:border-rose-300" placeholder="干扰项">
                            </div>
                        </div>
                        
                        <button onclick="submitQuestion()" class="w-full mt-2 py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center gap-2">
                            <span>💸 花费 1 积分发布</span>
                        </button>
                    </div>
                </div>

                <div class="w-full text-left mb-2 px-1 flex justify-between items-end">
                    <h3 class="text-sm font-bold text-gray-600 flex items-center gap-1.5">
                        <span>📝</span> 我出过的题
                    </h3>
                </div>
                <div id="myQuestionsList" class="w-full space-y-3">
                    <!-- 由 JS 渲染 -->
                </div>
            </div> 

            <div id="view-answer" class="w-full flex-col items-center hidden animate-fade-in">
                
                <div class="w-full glass-panel p-5 rounded-2xl mb-6 flex flex-col items-center justify-center min-h-[120px]" id="partnerEmptyState">
                    <span class="text-3xl mb-2">🍃</span>
                    <p class="text-gray-400 text-sm font-medium">TA还没有给你出题哦~</p>
                    <p class="text-gray-400 text-xs mt-1">去提醒TA一下吧！</p>
                </div>

                <div id="partnerQuestionsArea" class="w-full hidden flex-col w-full">
                    <div class="w-full text-left mb-3 px-1">
                        <h3 class="text-sm font-bold text-rose-600 flex items-center gap-1.5">
                            <span class="animate-bounce">💌</span> 待你挑战的默契题
                        </h3>
                    </div>
                    <div id="pendingList" class="w-full space-y-3 mb-8">
                        <!-- 由 JS 渲染 -->
                    </div>
                </div>

                <div class="w-full text-left mb-3 px-1 mt-4">
                    <h3 class="text-sm font-bold text-gray-500 flex items-center gap-1.5">
                        <span>📜</span> 我的作答记录
                    </h3>
                </div>
                <div id="answeredList" class="w-full space-y-3">
                    <!-- 由 JS 渲染 -->
                </div>
            </div>

        </div> 
    </main>

    <div id="answerModal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md mx-auto shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 flex flex-col overflow-hidden" id="answerModalContent">
            
            <div class="p-6 pb-2 relative">
                <button onclick="closeAnswerModal()" class="absolute top-4 right-4 text-gray-300 hover:text-gray-500 bg-gray-50 rounded-full p-1.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div class="text-xs font-bold text-rose-500 bg-rose-50 inline-block px-2.5 py-1 rounded-full mb-3">挑战开始 ⚔️</div>
                <h3 class="font-bold text-gray-800 text-lg leading-snug mb-1" id="modalQText">问题加载中...</h3>
                <p class="text-xs text-gray-400 mb-4">💡 答对你得 <span class="text-emerald-500 font-bold">+2分</span>，答错TA得 <span class="text-rose-500 font-bold">+2分</span></p>
            </div>
            
            <div class="p-6 pt-2 bg-gray-50 flex-1">
                <div class="space-y-3" id="modalOptions">
                    <!-- 选项按钮由JS渲染 -->
                </div>
                <div class="mt-6 text-center">
                    <button id="confirmAnswerBtn" disabled class="w-full py-3.5 bg-gray-300 text-white font-bold rounded-xl shadow-sm transition-all text-sm flex justify-center items-center disabled:opacity-70 disabled:cursor-not-allowed">
                        请先选择一个答案
                    </button>
                    <p class="text-[10px] text-gray-400 mt-2">确认提交将扣除 1 积分</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果展示弹窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl w-full max-w-[300px] p-6 flex flex-col items-center text-center transform scale-95 transition-transform duration-300" id="resultModalContent">
            <div id="resultIcon" class="text-6xl mb-3 animate-bounce">🎉</div>
            <h2 id="resultTitle" class="text-xl font-bold mb-2 text-emerald-500">回答正确！</h2>
            <p id="resultDesc" class="text-sm text-gray-500 mb-6">默契满满，积分 +2 🪙</p>
            <button onclick="closeResultModal()" class="w-full py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors text-sm">
                知道啦
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <script>
        // --- 1. 配置与身份验证 ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity'); // '哼哼' 或 '亲亲'

        if (!GITHUB_TOKEN || !myIdentity) {
            // 如果没有登录信息，提示并模拟退出
            document.body.innerHTML = '<div class="flex h-screen items-center justify-center text-rose-500 font-bold text-center p-4">未检测到登录信息，请从原系统登录。<br><br>为了演示，本页面将强行赋予 "哼哼" 身份体验。</div>';
            setTimeout(() => {
                localStorage.setItem('loveGacha_githubToken', 'DEMO_TOKEN');
                localStorage.setItem('loveGacha_myIdentity', '哼哼');
                window.location.reload();
            }, 2000);
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('myIdentityName').innerText = myIdentity;
        document.getElementById('myAvatar').innerText = myIdentity === '哼哼' ? '🐰' : '🐱';
        
        // 仓库配置
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_H = 'data/hck.json'; 
        const FILE_Q = 'data/qck.json'; 
        
        const myPath = myIdentity === '哼哼' ? FILE_H : FILE_Q;
        const partnerPath = myIdentity === '哼哼' ? FILE_Q : FILE_H;

        // 全局状态
        let myData = { points: 20, questions: [], answered: [] };
        let partnerData = { points: 20, questions: [], answered: [] };
        let mySha = null;
        let partnerSha = null;
        
        let currentAnsweringQId = null;
        let selectedOption = null;

        // --- 2. 初始化与数据加载 ---
        window.onload = async function() {
            showLoader("正在连接默契神经元...");
            await fetchAllData();
            hideLoader();
            renderUI();
        };

        // 简化的GitHub API读取
        async function fetchFile(filePath) {
            try {
                const ts = new Date().getTime();
                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${ts}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (res.status === 404) return { data: { points: 20, questions: [], answered: [] }, sha: null }; 
                if (!res.ok) throw new Error('API Error');
                
                const result = await res.json();
                const content = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(content || '{}'), sha: result.sha };
            } catch (e) {
                // 本地Demo模式后备方案（当真实的Token无效时，使用内存数据演示）
                console.warn("读取失败，使用本地测试数据", e);
                return { 
                    data: { points: 20, questions: [], answered: [] }, 
                    sha: 'mock_sha_' + Math.random() 
                };
            }
        }

        // 简化的GitHub API写入
        async function updateFile(filePath, dataObj, sha) {
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))); 
                const body = { message: `Tacit update ${new Date().getTime()}`, content: content };
                if (sha && !sha.startsWith('mock_sha')) body.sha = sha;

                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', 
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('Update failed');
                const result = await res.json();
                return { success: true, sha: result.content.sha };
            } catch (e) {
                console.warn("保存失败，本地模拟成功", e);
                // 模拟成功以便在无真实Token下演示
                return { success: true, sha: 'mock_sha_' + Math.random() };
            }
        }

        async function fetchAllData() {
            const [me, partner] = await Promise.all([fetchFile(myPath), fetchFile(partnerPath)]);
            
            // 数据结构兜底
            myData = Object.assign({ points: 20, questions: [], answered: [] }, me.data);
            mySha = me.sha;
            
            partnerData = Object.assign({ points: 20, questions: [], answered: [] }, partner.data);
            partnerSha = partner.sha;
        }

        // --- 3. UI 渲染与切换 ---
        function switchTab(tab) {
            ['ask', 'answer'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`view-${t}`).classList.remove('flex');
                
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('bg-rose-500', 'text-white', 'shadow-md');
                btn.classList.add('text-rose-500', 'hover:bg-rose-100');
            });
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`view-${tab}`).classList.add('flex');
            
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('bg-rose-500', 'text-white', 'shadow-md');
            activeBtn.classList.remove('text-rose-500', 'hover:bg-rose-100');
            
            renderUI(); // 切换时刷新UI状态
        }

        function renderUI() {
            // 更新积分
            document.getElementById('myPoints').innerText = myData.points;
            
            // 渲染“我出的题” (Ask 视图)
            renderMyQuestions();
            
            // 渲染“待回答”和“已回答” (Answer 视图)
            renderPartnerQuestions();
            
            // 检查是否有未答的题，更新红点
            const pendingQs = partnerData.questions.filter(q => q.status === 'pending');
            const badge = document.getElementById('pendingBadge');
            if (pendingQs.length > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        function renderMyQuestions() {
            const list = document.getElementById('myQuestionsList');
            if (!myData.questions || myData.questions.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 text-xs py-6 bg-white/50 rounded-xl border border-rose-100 border-dashed">还没有出过题哦，快去考考TA吧~</div>`;
                return;
            }

            let html = '';
            [...myData.questions].reverse().forEach(q => {
                let statusUI = '';
                if (q.status === 'pending') {
                    statusUI = `<div class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded flex items-center gap-1">🕒 TA还未作答</div>`;
                } else if (q.status === 'correct') {
                    statusUI = `<div class="bg-emerald-50 text-emerald-600 text-xs px-2 py-1 rounded border border-emerald-100 flex flex-col items-end">
                        <span class="font-bold flex items-center gap-1">🎯 答对了！</span>
                        <span class="text-[10px] opacity-80">TA赢得了 2 积分</span>
                    </div>`;
                } else {
                    statusUI = `<div class="bg-rose-50 text-rose-500 text-xs px-2 py-1 rounded border border-rose-100 flex flex-col items-end">
                        <span class="font-bold flex items-center gap-1">❌ 答错了哈</span>
                        <span class="text-[10px] font-bold">你赢得了 2 积分 🎉</span>
                    </div>`;
                }

                let answerReveal = q.status !== 'pending' ? `
                    <div class="mt-2 text-xs border-t border-gray-100 pt-2 text-gray-500 flex justify-between">
                        <span>TA选了：<span class="font-bold ${q.status==='correct'?'text-emerald-500':'text-rose-500'}">${q.partner_choice}</span></span>
                        <span>正确答案：<span class="font-bold text-emerald-500">${q.correct}</span></span>
                    </div>
                ` : '';

                html += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-rose-50 relative overflow-hidden transition-all hover:shadow-md">
                        ${q.status==='wrong' ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-rose-400"></div>' : ''}
                        ${q.status==='correct' ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-400"></div>' : ''}
                        ${q.status==='pending' ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-300"></div>' : ''}
                        
                        <div class="pl-1 flex justify-between items-start gap-2">
                            <div class="flex-1">
                                <h4 class="text-sm font-bold text-gray-800 mb-1 leading-snug">${q.q}</h4>
                                <div class="text-[10px] text-gray-400">创建于: ${new Date(q.id).toLocaleDateString()}</div>
                            </div>
                            <div class="shrink-0 text-right">
                                ${statusUI}
                            </div>
                        </div>
                        ${answerReveal}
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function renderPartnerQuestions() {
            const pArea = document.getElementById('partnerQuestionsArea');
            const emptyState = document.getElementById('partnerEmptyState');
            const pendingList = document.getElementById('pendingList');
            const answeredList = document.getElementById('answeredList');
            
            const pendingQs = partnerData.questions.filter(q => q.status === 'pending');
            
            // 渲染待答列表
            if (pendingQs.length > 0) {
                pArea.classList.remove('hidden'); pArea.classList.add('flex');
                emptyState.classList.add('hidden');
                
                let pHtml = '';
                pendingQs.forEach(q => {
                    pHtml += `
                        <div onclick="openAnswerModal(${q.id})" class="bg-gradient-to-r from-rose-50 to-pink-50 p-4 rounded-xl shadow-sm border border-rose-200 cursor-pointer transform transition-all hover:-translate-y-1 hover:shadow-md flex items-center justify-between group">
                            <div class="flex-1 pr-3">
                                <div class="text-[10px] text-rose-400 font-bold mb-1">NEW 挑战</div>
                                <h4 class="text-sm font-bold text-gray-800 leading-snug line-clamp-2">${q.q}</h4>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-rose-500 font-bold group-hover:scale-110 transition-transform">
                                答
                            </div>
                        </div>
                    `;
                });
                pendingList.innerHTML = pHtml;
            } else {
                pArea.classList.add('hidden'); pArea.classList.remove('flex');
                emptyState.classList.remove('hidden');
            }

            // 渲染已答记录
            if (!myData.answered || myData.answered.length === 0) {
                answeredList.innerHTML = `<div class="text-center text-gray-400 text-xs py-4 bg-white/40 rounded-xl border border-gray-100">暂无作答记录</div>`;
            } else {
                let aHtml = '';
                [...myData.answered].reverse().forEach(a => {
                    aHtml += `
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-50 flex flex-col gap-1.5 opacity-80 hover:opacity-100 transition-opacity">
                            <h4 class="text-sm font-medium text-gray-700">${a.q}</h4>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500">我的选择: <span class="font-bold ${a.is_correct?'text-emerald-500':'text-rose-500'}">${a.my_choice}</span></span>
                                ${a.is_correct ? '<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded font-bold">🎯 +2分</span>' : '<span class="bg-gray-100 text-gray-400 px-2 py-0.5 rounded">❌ 未加分</span>'}
                            </div>
                        </div>
                    `;
                });
                answeredList.innerHTML = aHtml;
            }
        }

        async function submitQuestion() {
            const q = document.getElementById('qInput').value.trim();
            const aC = document.getElementById('aCorrect').value.trim();
            const aW1 = document.getElementById('aWrong1').value.trim();
            const aW2 = document.getElementById('aWrong2').value.trim();

            if (!q || !aC || !aW1) {
                showToast("请至少填写问题、正确答案和1个迷惑选项哦~"); return;
            }
            if (myData.points < 1) {
                showToast("积分不足啦，先去答题赚积分吧！"); return;
            }

            showLoader("正在发布问题...");
            
            // 准备数据
            const newQ = {
                id: Date.now(),
                q: q,
                correct: aC,
                wrongs: [aW1, aW2].filter(x => x !== ""), // 过滤空的
                status: 'pending',
                partner_choice: ''
            };

            // 扣分并添加记录
            myData.points -= 1;
            myData.questions.push(newQ);

            // 上传
            const upRes = await updateFile(myPath, myData, mySha);
            hideLoader();

            if (upRes.success) {
                mySha = upRes.sha;
                showToast("发布成功！消耗 1 积分");
                
                // 清空表单
                document.getElementById('qInput').value = '';
                document.getElementById('aCorrect').value = '';
                document.getElementById('aWrong1').value = '';
                document.getElementById('aWrong2').value = '';
                
                renderUI();
            } else {
                showToast("发布失败，请重试");
                myData.points += 1; // 恢复
                myData.questions.pop();
            }
        }

        function openAnswerModal(qId) {
            const q = partnerData.questions.find(x => x.id === qId);
            if (!q) return;
            
            if (myData.points < 1) {
                showToast("积分不足！回答需要 1 积分哦~"); return;
            }

            currentAnsweringQId = qId;
            selectedOption = null;
            
            document.getElementById('modalQText').innerText = q.q;
            
            // 组合并打乱选项
            let options = [q.correct, ...q.wrongs];
            options = options.sort(() => Math.random() - 0.5);

            const optContainer = document.getElementById('modalOptions');
            optContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "opt-btn w-full p-4 text-left bg-white border-2 border-gray-100 rounded-xl font-medium text-gray-700 transition-all focus:outline-none";
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, opt);
                optContainer.appendChild(btn);
            });

            const confirmBtn = document.getElementById('confirmAnswerBtn');
            confirmBtn.disabled = true;
            confirmBtn.className = "w-full py-3.5 bg-gray-300 text-white font-bold rounded-xl shadow-sm transition-all text-sm flex justify-center items-center disabled:opacity-70 disabled:cursor-not-allowed";
            confirmBtn.innerHTML = "请先选择一个答案";
            confirmBtn.onclick = () => submitAnswer(q);

            const modal = document.getElementById('answerModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('answerModalContent').classList.remove('translate-y-full', 'sm:scale-95');
                document.getElementById('answerModalContent').classList.add('translate-y-0', 'sm:scale-100');
            }, 10);
        }

        function selectOption(btnEl, optText) {
            selectedOption = optText;
            
            // 重置所有按钮样式
            document.querySelectorAll('.opt-btn').forEach(b => {
                b.classList.remove('border-rose-400', 'bg-rose-50', 'text-rose-600', 'shadow-sm');
                b.classList.add('border-gray-100', 'bg-white', 'text-gray-700');
            });
            
            // 选中当前
            btnEl.classList.remove('border-gray-100', 'bg-white', 'text-gray-700');
            btnEl.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-600', 'shadow-sm');

            const confirmBtn = document.getElementById('confirmAnswerBtn');
            confirmBtn.disabled = false;
            confirmBtn.className = "w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center";
            confirmBtn.innerHTML = "确定提交 (扣除 1 积分)";
        }

        function closeAnswerModal() {
            const modal = document.getElementById('answerModal');
            modal.classList.add('opacity-0');
            document.getElementById('answerModalContent').classList.add('translate-y-full');
            document.getElementById('answerModalContent').classList.remove('translate-y-0', 'sm:scale-100');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function submitAnswer(q) {
            if (!selectedOption) return;
            
            closeAnswerModal();
            showLoader("正在校验默契度...");

            const isCorrect = (selectedOption === q.correct);
            
            // 1. 扣除答题费
            myData.points -= 1; 
            
            // 2. 结算奖励 & 更新状态
            if (isCorrect) {
                myData.points += 2; // 答对，我+2
                q.status = 'correct';
            } else {
                partnerData.points += 2; // 答错，TA+2
                q.status = 'wrong';
            }
            q.partner_choice = selectedOption;

            // 3. 记录到我的已答历史
            if(!myData.answered) myData.answered = [];
            myData.answered.push({
                q_id: q.id,
                q: q.q,
                my_choice: selectedOption,
                is_correct: isCorrect
            });

            // 4. 同步双方数据 (为了稳妥，串行保存)
            // 先保存我的 (扣费和奖励)
            const upMe = await updateFile(myPath, myData, mySha);
            if(upMe.success) mySha = upMe.sha;
            
            // 再保存TA的 (更新问题状态和TA的奖励)
            const upPartner = await updateFile(partnerPath, partnerData, partnerSha);
            if(upPartner.success) partnerSha = upPartner.sha;

            hideLoader();
            renderUI();
            showResult(isCorrect);
        }

        function showResult(isCorrect) {
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const desc = document.getElementById('resultDesc');
            
            if (isCorrect) {
                icon.innerText = '🎉';
                title.innerText = '回答正确！';
                title.className = 'text-xl font-bold mb-2 text-emerald-500';
                desc.innerHTML = '默契满满，<br>赢回本金，并额外获得 1 积分！🪙';
            } else {
                icon.innerText = '💔';
                title.innerText = '回答错误...';
                title.className = 'text-xl font-bold mb-2 text-rose-500';
                desc.innerHTML = `太可惜了，失去 1 积分。<br><span class="text-rose-500 font-bold">TA 获得了 2 积分的安慰奖！</span>`;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('resultModalContent').classList.remove('scale-95');
            }, 10);
        }

        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            document.getElementById('resultModalContent').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function showLoader(text) {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

    </script>
</body>
</html>
