<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 关键修复1：携带 no-referrer 解决手机端访问阿里云 DataV 地图 JSON 和高德瓦片时的 403 防盗链拦截 -->
    <meta name="referrer" content="no-referrer">
    <title>我们的旅游足迹 🗺️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 关键修复2：使用国内高速访问稳定的 Staticfile / jsDelivr 双保险加载 Leaflet，避免手机端 unpkg 加载失败导致地图空白 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.css" onerror="this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css'" />
    <script src="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js';document.head.appendChild(s);"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
            overscroll-behavior: none;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { height: 0px; width: 0px; display: none; }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .heart-animate { animation: heartBeat 0.3s ease-in-out; }

        #imageViewerModal {
            touch-action: none;
        }

        /* 关键修复3：使用绝对定位撑满父级，彻底解决手机 Safari / 微信浏览器中 Flex 子元素高度坍塌为 0 的问题 */
        #mapWrapper {
            position: relative;
            width: 100%;
            flex: 1 1 0%;
            min-height: 300px;
        }
        #chinaMap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #fff5f8 0%, #fce7f3 100%);
            z-index: 10;
            touch-action: none;
        }
        .leaflet-control-attribution { display: none !important; }

        /* 给实景底图增加柔和浪漫粉调滤镜，契合整体页面风格 */
        .warm-pink-tiles {
            filter: sepia(10%) hue-rotate(305deg) saturate(110%) brightness(102%) contrast(96%);
        }

        /* 苹果相册风格地图缩略图标记（严格控制大小，适配手机屏幕） */
        .apple-marker-wrapper {
            background: transparent !important;
            border: none !important;
        }
        .apple-photo-marker {
            position: relative;
            width: var(--marker-size, 44px);
            height: var(--marker-size, 44px);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .apple-photo-marker:active {
            transform: scale(1.15) translateY(-2px);
            z-index: 999 !important;
        }
        /* 多图堆叠背板效果 */
        .apple-photo-stack-bg {
            position: absolute;
            inset: -2px;
            background: #ffffff;
            border-radius: 11px;
            transform: rotate(7deg) translate(2px, -1px);
            box-shadow: 0 2px 5px rgba(244, 63, 94, 0.22);
            border: 1.5px solid #ffe4e6;
            z-index: 1;
        }
        /* 主相框 */
        .apple-photo-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: #ffffff;
            padding: 2px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35), 0 2px 4px rgba(0, 0, 0, 0.15);
            z-index: 2;
            overflow: hidden;
        }
        .apple-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background: #fce7f3;
        }
        /* 底部苹果风小尖角 */
        .apple-photo-pointer {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 9px;
            height: 9px;
            background: #ffffff;
            border-radius: 1px 0 2px 0;
            box-shadow: 2px 2px 3px rgba(244, 63, 94, 0.2);
            z-index: 1;
        }
        /* 右上角照片数量角标 */
        .apple-photo-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 4px rgba(244, 63, 94, 0.35);
            z-index: 4;
            line-height: 1;
        }
        /* 底部城市名小标签 */
        .apple-photo-city-label {
            position: absolute;
            bottom: -19px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.94);
            color: #e11d48;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 9999px;
            box-shadow: 0 1px 3px rgba(244, 63, 94, 0.2);
            border: 1px solid #fecdd3;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col items-center select-none">

    <!-- 顶部导航与主选项卡 -->
    <div class="z-40 w-full max-w-md bg-[#fdf2f8]/95 backdrop-blur-md pt-4 pb-2.5 px-4 shadow-sm border-b border-rose-100/50 shrink-0">
        <header class="text-center mb-3 w-full flex justify-between items-center px-0.5">
            <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 transition-transform active:scale-95 flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div class="flex-1 flex justify-center">
                <h1 class="text-lg font-bold text-rose-500 flex items-center justify-center gap-1.5 drop-shadow-sm">
                    <span>🗺️</span> 我们的旅游足迹 <span>✨</span>
                </h1>
            </div>
            <button onclick="openVisitedModal()" title="已点亮城市清单" class="w-9 h-9 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 flex items-center justify-center transition-transform active:scale-95 flex-shrink-0 text-sm">
                🚩
            </button>
        </header>

        <!-- 顶层主选项卡 -->
        <div class="flex space-x-1.5 w-full justify-center bg-white p-1 rounded-full shadow-sm border border-rose-100">
            <button id="tabMapBtn" onclick="switchMainTab('map')" class="flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-xs sm:text-sm">足迹地图</button>
            <button id="tabWallBtn" onclick="switchMainTab('wall')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-xs sm:text-sm hover:bg-rose-50">旅行手账</button>
            <button id="tabUploadBtn" onclick="switchMainTab('upload')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-xs sm:text-sm hover:bg-rose-50">打卡发布</button>
        </div>
    </div>

    <!-- 主内容区：使用 min-h-0 确保手机端 Flex 子容器高度计算准确 -->
    <main class="w-full max-w-md flex flex-col flex-1 min-h-0 px-3 pt-2.5 pb-3 overflow-hidden relative">

        <!-- ==================== 视图 1：足迹地图 ==================== -->
        <div id="mapView" class="w-full flex-1 min-h-0 flex flex-col transition-opacity duration-300">
            <!-- 顶部紧凑统计栏（专为手机窄屏优化） -->
            <div class="flex items-center justify-between mb-2 bg-white/95 px-3 py-2 rounded-2xl shadow-sm border border-rose-100 shrink-0">
                <div class="flex items-center gap-2.5 sm:gap-3.5" onclick="openVisitedModal()">
                    <div class="flex flex-col items-center cursor-pointer">
                        <span class="text-[10px] text-gray-400 leading-none mb-1">点亮省份</span>
                        <span class="text-xs sm:text-sm font-bold text-rose-500 leading-none"><span id="statProvCount">0</span><span class="text-[10px] text-gray-400 font-normal">/34</span></span>
                    </div>
                    <div class="w-px h-5 bg-rose-100"></div>
                    <div class="flex flex-col items-center cursor-pointer">
                        <span class="text-[10px] text-gray-400 leading-none mb-1">点亮地级市</span>
                        <span class="text-xs sm:text-sm font-bold text-rose-500 leading-none"><span id="statCityCount">0</span><span class="text-[10px] text-gray-400 font-normal" id="statTotalCityLabel">/367</span></span>
                    </div>
                    <div class="w-px h-5 bg-rose-100"></div>
                    <div class="flex flex-col items-center cursor-pointer">
                        <span class="text-[10px] text-gray-400 leading-none mb-1">旅行照片</span>
                        <span class="text-xs sm:text-sm font-bold text-rose-500 leading-none"><span id="statPhotoCount">0</span><span class="text-[10px] text-gray-400 font-normal">张</span></span>
                    </div>
                </div>

                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="openVisitedModal()" class="text-[11px] bg-rose-50 text-rose-500 px-2.5 py-1 rounded-full font-bold border border-rose-100 active:scale-95 transition-all">
                        城市图鉴
                    </button>
                    <button onclick="resetMapView()" class="text-[11px] bg-rose-500 text-white px-2.5 py-1 rounded-full font-bold shadow-xs active:scale-95 transition-all">
                        全国
                    </button>
                </div>
            </div>

            <!-- 地图主画布外框（使用 #mapWrapper 绝对定位内部 #chinaMap，杜绝手机端高度异常） -->
            <div id="mapWrapper" class="bg-white rounded-2xl shadow-sm border-2 border-rose-100/90 overflow-hidden">
                <div id="chinaMap"></div>

                <!-- 地图左上角精简图例与加载状态 -->
                <div class="absolute top-2.5 left-2.5 z-20 pointer-events-none flex flex-col gap-1.5">
                    <div class="bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm border border-rose-100 flex items-center gap-1.5 text-[10px] text-gray-600 font-medium">
                        <span class="inline-block w-2.5 h-2.5 rounded-xs bg-rose-400 border border-rose-500"></span>
                        <span>已去过</span>
                        <span class="text-gray-300">|</span>
                        <span>双指缩放查看地级市</span>
                    </div>
                    <div id="mapLoadingBadge" class="bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm border border-rose-100 flex items-center gap-1.5 text-[10px] text-rose-500 font-bold">
                        <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                        <span id="mapLoadingText">正在加载中国地图...</span>
                    </div>
                </div>

                <!-- 地图右上角底图模式切换 -->
                <div class="absolute top-2.5 right-2.5 z-20 flex flex-col gap-1.5">
                    <button onclick="toggleBaseTile()" id="btnTileToggle" class="px-2.5 py-1 bg-white/92 backdrop-blur-md rounded-full shadow-sm border border-rose-100 flex items-center gap-1 text-rose-500 font-bold text-[10px] active:scale-95 transition-all">
                        <span>🗺️</span><span id="tileToggleText">实景底图</span>
                    </button>
                    <button onclick="loadAllCityBoundariesManual()" id="btnLoadAllCities" class="px-2.5 py-1 bg-white/92 backdrop-blur-md rounded-full shadow-sm border border-rose-100 flex items-center gap-1 text-rose-500 font-bold text-[10px] active:scale-95 transition-all">
                        <span>🧩</span><span id="cityBoundText">显示全部市界</span>
                    </button>
                </div>

                <!-- 地图右下角缩放按钮 -->
                <div class="absolute bottom-2.5 right-2.5 z-20 flex flex-col gap-1.5">
                    <button onclick="mapZoomIn()" class="w-8 h-8 bg-white/95 backdrop-blur-md rounded-xl shadow-md border border-rose-100 flex items-center justify-center text-rose-500 font-bold text-base active:scale-90 transition-all">+</button>
                    <button onclick="mapZoomOut()" class="w-8 h-8 bg-white/95 backdrop-blur-md rounded-xl shadow-md border border-rose-100 flex items-center justify-center text-rose-500 font-bold text-base active:scale-90 transition-all">−</button>
                </div>

                <!-- 地图左下角快速搜索任意地级市定位 -->
                <div class="absolute bottom-2.5 left-2.5 z-20">
                    <div class="relative flex items-center">
                        <input id="mapCitySearch" type="text" placeholder="🔍 搜地级市定位/打卡..." oninput="handleMapCitySearch(this.value)" class="w-36 focus:w-48 transition-all text-[11px] bg-white/95 backdrop-blur-md text-gray-700 placeholder-gray-400 rounded-full pl-2.5 pr-6 py-1.5 shadow-md border border-rose-100 focus:outline-none focus:border-rose-300">
                        <button id="clearMapSearchBtn" onclick="clearMapCitySearch()" class="hidden absolute right-2 text-gray-400 hover:text-rose-500 text-xs font-bold">×</button>
                        <div id="mapSearchDropdown" class="hidden absolute bottom-9 left-0 w-52 max-h-44 overflow-y-auto custom-scrollbar bg-white/98 backdrop-blur-md rounded-xl shadow-lg border border-rose-100 p-1 z-30"></div>
                    </div>
                </div>
            </div>

            <!-- 已点亮地级市横向快捷胶囊栏 -->
            <div id="visitedCityChipsBar" class="mt-2 flex items-center gap-1.5 overflow-x-auto custom-scrollbar py-0.5 shrink-0">
                <!-- JS动态渲染去过的地级市快捷胶囊 -->
            </div>
        </div>

        <!-- ==================== 视图 2：旅行手账（图文列表） ==================== -->
        <div id="wallView" class="w-full flex-1 min-h-0 flex flex-col hidden transition-opacity duration-300">
            <div class="flex justify-between items-center mb-2.5 w-full bg-white/90 p-2 rounded-xl shadow-sm border border-rose-100 backdrop-blur-sm shrink-0 gap-2">
                <div class="flex space-x-1 overflow-x-auto custom-scrollbar flex-1" id="provinceFilterTabs">
                    <!-- JS动态生成：全部 + 已去过的城市筛选 -->
                </div>

                <select id="sortSelect" onchange="renderWall()" class="text-xs bg-rose-50 border border-rose-100 text-rose-500 rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-300 shadow-sm shrink-0 font-medium">
                    <option value="time">最新足迹</option>
                    <option value="likes">最多喜欢</option>
                </select>
            </div>

            <div class="w-full flex-1 min-h-0 bg-white/60 p-2.5 rounded-2xl shadow-sm border border-rose-100/60 backdrop-blur-md overflow-y-auto custom-scrollbar">
                <div id="photoGrid" class="w-full pb-6">
                    <!-- JS动态渲染双列图文瀑布流 -->
                </div>
            </div>
        </div>

        <!-- ==================== 视图 3：打卡发布 ==================== -->
        <div id="uploadView" class="w-full flex-1 min-h-0 flex flex-col hidden transition-opacity duration-300 overflow-y-auto custom-scrollbar pb-6">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-4 sm:p-5 shadow-sm border-2 border-rose-100 shrink-0">

                <!-- 模仿 photowall.html 的图片选择框 -->
                <div id="uploadArea" class="w-full h-44 border-2 border-dashed border-rose-300 rounded-xl bg-rose-50 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-100 transition-colors mb-4 relative overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    <div id="uploadPlaceholder" class="flex flex-col items-center pointer-events-none">
                        <span class="text-3xl mb-1.5">📸</span>
                        <span class="text-sm font-bold text-rose-400">点击选择旅行照片</span>
                        <span class="text-[11px] text-rose-300 mt-0.5">自动生成苹果地图缩略图与高清原图</span>
                    </div>
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                    <button id="clearImageBtn" onclick="clearImage(event)" class="hidden absolute top-2 right-2 bg-white/90 text-rose-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold z-20 hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">×</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

                <div class="space-y-3.5">
                    <!-- 发布人 -->
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2.5">
                        <span class="text-sm font-bold text-gray-600">打卡人</span>
                        <span id="uploaderName" class="text-xs sm:text-sm text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full flex items-center gap-1">👦 <span id="uploaderText"></span></span>
                    </div>

                    <!-- 地级市快速搜索 + 省市二级联动 -->
                    <div class="border-b border-rose-100 pb-3 space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-sm font-bold text-gray-600 shrink-0">选择地级市 📍</span>
                            <div class="relative flex-1 max-w-[180px]">
                                <input type="text" id="cityQuickFilter" placeholder="🔍 搜城市名快速选择..." oninput="quickMatchCity(this.value)" class="w-full text-xs bg-rose-50/70 border border-rose-200 text-gray-700 rounded-full px-3 py-1 focus:outline-none focus:border-rose-400">
                                <div id="quickMatchDropdown" class="hidden absolute right-0 top-8 w-52 max-h-44 overflow-y-auto custom-scrollbar bg-white rounded-xl shadow-lg border border-rose-100 p-1 z-30"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-gray-400 block mb-0.5">省份 / 直辖市</label>
                                <select id="formProvince" onchange="onProvinceChange()" class="w-full text-xs sm:text-sm bg-rose-50 border border-rose-200 text-rose-600 rounded-xl px-2 py-2 focus:outline-none focus:border-rose-400 font-bold">
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-400 block mb-0.5">地级市 / 州 / 盟</label>
                                <select id="formCity" class="w-full text-xs sm:text-sm bg-rose-50 border border-rose-200 text-rose-600 rounded-xl px-2 py-2 focus:outline-none focus:border-rose-400 font-bold">
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 旅行日期 -->
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2.5">
                        <span class="text-sm font-bold text-gray-600">旅行日期 📅</span>
                        <input type="date" id="formTripDate" class="text-xs sm:text-sm bg-rose-50 border border-rose-200 text-rose-500 rounded-lg px-2.5 py-1 focus:outline-none focus:border-rose-400 font-bold">
                    </div>

                    <!-- 文字描述 -->
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm font-bold text-gray-600">旅行故事 / 文字描述 ✍️</span>
                            <span id="descCount" class="text-[11px] text-gray-400">0/300</span>
                        </div>
                        <textarea id="formDescription" rows="3" maxlength="300" oninput="document.getElementById('descCount').innerText = this.value.length + '/300'" placeholder="写下在这里发生的美好故事、吃到的美食或难忘瞬间吧~" class="w-full text-xs sm:text-sm bg-rose-50/60 border border-rose-200 text-gray-700 placeholder-rose-300 rounded-xl p-2.5 focus:outline-none focus:border-rose-400 resize-none leading-relaxed select-text"></textarea>
                    </div>
                </div>

                <!-- 模仿 photowall.html 的上传进度条 -->
                <div id="progressContainer" class="hidden w-full mt-4">
                    <div class="flex justify-between text-xs text-rose-500 mb-1.5 font-bold">
                        <span id="progressTitle">🚀 正在上传至时光机...</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-rose-100 rounded-full h-2 shadow-inner overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button onclick="submitTravelPost()" id="submitBtn" class="mt-4 w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-sm sm:text-[15px] font-bold rounded-xl shadow-md active:scale-98 transition-all flex justify-center items-center gap-2 tracking-wider">
                    点亮城市并发布 🚀
                </button>
            </div>

            <div class="mt-4 mb-2 text-center shrink-0">
                <span class="text-gray-400 text-xs bg-white/50 px-3 py-1 rounded-full shadow-sm">当前身份: <span id="currentIdentityLabel" class="text-rose-400 font-bold">-</span></span>
            </div>
        </div>
    </main>

    <!-- ==================== 弹窗 1：城市相册抽屉（点击地图上苹果风缩略图或城市弹出） ==================== -->
    <div id="cityAlbumModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeCityAlbumModal()">
        <div class="w-full max-w-md bg-[#fdf2f8] rounded-t-3xl sm:rounded-3xl max-h-[80dvh] flex flex-col shadow-2xl border-t-2 border-rose-100 overflow-hidden animate-fade-in" onclick="event.stopPropagation()">

        function ensureLeafletLoaded() {
            return new Promise((resolve) => {
                if (window.L) return resolve();
                let tries = 0;
                const timer = setInterval(() => {
                    tries++;
                    if (window.L || tries > 30) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });

        function initProvinceCitySelects() {
            const provSelect = document.getElementById('formProvince');

            onProvinceChange();

        function onProvinceChange(targetCityName) {
            const provName = document.getElementById('formProvince').value;
            const provObj = CHINA_REGIONS.find(p => p.prov === provName) || CHINA_REGIONS[0];
            const citySelect = document.getElementById('formCity');
            citySelect.innerHTML = provObj.cities.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            if (targetCityName) {
                citySelect.value = targetCityName;
            }
        }

        // 发布页快速搜索匹配任意地级市
        function quickMatchCity(keyword) {
            const dropdown = document.getElementById('quickMatchDropdown');
            const kw = keyword.trim();
            if (!kw) {
                dropdown.classList.add('hidden');
                return;
            }
            const matches = ALL_CITIES_FLAT.filter(c => c.city.includes(kw) || c.province.includes(kw)).slice(0, 12);
            if (matches.length === 0) {
                dropdown.innerHTML = `<div class="text-xs text-gray-400 p-2 text-center">未找到匹配的地级市</div>`;
            } else {
                dropdown.innerHTML = matches.map(m => `
                    <div onclick="selectCityInForm('${m.province}', '${m.city}')" class="px-3 py-1.5 text-xs hover:bg-rose-50 rounded-lg cursor-pointer flex items-center justify-between">
                        <span class="font-bold text-rose-500">${m.city}</span>
                        <span class="text-[10px] text-gray-400">${m.province}</span>
                    </div>
                `).join('');
            }
            dropdown.classList.remove('hidden');
        }

        function selectCityInForm(province, city) {
            document.getElementById('formProvince').value = province;
            onProvinceChange(city);

        // =========================================================================
        // 4. 专为手机屏幕优化的交互式中国地图
        // =========================================================================
        function initChinaMap() {
            if (!window.L) {
                document.getElementById('mapLoadingText').innerText = "地图组件加载失败，请刷新重试";
                return;
            }

            // 关键修复4：启用 Canvas 渲染器，手机端双指缩放多边形丝滑不卡顿；开启 0.1 级无级缩放适应手机竖屏宽度
            canvasRenderer = L.canvas({ padding: 0.5 });

            map = L.map('chinaMap', {
                renderer: canvasRenderer,
                preferCanvas: true,
                zoomSnap: 0.1,
                zoomDelta: 0.5,
                minZoom: 2.8,
                maxZoom: 13,
                zoomControl: false,
                attributionControl: false,
                tap: false,
                touchZoom: true,
                bounceAtZoomLimits: false
            });

            // 默认开启高德中文瓦片底图（带暖粉滤镜），保证手机打开瞬间就有清晰的省市地名与轮廓
            baseTileLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                subdomains: ['1', '2', '3', '4'],
                opacity: 0.72,
                className: 'warm-pink-tiles'
            }).addTo(map);

            cityGeoLayerGroup = L.layerGroup().addTo(map);
            markerLayerGroup = L.layerGroup().addTo(map);

            // 首次自适应手机屏幕宽高，完整显示中国全境
            fitChinaBoundsOnMobile(false);

            // 关键修复5：使用 ResizeObserver 监听手机地址栏收起/展开或 Tab 切换，实时修正地图尺寸
            const mapWrapper = document.getElementById('mapWrapper');
            if (window.ResizeObserver && mapWrapper) {
                let resizeTimer = null;
                const ro = new ResizeObserver(() => {
                    if (!map) return;
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        map.invalidateSize({ pan: false });
                    }, 60);
                });
                ro.observe(mapWrapper);
            }

            // 监听缩放结束事件：更新苹果相册风格缩略图的聚合与尺寸
            map.on('zoomend', () => {
                renderApplePhotoMarkers();
            });

            loadChinaProvinceGeoJSON();
        }

        // 根据手机屏幕窄屏比例自动缩放到完整包含中国版图的位置
        function fitChinaBoundsOnMobile(animate = true) {
            if (!map) return;
            map.invalidateSize();
            // 覆盖中国大陆主要可视范围（南北：三亚~漠河，东西：喀什~抚远），在手机竖屏上视觉居中饱满
            const chinaMainBounds = [[18.2, 74.0], [53.2, 134.5]];
            map.fitBounds(chinaMainBounds, {
                padding: [6, 6],
                animate: animate,
                duration: 0.6
            });
        }

            const badge = document.getElementById('mapLoadingBadge');
            const badgeText = document.getElementById('mapLoadingText');
            try {
                const res = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json', {
                    referrerPolicy: 'no-referrer'
                });
                if (res.ok) {
                    const chinaGeo = await res.json();
                    provinceGeoLayer = L.geoJSON(chinaGeo, {
                        renderer: canvasRenderer,
                        style: feature => getProvinceStyle(feature.properties.name),
                        onEachFeature: (feature, layer) => {
                            layer.on('click', async (e) => {
                                const provName = feature.properties.name;
                                if (['北京市', '天津市', '上海市', '重庆市', '香港特别行政区', '澳门特别行政区'].includes(provName)) {
                                    L.DomEvent.stopPropagation(e);
                                    openCityInteraction(provName, provName);
                                } else {
                                    // 点击某省时，自动按需加载该省下属的所有地级市边界并放大查看
                                    const provObj = PROV_MAP_BY_NAME[provName];
                                    if (provObj) {
                                        showToast(`正在展开 ${provName} 的地级市...`);
                                        await fetchProvinceCitiesGeo(provObj.code, provObj.prov);
                                        refreshMapPolygonStyles();
                                        if (e.latlng && map.getZoom() < 5.5) {
                                            map.flyTo(e.latlng, 6, { duration: 0.6 });
                                        }
                                    }
                                }
                            });
                        }
                    }).addTo(map);
                }
            } catch (err) {
                console.warn('省级边界加载受限，使用瓦片底图展示', err);
            } finally {
                badge.classList.add('hidden');
            }
        }

        // 自动加载“已经去过的省份”的地级市多边形，确保点亮的地级市立即高亮且不拖慢手机启动速度
        async function loadVisitedProvincesCityGeo() {
            const posts = travelData.posts || [];
            const visitedProvCodes = new Set();
            posts.forEach(p => {
                const canonical = normalizeCityName(p.city);
                const meta = CITY_MAP_BY_NAME[canonical];
                if (meta && !['110000', '120000', '310000', '500000', '810000', '820000'].includes(meta.provCode)) {
                    visitedProvCodes.add(meta.provCode);
                }
            });

            for (const code of visitedProvCodes) {
                const provObj = CHINA_REGIONS.find(r => r.code === code);
                if (provObj) {
                    await fetchProvinceCitiesGeo(provObj.code, provObj.prov);
                }
            }
            refreshMapPolygonStyles();
        }

        // 用户点击右上角“显示全部市界”时，分批加载全国34省全部地级市边界
        async function loadAllCityBoundariesManual() {
            const btnText = document.getElementById('cityBoundText');
            const badge = document.getElementById('mapLoadingBadge');
            const badgeText = document.getElementById('mapLoadingText');

            if (isAllCityBoundsLoaded) {
                if (map.hasLayer(cityGeoLayerGroup)) {
                    map.removeLayer(cityGeoLayerGroup);
                    btnText.innerText = "显示全部市界";
                    showToast("已隐藏地级市边界线");
                } else {
                    cityGeoLayerGroup.addTo(map);
                    btnText.innerText = "隐藏市界";
                    showToast("已显示全国地级市边界 ✨");
                }
                return;
            }

            badge.classList.remove('hidden');
            badgeText.innerText = "正在加载全国360+地级市边界...";
            btnText.innerText = "加载中...";

            const multiCityProvs = CHINA_REGIONS.filter(p => !['110000', '120000', '310000', '500000', '810000', '820000'].includes(p.code));
            const batchSize = 5;
            for (let i = 0; i < multiCityProvs.length; i += batchSize) {
                const batch = multiCityProvs.slice(i, i + batchSize);
                await Promise.allSettled(batch.map(p => fetchProvinceCitiesGeo(p.code, p.prov)));
            }

            isAllCityBoundsLoaded = true;
            badge.classList.add('hidden');
            btnText.innerText = "隐藏市界";
            refreshMapPolygonStyles();
            showToast("全国所有地级市边界加载完成！🎉");
        }

        async function fetchProvinceCitiesGeo(provCode, provName) {
            if (loadedProvinceCityGeo[provCode]) return;
            try {
                const res = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${provCode}_full.json`, {
                    referrerPolicy: 'no-referrer'
                });
                if (!res.ok) return;
                const geoData = await res.json();
                loadedProvinceCityGeo[provCode] = geoData;

                const layer = L.geoJSON(geoData, {
                    renderer: canvasRenderer,
                    style: feature => getCityPolygonStyle(feature.properties.name, provName),
                    onEachFeature: (feature, lyr) => {
                        const cityName = feature.properties.name;
                        lyr.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            openCityInteraction(provName, cityName);
                        });
                    }
                });
                cityGeoLayerGroup.addLayer(layer);
            } catch (e) {}
        }

        function isCityVisited(cityName) {
            if (!travelData.posts || travelData.posts.length === 0) return false;
            const norm = normalizeCityName(cityName);
            return travelData.posts.some(p => normalizeCityName(p.city) === norm);
        }

        function isProvinceVisited(provName) {
            if (!travelData.posts || travelData.posts.length === 0) return false;
            const shortProv = provName.replace(/(省|市|自治区|壮族自治区|回族自治区|维吾尔自治区|特别行政区)$/g, '');
            return travelData.posts.some(p => (p.province && p.province.includes(shortProv)) || (p.city && p.city.includes(shortProv)));
        }

        function normalizeCityName(name) {
            if (!name) return '';
            const matched = CITY_MAP_BY_NAME[name] || CITY_MAP_BY_NAME[name.replace(/(市|地区|自治州|盟|特别行政区|林区|县)$/g, '')];
            return matched ? matched.city : name;
        }

        function getProvinceStyle(provName) {
            const visited = isProvinceVisited(provName);
            const isDirectMunicipality = ['北京市', '天津市', '上海市', '重庆市', '香港特别行政区', '澳门特别行政区'].includes(provName);
            return {
                color: '#f43f5e',
                weight: 1.3,
                opacity: 0.75,
                fillColor: visited ? '#fb7185' : '#ffe4e6',
                fillOpacity: isDirectMunicipality ? (visited ? 0.55 : 0.2) : (visited ? 0.18 : 0.12)
            };
        }

        function getCityPolygonStyle(cityName, provName) {
            const visited = isCityVisited(cityName);
            return {
                color: visited ? '#e11d48' : '#fda4af',
                weight: visited ? 1.6 : 0.7,
                opacity: visited ? 0.95 : 0.65,
                fillColor: visited ? '#fb7185' : '#fff1f2',
                fillOpacity: visited ? 0.52 : 0.1
            };
        }

        function refreshMapPolygonStyles() {
            if (provinceGeoLayer) {
                provinceGeoLayer.setStyle(feature => getProvinceStyle(feature.properties.name));
            }
            if (cityGeoLayerGroup) {
                cityGeoLayerGroup.eachLayer(geoLayer => {
                    if (geoLayer.setStyle) {
                        geoLayer.setStyle(feature => getCityPolygonStyle(feature.properties.name));
                    }
                });
            }
        }

        // =========================================================================
        // 5. 苹果相册风格（Apple Photos Map）地图缩略图渲染与双指缩放聚合
        // =========================================================================
        function renderApplePhotoMarkers() {
            if (!map || !markerLayerGroup) return;
            markerLayerGroup.clearLayers();

            if (!travelData.posts || travelData.posts.length === 0) return;

            // 1. 按地级市归组，按时间倒序排列每个城市下的照片
            const cityGroups = {};
            travelData.posts.forEach(post => {
                const canonicalCity = normalizeCityName(post.city);
                const cityMeta = CITY_MAP_BY_NAME[canonicalCity] || CITY_MAP_BY_NAME[post.city];
                const lat = post.lat || (cityMeta ? cityMeta.lat : null);
                const lng = post.lng || (cityMeta ? cityMeta.lng : null);
                const prov = post.province || (cityMeta ? cityMeta.province : '');
                if (!lat || !lng) return;

                if (!cityGroups[canonicalCity]) {
                    cityGroups[canonicalCity] = {
                        city: canonicalCity,
                        province: prov,
                        lat: lat,
                        lng: lng,
                        posts: []
                    };
                }
                cityGroups[canonicalCity].posts.push(post);
            });

            const cityGroupList = Object.values(cityGroups);
            cityGroupList.forEach(g => g.posts.sort((a, b) => b.time - a.time));

            // 2. 根据当前手机地图缩放级别，动态控制缩略图大小与聚合阈值
            const currentZoom = map.getZoom();
            const markerSize = currentZoom >= 6 ? 48 : (currentZoom >= 4.5 ? 42 : 38);
            const clusterPixelThreshold = currentZoom >= 6.8 ? 0 : (currentZoom >= 5 ? 34 : 42);
            const clusters = [];

            cityGroupList.forEach(group => {
                const pt = map.latLngToLayerPoint([group.lat, group.lng]);
                let merged = false;
                if (clusterPixelThreshold > 0) {
                    for (const cluster of clusters) {
                        const cpt = map.latLngToLayerPoint([cluster.lat, cluster.lng]);
                        const dist = Math.hypot(pt.x - cpt.x, pt.y - cpt.y);
                        if (dist < clusterPixelThreshold) {
                            cluster.posts.push(...group.posts);
                            cluster.cities.push(group.city);
                            cluster.posts.sort((a, b) => b.time - a.time);
                            merged = true;
                            break;
                        }
                    }
                }
                if (!merged) {
                    clusters.push({
                        lat: group.lat,
                        lng: group.lng,
                        province: group.province,
                        cities: [group.city],
                        posts: [...group.posts]
                    });
                }
            });

            // 3. 为每个聚合点创建 Apple 相册风格的受控尺寸缩略图 Marker
            clusters.forEach(cluster => {
                const coverPost = cluster.posts[0];
                const thumbUrl = coverPost.thumbUrl || coverPost.url;
                const totalCount = cluster.posts.length;
                const displayCityName = cluster.cities.length > 1
                    ? `${cluster.cities[0].replace(/(市|自治州|地区|盟)$/g, '')}等${cluster.cities.length}城`
                    : cluster.cities[0].replace(/(市|自治州|地区|盟|特别行政区)$/g, '');

                const iconHtml = `
                    <div class="apple-photo-marker" style="--marker-size: ${markerSize}px;">
                        ${totalCount > 1 ? '<div class="apple-photo-stack-bg"></div>' : ''}
                        <div class="apple-photo-frame">
                            <img src="${thumbUrl}" alt="${displayCityName}" loading="lazy">
                        </div>
                        <div class="apple-photo-pointer"></div>
                        ${totalCount > 1 ? `<div class="apple-photo-badge">${totalCount}</div>` : ''}
                        <div class="apple-photo-city-label">${displayCityName}</div>
                    </div>
                `;

                const divIcon = L.divIcon({
                    className: 'apple-marker-wrapper',
                    html: iconHtml,
                    iconSize: [markerSize, markerSize],
                    iconAnchor: [markerSize / 2, markerSize]
                });

                const marker = L.marker([cluster.lat, cluster.lng], { icon: divIcon });
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    openClusterAlbumModal(cluster);
                });
                markerLayerGroup.addLayer(marker);
            });
        }

        async function flyToSearchedCity(prov, city, lat, lng) {
            clearMapCitySearch();
            const provObj = PROV_MAP_BY_NAME[prov];
            if (provObj && !['110000', '120000', '310000', '500000', '810000', '820000'].includes(provObj.code)) {
                fetchProvinceCitiesGeo(provObj.code, provObj.prov).then(() => refreshMapPolygonStyles());
            }
            if (map) {
                map.flyTo([lat, lng], 7, { duration: 0.8 });
            }
            setTimeout(() => {
                openCityInteraction(prov, city);
            }, 550);
        }

        function openCityInteraction(provName, cityName) {
            const canonicalCity = normalizeCityName(cityName);
            const cityMeta = CITY_MAP_BY_NAME[canonicalCity];
            const province = provName || (cityMeta ? cityMeta.province : '');
            const cityPosts = (travelData.posts || []).filter(p => normalizeCityName(p.city) === canonicalCity);

            openClusterAlbumModal({
                province: province,
                cities: [canonicalCity],
                posts: cityPosts.sort((a, b) => b.time - a.time)
            });
        }

        // =========================================================================
        // 7. 主视图切换与旅行手账瀑布流渲染
        // =========================================================================
        function switchMainTab(tab) {
            const views = {
                'map': document.getElementById('mapView'),
                'wall': document.getElementById('wallView'),
                'upload': document.getElementById('uploadView')
            };
            const btns = {
                'map': document.getElementById('tabMapBtn'),
                'wall': document.getElementById('tabWallBtn'),

            };

            for (const key in views) {
                if (key === tab) {
                    views[key].classList.remove('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-xs sm:text-sm";
                } else {
                    views[key].classList.add('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-xs sm:text-sm hover:bg-rose-50";
                }
            }

            if (tab === 'map' && map) {
                setTimeout(() => {
                    map.invalidateSize();
                    renderApplePhotoMarkers();
                }, 80);
            }
            if (tab === 'wall') {
                renderProvinceFilterTabs();
                renderWall();
            }
        }

        function renderProvinceFilterTabs() {
            const tabContainer = document.getElementById('provinceFilterTabs');
            const posts = travelData.posts || [];
            const provSet = new Set(['全部']);
            posts.forEach(p => {
                if (p.city) provSet.add(normalizeCityName(p.city));
            });

            tabContainer.innerHTML = Array.from(provSet).map(cat => {
                const active = cat === currentProvinceFilter;
                const label = cat === '全部' ? '全部足迹' : cat.replace(/(市|自治州|地区|盟|特别行政区)$/g, '');
                return `
                    <button onclick="switchCityFilter('${cat}')" class="px-3 py-1 text-xs font-bold rounded-md transition-all whitespace-nowrap ${active ? 'bg-rose-100 text-rose-600 shadow-sm' : 'text-gray-500 hover:bg-rose-50'}">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        function switchCityFilter(cat) {
            currentProvinceFilter = cat;
            renderProvinceFilterTabs();
            renderWall();
        }

        function renderWall() {
            const container = document.getElementById('photoGrid');
            const sortMode = document.getElementById('sortSelect').value;

            if (!travelData.posts || travelData.posts.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-12">还没有旅行记录哦，快去“打卡发布”点亮第一座城市吧~ ✈️</div>`;
                return;
            }

            let displayList = [...travelData.posts];
            if (currentProvinceFilter !== '全部') {
                displayList = displayList.filter(p => normalizeCityName(p.city) === currentProvinceFilter);
            }

            if (sortMode === 'time') {
                displayList.sort((a, b) => b.time - a.time);
            } else if (sortMode === 'likes') {
                displayList.sort((a, b) => (b.likes || 0) - (a.likes || 0) || b.time - a.time);
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10">这座城市还没有记录哦~ 🍃</div>`;
                return;
            }

            let leftColHtml = '';
            let rightColHtml = '';
            const localLikes = JSON.parse(localStorage.getItem('loveGacha_myTravelLikes') || '[]');

            displayList.forEach((item, index) => {
                const dateStr = item.tripDate || new Date(item.time).toLocaleDateString();
                const displayThumb = item.thumbUrl || item.url;
                const likesCount = item.likes || 0;
                const isLiked = localLikes.includes(item.id);
                const shortCity = (item.city || '未知城市').replace(/(市|自治州|地区|盟|特别行政区)$/g, '');
                const descHtml = item.description ? `<p class="text-xs text-gray-600 leading-relaxed line-clamp-3 mb-2 break-words">${escapeHtml(item.description)}</p>` : '';

                const heartSvg = `<svg class="w-3.5 h-3.5 ${isLiked ? 'text-rose-500 fill-current' : 'text-gray-400 stroke-current fill-transparent'} transition-colors" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>`;

                const cardHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-rose-100/60 animate-fade-in relative overflow-hidden group w-full mb-2.5">
                        <div class="cursor-zoom-in relative w-full overflow-hidden" onclick="openImageViewer('${displayThumb}', '${item.url}', ${item.id})">
                            <img src="${displayThumb}" loading="lazy" class="w-full h-auto block object-cover">
                            <div class="absolute top-1.5 left-1.5 bg-white/92 backdrop-blur-md text-rose-500 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm flex items-center gap-0.5">
                                <span>📍</span><span>${shortCity}</span>
                            </div>
                            <div class="absolute top-1.5 right-1.5 bg-black/45 backdrop-blur-md text-white/95 text-[9px] font-mono px-1.5 py-0.5 rounded-full shadow-sm">
                                ${dateStr}
                            </div>
                        </div>

                        <div class="p-2.5">
                            ${descHtml}
                            <div class="flex items-center justify-between pt-1 border-t border-rose-50">
                                <div class="flex items-center gap-1">
                                    <span class="text-xs">👦</span>
                                    <span class="text-[11px] font-bold text-gray-600 truncate max-w-[65px]">${escapeHtml(item.uploader || '我们')}</span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="locatePostOnMap('${item.province || ''}', '${item.city}')" class="text-[10px] bg-rose-50 text-rose-500 px-1.5 py-0.5 rounded-md font-bold">
                                        地图
                                    </button>
                                    <button onclick="toggleLike(${item.id}, event)" class="flex items-center gap-0.5 bg-rose-50/70 px-1.5 py-0.5 rounded-md border border-rose-100">
                                        ${heartSvg}
                                        <span class="text-[10px] font-bold ${isLiked ? 'text-rose-500' : 'text-gray-500'} ml-0.5">${likesCount}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                if (index % 2 === 0) leftColHtml += cardHtml;
                else rightColHtml += cardHtml;
            });

            container.innerHTML = `
                <div class="flex gap-2.5 items-start w-full">
                    <div class="flex flex-col w-1/2">${leftColHtml}</div>
                    <div class="flex flex-col w-1/2">${rightColHtml}</div>
                </div>
            `;
        }

        function locatePostOnMap(prov, city) {
            const canonical = normalizeCityName(city);
            const meta = CITY_MAP_BY_NAME[canonical];
            switchMainTab('map');
            if (meta && map) {
                setTimeout(() => {
                    map.flyTo([meta.lat, meta.lng], 7, { duration: 0.8 });
                }, 150);
            }
        }

        // =========================================================================
        // 8. 上传图片、缩略图生成、GitHub API 同步（完全复刻 photowall.html 逻辑）
        // =========================================================================
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                showToast("图片不能超过10MB哦~");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageDataUrl = e.target.result;
                currentImageBase64 = currentImageDataUrl.split(',')[1];
                currentImageExt = file.name.split('.').pop() || 'jpg';

                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('clearImageBtn').classList.remove('hidden');

                const imgEl = document.getElementById('imagePreview');
                imgEl.src = currentImageDataUrl;
                imgEl.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImage(event) {
            if (event) event.stopPropagation();
            currentImageBase64 = null;
            currentImageDataUrl = null;
            document.getElementById('imageInput').value = '';

            const imgEl = document.getElementById('imagePreview');
            imgEl.src = '';
            imgEl.classList.add('hidden');

            document.getElementById('clearImageBtn').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        async function fetchTravelData() {
            if (!GITHUB_TOKEN) return false;
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_TRAVEL}?t=${timestamp}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`
                    }
                });
                if (response.status === 404) {
                    travelData = { posts: [] };
                    return true;
                }
                if (!response.ok) return false;

                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                travelData = JSON.parse(contentStr || '{"posts":[]}');
                if (!travelData.posts) travelData.posts = [];
                travelSha = result.sha;
                return true;
            } catch (error) {
                return false;
            }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
                const body = { message: `Update travel footprint data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false, sha: sha };
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) {
                return { success: false, sha: sha };
            }
        }

        function uploadMediaToGithubWithProgress(base64Data, extension, folderName, prefix) {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const filename = `${prefix}_${timestamp}.${extension}`;
                const path = `${folderName}/${filename}`;

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `https://api.github.com/repos/${OWNER_REPO}/contents/${path}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
                xhr.setRequestHeader('Authorization', `Bearer ${GITHUB_TOKEN}`);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.floor((event.loaded / event.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressText').innerText = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.content.download_url);
                    } else {
                        reject(new Error('Upload failed'));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network error'));
                };

                const body = JSON.stringify({
                    message: `Upload travel photo ${filename}`,
                    content: base64Data
                });

                xhr.send(body);
            });
        }

        function generateThumbnailBase64(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const MAX_WIDTH = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
                };
                img.src = dataUrl;
            });
        }

        async function submitTravelPost() {
            if (!currentImageBase64 || !currentImageDataUrl) {
                showToast("请先选择一张旅行照片哦！📸");
                return;
            }
            if (!GITHUB_TOKEN) {
                showToast("未配置Token，无法上传！");
                return;
            }

            const province = document.getElementById('formProvince').value;
            const city = document.getElementById('formCity').value;
            const tripDate = document.getElementById('formTripDate').value;
            const description = document.getElementById('formDescription').value.trim();

            if (!city) {
                showToast("请选择打卡的地级市哦 📍");
                return;
            }

            const cityMeta = CITY_MAP_BY_NAME[city] || { lat: 35.8, lng: 104.2 };
            const btn = document.getElementById('submitBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressTitle = document.getElementById('progressTitle');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            progressContainer.classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';

            try {
                btn.innerText = "生成地图缩略图中...";
                const thumbBase64 = await generateThumbnailBase64(currentImageDataUrl);

                btn.innerText = "上传缩略图中...";
                progressTitle.innerText = "🚀 正在上传地图缩略图...";
                const uploadedThumbUrl = await uploadMediaToGithubWithProgress(thumbBase64, 'jpg', 'travel', 'thumb');

                btn.innerText = "上传高清原图中...";
                progressTitle.innerText = "🚀 正在上传高清原图...";
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                const uploadedImageUrl = await uploadMediaToGithubWithProgress(currentImageBase64, currentImageExt, 'travel', 'origin');

                if (!uploadedImageUrl) throw new Error("Upload URL is empty");

                btn.innerText = "正在点亮城市并同步...";

                const newPost = {
                    id: Date.now(),
                    url: uploadedImageUrl,
                    thumbUrl: uploadedThumbUrl,
                    uploader: myIdentity,
                    province: province,
                    city: city,
                    lat: cityMeta.lat,
                    lng: cityMeta.lng,
                    tripDate: tripDate || new Date().toISOString().split('T')[0],
                    description: description,
                    time: Date.now(),
                    likes: 0
                };

                if (!travelData.posts) travelData.posts = [];
                travelData.posts.unshift(newPost);

                const upRes = await updateFile(FILE_TRAVEL, travelData, travelSha);

                if (upRes.success) {
                    travelSha = upRes.sha;
                    showToast(`🎉 成功点亮【${city}】！`);
                    clearImage();
                    document.getElementById('formDescription').value = '';
                    document.getElementById('descCount').innerText = '0/300';

                    await loadVisitedProvincesCityGeo();
                    refreshAllViews();
                    switchMainTab('map');
                    if (map) {
                        setTimeout(() => {
                            map.flyTo([cityMeta.lat, cityMeta.lng], 6.2, { duration: 0.9 });
                        }, 200);
                    }
                } else {
                    showToast("数据保存失败，请稍后重试");
                    travelData.posts.shift();
                }
            } catch (error) {
                console.error(error);
                showToast("文件上传失败，请检查网络或文件大小");
            } finally {
                btn.innerHTML = "点亮城市并发布 🚀";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => progressContainer.classList.add('hidden'), 1000);
            }
        }

        async function toggleLike(postId, event) {
            if (event) event.stopPropagation();

            if (!GITHUB_TOKEN) {
                showToast("预览模式无法点赞哦，请先配置Token 💡");
                return;
            }
            if (isLikingSyncing) {
                showToast("正在保存上次的点赞，请稍候... ⏳");
                return;
            }

            const post = (travelData.posts || []).find(p => p.id === postId);
            if (!post) return;

            post.likes = (post.likes || 0) + 1;

            let localLikes = JSON.parse(localStorage.getItem('loveGacha_myTravelLikes') || '[]');
            if (!localLikes.includes(postId)) {
                localLikes.push(postId);
                localStorage.setItem('loveGacha_myTravelLikes', JSON.stringify(localLikes));
            }

            if (!document.getElementById('wallView').classList.contains('hidden')) {
                renderWall();
            }

            isLikingSyncing = true;
            showToast("正在保存点赞... 🚀");

            const upRes = await updateFile(FILE_TRAVEL, travelData, travelSha);
            isLikingSyncing = false;

            if (upRes.success) {
                travelSha = upRes.sha;
                showToast("喜欢 +1 ❤️");
            } else {
                post.likes = Math.max(0, post.likes - 1);
                showToast("点赞保存失败，请检查网络 ❌");
                renderWall();
            }
        }

        function refreshAllViews() {
            updateStatsAndChips();
            refreshMapPolygonStyles();
            renderApplePhotoMarkers();
            if (!document.getElementById('wallView').classList.contains('hidden')) {
                renderProvinceFilterTabs();
                renderWall();
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (await fetchTravelData()) {
                    await loadVisitedProvincesCityGeo();
                    refreshAllViews();
                }
            }, 60000);
        }

        // =========================================================================
        // 9. 全屏高清图片双指缩放查看器
        // =========================================================================
        function openImageViewer(thumbUrl, fullUrl, postId) {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            const loader = document.getElementById('imageViewerLoader');
            const captionBar = document.getElementById('viewerCaptionBar');

            scale = 1;
            pointX = 0;
            pointY = 0;
            setTransform();

            img.src = thumbUrl || fullUrl;

            const post = (travelData.posts || []).find(p => p.id === postId);
            if (post) {
                captionBar.classList.remove('hidden');
                document.getElementById('viewerCityBadge').innerText = `📍 ${post.province || ''} · ${post.city}`;
                document.getElementById('viewerMetaText').innerText = `👦 ${post.uploader || '我们'} · ${post.tripDate || new Date(post.time).toLocaleDateString()}`;
                document.getElementById('viewerDescText').innerText = post.description || '在这里留下了美好的旅行足迹 ✨';
            } else {
                captionBar.classList.add('hidden');
            }

            img.onload = function() {
                const container = document.getElementById('imageContainer');
                const ratioX = container.clientWidth / img.naturalWidth;
                const ratioY = container.clientHeight / img.naturalHeight;
                const initialScale = Math.min(ratioX, ratioY, 1);

                img.style.width = (img.naturalWidth * initialScale) + 'px';
                img.style.height = (img.naturalHeight * initialScale) + 'px';
            };

            if (thumbUrl && thumbUrl !== fullUrl) {
                loader.classList.remove('hidden');
                const highResImg = new Image();
                highResImg.onload = () => {
                    img.src = fullUrl;
                    loader.classList.add('hidden');
                };
                highResImg.onerror = () => {
                    loader.classList.add('hidden');
                    showToast("原图加载失败");
                };
                highResImg.src = fullUrl;
            } else {
                loader.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
            });

            setupZoomAndPan();
        }

        function closeImageViewer(event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById('imageViewerModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('fullSizeImage').src = '';
            }, 300);
            removeZoomAndPan();
        }

        function setTransform() {
            const img = document.getElementById('fullSizeImage');
            img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function handlePointerDown(e) {
            e.preventDefault();
            panning = true;
            if (e.touches && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastDistance = Math.sqrt(dx * dx + dy * dy);
            } else {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - pointX;
                startY = clientY - pointY;
            }
        }

        function handlePointerMove(e) {
            e.preventDefault();
            if (!panning) return;

            if (e.touches && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const delta = distance - lastDistance;
                scale += delta * 0.01;
                scale = Math.min(Math.max(0.5, scale), 5);
                lastDistance = distance;
                setTransform();
            } else if (panning) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                pointX = clientX - startX;
                pointY = clientY - startY;
                setTransform();
            }
        }

        function handlePointerUp(e) {
            e.preventDefault();
            panning = false;
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = Math.sign(e.deltaY) * -0.1;
            scale += delta;
            scale = Math.min(Math.max(0.5, scale), 5);
            setTransform();
        }

        function setupZoomAndPan() {
            const container = document.getElementById('imageContainer');
            container.addEventListener('mousedown', handlePointerDown);
            container.addEventListener('mousemove', handlePointerMove);
            container.addEventListener('mouseup', handlePointerUp);
            container.addEventListener('mouseleave', handlePointerUp);
            container.addEventListener('wheel', handleWheel, { passive: false });
            container.addEventListener('touchstart', handlePointerDown, { passive: false });
            container.addEventListener('touchmove', handlePointerMove, { passive: false });
            container.addEventListener('touchend', handlePointerUp);
            container.addEventListener('touchcancel', handlePointerUp);
        }

        function removeZoomAndPan() {
            const container = document.getElementById('imageContainer');
            container.removeEventListener('mousedown', handlePointerDown);
            container.removeEventListener('mousemove', handlePointerMove);
            container.removeEventListener('mouseup', handlePointerUp);
            container.removeEventListener('mouseleave', handlePointerUp);
            container.removeEventListener('wheel', handleWheel);
            container.removeEventListener('touchstart', handlePointerDown);
            container.removeEventListener('touchmove', handlePointerMove);
            container.removeEventListener('touchend', handlePointerUp);
            container.removeEventListener('touchcancel', handlePointerUp);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('toast-animate');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-animate');
            }, 3000);
        }
    </script>
