<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>健身打卡与动作手账</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #1e293b;
            margin: 0;
            padding: 0 0 36px 0;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .shell { max-width: 480px; margin: 0 auto; padding: 12px; }
        .card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
        }
        .seg-btn { transition: all 0.18s ease; cursor: pointer; user-select: none; }
        .seg-btn.active { background: #1e293b; color: #ffffff; font-weight: 700; box-shadow: 0 2px 6px rgba(15,23,42,0.15); }

        .part-tab { transition: all 0.15s ease; cursor: pointer; user-select: none; white-space: nowrap; }
        .part-tab.active { background: #2563eb; color: #ffffff; font-weight: 700; }

        .ex-tab { transition: all 0.15s ease; cursor: pointer; user-select: none; white-space: nowrap; }
        .ex-tab.active { background: #eff6ff; color: #1d4ed8; border-color: #3b82f6; font-weight: 700; }

        canvas.stage { width: 100%; height: 230px; display: block; border-radius: 12px; background: #0f172a; }

        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fade 0.2s ease-out; }
    </style>
</head>
<body>

    <div class="shell space-y-3">

        <!-- 1. 极简顶部栏：角色切换（哼哼 / 亲亲） + 云端状态 -->
        <header class="card px-3.5 py-2.5 flex items-center justify-between">
            <!-- 角色一键切换 -->
            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
                <button onclick="switchRole('哼哼')" id="roleBtn_哼哼" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow-sm">
                    👦 哼哼 <span class="text-[11px] font-normal text-slate-500">165/53kg</span>
                </button>
                <button onclick="switchRole('亲亲')" id="roleBtn_亲亲" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500">
                    🌟 亲亲 <span class="text-[11px] font-normal text-slate-400">178/67kg</span>
                </button>
            </div>

            <!-- 云端同步与设置 -->
            <div class="flex items-center gap-1.5">
                <button onclick="syncFromCloud(true)" id="cloudBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 flex items-center gap-1.5 active:bg-slate-100">
                    <span id="cloudDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="cloudText">云端</span>
                </button>
                <button onclick="openConfigModal()" class="w-8 h-8 rounded-lg bg-slate-50 border border-slate-200 text-slate-500 flex items-center justify-center text-sm" title="云端设置">
                    ⚙️
                </button>
            </div>
        </header>

        <!-- 2. 主功能选项卡（仅2个核心大项：打卡与记录在最前面 | 动作与动画） -->
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-200/80 rounded-xl">
            <button onclick="switchMainTab('records')" id="mainTab_records" class="seg-btn active py-2.5 rounded-lg text-sm flex items-center justify-center gap-1.5">
                <span>📝 打卡与记录</span>
                <span id="todayCountBadge" class="px-1.5 py-0.2 bg-blue-600 text-white rounded-full text-[11px] hidden">0</span>
            </button>
            <button onclick="switchMainTab('actions')" id="mainTab_actions" class="seg-btn py-2.5 rounded-lg text-sm text-slate-600 flex items-center justify-center gap-1.5">
                <span>🎬 动作与动画</span>
            </button>
        </div>

        <!-- 3. 部位选项卡（5个部位固定一排，练前热身排最前） -->
        <div class="grid grid-cols-5 gap-1 bg-white p-1 rounded-xl border border-slate-200">
            <button onclick="switchPartTab('warmup')" id="partTab_warmup" class="part-tab active py-2 rounded-lg text-xs text-center">🔥 热身</button>
            <button onclick="switchPartTab('back')" id="partTab_back" class="part-tab py-2 rounded-lg text-xs text-slate-600 text-center">🦅 背部</button>
            <button onclick="switchPartTab('legs')" id="partTab_legs" class="part-tab py-2 rounded-lg text-xs text-slate-600 text-center">🦵 腿部</button>
            <button onclick="switchPartTab('chest')" id="partTab_chest" class="part-tab py-2 rounded-lg text-xs text-slate-600 text-center">🛡️ 胸肩</button>
            <button onclick="switchPartTab('stretch')" id="partTab_stretch" class="part-tab py-2 rounded-lg text-xs text-slate-600 text-center">🧘 拉伸</button>
        </div>

        <!-- ==================== 页面 1：打卡与记录（首屏默认，清爽直观） ==================== -->
        <section id="view_records" class="space-y-3 fade-in">

            <!-- 打卡录入卡 -->
            <div class="card p-4 space-y-3.5">
                <!-- 第一行：日期（默认今天） + 查看该动作动画按钮 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-500">日期</span>
                        <input type="date" id="logDateInput" onchange="renderRecordsView()" class="text-xs font-bold text-slate-800 bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 focus:outline-none">
                        <button onclick="resetDateToToday()" class="text-xs text-blue-600 font-medium px-1.5">今天</button>
                    </div>
                    <button onclick="jumpToCurrentExerciseAnim()" class="text-xs font-bold text-blue-600 hover:underline flex items-center gap-1">
                        <span>看此动作动画</span> &rarr;
                    </button>
                </div>

                <!-- 第二行：当前部位下的动作选择（点击胶囊直接切换动作） -->
                <div>
                    <div id="recordExercisePills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                        <!-- JS 生成当前部位动作胶囊 -->
                    </div>
                    <div id="recordHintBar" class="text-xs text-slate-500 mt-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                        <!-- 动态显示当前角色的推荐配重与组数 -->
                    </div>
                </div>

                <!-- 第三行：组数 / 次数 / 重量 极简步进器 -->
                <div class="grid grid-cols-3 gap-2.5">
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-center">
                        <div class="text-[11px] text-slate-500 mb-1">组数 (组)</div>
                        <div class="flex items-center justify-between">
                            <button type="button" onclick="adjustNum('inputSets', -1, 1, 20)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">-</button>
                            <input type="number" id="inputSets" value="4" class="w-10 text-center font-bold text-base bg-transparent focus:outline-none">
                            <button type="button" onclick="adjustNum('inputSets', 1, 1, 20)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-center">
                        <div class="text-[11px] text-slate-500 mb-1">每组次数/秒</div>
                        <div class="flex items-center justify-between">
                            <button type="button" onclick="adjustNum('inputReps', -1, 1, 120)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">-</button>
                            <input type="number" id="inputReps" value="12" class="w-10 text-center font-bold text-base bg-transparent focus:outline-none">
                            <button type="button" onclick="adjustNum('inputReps', 1, 1, 120)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-center">
                        <div class="text-[11px] text-slate-500 mb-1">重量 (kg)</div>
                        <div class="flex items-center justify-between">
                            <button type="button" onclick="adjustNum('inputWeight', -2.5, 0, 300)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">-</button>
                            <input type="number" id="inputWeight" value="30" step="0.5" class="w-12 text-center font-bold text-base text-blue-600 bg-transparent focus:outline-none">
                            <button type="button" onclick="adjustNum('inputWeight', 2.5, 0, 300)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700">+</button>
                        </div>
                    </div>
                </div>

                <!-- 第四行：简短备注 + 保存按钮 -->
                <div class="flex gap-2">
                    <input type="text" id="inputNote" placeholder="备注（选填，如：弹力带辅助）" class="flex-1 px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    <button type="button" onclick="saveWorkoutRecord()" id="saveRecordBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm active:scale-95 transition shrink-0">
                        保存打卡
                    </button>
                </div>
            </div>

            <!-- 历史记录列表卡 -->
            <div class="card p-4">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                    <div>
                        <h3 class="text-sm font-bold text-slate-800">训练记录</h3>
                        <p id="statSummaryText" class="text-[11px] text-slate-400 mt-0.5">当日完成 0 项 · 共 0 组</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="toggleFilterPart()" id="filterPartBtn" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium">
                            全部位
                        </button>
                        <button onclick="toggleRecordScope()" id="scopeToggleBtn" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium">
                            只看当天
                        </button>
                        <button onclick="exportRecordsCSV()" class="text-[11px] px-2 py-1 rounded-lg bg-slate-100 text-slate-600 font-medium" title="导出CSV表格">
                            导出
                        </button>
                    </div>
                </div>

                <div id="recordsListContainer" class="space-y-2 max-h-[48vh] overflow-y-auto">
                    <!-- JS 渲染记录列表 -->
                </div>
            </div>
        </section>

        <!-- ==================== 页面 2：动作与动画（单动作清爽展示） ==================== -->
        <section id="view_actions" class="hidden space-y-3 fade-in">

            <!-- 动作选项卡栏（点击动作只展示这一个动作，绝不堆叠） -->
            <div class="card p-2.5">
                <div id="exerciseTabsBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    <!-- JS 渲染当前部位下的动作选项卡 -->
                </div>
            </div>

            <!-- 单动作详情卡 -->
            <div id="singleExerciseContainer">
                <!-- JS 仅渲染当前选中的 1 个动作 -->
            </div>

        </section>

    </div>

    <!-- 云端设置弹窗（兼容 diary.html 的 GitHub Token 逻辑） -->
    <div id="configModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl space-y-3.5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                <h3 class="text-sm font-bold text-slate-900">⚙️ 云端同步设置 (GitHub)</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 text-lg font-bold">&times;</button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed m-0">
                与 <code class="bg-slate-100 px-1 rounded">diary.html</code> 共用同一个仓库 (<code class="bg-slate-100 px-1 rounded">878481881-jpg/loveplan</code>) 与 Token。哼哼数据存于 <code class="bg-slate-100 px-1 rounded">data/Hjs.json</code>，亲亲数据存于 <code class="bg-slate-100 px-1 rounded">data/Qjs.json</code>。
            </p>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">GitHub Token：</label>
                <input type="password" id="configTokenInput" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500 font-mono">
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="closeConfigModal()" class="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">关闭</button>
                <button onclick="saveConfigModal()" class="flex-1 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white">保存并同步</button>
            </div>
        </div>
    </div>

    <!-- 轻提示 Toast -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-full text-xs font-medium hidden z-50 whitespace-nowrap shadow-lg"></div>

<script>
// ============================================================================
// 1. 双角色配置：哼哼（165cm，53kg） & 亲亲（178cm，67kg）
// ============================================================================
const ROLES = {
    '哼哼': { name: '哼哼', height: 165, weight: 53, desc: '哼哼 (165cm · 53kg)' },
    '亲亲': { name: '亲亲', height: 178, weight: 67, desc: '亲亲 (178cm · 67kg)' }
};

// ============================================================================

    {

            '来回连续完成 30 次。'
        ],
        explanation: '提升髋关节灵活性，为深蹲和倒蹬机训练做准备。',

    },
    {
        id: 'warmup_adductor_shake', part: 'warmup', shortTab: '⑦ 激活内收肌',
        name: '下肢热身 3：抖动激活内收肌群', target: '激活大腿内侧内收肌群',
        defaultSets: 1, defaultReps: 30, unit: '秒', weightHeng: 0, weightQin: 0,
        hintHeng: '坐姿脚掌相对，上下抖动腿部 30 秒', hintQin: '坐姿脚掌相对，上下抖动腿部 30 秒',
        steps: [
            '坐在垫上，双脚脚掌相对合拢，双手轻握脚尖。',
            '腰背挺直，双膝向两侧放松打开。',
            '上下轻快抖动双腿，持续 30 秒。',
            '感受大腿内侧内收肌群温和激活。'
        ],
        explanation: '快速唤醒大腿内侧肌群，提升宽距深蹲与倒蹬时的髋部稳定。',
        precautions: '不要用手暴力按压膝盖，靠双腿自然上下抖动即可。'

function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getCurrentEx() {
    const exId = selectedExByPart[currentPartTab];
    return EXERCISES.find(e => e.id === exId) || EXERCISES.filter(e => e.part === currentPartTab)[0];
}

window.onload = async function() {
    document.getElementById('logDateInput').value = getTodayStr();
    loadLocalCache();
    updateRoleUI();
    renderRecordPills();
    renderRecordsView();
    renderSingleActionView();
    startAnimationLoop();
    await syncFromCloud(false);
};

function switchRole(role) {
    myIdentity = role;
    localStorage.setItem('loveGacha_myIdentity', role);
    updateRoleUI();
    syncInputsWithSelectedExercise();
    renderRecordsView();
    if (currentMainTab === 'actions') renderSingleActionView();

}

function updateRoleUI() {
    const bH = document.getElementById('roleBtn_哼哼');
    const bQ = document.getElementById('roleBtn_亲亲');
    if (myIdentity === '哼哼') {
        bH.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-blue-600 shadow-sm';
        bQ.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500';
    } else {
        bQ.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-rose-600 shadow-sm';
        bH.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500';
    }
}

function switchMainTab(tab) {
    currentMainTab = tab;
    document.getElementById('view_records').classList.toggle('hidden', tab !== 'records');
    document.getElementById('view_actions').classList.toggle('hidden', tab !== 'actions');

    const bRec = document.getElementById('mainTab_records');
    const bAct = document.getElementById('mainTab_actions');
    if (tab === 'records') {
        bRec.className = 'seg-btn active py-2.5 rounded-lg text-sm flex items-center justify-center gap-1.5';
        bAct.className = 'seg-btn py-2.5 rounded-lg text-sm text-slate-600 flex items-center justify-center gap-1.5';
        renderRecordPills();
        renderRecordsView();
    } else {
        bAct.className = 'seg-btn active py-2.5 rounded-lg text-sm flex items-center justify-center gap-1.5';
        bRec.className = 'seg-btn py-2.5 rounded-lg text-sm text-slate-600 flex items-center justify-center gap-1.5';
        renderSingleActionView();
    }
}

function switchPartTab(part) {
    currentPartTab = part;
    ['warmup', 'back', 'legs', 'chest', 'stretch'].forEach(p => {
        const btn = document.getElementById(`partTab_${p}`);
        if (p === part) {
            btn.className = 'part-tab active py-2 rounded-lg text-xs text-center';
        } else {
            btn.className = 'part-tab py-2 rounded-lg text-xs text-slate-600 text-center';
        }
    });
    if (currentMainTab === 'records') {
        renderRecordPills();
        if (!filterAllPartsInLog) renderRecordsView();
    } else {
        renderSingleActionView();
    }
}

function selectExercise(exId) {
    const ex = EXERCISES.find(e => e.id === exId);
    if (!ex) return;
    selectedExByPart[ex.part] = ex.id;
    if (currentMainTab === 'records') {
        renderRecordPills();
    } else {
        renderSingleActionView();
    }
}

function jumpToCurrentExerciseAnim() {
    switchMainTab('actions');
}

function jumpToRecordCurrentExercise() {
    switchMainTab('records');
    syncInputsWithSelectedExercise();
}

function renderRecordPills() {
    const list = EXERCISES.filter(e => e.part === currentPartTab);
    const activeEx = getCurrentEx();
    const box = document.getElementById('recordExercisePills');
    box.innerHTML = list.map(ex => {
        const isAct = (ex.id === activeEx.id);
        return `
            <button type="button" onclick="selectExercise('${ex.id}')"
                class="ex-tab px-3 py-1.5 rounded-lg text-xs border ${isAct ? 'active' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                ${ex.shortTab}
            </button>
        `;
    }).join('');
    syncInputsWithSelectedExercise();
}

function syncInputsWithSelectedExercise() {
    const ex = getCurrentEx();
    if (!ex) return;
    const w = myIdentity === '亲亲' ? ex.weightQin : ex.weightHeng;
    const hint = myIdentity === '亲亲' ? ex.hintQin : ex.hintHeng;
    document.getElementById('inputSets').value = ex.defaultSets;
    document.getElementById('inputReps').value = ex.defaultReps;
    document.getElementById('inputWeight').value = w;
    document.getElementById('recordHintBar').innerHTML =
        `<strong class="text-slate-800">${ex.name}</strong> · ${hint}`;
}

function adjustNum(id, delta, minV, maxV) {
    const el = document.getElementById(id);
    let v = parseFloat(el.value) || 0;
    v = Math.max(minV, Math.min(maxV, Number((v + delta).toFixed(1))));
    el.value = v;
}

function resetDateToToday() {
    document.getElementById('logDateInput').value = getTodayStr();
    showAllDatesInLog = false;
    document.getElementById('scopeToggleBtn').innerText = '只看当天';
    renderRecordsView();
}

function toggleRecordScope() {
    showAllDatesInLog = !showAllDatesInLog;
    document.getElementById('scopeToggleBtn').innerText = showAllDatesInLog ? '全部日期' : '只看当天';
    renderRecordsView();
}

function toggleFilterPart() {
    filterAllPartsInLog = !filterAllPartsInLog;
    document.getElementById('filterPartBtn').innerText = filterAllPartsInLog ? '全部位' : '当前部位';
    renderRecordsView();
}

function getAllMergedRecords() {
    const hList = (dataHJs.records || []).map(r => ({ ...r, author: r.author || '哼哼' }));
    const qList = (dataQJs.records || []).map(r => ({ ...r, author: r.author || '亲亲' }));
    const map = new Map();
    [...hList, ...qList].forEach(r => map.set(r.id || r.time, r));
    return Array.from(map.values()).sort((a, b) => (b.time || 0) - (a.time || 0));
}

async function saveWorkoutRecord() {
    const ex = getCurrentEx();
    if (!ex) return;
    const dateStr = document.getElementById('logDateInput').value || getTodayStr();
    const sets = Math.max(1, parseInt(document.getElementById('inputSets').value) || 1);
    const reps = Math.max(1, parseInt(document.getElementById('inputReps').value) || 1);
    const weight = Math.max(0, parseFloat(document.getElementById('inputWeight').value) || 0);
    const note = document.getElementById('inputNote').value.trim();
    const btn = document.getElementById('saveRecordBtn');

    const now = Date.now();
    const rec = {
        id: `rec_${now}`,
        time: now,
        date: dateStr,
        part: ex.part,
        exerciseId: ex.id,
        exerciseName: ex.name,
        unit: ex.unit || '次',
        sets,
        reps,
        weight,
        volume: Math.round(sets * reps * weight * 10) / 10,
        note,
        author: myIdentity
    };

    const isHeng = (myIdentity !== '亲亲');
    const targetData = isHeng ? dataHJs : dataQJs;
    const targetPath = isHeng ? FILE_H_JS : FILE_Q_JS;
    const targetSha = isHeng ? shaHJs : shaQJs;

    targetData.records.unshift(rec);
    saveLocalCache();
    document.getElementById('inputNote').value = '';
    renderRecordsView();

    if (!GITHUB_TOKEN) {
        showToast(`✅ 已记录 (${myIdentity})！点右上角⚙️可开启云端同步`);
        return;
    }

    btn.disabled = true;
    btn.innerText = '上传中...';
    const upRes = await updateFile(targetPath, targetData, targetSha);
    if (upRes.success) {
        if (isHeng) shaHJs = upRes.sha; else shaQJs = upRes.sha;
        setCloudStatus('ok', '已同步');
        showToast(`☁️ 已同步至云端 (${myIdentity})`);
    } else {
        setCloudStatus('warn', '已存本地');
        showToast('已保存在本地');
    }
    btn.disabled = false;
    btn.innerText = '保存打卡';
}

async function deleteRecord(recId, author) {
    const isHeng = (author !== '亲亲');
    const targetData = isHeng ? dataHJs : dataQJs;
    const targetPath = isHeng ? FILE_H_JS : FILE_Q_JS;
    const targetSha = isHeng ? shaHJs : shaQJs;

    targetData.records = (targetData.records || []).filter(r => String(r.id || r.time) !== String(recId));
    saveLocalCache();
    renderRecordsView();
    if (GITHUB_TOKEN) {
        const upRes = await updateFile(targetPath, targetData, targetSha);
        if (upRes.success) {
            if (isHeng) shaHJs = upRes.sha; else shaQJs = upRes.sha;
        }
    }
    showToast('已删除该条记录');
}

function renderRecordsView() {
    const selectedDate = document.getElementById('logDateInput').value || getTodayStr();
    const all = getAllMergedRecords();

    const dayList = all.filter(r => r.date === selectedDate);
    const totalSets = dayList.reduce((s, r) => s + (Number(r.sets) || 0), 0);
    const totalVol = dayList.reduce((s, r) => s + (Number(r.volume) || 0), 0);
    document.getElementById('statSummaryText').innerText =
        `${selectedDate} 完成 ${dayList.length} 项 · 共 ${totalSets} 组 · 容量 ${Math.round(totalVol)} kg`;

    const todayCnt = all.filter(r => r.date === getTodayStr()).length;
    const badge = document.getElementById('todayCountBadge');
    badge.innerText = todayCnt;
    badge.classList.toggle('hidden', todayCnt === 0);

    let list = showAllDatesInLog ? all : dayList;
    if (!filterAllPartsInLog) {
        list = list.filter(r => r.part === currentPartTab);
    }

    const box = document.getElementById('recordsListContainer');
    if (list.length === 0) {
        box.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">暂无打卡记录，在上方选择动作点击“保存打卡”即可记录</div>`;
        return;

    box.innerHTML = list.map(r => {
        const isQin = (r.author === '亲亲');
        const tagCls = isQin ? 'bg-rose-50 text-rose-600' : 'bg-blue-50 text-blue-600';
        const u = r.unit || '次';
        return `
            <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                        <span class="px-1.5 py-0.5 rounded font-bold text-[10px] ${tagCls}">${r.author}</span>
                        <span class="font-bold text-slate-800 truncate">${r.exerciseName}</span>
                        <span class="text-[10px] text-slate-400">${r.date.slice(5)}</span>
                    </div>
                    ${r.note ? `<div class="text-[11px] text-slate-400 mt-0.5 truncate">${r.note}</div>` : ''}
                </div>
                <div class="flex items-center gap-2 shrink-0 ml-2">
                    <span class="font-bold text-slate-700">${r.sets}组×${r.reps}${u} <strong class="text-blue-600">${r.weight > 0 ? r.weight + 'kg' : '自重'}</strong></span>
                    <button onclick="deleteRecord('${r.id || r.time}', '${r.author}')" class="text-slate-300 hover:text-rose-500 text-base leading-none px-1">&times;</button>
                </div>
            </div>
        `;
    }).join('');
}

function setAnimStep(exId, mode) {
    animStates[exId] = { mode };
    ['loop', 0, 1, 2, 3].forEach(m => {
        const b = document.getElementById(`stepBtn_${m}`);
        if (!b) return;
        b.className = (m === mode)
            ? 'py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white'
            : 'py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600';
    });
}

// ============================================================================
// 7. 清爽高对比 60FPS 动作演示动画引擎
// ============================================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function getCycleMetrics(exId, nowMs) {
    const st = animStates[exId] || { mode: 'loop' };
    if (st.mode !== 'loop') {
        const idx = Number(st.mode);
        const prog = [0.0, 0.55, 1.0, 0.4][idx];
        const titles = ['① 准备姿势', '② 向心发力 (吐气)', '③ 顶峰收缩挤压', '④ 慢速离心回放 (吸气)'];
        return { p: prog, title: titles[idx], isEccentric: idx === 3 };
    }
    const period = 4000;
    const t = (nowMs % period) / period;
    if (t < 0.16) return { p: 0.0, title: '① 准备姿势 · 吸气稳核心', isEccentric: false };
    if (t < 0.45) {
        const u = (t - 0.16) / 0.29;
        return { p: 0.5 - 0.5 * Math.cos(u * Math.PI), title: '② 向心发力 · 吐气收缩', isEccentric: false };
    }
    if (t < 0.60) return { p: 1.0, title: '③ 顶峰收缩 · 停顿挤压', isEccentric: false };
    const u = (t - 0.60) / 0.40;
    return { p: 0.5 + 0.5 * Math.cos(u * Math.PI), title: '④ 离心回放 · 慢吸控制', isEccentric: true };
}

function drawStage(canvas, ex, nowMs) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth || 440;
    const H = canvas.clientHeight || 230;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.scale(dpr, dpr);

    // 干净深色背景
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, W, H);

    const floorY = H - 22;
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(24, floorY);
    ctx.lineTo(W - 24, floorY);
    ctx.stroke();

    const m = getCycleMetrics(ex.id, nowMs);
    const p = m.p;

    // 顶部极简步骤文字提示
    ctx.font = 'bold 12px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(m.title, 16, 24);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(ROLES[myIdentity].desc, W - 16, 24);
    ctx.textAlign = 'left';

    const cx0 = W * 0.5;
    const scale = (H - 48) / 8.5;
    const tx = x => cx0 + (x - 5.0) * scale;
    const ty = y => floorY - (y - 1.5) * scale;

    function line(pts, lw, col, dash = false) {
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (dash) ctx.setLineDash([4, 4]);
        ctx.beginPath();
        pts.forEach((pt, i) => i === 0 ? ctx.moveTo(tx(pt[0]), ty(pt[1])) : ctx.lineTo(tx(pt[0]), ty(pt[1])));
        ctx.stroke();
        ctx.restore();
    }

    function circle(x, y, r, fill, stroke) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(tx(x), ty(y), r * scale, 0, Math.PI * 2);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.restore();
    }

    function glow(x, y, rx, ry, deg = 0) {
        ctx.save();
        ctx.translate(tx(x), ty(y));
        ctx.rotate((deg * Math.PI) / 180);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx * scale, ry * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(244, 63, 94, ${0.35 + 0.5 * p})`;
        ctx.fill();
        ctx.restore();
    }

    const cBody = myIdentity === '亲亲' ? '#fb7185' : '#60a5fa';
    const cEquip = '#64748b';
    const cBar = '#f8fafc';

    // 各动作动画绘制
    if (ex.id === 'warmup_back_roll') {
        const s = lerp(-0.7, 0.7, p);
        circle(5.0, 2.1, 0.5, '#3b82f6', '#93c5fd');
        line([[2.7 + s, 1.5], [3.8 + s, 2.7], [4.6 + s, 2.2], [6.3 + s, 2.8]], 6, cBody);
        glow(5.3 + s, 2.6, 0.7, 0.3, 12);
        circle(6.85 + s, 3.15, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'warmup_open_chest') {
        const ang = (lerp(15, 155, p) * Math.PI) / 180;
        line([[3.3, 2.0], [4.6, 2.0], [4.6, 4.8]], 6, cBody);
        circle(4.6, 5.45, 0.38, '#dbeafe', cBody);
        line([[4.6, 4.5], [4.6 + 2.0 * Math.cos(ang), 4.5 + 1.0 * Math.sin(ang)]], 4.5, '#fbbf24');
        glow(4.6, 4.4, 0.5, 0.38, 0);
    }
    else if (ex.id === 'warmup_armpit_press') {
        const pr = lerp(0, 0.16, p);
        circle(4.5, 2.05, 0.4, '#ef4444', '#fca5a5');
        line([[2.5, 1.8], [4.5, 2.5 - pr], [6.5, 3.7 - pr]], 6, cBody);
        glow(4.6, 2.6 - pr, 0.5, 0.4, 20);
        circle(5.4, 3.25 - pr, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'warmup_band_shoulder') {
        const ang = (lerp(-35, 215, p) * Math.PI) / 180;
        line([[5.0, 1.5], [5.0, 5.2]], 6, cBody);
        circle(5.0, 5.9, 0.38, '#dbeafe', cBody);
        const hy = 5.0 + 1.8 * Math.sin(ang);
        const sp = 1.8 + 0.4 * Math.abs(Math.cos(ang));
        line([[5.0 - sp, hy], [4.4, 5.0], [5.6, 5.0], [5.0 + sp, hy]], 4.2, cBody);
        line([[5.0 - sp, hy], [5.0 + sp, hy]], 2.5, '#10b981', true);
    }
    else if (ex.id === 'warmup_calf_roll') {
        const s = lerp(-0.55, 0.55, p);
        circle(6.0, 1.95, 0.4, '#3b82f6', '#93c5fd');
        line([[3.2 + s, 4.3], [3.6 + s, 2.2], [7.0 + s, 2.4]], 6, cBody);
        glow(6.0, 2.35, 0.6, 0.28, 5);
        circle(3.2 + s, 4.95, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'warmup_hip_mobility') {
        const sw = lerp(-1.3, 1.5, p);
        line([[4.6, 1.5], [4.8, 4.2], [4.8, 5.9]], 6, cBody);
        line([[4.8, 4.2], [4.8 + sw, 2.7], [4.8 + sw * 1.1, 1.6]], 5, '#fbbf24');
        glow(4.8, 4.2, 0.48, 0.4, 0);
        circle(4.8, 6.55, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'warmup_adductor_shake') {
        const fl = Math.sin(nowMs / 110) * 0.4;
        line([[5.0, 1.9], [5.0, 4.9]], 6, cBody);
        circle(5.0, 5.6, 0.38, '#dbeafe', cBody);
        line([[5.0, 2.1], [3.1, 2.5 + fl], [4.7, 1.7]], 5, cBody);
        line([[5.0, 2.1], [6.9, 2.5 + fl], [5.3, 1.7]], 5, cBody);
    }
    else if (ex.id === 'warmup_frog_pose') {
        const hy = lerp(2.0, 3.6, p);
        line([[2.7, 1.6], [3.9, hy], [6.1, 2.4], [6.7, 1.6]], 6, cBody);
        glow(4.3, hy - 0.1, 0.6, 0.35, 0);
        circle(6.6, 2.9, 0.36, '#dbeafe', cBody);
    }
    else if (ex.id === 'pull_up') {
        line([[2.4, 1.5], [2.4, 8.1], [7.6, 8.1], [7.6, 1.5]], 3.5, cEquip);
        line([[2.8, 7.8], [7.2, 7.8]], 4.5, cBar);
        const lift = lerp(0, 2.0, p);
        const shY = 4.5 + lift, footY = 1.55 + lift, elY = lerp(6.3, 5.4, p);
        line([[5.0, 7.8], [5.0, footY]], 1.8, '#10b981', true);
        line([[5.0, footY], [5.0, shY]], 6.5, cBody);
        glow(4.5, shY - 0.5, 0.35, 0.6, 12);
        glow(5.5, shY - 0.5, 0.35, 0.6, -12);
        circle(5.0, shY + 0.6, 0.38, '#dbeafe', cBody);
        line([[4.3, shY], [3.4, elY], [3.4, 7.8]], 4.2, cBody);
        line([[5.7, shY], [6.6, elY], [6.6, 7.8]], 4.2, cBody);
    }
    else if (ex.id === 'lat_pulldown') {
        line([[2.2, 1.5], [2.2, 8.3], [5.0, 8.3]], 3.5, cEquip);
        line([[4.0, 3.1], [5.8, 3.1]], 4.5, cEquip);
        const by = lerp(7.5, 5.1, p), ey = lerp(6.4, 4.0, p);
        line([[5.0, 8.3], [5.0, by]], 2, '#94a3b8');
        line([[3.0, by], [7.0, by]], 4, cBar);
        line([[5.0, 3.2], [4.1, 3.2], [4.1, 1.5]], 4, '#94a3b8');
        line([[5.0, 3.2], [5.15, 5.1]], 6.5, cBody);
        glow(4.5, 4.4, 0.35, 0.6, 14);
        glow(5.6, 4.4, 0.35, 0.6, -14);
        circle(5.15, 5.75, 0.38, '#dbeafe', cBody);
        line([[4.35, 5.0], [3.5, ey], [3.2, by]], 4.2, cBody);
        line([[5.65, 5.0], [6.5, ey], [6.8, by]], 4.2, cBody);
    }
    else if (ex.id === 'cable_row' || ex.id === 'single_arm_row') {
        line([[2.2, 1.5], [2.2, 6.0]], 4, cEquip);
        line([[4.4, 2.5], [7.2, 2.5]], 4.5, cEquip);
        const shX = lerp(5.5, 6.2, p), hdX = lerp(3.8, 5.8, p), elX = lerp(4.6, 6.8, p);
        line([[2.2, 4.0], [hdX, 3.9]], 2, '#94a3b8');
        line([[6.1, 2.6], [4.3, 3.2], [2.5, 2.6]], 4.2, '#94a3b8');
        line([[6.1, 2.6], [shX, 5.1]], 6.5, cBody);
        glow(shX + 0.2, 4.1, 0.38, 0.65, 5);
        circle(shX, 5.75, 0.38, '#dbeafe', cBody);
        line([[shX, 4.8], [elX, 3.95], [hdX, 3.9]], 4.5, cBody);
    }
    else if (ex.id === 'wide_row') {
        line([[4.0, 3.7], [5.8, 5.1]], 5.5, cEquip);
        line([[4.8, 1.5], [4.8, 4.3]], 3.5, cEquip);
        const by = lerp(2.6, 4.3, p), ey = lerp(3.5, 5.3, p);
        line([[3.2, 1.8], [4.2, 3.5], [5.7, 5.0]], 6, cBody);
        glow(5.0, 4.5, 0.55, 0.32, 36);
        circle(6.1, 5.5, 0.36, '#dbeafe', cBody);
        line([[5.5, 4.8], [5.8, ey], [6.0, by]], 4.2, cBody);
    }
    else if (ex.id === 'face_pull') {
        line([[2.2, 1.5], [2.2, 7.8]], 4, cEquip);
        const hx = lerp(4.1, 6.2, p), exX = lerp(4.8, 6.7, p), eyY = lerp(5.7, 6.4, p);
        line([[2.2, 6.4], [hx, 6.35]], 2, '#94a3b8');
        line([[6.1, 1.5], [5.9, 3.1], [6.5, 4.2], [6.2, 5.8]], 6, cBody);
        glow(6.3, 5.65, 0.42, 0.35, 0);
        circle(6.1, 6.45, 0.38, '#dbeafe', cBody);
        line([[6.2, 5.7], [exX, eyY], [hx, 6.35]], 4.2, cBody);
    }
    else if (ex.id === 'bicep_curl') {
        const ang = (lerp(-75, 48, p) * Math.PI) / 180;
        const sh = [5.0, 5.6], el = [5.0, 4.0];
        const hd = [el[0] - 1.35 * Math.cos(ang), el[1] + 1.35 * Math.sin(ang)];
        line([[5.0, 1.5], [5.0, 3.6], sh], 6, cBody);
        circle(5.0, 6.25, 0.38, '#dbeafe', cBody);
        line([sh, el], 4.8, cBody);
        glow(4.75, 4.85, 0.28, 0.5, 0);
        line([el, hd], 4.2, cBar);
        circle(hd[0], hd[1], 0.18, '#fbbf24', '#fff');
    }
    else if (ex.id === 'smith_squat') {
        line([[4.8, 1.5], [4.8, 8.1]], 3.5, cEquip);
        const hip = [lerp(5.0, 6.0, p), lerp(4.6, 3.3, p)];
        const knee = [lerp(4.8, 4.25, p), lerp(3.0, 3.0, p)];
        const sh = [4.8, lerp(6.4, 4.9, p)];
        line([[4.8, 1.5], knee, hip, sh], 6, cBody);
        glow((hip[0] + knee[0]) / 2, (hip[1] + knee[1]) / 2 + 0.15, 0.6, 0.3, -22);
        circle(sh[0], sh[1] + 0.55, 0.38, '#dbeafe', cBody);
        circle(sh[0], sh[1] - 0.1, 0.2, '#fbbf24', '#fff');
    }
    else if (ex.id === 'leg_press') {
        line([[2.0, 7.3], [6.2, 3.0]], 3.5, cEquip);
        line([[6.2, 2.3], [8.0, 3.7]], 5.5, cEquip);
        const plate = [lerp(3.5, 4.7, p), lerp(5.8, 4.5, p)];
        const knee = [lerp(4.7, 5.9, p), lerp(4.4, 4.8, p)];
        line([[plate[0] - 0.4, plate[1] - 0.4], [plate[0] + 0.4, plate[1] + 0.4]], 5.5, cBar);
        line([[6.0, 2.5], [7.3, 3.6]], 6, cBody);
        circle(7.7, 4.05, 0.36, '#dbeafe', cBody);
        line([[6.0, 2.5], knee, plate], 5, cBody);
        glow(5.3, 3.6, 0.55, 0.3, 42);
    }
    else if (ex.id === 'hip_adduction' || ex.id === 'hip_abduction') {
        const isAdd = (ex.id === 'hip_adduction');
        const ang = ((isAdd ? lerp(38, 8, p) : lerp(8, 38, p)) * Math.PI) / 180;
        const Lf = [5.0 - 2.8 * Math.sin(ang), 6.2 - 2.8 * Math.cos(ang)];
        const Rf = [5.0 + 2.8 * Math.sin(ang), 6.2 - 2.8 * Math.cos(ang)];
        line([[3.9, 6.2], [6.1, 6.2]], 5.5, cEquip);
        line([[5.0, 6.2], Lf], 5.5, cBody);
        line([[5.0, 6.2], Rf], 5.5, cBody);
        glow(isAdd ? 4.5 : 4.0, 5.1, 0.3, 0.55, 0);
        glow(isAdd ? 5.5 : 6.0, 5.1, 0.3, 0.55, 0);
        circle(5.0, 6.2, 0.4, '#dbeafe', cBody);
    }
    else if (ex.id === 'calf_raise') {
        line([[3.6, 1.6], [6.4, 1.6]], 4.5, cEquip);
        const hy = lerp(1.75, 2.7, p);
        line([[5.5, 1.6], [4.6, hy], [4.8, hy + 2.1], [4.8, hy + 4.2]], 6, cBody);
        glow(4.5, hy + 1.2, 0.28, 0.55, 5);
        circle(4.8, hy + 4.8, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'leg_extension') {
        line([[3.3, 3.4], [5.4, 3.4]], 5, cEquip);
        line([[3.3, 3.4], [3.1, 6.0]], 5, cEquip);
        const ang = (lerp(-78, 0, p) * Math.PI) / 180;
        const knee = [5.4, 3.6];
        const ankle = [knee[0] + 2.0 * Math.cos(ang), knee[1] + 2.0 * Math.sin(ang)];
        line([[3.6, 3.6], [3.4, 5.6]], 6, cBody);
        circle(3.4, 6.2, 0.38, '#dbeafe', cBody);
        line([[3.6, 3.6], knee, ankle], 5, cBody);
        glow(4.5, 3.9, 0.6, 0.28, 0);
    }
    else if (ex.id === 'bench_press') {
        line([[2.4, 2.9], [7.0, 2.9]], 5.5, cEquip);
        line([[3.1, 1.5], [3.1, 2.9]], 4, cEquip);
        line([[6.3, 1.5], [6.3, 2.9]], 4, cEquip);
        line([[6.5, 1.5], [6.5, 6.8]], 3.5, cEquip);
        line([[2.3, 1.5], [2.6, 3.0], [3.8, 3.1], [5.7, 3.25]], 6, cBody);
        circle(6.25, 3.35, 0.36, '#dbeafe', cBody);
        const barY = lerp(3.95, 6.0, p), barX = lerp(5.1, 5.5, p), elY = lerp(2.7, 4.6, p);
        glow(5.3, 3.55, 0.55, 0.32, 5);
        line([[5.5, 3.25], [5.0, elY], [barX, barY]], 4.5, cBody);
        circle(barX, barY, 0.28, '#fbbf24', '#fff');
    }
    else if (ex.id === 'chest_press') {
        line([[2.9, 1.5], [2.9, 7.1]], 5, cEquip);
        const hx = lerp(4.2, 6.4, p), exX = lerp(3.0, 4.9, p);
        line([[3.2, 3.1], [4.5, 3.1], [4.7, 1.5]], 4.2, '#94a3b8');
        line([[3.2, 3.1], [3.2, 5.5]], 6, cBody);
        glow(3.6, 4.9, 0.35, 0.5, 0);
        circle(3.2, 6.1, 0.38, '#dbeafe', cBody);
        line([[3.2, 5.1], [exX, 4.5], [hx, 4.9]], 4.5, cBody);
    }
    else if (ex.id === 'lateral_raise') {
        const ang = (lerp(15, 82, p) * Math.PI) / 180;
        const shL = [4.2, 5.4], shR = [5.8, 5.4];
        const Lel = [shL[0] - 1.3 * Math.sin(ang), shL[1] - 1.3 * Math.cos(ang)];
        const Lhd = [Lel[0] - 0.9 * Math.sin(ang), Lel[1] - 0.9 * math.cos(ang)];
        const Rel = [shR[0] + 1.3 * Math.sin(ang), shR[1] - 1.3 * Math.cos(ang)];
        const Rhd = [Rel[0] + 0.9 * Math.sin(ang), Rel[1] - 0.9 * Math.cos(ang)];
        line([[5.0, 2.9], [5.0, 5.5]], 6.5, cBody);
        glow(4.1, 5.5, 0.32, 0.32, 0);
        glow(5.9, 5.5, 0.32, 0.32, 0);
        circle(5.0, 6.2, 0.38, '#dbeafe', cBody);
        line([shL, Lel, Lhd], 4.2, cBody);
        line([shR, Rel, Rhd], 4.2, cBody);
    }
    else if (ex.id === 'db_press') {
        line([[2.6, 2.7], [6.1, 4.7]], 5.5, cEquip);
        const dby = lerp(4.7, 6.7, p), ely = lerp(3.9, 5.7, p);
        line([[3.2, 3.2], [5.4, 4.5]], 6, cBody);
        glow(5.1, 4.7, 0.42, 0.32, 28);
        circle(5.9, 4.9, 0.36, '#dbeafe', cBody);
        line([[5.2, 4.5], [4.7, ely], [5.0, dby]], 4.5, cBody);
        line([[4.65, dby], [5.35, dby]], 4.5, '#fbbf24');
    }
    else if (ex.id === 'pec_fly') {
        const ang = (lerp(72, 10, p) * Math.PI) / 180;
        const Lel = [4.2 - 1.4 * Math.sin(ang), 5.5 - 1.1 * Math.cos(ang)];
        const Lhd = [Lel[0] - 0.5 * Math.sin(ang - 0.5), Lel[1] - 1.0 * Math.cos(ang - 0.5)];
        const Rel = [5.8 + 1.4 * Math.sin(ang), 5.5 - 1.1 * Math.cos(ang)];
        const Rhd = [Rel[0] + 0.5 * Math.sin(ang - 0.5), Rel[1] - 1.0 * Math.cos(ang - 0.5)];
        line([[3.6, 6.4], [6.4, 6.4]], 5.5, cEquip);
        glow(4.4, 5.2, 0.4, 0.28, -15);
        glow(5.6, 5.2, 0.4, 0.28, 15);
        circle(5.0, 5.8, 0.42, '#dbeafe', cBody);
        line([[4.3, 5.7], Lel, Lhd], 4.5, cBody);
        line([[5.7, 5.7], Rel, Rhd], 4.5, cBody);
    }
    else if (ex.id === 'tricep_pushdown') {
        line([[3.0, 1.5], [3.0, 8.0]], 4, cEquip);
        const ang = (lerp(35, -75, p) * Math.PI) / 180;
        const sh = [5.3, 5.6], el = [5.2, 4.1];
        const hd = [el[0] - 1.35 * Math.cos(ang), el[1] + 1.35 * Math.sin(ang)];
        line([[3.0, 7.8], hd], 2, '#94a3b8');
        line([[5.0, 1.5], [5.3, 3.5], sh], 6, cBody);
        glow(5.45, 4.85, 0.26, 0.5, 0);
        circle(5.3, 6.2, 0.36, '#dbeafe', cBody);
        line([sh, el, hd], 4.5, cBody);
    }
    else if (ex.id === 'stretch_chest') {
        const ln = lerp(0, 0.4, p);
        line([[6.5, 1.5], [6.5, 7.5]], 5, cEquip);
        line([[4.6 + ln, 1.5], [4.8 + ln, 5.3]], 6, cBody);
        line([[4.8 + ln, 5.0], [6.4, 5.0], [6.4, 6.3]], 4.5, '#fbbf24');
        glow(5.3 + ln * 0.5, 5.0, 0.5, 0.35, 0);
        circle(4.8 + ln, 5.95, 0.38, '#dbeafe', cBody);
    }
    else if (ex.id === 'stretch_back') {
        const bs = lerp(0, 0.6, p);
        line([[2.6, 1.5], [2.6, 7.2]], 5, cEquip);
        line([[5.9, 1.5], [6.5 + bs, 3.5], [4.9 + bs, 5.0], [2.6, 5.0]], 5.5, cBody);
        glow(5.5 + bs, 4.2, 0.6, 0.35, -30);
        circle(4.7 + bs, 5.5, 0.36, '#dbeafe', cBody);
    }
    else if (ex.id === 'stretch_tricep' || ex.id === 'stretch_shoulder') {
        const pr = lerp(0, 0.3, p);
        line([[5.0, 1.5], [5.0, 5.3]], 6, cBody);
        circle(5.0, 6.0, 0.38, '#dbeafe', cBody);
        line([[4.4, 5.1], [6.2 - pr, 5.1]], 4.5, '#fbbf24');
        glow(4.4, 5.1, 0.4, 0.35, 0);
    }
    else {
        const bd = lerp(0, 0.4, p);
        line([[3.6, 1.8], [6.5, 1.8]], 5, cBody);
        line([[3.6, 1.8], [4.8 + bd, 4.1 - bd], [6.3, 2.1]], 5, cBody);
        glow(5.0, 2.0, 0.7, 0.28, 0);
        circle(5.2 + bd, 4.7 - bd, 0.36, '#dbeafe', cBody);
    }

    ctx.restore();
}

// ============================================================================
// 8. 本地存储与 GitHub API 云同步逻辑（与 diary.html 一致）
// ============================================================================
function loadLocalCache() {
    try {
        const raw = localStorage.getItem(LOCAL_CACHE_KEY) || localStorage.getItem('loveGacha_fitnessRecords_v1');
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.dataHJs) dataHJs = parsed.dataHJs;
            if (parsed.dataQJs) dataQJs = parsed.dataQJs;
        }
    } catch (e) {}
    if (!dataHJs.records) dataHJs.records = [];
    if (!dataQJs.records) dataQJs.records = [];
}

function saveLocalCache() {
    try {
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ dataHJs, dataQJs, updatedAt: Date.now() }));
    } catch (e) {}
}

function setCloudStatus(type, text) {
    const dot = document.getElementById('cloudDot');
    const txt = document.getElementById('cloudText');
    txt.innerText = text;
    dot.className = type === 'ok'
        ? 'w-2 h-2 rounded-full bg-emerald-500'
        : (type === 'syncing' ? 'w-2 h-2 rounded-full bg-blue-500 animate-ping' : 'w-2 h-2 rounded-full bg-amber-500');
}

async function fetchFile(filePath) {
    if (!GITHUB_TOKEN) return { noToken: true };
    try {
        const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
            method: 'GET',
            headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
        });
        if (response.status === 401 || response.status === 403) return { authError: true };
        if (response.status === 404) return { data: { records: [] }, sha: null };
        if (!response.ok) return { error: true };
        const result = await response.json();
        const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
        return { data: JSON.parse(contentStr || '{"records":[]}'), sha: result.sha };
    } catch (e) { return { error: true }; }
}

async function updateFile(filePath, newData, sha) {
    if (!GITHUB_TOKEN) return { noToken: true };
    try {
        const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
        const body = { message: `Update fitness records (${myIdentity})`, content: encodedContent };
        if (sha) body.sha = sha;
        const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
            method: 'PUT',
            headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!response.ok) return { success: false, sha };
        const result = await response.json();
        return { success: true, sha: result.content.sha };
    } catch (e) { return { success: false, sha }; }
}

function mergeRecords(a, b) {
    const map = new Map();
    (a || []).forEach(r => map.set(r.id || r.time, r));
    (b || []).forEach(r => map.set(r.id || r.time, r));
    return Array.from(map.values()).sort((x, y) => (y.time || 0) - (x.time || 0));
}

async function syncFromCloud(manual) {
    GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken') || '';
    if (!GITHUB_TOKEN) {
        setCloudStatus('warn', '本地');
        if (manual) openConfigModal();
        return;
    }
    setCloudStatus('syncing', '同步中');
    const [resH, resQ] = await Promise.all([fetchFile(FILE_H_JS), fetchFile(FILE_Q_JS)]);
    if (resH.authError || resQ.authError || resH.error || resQ.error) {
        setCloudStatus('warn', '离线');
        if (manual) showToast('无法连接云端，已使用本地记录');
        return;
    }
    shaHJs = resH.sha;
    shaQJs = resQ.sha;
    dataHJs.records = mergeRecords(dataHJs.records, (resH.data && resH.data.records) || []);
    dataQJs.records = mergeRecords(dataQJs.records, (resQ.data && resQ.data.records) || []);
    saveLocalCache();
    renderRecordsView();
    setCloudStatus('ok', '已同步');
    if (manual) showToast('☁️ 云端同步完成');
}

function exportRecordsCSV() {
    const all = getAllMergedRecords();
    if (!all.length) { showToast('暂无记录'); return; }
    const lines = ['日期,角色,动作,组数,次数,重量(kg),备注'].concat(
        all.map(r => `${r.date},${r.author},"${r.exerciseName}",${r.sets},${r.reps},${r.weight},"${r.note || ''}"`)
    );
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `健身记录_${getTodayStr()}.csv`;
    a.click();
}

function openConfigModal() {
    document.getElementById('configTokenInput').value = localStorage.getItem('loveGacha_githubToken') || '';
    document.getElementById('configModal').classList.remove('hidden');
}

function closeConfigModal() {
    document.getElementById('configModal').classList.add('hidden');
}

async function saveConfigModal() {
    const v = document.getElementById('configTokenInput').value.trim();
    if (v) localStorage.setItem('loveGacha_githubToken', v);
    else localStorage.removeItem('loveGacha_githubToken');
    GITHUB_TOKEN = v;
    closeConfigModal();
    await syncFromCloud(true);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2400);
}
