<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱成就 🏆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        
        @keyframes pop { 0% { transform: scale(0.9); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .progress-circle {
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 pb-20">
    
    <header class="text-center mb-6 max-w-md animate-float mt-2">
        <h1 class="text-3xl md:text-4xl font-bold text-rose-500 mb-2 drop-shadow-sm flex items-center justify-center gap-2">
            🏆 我们的成就
        </h1>
        <p class="text-rose-400 text-sm md:text-base">
            点点滴滴，都是爱你的证明
        </p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 顶部导航 -->
        <div class="flex space-x-4 mb-6 w-full justify-center">
            <a href="index.html" class="px-6 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm">返回首页</a>
            <button class="px-6 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm cursor-default">成就图鉴</button>
        </div>

        <!-- 加载状态 -->
        <div id="loadingView" class="w-full flex flex-col items-center py-16 animate-fade-in">
            <div class="text-5xl animate-bounce mb-4">🌟</div>
            <p class="text-rose-400 font-bold text-lg">正在从云端回忆...</p>
            <p class="text-rose-300 text-xs mt-2">拉取全部心动数据中，请稍候</p>
        </div>

        <!-- 主内容区 (加载后显示) -->
        <div id="mainContent" class="w-full hidden flex-col items-center animate-fade-in">
            
            <!-- 总览进度卡片 -->
            <div class="w-full bg-white rounded-3xl p-5 shadow-sm border-2 border-rose-100 flex items-center justify-between mb-5 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-6xl opacity-10">🏆</div>
                <div class="relative z-10">
                    <h2 class="text-lg font-bold text-gray-800">成就总等级</h2>
                    <p class="text-xs text-rose-400 font-medium mt-1">解锁更多专属回忆图鉴</p>
                    <div class="mt-3 text-xs text-gray-500 bg-rose-50 px-3 py-1 rounded-full inline-block border border-rose-100">
                        已点亮 <span class="text-rose-500 font-bold text-sm" id="unlockedCount">0</span>/<span id="totalAchCount">20</span> 个成就
                    </div>
                </div>
                <!-- 环形进度条：展示总解锁模块百分比，中心文字展示总等级 -->
                <div class="relative w-20 h-20 flex items-center justify-center z-10 mr-2">
                    <svg class="w-20 h-20 transform -rotate-90 filter drop-shadow-sm absolute">
                        <circle cx="40" cy="40" r="34" stroke="currentColor" stroke-width="8" fill="transparent" class="text-gray-100" />
                        <!-- 圆周长 ≈ 213.6 -->
                        <circle cx="40" cy="40" r="34" stroke="currentColor" stroke-width="8" fill="transparent" class="text-rose-400 progress-circle stroke-current" stroke-dasharray="213.6" stroke-dashoffset="213.6" id="progressCircle" stroke-linecap="round" />
                    </svg>
                    <div class="flex flex-col items-center justify-center relative z-20 mt-1">
                        <span class="text-[10px] text-gray-400 font-bold leading-none mb-0.5">Lv.</span>
                        <span class="text-xl font-bold text-rose-500 leading-none" id="totalLevelText">0</span>
                    </div>
                </div>
            </div>

            <!-- 核心数据汇总 -->
            <div class="grid grid-cols-3 gap-3 w-full mb-6">
                <div class="bg-gradient-to-br from-rose-50 to-pink-50 rounded-2xl p-3 text-center border border-rose-100 shadow-sm">
                    <div class="text-2xl font-bold text-rose-500 mb-0.5" id="statTasks">0</div>
                    <div class="text-[10px] text-gray-500 font-medium">完成任务(次)</div>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-3 text-center border border-emerald-100 shadow-sm">
                    <div class="text-2xl font-bold text-emerald-500 mb-0.5" id="statDiaries">0</div>
                    <div class="text-[10px] text-gray-500 font-medium">悄悄话(篇)</div>
                </div>
                <div class="bg-gradient-to-br from-sky-50 to-indigo-50 rounded-2xl p-3 text-center border border-sky-100 shadow-sm">
                    <div class="text-2xl font-bold text-sky-500 mb-0.5" id="statInteractions">0</div>
                    <div class="text-[10px] text-gray-500 font-medium">宠爱互动(次)</div>
                </div>
            </div>

            <div class="w-full text-left mb-3 px-2 flex justify-between items-end">
                <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                    <span>🏅</span> 勋章墙 <span class="text-xs text-gray-400 font-normal ml-1">点击查看升级目标</span>
                </h3>
            </div>

            <!-- 分类选项卡 -->
            <div class="flex gap-2 w-full mb-4 px-1 overflow-x-auto no-scrollbar pb-1">
                <button onclick="switchCategory('all')" id="cat_all" class="cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-rose-500 text-white shadow-sm border border-rose-500">全部</button>
                <button onclick="switchCategory('task')" id="cat_task" class="cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-white text-gray-500 border border-gray-200 hover:bg-rose-50">心动轨迹</button>
                <button onclick="switchCategory('diary')" id="cat_diary" class="cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-white text-gray-500 border border-gray-200 hover:bg-rose-50">浪漫纪实</button>
                <button onclick="switchCategory('pet')" id="cat_pet" class="cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-white text-gray-500 border border-gray-200 hover:bg-rose-50">赛博育儿</button>
            </div>

            <!-- 成就网格列表 -->
            <div id="achievementsGrid" class="grid grid-cols-2 gap-3 w-full pb-6">
                <!-- 由 JS 动态渲染 -->
            </div>

            <!-- 炫耀按钮 -->
            <button onclick="shareStats()" class="w-full mt-4 py-3 bg-white text-rose-500 border-2 border-rose-200 font-bold rounded-2xl shadow-sm hover:shadow transform hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2">
                <span>💬 炫耀我们的战绩</span>
            </button>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-gray-400 text-xs underline hover:text-rose-400 transition-colors">
                    返回首页 (当前身份: <span id="currentIdentityLabel">-</span>)
                </a>
            </div>
        </div>
    </main>

    <!-- 详情弹窗 (Modal) -->
    <div id="achModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform" id="achModalContent">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-3">
                    <span id="modIcon" class="text-4xl drop-shadow-sm"></span>
                    <div>
                        <h3 id="modTitle" class="font-bold text-gray-800 text-lg"></h3>
                        <span id="modLevel" class="inline-block mt-0.5 text-xs text-rose-500 font-bold bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100"></span>
                    </div>
                </div>
                <button onclick="closeAchModal()" class="text-gray-400 hover:text-rose-500 bg-gray-50 rounded-full p-1.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <p id="modDesc" class="text-sm text-gray-500 mb-6"></p>
            
            <div class="bg-rose-50/50 rounded-2xl p-4 border border-rose-100 mb-2">
                <div class="flex justify-between text-sm mb-2 font-medium">
                    <span class="text-gray-600">当前进度</span>
                    <span class="text-rose-500 font-bold"><span id="modCurrent"></span> / <span id="modTarget"></span> <span id="modUnit" class="text-xs text-gray-400 font-normal"></span></span>
                </div>
                <!-- 进度条 -->
                <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                    <div id="modBar" class="bg-gradient-to-r from-rose-400 to-pink-500 h-2.5 rounded-full transition-all duration-700" style="width: 0%"></div>
                </div>
                <p id="modNextText" class="text-xs text-gray-400 mt-3 text-center"></p>
            </div>
        </div>
    </div>

    <!-- 弹窗提示与剪贴板 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-[60] whitespace-nowrap"></div>
    <input type="text" id="clipboardInput" class="hidden absolute -left-9999">

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; 
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILES = {
            h: 'data/h.json', q: 'data/q.json',
            hRj: 'data/Hrj.json', qRj: 'data/Qrj.json',
            cw: 'data/cw.json',
            hCw: 'data/Hcw.json', qCw: 'data/Qcw.json'
        };

        // 数据统计模型
        let stats = {
            tasksCompleted: 0, diyCompleted: 0,
            diariesWritten: 0, capsulesCreated: 0, diariesLiked: 0,
            petLevel: 0, petInteractions: 0, resonanceCount: 0, lettersSent: 0,
            // 新增扩展统计项
            tasksWithSecret: 0, diyCreated: 0, taskDeep: 0, taskGame: 0,
            diaryLove: 0, diaryNight: 0, diaryWords: 0,
            petFeed: 0, petPlay: 0, petClean: 0, petTrain: 0
        };

        window.currentAchievements = []; // 保存计算后的成就数据用于弹窗

        /**
         * 计算等级的通用方法
         * @param {number} val 当前数值
         * @param {number} step 每级跨度 (例如 10)
         * @param {boolean} startAt1 是否需要 1 级门槛极低 (例如完成1次就算1级)
         */
        function calcLevel(val, step, startAt1) {
            if (startAt1) {
                // 如果勾选极速入门: 0次=0级, 1次=1级(下一级目标=step), X次=(1+X/step)级
                if (val < 1) return { level: 0, target: 1 };
                const level = 1 + Math.floor(val / step);
                const target = level * step;
                return { level, target };
            } else {
                // 标准阶梯: 0~9次=0级(下一级目标10), 10~19次=1级(下一级20)...
                const level = Math.floor(val / step);
                const target = (level + 1) * step;
                return { level, target };
            }
        }

        // 成就定义表 - 动态计算等级上限 (扩展至20个)
        const baseAchievements = [
            { id: 'tasks', type: 'task', title: '日常打卡', icon: '🌸', unit: '次', desc: '累计完成心动盲盒的每日任务', val: s => s.tasksCompleted, calc: v => calcLevel(v, 10, true) },
            { id: 'diy', type: 'task', title: '专属浪漫', icon: '✨', unit: '次', desc: '成功抽出并完成对方留下的专属愿望', val: s => s.diyCompleted, calc: v => calcLevel(v, 5, true) },
            { id: 'task_secret', type: 'task', title: '纸条情话', icon: '💬', unit: '次', desc: '完成任务并用心给对方留下悄悄话', val: s => s.tasksWithSecret, calc: v => calcLevel(v, 10, true) },
            { id: 'task_diy_create', type: 'task', title: '造梦工坊', icon: '🛠️', unit: '个', desc: '偷偷在卡池中塞入属于你们的专属愿望', val: s => s.diyCreated, calc: v => calcLevel(v, 5, true) },
            { id: 'task_deep', type: 'task', title: '走心局', icon: '🌌', unit: '次', desc: '共同完成深度沟通、情绪价值或现实碰撞类的心动任务', val: s => s.taskDeep, calc: v => calcLevel(v, 5, true) },
            { id: 'task_game', type: 'task', title: '游乐园', icon: '🎠', unit: '次', desc: '共同完成趣味游戏或奇思妙想类的心动任务', val: s => s.taskGame, calc: v => calcLevel(v, 5, true) },
            { id: 'diary', type: 'diary', title: '纸短情长', icon: '📝', unit: '篇', desc: '在悄悄话本中记录生活点滴', val: s => s.diariesWritten, calc: v => calcLevel(v, 10, false) },
            { id: 'diary_love', type: 'diary', title: '甜蜜日记', icon: '🍯', unit: '篇', desc: '在悄悄话中留下"开心"或"爱你"的甜蜜心情', val: s => s.diaryLove, calc: v => calcLevel(v, 5, false) },
            { id: 'diary_night', type: 'diary', title: '午夜低语', icon: '🌙', unit: '篇', desc: '在深夜(0点-6点)写下属于彼此的悄悄话', val: s => s.diaryNight, calc: v => calcLevel(v, 3, true) },
            { id: 'diary_words', type: 'diary', title: '笔墨生香', icon: '✒️', unit: '字', desc: '悄悄话累计记录的总字数，字字皆是爱意', val: s => s.diaryWords, calc: v => calcLevel(v, 500, true) },
            { id: 'likes', type: 'diary', title: '满眼是你', icon: '❤️', unit: '次', desc: '写下的悄悄话获得对方的爱心点赞', val: s => s.diariesLiked, calc: v => calcLevel(v, 10, false) },
            { id: 'capsule', type: 'diary', title: '时光情书', icon: '🕰️', unit: '封', desc: '成功埋下并解锁未来的时光胶囊', val: s => s.capsulesCreated, calc: v => calcLevel(v, 2, true) },
            { id: 'pet_level', type: 'pet', title: '金牌饲养员', icon: '👑', unit: '级', desc: '呵护赛博毛孩子，提升儿子的等级', val: s => s.petLevel, calc: v => calcLevel(v, 10, false) },
            { id: 'pet_interact', type: 'pet', title: '陪伴最长情', icon: '🐾', unit: '次', desc: '日常给儿子喂食、洗澡、陪它玩耍', val: s => s.petInteractions, calc: v => calcLevel(v, 50, false) },
            { id: 'pet_feed', type: 'pet', title: '干饭大王', icon: '🥩', unit: '次', desc: '累计给儿子投喂各种美食', val: s => s.petFeed, calc: v => calcLevel(v, 20, false) },
            { id: 'pet_play', type: 'pet', title: '活力四射', icon: '🎾', unit: '次', desc: '陪儿子扔飞盘、去遛弯或给它挠痒痒', val: s => s.petPlay, calc: v => calcLevel(v, 20, false) },
            { id: 'pet_clean', type: 'pet', title: '香香软软', icon: '🫧', unit: '次', desc: '给儿子洗个香喷喷的澡或梳理毛发', val: s => s.petClean, calc: v => calcLevel(v, 15, false) },
            { id: 'pet_train', type: 'pet', title: '文武双全', icon: '🎓', unit: '次', desc: '给儿子讲故事或者进行高强度特训', val: s => s.petTrain, calc: v => calcLevel(v, 15, false) },
            { id: 'resonance', type: 'pet', title: '心有灵犀', icon: '💖', unit: '次', desc: '双方在同一天陪伴儿子触发灵魂共鸣', val: s => s.resonanceCount, calc: v => calcLevel(v, 5, true) },
            { id: 'letter', type: 'pet', title: '飞鸽传书', icon: '💌', unit: '次', desc: '让儿子化身信使，给对方传递纸条', val: s => s.lettersSent, calc: v => calcLevel(v, 5, true) }
        ];

        window.onload = async function() {
            await fetchAndCalculate();
            renderUI();
        };

        // 统一的数据获取函数
        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (response.status === 401 || response.status === 403) return { authError: true };
                // 如果文件不存在 (404)，返回 null 而非报错，这样新号不会崩溃
                if (response.status === 404) return { data: null }; 
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                
                let parsedData = null;
                try { parsedData = JSON.parse(contentStr || '{}'); } 
                catch(e) { parsedData = null; }
                
                return { data: parsedData };
            } catch (error) { return { error: true }; }
        }

        async function fetchAndCalculate() {
            // 并发获取所有数据文件
            const responses = await Promise.all([
                fetchFile(FILES.h), fetchFile(FILES.q),
                fetchFile(FILES.hRj), fetchFile(FILES.qRj),
                fetchFile(FILES.cw),
                fetchFile(FILES.hCw), fetchFile(FILES.qCw)
            ]);

            if (responses.some(r => r.authError)) {
                showToast("Token失效，请重新登录");
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            }

            const hData = responses[0].data || {};
            const qData = responses[1].data || {};
            const hRjData = responses[2].data || { diaries: [] };
            const qRjData = responses[3].data || { diaries: [] };
            const cwData = responses[4].data || {};
            const hCwData = Array.isArray(responses[5].data) ? responses[5].data : [];
            const qCwData = Array.isArray(responses[6].data) ? responses[6].data : [];

            // 1. 任务数据
            const processTaskData = (data) => {
                if (data['DIY_TASKS']) stats.diyCreated += data['DIY_TASKS'].length;
                Object.keys(data).forEach(k => {
                    if (k.match(/^\d{4}-\d{2}-\d{2}$/) && data[k].myTaskCompleted) {
                        const t = data[k];
                        stats.tasksCompleted++;
                        if (t.isDIY) stats.diyCompleted++;
                        if (t.secretMessage && t.secretMessage.trim().length > 0) stats.tasksWithSecret++;
                        if (['深度沟通', '情绪价值', '现实碰撞'].includes(t.category)) stats.taskDeep++;
                        if (['趣味游戏', '脑洞大开', '奇思妙想'].includes(t.category)) stats.taskGame++;
                    }
                });
            };
            processTaskData(hData); processTaskData(qData);

            // 2. 悄悄话数据
            const processDiaryData = (data) => {
                (data.diaries || []).forEach(d => {
                    stats.diariesWritten++;
                    if (d.unlockTime) stats.capsulesCreated++;
                    if (d.liked) stats.diariesLiked++;
                    if (d.mood === 'love' || d.mood === 'happy') stats.diaryLove++;
                    const hour = new Date(d.time).getHours();
                    if (hour >= 0 && hour < 6) stats.diaryNight++;
                    if (d.content) stats.diaryWords += d.content.length;
                });
            };
            processDiaryData(hRjData); processDiaryData(qRjData);

            // 3. 宠物数据
            stats.petLevel = cwData.level || 0;
            const allActions = [...hCwData, ...qCwData];
            stats.petInteractions = allActions.length;
            stats.resonanceCount = allActions.filter(a => a.action === 'resonance').length;
            stats.lettersSent = allActions.filter(a => a.action === 'letter').length;
            
            allActions.forEach(a => {
                if (a.action === 'feed') stats.petFeed++;
                if (['fan', 'tickle', 'walk'].includes(a.action)) stats.petPlay++;
                if (['water', 'brush'].includes(a.action)) stats.petClean++;
                if (['train', 'story'].includes(a.action)) stats.petTrain++;
            });
        }

        function renderUI() {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('flex');

            // 渲染三大数据
            document.getElementById('statTasks').innerText = stats.tasksCompleted;
            document.getElementById('statDiaries').innerText = stats.diariesWritten;
            document.getElementById('statInteractions').innerText = stats.petInteractions;

            // 评估并构建完整成就数据
            const evaluated = baseAchievements.map(base => {
                const val = base.val(stats);
                const { level, target } = base.calc(val);
                const progressPct = Math.min(100, (val / target) * 100);
                return { ...base, val, level, target, pct: progressPct };
            });

            // 排序逻辑：等级越高的排前面，同等级看完成度进度
            evaluated.sort((a, b) => {
                if (b.level !== a.level) return b.level - a.level;
                return b.pct - a.pct;
            });

            window.currentAchievements = evaluated;

            // 提取头部总等级和总解锁的数据计算
            let unlockedModulesCount = 0;
            let sumTotalLevels = 0;

            evaluated.forEach((achieve) => {
                if (achieve.level > 0) unlockedModulesCount++;
                sumTotalLevels += achieve.level;
            });

            // 渲染整体进度圆环和总等级
            document.getElementById('unlockedCount').innerText = unlockedModulesCount;
            document.getElementById('totalAchCount').innerText = baseAchievements.length;
            document.getElementById('totalLevelText').innerText = sumTotalLevels;
            
            const pctOfModules = (unlockedModulesCount / baseAchievements.length) * 100;
            const circumference = 213.6;
            const offset = circumference - (circumference * pctOfModules / 100);
            
            setTimeout(() => {
                document.getElementById('progressCircle').style.strokeDashoffset = offset;
            }, 100);

            // 渲染列表 (默认全部)
            renderAchievementsGrid();
        }

        let currentCategory = 'all';

        // 切换分类选项卡
        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.id === 'cat_' + cat) {
                    btn.className = 'cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-rose-500 text-white shadow-sm border border-rose-500';
                } else {
                    btn.className = 'cat-btn flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-white text-gray-500 border border-gray-200 hover:bg-rose-50';
                }
            });
            renderAchievementsGrid();
        }

        // 分离出的网格渲染函数
        function renderAchievementsGrid() {
            const grid = document.getElementById('achievementsGrid');
            let html = '';
            
            const filteredAchievements = currentCategory === 'all' 
                ? window.currentAchievements 
                : window.currentAchievements.filter(a => a.type === currentCategory);

            filteredAchievements.forEach((achieve, index) => {
                const isUnlocked = achieve.level > 0;
                const cardClass = isUnlocked 
                    ? "bg-white border-rose-200 shadow-md transform hover:-translate-y-1 transition-transform animate-pop"
                    : "bg-gray-50/80 border-gray-100 opacity-70 grayscale hover:grayscale-0 transition-all";
                
                const iconClass = isUnlocked ? "drop-shadow-md text-4xl" : "text-3xl opacity-50";
                const titleClass = isUnlocked ? "text-rose-500 font-bold" : "text-gray-500 font-bold";
                const barColor = isUnlocked ? "bg-rose-400" : "bg-gray-300";
                
                const badgeHtml = isUnlocked 
                    ? `<div class="absolute -top-2.5 bg-gradient-to-r from-amber-400 to-orange-400 text-white text-[10px] px-2.5 py-0.5 rounded-full font-bold shadow-sm border border-white">Lv.${achieve.level}</div>`
                    : `<div class="absolute -top-2.5 bg-gray-300 text-white text-[10px] px-2.5 py-0.5 rounded-full font-bold shadow-sm border border-white">Lv.0</div>`;

                html += `
                    <div onclick="openAchModal('${achieve.id}')" class="relative rounded-2xl p-4 border-2 flex flex-col items-center text-center cursor-pointer ${cardClass}" style="animation-delay: ${(index % 10) * 50}ms">
                        ${badgeHtml}
                        <div class="mb-2 h-10 flex items-center justify-center">
                            <span class="${iconClass}">${achieve.icon}</span>
                        </div>
                        <h3 class="text-sm ${titleClass} mb-1">${achieve.title}</h3>
                        
                        <!-- 进度条 -->
                        <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2 overflow-hidden border border-gray-50">
                            <div class="${barColor} h-1.5 rounded-full transition-all duration-1000 ease-out" style="width: ${achieve.pct}%"></div>
                        </div>
                        <div class="text-[9px] text-gray-400 font-medium mt-1 font-mono tracking-wider">${achieve.val} / ${achieve.target}</div>
                    </div>
                `;
            });
            
            if(filteredAchievements.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 text-sm">这里还没有数据哦~</div>`;
            } else {
                grid.innerHTML = html;
            }
        }

        // 打开模态框
        function openAchModal(id) {
            const achieve = window.currentAchievements.find(a => a.id === id);
            if (!achieve) return;

            document.getElementById('modIcon').innerText = achieve.icon;
            document.getElementById('modTitle').innerText = achieve.title;
            document.getElementById('modLevel').innerText = `当前等级：Lv.${achieve.level}`;
            document.getElementById('modDesc').innerText = achieve.desc;
            
            document.getElementById('modCurrent').innerText = achieve.val;
            document.getElementById('modTarget').innerText = achieve.target;
            document.getElementById('modUnit').innerText = achieve.unit;
            
            document.getElementById('modNextText').innerText = `👉 距离升到 Lv.${achieve.level + 1} 还需要 ${achieve.target - achieve.val} ${achieve.unit}`;
            
            // 重置进度条以便演示动画
            const bar = document.getElementById('modBar');
            bar.style.width = '0%';

            const modal = document.getElementById('achModal');
            const modalContent = document.getElementById('achModalContent');
            
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
                
                // 触发进度条动画
                setTimeout(() => { bar.style.width = `${achieve.pct}%`; }, 150);
            });
        }

        // 关闭模态框
        function closeAchModal() {
            const modal = document.getElementById('achModal');
            const modalContent = document.getElementById('achModalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // 点击遮罩关闭
        document.getElementById('achModal').addEventListener('click', function(e) {
            if (e.target === this) closeAchModal();
        });

        // 炫耀分享
        function shareStats() {
            const sumTotalLevels = window.currentAchievements.reduce((sum, a) => sum + a.level, 0);
            
            const getLvStr = (id) => {
                const a = window.currentAchievements.find(x => x.id === id);
                return a ? `(Lv.${a.level})` : '';
            };

            const txt = `🏆 【我们的心动成就】 🏆\n\n` + 
                        `🌟 累计成就总等级：Lv.${sumTotalLevels}\n` +
                        `🔥 共同完成任务：${stats.tasksCompleted}次 ${getLvStr('tasks')}\n` +
                        `📝 偷偷写下悄悄话：${stats.diariesWritten}篇 ${getLvStr('diary')}\n` +
                        `🐾 陪伴电子儿子：${stats.petInteractions}次 ${getLvStr('pet_interact')}\n\n` +
                        `—— “爱你的证据，正在无限升级中。” 💕`;
            
            const input = document.getElementById('clipboardInput'); 
            input.value = txt; 
            input.classList.remove('hidden'); 
            input.select(); 
            document.execCommand('copy'); 
            input.classList.add('hidden'); 
            
            showToast("战绩复制成功！快发给TA看~ ✨");
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
