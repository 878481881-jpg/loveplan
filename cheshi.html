<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端飞行棋：暗影逃亡</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://static.cloudbase.net">
    
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 2px, transparent 2px), radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        @keyframes float { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-10px) translateX(5px); } }
        .cloud { animation: float 6s ease-in-out infinite; }
        
        @keyframes flyBounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.15) translateY(-5px); } }
        .plane-active { animation: flyBounce 1s infinite; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .plane-transition { transition: transform 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), left 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), top 0.4s cubic-bezier(0.34, 1.3, 0.64, 1); will-change: transform, left, top; transform: translateZ(0); }

        .plane-bomber { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); border-color: #ef4444 !important; font-size: 1rem;}
        .plane-frigate { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8)); border-color: #06b6d4 !important; font-size: 1rem;}
        .plane-recon { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.8)); border-color: #22c55e !important; font-size: 1rem;}
        .plane-stealth { opacity: 0.4; filter: grayscale(50%); border-style: dashed !important; }

        #board-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.9); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 0 2px #fff; padding: 10px; margin: 0 auto; overflow: hidden; }
        #board-grid { display: grid; width: 100%; height: 100%; gap: 2px; position: relative; }
        .board-cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08); transition: background-color 0.3s, transform 0.2s; cursor: pointer; }
        .board-cell:active { transform: scale(0.9); }

        .cell-color-0 { background-color: #fca5a5; } .cell-color-1 { background-color: #fde047; } .cell-color-2 { background-color: #93c5fd; } .cell-color-3 { background-color: #86efac; }
        .cell-home-blue { background-color: #e0f2fe; border: 1px dashed #93c5fd; }
        .cell-win { background: radial-gradient(circle, #7f1d1d 0%, #450a0a 100%); box-shadow: 0 0 15px #ef4444; border: 2px solid #ef4444;}
        .cell-empty { background-color: transparent; box-shadow: none; cursor: default;}
        .cell-broken { background-image: repeating-linear-gradient(45deg, #000, #000 5px, #444 5px, #444 10px) !important; opacity: 0.8; filter: grayscale(100%);}
        .cell-fatal { box-shadow: inset 0 0 15px 5px rgba(139, 0, 0, 0.8) !important; animation: pulseRed 1s infinite; }

        @keyframes pulseRed { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); } 50% { background-color: rgba(239, 68, 68, 0.7); box-shadow: 0 0 10px red inset; } }
        .thunder-zone { animation: pulseRed 1s infinite !important; border: 1px solid red; }
        .selecting-mode-plane { animation: pulseSelect 1s infinite !important; cursor: crosshair !important; z-index: 50; }
        @keyframes pulseSelect { 0%, 100% { filter: brightness(1); transform: scale(1); } 50% { filter: brightness(1.5); transform: scale(1.2); box-shadow: 0 0 15px #fbbf24; } }

        .weather-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 25; transition: all 1s ease; border-radius: 20px; }
        .weather-fog { background: rgba(200, 200, 200, 0.8); backdrop-filter: blur(3px); }
        @keyframes flashLightning { 0%, 95%, 100% { background: transparent; } 96%, 98% { background: rgba(255, 255, 255, 0.8); } }
        .weather-thunder { animation: flashLightning 5s infinite; background: rgba(15, 23, 42, 0.3); }

        .plane { position: absolute; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 -2px 0 rgba(0,0,0,0.2); z-index: 10; }
        .plane-blue { background: linear-gradient(135deg, #3b82f6, #1e3a8a); color: white; border: 2px solid #93c5fd; }
        
        .base-area { position: absolute; width: 25%; height: 25%; background: rgba(255,255,255,0.9); border-radius: 16px; padding: 4px; display: grid; gap: 2px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 2px solid white; }
        .base-red { top: 0; left: 0; border-color: #ef4444; background: #450a0a; color: white; display:flex; flex-direction: column; align-items:center; justify-content:center;} 
        .base-blue { bottom: 0; right: 0; border-color: #93c5fd; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
        .base-spot { width: 100%; height: 100%; border-radius: 50%; background: rgba(0,0,0,0.1); }

        .placing-mode-active { box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.8) !important; animation: pulseRed 1.5s infinite !important; }

        .energy-text { font-family: monospace; font-weight: 900; color: #a855f7; }

        @keyframes splashPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }
        
        .overlord-btn { transition: all 0.2s; }
        .overlord-btn:active { transform: scale(0.95); }
        .overlord-btn:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-3 relative pb-40">
    <div id="globalLoading" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity">
        <div class="text-6xl animate-bounce mb-4">🛸</div>
        <div class="text-sky-400 font-bold text-xl">连接战术网络...</div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-sky-800/95 text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-[1000] transition-all"></div>

    <div id="msgModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border-2 border-sky-500 rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center" id="msgModalContent">
            <h3 class="text-3xl font-black text-sky-400 mb-2" id="msgTitle">游戏结束</h3>
            <div id="statsBox" class="text-gray-300 mb-6 text-sm"></div>
            <button onclick="resetGame()" class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold shadow-md hover:scale-105 active:scale-95 transition-all">重新部署</button>
        </div>
    </div>

    <header class="w-full max-w-md flex justify-between items-center mb-2 z-10 px-2">
        <div class="flex items-center gap-2 bg-slate-800/80 px-4 py-2 rounded-2xl border border-slate-600">
            <span class="text-2xl">🌌</span>
            <div>
                <h1 class="text-lg font-bold text-sky-400 leading-tight">暗影逃亡 <span class="text-xs text-rose-500">Asymmetric</span></h1>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <div class="bg-slate-800/90 px-3 py-1 rounded-full border border-slate-600 text-xs font-bold text-gray-300">
                身份: <span id="currentRoleDisplay" class="px-2 py-0.5 rounded-full bg-sky-600 text-white">加载中</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 relative z-10">
        <!-- 大厅 -->
        <div id="lobbyView" class="w-full flex flex-col gap-4 hidden">
            <div class="bg-slate-800/90 rounded-3xl p-6 border-2 border-slate-600 shadow-xl flex flex-col items-center text-center">
                <h2 class="text-2xl font-bold text-white mb-6">选择阵营</h2>
                <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-red-600 to-rose-800 text-white rounded-xl font-black text-lg mb-4 hover:scale-105 transition-all">
                    👑 扮演掌控者 (红方/建房)
                </button>
                <div class="flex flex-col gap-3 w-full">
                    <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位代码" class="w-full px-4 py-3 bg-slate-700 text-white border-2 border-slate-500 rounded-xl text-center text-xl font-black uppercase tracking-[0.5em] focus:outline-none focus:border-sky-400">
                    <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-700 text-white font-black text-lg rounded-xl hover:scale-105 transition-all">🚀 扮演逃亡者 (蓝方/加入)</button>
                </div>
            </div>
        </div>

        <!-- 战场 -->
        <div id="gameView" class="w-full flex flex-col gap-3 hidden">
            <div class="w-full bg-slate-800/90 rounded-2xl p-3 border-2 border-slate-600 flex justify-between items-center shadow-lg">
                <div class="text-xs text-gray-400 font-bold">房间代码: <span id="displayRoomCode" class="text-lg text-sky-400 font-black">----</span></div>
                <div class="text-xs font-bold px-3 py-1 bg-slate-700 rounded-lg text-white" id="turnIndicator">等待中</div>
            </div>

            <div id="board-container">
                <div id="boardOverlay" class="absolute inset-0 z-30 bg-black/20 rounded-2xl hidden cursor-not-allowed"></div>
                <div id="weatherOverlay" class="weather-overlay"></div>
                
                <div id="board-grid"></div>

                <div class="base-area base-red" id="base-p1">
                    <div class="text-xs font-bold text-red-300">敌方基地</div>
                    <div class="text-4xl font-black text-red-500 drop-shadow-md" id="redBaseHpDisplay">5/5</div>
                    <div class="text-[10px] text-red-400 mt-1">战机-1 | 轰炸机-3</div>
                </div>
                <div class="base-area base-blue" id="base-p2">
                    <!-- 蓝方 8 个起飞位 -->
                    <div class="base-spot" id="spot-p2-0"></div><div class="base-spot" id="spot-p2-1"></div>
                    <div class="base-spot" id="spot-p2-2"></div><div class="base-spot" id="spot-p2-3"></div>
                    <div class="base-spot" id="spot-p2-4"></div><div class="base-spot" id="spot-p2-5"></div>
                    <div class="base-spot" id="spot-p2-6"></div><div class="base-spot" id="spot-p2-7"></div>
                </div>

                <div id="planes-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>

            <!-- 蓝方操作区 (逃亡者) -->
            <div id="blueActionPanel" class="w-full bg-slate-800/90 rounded-2xl p-3 border border-slate-600 hidden flex-col gap-2 shadow-lg">
                <div class="flex gap-2">
                    <button id="btnRollDice" onclick="handleRollDice()" class="flex-1 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-black rounded-xl hover:scale-105 active:scale-95 disabled:opacity-50 transition-all text-sm">
                        🎲 掷骰行动
                    </button>
                    <div class="w-16 bg-slate-700 rounded-xl flex items-center justify-center text-3xl" id="diceVisual">🎲</div>
                </div>
                <div class="bg-slate-700 p-2 rounded-xl flex gap-2 overflow-x-auto items-center min-h-[50px]" id="itemsContainer">
                    <span class="text-xs text-gray-400 m-auto">背包空空... 踩🎁获取道具</span>
                </div>
            </div>

            <!-- 红方操作区 (掌控者) -->
            <div id="redActionPanel" class="w-full bg-slate-900 rounded-2xl p-3 border-2 border-purple-900 hidden flex-col gap-2 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                <div class="flex justify-between items-center px-2">
                    <span class="text-sm font-black text-purple-400">👁️ 上帝面板</span>
                    <span class="text-xs text-purple-300">暗影能量: <span id="shadowEnergyText" class="text-lg energy-text">0</span></span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('bridge', 15)">
                        <span class="text-xl">🌉</span><span class="text-[10px] text-gray-300 mt-1">断桥(15)</span>
                    </button>
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('mine', 20)">
                        <span class="text-xl">💣</span><span class="text-[10px] text-gray-300 mt-1">深渊雷(20)</span>
                    </button>
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('blindbox', 25)">
                        <span class="text-xl">🎁</span><span class="text-[10px] text-gray-300 mt-1">毒盲盒(25)</span>
                    </button>
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('fog', 30)">
                        <span class="text-xl">🌫️</span><span class="text-[10px] text-gray-300 mt-1">大雾(30)</span>
                    </button>
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('thunder', 40)">
                        <span class="text-xl">⚡</span><span class="text-[10px] text-gray-300 mt-1">雷暴(40)</span>
                    </button>
                    <button class="overlord-btn bg-slate-800 border border-purple-500/50 rounded-lg p-2 flex flex-col items-center" onclick="prepareOverlordSkill('pirate', 50)">
                        <span class="text-xl">🏴‍☠️</span><span class="text-[10px] text-gray-300 mt-1">海盗悬赏(50)</span>
                    </button>
                </div>
                <button id="btnEndRedTurn" onclick="endRedTurn()" class="w-full mt-1 py-2 bg-gradient-to-r from-purple-700 to-pink-700 text-white font-black rounded-xl hover:scale-105 active:scale-95 transition-all shadow-md">
                    结束布局回合
                </button>
            </div>

            <!-- 日志区 -->
            <div class="w-full h-28 bg-slate-800 rounded-xl border border-slate-600 p-2 overflow-hidden flex flex-col">
                <div class="text-[10px] font-bold text-gray-400 mb-1 border-b border-slate-700 pb-1">📡 战况通讯</div>
                <div id="eventLogs" class="flex-1 overflow-y-auto space-y-1 text-[11px] font-medium text-gray-300"></div>
            </div>
        </div>
    </main>

    <script type="module">
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; 
        const REGION = "ap-shanghai";             
        const ROOM_COLLECTION = "aeroplaneShadow"; // Changed collection

        let app, auth, db, currentUser = null;
        try { app = cloudbase.init({ env: ENV_ID, region: REGION }); auth = app.auth; db = app.database(); } catch(e) { console.error(e); }

        function getRoomRef(code) { return db.collection(ROOM_COLLECTION).doc(String(code)); }

        let myName = "玩家" + Math.floor(Math.random()*1000);
        let currentRoomId = null, unsubscribeRoom = null, gameState = null, myPlayerId = null;
        let isAudioInited = false, synths = {};
        
        window.activeSkill = null; window.skillCost = 0;

        const GRID_SIZE = 14; const trackCoords = [];
        for(let x=1; x<=12; x++) trackCoords.push({x, y: 1}); 
        for(let y=2; y<=12; y++) trackCoords.push({x: 12, y});
        for(let x=11; x>=1; x--) trackCoords.push({x, y: 12});
        for(let y=11; y>=2; y--) trackCoords.push({x: 1, y});

        const p2HomeCoords = [ {x: 11, y: 11}, {x: 10, y: 10}, {x: 9, y: 9}, {x: 8, y: 8}, {x: 7, y: 7} ]; 
        const eventCellIndices = [3, 8, 14, 19, 25, 30, 36, 41];
        const itemCellIndices = [5, 12, 17, 23, 28, 34, 39]; 
        const itemPool = ['stealth', 'hologram', 'recon', 'frigate', 'bomber', 'magic_dice'];

        function getCellColor(index) { return index % 4; }
        let cellToTrackIdx = {};
        let cachedBaseSpots = {};

        async function initAudioContext() {
            if(isAudioInited) return; await Tone.start();
            synths.click = new Tone.PolySynth(Tone.Synth).toDestination();
            synths.boom = new Tone.MembraneSynth().toDestination();
            isAudioInited = true;
        }
        ['click', 'touchstart'].forEach(evt => document.body.addEventListener(evt, initAudioContext, { once: true }));

        function initBoardGrid() {
            const grid = document.getElementById('board-grid'); grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`; grid.style.gridTemplateRows = `repeat(${GRID_SIZE}, 1fr)`;

            trackCoords.forEach((c, idx) => { cellToTrackIdx[`${c.x},${c.y}`] = idx; });
            
            const fragment = document.createDocumentFragment();
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    const div = document.createElement('div'); const key = `${x},${y}`;
                    div.id = `cell-${x}-${y}`; 
                    div.className = `board-cell ${cellToTrackIdx[key] !== undefined ? 'cell-color-'+getCellColor(cellToTrackIdx[key]) : 'cell-empty'}`;
                    
                    let tIdx = cellToTrackIdx[key];
                    if (tIdx !== undefined) {
                        if (x === 12 && y === 12) div.innerHTML = '<span class="text-[8px] font-black text-blue-900">起飞</span>';
                        else if (eventCellIndices.includes(tIdx)) div.innerHTML = '<span class="text-xs">❓</span>';
                        else if (itemCellIndices.includes(tIdx)) div.innerHTML = '<span class="text-xs">🎁</span>';
                        div.onclick = () => handleCellClick(tIdx);
                    }
                    fragment.appendChild(div);
                }
            }
            grid.appendChild(fragment); initPlanesDOM(); setTimeout(cacheBaseSpots, 100);
        }

        function initPlanesDOM() {
            const layer = document.getElementById('planes-layer'); layer.innerHTML = '';
            for(let i=0; i<8; i++) {
                const el = document.createElement('div'); el.id = `plane-p2-${i}`;
                el.className = `plane plane-transition pointer-events-auto plane-blue`; el.innerText = '✈️';
                el.onpointerdown = () => handlePieceClick(i);
                layer.appendChild(el);
            }
            const bossEl = document.createElement('div'); bossEl.id = `plane-boss-pirate`;
            bossEl.className = `plane plane-transition pointer-events-none`; bossEl.style.background = '#000'; bossEl.innerText = '🏴‍☠️'; bossEl.style.display = 'none';
            layer.appendChild(bossEl);
        }

        function cacheBaseSpots() {
            cachedBaseSpots = {}; const container = document.getElementById('board-container'); if(!container) return;
            const cRect = container.getBoundingClientRect();
            for(let i=0; i<8; i++) {
                const spot = document.getElementById(`spot-p2-${i}`);
                if (spot) { const sRect = spot.getBoundingClientRect(); cachedBaseSpots[`p2-${i}`] = { x: ((sRect.left + sRect.width/2 - cRect.left) / cRect.width) * 100, y: ((sRect.top + sRect.height/2 - cRect.top) / cRect.height) * 100 }; }
            }
        }

        window.createRoom = async function() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const initData = {
                status: 'playing', turn: 'p1', redBaseHp: 5,
                p1: { name: myName, energy: 10, mines: [] },
                p2: { name: null, pieces: Array(8).fill(-1), bombers: Array(8).fill(false), frigates: Array(8).fill(false), recons: Array(8).fill(false), stealthTurns: Array(8).fill(0), holograms: [], items: [] },
                brokenBridges: [], fatalEvents: [], weather: { type: 'normal', remainingTurns: 0, zone: [] }, boss: { pos: -1 }, logs: ["演习开始：上帝掌控者 (红) VS 绝境逃亡者 (蓝)"]
            };
            await getRoomRef(code).set(initData); myPlayerId = 'p1'; listenToRoom(code);
        };

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim();
            const res = await getRoomRef(code).get(); const data = res.data && res.data[0];
            if (data) {
                if (!data.p2.name && data.p1.name !== myName) { await getRoomRef(code).update({ 'p2.name': myName, logs: [...data.logs, `${myName} 接入战网，担任逃亡者！`] }); myPlayerId = 'p2'; }
                else if (data.p1.name === myName) myPlayerId = 'p1'; else myPlayerId = 'p2';
                listenToRoom(code);
            }
        };

        function listenToRoom(code) {
            currentRoomId = code; document.getElementById('lobbyView').classList.add('hidden'); document.getElementById('gameView').classList.remove('hidden');
            initBoardGrid();
            if(unsubscribeRoom) unsubscribeRoom();
            const watcher = getRoomRef(code).watch({
                onChange: (snap) => {
                    const data = snap.docs[0]; if(data) { gameState = data; renderGameState(); }
                }, onError: (e) => console.log(e)
            }); unsubscribeRoom = () => watcher.close();
        }

        window.showToast = function(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
        window.playSplashAnim = function(text) {
            const el = document.createElement('div'); el.innerHTML = text;
            el.style.cssText = `position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; font-weight: 900; color: #fff; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; z-index: 9999; pointer-events: none; animation: splashPop 1s forwards;`;
            document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
        }

        function renderGameState() {
            if(!gameState) return;
            document.getElementById('displayRoomCode').innerText = currentRoomId;
            document.getElementById('currentRoleDisplay').innerText = myPlayerId === 'p1' ? '红方 (掌控者)' : '蓝方 (逃亡者)';
            
            const isMyTurn = gameState.turn === myPlayerId && gameState.status === 'playing';
            const ind = document.getElementById('turnIndicator');
            ind.innerText = isMyTurn ? "👉 你的回合" : "⏳ 对方回合";
            ind.className = `text-xs font-bold px-3 py-1 rounded-lg text-white ${isMyTurn ? (myPlayerId==='p1'?'bg-purple-600':'bg-blue-600 animate-pulse') : 'bg-slate-700'}`;

            if(myPlayerId === 'p1') {
                document.getElementById('redActionPanel').style.display = 'flex'; document.getElementById('blueActionPanel').style.display = 'none';
                document.getElementById('shadowEnergyText').innerText = gameState.p1.energy;
                document.querySelectorAll('.overlord-btn').forEach(btn => { btn.disabled = !isMyTurn || gameState.p1.energy < parseInt(btn.innerText.match(/\d+/)[0]); });
                document.getElementById('btnEndRedTurn').disabled = !isMyTurn;
            } else {
                document.getElementById('redActionPanel').style.display = 'none'; document.getElementById('blueActionPanel').style.display = 'flex';
                document.getElementById('btnRollDice').disabled = !isMyTurn;
                renderItems();
            }

            document.getElementById('redBaseHpDisplay').innerText = `${gameState.redBaseHp}/5`;
            if(gameState.redBaseHp <= 0 && gameState.status === 'playing') { endGame('p2', '蓝方突破了防线！逃亡成功！'); }
            else if (gameState.p2.pieces.every(p => p === -2 || p === 999) && gameState.redBaseHp > 0 && gameState.status === 'playing') { endGame('p1', '蓝方全军覆没！掌控者获胜！'); }

            document.querySelectorAll('.board-prop').forEach(el=>el.remove());
            document.querySelectorAll('.board-cell').forEach(el=>{ el.classList.remove('cell-broken', 'cell-fatal', 'thunder-zone'); });
            
            gameState.brokenBridges.forEach(pos => { const c=trackCoords[pos]; if(c) document.getElementById(`cell-${c.x}-${c.y}`)?.classList.add('cell-broken'); });
            gameState.fatalEvents.forEach(pos => { const c=trackCoords[pos]; if(c) document.getElementById(`cell-${c.x}-${c.y}`)?.classList.add('cell-fatal'); });
            if(gameState.weather.type === 'thunder') gameState.weather.zone.forEach(pos => { const c=trackCoords[pos]; if(c) document.getElementById(`cell-${c.x}-${c.y}`)?.classList.add('thunder-zone'); });
            
            const wOver = document.getElementById('weatherOverlay');
            if(gameState.weather.type === 'fog') wOver.className = 'weather-overlay weather-fog'; else wOver.className = 'weather-overlay';

            // 渲染隐形水雷 (红方可见，或蓝方有侦察机可见)
            let showMines = myPlayerId === 'p1';
            if(myPlayerId === 'p2' && gameState.p2.recons.some((r, i) => r && gameState.p2.pieces[i]>=0 && gameState.p2.pieces[i]<=43)) showMines = true;
            if(showMines) {
                gameState.p1.mines.forEach(pos => {
                    const c=trackCoords[pos]; if(c) {
                        const cell = document.getElementById(`cell-${c.x}-${c.y}`);
                        if(cell) { const prop = document.createElement('div'); prop.className='board-prop absolute inset-0 flex items-center justify-center text-sm pointer-events-none'; prop.innerText='💣'; cell.appendChild(prop); }
                    }
                });
            }

            // Render Planes
            const pathLogic = []; for(let i=22; i<=43; i++) pathLogic.push(i); for(let i=0; i<=21; i++) pathLogic.push(i); pathLogic.push(200, 201, 202, 203, 204, 999);
            
            gameState.p2.pieces.forEach((pos, i) => {
                const el = document.getElementById(`plane-p2-${i}`); if(!el) return;
                el.className = 'plane plane-transition pointer-events-auto plane-blue'; el.innerText = '✈️';
                if (gameState.p2.bombers[i]) { el.classList.add('plane-bomber'); el.innerText='🚀';}
                if (gameState.p2.frigates[i]) { el.classList.add('plane-frigate'); el.innerText='🛸';}
                if (gameState.p2.recons[i]) { el.classList.add('plane-recon'); el.innerText='🛩️';}
                
                if (pos === -2 || pos === 999) { el.style.display = 'none'; return; }
                
                let isStealth = gameState.p2.stealthTurns[i] > 0;
                if (isStealth && pos >= 0 && pos <= 43) {
                    if (myPlayerId === 'p1') { el.style.display = 'none'; return; } // 红方绝对不可见
                    else { el.classList.add('plane-stealth'); } // 蓝方可见半透明
                }
                
                el.style.display = 'flex';
                let coords = pos === -1 ? cachedBaseSpots[`p2-${i}`] : { x: getCoordPercent(pos<=43?trackCoords[pos].x:p2HomeCoords[pos-200].x), y: getCoordPercent(pos<=43?trackCoords[pos].y:p2HomeCoords[pos-200].y) };
                if(coords) { el.style.left = `calc(${coords.x}% - 12px)`; el.style.top = `calc(${coords.y}% - 12px)`; }
            });

            // Render Holograms (Red sees them as real planes, Blue sees them as clowns)
            document.querySelectorAll('.plane-holo').forEach(e=>e.remove());
            gameState.p2.holograms.forEach((pos, i) => {
                const el = document.createElement('div'); el.className = 'plane plane-transition pointer-events-none plane-blue plane-holo';
                el.innerText = myPlayerId === 'p1' ? '✈️' : '🤡';
                if(myPlayerId === 'p2') el.style.opacity = '0.7';
                document.getElementById('planes-layer').appendChild(el);
                let coords = { x: getCoordPercent(trackCoords[pos].x), y: getCoordPercent(trackCoords[pos].y) };
                el.style.left = `calc(${coords.x}% - 12px)`; el.style.top = `calc(${coords.y}% - 12px)`;
            });

            // Render Boss
            const bossEl = document.getElementById('plane-boss-pirate');
            if (gameState.boss.pos >= 0) {
                bossEl.style.display = 'flex'; let coords = { x: getCoordPercent(trackCoords[gameState.boss.pos].x), y: getCoordPercent(trackCoords[gameState.boss.pos].y) };
                bossEl.style.left = `calc(${coords.x}% - 12px)`; bossEl.style.top = `calc(${coords.y}% - 12px)`;
            } else { bossEl.style.display = 'none'; }

            // Logs
            const logBox = document.getElementById('eventLogs'); logBox.innerHTML = '';
            gameState.logs.slice().reverse().slice(0, 10).forEach(log => {
                const div = document.createElement('div'); div.innerHTML = log; logBox.appendChild(div);
            });
        }

        function getCoordPercent(v) { return (v + 0.5) * (100 / GRID_SIZE); }

        // --- 红方技能逻辑 ---
        window.prepareOverlordSkill = function(type, cost) {
            if(gameState.turn !== myPlayerId || gameState.p1.energy < cost) return;
            window.activeSkill = type; window.skillCost = cost;
            if(type === 'fog') { executeOverlordSkill(-1); return; }
            showToast(`👉 请点击赛道格子释放神迹`);
            document.getElementById('board-container').classList.add('placing-mode-active');
        }

        window.handleCellClick = function(idx) {
            if(myPlayerId === 'p1' && window.activeSkill) { executeOverlordSkill(idx); }
            if(myPlayerId === 'p2' && window.activeSkill === 'hologram') {
                if(idx < 0 || idx > 43) return showToast("只能放在主赛道");
                let h = [...gameState.p2.holograms, idx];
                let items = [...gameState.p2.items]; items.splice(items.indexOf('hologram'), 1);
                getRoomRef(currentRoomId).update({ 'p2.holograms': h, 'p2.items': items, logs: [...gameState.logs, `🤡 蓝方部署了全息诱饵。`] });
                window.activeSkill = null; document.getElementById('board-container').classList.remove('placing-mode-active');
            }
        }

        function executeOverlordSkill(idx) {
            let update = { 'p1.energy': gameState.p1.energy - window.skillCost };
            let logs = [...gameState.logs];
            if(window.activeSkill === 'bridge') { update.brokenBridges = [...gameState.brokenBridges, idx, (idx+1)%44, (idx+2)%44]; logs.push(`🌉 红方篡改了赛道！区域 ${idx} 出现断桥！`); }
            if(window.activeSkill === 'mine') { update['p1.mines'] = [...gameState.p1.mines, idx]; logs.push(`💣 红方在暗中布置了深渊陷阱！`); }
            if(window.activeSkill === 'blindbox') { if(!eventCellIndices.includes(idx)) return showToast("必须选择事件格子(❓)"); update.fatalEvents = [...gameState.fatalEvents, idx]; logs.push(`🎁 红方注入了致命盲盒病毒！`); }
            if(window.activeSkill === 'thunder') { update.weather = { type: 'thunder', remainingTurns: 1, zone: [idx,(idx+1)%44,(idx+2)%44,(idx+3)%44,(idx+4)%44,(idx+5)%44] }; logs.push(`⚡ 极光雷暴降临！`); }
            if(window.activeSkill === 'fog') { update.weather = { type: 'fog', remainingTurns: 1, zone: [] }; logs.push(`🌫️ 掌控者降下大雾，限制蓝方移动！`); }
            if(window.activeSkill === 'pirate') { update.boss = { pos: idx }; logs.push(`🏴‍☠️ 红方悬赏海盗，将其调遣至区域 ${idx}！`); }

            update.logs = logs; window.activeSkill = null; document.getElementById('board-container').classList.remove('placing-mode-active');
            getRoomRef(currentRoomId).update(update);
        }

        window.endRedTurn = function() {
            if(gameState.turn !== 'p1') return;
            getRoomRef(currentRoomId).update({ turn: 'p2', logs: [...gameState.logs, `⏳ 红方结束布局，轮到蓝方逃亡。`] });
        }

        // --- 蓝方逻辑 ---
        window.handleRollDice = function() {
            if(gameState.turn !== 'p2') return;
            const roll = Math.floor(Math.random()*6)+1;
            document.getElementById('diceVisual').innerText = ['❓', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][roll];
            window.currentRoll = roll;
            showToast(`掷出 ${roll} 点，请点击战机移动`);
        }

        window.handlePieceClick = function(i) {
            if(myPlayerId === 'p2' && window.activeSkill) {
                // Item usage targeting
                let items = [...gameState.p2.items]; let idx = items.indexOf(window.activeSkill);
                if(idx !== -1) items.splice(idx, 1);
                let update = { 'p2.items': items }; let logs = [...gameState.logs];
                
                if(['bomber', 'frigate', 'recon'].includes(window.activeSkill)) {
                    let arr = [...gameState.p2[window.activeSkill+'s']]; arr[i] = true; update[`p2.${window.activeSkill}s`] = arr;
                    logs.push(`🔧 战机 ${i} 改装为 ${window.activeSkill}！`);
                }
                if(window.activeSkill === 'stealth') {
                    let arr = [...gameState.p2.stealthTurns]; arr[i] = 3; update['p2.stealthTurns'] = arr;
                    logs.push(`👻 战机 ${i} 启动光学迷彩，将对红方隐身 3 回合！`);
                }
                update.logs = logs; window.activeSkill = null; document.body.classList.remove('selecting-mode');
                getRoomRef(currentRoomId).update(update); return;
            }

            if(gameState.turn !== 'p2' || !window.currentRoll) return;
            let pieces = [...gameState.p2.pieces];
            let pos = pieces[i];
            
            if(pos === -2 || pos === 999) return;
            if(pos === -1 && window.currentRoll !== 6 && window.currentRoll !== 1 && window.currentRoll !== 5) return showToast("需要 1,5,6 起飞");

            let logs = [...gameState.logs];
            let newPos = pos;
            
            if(pos === -1) { newPos = 22; logs.push(`✈️ 蓝方战机出动！`); }
            else {
                let steps = window.currentRoll;
                if(gameState.weather.type === 'fog' && !gameState.p2.recons[i]) steps = 1; // 雾天限速，侦察机免疫
                
                let pathLogic = []; for(let k=22; k<=43; k++) pathLogic.push(k); for(let k=0; k<=21; k++) pathLogic.push(k); pathLogic.push(200, 201, 202, 203, 204, 999);
                let cIdx = pathLogic.indexOf(pos);
                for(let s=0; s<steps; s++) {
                    cIdx++; if(cIdx >= pathLogic.length) { cIdx = pathLogic.length - 2; break; }
                }
                newPos = pathLogic[cIdx];
            }

            // 同色跳跃检测 (必须没断桥)
            if(newPos >= 0 && newPos <= 43 && getCellColor(newPos) === 2 && !gameState.brokenBridges.includes(newPos)) {
                let pathLogic = []; for(let k=22; k<=43; k++) pathLogic.push(k); for(let k=0; k<=21; k++) pathLogic.push(k);
                let cIdx = pathLogic.indexOf(newPos);
                if(cIdx + 4 < 44) {
                    let jumpPos = pathLogic[cIdx + 4];
                    let canJump = true;
                    for(let j=1; j<=4; j++) if(gameState.brokenBridges.includes(pathLogic[cIdx+j])) canJump = false;
                    if(canJump) { newPos = jumpPos; logs.push(`💨 蓝方触发跃迁！`); }
                }
            }

            let update = {}; let isDead = false;

            // 陷阱结算
            if(newPos >= 0 && newPos <= 43) {
                if(gameState.fatalEvents.includes(newPos)) {
                    if(gameState.p2.frigates[i]) logs.push(`🛸 护卫舰免疫了毒盲盒！`);
                    else { logs.push(`💀 踩中致命盲盒，战机坠毁！`); isDead = true; }
                }
                if(gameState.weather.type === 'thunder' && gameState.weather.zone.includes(newPos)) {
                    if(gameState.p2.frigates[i]) logs.push(`🛸 护卫舰免疫了雷暴！`);
                    else if(Math.random() < 0.5) { logs.push(`⚡ 遭雷击坠毁！`); isDead = true; }
                }
                if(gameState.p1.mines.includes(newPos)) {
                    if(gameState.p2.recons[i]) { logs.push(`🛩️ 侦察机安全排雷！`); update['p1.mines'] = gameState.p1.mines.filter(m=>m!==newPos); }
                    else { logs.push(`💣 踩中地雷坠毁！`); isDead = true; update['p1.mines'] = gameState.p1.mines.filter(m=>m!==newPos); }
                }
                if(newPos === gameState.boss.pos) {
                    if(gameState.p2.frigates[i]) logs.push(`🛸 护卫舰驱逐海盗！`);
                    else if(gameState.p2.stealthTurns[i] > 0) logs.push(`👻 隐形潜过海盗！`);
                    else { logs.push(`🏴‍☠️ 被海盗击落！`); isDead = true; }
                }
                if(itemCellIndices.includes(newPos) && !isDead) {
                    let it = itemPool[Math.floor(Math.random()*itemPool.length)];
                    update['p2.items'] = [...gameState.p2.items, it];
                    logs.push(`🎁 蓝方获取了物资。`);
                }
            }

            if(isDead) pieces[i] = -2; else pieces[i] = newPos;
            update['p2.pieces'] = pieces;

            if(newPos === 999) {
                let dmg = gameState.p2.bombers[i] ? 3 : 1;
                update.redBaseHp = gameState.redBaseHp - dmg;
                logs.push(`💥 蓝方冲入敌阵！红方大本营扣除 ${dmg} 点生命！`);
            }

            // 更新隐形回合
            let stealth = [...gameState.p2.stealthTurns];
            stealth = stealth.map(t => t>0 ? t-1 : 0);
            update['p2.stealthTurns'] = stealth;

            // 回合交接
            update.turn = 'p1';
            update['p1.energy'] = gameState.p1.energy + 10;
            if(gameState.weather.remainingTurns > 0) {
                update.weather = gameState.weather; update.weather.remainingTurns--;
                if(update.weather.remainingTurns === 0) update.weather.type = 'normal';
            }
            
            update.logs = logs; window.currentRoll = null;
            getRoomRef(currentRoomId).update(update);
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer'); container.innerHTML = '';
            const items = gameState.p2.items || [];
            if(items.length===0) { container.innerHTML = '<span class="text-xs text-gray-400 m-auto">背包空空...</span>'; return;}
            items.forEach(it => {
                let name = it==='bomber'?'🚀轰炸机':it==='frigate'?'🛸护卫舰':it==='recon'?'🛩️侦察机':it==='stealth'?'👻迷彩':it==='hologram'?'🤡诱饵':'🎲指定骰';
                const btn = document.createElement('button');
                btn.className = 'px-2 py-1 bg-slate-600 text-white text-xs rounded border border-slate-500 whitespace-nowrap active:scale-95';
                btn.innerText = name;
                btn.onclick = () => {
                    if(gameState.turn !== 'p2') return;
                    if(it === 'hologram') { window.activeSkill = it; showToast("点击赛道放置诱饵"); document.getElementById('board-container').classList.add('placing-mode-active'); }
                    else if(it === 'magic_dice') { window.currentRoll = parseInt(prompt("输入指定点数1-6:","6"))||6; let iList=[...gameState.p2.items]; iList.splice(iList.indexOf(it),1); getRoomRef(currentRoomId).update({'p2.items':iList}); handleRollDice = ()=>{}; document.getElementById('diceVisual').innerText = window.currentRoll; showToast("已指定，请点击战机"); }
                    else { window.activeSkill = it; showToast(`点击战机使用 ${name}`); document.body.classList.add('selecting-mode'); }
                };
                container.appendChild(btn);
            });
        }

        function endGame(winner, msg) {
            document.getElementById('msgModal').classList.remove('hidden');
            document.getElementById('msgTitle').innerText = msg;
        }

        window.resetGame = async function() {
            await getRoomRef(currentRoomId).update({
                status: 'playing', turn: 'p1', redBaseHp: 5,
                p1: { name: gameState.p1.name, energy: 10, mines: [] },
                p2: { name: gameState.p2.name, pieces: Array(8).fill(-1), bombers: Array(8).fill(false), frigates: Array(8).fill(false), recons: Array(8).fill(false), stealthTurns: Array(8).fill(0), holograms: [], items: [] },
                brokenBridges: [], fatalEvents: [], weather: { type: 'normal', remainingTurns: 0, zone: [] }, boss: { pos: -1 }, logs: ["重新部署完毕！"]
            });
            document.getElementById('msgModal').classList.add('hidden');
        }

        cloudbase.auth().signInAnonymously().then(()=> { document.getElementById('globalLoading').classList.add('hidden'); document.getElementById('lobbyView').classList.remove('hidden'); });
    </script>
</body>
