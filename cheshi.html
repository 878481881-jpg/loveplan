<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端植物大战僵尸 - 实时对战版 🌻🧟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://static.cloudbase.net">
    <!-- 腾讯云开发 CloudBase Web SDK -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px), radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        /* 增加豌豆射击和平滑移动的过渡效果 */
        .entity-transition { transition: all 0.2s linear; }
        .pea-shoot { animation: shoot 0.4s linear forwards; }
        @keyframes shoot { from { transform: translateX(0); } to { transform: translateX(100%); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-2 sm:px-6 relative">
    <div id="globalLoading" class="fixed inset-0 bg-green-50/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-6xl animate-bounce mb-4">🌱</div>
        <div class="text-green-600 font-bold text-xl">连接花园中...</div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-50 whitespace-nowrap"></div>

    <div id="msgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center" id="msgModalContent">
            <h3 class="text-2xl font-bold text-green-600 mb-2" id="msgTitle">战斗结束</h3>
            <p class="text-gray-600 mb-6 font-medium" id="msgDesc">胜负已分！</p>
            <button onclick="exitRoom()" class="w-full py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">返回大厅</button>
        </div>
    </div>

    <header class="w-full max-w-md flex justify-between items-center mb-4 z-10 px-2">
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-2xl shadow-sm border border-white">
            <span class="text-2xl">🌻</span>
            <div>
                <h1 class="text-lg font-bold text-green-600 leading-tight">植物保卫战 - 实时版</h1>
            </div>
        </div>
        <div class="bg-white/90 px-3 py-1.5 rounded-full border border-green-100 shadow-sm text-xs font-bold text-gray-600">
            玩家: <span id="currentRoleDisplay" class="text-green-500">加载中</span>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 relative z-10">
        
        <!-- 大厅视图 -->
        <div id="lobbyView" class="w-full flex flex-col gap-4 hidden">
            <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-xl flex flex-col items-center text-center">
                <button onclick="createRoom()" class="w-full py-4 mb-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-all">
                    <span>🌻</span> 创建房间 (植物方)
                </button>
                <div class="flex flex-col gap-3 w-full">
                    <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位房间号" class="w-full px-4 py-4 bg-gray-50 border-2 border-green-100 rounded-2xl text-center text-xl font-black text-purple-700 tracking-[0.5em] uppercase outline-none">
                    <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold text-lg rounded-2xl shadow-lg active:scale-95 transition-all">
                        加入突袭 (僵尸方)
                    </button>
                </div>
            </div>
        </div>

        <!-- 游戏视图 -->
        <div id="gameView" class="w-full flex flex-col gap-3 hidden">
            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 shadow-sm flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 font-bold">房间号</span>
                    <span id="displayRoomCode" class="text-xl font-black text-green-600 tracking-wider">----</span>
                </div>
                <div class="flex gap-4 items-center">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-green-500 font-bold">植物方 🌻</span>
                        <span id="p1Energy" class="text-sm font-black text-yellow-500">☀️ 0</span>
                    </div>
                    <div class="text-gray-300 font-black italic">VS</div>
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] text-purple-500 font-bold">僵尸方 🧟</span>
                        <span id="p2Energy" class="text-sm font-black text-red-400">🧠 0</span>
                    </div>
                </div>
            </div>

            <!-- 棋盘区域 -->
            <div id="board-container" class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-1 shadow-sm overflow-hidden relative">
                <div id="boardOverlay" class="absolute inset-0 z-30 bg-black/40 rounded-2xl hidden flex items-center justify-center">
                    <span class="text-white font-bold text-lg animate-pulse">等待对手加入...</span>
                </div>
                <div id="board-grid" class="grid gap-[2px] rounded-xl bg-green-700/50 p-[2px] min-w-[320px]"></div>
            </div>

            <!-- 手牌区 -->
            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 shadow-lg">
                <div id="hand-container" class="flex gap-2 w-full overflow-x-auto justify-center pb-1"></div>
            </div>
        </div>
    </main>

    <script type="module">
        // ===== 腾讯云开发配置（完全沿用原文件逻辑）=====
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; // 请替换为实际环境ID
        const REGION = "ap-shanghai";             
        const ROOM_COLLECTION = "pvzRealtimeRooms"; 

        function getRoomRef(code) { return db.collection(ROOM_COLLECTION).doc(String(code)); }
        
        let app, auth, db, currentUser = null, hasCloudBase = false;
        try {
            app = cloudbase.init({ env: ENV_ID, region: REGION });
            auth = app.auth; db = app.database(); hasCloudBase = true;
        } catch(e) {}

        const myName = "玩家" + Math.floor(Math.random()*1000); 
        document.getElementById('currentRoleDisplay').innerText = myName;

        let currentRoomId = null, unsubscribeRoom = null, myPlayerId = null;
        let selectedCard = null;

        // --- 实时游戏核心状态（完全本地化） ---
        const COLS = 8; const ROWS = 5;
        let localEntities = [];       // 本地渲染的实体库
        let localEnergies = { p1: 150, p2: 150 }; // 本地模拟的双方能量
        let actionsProcessed = 0;     // 已处理的云端指令数
        let gameLoopTimer = null;
        let tickCount = 0;            // 时钟滴答计数器
        let isGameRunning = false;

        // 单位数据表（支持实时化）
        const CARDS = {
            sunflower: { cost: 50, hp: 4, icon: '🌻', name: '向日葵' },
            peashooter: { cost: 100, hp: 4, icon: '🌱', name: '豌豆' },
            wallnut: { cost: 50, hp: 12, icon: '🥔', name: '坚果' },
            zombie: { cost: 50, hp: 6, icon: '🧟', name: '普通僵尸' },
            conehead: { cost: 100, hp: 12, icon: '🍦', name: '路障僵尸' }
        };

        function initBoardGrid() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `30px repeat(${COLS}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let y = 0; y < ROWS; y++) {
                let brainCell = document.createElement('div');
                brainCell.className = "flex items-center justify-center bg-pink-100 rounded-l-md border-r-2 border-green-700/50";
                brainCell.innerHTML = '<span class="text-xl">🧠</span>';
                grid.appendChild(brainCell);

                for (let x = 0; x < COLS; x++) {
                    let cell = document.createElement('div');
                    let isDark = (x + y) % 2 === 0;
                    cell.className = `field-cell ${isDark ? 'bg-green-500' : 'bg-green-400'} h-10 sm:h-12 flex items-center justify-center relative cursor-pointer`;
                    if(x === COLS - 1) cell.classList.add('rounded-r-md');
                    cell.onclick = () => handleCellClick(x, y);
                    cell.id = `cell-${x}-${y}`;
                    grid.appendChild(cell);
                }
            }
        }

        async function initAuth() {
            if (!hasCloudBase) return hideLoading();
            try {
                await auth.signInAnonymously();
                switchToLobby();
            } catch (err) { switchToLobby(); }
            hideLoading();
        }
        function hideLoading() { document.getElementById('globalLoading').classList.add('hidden'); }

        function switchToLobby() {
            document.getElementById('lobbyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            if(unsubscribeRoom) unsubscribeRoom();
            stopGameLoop();
        }

        window.createRoom = async function() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            // 云端只保存状态和行动队列
            const initialData = { status: 'waiting', p1_name: myName, actions: [] };
            await getRoomRef(code).set(initialData);
            myPlayerId = 'p1'; listenToRoom(code);
        };

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if(code.length !== 4) return showToast("请输入4位房间号");
            const res = await getRoomRef(code).get();
            const data = res.data && res.data[0];
            if (!data || data.status !== 'waiting') return showToast("房间不可加入");
            
            await getRoomRef(code).update({ status: 'playing', p2_name: myName });
            myPlayerId = 'p2'; listenToRoom(code);
        };

        function listenToRoom(code) {
            currentRoomId = code;
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            initBoardGrid();
            document.getElementById('displayRoomCode').innerText = code;

            const watcher = getRoomRef(code).watch({
                onChange: (snapshot) => {
                    const data = snapshot.docs[0] || snapshot.docs;
                    if (!data) return;
                    
                    if (data.status === 'playing' && !isGameRunning) {
                        document.getElementById('boardOverlay').classList.add('hidden');
                        startGameLoop();
                    }
                    // 解析云端最新动作队列 
                    if (data.actions && data.actions.length > actionsProcessed) {
                        for (let i = actionsProcessed; i < data.actions.length; i++) {
                            processCloudAction(data.actions[i]);
                        }
                        actionsProcessed = data.actions.length;
                    }
                },
                onError: () => showToast("连接中断")
            });
            unsubscribeRoom = () => watcher.close();
        }

        // ================= 本地核心实时引擎 =================
        function startGameLoop() {
            isGameRunning = true;
            localEntities = [];
            localEnergies = { p1: 150, p2: 150 };
            tickCount = 0;
            // 每400ms执行一次物理计算（本地零延迟推演）
            gameLoopTimer = setInterval(gameTick, 400); 
            renderHand();
        }

        function stopGameLoop() {
            isGameRunning = false;
            clearInterval(gameLoopTimer);
        }

        function gameTick() {
            tickCount++;

            // 1. 豌豆子弹飞行与碰撞
            localEntities.filter(e => e.type === 'pea').forEach(pea => {
                pea.x += 0.5; // 每tick飞半格
                let hitZombies = localEntities.filter(z => z.owner === 'p2' && Math.floor(z.x) === Math.floor(pea.x) && z.hp > 0 && z.y === pea.y);
                if (hitZombies.length > 0) {
                    hitZombies[0].hp -= 1;
                    pea.hp = 0; // 子弹销毁
                }
            });

            // 2. 僵尸移动与啃咬
            localEntities.filter(e => e.owner === 'p2' && e.hp > 0).forEach(z => {
                let blockPlant = localEntities.find(p => p.owner === 'p1' && Math.floor(p.x) === Math.floor(z.x - 0.5) && p.y === z.y && p.hp > 0);
                if (blockPlant) {
                    if (tickCount % 2 === 0) blockPlant.hp -= 1; // 每800ms攻击一次
                } else {
                    if (tickCount % 3 === 0) z.x -= 1; // 每1.2秒走1格
                    if (z.x < 0) triggerGameOver('p2'); // 触及大脑，僵尸胜利
                }
            });

            // 3. 植物攻击
            localEntities.filter(e => e.type === 'peashooter' && e.hp > 0).forEach(p => {
                let hasZombie = localEntities.find(z => z.owner === 'p2' && z.y === p.y && z.x > p.x && z.hp > 0);
                if (hasZombie && tickCount % 4 === 0) {
                    // 发射豌豆
                    localEntities.push({ type: 'pea', owner: 'p1', x: p.x + 0.5, y: p.y, hp: 1, maxHp: 1 });
                }
            });

            // 4. 自然回能与向日葵产出
            if (tickCount % 5 === 0) { // 每2秒
                localEnergies.p1 += 10; 
                localEnergies.p2 += 15; // 僵尸方自然回能稍快弥补没有生产单位
                localEntities.filter(e => e.type === 'sunflower' && e.hp > 0).forEach(() => {
                    localEnergies.p1 += 10; 
                });
            }

            // 5. 清理死亡实体
            localEntities = localEntities.filter(e => e.hp > 0 && e.x < COLS + 1);

            renderBoard();
            updateUI();
        }

        // ================= 操作指令的上传与执行 =================
        window.selectCard = function(type) {
            if (!isGameRunning) return;
            selectedCard = type;
            renderHand();
        }

        window.handleCellClick = async function(x, y) {
            if (!isGameRunning || !selectedCard) return;
            let cost = CARDS[selectedCard].cost;
            
            // 1. 本地合法性校验
            if (localEnergies[myPlayerId] < cost) return showToast("能量不足");
            if (myPlayerId === 'p1' && x > 3) return showToast("植物只能种在己方前4列");
            if (myPlayerId === 'p2' && x < 6) return showToast("僵尸只能从最后2列出击");
            if (localEntities.find(e => e.x === x && e.y === y && e.type !== 'pea')) return showToast("位置被占用");

            // 2. 构造行动指令并上传云端（云端纯转发）
            const newAction = {
                id: Math.random().toString(36).substring(2),
                type: 'place', owner: myPlayerId, card: selectedCard, x, y
            };
            
            // 为了防止等待服务器回调卡顿，采用乐观隐藏选卡状态
            selectedCard = null; 
            renderHand();

            try {
                // 读取旧队列并追加（简单实现高并发排队）
                const snap = await getRoomRef(currentRoomId).get();
                const currentActions = snap.data[0].actions || [];
                currentActions.push(newAction);
                await getRoomRef(currentRoomId).update({ actions: currentActions });
            } catch(e) { showToast("网络指令发送失败"); }
        }

        // 本地引擎处理从云端同步下来的指令
        function processCloudAction(action) {
            if (action.type === 'place') {
                const card = CARDS[action.card];
                // 扣除能量
                localEnergies[action.owner] -= card.cost;
                // 生成实体到本地
                localEntities.push({
                    id: action.id, type: action.card, owner: action.owner,
                    x: action.x, y: action.y, hp: card.hp, maxHp: card.hp
                });
            }
        }

        // ================= UI 渲染逻辑 =================
        function updateUI() {
            document.getElementById('p1Energy').innerText = `☀️ ${localEnergies.p1}`;
            document.getElementById('p2Energy').innerText = `🧠 ${localEnergies.p2}`;
        }

        function renderHand() {
            const hand = document.getElementById('hand-container');
            hand.innerHTML = '';
            const myCards = myPlayerId === 'p1' ? ['sunflower', 'peashooter', 'wallnut'] : ['zombie', 'conehead'];
            const eIcon = myPlayerId === 'p1' ? '☀️' : '🧠';

            myCards.forEach(type => {
                const card = CARDS[type];
                const canAfford = localEnergies[myPlayerId] >= card.cost;
                const isSelected = selectedCard === type;
                
                let div = document.createElement('div');
                div.className = `flex flex-col items-center p-2 rounded-xl border-2 cursor-pointer w-16
                    ${isSelected ? 'border-green-400 bg-green-50 scale-105' : 'border-gray-200 bg-white'} 
                    ${!canAfford ? 'opacity-40 grayscale' : 'hover:shadow-md'} entity-transition`;
                div.onclick = () => canAfford && window.selectCard(type);
                
                div.innerHTML = `
                    <span class="text-2xl">${card.icon}</span>
                    <span class="text-[10px] font-bold text-gray-700">${card.name}</span>
                    <span class="text-[10px] font-black">${eIcon} ${card.cost}</span>
                `;
                hand.appendChild(div);
            });
        }

        function renderBoard() {
            // 清理原有实体
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    if (cell) cell.innerHTML = '';
                }
            }

            // 重新挂载实体（根据 x 坐标小数平滑挂载）
            localEntities.forEach(e => {
                const drawX = Math.floor(e.x);
                if (drawX < 0 || drawX >= COLS) return;
                const cell = document.getElementById(`cell-${drawX}-${e.y}`);
                if (!cell) return;
                
                let icon = '';
                if (e.type === 'pea') {
                    icon = '<div class="w-3 h-3 bg-green-200 rounded-full shadow-md"></div>';
                } else {
                    icon = CARDS[e.type].icon;
                }

                // 计算格子内的偏移以实现平滑移动
                const offsetX = (e.x - drawX) * 100;

                const el = document.createElement('div');
                el.className = "absolute flex items-center justify-center w-full h-full entity-transition";
                // 如果是僵尸，脸朝左并且移动平滑
                if (e.owner === 'p2') el.style.transform = `translateX(${offsetX}%) scaleX(-1)`;
                else el.style.transform = `translateX(${offsetX}%)`;

                el.innerHTML = `
                    <span class="text-2xl drop-shadow-md ${e.type==='pea'?'':'animate-bounce'}">${icon}</span>
                    ${e.type !== 'pea' ? `
                    <div class="absolute bottom-0 w-3/4 left-1/8 h-1 bg-black/40 rounded-full">
                        <div class="bg-${e.owner==='p1'?'green':'red'}-400 h-1 rounded-full" style="width: ${(e.hp/e.maxHp)*100}%"></div>
                    </div>` : ''}
                `;
                cell.appendChild(el);
            });
        }

        function triggerGameOver(winnerId) {
            stopGameLoop();
            document.getElementById('msgModal').classList.remove('hidden');
            const role = winnerId === myPlayerId ? '你' : '对手';
            document.getElementById('msgDesc').innerText = winnerId === 'p1' ? '防守成功！🌻' : '僵尸吃掉了你的脑子！🧠';
        }

        window.exitRoom = function() {
            location.reload(); 
        };

        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        };

        initAuth();
    </script>
</body>
</html>
