<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端逃生：掌控者 vs 逃亡者</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://static.cloudbase.net">
    
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px), radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            overflow-x: hidden; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-overflow-scrolling: touch;
        }
        @keyframes float { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-10px) translateX(5px); } }
        .cloud { animation: float 6s ease-in-out infinite; }
        .cloud-delayed { animation: float 7s ease-in-out 2s infinite; }
        @keyframes rollDice { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(90deg) scale(1.2); } 50% { transform: rotate(180deg) scale(0.8); } 75% { transform: rotate(270deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        .dice-rolling { animation: rollDice 0.5s ease-out; }

        @keyframes flyBounce { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.15) translateY(-5px); } }
        .plane-active { animation: flyBounce 1s infinite; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .plane-transition { transition: transform 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), left 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), top 0.4s cubic-bezier(0.34, 1.3, 0.64, 1); will-change: transform, left, top; transform: translateZ(0); }

        .plane-bomber { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); border-color: #ef4444 !important; }
        .plane-frigate { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8)); border-color: #06b6d4 !important; }
        .plane-recon { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.8)); border-color: #22c55e !important; }

        #board-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.85); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05), inset 0 0 0 2px #fff; padding: 10px; margin: 0 auto; overflow: hidden; }
        #board-grid { display: grid; width: 100%; height: 100%; gap: 2px; position: relative; }
        .board-cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08); transition: background-color 0.3s, transform 0.2s; cursor: pointer; }
        .board-cell:active { transform: scale(0.9); }

        .cell-color-0 { background-color: #fca5a5; } .cell-color-1 { background-color: #fde047; } .cell-color-2 { background-color: #93c5fd; } .cell-color-3 { background-color: #86efac; }
        .cell-home-red { background-color: #fee2e2; border: 1px dashed #fca5a5; } 
        .cell-home-blue { background-color: #e0f2fe; border: 1px dashed #93c5fd; }
        .cell-win { background: radial-gradient(circle, #fbbf24 0%, #f59e0b 100%); box-shadow: 0 0 10px #fbbf24; }
        .cell-empty { background-color: transparent; box-shadow: none; cursor: default;}
        
        @keyframes pulseRed { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); } 50% { background-color: rgba(239, 68, 68, 0.7); box-shadow: 0 0 10px red inset; } }
        @keyframes pulsePurple { 0%, 100% { box-shadow: 0 0 5px #8b5cf6 inset; } 50% { box-shadow: 0 0 15px #c084fc inset, 0 0 10px #8b5cf6; } }

        .plane { position: absolute; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.2), inset 0 -2px 0 rgba(0,0,0,0.2); z-index: 10; }
        .plane-red { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: 2px solid #fff; }
        .plane-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: 2px solid #fff; }
        
        .base-area { position: absolute; width: 25%; height: 25%; background: rgba(255,255,255,0.9); border-radius: 16px; padding: 5px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 2px solid white; }
        .base-red { top: 0; left: 0; border-color: #fca5a5; } 
        .base-blue { bottom: 0; right: 0; border-color: #93c5fd; }
        .base-spot { width: 100%; height: 100%; border-radius: 50%; background: rgba(0,0,0,0.04); }

        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .red-god-mode-active { animation: pulsePurple 2s infinite !important; cursor: crosshair; }

        .energy-bar-wrap { width: 100%; height: 6px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 4px; position: relative; }
        .energy-bar-fill { height: 100%; background: linear-gradient(90deg, #9333ea, #c084fc); transition: width 0.3s ease; width: 0%; box-shadow: 0 0 8px #a855f7; }
        
        @keyframes propFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .board-prop { animation: propFloat 2s ease-in-out infinite; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }

        @keyframes splashPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-3 sm:px-6 relative pb-40">
    <div class="fixed top-10 left-4 text-4xl cloud opacity-50 z-[-1]">☁️</div>
    <div class="fixed top-32 right-8 text-5xl cloud-delayed opacity-50 z-[-1]">☁</div>
    <div class="fixed bottom-20 left-10 text-3xl cloud opacity-40 z-[-1]">☁</div>

    <div id="globalLoading" class="fixed inset-0 bg-sky-50/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-6xl animate-bounce mb-4">✈️</div>
        <div class="text-sky-600 font-bold text-xl flex items-center gap-2">连接战术网络...</div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-sky-800/95 text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-[1000] whitespace-nowrap border border-sky-400/50"></div>

    <div id="msgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform text-center" id="msgModalContent">
            <div id="msgIcon" class="text-6xl mb-4 animate-bounce">🏆</div>
            <h3 class="text-2xl font-bold text-sky-600 mb-2" id="msgTitle">游戏结束</h3>
            <div id="statsBox" class="bg-gray-50 rounded-xl p-3 mb-6 text-xs text-gray-600 text-left space-y-1 border border-gray-200"></div>
            <div class="flex gap-3">
                <button onclick="closeMsgModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 active:scale-95 transition-all">关闭</button>
                <button id="modalActionBtn" onclick="resetGame()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-sky-400 to-blue-500 text-white font-bold shadow-md hover:opacity-95 active:scale-95 transition-all">再来一局</button>
            </div>
        </div>
    </div>

    <div id="traitSelectModal" class="fixed inset-0 bg-sky-900/80 backdrop-blur-md z-[400] hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-6 w-full max-w-md shadow-[0_20px_50px_rgba(0,0,0,0.3)] border border-sky-100 text-center transform transition-transform duration-300" id="traitSelectContent">
            <h3 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-blue-600 mb-2 drop-shadow-sm">流派选择</h3>
            <p class="text-sm text-gray-500 mb-6 font-bold" id="traitSelectSub">请选择你的作战流派</p>
            <div id="traitOptionsContainer" class="w-full flex flex-col gap-3"></div>
        </div>
    </div>

    <header class="w-full max-w-md flex justify-between items-center mb-4 z-10 px-2">
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-2xl shadow-sm border border-white">
            <span class="text-3xl">✈</span>
            <div>
                <h1 class="text-xl font-bold text-sky-600 leading-tight">云端逃生 <span class="text-xs text-rose-500">8机版</span></h1>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <div class="bg-white/90 px-3 py-1.5 rounded-full border border-sky-100 shadow-sm text-xs font-bold text-gray-600 flex items-center gap-1.5">
                身份: <span id="currentRoleDisplay" class="px-2 py-0.5 rounded-full bg-sky-500 text-white shadow-inner">加载中</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 relative z-10">
        <div id="lobbyView" class="w-full flex flex-col gap-4 hidden">
            <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 border-2 border-sky-100 shadow-xl flex flex-col items-center text-center">
                <div class="w-24 h-24 bg-gradient-to-br from-purple-100 to-red-100 rounded-full flex items-center justify-center text-5xl mb-4 shadow-inner border-4 border-white">😈</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">非对称对决</h2>
                <div class="w-full space-y-4">
                    <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-red-500 to-purple-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span>👿</span> 创建房间 (扮演掌控者)
                    </button>
                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-200"></div><span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-bold uppercase tracking-wider">OR</span><div class="flex-grow border-t border-gray-200"></div>
                    </div>
                    <div class="flex flex-col gap-3 w-full">
                        <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位逃生代码" class="w-full px-4 py-4 bg-white border-2 border-sky-100 rounded-2xl text-center text-xl font-black text-sky-700 tracking-[0.5em] focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 uppercase transition-all shadow-inner" autocomplete="off">
                        <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-blue-400 to-indigo-500 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all">加入房间 (控制 8 架战机)</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameView" class="w-full flex flex-col gap-4 hidden">
            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 border-2 border-sky-100 shadow-sm flex flex-col relative">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-gray-400 font-bold uppercase">代码</span>
                        <span id="displayRoomCode" class="text-xl font-black text-sky-600 tracking-wider">----</span>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-50 px-4 py-1.5 rounded-full border border-gray-100">
                        <div class="flex flex-col items-center relative transition-all duration-300 rounded-lg p-1">
                            <span class="text-[9px] text-purple-600 font-bold">上帝 (红方)</span>
                            <span id="p1NameDisplay" class="text-xs font-black text-purple-700">等待</span>
                            <div id="p1TraitName" class="mt-0.5 text-[8px] bg-purple-50 text-purple-500 px-1.5 py-0.5 rounded border border-purple-100">未选择</div>
                        </div>
                        <div class="text-gray-300 font-black italic text-sm">VS</div>
                        <div class="flex flex-col items-center relative transition-all duration-300 rounded-lg p-1">
                            <span class="text-[9px] text-blue-400 font-bold">指挥官 (蓝方)</span>
                            <span id="p2NameDisplay" class="text-xs font-black text-blue-600">等待</span>
                            <div id="p2TraitName" class="mt-0.5 text-[8px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded border border-blue-100">未选择</div>
                        </div>
                    </div>
                    <button onclick="exitRoom()" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors border border-red-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
                
                <div class="mt-1 w-full">
                    <div class="flex justify-between text-[9px] font-bold text-gray-500 mb-0.5">
                        <span class="text-purple-600" id="energyLabel">红方暗影能量</span>
                        <span id="energyText">0/20</span>
                    </div>
                    <div class="energy-bar-wrap"><div class="energy-bar-fill" id="energyFill"></div></div>
                    <div class="flex justify-between text-[9px] text-gray-400 mt-1">
                        <span>蓝方需逃离 4 架 (已逃离 <span id="escapeCount" class="text-blue-500">0</span>)</span>
                        <span>剩余回合: <span id="turnsLeft" class="text-red-500">50</span></span>
                    </div>
                </div>
            </div>

            <div id="board-container">
                <div id="boardOverlay" class="absolute inset-0 z-30 bg-black/5 rounded-2xl hidden cursor-not-allowed"></div>
                <div id="board-grid"></div>

                <div class="base-area base-red" id="base-red">
                    <div class="base-spot" id="spot-red-0"></div><div class="base-spot" id="spot-red-1"></div>
                    <div class="base-spot" id="spot-red-2"></div><div class="base-spot" id="spot-red-3"></div>
                </div>
                <div class="base-area base-blue" id="base-blue">
                    <div class="base-spot" id="spot-blue-0"></div><div class="base-spot" id="spot-blue-1"></div>
                    <div class="base-spot" id="spot-blue-2"></div><div class="base-spot" id="spot-blue-3"></div>
                </div>
                <div id="planes-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>

            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 border border-white shadow-lg flex flex-col gap-2">
                <div id="redControls" class="hidden flex-col gap-2">
                    <div class="text-[11px] font-bold text-purple-700 bg-purple-50 p-1.5 rounded text-center">👿 上帝控制台 (先选技能，再点棋盘)</div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button onclick="activateRedSkill('hack', 1)" id="btnRedHack" class="py-1.5 bg-gray-50 border border-gray-200 text-xs font-bold rounded shadow-sm hover:bg-purple-100 hover:border-purple-300 disabled:opacity-50">🎨 篡改颜色 (1)</button>
                        <button onclick="activateRedSkill('mine', 2)" id="btnRedMine" class="py-1.5 bg-gray-50 border border-gray-200 text-xs font-bold rounded shadow-sm hover:bg-purple-100 hover:border-purple-300 disabled:opacity-50">💣 隐形水雷 (2)</button>
                        <button onclick="activateRedSkill('barricade', 2)" id="btnRedBarricade" class="py-1.5 bg-gray-50 border border-gray-200 text-xs font-bold rounded shadow-sm hover:bg-purple-100 hover:border-purple-300 disabled:opacity-50">🚧 强力路障 (2)</button>
                        <button onclick="activateRedSkill('strike', 5)" id="btnRedStrike" class="py-1.5 bg-gray-50 border border-gray-200 text-xs font-bold rounded shadow-sm hover:bg-red-100 hover:border-red-300 disabled:opacity-50">⚡ 降维雷击 (5)</button>
                    </div>
                    <button onclick="endRedTurn()" class="w-full py-2 bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold rounded-lg shadow-md hover:opacity-90 active:scale-95">结束我的干预</button>
                </div>

                <div id="blueControls" class="hidden flex gap-4 items-center">
                    <div class="flex-shrink-0 flex flex-col items-center justify-center bg-blue-50 p-3 rounded-xl border border-blue-100 w-24">
                        <div id="diceVisual" class="text-4xl mb-2 drop-shadow-md">🎲</div>
                        <button id="btnRollDice" onpointerdown="handleRollDice()" class="w-full py-1.5 bg-gradient-to-r from-blue-400 to-blue-600 text-white font-bold rounded shadow hover:scale-105 active:scale-95 disabled:opacity-50 text-xs transition-opacity duration-300">掷骰逃生</button>
                    </div>
                    <div class="text-[10px] text-gray-500 flex-1">
                        提示: 8 架战机均由你调遣。<br>掷出 1或6 起飞，优先自动起飞及推进最前方战机。<br>护送 4 架即可获胜。
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl border border-gray-100 p-2 overflow-hidden relative h-28">
                    <div class="text-[10px] font-bold text-gray-500 mb-1 px-1 border-b pb-1 flex justify-between">
                        <span>📡 战场通讯</span>
                        <div id="turnIndicator" class="text-[9px] px-2 py-0.5 rounded bg-gray-200 text-gray-500">等待中</div>
                    </div>
                    <div id="eventLogs" class="flex-1 overflow-y-auto space-y-1.5 no-scrollbar p-1 text-[11px] font-medium text-gray-600 h-20"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="inventoryBar" class="fixed bottom-[20px] left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.15)] border border-sky-200 flex flex-col gap-2 z-[200] hidden w-[90%] max-w-sm max-h-[160px] overflow-y-auto items-start">
        <span class="text-xs font-bold text-sky-700">🎒 指挥官背包</span>
        <div id="itemsContainer" class="flex gap-2 flex-wrap w-full"><span class="text-xs text-gray-400 italic">踩中 🎁 获取补给</span></div>
    </div>

    <script type="module">
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; 
        const REGION = "ap-shanghai";             
        const ROOM_COLLECTION = "escapeTactics8"; 

        function getRoomRef(code) { return db.collection(ROOM_COLLECTION).doc(String(code)); }
        function pickDoc(snapshot, code) {
            if (!snapshot) return null; const docs = snapshot.docs;
            if (Array.isArray(docs)) return docs[0] || null;
            if (docs && typeof docs === 'object') return docs[code] || (docs._id ? docs : null);
            return null;
        }

        let app, auth, db, currentUser = null, hasCloudBase = false, cachedBaseSpots = {};
        let isAudioInited = false, synths = {};
        try { app = cloudbase.init({ env: ENV_ID, region: REGION }); auth = app.auth; db = app.database(); hasCloudBase = true; } catch(e) { console.error(e); }

        let myIdentity = "玩家" + Math.floor(Math.random()*1000); 
        const myName = myIdentity; document.getElementById('currentRoleDisplay').innerText = myName;

        let currentRoomId = null, unsubscribeRoom = null, gameState = null, myPlayerId = null;
        
        window.activeRedSkill = null; window.selectingItemType = null;
        window.animLockCount = 0;
        window.addAnimLock = function() { window.animLockCount++; document.getElementById('boardOverlay')?.classList.remove('hidden'); };
        window.removeAnimLock = function() { window.animLockCount = Math.max(0, window.animLockCount - 1); if(window.animLockCount === 0) renderGameState(); };
        window.isGameAnimating = function() { return window.animLockCount > 0; };

        const TRAITS_DB = {
            'god_energy': { role: 'p1', name: '暗影涌动', icon: '😈', desc: '【上帝流】每回合额外恢复 1 点暗影能量（共 4 点/回合）。' },
            'god_tyrant': { role: 'p1', name: '残暴镇压', icon: '⚡', desc: '【杀戮流】你的“降维雷击”技能消耗从 5 降至 4 点。' },
            'esc_navigator': { role: 'p2', name: '王牌领航', icon: '👨‍✈️', desc: '【速推流】掷出 1、5、6 皆可起飞驶出机库。' },
            'esc_thief': { role: 'p2', name: '能量窃贼', icon: '🧲', desc: '【干扰流】成功进行“同色跳跃”时，偷取红方 1 点能量。' }
        };

        const itemPool = ['missile', 'shield', 'hook'];
        window.getItemName = function(item) {
            if(item === 'missile') return '🎯净化导弹'; if(item === 'shield') return '🛡护盾'; if(item === 'hook') return '🧲窃能钩爪'; return '📦物资';
        };

        function renderTraitOptions() {
            const container = document.getElementById('traitOptionsContainer'); container.innerHTML = '';
            const myOptions = Object.keys(TRAITS_DB).filter(k => TRAITS_DB[k].role === myPlayerId);
            myOptions.forEach(tId => {
                let t = TRAITS_DB[tId];
                let btn = document.createElement('button');
                btn.className = 'relative w-full text-left p-4 bg-white border-2 border-sky-200 rounded-xl hover:border-sky-400 mb-2 group';
                btn.innerHTML = `<div class="font-black text-sky-700 text-lg mb-1">${t.icon} ${t.name}</div><div class="text-xs text-gray-600">${t.desc}</div>`;

            synths.click = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 } }).toDestination();
            synths.boom = new Tone.MembraneSynth().toDestination(); synths.alert = new Tone.Synth({ oscillator: { type: "sawtooth" } }).toDestination();
            isAudioInited = true;
        }
        ['click', 'touchstart'].forEach(evt => document.body.addEventListener(evt, initAudioContext, { once: true }));
        function playSound(type) {
            if(!isAudioInited) return;
            if(type === 'dice') synths.click.triggerAttackRelease(["C4", "E4"], "8n");
            else if (type === 'boom') synths.boom.triggerAttackRelease("C2", "2n");

            document.body.appendChild(splashEl); setTimeout(() => splashEl.remove(), duration);
        };

        const GRID_SIZE = 14; const trackCoords = [];
        for(let x=1; x<=12; x++) trackCoords.push({x, y: 1}); 
        for(let y=2; y<=12; y++) trackCoords.push({x: 12, y});
        for(let x=11; x>=1; x--) trackCoords.push({x, y: 12});
        for(let y=11; y>=2; y--) trackCoords.push({x: 1, y});
        
        const p1HomeCoords = [ {x: 2, y: 2}, {x: 3, y: 3}, {x: 4, y: 4}, {x: 5, y: 5}, {x: 6, y: 6} ]; 
        const p2HomeCoords = [ {x: 11, y: 11}, {x: 10, y: 10}, {x: 9, y: 9}, {x: 8, y: 8}, {x: 7, y: 7} ]; 
        
        const eventCellIndices = [3, 8, 14, 19, 25, 30, 36, 41]; const itemCellIndices = [5, 12, 17, 23, 28, 34, 39]; 
        function getCellColor(index) { return gameState && gameState.customColors && gameState.customColors[index] !== undefined ? gameState.customColors[index] : (index % 4); }

        function initBoardGrid() {
            const grid = document.getElementById('board-grid'); grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`; grid.style.gridTemplateRows = `repeat(${GRID_SIZE}, 1fr)`;

            const fragment = document.createDocumentFragment();
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    const div = document.createElement('div'); const key = `${x},${y}`; div.id = `cell-${x}-${y}`;
                    let trackIdx = trackCoords.findIndex(c => c.x===x && c.y===y);
                    let isRedHome = p1HomeCoords.findIndex(c => c.x===x && c.y===y);
                    let isBlueHome = p2HomeCoords.findIndex(c => c.x===x && c.y===y);

                    if (trackIdx !== -1) {
                        div.className = `board-cell cell-color-${trackIdx%4}`;
                        if(trackIdx===0) div.innerHTML = '<span class="text-[8px] font-black text-red-700/60">红方跑道</span>';
                        else if(trackIdx===22) div.innerHTML = '<span class="text-[8px] font-black text-blue-700/60">蓝方跑道</span>';
                        else if (eventCellIndices.includes(trackIdx)) div.innerHTML = '<span class="text-xs animate-pulse">❓</span>';
                        else if (itemCellIndices.includes(trackIdx)) div.innerHTML = '<span class="text-xs drop-shadow-md">🎁</span>';
                        div.onclick = () => handleBoardCellClick(trackIdx);
                    } else if (isRedHome !== -1) {
                        div.className = `board-cell ${isRedHome === 4 ? 'cell-win' : 'cell-home-red'}`;
                    } else if (isBlueHome !== -1) {
                        div.className = `board-cell ${isBlueHome === 4 ? 'cell-win' : 'cell-home-blue'}`;
                    } else { div.className = `board-cell cell-empty`; }
                    fragment.appendChild(div);

            }
            grid.appendChild(fragment); initPlanesDOM(); setTimeout(cacheBaseSpotRects, 100);

        function initPlanesDOM() {
            const layer = document.getElementById('planes-layer'); layer.innerHTML = '';
            // 创建 8 架战机，0-3 是红方，4-7 是蓝方，全归指挥官(p2)操作

        function cacheBaseSpotRects() {
            cachedBaseSpots = {}; const container = document.getElementById('board-container'); if(!container) return;
            const cRect = container.getBoundingClientRect(); if (cRect.width === 0) return;
            for(let i=0; i<4; i++) {
                const spotRed = document.getElementById(`spot-red-${i}`);
                if (spotRed) { const sRect = spotRed.getBoundingClientRect(); cachedBaseSpots[`red-${i}`] = { x: ((sRect.left + sRect.width/2 - cRect.left) / cRect.width) * 100, y: ((sRect.top + sRect.height/2 - cRect.top) / cRect.height) * 100 }; }
                
                const spotBlue = document.getElementById(`spot-blue-${i}`);
                if (spotBlue) { const sRect = spotBlue.getBoundingClientRect(); cachedBaseSpots[`blue-${i}`] = { x: ((sRect.left + sRect.width/2 - cRect.left) / cRect.width) * 100, y: ((sRect.top + sRect.height/2 - cRect.top) / cRect.height) * 100 }; }
            }
        }

        window.createRoom = async function() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const initialData = {
                status: 'waiting', turn: 'p1', turnCount: 0, 
                p1: { name: myName, trait: null, energy: 5 },

                p2: { name: null, trait: null, pieces: [-1,-1,-1,-1, -1,-1,-1,-1], items: [], shield: false },

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim();
            const res = await getRoomRef(code).get(); const data = res.data && res.data[0];
            if (!data) return alert("房间不存在");
            if (data.status === 'waiting' && data.p1.name !== myName) { await getRoomRef(code).update({ 'p2.name': myName, status: 'selecting_trait' }); myPlayerId = 'p2'; }

        function listenToRoom(code) {
            currentRoomId = code; document.getElementById('lobbyView').classList.add('hidden'); document.getElementById('gameView').classList.remove('hidden');
            if(myPlayerId === 'p2') document.getElementById('inventoryBar').classList.remove('hidden');
            initBoardGrid(); if (unsubscribeRoom) unsubscribeRoom();
            const watcher = getRoomRef(code).watch({
                onChange: (snapshot) => { const data = pickDoc(snapshot, code); if (data) { gameState = data; requestAnimationFrame(renderGameState); } },
                onError: (err) => { alert("断开连接"); }
            });
            unsubscribeRoom = () => watcher.close();
        }

                if (!gameState[myPlayerId].trait) renderTraitOptions(); else document.getElementById('traitOptionsContainer').innerHTML = `<div class="py-8 text-2xl text-center">已准备，等待对方...</div>`;
                if (gameState.p1.trait && gameState.p2.trait && myPlayerId === 'p1') getRoomRef(currentRoomId).update({ status: 'playing', logs: [...gameState.logs, `双方准备完毕，50回合逃亡战正式开始！`] });
            } 
            else if (gameState.status === 'playing') {
                document.getElementById('traitSelectModal').classList.add('hidden');
                if (window.isGameAnimating()) { overlay.classList.remove('hidden'); } 
                else if (isMyTurn) {
                    overlay.classList.add('hidden');
                    turnInd.innerText = myPlayerId === 'p1' ? '👿 上帝操作中' : '👉 蓝方逃亡中';
                    turnInd.className = `text-[9px] px-2 py-0.5 rounded ${myPlayerId === 'p1' ? 'bg-purple-500 text-white' : 'bg-blue-500 text-white'} font-bold`;
                } else { turnInd.innerText = `👀 等待对方`; overlay.classList.remove('hidden'); }
                
                // 控制面板显示逻辑

                    renderInventory(); 
                    
                    // 当轮到红方(P1)回合时，蓝方(P2)的掷骰子按钮强制隐藏
                    const btnRoll = document.getElementById('btnRollDice');
                    if (gameState.turn === 'p1') {
                        btnRoll.classList.add('hidden');
                    } else {
                        btnRoll.classList.remove('hidden');
                    }
                }
            }

            const logBox = document.getElementById('eventLogs'); logBox.innerHTML = '';
            gameState.logs.slice().reverse().slice(0, 15).forEach(log => {

                div.innerHTML = log; logBox.appendChild(div);
            });

            if (gameState.winner) {
                overlay.classList.remove('hidden'); document.getElementById('msgModal').classList.remove('hidden');
                const wName = gameState.winner === 'p1' ? gameState.p1.name + ' (上帝)' : gameState.p2.name + ' (指挥官)';

        function updateBoardVisuals() {
            document.querySelectorAll('.board-prop').forEach(el => el.remove());
            trackCoords.forEach((c, i) => {
                const cell = document.getElementById(`cell-${c.x}-${c.y}`);
                if (cell) {
                    let colorIdx = getCellColor(i);
                    cell.className = `board-cell cell-color-${colorIdx}`;
                    if(window.activeRedSkill) cell.classList.add('red-god-mode-active');
                    else cell.classList.remove('red-god-mode-active');
                }
            });
            (gameState.mines || []).forEach(pos => {
                const c = trackCoords[pos]; if(!c) return; const cell = document.getElementById(`cell-${c.x}-${c.y}`);
                if(cell && myPlayerId === 'p1') {
                    const prop = document.createElement('div'); prop.className = 'board-prop absolute inset-0 flex items-center justify-center text-sm pointer-events-none';
                    prop.innerText = '💣'; cell.appendChild(prop);
                }
            });
            (gameState.barricades || []).forEach(pos => {
                const c = trackCoords[pos]; if(!c) return; const cell = document.getElementById(`cell-${c.x}-${c.y}`);
                if(cell) { const prop = document.createElement('div'); prop.className = 'board-prop absolute inset-0 flex items-center justify-center text-lg pointer-events-none'; prop.innerText = '🚧'; cell.appendChild(prop); }
            });
        }

        function updatePlanesPosition() {
            gameState.p2.pieces.forEach((pos, i) => {
                const planeEl = document.getElementById(`plane-p2-${i}`); if (!planeEl) return;
                planeEl.style.display = 'flex';
                planeEl.innerText = '✈️';
                if (pos === 999) planeEl.style.display = 'none';

                let coords = getPlaneCoords(i, pos);
                if (coords.x !== undefined) { planeEl.style.left = `calc(${coords.x}% - 13px)`; planeEl.style.top = `calc(${coords.y}% - 13px)`; }
            });
        }

        function getCoordPercent(gridVal) { return (gridVal + 0.5) * (100 / GRID_SIZE); }
        
        function getPlaneCoords(i, pos) {
            if (pos === -1) { 
                let cache = (i < 4) ? cachedBaseSpots[`red-${i}`] : cachedBaseSpots[`blue-${i-4}`];
                return cache ? cache : {x:0, y:0}; 
            }
            let gridCoord = {x:0, y:0};
            if (pos >= 0 && pos <= 43) gridCoord = trackCoords[pos];
            else if (pos >= 100 && pos <= 104) gridCoord = p1HomeCoords[pos - 100];
            else if (pos >= 200 && pos <= 204) gridCoord = p2HomeCoords[pos - 200];
            else if (pos === 999) gridCoord = (i < 4) ? p1HomeCoords[4] : p2HomeCoords[4];
            return { x: getCoordPercent(gridCoord.x), y: getCoordPercent(gridCoord.y) };
        }

        function generateLogicalPath(planeIdx) {
            let path = []; 
            if (planeIdx < 4) {
                // 红方战机路径
                for(let i=0; i<=43; i++) path.push(i); 
                path.push(100, 101, 102, 103, 104, 999);
            } else {
                // 蓝方战机路径
                for(let i=22; i<=43; i++) path.push(i); 
                for(let i=0; i<=21; i++) path.push(i); 
                path.push(200, 201, 202, 203, 204, 999);
            }
            return path;
        }

        window.activateRedSkill = function(type, cost) {
            if (gameState.p1.energy < cost) return window.playSplashAnim("⚠️ 暗影能量不足！");
            window.activeRedSkill = type; window.activeRedCost = cost;
            document.getElementById('board-container').classList.add('red-god-mode-active');
            window.playSplashAnim("👿 请点击赛道方格释放神罚");
        };

        window.handleBoardCellClick = function(trackIdx) {
            if (myPlayerId === 'p1' && window.activeRedSkill && gameState.turn === 'p1') {
                let cost = window.activeRedCost;
                if (gameState.p1.energy < cost) return;
                let stateUpdate = {}; let logs = [...gameState.logs]; 
                
                if (window.activeRedSkill === 'hack') {
                    let colors = {...(gameState.customColors || {})}; colors[trackIdx] = (getCellColor(trackIdx) + 1) % 4;
                    stateUpdate.customColors = colors; logs.push(`🎨 上帝消耗 ${cost} 能量，篡改了局部航标颜色！`);
                } else if (window.activeRedSkill === 'mine') {
                    let mines = [...(gameState.mines || [])]; mines.push(trackIdx); stateUpdate.mines = mines; logs.push(`💣 上帝在暗中布下了水雷！`);
                } else if (window.activeRedSkill === 'barricade') {
                    let bar = [...(gameState.barricades || [])]; bar.push(trackIdx); stateUpdate.barricades = bar; logs.push(`🚧 上帝降下了强力路障！`);
                } else if (window.activeRedSkill === 'strike') {
                    let p2P = [...gameState.p2.pieces]; let hit = false;
                    p2P.forEach((p, i) => {
                        if (p === trackIdx) {
                            if (gameState.p2.shield) { logs.push(`🛡 指挥官护盾抵御了降维雷击！`); stateUpdate[`p2.shield`] = false; hit = true; }
                            else { p2P[i] = -1; hit = true; logs.push(`⚡ 轰隆！降维雷击直接摧毁了逃亡战机！`); window.playSplashAnim("⚡ 毁灭打击！"); }
                        }
                    });
                    if (!hit) logs.push(`⚡ 上帝的雷击劈空了！`);
                    stateUpdate[`p2.pieces`] = p2P;
                }
                stateUpdate[`p1.energy`] = gameState.p1.energy - cost;
                stateUpdate.logs = logs; getRoomRef(currentRoomId).update(stateUpdate);
                window.activeRedSkill = null; document.getElementById('board-container').classList.remove('red-god-mode-active');
            } 
        };

        window.endRedTurn = function() {
            if(gameState.turn !== 'p1') return;
            getRoomRef(currentRoomId).update({ turn: 'p2', logs: [...gameState.logs, `👿 上帝结束操作，轮到指挥官发号施令。`] });
        };

        window.handleRollDice = function() {
            if (gameState.turn !== 'p2' || window.isGameAnimating()) return;
            const roll = Math.floor(Math.random() * 6) + 1;
            const pieces = gameState.p2.pieces; let canMove = false;
            const canTakeOff = roll > 0 && (gameState.p2.trait === 'esc_navigator' ? [1,5,6].includes(roll) : [1,6].includes(roll));
            
            pieces.forEach(p => { if (p === -1 && canTakeOff) canMove = true; if (p !== -1 && p !== 999) canMove = true; });

            let logs = [...gameState.logs]; logs.push(`🎲 指挥官掷出了 ${roll} 点。`);
            if (!canMove) {
                logs.push(`⚠ 没有任何战机可移动。回合结束。`);
                endBlueTurn(logs); return;
            }
            
            // 自动寻找最优战机 (共 8 架)
            let targetIdx = -1;
            for(let i=0; i<8; i++) { if(pieces[i] === -1 && canTakeOff) { targetIdx = i; break; } }
            if(targetIdx === -1) {
                let maxDist = -1; 
                for(let i=0; i<8; i++) { 
                    if(pieces[i] >= 0 && pieces[i] <= 43) { 
                        let path = generateLogicalPath(i);
                        let d = path.indexOf(pieces[i]); 
                        if(d > maxDist) { maxDist = d; targetIdx = i; } 
                    } 
                }
            }
            if(targetIdx === -1) return; 
            
            processBlueMove(targetIdx, roll, logs);
        };

        function processBlueMove(idx, roll, logs) {
            let p2 = {...gameState.p2}; let newPos = p2.pieces[idx]; let stateUpdate = {};
            let isTakeOff = false;
            if (newPos === -1) { 
                newPos = (idx < 4) ? 0 : 22; 
                isTakeOff = true; 
                logs.push(`✈ 第${idx+1}架战机成功起飞！`); 
            } else {
                let res = calculateBlueDest(newPos, roll, gameState.barricades, idx); newPos = res.pos;
                if(res.hitBarricade !== -1) { logs.push(`🚧 撞上路障被迫停下！`); stateUpdate.barricades = (gameState.barricades||[]).filter(b=>b!==res.hitBarricade); }
            }
            
            if(!isTakeOff && newPos >= 0 && newPos <= 43 && getCellColor(newPos) === (idx < 4 ? 0 : 2)) {
                let jump = 4;
                let jRes = calculateBlueDest(newPos, jump, stateUpdate.barricades || gameState.barricades, idx); newPos = jRes.pos;
                logs.push(`💨 触发同色跳跃推进！`);
                if(p2.trait === 'esc_thief') { logs.push(`🧲 【能量窃贼】偷取了红方 1 点能量！`); stateUpdate['p1.energy'] = Math.max(0, gameState.p1.energy - 1); }
            }
            
            if(newPos >= 0 && newPos <= 43 && (gameState.mines || []).includes(newPos)) {
                logs.push(`💣 轰隆！踩中隐形水雷，倒退3格！`); 
                let mRes = calculateBlueDest(newPos, -3, [], idx); newPos = mRes.pos; 
                stateUpdate.mines = (gameState.mines||[]).filter(m=>m!==newPos);
            }

            if (itemCellIndices.includes(newPos)) {
                let item = itemPool[Math.floor(Math.random()*itemPool.length)]; p2.items.push(item);
                logs.push(`🎁 搜刮到物资：【${window.getItemName(item)}】！`);
            }

            p2.pieces[idx] = newPos; stateUpdate['p2.pieces'] = p2.pieces; stateUpdate['p2.items'] = p2.items;
            if(newPos === 999) logs.push(`🎉 一架战机成功脱离危险！`);
            
            endBlueTurn(logs, stateUpdate);
        }

        function calculateBlueDest(curr, steps, barricades=[], planeIdx) {
            let path = generateLogicalPath(planeIdx); let idx = path.indexOf(curr);
            let target = curr; let hitBarricade = -1;
            for(let i=0; i<Math.abs(steps); i++) {
                idx += (steps>0?1:-1); if(idx<0) idx=0; if(idx>=path.length) break;
                target = path[idx];
                if(barricades.includes(target) && target>=0 && target<=43) { hitBarricade = target; break; }
            }
            return {pos: target, hitBarricade};
        }

        function endBlueTurn(logs, extraState = {}) {
            let tc = (gameState.turnCount || 0) + 1;
            let engGain = gameState.p1.trait === 'god_energy' ? 4 : 3;
            let nextEng = Math.min(20, (gameState.p1.energy || 0) + engGain);
            
            // 胜利条件判定：4架成功逃脱则蓝方胜利
            let escaped = (extraState['p2.pieces'] || gameState.p2.pieces).filter(p=>p===999).length;
            let stateUpdate = { ...extraState, turn: 'p1', turnCount: tc, 'p1.energy': nextEng, logs: logs };
            
            if (escaped >= 4) { 
                stateUpdate.winner = 'p2'; stateUpdate.status = 'finished'; logs.push(`🏆 蓝方成功护送4架战机，赢下对决！`); 
            }
            // 50个回合硬拖过去则红方胜利
            else if (tc >= 50) { 
                stateUpdate.winner = 'p1'; stateUpdate.status = 'finished'; logs.push(`🏆 50回合耗尽，上帝完全封锁了星区！`); 
            }
            
            getRoomRef(currentRoomId).update(stateUpdate);
        }

        function renderInventory() {
            const container = document.getElementById('itemsContainer'); container.innerHTML = '';
            (gameState.p2.items || []).forEach(item => {
                const btn = document.createElement('button'); btn.className = 'px-2 py-1 bg-blue-500 text-white text-[10px] rounded shadow';
                btn.innerText = window.getItemName(item); btn.onclick = () => useBlueItem(item); container.appendChild(btn);
            });
        }

        window.useBlueItem = function(itemType) {
            if (gameState.turn !== 'p2') return;
            let items = [...gameState.p2.items]; items.splice(items.indexOf(itemType), 1);
            let stateUpdate = { 'p2.items': items }; let logs = [...gameState.logs];
            
            if (itemType === 'missile') {
                logs.push(`🎯 指挥官发射净化导弹，清除了棋盘陷阱！`);
                stateUpdate.mines = []; stateUpdate.barricades = []; 
            } else if (itemType === 'shield') {
                stateUpdate['p2.shield'] = true; logs.push(`🛡 指挥官开启了防空护盾！`);
            } else if (itemType === 'hook') {
                let e = Math.min(2, gameState.p1.energy); stateUpdate['p1.energy'] = gameState.p1.energy - e; logs.push(`🧲 指挥官窃取了上帝 ${e} 点能量！`);
            }
            stateUpdate.logs = logs; getRoomRef(currentRoomId).update(stateUpdate);
        }

        initAuth();
    </script>
</body>
</html>
