<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端防线：激战升级 🌱🛒🧟</title>
    <!-- 腾讯云开发 CloudBase Web SDK -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 40px 40px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            background-color: #4ade80;
            background-image: linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 10% 20%;
            border: 4px solid #166534;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            image-rendering: pixelated;
        }
        .toolbar-btn { transition: transform 0.2s, filter 0.2s; flex-shrink: 0; }
        .toolbar-btn.active { transform: scale(1.1); box-shadow: 0 0 0 3px #f59e0b; }
        .toolbar-btn:disabled { filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-2 sm:px-6">

    <div id="toast" class="fixed top-10 z-[100] bg-sky-900/90 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-bold hidden transition-all"></div>

    <header class="w-full max-w-4xl flex justify-between items-center mb-2 z-10 px-2">
        <div class="flex items-center gap-2 bg-white/90 px-4 py-2 rounded-2xl shadow-sm">
            <span class="text-3xl">🛒</span>
            <div>
                <h1 class="text-xl font-bold text-green-700 leading-tight">云端防线 2.0</h1>
                <p class="text-[10px] text-green-600 font-bold tracking-wider">激战升级版</p>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <div class="bg-white/90 px-3 py-1.5 rounded-full shadow-sm text-xs font-bold text-gray-700">
                身份: <span id="currentRoleDisplay" class="text-green-600">加载中</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-4xl flex flex-col gap-2 relative z-10">
        <!-- 大厅 -->
        <div id="lobbyView" class="w-full max-w-md mx-auto mt-10 flex flex-col gap-4">
            <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl text-center border-4 border-green-100">
                <div class="text-6xl mb-4 animate-bounce">⚔️</div>
                <h2 class="text-2xl font-black text-gray-800 mb-6">联机对战</h2>
                <div class="space-y-4">
                    <button onclick="createRoom()" class="w-full py-4 bg-green-500 text-white rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">🌱 创建防线 (植物方)</button>
                    <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位房间号" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl text-center text-xl font-black tracking-[0.5em]">
                    <button onclick="joinRoom()" class="w-full py-4 bg-purple-600 text-white font-black text-lg rounded-2xl shadow-lg active:scale-95 transition-all">🧟 入侵防线 (僵尸方)</button>
                </div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="gameView" class="w-full flex flex-col gap-2 hidden">
            <!-- 计分与资源板 -->
            <div class="w-full bg-white/95 rounded-2xl p-2 border-2 border-gray-200 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="bg-gray-100 px-3 py-1 rounded-lg">
                        <span class="text-[10px] text-gray-400 font-bold block">航班号</span>
                        <span id="displayRoomCode" class="text-lg font-black text-gray-700">----</span>
                    </div>
                    <div class="flex items-center gap-1 bg-amber-50 px-3 py-1 rounded-lg border border-amber-200">
                        <span class="text-xl">☀️</span>
                        <span id="res-p1" class="text-xl font-black text-amber-500 w-12 text-center">200</span>
                    </div>
                    <div class="flex items-center gap-1 bg-purple-50 px-3 py-1 rounded-lg border border-purple-200">
                        <span class="text-xl">⚡</span>
                        <span id="res-p2" class="text-xl font-black text-purple-600 w-12 text-center">200</span>
                    </div>
                </div>
                <button onclick="exitRoom()" class="px-3 py-2 bg-red-100 text-red-600 font-bold rounded-lg active:scale-95">撤</button>
            </div>

            <!-- 画布 -->
            <div class="relative w-full overflow-hidden flex justify-center bg-gray-900 rounded-xl p-1 shadow-inner">
                <canvas id="gameCanvas" width="1000" height="500" class="w-full max-w-full touch-none rounded-lg"></canvas>
            </div>

            <!-- 操作栏（动态渲染） -->
            <div class="w-full bg-white/95 rounded-2xl p-2 shadow-sm border border-gray-200 overflow-x-auto no-scrollbar flex gap-2" id="toolbar">
                <!-- 植物方工具栏 -->
                <div id="plantsToolbar" class="flex gap-2 hidden">
                    <button class="toolbar-btn bg-yellow-50 p-2 rounded-xl border-2 border-yellow-200 w-20" onclick="selectUnit('sunflower')">
                        <div class="text-3xl">🌻</div><div class="text-[10px] font-bold text-green-700 mt-1">向日葵</div><div class="text-[10px] font-black text-amber-500">☀️ 50</div>
                    </button>
                    <button class="toolbar-btn bg-green-50 p-2 rounded-xl border-2 border-green-200 w-20" onclick="selectUnit('peashooter')">
                        <div class="text-3xl">🟢</div><div class="text-[10px] font-bold text-green-700 mt-1">豌豆</div><div class="text-[10px] font-black text-amber-500">☀️ 100</div>
                    </button>
                    <button class="toolbar-btn bg-cyan-50 p-2 rounded-xl border-2 border-cyan-200 w-20" onclick="selectUnit('snowpea')">
                        <div class="text-3xl">❄️️</div><div class="text-[10px] font-bold text-green-700 mt-1">寒冰</div><div class="text-[10px] font-black text-amber-500">☀️ 150</div>
                    </button>
                    <button class="toolbar-btn bg-orange-50 p-2 rounded-xl border-2 border-orange-200 w-20" onclick="selectUnit('wallnut')">
                        <div class="text-3xl">🥔</div><div class="text-[10px] font-bold text-green-700 mt-1">坚果</div><div class="text-[10px] font-black text-amber-500">☀️ 50</div>
                    </button>
                    <button class="toolbar-btn bg-red-50 p-2 rounded-xl border-2 border-red-200 w-20" onclick="selectUnit('cherry')">
                        <div class="text-3xl">🍒</div><div class="text-[10px] font-bold text-red-700 mt-1">炸弹</div><div class="text-[10px] font-black text-amber-500">☀️ 150</div>
                    </button>
                    <div class="flex items-center text-[10px] font-bold text-green-500 ml-2">提示: 点击第1列购物车可发车清屏</div>
                </div>

                <!-- 僵尸方工具栏 -->
                <div id="zombiesToolbar" class="flex gap-2 hidden">
                    <button class="toolbar-btn bg-gray-50 p-2 rounded-xl border-2 border-gray-200 w-20" onclick="selectUnit('basic')">
                        <div class="text-3xl">🧟</div><div class="text-[10px] font-bold text-gray-700 mt-1">普通</div><div class="text-[10px] font-black text-purple-600">⚡ 50</div>
                    </button>
                    <button class="toolbar-btn bg-blue-50 p-2 rounded-xl border-2 border-blue-200 w-20" onclick="selectUnit('fast')">
                        <div class="text-3xl">🏃</div><div class="text-[10px] font-bold text-gray-700 mt-1">迅捷</div><div class="text-[10px] font-black text-purple-600">⚡ 75</div>
                    </button>
                    <button class="toolbar-btn bg-stone-50 p-2 rounded-xl border-2 border-stone-300 w-20" onclick="selectUnit('cone')">
                        <div class="text-3xl">🪖</div><div class="text-[10px] font-bold text-gray-700 mt-1">铁桶</div><div class="text-[10px] font-black text-purple-600">⚡ 125</div>
                    </button>
                    <button class="toolbar-btn bg-red-50 p-2 rounded-xl border-2 border-red-200 w-20" onclick="selectUnit('football')">
                        <div class="text-3xl">🏈</div><div class="text-[10px] font-bold text-gray-700 mt-1">橄榄球</div><div class="text-[10px] font-black text-purple-600">⚡ 175</div>
                    </button>
                    <button class="toolbar-btn bg-orange-50 p-2 rounded-xl border-2 border-orange-200 w-20" onclick="selectUnit('bomb_zombie')">
                        <div class="text-3xl">🧨</div><div class="text-[10px] font-bold text-gray-700 mt-1">自爆</div><div class="text-[10px] font-black text-purple-600">⚡ 150</div>
                    </button>
                    <div class="flex items-center text-[10px] font-bold text-purple-500 ml-2">提示: 点击最右侧投放，抢夺盲盒！</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // ================= 云端配置 =================
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; // 您的环境ID
        const REGION = "ap-shanghai";
        let app, auth, db;
        let currentUser = null, myPlayerId = null, currentRoomId = null, unsubscribeRoom = null;
        let syncedActionIds = new Set(); // 核心：用于动作去重

        try {
            app = cloudbase.init({ env: ENV_ID, region: REGION });
            auth = app.auth;
            db = app.database();
            auth.signInAnonymously().then(res => { currentUser = res.user || {}; });
        } catch(e) { console.error(e); }

        function getRoomRef(code) { return db.collection("pvzRooms").doc(String(code)); }
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg; el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2500);
        }

        // ================= 房间逻辑 =================
        window.createRoom = async function() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            try {
                await getRoomRef(code).set({ status: 'waiting', p1: 'host', actions: [], winner: null });
                myPlayerId = 'p1';
                listenToRoom(code);
                showToast(`创建成功！房间号：${code}`);
            } catch (e) { showToast("创建失败"); }
        };

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(code.length !== 4) return showToast("输入4位房间号");
            try {
                const res = await getRoomRef(code).get();
                if(!res.data[0]) return showToast("房间不存在");
                await getRoomRef(code).update({ p2: 'guest', status: 'playing' });
                myPlayerId = 'p2';
                listenToRoom(code);
            } catch (e) { showToast("加入失败"); }
        };

        window.exitRoom = function() {
            document.getElementById('lobbyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            if(unsubscribeRoom) unsubscribeRoom();
            gameRunning = false;
        };

        function listenToRoom(code) {
            currentRoomId = code;
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('plantsToolbar').classList.toggle('hidden', myPlayerId !== 'p1');
            document.getElementById('zombiesToolbar').classList.toggle('hidden', myPlayerId !== 'p2');
            
            initGameEngine();

            const watcher = getRoomRef(code).watch({
                onChange: (snapshot) => {
                    const data = snapshot.docs && snapshot.docs[0];
                    if(!data) return exitRoom();
                    document.getElementById('displayRoomCode').innerText = code;
                    
                    if (data.status === 'playing' && !gameRunning) startGameLoop();
                    if (data.status === 'finished') {
                        gameRunning = false;
                        showToast(`🏆 游戏结束！${data.winner === 'p1' ? '植物' : '僵尸'}方获胜！`);
                    }

                    // 接收云端增量指令，通过 Set 过滤掉本地已乐观执行的指令
                    if (data.actions) {
                        data.actions.forEach(action => {
                            if (!syncedActionIds.has(action.id)) {
                                applyActionLocally(action);
                                syncedActionIds.add(action.id);
                            }
                        });
                    }
                },
                onError: e => console.error(e)
            });
            unsubscribeRoom = () => watcher.close();
        }

        // ================= 严格同步机制：先读取，后上传 =================
        async function sendAction(actionObj) {
            actionObj.id = Date.now() + "_" + Math.random().toString(36).substr(2, 5);
            actionObj.by = myPlayerId;
            
            // 1. 乐观更新：本地立即执行（0延迟手感）
            applyActionLocally(actionObj);
            syncedActionIds.add(actionObj.id);
            
            // 2. 严格遵循要求：先读取云端数据，合并后再上传
            try {
                const roomRef = getRoomRef(currentRoomId);
                const res = await roomRef.get();
                const roomData = res.data[0];
                if (roomData) {
                    const currentActions = roomData.actions || [];
                    currentActions.push(actionObj);
                    await roomRef.update({ actions: currentActions });
                }
            } catch (e) {
                console.error("同步失败", e);
            }
        }

        // ================= 本地游戏引擎 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ROWS = 5, COLS = 10, CELL_W = 100, CELL_H = 100;
        
        let gameRunning = false, lastTime = 0, resTimer = 0, boxTimer = 0;
        let state = {};
        let selectedUnit = null;

        const UNIT_DATA = {
            'sunflower': { cost: 50, hp: 100 },
            'peashooter': { cost: 100, hp: 100 },
            'snowpea': { cost: 150, hp: 100 },
            'wallnut': { cost: 50, hp: 600 },
            'cherry': { cost: 150, hp: 9999 }, // 樱桃炸弹无敌，1.5秒后自毁
            
            'basic': { cost: 50, hp: 150, speed: 15, dmg: 20 },
            'fast': { cost: 75, hp: 90, speed: 35, dmg: 20 },
            'cone': { cost: 125, hp: 400, speed: 12, dmg: 25 },
            'football': { cost: 175, hp: 500, speed: 30, dmg: 30 },
            'bomb_zombie': { cost: 150, hp: 120, speed: 20, dmg: 20 }
        };

        function initGameEngine() {
            state = { resP1: 200, resP2: 200, plants: [], zombies: [], projectiles: [], mowers: [], boxes: [] };
            // 初始化大脑与小推车 (第0列)
            for(let r=0; r<ROWS; r++) {
                state.mowers.push({ row: r, active: false, x: 20, y: r*CELL_H + CELL_H/2 });
            }
            syncedActionIds.clear();
            drawGrid();
        }

        window.selectUnit = function(type) {
            selectedUnit = type;
            document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        };

        // 处理点击交互
        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            const col = Math.floor(x / CELL_W), row = Math.floor(y / CELL_H);

            if (row < 0 || row >= ROWS) return;

            // 1. 点击盲盒
            const clickedBox = state.boxes.findIndex(b => Math.abs(b.x - x) < 40 && Math.abs(b.y - y) < 40);
            if (clickedBox > -1) {
                sendAction({ type: 'open_box', boxId: state.boxes[clickedBox].id });
                return;
            }

            // 2. 植物方：触发小推车
            if (myPlayerId === 'p1' && col === 0 && !selectedUnit) {
                if (state.mowers[row] && !state.mowers[row].active) {
                    sendAction({ type: 'trigger_mower', row });
                }
                return;
            }

            // 3. 放置兵种
            if (!selectedUnit) return;

            if (myPlayerId === 'p1') {
                if (col < 1 || col > 8) return; // 植物种在 1-8列
                const cost = UNIT_DATA[selectedUnit].cost;
                if (state.resP1 < cost) return showToast("☀️ 阳光不足");
                if (state.plants.some(p => p.row === row && p.col === col)) return showToast("此处已有植物");
                
                state.resP1 -= cost;
                sendAction({ type: 'spawn_plant', unit: selectedUnit, row, col });
            } else if (myPlayerId === 'p2') {
                if (col !== 9) return showToast("僵尸只能释放在最右侧区域");
                const cost = UNIT_DATA[selectedUnit].cost;
                if (state.resP2 < cost) return showToast("⚡ 能量不足");
                
                state.resP2 -= cost;
                sendAction({ type: 'spawn_zombie', unit: selectedUnit, row, col: 9 });
            }
            
            selectedUnit = null;
            document.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
            updateResUI();
        });

        // 执行本地状态变更
        function applyActionLocally(action) {
            if (action.type === 'spawn_plant') {
                const data = UNIT_DATA[action.unit];
                state.plants.push({
                    id: action.id, type: action.unit, row: action.row, col: action.col,
                    hp: data.hp, maxHp: data.hp, timer: 0,
                    x: action.col * CELL_W + CELL_W/2, y: action.row * CELL_H + CELL_H/2
                });
                if(action.by !== myPlayerId) { state.resP1 -= data.cost; updateResUI(); }
            } 
            else if (action.type === 'spawn_zombie') {
                const data = UNIT_DATA[action.unit];
                state.zombies.push({
                    id: action.id, type: action.unit, row: action.row, 
                    hp: data.hp, maxHp: data.hp, speed: data.speed, damage: data.dmg, 
                    isEating: false, slowTimer: 0,
                    x: COLS * CELL_W - 20, y: action.row * CELL_H + CELL_H/2
                });
                if(action.by !== myPlayerId) { state.resP2 -= data.cost; updateResUI(); }
            }
            else if (action.type === 'trigger_mower') {
                if (state.mowers[action.row]) state.mowers[action.row].active = true;
            }
            else if (action.type === 'spawn_box') {
                state.boxes.push({ id: action.id, x: action.x, y: action.y, row: action.row });
            }
            else if (action.type === 'open_box') {
                const idx = state.boxes.findIndex(b => b.id === action.boxId);
                if (idx > -1) {
                    state.boxes.splice(idx, 1);
                    // 奖励资源
                    if (action.by === 'p1') state.resP1 += 150;
                    else state.resP2 += 150;
                    if (action.by === myPlayerId) showToast("🎁 盲盒开启：获得 150 资源！");
                    updateResUI();
                }
            }
        }

        function updateResUI() {
            document.getElementById('res-p1').innerText = Math.floor(state.resP1);
            document.getElementById('res-p2').innerText = Math.floor(state.resP2);
        }

        function startGameLoop() {
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(update);
        }

        // 核心更新循环
        function update(timestamp) {
            if(!gameRunning) return;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // 1. 基础资源与盲盒生成 (植物方为Host控制随机事件生成)
            resTimer += dt; boxTimer += dt;
            if (resTimer >= 2.0) {
                state.resP1 += 25; state.resP2 += 30; // 僵尸方补偿点回转
                resTimer = 0; updateResUI();
            }
            if (myPlayerId === 'p1' && boxTimer >= 15.0) {
                boxTimer = 0;
                if (Math.random() > 0.3) {
                    const rRow = Math.floor(Math.random() * ROWS);
                    const rCol = Math.floor(Math.random() * 6) + 2; // 掉落在中间
                    sendAction({ type: 'spawn_box', row: rRow, x: rCol*CELL_W + CELL_W/2, y: rRow*CELL_H + CELL_H/2 });
                }
            }

            // 2. 植物特殊逻辑
            for(let i=state.plants.length-1; i>=0; i--) {
                const p = state.plants[i];
                p.timer += dt;
                
                if (p.type === 'sunflower' && p.timer >= 3.0) {
                    p.timer = 0; state.resP1 += 15; updateResUI();
                }
                else if (p.type === 'cherry') {
                    if (p.timer >= 1.5) {
                        // 炸死周围僵尸
                        state.zombies.forEach(z => {
                            if (Math.hypot(z.x - p.x, z.y - p.y) < 180) z.hp -= 1000;
                        });
                        state.plants.splice(i, 1); continue;
                    }
                }
                else if ((p.type === 'peashooter' || p.type === 'snowpea') && p.timer >= 1.5) {
                    const hasZombie = state.zombies.some(z => z.row === p.row && z.x > p.x);
                    if (hasZombie) {
                        p.timer = 0;
                        state.projectiles.push({
                            x: p.x + 20, y: p.y, row: p.row, speed: 350, 
                            damage: 25, isSnow: p.type === 'snowpea'
                        });
                    }
                }
            }

            // 3. 子弹飞行与碰撞
            for (let i = state.projectiles.length - 1; i >= 0; i--) {
                const proj = state.projectiles[i];
                proj.x += proj.speed * dt;
                
                let hitZombie = state.zombies.find(z => z.row === proj.row && Math.abs(z.x - proj.x) < 30);
                if (hitZombie) {
                    hitZombie.hp -= proj.damage;
                    if (proj.isSnow) hitZombie.slowTimer = 3.0; // 减速3秒
                    state.projectiles.splice(i, 1);
                } else if (proj.x > canvas.width) {
                    state.projectiles.splice(i, 1);
                }
            }

            // 4. 小推车逻辑
            state.mowers.forEach(m => {
                if (m.active) {
                    m.x += 400 * dt; // 碾压速度
                    // 碾压该行僵尸
                    state.zombies.forEach(z => {
                        if (z.row === m.row && z.x < m.x + 40 && z.x > m.x - 40) z.hp = -999;
                    });
                }
            });

            // 5. 僵尸逻辑
            for (let i = state.zombies.length - 1; i >= 0; i--) {
                const z = state.zombies[i];
                z.isEating = false;
                
                if (z.slowTimer > 0) z.slowTimer -= dt;
                const currentSpeed = z.slowTimer > 0 ? z.speed * 0.4 : z.speed;

                if (z.hp <= 0) {
                    if (z.type === 'bomb_zombie') { // 自爆僵尸死后炸植物
                        state.plants.forEach(p => { if (Math.hypot(p.x - z.x, p.y - z.y) < 120) p.hp -= 200; });
                    }
                    state.zombies.splice(i, 1);
                    continue;
                }

                let hitPlant = state.plants.find(p => p.row === z.row && Math.abs(p.x - z.x) < 40);
                if (hitPlant) {
                    z.isEating = true;
                    hitPlant.hp -= z.damage * dt;
                } else {
                    z.x -= currentSpeed * dt;
                }

                // 游戏结束判定 (突破底线)
                if (z.x < 10) {
                    getRoomRef(currentRoomId).update({ status: 'finished', winner: 'p2' });
                    gameRunning = false;
                }
            }

            state.plants = state.plants.filter(p => p.hp > 0);

            drawGame();
            if(gameRunning) requestAnimationFrame(update);
        }

        // ================= 渲染层 =================
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景格子
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.15)';
                    ctx.fillRect(c * CELL_W, r * CELL_H, CELL_W, CELL_H);
                    if (c === 0) { // 禁区
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; 
                        ctx.fillRect(c * CELL_W, r * CELL_H, CELL_W, CELL_H);
                        ctx.font = '30px sans-serif'; ctx.fillText('🧠', CELL_W/2, r*CELL_H + CELL_H/2);
                    }
                }
            }

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            // 盲盒
            state.boxes.forEach(b => {
                ctx.font = '40px sans-serif';
                ctx.fillText('🎁', b.x, b.y + Math.sin(performance.now()/200)*5);
            });

            // 小推车
            state.mowers.forEach(m => {
                if(m.x < canvas.width + 100) {
                    ctx.font = '45px sans-serif';
                    ctx.fillText('🛒', m.x, m.y);
                }
            });

            // 植物
            const pIcons = { 'sunflower':'🌻', 'peashooter':'🟢', 'snowpea':'❄️', 'wallnut':'🥔', 'cherry':'🍒' };
            state.plants.forEach(p => {
                ctx.font = p.type === 'cherry' ? `${40 + Math.sin(p.timer*20)*10}px sans-serif` : '45px sans-serif';
                ctx.fillText(pIcons[p.type], p.x, p.y + 5);
                drawHp(p.x, p.y - 30, p.hp, p.maxHp);
            });

            // 子弹
            state.projectiles.forEach(proj => {
                ctx.beginPath(); ctx.arc(proj.x, proj.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = proj.isSnow ? '#38bdf8' : '#84cc16';
                ctx.fill(); ctx.stroke();
            });

            // 僵尸
            const zIcons = { 'basic':'🧟', 'fast':'🏃', 'cone':'🪖', 'football':'🏈', 'bomb_zombie':'🧨' };
            state.zombies.forEach(z => {
                ctx.save(); ctx.translate(z.x, z.y);
                if(z.isEating) ctx.rotate(Math.sin(performance.now()/50)*0.1);
                if(z.slowTimer > 0) ctx.filter = 'sepia(1) hue-rotate(180deg) saturate(3)'; // 冰冻变蓝效果
                ctx.font = '45px sans-serif';
                ctx.fillText(zIcons[z.type], 0, 5);
                ctx.restore();
                drawHp(z.x, z.y - 35, z.hp, z.maxHp);
            });
        }

        function drawHp(x, y, hp, maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x-20, y, 40, 6);
            ctx.fillStyle = hp > maxHp*0.3 ? '#22c55e' : '#ef4444';
            ctx.fillRect(x-20, y, 40 * (hp/maxHp), 6);
        }
    </script>
</body>
