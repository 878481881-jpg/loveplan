<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端飞行棋: 星海逃亡</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'ZCOOL KuaiLe', cursive, sans-serif; background-color: #0f172a; background-image: radial-gradient(#1e293b 2px, transparent 2px); background-size: 40px 40px; overflow-x: hidden; user-select: none; touch-action: manipulation; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes rollDice { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .dice-rolling { animation: rollDice 0.5s ease-out; }
        .plane-active { animation: float 1s infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); z-index: 20; }
        .plane-transition { transition: all 0.3s cubic-bezier(0.34, 1.3, 0.64, 1); transform: translateZ(0); }
        
        /* 战机特化 */
        .plane-bomber { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.9)); border: 2px solid #ef4444 !important; }
        .plane-frigate { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.9)); border: 2px solid #06b6d4 !important; }
        .plane-recon { filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.9)); border: 2px solid #22c55e !important; }

        #board-container { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 8px; margin: 0 auto; }
        #board-grid { display: grid; width: 100%; height: 100%; gap: 2px; }
        .board-cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .board-cell:active { transform: scale(0.9); }

        .cell-color-0 { background-color: #fca5a5; } .cell-color-1 { background-color: #fde047; } .cell-color-2 { background-color: #93c5fd; } .cell-color-3 { background-color: #86efac; }
        .cell-home-red { background-color: #1e1b4b; border: 2px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); } 
        .cell-home-blue { background-color: #e0f2fe; border: 2px dashed #93c5fd; }
        
        .plane { position: absolute; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.3); z-index: 10; }
        .plane-blue { background: linear-gradient(135deg, #3b82f6, #1e3a8a); color: white; border: 1.5px solid #fff; }
        .plane-hologram { background: linear-gradient(135deg, #a855f7, #6b21a8); color: white; border: 1.5px dashed #fff; opacity: 0.8; }
        
        /* 红方基地与蓝方机库 */
        .base-area { position: absolute; width: 24%; height: 24%; border-radius: 12px; padding: 4px; display: grid; gap: 2px; }
        .base-red { top: 2%; left: 2%; background: rgba(30, 27, 75, 0.9); border: 2px solid #ef4444; grid-template-columns: 1fr; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .base-blue { bottom: 2%; right: 2%; background: rgba(224, 242, 254, 0.9); border: 2px solid #3b82f6; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
        .base-spot { width: 100%; height: 100%; border-radius: 4px; background: rgba(0,0,0,0.1); }

        /* 特效与陷阱 */
        @keyframes pulseRed { 0%, 100% { box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2); } 50% { box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.8); background-color: rgba(239, 68, 68, 0.3); } }
        .thunder-zone { animation: pulseRed 1s infinite !important; border: 1px solid #ef4444; }
        .weather-fog { position: absolute; inset: 0; background: rgba(200, 200, 200, 0.5); backdrop-filter: blur(2px); z-index: 25; pointer-events: none; border-radius: 12px; }
        .placing-mode { cursor: crosshair !important; box-shadow: 0 0 20px 5px #a855f7 !important; }
        .boss-pirate { background: #000; border: 2px solid #ef4444; filter: drop-shadow(0 0 10px red); }

        /* 红方暗影面板 */
        #godPanel { background: linear-gradient(180deg, #1e1b4b, #0f172a); border: 2px solid #6366f1; }
        .energy-fill { transition: width 0.3s; background: linear-gradient(90deg, #8b5cf6, #ec4899); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-2 relative text-white pb-32">
    
    <div id="globalLoading" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center">
        <div class="text-6xl animate-bounce mb-4">🚀</div><div class="text-sky-400 font-bold">连接星海网络...</div>
    </div>

    <!-- 顶栏 -->
    <header class="w-full max-w-md flex justify-between items-center mb-4 z-10 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 shadow-lg">
        <div>
            <h1 class="text-lg font-bold text-sky-400 leading-none">星海逃亡</h1>
            <p class="text-[10px] text-gray-400">代码: <span id="displayRoomCode" class="text-white font-bold tracking-widest">----</span></p>
        </div>
        <div class="flex items-center gap-3">
            <div id="roleDisplay" class="text-xs font-bold px-2 py-1 rounded-md bg-slate-700">身份: -</div>
            <button onclick="exitRoom()" class="bg-red-500/20 text-red-400 p-1.5 rounded-lg border border-red-500/50">退出</button>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col gap-4 relative z-10">
        <!-- 大厅 -->
        <div id="lobbyView" class="w-full flex flex-col gap-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700 text-center">
            <div class="text-6xl mb-2">🌌</div>
            <h2 class="text-xl font-bold text-gray-200 mb-4">选择你的阵营</h2>
            <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-red-600 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform">👁️ 创建房间 (红方: 掌控者)</button>
            <div class="text-gray-500 text-sm font-bold">VS</div>
            <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位房间码" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-center text-xl text-sky-400 uppercase tracking-widest">
            <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-transform">🚀 加入逃亡 (蓝方: 远征舰队)</button>
        </div>

        <!-- 游戏面板 -->
        <div id="gameView" class="w-full flex flex-col gap-3 hidden">
            <!-- 状态提示 -->
            <div class="flex justify-between items-center bg-slate-800/80 p-2 rounded-lg border border-slate-700">
                <div id="turnIndicator" class="text-xs font-bold px-3 py-1 rounded-md bg-gray-600 text-white">等待加入...</div>
                <div id="weatherStatus" class="text-xs font-bold text-amber-400 hidden">⚠️ 雷暴肆虐中</div>
            </div>

            <!-- 棋盘 -->
            <div id="board-container">
                <div id="weatherOverlay" class="hidden"></div>
                <div id="board-grid"></div>
                
                <!-- 基地 -->
                <div class="base-area base-red" id="base-p1">
                    <div class="text-sm font-bold text-red-500">敌方主堡</div>
                    <div class="text-2xl font-black text-red-400" id="redHpText">5/5</div>
                </div>
                <div class="base-area base-blue" id="base-p2">
                    <!-- 8个机位动态生成 -->
                </div>
                <!-- 实体层 -->
                <div id="planes-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>

            <!-- 红方：上帝面板 -->
            <div id="godPanel" class="w-full p-3 rounded-xl hidden flex-col gap-2">
                <div class="flex justify-between items-center text-xs font-bold text-purple-300">
                    <span>😈 暗影能量</span>
                    <span id="redEnergyText">0/100</span>
                </div>
                <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden mb-2">
                    <div id="redEnergyFill" class="h-full energy-fill w-0"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[10px] sm:text-xs font-bold">
                    <button onclick="useGodSkill('bridge')" id="btnSkillBridge" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">🌁 断桥篡改 (15)</button>
                    <button onclick="useGodSkill('mine')" id="btnSkillMine" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">💣 隐形水雷 (20)</button>
                    <button onclick="useGodSkill('blindbox')" id="btnSkillBlindbox" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">❓ 恶毒盲盒 (25)</button>
                    <button onclick="useGodSkill('thunder')" id="btnSkillThunder" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">⚡ 极光雷暴 (40)</button>
                    <button onclick="useGodSkill('fog')" id="btnSkillFog" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">🌫 降下大雾 (30)</button>
                    <button onclick="useGodSkill('pirate')" id="btnSkillPirate" class="bg-slate-800 border border-purple-500/50 p-2 rounded hover:bg-slate-700">🏴‍☠️ 海盗追杀 (50)</button>
                </div>
                <button onclick="endRedTurn()" class="w-full py-2 mt-1 bg-purple-700 hover:bg-purple-600 rounded text-sm font-bold shadow">结束灾厄部署</button>
            </div>

            <!-- 蓝方：控制台 -->
            <div id="bluePanel" class="w-full flex gap-3 hidden h-28">
                <div class="w-24 bg-slate-800 rounded-xl border border-slate-700 flex flex-col items-center justify-center p-2">
                    <div id="diceVisual" class="text-4xl mb-2 drop-shadow-md">🎲</div>
                    <button id="btnRollDice" onclick="rollDice()" class="w-full py-1.5 bg-blue-600 rounded text-xs font-bold shadow hover:bg-blue-500 disabled:opacity-50 disabled:grayscale">掷骰子</button>
                </div>
                <div class="flex-1 bg-slate-800/80 rounded-xl border border-slate-700 p-2 flex flex-col relative overflow-hidden">
                    <div class="text-[10px] font-bold text-sky-400 mb-1 border-b border-slate-700 pb-1">🎒 求生背包</div>
                    <div id="itemsContainer" class="flex flex-wrap gap-1.5 overflow-y-auto"></div>
                </div>
            </div>

            <!-- 日志 -->
            <div id="logBox" class="w-full h-24 bg-slate-900 rounded-xl border border-slate-700 p-2 overflow-y-auto text-[10px] text-gray-400 space-y-1"></div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-sky-500 text-white px-4 py-2 rounded-full shadow-lg text-sm font-bold hidden z-[1000] transition-opacity"></div>
    <div id="endModal" class="fixed inset-0 bg-black/80 z-[200] hidden flex flex-col items-center justify-center">
        <div class="bg-slate-800 border-2 border-sky-500 p-6 rounded-2xl text-center">
            <h2 id="endTitle" class="text-3xl font-black text-white mb-4">游戏结束</h2>
            <p id="endDesc" class="text-sky-300 mb-6">...</p>
            <button onclick="location.reload()" class="px-6 py-2 bg-sky-600 rounded-lg font-bold">返回大厅</button>
        </div>
    </div>

    <script type="module">
        // --- 初始化云开发 ---
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; 
        const ROOM_COLLECTION = "starEscapeRooms"; 
        let app, db, auth, currentUser;
        try { 
            app = cloudbase.init({ env: ENV_ID, region: "ap-shanghai" }); 
            auth = app.auth; db = app.database(); 
            auth.signInAnonymously().then(res => { currentUser = res.user; hideLoading(); });
        } catch(e) { console.error(e); hideLoading(); }

        function hideLoading() { document.getElementById('globalLoading').classList.add('hidden'); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }

        // --- 全局变量与常量 ---
        let currentRoomId = null, myRole = null, gameState = null, unsubscribe = null;
        let targetingMode = null; // 红方技能瞄准模式
        let selectingItemMode = null; // 蓝方道具使用模式

        const GRID_SIZE = 14; 
        const trackCoords = [];
        // 环形赛道 44格: 顶边(1-12) -> 右边(12,2-12) -> 底边(11-1,12) -> 左边(1,11-2)
        for(let x=1; x<=12; x++) trackCoords.push({x, y: 1}); 
        for(let y=2; y<=12; y++) trackCoords.push({x: 12, y});
        for(let x=11; x>=1; x--) trackCoords.push({x, y: 12});
        for(let y=11; y>=2; y--) trackCoords.push({x: 1, y});
        
        // 蓝方家到红方家路线（最后5格直捣黄龙）
        const finalCoords = [ {x:2, y:2}, {x:3, y:3}, {x:4, y:4}, {x:5, y:5}, {x:6, y:6} ];
        
        const eventCellIndices = [3, 8, 14, 19, 25, 30, 36, 41];
        const itemCellIndices = [5, 12, 17, 23, 28, 34, 39]; 
        const itemPool = ['stealth', 'hologram', 'bomber', 'frigate', 'recon'];

        // --- 棋盘渲染 ---
        function initBoardGrid() {
            const grid = document.getElementById('board-grid'); grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`; grid.style.gridTemplateRows = `repeat(${GRID_SIZE}, 1fr)`;
            
            // 初始化蓝方基地8个坑位
            const blueBase = document.getElementById('base-p2');
            blueBase.innerHTML = '';
            for(let i=0; i<8; i++) {
                let spot = document.createElement('div'); spot.className = 'base-spot'; spot.id = `spot-p2-${i}`; blueBase.appendChild(spot);
            }

            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    const div = document.createElement('div'); div.id = `cell-${x}-${y}`;
                    let trackIdx = trackCoords.findIndex(c => c.x === x && c.y === y);
                    
                    if (trackIdx !== -1) {
                        div.className = `board-cell cell-color-${trackIdx % 4}`;
                        if(eventCellIndices.includes(trackIdx)) div.innerHTML = '❓';
                        if(itemCellIndices.includes(trackIdx)) div.innerHTML = '🎁';
                        if(trackIdx === 22) div.innerHTML = '<span class="text-[8px] text-blue-800">出发</span>';
                        div.onclick = () => handleCellClick(trackIdx);
                    } else {
                        let finalIdx = finalCoords.findIndex(c => c.x === x && c.y === y);
                        if (finalIdx !== -1) {
                            div.className = 'board-cell bg-red-900/50 border border-red-500/50 text-red-500';
                            div.innerHTML = '☠️';
                        } else {
                            div.className = 'board-cell bg-transparent pointer-events-none';
                        }
                    }
                    grid.appendChild(div);
                }
            }
            initPlanesDOM();
        }

        function initPlanesDOM() {
            const layer = document.getElementById('planes-layer'); layer.innerHTML = '';
            // 8架蓝方飞机
            for(let i=0; i<8; i++) {
                const el = document.createElement('div'); el.id = `plane-blue-${i}`;
                el.className = `plane plane-transition plane-blue`; el.innerText = '✈️';
                el.onclick = () => handlePlaneClick(i);
                layer.appendChild(el);
            }
            // 预留海盗
            const boss = document.createElement('div'); boss.id = 'plane-pirate';
            boss.className = 'plane plane-transition boss-pirate hidden'; boss.innerText = '🏴‍☠️';
            layer.appendChild(boss);
        }

        function getCoordPercent(x, y) { return { px: (x + 0.5) * (100 / GRID_SIZE), py: (y + 0.5) * (100 / GRID_SIZE) }; }

        function getPlanePositionCSS(pos, i, isHolo = false) {
            if (pos === -1 && !isHolo) {
                // 回到蓝方机库
                let baseRect = document.getElementById('board-container').getBoundingClientRect();
                let spot = document.getElementById(`spot-p2-${i}`);
                if(!spot) return {left: '80%', top: '80%'}; // fallback
                let spotRect = spot.getBoundingClientRect();
                return { left: `${((spotRect.left + spotRect.width/2 - baseRect.left) / baseRect.width)*100}%`, top: `${((spotRect.top + spotRect.height/2 - baseRect.top) / baseRect.height)*100}%` };
            }
            let c;
            if (pos >= 0 && pos <= 43) c = trackCoords[pos];
            else if (pos >= 100 && pos <= 104) c = finalCoords[pos - 100];
            else return { left: '10%', top: '10%', display: 'none' }; // 999 阵亡或得分
            
            let { px, py } = getCoordPercent(c.x, c.y);
            return { left: `calc(${px}% - 12px)`, top: `calc(${py}% - 12px)` };
        }

        // --- 房间逻辑 ---
        window.createRoom = async function() {
            if(!currentUser) return showToast("未连接网络");
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const initData = {
                status: 'waiting', turn: 'p1', // 红方先手部署
                redHp: 5, redEnergy: 20, redMines: [], cellOverrides: {},
                weather: { type: 'normal', zone: [], remainingTurns: 0 },
                boss: { pos: Math.floor(Math.random()*44) },
                p2: { pieces: Array(8).fill(-1), roles: Array(8).fill('normal'), stealth: Array(8).fill(0), items: [], holograms: [] },
                logs: ["🔴 掌控者(红方)已建立星海矩阵，等待远征舰队..."]
            };
            await db.collection(ROOM_COLLECTION).doc(code).set(initData);
            myRole = 'p1'; listenToRoom(code);
        };

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(code.length !== 4) return showToast("输入4位代码");
            const res = await db.collection(ROOM_COLLECTION).doc(code).get();
            if(!res.data || res.data.length === 0) return showToast("房间不存在");
            if(res.data[0].status === 'waiting') {
                await db.collection(ROOM_COLLECTION).doc(code).update({ 
                    status: 'playing', 
                    logs: db.command.push(["🔵 远征舰队(蓝方)跃迁进入！演习开始！红方先手部署。"]) 
                });
            }
            myRole = 'p2'; listenToRoom(code);
        };

        function listenToRoom(code) {
            currentRoomId = code;
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            document.getElementById('displayRoomCode').innerText = code;
            document.getElementById('roleDisplay').innerText = myRole === 'p1' ? '🔴 掌控者' : '🔵 逃亡者';
            
            if (myRole === 'p1') { document.getElementById('godPanel').classList.remove('hidden'); } 
            else { document.getElementById('bluePanel').classList.remove('hidden'); }
            
            initBoardGrid();
            unsubscribe = db.collection(ROOM_COLLECTION).doc(code).watch({
                onChange: (snap) => {
                    if (snap.docs.length > 0) { gameState = snap.docs[0]; renderState(); }
                }, onError: err => console.error(err)
            });
        }

        // --- 渲染循环 ---
        function renderState() {
            if(!gameState) return;

            // 1. 顶部状态
            const isMyTurn = (gameState.status === 'playing' && gameState.turn === myRole);
            const ind = document.getElementById('turnIndicator');
            if(gameState.status === 'waiting') { ind.innerText = '等待蓝方加入...'; ind.className = 'text-xs font-bold px-3 py-1 rounded bg-gray-600'; }
            else if (isMyTurn) { ind.innerText = '👉 你的回合'; ind.className = 'text-xs font-bold px-3 py-1 rounded bg-green-500 animate-pulse'; }
            else { ind.innerText = '⏳ 对手回合'; ind.className = 'text-xs font-bold px-3 py-1 rounded bg-gray-600'; }

            // 2. 红方基地 & 面板
            document.getElementById('redHpText').innerText = `${gameState.redHp}/5`;
            if (myRole === 'p1') {
                document.getElementById('redEnergyText').innerText = `${gameState.redEnergy}/100`;
                document.getElementById('redEnergyFill').style.width = `${Math.min(100, gameState.redEnergy)}%`;
                ['Bridge', 'Mine', 'Blindbox', 'Thunder', 'Fog', 'Pirate'].forEach(sk => {
                    document.getElementById(`btnSkill${sk}`).disabled = !isMyTurn;
                    document.getElementById(`btnSkill${sk}`).style.opacity = isMyTurn ? '1' : '0.5';
                });
            }

            // 3. 天气与环境渲染
            document.querySelectorAll('.thunder-zone').forEach(el => el.classList.remove('thunder-zone'));
            document.getElementById('weatherOverlay').className = gameState.weather.type === 'fog' ? 'weather-fog' : 'hidden';
            document.getElementById('weatherStatus').className = gameState.weather.type === 'thunder' ? 'text-xs font-bold text-red-500 animate-pulse' : 'hidden';
            if(gameState.weather.type === 'thunder') {
                gameState.weather.zone.forEach(pos => {
                    const c = trackCoords[pos];
                    if(c) { const el = document.getElementById(`cell-${c.x}-${c.y}`); if(el) el.classList.add('thunder-zone'); }
                });
            }
            
            // 篡改的地形颜色
            for(let i=0; i<44; i++) {
                let c = trackCoords[i]; let el = document.getElementById(`cell-${c.x}-${c.y}`);
                if(el && gameState.cellOverrides[i]) {
                    el.className = `board-cell ${gameState.cellOverrides[i]} shadow-[inset_0_0_10px_rgba(168,85,247,0.8)]`; // 紫色高亮表示被篡改
                } else if (el) {
                    el.className = `board-cell cell-color-${i%4}`;
                }
            }

            // 渲染地雷 (蓝方仅侦察机靠近可见，红方全可见)
            document.querySelectorAll('.mine-prop').forEach(el => el.remove());
            let blueRecons = [];
            gameState.p2.pieces.forEach((p, i) => { if(gameState.p2.roles[i] === 'recon' && p >= 0 && p <= 43) blueRecons.push(p); });
            
            gameState.redMines.forEach(pos => {
                let isVisible = myRole === 'p1';
                if (myRole === 'p2') {
                    // 侦察机前方6格可见
                    blueRecons.forEach(r => { let dist = (pos - r + 44) % 44; if(dist > 0 && dist <= 6) isVisible = true; });
                }
                if (isVisible && trackCoords[pos]) {
                    let cell = document.getElementById(`cell-${trackCoords[pos].x}-${trackCoords[pos].y}`);
                    if(cell) {
                        let m = document.createElement('div'); m.className = 'mine-prop absolute inset-0 flex items-center justify-center text-sm z-[5]'; m.innerText = '💣';
                        cell.appendChild(m);
                    }
                }
            });

            // 4. 蓝方战机 & 诱饵
            gameState.p2.pieces.forEach((pos, i) => {
                let el = document.getElementById(`plane-blue-${i}`);
                if (!el) return;
                
                el.classList.remove('plane-bomber', 'plane-frigate', 'plane-recon');
                if (gameState.p2.roles[i] !== 'normal') el.classList.add(`plane-${gameState.p2.roles[i]}`);
                el.innerText = gameState.p2.roles[i] === 'bomber' ? '🚀' : (gameState.p2.roles[i] === 'frigate' ? '🛸' : (gameState.p2.roles[i] === 'recon' ? '🛩️' : '✈️'));

                let isStealth = gameState.p2.stealth[i] > 0;
                if (isStealth) {
                    if (myRole === 'p1') { el.style.display = 'none'; } 
                    else { el.style.display = 'flex'; el.style.opacity = '0.4'; }
                } else {
                    el.style.display = pos === 999 ? 'none' : 'flex'; el.style.opacity = '1';
                }

                let css = getPlanePositionCSS(pos, i);
                if (css.display !== 'none') { el.style.left = css.left; el.style.top = css.top; }
                
                if (isMyTurn && myRole === 'p2' && !gameState.hasRolled && pos === -1) { el.classList.add('plane-active'); }
                else { el.classList.remove('plane-active'); }
            });

            // 清理旧幻影，渲染新幻影 (对红方显示为真飞机，对蓝方显示为紫色透明)
            document.querySelectorAll('.plane-hologram-temp').forEach(el=>el.remove());
            gameState.p2.holograms.forEach((pos, idx) => {
                let el = document.createElement('div');
                el.className = `plane plane-transition plane-hologram-temp ${myRole === 'p1' ? 'plane-blue' : 'plane-hologram'}`;
                el.innerText = '✈️';
                let css = getPlanePositionCSS(pos, 0, true);
                el.style.left = css.left; el.style.top = css.top;
                document.getElementById('planes-layer').appendChild(el);
            });

            // 海盗
            let bossEl = document.getElementById('plane-pirate');
            if(gameState.boss && gameState.boss.pos >= 0 && gameState.boss.pos <= 43) {
                bossEl.classList.remove('hidden');
                let css = getPlanePositionCSS(gameState.boss.pos, 0, true);
                bossEl.style.left = css.left; bossEl.style.top = css.top;
            } else { bossEl.classList.add('hidden'); }

            // 5. 蓝方道具面板
            if(myRole === 'p2') {
                const dict = { stealth:'👻迷彩', hologram:'🤡诱饵', bomber:'🚀改装轰炸', frigate:'🛸改装护卫', recon:'🛩️改装侦察' };
                const cont = document.getElementById('itemsContainer'); cont.innerHTML = '';
                gameState.p2.items.forEach((item, idx) => {
                    let btn = document.createElement('button');
                    btn.className = 'px-2 py-1 bg-cyan-600 rounded text-[10px] font-bold shadow hover:bg-cyan-500 whitespace-nowrap';
                    btn.innerText = dict[item];
                    btn.onclick = () => useBlueItem(idx, item);
                    if(!isMyTurn || gameState.hasRolled) btn.disabled = true;
                    cont.appendChild(btn);
                });
            }

            // 6. 日志
            const logBox = document.getElementById('logBox'); logBox.innerHTML = '';
            [...gameState.logs].reverse().slice(0, 8).forEach(l => {
                let d = document.createElement('div'); d.innerHTML = l; logBox.appendChild(d);
            });

            checkWinCondition();
        }

        // --- 红方技能逻辑 ---
        window.useGodSkill = function(skill) {
            if (gameState.turn !== 'p1') return;
            const costs = { bridge: 15, mine: 20, blindbox: 25, thunder: 40, fog: 30, pirate: 50 };
            if (gameState.redEnergy < costs[skill]) return showToast("暗影能量不足！");

            if (['bridge', 'mine', 'thunder', 'pirate'].includes(skill)) {
                targetingMode = skill;
                document.getElementById('board-container').classList.add('placing-mode');
                showToast(`👉 请在赛道上点击目标格释放 [${skill}]`);
            } else if (skill === 'blindbox') {
                let randIdx = eventCellIndices[Math.floor(Math.random() * eventCellIndices.length)];
                updateGameState({
                    redEnergy: gameState.redEnergy - costs.blindbox,
                    logs: db.command.push(`❓ 掌控者将赛道区域 ${randIdx} 的盲盒篡改为极度致命！`)
                    // 简化：此处不实际改值，蓝方踩中所有盲盒本身就随机好坏，我们可以强制蓝方下次踩盲盒必出恶性事件
                });
                gameState.forceBadEvent = true; // 附加一个临时状态
                db.collection(ROOM_COLLECTION).doc(currentRoomId).update({ forceBadEvent: true });
                showToast("盲盒已植入恶意程序");
            } else if (skill === 'fog') {
                updateGameState({
                    redEnergy: gameState.redEnergy - costs.fog,
                    'weather.type': 'fog', 'weather.remainingTurns': 1,
                    logs: db.command.push(`🌫️ 掌控者降下大雾！蓝方下回合机动力受限！`)
                });
                showToast("大雾降临");
            }
        };

        window.handleCellClick = function(idx) {
            if (myRole === 'p1' && targetingMode) {
                let cost = 0; let update = {}; let logMsg = "";
                
                if (targetingMode === 'bridge') {
                    cost = 15;
                    let overrides = {...gameState.cellOverrides};
                    // 强行把连续3格改成灰色(不可跳跃)
                    for(let i=0; i<3; i++) { overrides[(idx+i)%44] = 'bg-slate-500'; }
                    update.cellOverrides = overrides;
                    logMsg = `🌁 掌控者摧毁了区域 ${idx} 附近的能量桥！`;
                } else if (targetingMode === 'mine') {
                    cost = 20;
                    update.redMines = db.command.push(idx);
                    logMsg = `💣 掌控者在暗中布下了虚空水雷...`;
                } else if (targetingMode === 'thunder') {
                    cost = 40;
                    let zone = []; for(let i=0; i<6; i++) zone.push((idx+i)%44);
                    update.weather = { type: 'thunder', zone: zone, remainingTurns: 1 };
                    logMsg = `⚡ 掌控者在区域 ${idx} 召唤了极光雷暴！坠毁率激增！`;
                } else if (targetingMode === 'pirate') {
                    cost = 50;
                    update['boss.pos'] = idx; // 简易处理：直接将海盗传送到该处
                    logMsg = `🏴‍☠️ 掌控者发布悬赏，星际海盗直接折跃至区域 ${idx} 展开猎杀！`;
                }

                update.redEnergy = gameState.redEnergy - cost;
                update.logs = db.command.push(logMsg);
                updateGameState(update);
                
                targetingMode = null;
                document.getElementById('board-container').classList.remove('placing-mode');
            } else if (myRole === 'p2' && selectingItemMode === 'hologram') {
                // 蓝方放置全息诱饵
                let items = [...gameState.p2.items];
                items.splice(items.indexOf('hologram'), 1);
                updateGameState({
                    'p2.items': items,
                    'p2.holograms': db.command.push(idx),
                    logs: db.command.push(`🤡 逃亡者在赛道释放了全息幻影！`)
                });
                selectingItemMode = null;
                document.getElementById('board-container').classList.remove('placing-mode');
            }
        };

        window.endRedTurn = function() {
            if(gameState.turn !== 'p1') return;
            updateGameState({
                turn: 'p2', hasRolled: false,
                logs: db.command.push(`🔄 掌控者部署完毕。蓝方逃亡者行动！`)
            });
        };

        // --- 蓝方行动逻辑 ---
        window.useBlueItem = function(idx, item) {
            if(gameState.turn !== 'p2' || gameState.hasRolled) return;
            let items = [...gameState.p2.items];
            
            if (item === 'stealth') {
                items.splice(idx, 1);
                // 选取领头的战机给予隐身
                let pStealth = [...gameState.p2.stealth];
                let maxPos = -2, targetI = -1;
                gameState.p2.pieces.forEach((p, i) => { if(p > maxPos && p <= 43) { maxPos = p; targetI = i; } });
                if(targetI !== -1) { pStealth[targetI] = 3; }
                
                updateGameState({ 'p2.items': items, 'p2.stealth': pStealth, logs: db.command.push(`👻 蓝方启动光学迷彩，领先战机隐形 3 回合！`) });
            } else if (item === 'hologram') {
                selectingItemMode = 'hologram';
                document.getElementById('board-container').classList.add('placing-mode');
                showToast("👉 点击赛道放置全息诱饵");
            } else if (['bomber', 'frigate', 'recon'].includes(item)) {
                selectingItemMode = item;
                showToast(`👉 点击要改装的主力战机`);
            }
        };

        window.handlePlaneClick = function(i) {
            if (myRole === 'p2' && selectingItemMode && ['bomber', 'frigate', 'recon'].includes(selectingItemMode)) {
                let items = [...gameState.p2.items]; items.splice(items.indexOf(selectingItemMode), 1);
                let roles = [...gameState.p2.roles]; roles[i] = selectingItemMode;
                let dict = { bomber:'轰炸机', frigate:'护卫舰', recon:'侦察机' };
                updateGameState({ 'p2.items': items, 'p2.roles': roles, logs: db.command.push(`🔧 战机改装为 [${dict[selectingItemMode]}]！`) });
                selectingItemMode = null; return;
            }

            if(myRole !== 'p2' || gameState.turn !== 'p2' || !gameState.hasRolled) return;
            
            let pos = gameState.p2.pieces[i];
            let dice = gameState.diceValue;
            
            if (pos === -1 && dice % 2 === 0) return showToast("需要单数(1,3,5)起飞"); // 简化起飞条件
            if (pos === 999) return;

            let newPos = pos;
            let logs = [];
            let p2Update = { pieces: [...gameState.p2.pieces], roles: [...gameState.p2.roles], stealth: [...gameState.p2.stealth], holograms: [...gameState.p2.holograms] };
            let redMinesUpdate = [...gameState.redMines];
            let redHpUpdate = gameState.redHp;
            let isAlive = true;

            const killPlane = () => { isAlive = false; p2Update.pieces[i] = -1; p2Update.roles[i] = 'normal'; };

            if (pos === -1) {
                newPos = 22; logs.push(`✈️ 蓝方战机出库！`);
            } else {
                let steps = dice;
                if (gameState.weather.type === 'fog' && p2Update.roles[i] !== 'recon') { steps = 1; logs.push(`🌫️ 视线受阻，仅前行 1 格。`); }
                
                // 逐格移动判定
                for(let s=1; s<=steps; s++) {
                    newPos++;
                    if (newPos === 44) newPos = 0; // 环形
                    if (pos >= 10 && pos < 22 && newPos === 22) { newPos = 100; } // 进入最后冲刺 (21 -> 100)
                    
                    // 检查雷暴
                    if (newPos <= 43 && gameState.weather.type === 'thunder' && gameState.weather.zone.includes(newPos)) {
                        if (p2Update.roles[i] === 'frigate') { logs.push(`🛸 护卫舰立场强行抵御了雷击！`); }
                        else if (Math.random() < 0.5) { logs.push(`⚡ 惨遭极光雷暴击落！`); killPlane(); break; }
                    }
                    
                    // 检查水雷
                    if (newPos <= 43 && redMinesUpdate.includes(newPos)) {
                        redMinesUpdate = redMinesUpdate.filter(m => m !== newPos); // 触发后消失
                        if (p2Update.roles[i] === 'recon') { logs.push(`🛩️ 侦察机安全排除了水雷！`); }
                        else { logs.push(`💣 轰隆！战机触雷坠毁！`); killPlane(); break; }
                    }
                    
                    // 检查海盗
                    if (newPos <= 43 && gameState.boss && gameState.boss.pos === newPos) {
                        if (p2Update.stealth[i] > 0) { logs.push(`👻 隐形绕过了海盗！`); }
                        else { logs.push(`🏴‍☠️️ 被星际海盗劫掠击落！`); killPlane(); break; }
                    }
                }
            }

            if (isAlive) {
                // 终点判定
                if (newPos >= 104) {
                    newPos = 999;
                    let dmg = p2Update.roles[i] === 'bomber' ? 3 : 1;
                    redHpUpdate -= dmg;
                    logs.push(`💥 突破封锁！${p2Update.roles[i] === 'bomber'?'轰炸机重创':'战机攻击'}敌方主堡，造成 ${dmg} 点伤害！`);
                } else if (newPos <= 43) {
                    // 获取道具判定
                    if (itemCellIndices.includes(newPos)) {
                        let itm = itemPool[Math.floor(Math.random()*itemPool.length)];
                        updateGameState({ 'p2.items': db.command.push(itm) });
                        logs.push(`🎁 捡到空投补给箱！`);
                    }
                    // 盲盒判定
                    if (eventCellIndices.includes(newPos) || gameState.forceBadEvent) {
                        if (gameState.forceBadEvent) { logs.push(`⚡ 触发被篡改的恶意盲盒！被闪电劈中坠毁！`); killPlane(); db.collection(ROOM_COLLECTION).doc(currentRoomId).update({ forceBadEvent: db.command.remove() }); }
                        else {
                            if (Math.random() < 0.3) { logs.push(`🌪️ 遭遇气流，退后2格！`); newPos -= 2; if(newPos<0) newPos+=44; }
                            else { logs.push(`🚀 顺风疾驰，前进2格！`); newPos += 2; if(newPos>=44) newPos-=44; }
                        }
                    }
                }
            }

            if (isAlive) p2Update.pieces[i] = newPos;

            // 结算隐形回合
            for(let j=0; j<8; j++) { if(p2Update.stealth[j] > 0) p2Update.stealth[j]--; }
            
            // 结算幻影是否踩雷
            let newHolos = [];
            p2Update.holograms.forEach(h => {
                if (gameState.weather.type === 'thunder' && gameState.weather.zone.includes(h)) {
                    logs.push(`🤡 掌控者的雷暴劈中了全息诱饵！能量反噬！`);
                } else if (redMinesUpdate.includes(h)) {
                    logs.push(`🤡 诱饵踩爆了隐形水雷！`); redMinesUpdate = redMinesUpdate.filter(m => m !== h);
                } else { newHolos.push(h); }
            });
            p2Update.holograms = newHolos;

            updateGameState({
                turn: 'p1', // 交给红方
                redEnergy: Math.min(100, (gameState.redEnergy || 0) + 10), // 红方回复10点
                'weather.type': 'normal', // 蓝方动完，天气复原
                redMines: redMinesUpdate,
                redHp: redHpUpdate,
                p2: p2Update,
                logs: db.command.push(logs)
            });
        };

        window.rollDice = function() {
            if(gameState.turn !== 'p2' || gameState.hasRolled) return;
            let d = Math.floor(Math.random() * 6) + 1;
            
            // 判断是否全灭或无法移动
            let canMove = false;
            gameState.p2.pieces.forEach(p => {
                if (p === -1 && d % 2 === 1) canMove = true;
                if (p !== -1 && p !== 999) canMove = true;
            });
            
            if (!canMove) {
                updateGameState({
                    turn: 'p1', redEnergy: Math.min(100, gameState.redEnergy + 10), 'weather.type': 'normal',
                    logs: db.command.push(`骰子点数 ${d}，暂无战机可出动，回合结束。`)
                });
            } else {
                document.getElementById('diceVisual').classList.remove('dice-rolling');
                void document.getElementById('diceVisual').offsetWidth;
                document.getElementById('diceVisual').classList.add('dice-rolling');
                setTimeout(() => {
                    document.getElementById('diceVisual').innerText = ['❓','⚀','⚁','⚂','⚃','⚄','⚅'][d];
                    updateGameState({ hasRolled: true, diceValue: d, logs: db.command.push(`🎲 蓝方掷出 ${d} 点。`) });
                }, 500);
            }
        };

        function updateGameState(payload) {
            db.collection(ROOM_COLLECTION).doc(currentRoomId).update(payload);
        }

        function checkWinCondition() {
            if (gameState.redHp <= 0) {
                showEndScreen("蓝方胜利！", "远征舰队成功冲破了暗影矩阵，摧毁了掌控者的主堡！");
            } else {
                let allDead = gameState.p2.pieces.every(p => p === -1 || p === 999); // 如果场上全空了（简化判定）
                let hasReached = gameState.p2.pieces.some(p => p === 999);
                if (allDead && !hasReached && gameState.status === 'playing') {
                    // 没有任何飞机到达且全灭
                    showEndScreen("红方胜利！", "掌控者降下的天灾抹杀了所有的逃亡者，星海重归沉寂。");
                }
            }
        }

        function showEndScreen(title, desc) {
            if(gameState.status !== 'finished') updateGameState({status: 'finished'});
            document.getElementById('endTitle').innerText = title;
            document.getElementById('endDesc').innerText = desc;
            document.getElementById('endTitle').className = title.includes("蓝") ? 'text-4xl font-black text-blue-400 mb-4' : 'text-4xl font-black text-red-500 mb-4';
            document.getElementById('endModal').classList.remove('hidden');
        }

        window.exitRoom = () => location.reload();

    </script>
</body>
</html>
