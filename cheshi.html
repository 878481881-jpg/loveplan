<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云端植物大战僵尸 🌻🧟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://static.cloudbase.net">
    <!-- 腾讯云开发 CloudBase Web SDK -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f0fdf4;
            background-image: 
                radial-gradient(#bbf7d0 2px, transparent 2px),
                radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-10px) translateX(5px); }
        }
        .cloud { animation: float 6s ease-in-out infinite; }
        .cloud-delayed { animation: float 7s ease-in-out 2s infinite; }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px) scale(1.05); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-2 sm:px-6 relative">
    <div class="fixed top-10 left-4 text-4xl cloud opacity-40 z-[-1]">🌻</div>
    <div class="fixed top-32 right-8 text-5xl cloud-delayed opacity-40 z-[-1]">🧟</div>
    <div class="fixed bottom-20 left-10 text-3xl cloud opacity-30 z-[-1]">🧠</div>

    <div id="globalLoading" class="fixed inset-0 bg-green-50/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-6xl animate-bounce mb-4">🌱</div>
        <div class="text-green-600 font-bold text-xl flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-green-400 animate-ping"></span>
            连接花园中...
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-50 whitespace-nowrap border border-gray-600"></div>

    <div id="msgModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform text-center" id="msgModalContent">
            <div id="msgIcon" class="text-6xl mb-4 animate-bounce">🏆</div>
            <h3 class="text-2xl font-bold text-green-600 mb-2" id="msgTitle">游戏结束</h3>
            <p class="text-gray-600 mb-6 font-medium" id="msgDesc">恭喜玩家获胜！</p>
            <div class="flex gap-3">
                <button onclick="closeMsgModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 active:scale-95 transition-all">关闭</button>
                <button id="modalActionBtn" onclick="resetGame()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold shadow-md hover:opacity-95 active:scale-95 transition-all">再来一局</button>
            </div>
        </div>
    </div>

    <header class="w-full max-w-md flex justify-between items-center mb-4 z-10 px-2">
        <div class="flex items-center gap-2 bg-white/80 px-4 py-2 rounded-2xl shadow-sm border border-white">
            <span class="text-3xl">🌻</span>
            <div>
                <h1 class="text-xl font-bold text-green-600 leading-tight">云端植物保卫战</h1>
                <p class="text-[10px] text-green-500 font-medium uppercase tracking-wider">Plants VS Zombies</p>
            </div>
        </div>
        <div class="flex flex-col items-end">
            <div class="bg-white/90 px-3 py-1.5 rounded-full border border-green-100 shadow-sm text-xs font-bold text-gray-600 flex items-center gap-1.5">
                身份: <span id="currentRoleDisplay" class="px-2 py-0.5 rounded-full bg-green-500 text-white shadow-inner">加载中</span>
            </div>
            <span id="syncStatusBadge" class="text-[9px] text-gray-400 mt-1 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> 离线
            </span>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 relative z-10">
        
        <div id="lobbyView" class="w-full flex flex-col gap-4 hidden">
            <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 border-2 border-green-100 shadow-xl flex flex-col items-center text-center">
                <div class="w-24 h-24 bg-gradient-to-br from-green-100 to-emerald-100 rounded-full flex items-center justify-center text-5xl mb-4 shadow-inner border-4 border-white">
                    🏡
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">保护大脑！</h2>
                <p class="text-sm text-gray-500 mb-6 px-2">创建房间扮演植物防守，或加入房间扮演僵尸进攻。</p>
                
                <div class="w-full space-y-4">
                    <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2 border-2 border-green-300/50">
                        <span>🌻</span> 创建房间 (植物方)
                    </button>
                    
                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-bold uppercase tracking-wider">OR</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        <input type="text" id="roomCodeInput" maxlength="4" placeholder="输入4位房间号" class="w-full px-4 py-4 bg-white border-2 border-green-100 rounded-2xl text-center text-xl font-black text-purple-700 tracking-[0.5em] focus:outline-none focus:border-purple-400 focus:ring-4 focus:ring-purple-100 uppercase transition-all shadow-inner">
                        <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all border-2 border-purple-400/50">
                            加入突袭 (僵尸方)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameView" class="w-full flex flex-col gap-3 hidden">
            <!-- 顶部信息栏 -->
            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 border-2 border-green-100 shadow-sm flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">房间号</span>
                    <span id="displayRoomCode" class="text-xl font-black text-green-600 tracking-wider">----</span>
                </div>
                
                <div class="flex items-center gap-3 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] text-green-500 font-bold">植物方</span>
                        <span id="p1NameDisplay" class="text-xs font-black text-green-700">等待</span>
                        <span id="p1Energy" class="text-xs font-black text-yellow-500 mt-0.5">☀️ 0</span>
                    </div>
                    <div class="text-gray-300 font-black italic text-sm">VS</div>
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] text-purple-500 font-bold">僵尸方</span>
                        <span id="p2NameDisplay" class="text-xs font-black text-purple-700">等待</span>
                        <span id="p2Energy" class="text-xs font-black text-red-400 mt-0.5">🧠 0</span>
                    </div>
                </div>
                
                <button onclick="exitRoom()" class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors border border-red-100 shadow-sm active:scale-90">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>

            <!-- 回合状态器 -->
            <div id="turnBanner" class="w-full py-2 bg-gray-100 rounded-xl text-center text-sm font-bold text-gray-500 shadow-inner transition-all duration-300">
                等待对手加入...
            </div>

            <!-- 棋盘区域 -->
            <div id="board-container" class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-1 border-2 border-green-200 shadow-sm overflow-x-auto relative">
                <div id="boardOverlay" class="absolute inset-0 z-30 bg-black/5 rounded-2xl hidden cursor-not-allowed"></div>
                <div id="board-grid" class="grid gap-[2px] rounded-xl bg-green-700/50 p-[2px] min-w-[320px]"></div>
            </div>

            <!-- 手牌与控制区 -->
            <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 border border-white shadow-lg">
                <h3 class="text-xs font-bold text-gray-500 mb-2">手牌阵列 (选择后点击棋盘部署)</h3>
                <div id="hand-container" class="flex gap-2 w-full overflow-x-auto justify-center pb-2">
                    <div class="text-xs text-gray-400 py-4">等待对局开始...</div>
                </div>
                <button id="btnEndTurn" onclick="endTurn()" class="w-full py-3 mt-1 bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black rounded-xl shadow-md hover:scale-[1.02] active:scale-95 transition-all text-sm hidden">
                    结束当前回合部署
                </button>
            </div>

            <!-- 日志区 -->
            <div class="w-full bg-gray-50 rounded-xl border border-gray-200 p-2 overflow-hidden h-32 flex flex-col relative">
                <div class="text-[10px] font-bold text-gray-400 mb-1 px-1 border-b border-gray-200 pb-1 flex justify-between">
                    <span>📡 战局通讯日志</span>
                </div>
                <div id="eventLogs" class="flex-1 overflow-y-auto space-y-1.5 no-scrollbar p-1 text-xs font-medium text-gray-600"></div>
            </div>

        </div>
    </main>

    <script type="module">
        const fallbackTimer = setTimeout(() => hideLoading(), 800);

        // ===== 腾讯云开发 CloudBase 配置 =====
        const ENV_ID = "lovegame-d0g3xo4h8d1addad2"; 
        const REGION = "ap-shanghai";             
        const ROOM_COLLECTION = "pvzRooms"; 

        function getRoomRef(code) { return db.collection(ROOM_COLLECTION).doc(String(code)); }
        function pickDoc(snapshot, code) {
            if (!snapshot) return null;
            const docs = snapshot.docs;
            if (Array.isArray(docs)) return docs[0] || null;
            if (docs && typeof docs === 'object') return docs[code] || (docs._id ? docs : null);
            return null;
        }

        let app, auth, db, currentUser = null, hasCloudBase = false;
        try {
            app = cloudbase.init({ env: ENV_ID, region: REGION });
            auth = app.auth;      
            db = app.database();
            hasCloudBase = true;
        } catch(e) { console.error("CloudBase init failed", e); }

        let myIdentity = "玩家" + Math.floor(Math.random()*1000); 
        try {
            const saved = localStorage.getItem('lovePvz_myIdentity');
            if (saved) myIdentity = saved;
        } catch(e) {}
        const myName = myIdentity; 
        document.getElementById('currentRoleDisplay').innerText = myName;

        let currentRoomId = null, unsubscribeRoom = null, gameState = null, myPlayerId = null;
        let selectedCard = null;

        const COLS = 8;
        const ROWS = 5;

        // 单位数据表
        const CARDS = {
            sunflower: { cost: 50, hp: 3, icon: '🌻', name: '向日葵', desc: '产出阳光' },
            peashooter: { cost: 100, hp: 3, icon: '🌱', name: '豌豆', desc: '远程攻击' },
            wallnut: { cost: 50, hp: 10, icon: '🥔', name: '坚果', desc: '高生命值' },
            zombie: { cost: 50, hp: 5, icon: '🧟', name: '普通僵尸', desc: '近战推进' },
            conehead: { cost: 100, hp: 10, icon: '🍦', name: '路障僵尸', desc: '抗伤推进' }
        };

        function initBoardGrid() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            // 左侧加一列特殊的“大脑”区域列
            grid.style.gridTemplateColumns = `40px repeat(${COLS}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

            for (let y = 0; y < ROWS; y++) {
                let brainCell = document.createElement('div');
                brainCell.className = "flex items-center justify-center bg-pink-100 rounded-l-md border-r-2 border-green-700/50";
                brainCell.innerHTML = '<span class="text-2xl animate-pulse">🧠</span>';
                grid.appendChild(brainCell);

                for (let x = 0; x < COLS; x++) {
                    let cell = document.createElement('div');
                    let isDark = (x + y) % 2 === 0;
                    cell.className = `field-cell ${isDark ? 'bg-green-500' : 'bg-green-400'} h-11 sm:h-14 flex items-center justify-center relative cursor-pointer hover:opacity-80 transition-opacity`;
                    if(x === COLS - 1) cell.classList.add('rounded-r-md');
                    
                    cell.onclick = () => window.onCellClick(x, y);
                    cell.id = `cell-${x}-${y}`;
                    grid.appendChild(cell);
                }
            }
        }

        async function initAuth() {
            if (!hasCloudBase) return hideLoading();
            try {
                const res = await auth.signInAnonymously();
                currentUser = (res && res.data && res.data.user) || { uid: 'anonymous' };
                document.getElementById('syncStatusBadge').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_4px_#22c55e]"></span> 在线';
                switchToLobby();
            } catch (err) {
                console.error("Auth Error:", err);
                showToast("网络通信异常，进入离线模式");
                switchToLobby(); 
            } finally {
                clearTimeout(fallbackTimer);
                hideLoading();
            }
        }

        function hideLoading() {
            const el = document.getElementById('globalLoading');
            el.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => el.classList.add('hidden'), 500);
        }

        function switchToLobby() {
            document.getElementById('lobbyView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            if(unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            currentRoomId = null; myPlayerId = null;
        }

        window.createRoom = async function() {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const initialData = {
                status: 'waiting', 
                p1: { name: myName, energy: 150, ready: false },
                p2: { name: null, energy: 150, ready: false },
                turn: 1, 
                entities: [],
                logs: [`${myName} 开辟了花园战局，等待僵尸加入...`],
                winner: null
            };
            try {
                await getRoomRef(code).set(initialData);
                myPlayerId = 'p1';
                listenToRoom(code);
                showToast(`房间 ${code} 创建成功`);
            } catch (e) { showToast("创建房间失败"); }
        };

        window.joinRoom = async function() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!code || code.length !== 4) return showToast("请输入4位房间号");
            try {
                const res = await getRoomRef(code).get();
                const data = res.data && res.data[0];
                if (!data) return showToast("房间不存在");
                if (data.status !== 'waiting' && data.p1.name !== myName && data.p2.name !== myName) return showToast("对战已开始");

                if (data.status === 'waiting' && data.p1.name !== myName) {
                    await getRoomRef(code).update({
                        'p2.name': myName, status: 'playing',
                        logs: [`一大波僵尸正在接近！${myName} 加入对战！`]
                    });
                    myPlayerId = 'p2';
                } else if (data.p1.name === myName) { myPlayerId = 'p1'; }
                else if (data.p2.name === myName) { myPlayerId = 'p2'; }
                listenToRoom(code);
            } catch (e) { showToast("加入房间失败"); }
        };

        window.exitRoom = function() { switchToLobby(); };

        function listenToRoom(code) {
            currentRoomId = code;
            document.getElementById('lobbyView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            initBoardGrid();

            if (unsubscribeRoom) unsubscribeRoom();
            const watcher = getRoomRef(code).watch({
                onChange: (snapshot) => {
                    const data = pickDoc(snapshot, code);
                    if (data) {
                        gameState = data;
                        
                        // 核心：由主机(P1)负责在双方都就绪后，执行回合自动推演计算
                        if (myPlayerId === 'p1' && gameState.status === 'playing' && gameState.p1.ready && gameState.p2.ready) {
                            setTimeout(() => simulateEngineTurn(), 800); 
                        }
                        requestAnimationFrame(renderGameState);
                    } else {
                        showToast("房间已解散"); switchToLobby();
                    }
                },
                onError: (err) => { showToast("同步断开"); }
            });
            unsubscribeRoom = () => watcher.close();
        }

        window.onCellClick = function(x, y) {
            if (gameState.status !== 'playing' || gameState[myPlayerId]?.ready) return;
            if (!selectedCard) return showToast("请先在下方选择要部署的卡牌");
            
            if (gameState.entities.find(e => e.x === x && e.y === y)) return showToast("该位置已被占用！");
            
            let cost = CARDS[selectedCard].cost;
            if (gameState[myPlayerId].energy < cost) return showToast("能量点数不足！");

            if (myPlayerId === 'p1' && x > 3) return showToast("植物只能种在己方前4列！");
            if (myPlayerId === 'p2' && x < 6) return showToast("僵尸只能释放在右侧最后2列！");

            let newEntity = {
                id: Math.random().toString(36).substring(2),
                type: selectedCard, owner: myPlayerId, x, y,
                hp: CARDS[selectedCard].hp, maxHp: CARDS[selectedCard].hp
            };

            let newEnergy = gameState[myPlayerId].energy - cost;
            let newEntities = [...gameState.entities, newEntity];

            // 乐观更新
            gameState[myPlayerId].energy = newEnergy;
            gameState.entities = newEntities;
            selectedCard = null; 
            renderGameState();

            getRoomRef(currentRoomId).update({
                [`${myPlayerId}.energy`]: newEnergy,
                entities: newEntities
            }).catch(console.error);
        };

        window.selectCard = function(type) {
            if (gameState.status !== 'playing' || gameState[myPlayerId]?.ready) return;
            if (CARDS[type].cost > gameState[myPlayerId].energy) return showToast("能量不足");
            selectedCard = type;
            renderHand();
            renderBoard();
        };

        window.endTurn = function() {
            if (gameState.status !== 'playing' || gameState[myPlayerId].ready) return;
            selectedCard = null;
            getRoomRef(currentRoomId).update({ [`${myPlayerId}.ready`]: true }).catch(console.error);
        };

        function simulateEngineTurn() {
            let entities = JSON.parse(JSON.stringify(gameState.entities || []));
            let logs = [...(gameState.logs || [])];
            let p1Energy = gameState.p1.energy;
            let p2Energy = gameState.p2.energy;
            let winner = null;

            // 1. 植物攻击
            entities.filter(e => e.owner === 'p1' && e.type === 'peashooter').forEach(p => {
                let targets = entities.filter(e => e.owner === 'p2' && e.y === p.y && e.x > p.x && e.hp > 0);
                if (targets.length > 0) {
                    targets.sort((a, b) => a.x - b.x); // 打最近的
                    targets[0].hp -= 1;
                }
            });

            // 2. 僵尸行动 (攻击或前移)
            entities.filter(e => e.owner === 'p2' && e.hp > 0).forEach(z => {
                let plant = entities.find(e => e.owner === 'p1' && e.y === z.y && e.x === z.x - 1 && e.hp > 0);
                if (plant) {
                    plant.hp -= 1;
                } else {
                    z.x -= 1;
                    if (z.x < 0) winner = 'p2'; // 突破大脑防线
                }
            });

            // 移除死亡单位
            let deadCount = 0;
            entities = entities.filter(e => {
                if(e.hp <= 0) { deadCount++; return false; }
                return true;
            });

            // 3. 产出阶段
            let sunCount = entities.filter(e => e.owner === 'p1' && e.type === 'sunflower').length;
            p1Energy += 50 + sunCount * 25; 
            p2Energy += 75; 

            logs.push(`⏳ 回合 ${gameState.turn} 结算完毕。`);
            if (deadCount > 0) logs.push(`💥 场上发生了激烈的交战，${deadCount} 个单位倒下。`);

            if (gameState.turn >= 20 && !winner) {
                winner = 'p1';
                logs.push(`🎉 植物成功防守了20回合，保住了大脑！`);
            } else if (winner === 'p2') {
                logs.push(`🧠 防线崩溃，僵尸吃掉了植物方的大脑！`);
            }

            const nextState = {
                'p1.ready': false, 'p2.ready': false,
                'p1.energy': p1Energy, 'p2.energy': p2Energy,
                entities, turn: gameState.turn + 1,
                logs: logs.slice(-15), winner
            };
            getRoomRef(currentRoomId).update(nextState).catch(console.error);
        }

        function renderHand() {
            const hand = document.getElementById('hand-container');
            if (gameState.status !== 'playing') return;
            hand.innerHTML = '';
            
            const myCards = myPlayerId === 'p1' ? ['sunflower', 'peashooter', 'wallnut'] : ['zombie', 'conehead'];
            const eColor = myPlayerId === 'p1' ? 'text-yellow-500' : 'text-red-500';
            const eIcon = myPlayerId === 'p1' ? '☀️' : '🧠';

            myCards.forEach(type => {
                const card = CARDS[type];
                const canAfford = gameState[myPlayerId].energy >= card.cost;
                const isSelected = selectedCard === type;
                
                let div = document.createElement('div');
                div.className = `flex-shrink-0 flex flex-col items-center p-2 rounded-xl border-2 transition-all cursor-pointer w-[72px] 
                    ${isSelected ? (myPlayerId==='p1'?'border-green-400 bg-green-50 scale-105':'border-purple-400 bg-purple-50 scale-105') : 'border-gray-200 bg-white'} 
                    ${!canAfford ? 'opacity-40 grayscale' : 'hover:shadow-md'}`;
                div.onclick = () => canAfford && window.selectCard(type);
                
                div.innerHTML = `
                    <span class="text-3xl mb-1">${card.icon}</span>
                    <span class="text-[10px] font-bold text-gray-700">${card.name}</span>
                    <span class="text-[11px] ${eColor} font-black">${eIcon} ${card.cost}</span>
                `;
                hand.appendChild(div);
            });
        }

        function renderBoard() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    if (!cell) continue;
                    cell.innerHTML = '';
                    cell.className = cell.className.replace(/ring-2 ring-green-400 ring-purple-400 inset-0 z-10/g, '');
                    
                    if (selectedCard && !gameState[myPlayerId]?.ready) {
                        if (myPlayerId === 'p1' && x <= 3) cell.classList.add('ring-2', 'ring-green-400', 'z-10');
                        if (myPlayerId === 'p2' && x >= 6) cell.classList.add('ring-2', 'ring-purple-400', 'z-10');
                    }
                }
            }

            gameState.entities.forEach(e => {
                if (e.x < 0) return; 
                const cell = document.getElementById(`cell-${e.x}-${e.y}`);
                if (!cell) return;
                
                const isPlant = e.owner === 'p1';
                cell.innerHTML = `
                    <div class="relative flex items-center justify-center w-full h-full animate-bounce-slow">
                        <span class="text-3xl drop-shadow-md ${isPlant ? '' : '-scale-x-100 transform'}">${CARDS[e.type].icon}</span>
                        <div class="absolute bottom-0 w-[80%] mx-auto left-0 right-0">
                            <div class="w-full bg-black/40 rounded-full h-1">
                                <div class="bg-${isPlant ? 'green' : 'red'}-400 h-1 rounded-full transition-all duration-300" style="width: ${(e.hp / e.maxHp) * 100}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderGameState() {
            if (!gameState) return;

            document.getElementById('displayRoomCode').innerText = currentRoomId;
            document.getElementById('p1NameDisplay').innerText = gameState.p1.name || '等待中';
            document.getElementById('p2NameDisplay').innerText = gameState.p2.name || '等待中';
            
            document.getElementById('p1Energy').innerText = `☀️ ${gameState.p1.energy}`;
            document.getElementById('p2Energy').innerText = `🧠 ${gameState.p2.energy}`;

            // 回合状态条
            const banner = document.getElementById('turnBanner');
            const overlay = document.getElementById('boardOverlay');
            if (gameState.status === 'playing') {
                let myReady = gameState[myPlayerId]?.ready;
                let oppReady = myPlayerId === 'p1' ? gameState.p2.ready : gameState.p1.ready;
                
                if (myReady && oppReady) {
                    banner.innerText = '⚔️ 正在演练回合交战...';
                    banner.className = 'w-full py-2 bg-yellow-100 text-yellow-600 rounded-xl text-center text-sm font-bold shadow-sm';
                    overlay.classList.remove('hidden');
                } else if (myReady) {
                    banner.innerText = '⏳ 部署完毕，等待对手部署...';
                    banner.className = 'w-full py-2 bg-gray-100 text-gray-500 rounded-xl text-center text-sm font-bold shadow-inner';
                    overlay.classList.remove('hidden');
                } else {
                    banner.innerText = `第 ${gameState.turn} 回合 | 请在棋盘高亮区部署单位！`;
                    banner.className = `w-full py-2 rounded-xl text-center text-sm font-bold shadow-sm ${myPlayerId === 'p1' ? 'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'}`;
                    overlay.classList.add('hidden');
                }

                if (!myReady && myPlayerId) document.getElementById('btnEndTurn').classList.remove('hidden');
                else document.getElementById('btnEndTurn').classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
            }

            renderHand();
            renderBoard();

            // 渲染日志
            const logBox = document.getElementById('eventLogs');
            logBox.innerHTML = '';
            const logsToRender = gameState.logs.slice().reverse().slice(0, 10);
            logsToRender.forEach(log => {
                const div = document.createElement('div');
                div.className = "border-b border-gray-100 pb-1 w-full text-left";
                div.innerText = log;
                logBox.appendChild(div);
            });

            // 结算模态框
            if (gameState.winner) {
                document.getElementById('msgModal').classList.remove('hidden');
                setTimeout(() => document.getElementById('msgModalContent').classList.remove('scale-95'), 10);
                const wName = gameState.winner === 'p1' ? gameState.p1.name : gameState.p2.name;
                document.getElementById('msgTitle').innerText = `${wName} 获胜！`;
                document.getElementById('msgDesc').innerText = gameState.winner === 'p1' ? '成功防守了僵尸的进攻！🌻' : '冲破防线吃掉了大脑！🧠';
            } else {
                document.getElementById('msgModal').classList.add('hidden');
                document.getElementById('msgModalContent').classList.add('scale-95');
            }
        }

        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('toast-animate');
            setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3000);
        };

        window.closeMsgModal = function() {
            document.getElementById('msgModalContent').classList.add('scale-95');
            setTimeout(() => document.getElementById('msgModal').classList.add('hidden'), 200);
        };

        window.resetGame = async function() {
            if (!currentRoomId || !gameState) return;
            await getRoomRef(currentRoomId).update({
                status: 'playing', turn: 1,
                'p1.energy': 150, 'p2.energy': 150,
                'p1.ready': false, 'p2.ready': false,
                entities: [], winner: null,
                logs: [`🔄 双方重新排兵布阵！第 1 回合开始。`]
            });
            closeMsgModal();
        };

        initAuth();
    </script>
</body>
</html>
