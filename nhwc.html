<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心动你画我猜 🎨💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            overflow-x: hidden;
            user-select: none;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-4 px-3 sm:px-6">

    <!-- 全局加载遮罩 -->
    <div id="globalLoading" class="fixed inset-0 bg-white/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-6xl animate-bounce mb-4">💖</div>
        <div class="text-rose-500 font-bold text-lg flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-400 animate-ping"></span>
            正在连接心动频道...
        </div>
    </div>

    <header class="w-full max-w-lg flex justify-between items-center mb-3 animate-float px-2">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🎨</span>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-rose-500 flex items-center gap-1">
                    心动你画我猜 💖
                </h1>
                <p class="text-[11px] text-rose-400 font-medium">专属双人默契大考验</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 bg-white/90 px-3 py-1.5 rounded-full border border-rose-200 shadow-sm text-xs">
            <span class="text-gray-400">我是:</span>
            <span id="currentRoleDisplay" class="px-3 py-1 rounded-full font-bold bg-rose-500 text-white shadow-xs">加载中...</span>
        </div>
    </header>

    <main class="w-full max-w-lg flex flex-col items-center gap-3">
        <!-- 房间与状态看板 -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3.5 border border-rose-100 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div id="drawerAvatar" class="w-9 h-9 rounded-full bg-rose-100 border border-rose-200 flex items-center justify-center text-lg">
                    🐰
                </div>
                <div>
                    <div class="text-xs text-gray-400 font-medium">当前主画人</div>
                    <div id="drawerName" class="text-sm font-bold text-rose-600">哼哼 正在画...</div>
                </div>
            </div>

            <!-- 中间题目与提示 -->
            <div class="text-center px-2 flex-1">
                <div class="text-[11px] text-gray-400">当前词条 (<span id="wordCategory">浪漫情话</span>)</div>
                <div id="wordDisplay" class="text-sm sm:text-base font-black text-rose-500 tracking-wider">
                    🌸 🌸 🌸
                </div>
            </div>

            <!-- 回合/换画按钮 -->
            <div class="flex flex-col items-end gap-1">
                <button id="newRoundBtn" onclick="requestNewRound()" class="px-3 py-1.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold text-xs rounded-full shadow hover:opacity-95 transition-transform active:scale-95 flex items-center gap-1">
                    <span>🎲</span> 换题
                </button>
                <span id="roundCounter" class="text-[10px] text-gray-400">第 1 轮</span>
            </div>
        </div>

        <!-- 画板主区域 -->
        <div class="w-full bg-white rounded-3xl p-3 shadow-md border-2 border-rose-100 relative flex flex-col items-center">
            <!-- 画板顶部提示条 -->
            <div id="canvasRoleBanner" class="w-full mb-2 py-1 px-3 bg-rose-50 rounded-xl text-center text-xs font-bold text-rose-500 flex items-center justify-between">
                <span id="bannerRoleTag">✏️ 轮到你画啦，快画给对方猜吧！</span>
                <span id="strokeCountText" class="text-[10px] text-rose-300 font-normal">笔画: 0</span>
            </div>

            <!-- 核心交互 Canvas -->
            <div class="w-full aspect-[4/3] relative rounded-2xl overflow-hidden border border-rose-100 bg-[#fffdfc] shadow-inner">
                <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

                <!-- 猜中庆祝动画覆盖层 -->
                <div id="celebrationOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm hidden flex flex-col items-center justify-center animate-fade-in z-20">
                    <div class="text-5xl animate-bounce">🎉💖</div>
                    <div class="text-lg font-bold text-rose-600 mt-2" id="winAnnouncement">恭喜！亲亲猜对啦！</div>
                    <div class="text-xs text-gray-500 mt-1" id="winWordText">答案是：海边日落</div>
                </div>
            </div>

            <!-- 绘画工具栏（仅画画者可用，猜题者被禁用） -->
            <div id="drawToolsBar" class="w-full mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-rose-50 pt-2.5">
                <!-- 调色板 -->
                <div class="flex items-center gap-1.5 overflow-x-auto py-1">
                    <button onclick="setColor('#e11d48')" class="w-6 h-6 rounded-full bg-rose-600 border-2 border-white shadow-sm ring-2 ring-rose-400 color-btn" data-color="#e11d48"></button>
                    <button onclick="setColor('#2563eb')" class="w-6 h-6 rounded-full bg-blue-600 border-2 border-white shadow-sm color-btn" data-color="#2563eb"></button>
                    <button onclick="setColor('#16a34a')" class="w-6 h-6 rounded-full bg-green-600 border-2 border-white shadow-sm color-btn" data-color="#16a34a"></button>
                    <button onclick="setColor('#d97706')" class="w-6 h-6 rounded-full bg-amber-600 border-2 border-white shadow-sm color-btn" data-color="#d97706"></button>
                    <button onclick="setColor('#9333ea')" class="w-6 h-6 rounded-full bg-purple-600 border-2 border-white shadow-sm color-btn" data-color="#9333ea"></button>
                    <button onclick="setColor('#1f2937')" class="w-6 h-6 rounded-full bg-gray-800 border-2 border-white shadow-sm color-btn" data-color="#1f2937"></button>
                </div>

                <!-- 粗细与橡皮/清空 -->
                <div class="flex items-center gap-1.5 text-xs">
                    <button onclick="setLineWidth(3)" class="px-2 py-1 rounded-lg bg-rose-50 text-rose-600 font-bold hover:bg-rose-100">细</button>
                    <button onclick="setLineWidth(7)" class="px-2 py-1 rounded-lg bg-rose-50 text-rose-600 font-bold hover:bg-rose-100">中</button>
                    <button onclick="setLineWidth(14)" class="px-2 py-1 rounded-lg bg-rose-50 text-rose-600 font-bold hover:bg-rose-100">粗</button>
                    <button onclick="useEraser()" class="px-2.5 py-1 rounded-lg bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 flex items-center gap-1">
                        <span>🧹</span>橡皮
                    </button>
                    <button onclick="clearCanvasAction()" class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-600 font-bold hover:bg-rose-200">
                        清空
                    </button>
                </div>
            </div>
        </div>

        <!-- 实时聊天与猜词面板 -->
        <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-3.5 border border-rose-100 shadow-sm flex flex-col h-64">
            <div class="flex items-center justify-between pb-2 border-b border-rose-50 mb-2">
                <span class="text-xs font-bold text-gray-600 flex items-center gap-1">
                    <span>💬</span> 默契猜词记录
                </span>
                <span class="text-[10px] text-emerald-500 font-medium flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 实时同步中
                </span>
            </div>

            <!-- 消息瀑布流 -->
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 no-scrollbar pr-1">
                <div class="text-center text-xs text-gray-400 py-4">输入你的猜测，猜中即过关哦！💌</div>
            </div>

            <!-- 猜词输入框 -->
            <form id="guessForm" onsubmit="handleSendGuess(event)" class="mt-2 flex gap-2 pt-2 border-t border-rose-50">
                <input id="guessInput" type="text" maxlength="20" placeholder="猜一猜是什么？按发送猜词..."
                       class="flex-1 px-3.5 py-2 text-sm bg-rose-50/50 border border-rose-200 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 text-gray-700 placeholder-rose-300">
                <button type="submit" class="px-4 py-2 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-sm rounded-xl shadow hover:opacity-95 active:scale-95 transition-transform flex items-center gap-1">
                    <span>发送</span>
                </button>
            </form>
        </div>
    </main>

    <!-- 弹窗 Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-xl text-xs font-medium hidden z-50 whitespace-nowrap"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, arrayUnion 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 获取外部配置或降级模拟
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'draw-guess-love';
        
        // 👇 在这里填入你自己的 Firebase 配置 👇
        let firebaseConfig = {
            apiKey: "AIzaSyCrTNZeBIBSLJjmNXKTwXk9fSm4tsrpzdc",
            authDomain: "love-ce90d.firebaseapp.com",
            projectId: "love-ce90d",
            storageBucket: "love-ce90d.firebasestorage.app",
            messagingSenderId: "494248275277",
            appId: "1:494248275277:web:179bd2755ff64a4a2b5b04",
            measurementId: "G-LSK28Z112V"
        };
        // 👆 -------------------------------- 👆

        if (typeof __firebase_config !== 'undefined') {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) { console.error(e); }
        }

        // 初始化 Firebase
        let app, auth, db;
        let currentUser = null;
        let hasFirebase = false;

        if (firebaseConfig && firebaseConfig.apiKey) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            hasFirebase = true;
        }

        // 读取身份与 GitHub Token
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');

        if (!myIdentity || !GITHUB_TOKEN) {
            // 如果本地没有身份认证信息，则退回首页
            window.location.href = 'index.html'; 
        }

        let myRole = myIdentity; // 设置身份
        document.getElementById('currentRoleDisplay').innerText = myRole + (myRole === '哼哼' ? '🐰' : '🐱');

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_WORDS = 'data/nhwc.json'; 

        // 默认题库（将在成功获取云端题库后被覆盖）
        let WORD_BANK = [
            { word: "奶茶", category: "甜蜜生活", hint: "两个字，香甜可口的饮品" },
            { word: "海边日落", category: "浪漫约定", hint: "四个字，夕阳与浪花" }
        ];

        async function fetchWordsFromGithub() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_WORDS}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.ok) {
                    const result = await response.json();
                    const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                    const data = JSON.parse(contentStr);
                    if (Array.isArray(data) && data.length > 0) {
                        // 支持兼容纯字符串数组或完整的对象数组
                        WORD_BANK = data.map(item => {
                            if (typeof item === 'string') {
                                return { word: item, category: "心动猜词", hint: `提示：${item.length}个字` };
                            }
                            return item;
                        });
                    }
                }
            } catch (error) {
                console.error("Failed to fetch words from github", error);
            }
        }

        let currentGameState = {
            drawer: '哼哼',
            word: '奶茶',
            category: '甜蜜生活',
            hint: '两个字，香甜可口的饮品',
            round: 1,
            completed: false,
            winner: '',
            strokes: [],
            messages: []
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentStroke = null;
        let currentColor = '#e11d48';
        let currentWidth = 4;
        let isEraser = false;

        // 自适应 Canvas 分辨率
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            redrawAllStrokes();
        }

        window.addEventListener('resize', resizeCanvas);

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * 400,
                y: ((clientY - rect.top) / rect.height) * 300
            };
        }

        function startDrawing(e) {
            if (currentGameState.drawer !== myRole || currentGameState.completed) return;
            e.preventDefault();
            isDrawing = true;
            const pt = getCanvasPos(e);
            currentStroke = {
                color: isEraser ? '#fffdfc' : currentColor,
                width: currentWidth,
                points: [pt]
            };
            drawSegment(pt, pt, currentStroke.color, currentStroke.width);
        }

        function drawMove(e) {
            if (!isDrawing || !currentStroke) return;
            e.preventDefault();
            const pt = getCanvasPos(e);
            const prev = currentStroke.points[currentStroke.points.length - 1];
            currentStroke.points.push(pt);
            drawSegment(prev, pt, currentStroke.color, currentStroke.width);
        }

        async function stopDrawing() {
            if (!isDrawing || !currentStroke) return;
            isDrawing = false;
            if (currentStroke.points.length > 1) {
                currentGameState.strokes.push(currentStroke);
                syncStrokesToCloud(currentStroke);
            }
            currentStroke = null;
        }

        function drawSegment(p1, p2, color, width) {
            const rect = canvas.getBoundingClientRect();
            const sx = rect.width / 400;
            const sy = rect.height / 300;

            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.moveTo(p1.x * sx, p1.y * sy);
            ctx.lineTo(p2.x * sx, p2.y * sy);
            ctx.stroke();
        }

        function redrawAllStrokes() {
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            if (!currentGameState.strokes) return;
            for (const s of currentGameState.strokes) {
                for (let i = 1; i < s.points.length; i++) {
                    drawSegment(s.points[i - 1], s.points[i], s.color, s.width);
                }
            }
            document.getElementById('strokeCountText').innerText = `笔画: ${currentGameState.strokes.length}`;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', drawMove);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', drawMove, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        async function initAuthAndData() {
            if (!hasFirebase) {
                renderGameUI();
                showToast("单机演示模式（未注入Firebase配置）");
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;

                // 统一存放在 /artifacts/{appId}/public/data/gameRoom/main
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameRoom', 'main');
                const snap = await getDoc(roomRef);

                if (!snap.exists()) {
                    const initWord = WORD_BANK[0];
                    const initData = {
                        drawer: '哼哼',
                        word: initWord.word,
                        category: initWord.category,
                        hint: initWord.hint,
                        round: 1,
                        completed: false,
                        winner: '',
                        hintStatus: 'none',
                        strokes: [],
                        messages: [{ sender: '系统', text: '游戏已创建，快叫上TA一起来画吧！💖', time: Date.now() }]
                    };
                    await setDoc(roomRef, initData);
                }

                // 监听实时更新
                onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        handleRemoteUpdate(data);
                    }
                }, (err) => {
                    console.error("Firebase Snapshot Error:", err);
                    showToast("同步出错啦，请检查网络！");
                });

            } catch (err) {
                console.error("Auth / Load Error:", err);
                showToast("连接联机云端服务失败");
            }
        }

        async function syncStrokesToCloud(newStroke) {
            if (!hasFirebase || !currentUser) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameRoom', 'main');
                await updateDoc(roomRef, {
                    strokes: arrayUnion(newStroke)
                });
            } catch (e) {
                console.error("Failed to sync stroke:", e);
            }
        }

        async function syncGameStateToCloud(diff) {
            if (!hasFirebase || !currentUser) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'gameRoom', 'main');
                await updateDoc(roomRef, diff);
            } catch (e) {
                console.error("Failed to update gameState:", e);
            }
        }

        function handleRemoteUpdate(data) {
            const hadDifferentStrokes = JSON.stringify(data.strokes) !== JSON.stringify(currentGameState.strokes);
            currentGameState = data;
            renderGameUI();
            if (hadDifferentStrokes) {
                redrawAllStrokes();
            }
            renderMessages();
        }

        function renderGameUI() {
            const isMeDrawing = currentGameState.drawer === myRole;

            // 头像与信息更新
            document.getElementById('drawerAvatar').innerText = currentGameState.drawer === '哼哼' ? '🐰' : '🐱';
            document.getElementById('drawerName').innerText = `${currentGameState.drawer} ${isMeDrawing ? '(你)' : ''} 正在作画`;
            document.getElementById('wordCategory').innerText = currentGameState.category || '生活情调';
            document.getElementById('roundCounter').innerText = `第 ${currentGameState.round || 1} 轮`;

            // 词条隐藏/显示
            const wordDisplay = document.getElementById('wordDisplay');
            if (isMeDrawing) {
                wordDisplay.innerText = `✏️ 题目: ${currentGameState.word}`;
                wordDisplay.className = "text-sm sm:text-base font-black text-rose-600 tracking-wide";
            } else {
                if (currentGameState.completed) {
                    wordDisplay.innerText = `🎉 答案: ${currentGameState.word}`;
                    wordDisplay.className = "text-sm sm:text-base font-black text-emerald-600 tracking-wide";
                } else {
                    const masked = currentGameState.word.split('').map(() => '🌸').join(' ');
                    wordDisplay.innerText = `${masked} (${currentGameState.word.length}个字)`;
                    wordDisplay.className = "text-sm sm:text-base font-black text-rose-400 tracking-wider";
                }
            }

            // 顶部条及工具栏可用状态
            const toolsBar = document.getElementById('drawToolsBar');
            const bannerRoleTag = document.getElementById('bannerRoleTag');
            const hStatus = currentGameState.hintStatus || 'none';

            if (isMeDrawing) {
                let hintHtml = `✏️ 轮到你画啦！提示：${currentGameState.hint}`;
                if (hStatus === 'pending') {
                    hintHtml = `✏️ 轮到你画啦！提示：${currentGameState.hint} <button onclick="approveHint()" class="ml-2 px-2 py-0.5 bg-rose-500 text-white rounded text-[10px] animate-pulse shadow-sm active:scale-95 transition-transform">同意对方看提示</button>`;
                } else if (hStatus === 'approved') {
                    hintHtml = `✏️ 轮到你画啦！提示：${currentGameState.hint} <span class="ml-2 text-[10px] text-emerald-500 font-bold">(已给提示)</span>`;
                }
                bannerRoleTag.innerHTML = hintHtml;
                toolsBar.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                let guessHtml = `👀 认真观察对方画作，快速猜词吧！`;
                if (hStatus === 'approved') {
                    guessHtml = `💡 提示：${currentGameState.hint}`;
                } else if (hStatus === 'pending') {
                    guessHtml += ` <span class="ml-2 text-rose-400 text-[10px] animate-pulse">等待对方同意提示...</span>`;
                } else {
                    guessHtml += ` <button onclick="requestHintAction()" class="ml-2 px-2.5 py-0.5 bg-rose-100 text-rose-500 font-bold rounded-md border border-rose-200 hover:bg-rose-200 active:scale-95 transition-transform">求提示🥺</button>`;
                }
                bannerRoleTag.innerHTML = guessHtml;
                toolsBar.classList.add('opacity-40', 'pointer-events-none');
            }

            // 完成动画展示
            const overlay = document.getElementById('celebrationOverlay');
            if (currentGameState.completed) {
                document.getElementById('winAnnouncement').innerText = `🎉 恭喜！${currentGameState.winner} 猜对啦！`;
                document.getElementById('winWordText').innerText = `正确答案是：${currentGameState.word}`;
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function renderMessages() {
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';
            if (!currentGameState.messages || currentGameState.messages.length === 0) {
                box.innerHTML = `<div class="text-center text-xs text-gray-400 py-4">还未有猜词记录，开始你的第一次尝试吧！💖</div>`;
                return;
            }

            currentGameState.messages.forEach(msg => {
                const isSys = msg.sender === '系统';
                const isCorrect = msg.isCorrect;
                const isMe = msg.sender === myRole;

                const div = document.createElement('div');
                div.className = `flex flex-col ${isSys ? 'items-center my-1' : isMe ? 'items-end' : 'items-start'}`;

                if (isSys) {
                    div.innerHTML = `<span class="px-3 py-1 bg-rose-50 text-rose-500 rounded-full text-[11px] font-medium border border-rose-100">${msg.text}</span>`;
                } else if (isCorrect) {
                    div.innerHTML = `
                        <div class="bg-gradient-to-r from-emerald-400 to-teal-400 text-white px-3 py-1.5 rounded-2xl text-xs font-bold shadow-sm flex items-center gap-1">
                            <span>✨ ${msg.sender} 猜中了答案【${msg.text}】！默契值爆棚！</span>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="flex items-center gap-1 mb-0.5">
                            <span class="text-[10px] text-gray-400">${msg.sender}</span>
                        </div>
                        <div class="px-3 py-1.5 rounded-2xl text-xs font-medium ${isMe ? 'bg-rose-500 text-white' : 'bg-gray-100 text-gray-700'} max-w-[80%] break-words">
                            ${msg.text}
                        </div>
                    `;
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        window.handleSendGuess = async function(e) {
            e.preventDefault();
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();
            if (!guess) return;
            input.value = '';

            const isCorrect = guess.toLowerCase() === currentGameState.word.toLowerCase();
            const newMsg = {
                sender: myRole,
                text: guess,
                isCorrect: isCorrect,
                time: Date.now()
            };

            const updatedMessages = [...(currentGameState.messages || []), newMsg];
            const updates = { messages: updatedMessages };

            if (isCorrect && !currentGameState.completed) {
                updates.completed = true;
                updates.winner = myRole;
                updates.messages.push({
                    sender: '系统',
                    text: `🎊 恭喜！${myRole} 破解了心动暗号！即将互换身份开启下一题...`,
                    time: Date.now()
                });
            }

            currentGameState.messages = updates.messages;
            let justWon = false;
            if (updates.completed) {
                currentGameState.completed = true;
                currentGameState.winner = myRole;
                justWon = true;
            }
            renderGameUI();
            renderMessages();

            await syncGameStateToCloud(updates);

            // 如果本条猜测直接触发了胜利，则3秒后自动轮换到下一题，并互换画画身份
            if (justWon) {
                setTimeout(() => {
                    triggerNextRound(true);
                }, 3000);
            }
        };

        window.triggerNextRound = async function(swapDrawer = false) {
            // 如果 swapDrawer 为真，互换角色；否则保持原画师
            const nextDrawer = swapDrawer ? (currentGameState.drawer === '哼哼' ? '亲亲' : '哼哼') : currentGameState.drawer;
            // 随机抽取新词汇
            const pool = WORD_BANK.filter(w => w.word !== currentGameState.word);
            const nextWordObj = pool[Math.floor(Math.random() * pool.length)] || WORD_BANK[0];

            const nextData = {
                drawer: nextDrawer,
                word: nextWordObj.word,
                category: nextWordObj.category,
                hint: nextWordObj.hint,
                round: (currentGameState.round || 1) + 1,
                completed: false,
                winner: '',
                hintStatus: 'none',
                strokes: [],
                messages: [
                    ...(currentGameState.messages || []).slice(-15),
                    { sender: '系统', text: swapDrawer ? `🎊 答对啦！第 ${(currentGameState.round || 1) + 1} 轮开始，由 ${nextDrawer} 接棒画画 🎨` : `第 ${(currentGameState.round || 1) + 1} 轮开始！更换了新题目 🎨`, time: Date.now() }
                ]
            };

            currentGameState = nextData;
            renderGameUI();
            redrawAllStrokes();
            renderMessages();

            await syncGameStateToCloud(nextData);
            showToast(swapDrawer ? `恭喜答对！轮到 ${nextDrawer} 画画啦` : `已为您换题！`);
        };

        window.requestNewRound = function() {
            if (currentGameState.drawer !== myRole) {
                showToast("只有当前主画人可以换题哦！");
                return;
            }
            // 仅换题，不换人
            triggerNextRound(false);
        };

        window.requestHintAction = async function() {
            const hStatus = currentGameState.hintStatus || 'none';
            if (hStatus !== 'none') return;
            
            const updates = { 
                hintStatus: 'pending',
                messages: [
                    ...(currentGameState.messages || []),
                    { sender: '系统', text: `🥺 【${myRole}】遇到困难，向对方发起了提示申请！`, time: Date.now() }
                ]
            };
            currentGameState.hintStatus = 'pending';
            currentGameState.messages = updates.messages;
            renderGameUI();
            renderMessages();
            await syncGameStateToCloud(updates);
            showToast("已发送提示申请，等待同意~");
        };

        window.approveHint = async function() {
            const hStatus = currentGameState.hintStatus || 'none';
            if (hStatus !== 'pending') return;
            
            const updates = { 
                hintStatus: 'approved',
                messages: [
                    ...(currentGameState.messages || []),
                    { sender: '系统', text: `✨ 【${myRole}】心软啦，同意了提示申请！猜词方可以看提示了！`, time: Date.now() }
                ]
            };
            currentGameState.hintStatus = 'approved';
            currentGameState.messages = updates.messages;
            renderGameUI();
            renderMessages();
            await syncGameStateToCloud(updates);
            showToast("已给出提示！");
        };

        window.selectIdentity = function(role) {
            myRole = role;
            const btnH = document.getElementById('roleBtnH');
            const btnQ = document.getElementById('roleBtnQ');

            if (role === '哼哼') {
                btnH.className = "px-2.5 py-1 rounded-full font-bold transition-all bg-rose-500 text-white shadow-xs";
                btnQ.className = "px-2.5 py-1 rounded-full font-bold transition-all text-rose-500 hover:bg-rose-50";
            } else {
                btnQ.className = "px-2.5 py-1 rounded-full font-bold transition-all bg-rose-500 text-white shadow-xs";
                btnH.className = "px-2.5 py-1 rounded-full font-bold transition-all text-rose-500 hover:bg-rose-50";
            }
            renderGameUI();
            showToast(`已切换身份为：${role}`);
        };

        window.setColor = function(hex) {
            isEraser = false;
            currentColor = hex;
            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.getAttribute('data-color') === hex) {
                    btn.classList.add('ring-2', 'ring-rose-400');
                } else {
                    btn.classList.remove('ring-2', 'ring-rose-400');
                }
            });
        };

        window.setLineWidth = function(w) {
            currentWidth = w;
        };

        window.useEraser = function() {
            isEraser = true;
            showToast("已切换为橡皮擦");
        };

        window.clearCanvasAction = async function() {
            if (currentGameState.drawer !== myRole) {
                showToast("只有当前画画的人可以清空画板哦");
                return;
            }
            currentGameState.strokes = [];
            redrawAllStrokes();
            await syncGameStateToCloud({ strokes: [] });
            showToast("画板已清空");
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('toast-animate');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-animate');
            }, 3000);
        }

        // 初始化
        window.addEventListener('load', async () => {
            resizeCanvas();
            // 先拉取云端题库，再初始化游戏数据
            await fetchWordsFromGithub();
            await initAuthAndData();
            
            // 数据初始化完成后隐藏全局加载遮罩
            const loadingOverlay = document.getElementById('globalLoading');
            if(loadingOverlay) {
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loadingOverlay.classList.add('hidden'), 500);
            }
        });
    </script>
</body>
</html>
