<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能建设中 🚧💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        /* 统一的上下悬浮动画 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        /* 图标呼吸发光动画 */
        @keyframes glowPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(251, 113, 133, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(251, 113, 133, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(251, 113, 133, 0.4)); }
        }
        .animate-glow-pulse { animation: glowPulse 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4">
    
    <header class="text-center mb-8 animate-float">
        <h1 class="text-3xl md:text-4xl font-bold text-rose-500 mb-2 drop-shadow-sm">
            💌 我们的心动盲盒
        </h1>
        <p class="text-rose-400 text-sm md:text-base">
            记录属于我们的心动瞬间
        </p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <div class="w-full bg-white/90 backdrop-blur-sm rounded-3xl p-8 shadow-xl border-2 border-rose-100 flex flex-col items-center text-center transform hover:-translate-y-1 transition-transform duration-300">
            
            <!-- 施工图标 -->
            <div class="text-6xl mb-6 animate-glow-pulse select-none">
                🚧🧸
            </div>
            
            <h2 class="text-2xl font-bold text-rose-500 mb-3">
                新功能建设中...
            </h2>
            
            <p class="text-gray-500 text-sm mb-2 leading-relaxed">
                正在为你努力熬夜增加功能呢！
            </p>
            <p class="text-rose-400 text-sm font-medium mb-8 bg-rose-50 px-4 py-2 rounded-xl inline-block border border-rose-100">
                ✨ 更多心动功能即将上线，敬请期待 ✨
            </p>
            
            <div class="w-full flex flex-col gap-3">
                <a href="index.html" class="w-full py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-center flex justify-center items-center gap-2">
                    <span>🏠</span> 返回首页
                </a>
                
                <button onclick="history.back()" class="w-full py-3 bg-white text-rose-400 border border-rose-200 font-medium rounded-full shadow-sm hover:bg-rose-50 transition-all text-center text-sm">
                    返回上一页
                </button>
            </div>
            
        </div>
        
    </main>

</body>
</html>
