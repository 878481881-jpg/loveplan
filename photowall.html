<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的时光墙 🖼️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f472b6; }

        .photo-card { break-inside: avoid; margin-bottom: 1rem; }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-6 px-4">
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 transition-transform hover:scale-110">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-500 flex items-center justify-center gap-2">
               <span>📸</span> 我们的时光墙 <span>✨</span>
            </h1>
        </div>
        <div class="w-9 h-9"></div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 顶层主选项卡 -->
        <div class="flex space-x-4 mb-4 w-full justify-center bg-white p-1 rounded-full shadow-sm border border-rose-100">
            <button id="tabWallBtn" onclick="switchMainTab('wall')" class="flex-1 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm">照片墙</button>
            <button id="tabUploadBtn" onclick="switchMainTab('upload')" class="flex-1 py-2 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50">发布动态</button>
        </div>

        <!-- 视图 1：照片墙 -->
        <div id="wallView" class="w-full flex flex-col items-center transition-opacity duration-300">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-sm border-2 border-rose-100 flex flex-col h-[65vh] min-h-[450px]">
                
                <!-- 墙内子选项卡 (对象分类) -->
                <div class="flex justify-between items-center mb-3">
                    <div class="flex bg-rose-50 rounded-lg p-1 space-x-1 overflow-x-auto custom-scrollbar" id="categoryTabs">
                        <button onclick="switchCategory('全部')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md bg-white text-rose-500 shadow-sm transition-all whitespace-nowrap" data-cat="全部">全部</button>
                        <button onclick="switchCategory('我们')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-rose-400 transition-all whitespace-nowrap" data-cat="我们">我们</button>
                        <button onclick="switchCategory('亲亲')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-rose-400 transition-all whitespace-nowrap" data-cat="亲亲">亲亲</button>
                        <button onclick="switchCategory('哼哼')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-rose-400 transition-all whitespace-nowrap" data-cat="哼哼">哼哼</button>
                    </div>
                    
                    <!-- 排序方式 -->
                    <select id="sortSelect" onchange="renderPhotos()" class="ml-2 text-xs bg-white border border-rose-200 text-rose-500 rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-400 shadow-sm shrink-0">
                        <option value="time">按发布顺序</option>
                        <option value="level">按照片等级</option>
                    </select>
                </div>

                <!-- 瀑布流容器 -->
                <div id="photoGrid" class="flex-1 overflow-y-auto custom-scrollbar pr-1 columns-2 gap-4 space-y-4 pb-4">
                    <!-- JS动态渲染 -->
                </div>
            </div>
        </div>

        <!-- 视图 2：发布动态 -->
        <div id="uploadView" class="w-full flex flex-col items-center hidden transition-opacity duration-300">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-sm border-2 border-rose-100">
                
                <!-- 媒体选择区 -->
                <div id="uploadArea" class="w-full h-40 border-2 border-dashed border-rose-300 rounded-xl bg-rose-50 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-100 transition-colors mb-4 relative overflow-hidden" onclick="document.getElementById('mediaInput').click()">
                    
                    <!-- 默认占位符 -->
                    <div id="uploadPlaceholder" class="flex flex-col items-center pointer-events-none z-10">
                        <span class="text-4xl mb-2">📥</span>
                        <span class="text-sm font-bold text-rose-400">点击选择图片或视频</span>
                    </div>

                    <!-- 视频压缩中UI遮罩 -->
                    <div id="compressingUI" class="hidden absolute inset-0 bg-rose-50/95 z-40 flex flex-col items-center justify-center backdrop-blur-sm cursor-wait">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-rose-500 mb-2"></div>
                        <span class="text-xs font-bold text-rose-600">正在开启降质压缩...</span>
                        <span class="text-[10px] text-rose-400 mt-1 scale-90">需要后台播放一遍，请勿离开</span>
                        <span id="compressProgress" class="text-sm font-mono mt-1 text-rose-600 font-bold">0%</span>
                    </div>

                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover z-20">
                    <video id="videoPreview" class="hidden absolute inset-0 w-full h-full object-cover z-20 bg-black" controls></video>
                    
                    <button id="clearMediaBtn" onclick="clearMedia(event)" class="hidden absolute top-2 right-2 bg-white/90 text-rose-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold z-30 hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">×</button>
                </div>
                <input type="file" id="mediaInput" accept="image/*,video/*" class="hidden" onchange="handleMediaSelect(event)">

                <!-- 信息表单 -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600">发布人</span>
                        <span id="uploaderName" class="text-sm text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full"></span>
                    </div>
                    
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600">画面主角</span>
                        <select id="formSubject" class="text-sm bg-rose-50 border border-rose-200 text-rose-500 rounded-lg px-3 py-1 focus:outline-none focus:border-rose-400">
                            <option value="我们">我们 👩‍❤️‍👨</option>
                            <option value="亲亲">亲亲 👧</option>
                            <option value="哼哼">哼哼 👦</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600">精彩等级 (0-100)</span>
                        <div class="flex items-center gap-2">
                            <input type="range" id="formLevelRange" min="1" max="100" value="100" class="w-24 accent-rose-400" oninput="document.getElementById('formLevelNum').value = this.value">
                            <input type="number" id="formLevelNum" min="1" max="100" value="100" class="text-sm w-12 text-center bg-rose-50 border border-rose-200 text-rose-500 rounded-lg py-1 focus:outline-none focus:border-rose-400" oninput="document.getElementById('formLevelRange').value = this.value">
                        </div>
                    </div>
                </div>

                <!-- 网络上传进度条 UI -->
                <div id="progressContainer" class="hidden w-full mt-4">
                    <div class="flex justify-between text-xs text-rose-500 mb-1 font-bold">
                        <span>🚀 正在上传至时光机...</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-rose-100 rounded-full h-2.5 shadow-inner overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2.5 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button onclick="submitMedia()" id="submitBtn" class="mt-6 w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
                    发布动态 🚀
                </button>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <span class="text-gray-400 text-xs">当前身份: <span id="currentIdentityLabel" class="text-rose-400 font-bold">-</span></span>
        </div>
    </main>

    <!-- 图片大图查看器 -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-2 transition-opacity opacity-0" onclick="closeImageViewer()">
        <button class="absolute top-4 right-4 text-white hover:text-rose-400 text-3xl font-bold z-50 bg-black/30 rounded-full w-10 h-10 flex items-center justify-center" onclick="closeImageViewer()">&times;</button>
        <img id="fullSizeImage" src="" class="max-w-full max-h-full object-contain rounded-md transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity') || '游客';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        document.getElementById('uploaderName').innerText = myIdentity;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_PHOTOS = 'data/Photos.json'; 
        
        let photosData = { photos: [] };
        let photosSha = null;
        let pollInterval = null;

        let currentCategory = '全部'; 
        let currentMediaBase64 = null;
        let currentMediaExt = 'jpg';
        let currentMediaType = 'image'; 

        window.onload = async function() {
            if (!GITHUB_TOKEN) { showToast("未检测到Token，仅支持预览"); }
            await fetchPhotosData();
            renderPhotos();
            startPolling();
        };

        function switchMainTab(tab) {
            const wallView = document.getElementById('wallView');
            const uploadView = document.getElementById('uploadView');
            const btnWall = document.getElementById('tabWallBtn');
            const btnUpload = document.getElementById('tabUploadBtn');

            if (tab === 'wall') {
                wallView.classList.remove('hidden'); uploadView.classList.add('hidden');
                btnWall.className = "flex-1 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                btnUpload.className = "flex-1 py-2 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
                renderPhotos();
            } else {
                wallView.classList.add('hidden'); uploadView.classList.remove('hidden');
                btnUpload.className = "flex-1 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                btnWall.className = "flex-1 py-2 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
            }
        }

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md bg-white text-rose-500 shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-rose-400 transition-all whitespace-nowrap";
                }
            });
            renderPhotos();
        }

        // ======================= 视频压缩核心逻辑 =======================
        async function compressLocalVideo(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.playsInline = true;
                video.muted = true; // 必须静音才能确保后台无痕播放
                
                video.onloadedmetadata = async () => {
                    // 强制降档到 480p 左右控制体积
                    const MAX_WIDTH = 640; 
                    let w = video.videoWidth;
                    let h = video.videoHeight;
                    if (w > MAX_WIDTH) {
                        h = Math.floor(h * (MAX_WIDTH / w));
                        w = MAX_WIDTH;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');

                    let stream;
                    try {
                        stream = canvas.captureStream(24); // 降频到 24 FPS
                    } catch (e) {
                        return reject(new Error("当前浏览器不支持视频流捕获"));
                    }

                    // 合并音频 (利用 Web Audio API 抓取原本静音的视频声音)
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        if (audioCtx.state === 'suspended') await audioCtx.resume();
                        const source = audioCtx.createMediaElementSource(video);
                        const dest = audioCtx.createMediaStreamDestination();
                        source.connect(dest);
                        const audioTracks = dest.stream.getAudioTracks();
                        if (audioTracks.length > 0) {
                            stream.addTrack(audioTracks[0]);
                        }
                    } catch (e) {
                        console.warn("音频抓取失败，视频可能无声", e);
                    }

                    let options = { mimeType: 'video/webm;codecs=vp8,opus' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' }; 
                    }
                    // 控制比特率约为 800 kbps，通常能把5分钟视频压进 30MB
                    options.videoBitsPerSecond = 800000; 

                    let recorder;
                    try {
                        recorder = new MediaRecorder(stream, options);
                    } catch (e) {
                        return reject(new Error("浏览器不支持 MediaRecorder API"));
                    }

                    const chunks = [];
                    recorder.ondataavailable = e => {
                        if (e.data.size > 0) chunks.push(e.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
                        const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + "_compressed.webm", { type: blob.type });
                        URL.revokeObjectURL(video.src);
                        resolve(compressedFile);
                    };

                    video.play().then(() => {
                        recorder.start();
                        const progressEl = document.getElementById('compressProgress');
                        
                        function drawFrame() {
                            if (video.paused || video.ended) {
                                if (recorder.state === 'recording') recorder.stop();
                                return;
                            }
                            ctx.drawImage(video, 0, 0, w, h);
                            if (video.duration) {
                                const percent = Math.floor((video.currentTime / video.duration) * 100);
                                progressEl.innerText = percent + '%';
                            }
                            requestAnimationFrame(drawFrame);
                        }
                        drawFrame();
                    }).catch(err => reject(new Error("后台视频播放失败，请尝试刷新重试")));
                };

                video.onerror = () => reject(new Error("视频文件读取失败"));
            });
        }
        // ===============================================================

        async function handleMediaSelect(event) {
            let file = event.target.files[0];
            if (!file) return;
            
            // 判断类型
            currentMediaType = file.type.startsWith('video/') ? 'video' : 'image';

            // 容量限制与压缩检测
            const MAX_SIZE = 30 * 1024 * 1024;
            if (file.size > MAX_SIZE) {
                if (currentMediaType === 'image') {
                    showToast("图片超过30MB了，请换一张小的哦~");
                    event.target.value = ''; return;
                } else {
                    // 启动视频压缩
                    showToast("视频过大，启动前端压缩引擎 🚀");
                    document.getElementById('compressingUI').classList.remove('hidden');
                    try {
                        file = await compressLocalVideo(file);
                        if (file.size > MAX_SIZE) {
                            showToast("压不下来了🥺 压缩后依然超过30M，请剪辑更短的视频");
                            document.getElementById('compressingUI').classList.add('hidden');
                            event.target.value = ''; return;
                        }
                        showToast("本地压缩完成！🎉");
                    } catch (e) {
                        showToast("压缩失败：" + e.message);
                        document.getElementById('compressingUI').classList.add('hidden');
                        event.target.value = ''; return;
                    }
                    document.getElementById('compressingUI').classList.add('hidden');
                }
            }

            // 读取并在 UI 上渲染
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('clearMediaBtn').classList.remove('hidden');
                
                if (currentMediaType === 'video') {
                    const vidEl = document.getElementById('videoPreview');
                    vidEl.src = dataUrl;
                    vidEl.classList.remove('hidden');
                    document.getElementById('imagePreview').classList.add('hidden');
                } else {
                    const imgEl = document.getElementById('imagePreview');
                    imgEl.src = dataUrl;
                    imgEl.classList.remove('hidden');
                    document.getElementById('videoPreview').classList.add('hidden');
                    document.getElementById('videoPreview').src = ''; 
                }

                currentMediaBase64 = dataUrl.split(',')[1];
                currentMediaExt = file.name.split('.').pop() || (currentMediaType === 'video' ? 'webm' : 'jpg'); // 压缩后通常是 webm
            }
            reader.readAsDataURL(file);
        }

        function clearMedia(event) {
            event.stopPropagation(); 
            currentMediaBase64 = null;
            document.getElementById('mediaInput').value = '';
            
            const imgEl = document.getElementById('imagePreview');
            const vidEl = document.getElementById('videoPreview');
            
            imgEl.src = ''; imgEl.classList.add('hidden');
            vidEl.src = ''; vidEl.classList.add('hidden');
            
            document.getElementById('clearMediaBtn').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        function openImageViewer(url) {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            img.src = url;
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
            });
        }

        function closeImageViewer() {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            modal.classList.add('opacity-0');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function fetchPhotosData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_PHOTOS}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) {
                    photosData = { photos: [] };
                    return true;
                }
                if (!response.ok) return false;
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                photosData = JSON.parse(contentStr || '{"photos":[]}');
                photosSha = result.sha;
                return true;
            } catch (error) { return false; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update media data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false, sha: sha };
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        function uploadMediaToGithubWithProgress(base64Data, extension, folderName) {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const filename = `media_${timestamp}.${extension}`;
                const path = `${folderName}/${filename}`; 

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `https://api.github.com/repos/${OWNER_REPO}/contents/${path}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
                xhr.setRequestHeader('Authorization', `Bearer ${GITHUB_TOKEN}`);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.floor((event.loaded / event.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressText').innerText = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.content.download_url);
                    } else {
                        reject(new Error('Upload failed'));
                    }
                };

                xhr.onerror = function() { reject(new Error('Network error')); };

                const body = JSON.stringify({ message: `Upload media ${filename}`, content: base64Data });
                xhr.send(body);
            });
        }

        function startPolling() { 
            if (pollInterval) clearInterval(pollInterval); 
            pollInterval = setInterval(async () => { 
                if(await fetchPhotosData() && document.getElementById('wallView').classList.contains('hidden') === false) {
                    renderPhotos(); 
                }
            }, 150000); 
        }

        async function submitMedia() {
            if (!currentMediaBase64) {
                showToast("请先选择一张图片或视频哦！"); return;
            }
            if (!GITHUB_TOKEN) {
                showToast("未配置Token，无法上传！"); return;
            }

            const btn = document.getElementById('submitBtn');
            const subject = document.getElementById('formSubject').value;
            const level = parseInt(document.getElementById('formLevelNum').value, 10);
            const progressContainer = document.getElementById('progressContainer');
            
            btn.innerText = "上传中请稍候..."; 
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            progressContainer.classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';

            try {
                const uploadedMediaUrl = await uploadMediaToGithubWithProgress(currentMediaBase64, currentMediaExt, 'photowall');
                if (!uploadedMediaUrl) throw new Error("Url is null");

                btn.innerText = "正在同步数据...";
                
                const newPhoto = {
                    id: Date.now(),
                    url: uploadedMediaUrl,
                    type: currentMediaType, 
                    uploader: myIdentity,
                    subject: subject,
                    level: isNaN(level) ? 100 : level,
                    time: Date.now()
                };

                if (!photosData.photos) photosData.photos = [];
                photosData.photos.unshift(newPhoto);

                const upRes = await updateFile(FILE_PHOTOS, photosData, photosSha);
                
                if (upRes.success) {
                    photosSha = upRes.sha;
                    showToast("发布成功！🎉");
                    clearMedia({stopPropagation: () => {}}); 
                    document.getElementById('formLevelNum').value = 100;
                    document.getElementById('formLevelRange').value = 100;
                    
                    switchCategory(subject);
                    switchMainTab('wall'); 
                } else {
                    showToast("数据保存失败，请稍后重试");
                    photosData.photos.shift(); 
                }
            } catch (error) {
                console.error(error);
                showToast("文件上传失败，请检查网络");
            } finally {
                btn.innerHTML = "发布动态 🚀"; 
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => progressContainer.classList.add('hidden'), 1000); 
            }
        }

        function renderPhotos() {
            const container = document.getElementById('photoGrid');
            const sortMode = document.getElementById('sortSelect').value;
            
            if (!photosData.photos || photosData.photos.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-sm text-gray-400 mt-10">还没有动态哦，快去发布吧~ 📸</div>`;
                return;
            }

            let displayList = photosData.photos;
            if (currentCategory !== '全部') {
                displayList = displayList.filter(p => p.subject === currentCategory);
            }

            if (sortMode === 'time') {
                displayList.sort((a, b) => b.time - a.time);
            } else if (sortMode === 'level') {
                displayList.sort((a, b) => b.level - a.level);
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-sm text-gray-400 mt-10">这个分类下还没有动态哦~ 🍃</div>`;
                return;
            }

            container.innerHTML = displayList.map(item => {
                const dateStr = new Date(item.time).toLocaleDateString();
                const uploaderIcon = item.uploader === '哼哼' ? '👦' : '👧';
                
                let mediaHtml = '';
                if (item.type === 'video') {
                    mediaHtml = `
                        <div class="overflow-hidden rounded-lg bg-black">
                            <video src="${item.url}" controls preload="metadata" class="w-full object-contain max-h-64"></video>
                        </div>
                    `;
                } else {
                    mediaHtml = `
                        <div class="overflow-hidden rounded-lg cursor-zoom-in" onclick="openImageViewer('${item.url}')">
                            <img src="${item.url}" loading="lazy" class="w-full object-cover transform group-hover:scale-105 transition-transform duration-300">
                        </div>
                    `;
                }

                return `
                    <div class="photo-card bg-white p-2 rounded-xl shadow-sm border border-rose-100 animate-fade-in hover:shadow-md transition-shadow relative group">
                        ${mediaHtml}
                        <div class="mt-2 flex items-center justify-between px-1">
                            <span class="text-[10px] text-gray-400 font-mono">${dateStr}</span>
                            <div class="flex items-center gap-1">
                                <span class="text-xs font-bold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded shadow-sm">Lv.${item.level}</span>
                            </div>
                        </div>
                        <div class="mt-1 px-1 text-[11px] text-gray-500 flex items-center gap-1">
                            来自: ${uploaderIcon} ${item.uploader}
                        </div>
                        ${currentCategory === '全部' ? `<div class="absolute top-3 left-3 bg-white/90 text-rose-500 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">${item.subject}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
