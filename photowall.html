<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的照片墙 🖼️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow: hidden; 
        }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 0px; width: 0px; }
        
        /* 点赞图标的心跳动画 */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .heart-animate { animation: heartBeat 0.3s ease-in-out; }
        
        /* 隐藏图片查看器的滚动条 */
        #imageViewerModal {
            touch-action: none; /* 阻止默认的手势行为，方便实现自定义缩放拖拽 */
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col items-center">
    
    <div class="z-40 w-full max-w-md bg-[#fdf2f8]/95 backdrop-blur-md pt-5 pb-3 px-4 shadow-sm border-b border-rose-100/50 shrink-0">
        <header class="text-center mb-4 w-full flex justify-between items-center px-1">
            <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 transition-transform hover:scale-110 flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div class="flex-1 flex justify-center">
                <h1 class="text-xl font-bold text-rose-500 flex items-center justify-center gap-2 drop-shadow-sm">
                   <span>📸</span> 我们的照片墙 <span>✨</span>
                </h1>
            </div>
            <div class="w-9 h-9 flex-shrink-0"></div>
        </header>

        <!-- 顶层主选项卡（新增了排行榜） -->
        <div class="flex space-x-2 w-full justify-center bg-white p-1 rounded-full shadow-sm border border-rose-100">
            <button id="tabWallBtn" onclick="switchMainTab('wall')" class="flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm">照片墙</button>
            <button id="tabRankBtn" onclick="switchMainTab('rank')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50">排行榜</button>
            <button id="tabUploadBtn" onclick="switchMainTab('upload')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50">发布</button>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col flex-1 px-4 mt-3 mb-4 overflow-hidden relative">
        
        <!-- 视图 1：照片墙 -->
        <div id="wallView" class="w-full h-full flex flex-col transition-opacity duration-300">
            <div class="flex justify-between items-center mb-3 w-full bg-white/90 p-2 rounded-xl shadow-sm border border-rose-100 backdrop-blur-sm shrink-0">
                <div class="flex space-x-1 overflow-x-auto custom-scrollbar" id="categoryTabs">
                    <button onclick="switchCategory('全部')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md bg-rose-100 text-rose-600 shadow-sm transition-all whitespace-nowrap" data-cat="全部">全部</button>
                    <button onclick="switchCategory('我们')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="我们">我们</button>
                    <button onclick="switchCategory('亲亲')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="亲亲">亲亲</button>
                    <button onclick="switchCategory('哼哼')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="哼哼">哼哼</button>
                    <button onclick="switchCategory('其他')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="其他">其他</button>
                </div>
                
                <select id="sortSelect" onchange="renderPhotos()" class="ml-2 text-xs bg-rose-50 border border-rose-100 text-rose-500 rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-300 shadow-sm shrink-0 font-medium">
                    <option value="time">最新发布</option>
                    <option value="level">最高等级</option>
                </select>
            </div>

            <div class="w-full flex-1 bg-white/60 p-2.5 rounded-2xl shadow-sm border border-rose-100/60 backdrop-blur-md overflow-y-auto custom-scrollbar">
                <div id="photoGrid" class="w-full pb-6">
                    <!-- JS动态渲染双列瀑布流 -->
                </div>
            </div>
        </div>

        <!-- 视图 2：排行榜 -->
        <div id="rankView" class="w-full h-full flex flex-col hidden transition-opacity duration-300">
            <div class="w-full flex-1 bg-white/70 p-3 rounded-2xl shadow-sm border border-rose-100/60 backdrop-blur-md overflow-y-auto custom-scrollbar">
                <div class="flex items-center justify-center gap-2 mb-4 mt-2">
                    <span class="text-xl">🏆</span>
                    <h2 class="text-rose-500 font-bold text-lg">人气排行榜</h2>
                    <span class="text-xl">🔥</span>
                </div>
                
                <div id="rankList" class="w-full pb-6 flex flex-col space-y-3">
                    <!-- JS动态渲染排行榜列表 -->
                </div>
            </div>
        </div>

        <!-- 视图 3：发布照片 -->
        <div id="uploadView" class="w-full h-full flex flex-col hidden transition-opacity duration-300 overflow-y-auto custom-scrollbar pb-6">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-sm border-2 border-rose-100 shrink-0">
                
                <div id="uploadArea" class="w-full h-48 border-2 border-dashed border-rose-300 rounded-xl bg-rose-50 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-100 transition-colors mb-5 relative overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    <div id="uploadPlaceholder" class="flex flex-col items-center pointer-events-none">
                        <span class="text-4xl mb-2">📥</span>
                        <span class="text-sm font-bold text-rose-400">点击选择图片</span>
                    </div>
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                    <button id="clearImageBtn" onclick="clearImage(event)" class="hidden absolute top-2 right-2 bg-white/90 text-rose-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold z-20 hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">×</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

                <div class="space-y-5">
                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">发布人</span>
                        <span id="uploaderName" class="text-sm text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full flex items-center gap-1">👦 <span id="uploaderText"></span></span>
                    </div>
                    
                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">照片分类</span>
                        <select id="formSubject" class="text-sm bg-rose-50 border border-rose-200 text-rose-500 rounded-lg px-3 py-1 focus:outline-none focus:border-rose-400 font-medium">
                            <option value="我们">我们 👦👦</option>
                            <option value="亲亲">亲亲 👦</option>
                            <option value="哼哼">哼哼 👦</option>
                            <option value="其他">其他 🌟</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">精彩等级</span>
                        <div class="flex items-center gap-2">
                            <input type="range" id="formLevelRange" min="1" max="100" value="100" class="w-24 accent-rose-400" oninput="document.getElementById('formLevelNum').value = this.value">
                            <input type="number" id="formLevelNum" min="1" max="100" value="100" class="text-sm w-12 text-center bg-rose-50 border border-rose-200 text-rose-500 rounded-lg py-1 focus:outline-none focus:border-rose-400 font-bold" oninput="document.getElementById('formLevelRange').value = this.value">
                        </div>
                    </div>
                </div>

                <div id="progressContainer" class="hidden w-full mt-5">
                    <div class="flex justify-between text-xs text-rose-500 mb-1.5 font-bold">
                        <span id="progressTitle">🚀 正在上传至时光机...</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-rose-100 rounded-full h-2 shadow-inner overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button onclick="submitPhoto()" id="submitBtn" class="mt-6 w-full py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-[15px] font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2 tracking-wider">
                    发布照片 🚀
                </button>
            </div>
            
            <div class="mt-6 mb-2 text-center shrink-0">
                <span class="text-gray-400 text-xs bg-white/50 px-3 py-1 rounded-full shadow-sm">当前身份: <span id="currentIdentityLabel" class="text-rose-400 font-bold">-</span></span>
            </div>
        </div>
    </main>

    <!-- 图片大图查看器 -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-0 transition-opacity opacity-0" onclick="closeImageViewer()">
        <div id="imageViewerLoader" class="absolute inset-0 flex items-center justify-center z-40 hidden pointer-events-none">
            <div class="w-10 h-10 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        
        <button class="absolute top-6 right-6 text-white hover:text-rose-400 text-3xl font-bold z-50 bg-black/40 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-sm" onclick="closeImageViewer(event)">&times;</button>
        
        <!-- 增加一个容器用于处理缩放和拖拽 -->
        <div id="imageContainer" class="w-full h-full flex items-center justify-center overflow-hidden">
            <img id="fullSizeImage" src="" class="max-w-none max-h-none object-contain transform transition-transform duration-100 ease-out relative z-30" onclick="event.stopPropagation()">
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap backdrop-blur-md border border-gray-700"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity') || '游客';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        document.getElementById('uploaderText').innerText = myIdentity;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_PHOTOS = 'data/Photos.json'; 
        
        let photosData = { photos: [] };
        let photosSha = null;
        let pollInterval = null;

        let currentCategory = '全部'; 
        let currentImageDataUrl = null; 
        let currentImageBase64 = null;
        let currentImageExt = 'jpg';
        
        let isLikingSyncing = false; // 新增：控制点赞同步状态的变量

        // 缩放和拖拽相关的变量
        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let lastDistance = 0;

        window.onload = async function() {
            if (!GITHUB_TOKEN) { showToast("未检测到Token，仅支持预览"); }
            await fetchPhotosData();
            renderPhotos();
            startPolling();
        };

        function switchMainTab(tab) {
            const views = {
                'wall': document.getElementById('wallView'),
                'rank': document.getElementById('rankView'),
                'upload': document.getElementById('uploadView')
            };
            const btns = {
                'wall': document.getElementById('tabWallBtn'),
                'rank': document.getElementById('tabRankBtn'),
                'upload': document.getElementById('tabUploadBtn')
            };

            for (const key in views) {
                if (key === tab) {
                    views[key].classList.remove('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                } else {
                    views[key].classList.add('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
                }
            }

            if (tab === 'wall') renderPhotos();
            if (tab === 'rank') renderRank();
        }

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md bg-rose-100 text-rose-600 shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap bg-transparent";
                }
            });
            renderPhotos();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                showToast("图片不能超过10MB哦~");
                event.target.value = ''; return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageDataUrl = e.target.result;
                currentImageBase64 = currentImageDataUrl.split(',')[1];
                currentImageExt = file.name.split('.').pop() || 'jpg';
                
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('clearImageBtn').classList.remove('hidden');
                
                const imgEl = document.getElementById('imagePreview');
                imgEl.src = currentImageDataUrl;
                imgEl.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        function clearImage(event) {
            event.stopPropagation(); 
            currentImageBase64 = null;
            currentImageDataUrl = null;
            document.getElementById('imageInput').value = '';
            
            const imgEl = document.getElementById('imagePreview');
            imgEl.src = ''; imgEl.classList.add('hidden');
            
            document.getElementById('clearImageBtn').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        function openImageViewer(thumbUrl, fullUrl) {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            const loader = document.getElementById('imageViewerLoader');
            
            // 重置缩放和位置
            scale = 1;
            pointX = 0;
            pointY = 0;
            setTransform();
            
            img.src = thumbUrl || fullUrl;
            
            // 调整图片初始大小以适应屏幕
            img.onload = function() {
                const container = document.getElementById('imageContainer');
                const ratioX = container.clientWidth / img.naturalWidth;
                const ratioY = container.clientHeight / img.naturalHeight;
                const initialScale = Math.min(ratioX, ratioY, 1); // 不超过原始大小
                
                // 设置基础宽高
                img.style.width = (img.naturalWidth * initialScale) + 'px';
                img.style.height = (img.naturalHeight * initialScale) + 'px';
            };

            if (thumbUrl && thumbUrl !== fullUrl) {
                loader.classList.remove('hidden');
                const highResImg = new Image();
                highResImg.onload = () => {
                    img.src = fullUrl; 
                    loader.classList.add('hidden');
                };
                highResImg.onerror = () => {
                    loader.classList.add('hidden');
                    showToast("原图加载失败");
                };
                highResImg.src = fullUrl;
            } else {
                loader.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
            });
            
            // 绑定事件
            setupZoomAndPan();
        }

        function closeImageViewer(event) {
            if(event) event.stopPropagation();
            const modal = document.getElementById('imageViewerModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                const img = document.getElementById('fullSizeImage');
                img.src = ''; // 清空图片
            }, 300);
            
            // 移除事件监听，防止内存泄漏
            removeZoomAndPan();
        }
        
        function setTransform() {
            const img = document.getElementById('fullSizeImage');
            img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function handlePointerDown(e) {
            e.preventDefault();
            panning = true;
            
            if (e.touches && e.touches.length === 2) {
                // 双指捏合开始
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastDistance = Math.sqrt(dx * dx + dy * dy);
            } else {
                // 单指或鼠标拖动开始
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - pointX;
                startY = clientY - pointY;
            }
        }

        function handlePointerMove(e) {
            e.preventDefault();
            if (!panning) return;

            if (e.touches && e.touches.length === 2) {
                // 双指捏合缩放
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                const delta = distance - lastDistance;
                scale += delta * 0.01;
                
                // 限制缩放比例
                scale = Math.min(Math.max(0.5, scale), 5);
                
                lastDistance = distance;
                setTransform();
            } else if (panning) {
                // 单指或鼠标拖动
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                pointX = clientX - startX;
                pointY = clientY - startY;
                setTransform();
            }
        }

        function handlePointerUp(e) {
            e.preventDefault();
            panning = false;
        }

        function handleWheel(e) {
            e.preventDefault();
            const delta = Math.sign(e.deltaY) * -0.1;
            scale += delta;
            
            // 限制缩放比例
            scale = Math.min(Math.max(0.5, scale), 5);
            setTransform();
        }

        function setupZoomAndPan() {
            const container = document.getElementById('imageContainer');
            
            // 鼠标事件
            container.addEventListener('mousedown', handlePointerDown);
            container.addEventListener('mousemove', handlePointerMove);
            container.addEventListener('mouseup', handlePointerUp);
            container.addEventListener('mouseleave', handlePointerUp);
            
            // 滚轮事件
            container.addEventListener('wheel', handleWheel, { passive: false });
            
            // 触摸事件
            container.addEventListener('touchstart', handlePointerDown, { passive: false });
            container.addEventListener('touchmove', handlePointerMove, { passive: false });
            container.addEventListener('touchend', handlePointerUp);
            container.addEventListener('touchcancel', handlePointerUp);
        }
        
        function removeZoomAndPan() {
            const container = document.getElementById('imageContainer');
            container.removeEventListener('mousedown', handlePointerDown);
            container.removeEventListener('mousemove', handlePointerMove);
            container.removeEventListener('mouseup', handlePointerUp);
            container.removeEventListener('mouseleave', handlePointerUp);
            container.removeEventListener('wheel', handleWheel);
            container.removeEventListener('touchstart', handlePointerDown);
            container.removeEventListener('touchmove', handlePointerMove);
            container.removeEventListener('touchend', handlePointerUp);
            container.removeEventListener('touchcancel', handlePointerUp);
        }

        async function fetchPhotosData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_PHOTOS}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) {
                    photosData = { photos: [] };
                    return true;
                }
                if (!response.ok) return false;
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                photosData = JSON.parse(contentStr || '{"photos":[]}');
                photosSha = result.sha;
                return true;
            } catch (error) { return false; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update photo data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false, sha: sha };
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        function uploadMediaToGithubWithProgress(base64Data, extension, folderName, prefix) {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const filename = `${prefix}_${timestamp}.${extension}`;
                const path = `${folderName}/${filename}`; 

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `https://api.github.com/repos/${OWNER_REPO}/contents/${path}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
                xhr.setRequestHeader('Authorization', `Bearer ${GITHUB_TOKEN}`);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.floor((event.loaded / event.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressText').innerText = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.content.download_url);
                    } else {
                        reject(new Error('Upload failed'));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network error'));
                };

                const body = JSON.stringify({
                    message: `Upload photo ${filename}`,
                    content: base64Data
                });

                xhr.send(body);
            });
        }

        function generateThumbnailBase64(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const MAX_WIDTH = 400; 
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
                };
                img.src = dataUrl;
            });
        }

        async function toggleLike(photoId, event) {
            event.stopPropagation(); // 阻止打开大图
            
            if (!GITHUB_TOKEN) {
                showToast("预览模式无法点赞哦，请先配置Token 💡");
                return;
            }
            
            if (isLikingSyncing) {
                showToast("正在保存上次的点赞，请稍等哦... ⏳");
                return;
            }

            const photo = photosData.photos.find(p => p.id === photoId);
            if (!photo) return;
            
            // 兼容老数据结构，如果存在 likedBy 数组，无损转换为纯数字 likes
            if (photo.likedBy) {
                photo.likes = (photo.likes || 0) + photo.likedBy.length;
                delete photo.likedBy;
            }
            
            // 直接增加数字形式的点赞数
            photo.likes = (photo.likes || 0) + 1;
            
            // 本地记录已点赞的照片，用于保持红心状态
            let localLikes = JSON.parse(localStorage.getItem('loveGacha_myLikes') || '[]');
            if (!localLikes.includes(photoId)) {
                localLikes.push(photoId);
                localStorage.setItem('loveGacha_myLikes', JSON.stringify(localLikes));
            }
            
            // 乐观更新 UI (立即刷新渲染)
            if (!document.getElementById('wallView').classList.contains('hidden')) {
                renderPhotos();
            }
            if (!document.getElementById('rankView').classList.contains('hidden')) {
                renderRank();
            }
            
            // 播放一个额外的心跳动画，给当前点击的按钮
            const btn = event.currentTarget;
            btn.classList.remove('heart-animate');
            // 触发重绘
            void btn.offsetWidth;
            btn.classList.add('heart-animate');
            
            isLikingSyncing = true;
            showToast("正在保存点赞... 🚀");

            // 同步至 Github
            const upRes = await updateFile(FILE_PHOTOS, photosData, photosSha);
            
            isLikingSyncing = false;
            
            if (upRes.success) {
                photosSha = upRes.sha;
                showToast("点赞成功 +1 ❤️");
            } else {
                // 如果保存失败，回滚点赞数
                photo.likes = Math.max(0, photo.likes - 1);
                console.warn("点赞状态同步失败");
                showToast("点赞数据保存失败，请检查网络 ❌");
                renderPhotos();
                renderRank();
            }
        }

        function startPolling() { 
            if (pollInterval) clearInterval(pollInterval); 
            pollInterval = setInterval(async () => { 
                if(await fetchPhotosData()) {
                    if (!document.getElementById('wallView').classList.contains('hidden')) {
                        renderPhotos(); 
                    } else if (!document.getElementById('rankView').classList.contains('hidden')) {
                        renderRank();
                    }
                }
            }, 60000); // 加快轮询频率到 60 秒
        }

        async function submitPhoto() {
            if (!currentImageBase64 || !currentImageDataUrl) {
                showToast("请先选择一张图片哦！"); return;
            }
            if (!GITHUB_TOKEN) {
                showToast("未配置Token，无法上传！"); return;
            }

            const btn = document.getElementById('submitBtn');
            const subject = document.getElementById('formSubject').value;
            const level = parseInt(document.getElementById('formLevelNum').value, 10);
            const progressContainer = document.getElementById('progressContainer');
            const progressTitle = document.getElementById('progressTitle');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            progressContainer.classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';

            try {
                let uploadedThumbUrl = null;
                let uploadedImageUrl = null;

                btn.innerText = "压缩处理中...";
                const thumbBase64 = await generateThumbnailBase64(currentImageDataUrl);
                
                btn.innerText = "上传缩略图中...";
                progressTitle.innerText = "🚀 正在上传缩略图...";
                uploadedThumbUrl = await uploadMediaToGithubWithProgress(thumbBase64, 'jpg', 'photowall', 'thumb');
                
                btn.innerText = "上传原图中...";
                progressTitle.innerText = "🚀 正在上传高清原图...";
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                uploadedImageUrl = await uploadMediaToGithubWithProgress(currentImageBase64, currentImageExt, 'photowall', 'origin');
                
                if (!uploadedImageUrl) throw new Error("Url is null");

                btn.innerText = "正在同步数据...";
                
                const newPhoto = {
                    id: Date.now(),
                    url: uploadedImageUrl,
                    thumbUrl: uploadedThumbUrl, 
                    uploader: myIdentity,
                    subject: subject,
                    level: isNaN(level) ? 100 : level,
                    time: Date.now(),
                    likes: 0 // 新增照片初始点赞数
                };

                if (!photosData.photos) photosData.photos = [];
                photosData.photos.unshift(newPhoto);

                const upRes = await updateFile(FILE_PHOTOS, photosData, photosSha);
                
                if (upRes.success) {
                    photosSha = upRes.sha;
                    showToast("发布成功！🎉");
                    clearImage({stopPropagation: () => {}}); 
                    document.getElementById('formLevelNum').value = 100;
                    document.getElementById('formLevelRange').value = 100;
                    
                    switchCategory(subject);
                    switchMainTab('wall'); 
                } else {
                    showToast("数据保存失败，请稍后重试");
                    photosData.photos.shift(); 
                }
            } catch (error) {
                console.error(error);
                showToast("文件上传失败，请检查网络或文件大小");
            } finally {
                btn.innerHTML = "发布照片 🚀"; 
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => progressContainer.classList.add('hidden'), 1000); 
            }
        }

        function renderPhotos() {
            const container = document.getElementById('photoGrid');
            const sortMode = document.getElementById('sortSelect').value;
            
            if (!photosData.photos || photosData.photos.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10">还没有照片哦，快去发布吧~ 📸</div>`;
                return;
            }

            let displayList = photosData.photos;
            if (currentCategory !== '全部') {
                displayList = displayList.filter(p => p.subject === currentCategory);
            }

            if (sortMode === 'time') {
                displayList.sort((a, b) => b.time - a.time);
            } else if (sortMode === 'level') {
                displayList.sort((a, b) => b.level - a.level);
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10">这个分类下还没有照片哦~ 🍃</div>`;
                return;
            }

            let leftColHtml = '';
            let rightColHtml = '';
            
            let localLikes = JSON.parse(localStorage.getItem('loveGacha_myLikes') || '[]');

            displayList.forEach((item, index) => {
                const dateStr = new Date(item.time).toLocaleDateString();
                const displayThumb = item.thumbUrl || item.url;
                
                // 兼容老数据：将 likedBy 数组转换为数字
                if (item.likedBy) {
                    item.likes = (item.likes || 0) + item.likedBy.length;
                    delete item.likedBy;
                }
                
                // 计算点赞数据
                const likesCount = item.likes || 0;
                const isLiked = localLikes.includes(item.id);
                
                const heartSvg = `<svg class="w-3.5 h-3.5 ${isLiked ? 'text-rose-500 fill-current' : 'text-white stroke-current fill-transparent'} transition-colors" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>`;

                const cardHtml = `
                    <div class="bg-white rounded-lg shadow-sm border border-rose-100/50 animate-fade-in hover:shadow-md transition-shadow relative overflow-hidden group w-full mb-2.5">
                        <div class="cursor-zoom-in relative w-full h-full block" onclick="openImageViewer('${displayThumb}', '${item.url}')">
                            <img src="${displayThumb}" loading="lazy" class="w-full h-auto block object-cover transform group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
                        </div>
                        
                        <div class="absolute bottom-0 left-0 right-0 p-2 text-white flex flex-col justify-end pointer-events-none z-10">
                            <div class="flex items-center justify-between drop-shadow-md w-full">
                                <div class="flex items-center gap-1">
                                    <span class="text-[13px]">👦</span>
                                    <span class="text-[11px] font-bold truncate max-w-[70px]">${item.uploader}</span>
                                </div>
                                <div class="flex items-center gap-1.5 pointer-events-auto">
                                    <span class="text-[9px] bg-white/20 backdrop-blur-sm px-1.5 py-0.5 rounded border border-white/30 shadow-sm font-bold">Lv.${item.level}</span>
                                    
                                    <!-- 新增：点赞按钮 -->
                                    <button onclick="toggleLike(${item.id}, event)" class="flex items-center gap-0.5 bg-white/20 backdrop-blur-sm px-1.5 py-0.5 rounded border border-white/30 shadow-sm hover:bg-rose-400/50 transition-colors">
                                        ${heartSvg}
                                        <span class="text-[10px] font-bold text-white ml-0.5">${likesCount}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        ${currentCategory === '全部' ? `<div class="absolute top-1.5 left-1.5 bg-white/90 backdrop-blur-md text-rose-500 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm z-20 pointer-events-none">${item.subject}</div>` : ''}
                        <div class="absolute top-1.5 right-1.5 bg-black/40 backdrop-blur-md text-white/90 text-[9px] font-mono px-1.5 py-0.5 rounded shadow-sm z-20 pointer-events-none">${dateStr}</div>
                    </div>
                `;

                if (index % 2 === 0) leftColHtml += cardHtml;
                else rightColHtml += cardHtml;
            });

            container.innerHTML = `
                <div class="flex gap-2.5 items-start w-full">
                    <div class="flex flex-col w-1/2">${leftColHtml}</div>
                    <div class="flex flex-col w-1/2">${rightColHtml}</div>
                </div>
            `;
        }

        function renderRank() {
            const container = document.getElementById('rankList');
            if (!photosData.photos || photosData.photos.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10">相册还是空空的哦，快去发布吧~ 📸</div>`;
                return;
            }
            
            let localLikes = JSON.parse(localStorage.getItem('loveGacha_myLikes') || '[]');

            // 兼容老数据，转换为新字段，并按照点赞数进行降序排列
            let rankList = [...photosData.photos].map(p => {
                if (p.likedBy) {
                    p.likes = (p.likes || 0) + p.likedBy.length;
                    delete p.likedBy;
                }
                return {
                    ...p,
                    likesCount: p.likes || 0
                };
            }).sort((a, b) => b.likesCount - a.likesCount || b.time - a.time);

            // 如果整个应用里一张点赞照片都没有
            if (rankList.every(p => p.likesCount === 0)) {
                 container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10 mt-6">还没有人点过赞哦，<br>快去“照片墙”给喜欢的照片比心吧！❤️</div>`;
                 return;
            }

            let html = '';
            
            // 过滤掉点赞数为0的（不在榜单显示没被赞过的）
            rankList = rankList.filter(p => p.likesCount > 0);

            rankList.forEach((item, index) => {
                let rankBadge = '';
                if (index === 0) rankBadge = '<div class="absolute -top-3 -left-3 text-4xl drop-shadow-md z-10">🥇</div>';
                else if (index === 1) rankBadge = '<div class="absolute -top-3 -left-3 text-4xl drop-shadow-md z-10">🥈</div>';
                else if (index === 2) rankBadge = '<div class="absolute -top-3 -left-3 text-4xl drop-shadow-md z-10">🥉</div>';
                else rankBadge = `<div class="absolute -top-2 -left-2 w-7 h-7 bg-gray-200/90 backdrop-blur-sm rounded-full flex items-center justify-center text-xs font-bold text-gray-600 border-2 border-white shadow-sm z-10">${index + 1}</div>`;

                const displayThumb = item.thumbUrl || item.url;
                const isLiked = localLikes.includes(item.id);
                const dateStr = new Date(item.time).toLocaleDateString();

                const heartSvg = `<svg class="w-5 h-5 ${isLiked ? 'text-rose-500 fill-current' : 'text-gray-400 stroke-current fill-transparent'} transition-colors" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>`;

                html += `
                    <div class="flex items-center bg-white/90 backdrop-blur-md rounded-xl p-3 shadow-sm border border-rose-100/60 transition-transform active:scale-95 cursor-zoom-in group" onclick="openImageViewer('${displayThumb}', '${item.url}')">
                        <div class="relative w-20 h-20 shrink-0">
                            ${rankBadge}
                            <img src="${displayThumb}" class="w-full h-full object-cover rounded-xl shadow-sm border border-rose-50 group-hover:opacity-90 transition-opacity">
                        </div>
                        <div class="ml-4 flex-1 flex flex-col justify-center">
                            <div class="flex items-center gap-1.5 mb-1.5">
                                <span class="text-xs bg-rose-100 text-rose-500 px-1.5 py-0.5 rounded text-[10px] font-bold">${item.subject}</span>
                                <span class="text-sm font-bold text-gray-700 truncate max-w-[100px]">${item.uploader}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 font-mono">${dateStr}</p>
                        </div>
                        
                        <!-- 榜单里的点赞按钮 -->
                        <div class="flex flex-col items-center justify-center pl-2 pr-1 pointer-events-auto cursor-pointer" onclick="toggleLike(${item.id}, event)">
                            <div class="w-10 h-10 rounded-full ${isLiked ? 'bg-rose-50' : 'bg-gray-50'} flex items-center justify-center shadow-sm border ${isLiked ? 'border-rose-200' : 'border-gray-200'} transition-colors hover:bg-rose-100">
                                ${heartSvg}
                            </div>
                            <span class="text-[11px] font-bold ${isLiked ? 'text-rose-500' : 'text-gray-500'} mt-1">${item.likesCount} 赞</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
