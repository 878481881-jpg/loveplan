<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的照片墙 🖼️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 0px; } /* 隐藏原生滚动条，更纯粹 */
        
        /* 瀑布流核心控制 */
        .masonry-grid { column-count: 2; column-gap: 12px; }
        .photo-card { break-inside: avoid; margin-bottom: 12px; }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center pb-10">
    <!-- 吸顶区域 -->
    <div class="sticky top-0 z-40 w-full max-w-md bg-[#fdf2f8]/90 backdrop-blur-md pt-6 pb-2 px-4 shadow-sm border-b border-rose-100/50">
        <header class="text-center mb-4 w-full flex justify-between items-center px-2">
            <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 transition-transform hover:scale-110">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div>
                <h1 class="text-xl font-bold text-rose-500 flex items-center justify-center gap-2 drop-shadow-sm">
                   <span>📸</span> 我们的照片墙 <span>✨</span>
                </h1>
            </div>
            <div class="w-9 h-9"></div>
        </header>

        <!-- 顶层主选项卡 -->
        <div class="flex space-x-4 w-full justify-center bg-white p-1 rounded-full shadow-sm border border-rose-100">
            <button id="tabWallBtn" onclick="switchMainTab('wall')" class="flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm">照片墙</button>
            <button id="tabUploadBtn" onclick="switchMainTab('upload')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50">发布照片</button>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col items-center px-4 mt-4">
        <!-- 视图 1：照片墙 -->
        <div id="wallView" class="w-full flex flex-col items-center transition-opacity duration-300">
            <!-- 墙内子选项卡 -->
            <div class="flex justify-between items-center mb-4 w-full bg-white/80 p-2 rounded-xl shadow-sm border border-rose-100">
                <div class="flex space-x-1 overflow-x-auto custom-scrollbar" id="categoryTabs">
                    <button onclick="switchCategory('全部')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md bg-rose-100 text-rose-600 shadow-sm transition-all whitespace-nowrap" data-cat="全部">全部</button>
                    <button onclick="switchCategory('我们')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="我们">我们</button>
                    <button onclick="switchCategory('亲亲')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="亲亲">亲亲</button>
                    <button onclick="switchCategory('哼哼')" class="cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap" data-cat="哼哼">哼哼</button>
                </div>
                
                <select id="sortSelect" onchange="renderPhotos()" class="ml-2 text-xs bg-white border border-rose-200 text-rose-500 rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-400 shadow-sm shrink-0">
                    <option value="time">最新发布</option>
                    <option value="level">最高等级</option>
                </select>
            </div>

            <!-- 瀑布流容器 (页面级自然滚动) -->
            <div id="photoGrid" class="w-full masonry-grid">
                <!-- JS动态渲染 -->
            </div>
        </div>

        <!-- 视图 2：发布照片 -->
        <div id="uploadView" class="w-full flex flex-col items-center hidden transition-opacity duration-300">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-sm border-2 border-rose-100">
                
                <div id="uploadArea" class="w-full h-48 border-2 border-dashed border-rose-300 rounded-xl bg-rose-50 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-100 transition-colors mb-5 relative overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    <div id="uploadPlaceholder" class="flex flex-col items-center pointer-events-none">
                        <span class="text-4xl mb-2">📥</span>
                        <span class="text-sm font-bold text-rose-400">点击选择图片</span>
                    </div>
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                    <button id="clearImageBtn" onclick="clearImage(event)" class="hidden absolute top-2 right-2 bg-white/90 text-rose-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold z-20 hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">×</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

                <div class="space-y-5">
                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">发布人</span>
                        <span id="uploaderName" class="text-sm text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full flex items-center gap-1">👦 <span id="uploaderText"></span></span>
                    </div>
                    
                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">照片主角</span>
                        <select id="formSubject" class="text-sm bg-rose-50 border border-rose-200 text-rose-500 rounded-lg px-3 py-1 focus:outline-none focus:border-rose-400 font-medium">
                            <option value="我们">我们 👨‍❤️‍👨</option>
                            <option value="亲亲">亲亲 👦</option>
                            <option value="哼哼">哼哼 👦</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between border-b border-rose-100 pb-3">
                        <span class="text-sm font-bold text-gray-600">精彩等级</span>
                        <div class="flex items-center gap-2">
                            <input type="range" id="formLevelRange" min="1" max="100" value="100" class="w-24 accent-rose-400" oninput="document.getElementById('formLevelNum').value = this.value">
                            <input type="number" id="formLevelNum" min="1" max="100" value="100" class="text-sm w-12 text-center bg-rose-50 border border-rose-200 text-rose-500 rounded-lg py-1 focus:outline-none focus:border-rose-400 font-bold" oninput="document.getElementById('formLevelRange').value = this.value">
                        </div>
                    </div>
                </div>

                <!-- 进度条 UI -->
                <div id="progressContainer" class="hidden w-full mt-5">
                    <div class="flex justify-between text-xs text-rose-500 mb-1.5 font-bold">
                        <span id="progressTitle">🚀 正在上传至时光机...</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-rose-100 rounded-full h-2 shadow-inner overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button onclick="submitPhoto()" id="submitBtn" class="mt-6 w-full py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-[15px] font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2 tracking-wider">
                    发布照片 🚀
                </button>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <span class="text-gray-400 text-xs bg-white/50 px-3 py-1 rounded-full">当前身份: <span id="currentIdentityLabel" class="text-rose-400 font-bold">-</span></span>
        </div>
    </main>

    <!-- 图片大图查看器 -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-2 transition-opacity opacity-0" onclick="closeImageViewer()">
        <div id="imageViewerLoader" class="absolute inset-0 flex items-center justify-center z-40 hidden pointer-events-none">
            <div class="w-10 h-10 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        
        <button class="absolute top-6 right-6 text-white hover:text-rose-400 text-3xl font-bold z-50 bg-black/40 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-sm" onclick="closeImageViewer()">&times;</button>
        <img id="fullSizeImage" src="" class="max-w-full max-h-full object-contain rounded-md transform scale-95 transition-transform duration-300 relative z-30" onclick="event.stopPropagation()">
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap backdrop-blur-md border border-gray-700"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity') || '游客';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        document.getElementById('uploaderText').innerText = myIdentity;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_PHOTOS = 'data/Photos.json'; 
        
        let photosData = { photos: [] };
        let photosSha = null;
        let pollInterval = null;

        let currentCategory = '全部'; 
        let currentImageDataUrl = null; 
        let currentImageBase64 = null;
        let currentImageExt = 'jpg';

        window.onload = async function() {
            if (!GITHUB_TOKEN) { showToast("未检测到Token，仅支持预览"); }
            await fetchPhotosData();
            renderPhotos();
            startPolling();
        };

        function switchMainTab(tab) {
            const wallView = document.getElementById('wallView');
            const uploadView = document.getElementById('uploadView');
            const btnWall = document.getElementById('tabWallBtn');
            const btnUpload = document.getElementById('tabUploadBtn');

            // 切换到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (tab === 'wall') {
                wallView.classList.remove('hidden'); uploadView.classList.add('hidden');
                btnWall.className = "flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                btnUpload.className = "flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
                renderPhotos();
            } else {
                wallView.classList.add('hidden'); uploadView.classList.remove('hidden');
                btnUpload.className = "flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                btnWall.className = "flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
            }
        }

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md bg-rose-100 text-rose-600 shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className = "cat-btn px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-rose-50 transition-all whitespace-nowrap bg-transparent";
                }
            });
            renderPhotos();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                showToast("图片不能超过10MB哦~");
                event.target.value = ''; return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageDataUrl = e.target.result;
                currentImageBase64 = currentImageDataUrl.split(',')[1];
                currentImageExt = file.name.split('.').pop() || 'jpg';
                
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('clearImageBtn').classList.remove('hidden');
                
                const imgEl = document.getElementById('imagePreview');
                imgEl.src = currentImageDataUrl;
                imgEl.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        function clearImage(event) {
            event.stopPropagation(); 
            currentImageBase64 = null;
            currentImageDataUrl = null;
            document.getElementById('imageInput').value = '';
            
            const imgEl = document.getElementById('imagePreview');
            imgEl.src = ''; imgEl.classList.add('hidden');
            
            document.getElementById('clearImageBtn').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        function openImageViewer(thumbUrl, fullUrl) {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            const loader = document.getElementById('imageViewerLoader');
            
            img.src = thumbUrl || fullUrl;
            
            if (thumbUrl && thumbUrl !== fullUrl) {
                loader.classList.remove('hidden');
                const highResImg = new Image();
                highResImg.onload = () => {
                    img.src = fullUrl; 
                    loader.classList.add('hidden');
                };
                highResImg.onerror = () => {
                    loader.classList.add('hidden');
                    showToast("原图加载失败");
                };
                highResImg.src = fullUrl;
            } else {
                loader.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
            });
        }

        function closeImageViewer() {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            modal.classList.add('opacity-0');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function fetchPhotosData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_PHOTOS}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) {
                    photosData = { photos: [] };
                    return true;
                }
                if (!response.ok) return false;
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                photosData = JSON.parse(contentStr || '{"photos":[]}');
                photosSha = result.sha;
                return true;
            } catch (error) { return false; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update photo data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false, sha: sha };
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        function uploadMediaToGithubWithProgress(base64Data, extension, folderName, prefix) {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const filename = `${prefix}_${timestamp}.${extension}`;
                const path = `${folderName}/${filename}`; 

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `https://api.github.com/repos/${OWNER_REPO}/contents/${path}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
                xhr.setRequestHeader('Authorization', `Bearer ${GITHUB_TOKEN}`);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.floor((event.loaded / event.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressText').innerText = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.content.download_url);
                    } else {
                        reject(new Error('Upload failed'));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network error'));
                };

                const body = JSON.stringify({
                    message: `Upload photo ${filename}`,
                    content: base64Data
                });

                xhr.send(body);
            });
        }

        function generateThumbnailBase64(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const MAX_WIDTH = 400; 
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
                };
                img.src = dataUrl;
            });
        }

        function startPolling() { 
            if (pollInterval) clearInterval(pollInterval); 
            pollInterval = setInterval(async () => { 
                if(await fetchPhotosData() && document.getElementById('wallView').classList.contains('hidden') === false) {
                    renderPhotos(); 
                }
            }, 150000); 
        }

        async function submitPhoto() {
            if (!currentImageBase64 || !currentImageDataUrl) {
                showToast("请先选择一张图片哦！"); return;
            }
            if (!GITHUB_TOKEN) {
                showToast("未配置Token，无法上传！"); return;
            }

            const btn = document.getElementById('submitBtn');
            const subject = document.getElementById('formSubject').value;
            const level = parseInt(document.getElementById('formLevelNum').value, 10);
            const progressContainer = document.getElementById('progressContainer');
            const progressTitle = document.getElementById('progressTitle');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            progressContainer.classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';

            try {
                let uploadedThumbUrl = null;
                let uploadedImageUrl = null;

                btn.innerText = "压缩处理中...";
                const thumbBase64 = await generateThumbnailBase64(currentImageDataUrl);
                
                btn.innerText = "上传缩略图中...";
                progressTitle.innerText = "🚀 正在上传缩略图...";
                uploadedThumbUrl = await uploadMediaToGithubWithProgress(thumbBase64, 'jpg', 'photowall', 'thumb');
                
                btn.innerText = "上传原图中...";
                progressTitle.innerText = "🚀 正在上传高清原图...";
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                uploadedImageUrl = await uploadMediaToGithubWithProgress(currentImageBase64, currentImageExt, 'photowall', 'origin');
                
                if (!uploadedImageUrl) throw new Error("Url is null");

                btn.innerText = "正在同步数据...";
                
                const newPhoto = {
                    id: Date.now(),
                    url: uploadedImageUrl,
                    thumbUrl: uploadedThumbUrl, 
                    uploader: myIdentity,
                    subject: subject,
                    level: isNaN(level) ? 100 : level,
                    time: Date.now()
                };

                if (!photosData.photos) photosData.photos = [];
                photosData.photos.unshift(newPhoto);

                const upRes = await updateFile(FILE_PHOTOS, photosData, photosSha);
                
                if (upRes.success) {
                    photosSha = upRes.sha;
                    showToast("发布成功！🎉");
                    clearImage({stopPropagation: () => {}}); 
                    document.getElementById('formLevelNum').value = 100;
                    document.getElementById('formLevelRange').value = 100;
                    
                    switchCategory(subject);
                    switchMainTab('wall'); 
                } else {
                    showToast("数据保存失败，请稍后重试");
                    photosData.photos.shift(); 
                }
            } catch (error) {
                console.error(error);
                showToast("文件上传失败，请检查网络或文件大小");
            } finally {
                btn.innerHTML = "发布照片 🚀"; 
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => progressContainer.classList.add('hidden'), 1000); 
            }
        }

        function renderPhotos() {
            const container = document.getElementById('photoGrid');
            const sortMode = document.getElementById('sortSelect').value;
            
            if (!photosData.photos || photosData.photos.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-sm text-gray-400 mt-10">还没有照片哦，快去发布吧~ 📸</div>`;
                return;
            }

            let displayList = photosData.photos;
            if (currentCategory !== '全部') {
                displayList = displayList.filter(p => p.subject === currentCategory);
            }

            if (sortMode === 'time') {
                displayList.sort((a, b) => b.time - a.time);
            } else if (sortMode === 'level') {
                displayList.sort((a, b) => b.level - a.level);
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-sm text-gray-400 mt-10">这个分类下还没有照片哦~ 🍃</div>`;
                return;
            }

            container.innerHTML = displayList.map(item => {
                const dateStr = new Date(item.time).toLocaleDateString();
                const displayThumb = item.thumbUrl || item.url;
                
                return `
                    <div class="photo-card bg-white rounded-xl shadow-sm border border-rose-100 animate-fade-in hover:shadow-md transition-shadow relative overflow-hidden group">
                        
                        <!-- 全幅无边距图片展示区 -->
                        <div class="cursor-zoom-in relative bg-rose-50 w-full" onclick="openImageViewer('${displayThumb}', '${item.url}')">
                            <img src="${displayThumb}" loading="lazy" class="w-full object-cover transform group-hover:scale-105 transition-transform duration-500 min-h-[100px]">
                            <!-- 半透明渐变遮罩，为了底部信息文字的可读性 -->
                            <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
                        </div>
                        
                        <!-- 覆盖在图片底部的零留白信息区 -->
                        <div class="absolute bottom-0 left-0 right-0 p-2 text-white flex flex-col justify-end pointer-events-none">
                            <div class="flex items-center justify-between drop-shadow-md">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[14px]">👦</span>
                                    <span class="text-xs font-bold truncate max-w-[80px]">${item.uploader}</span>
                                </div>
                                <span class="text-[10px] bg-white/20 backdrop-blur-sm px-1.5 py-0.5 rounded border border-white/30 shadow-sm font-bold">Lv.${item.level}</span>
                            </div>
                        </div>
                        
                        <!-- 分类及时间徽章悬浮 -->
                        ${currentCategory === '全部' ? `<div class="absolute top-2 left-2 bg-white/90 backdrop-blur-md text-rose-500 text-[10px] font-bold px-2 py-1 rounded-full shadow-sm z-20 pointer-events-none">${item.subject}</div>` : ''}
                        <div class="absolute top-2 right-2 bg-black/40 backdrop-blur-md text-white/90 text-[9px] font-mono px-1.5 py-0.5 rounded shadow-sm z-20 pointer-events-none">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
