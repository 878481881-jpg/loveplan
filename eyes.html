<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>眼疾手快 ⏱️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-pink: #f43f5e;
            --brand-pink-light: #fda4af;
            --bg-pink: #fff1f2;
        }

        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: var(--bg-pink); 
            background-image: radial-gradient(#fecdd3 1px, transparent 1px); 
            background-size: 24px 24px; 
            overflow-x: hidden;
            color: #333;
            overscroll-behavior-y: contain;
        }
        
        .font-mono { font-family: 'Roboto Mono', monospace; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 20px); } 
            10% { opacity: 1; transform: translate(-50%, 0); } 
            90% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes pop { 
            0% { transform: scale(0.8); opacity: 0;} 
            50% { transform: scale(1.1); opacity: 1;} 
            100% { transform: scale(1); opacity: 1;} 
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }
        .animate-pulse-fast { animation: pulse-fast 1s infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 3/4;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px -5px rgba(244, 63, 94, 0.2), 
                        0 0 0 6px white, 
                        0 0 0 10px var(--brand-pink-light);
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .points-card {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px -6px rgba(244, 63, 94, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .timer-display {
            font-size: 4rem;
            line-height: 1;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transition: opacity 0.1s;
        }
        
        /* Hit button style */
        .hit-btn {
            background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c);
            box-shadow: 0 10px 0 #7f1d1d, 0 15px 20px rgba(0,0,0,0.4), inset 0 5px 10px rgba(255,255,255,0.3);
            transition: all 0.1s;
        }
        .hit-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #7f1d1d, 0 5px 10px rgba(0,0,0,0.4), inset 0 5px 10px rgba(255,255,255,0.3);
        }
        .hit-btn.disabled {
            background: radial-gradient(circle at 30% 30%, #9ca3af, #4b5563);
            box-shadow: 0 10px 0 #374151, 0 15px 20px rgba(0,0,0,0.4);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 pb-24">

    <header class="w-full max-w-md flex justify-between items-center mb-6 relative">
        <a href="index.html" class="w-10 h-10 bg-white text-rose-500 rounded-full shadow-sm flex items-center justify-center border border-rose-50 active:scale-95 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-black text-rose-500 flex items-center gap-2 absolute left-1/2 transform -translate-x-1/2">
            ⏱️ 眼疾手快
        </h1>
        <div class="w-10 h-10"></div>
    </header>
    
    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="moqi.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-100 transition-all text-sm whitespace-nowrap">默契考验</a>
        <a href="flybird.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all text-sm whitespace-nowrap">笨鸟先飞</a>
        <a href="wheel.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all text-sm whitespace-nowrap">幸运转盘</a>
        <a href="#" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">眼疾手快</a>
    </div>

    <main class="w-full max-w-md flex flex-col items-center relative gap-6">
        
        <div class="points-card w-full p-5 text-white flex justify-between items-center">
            <div class="relative z-10 flex flex-col gap-2">
                <div class="flex items-center gap-1.5 opacity-90">
                    <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full backdrop-blur-sm" id="identityText">-</span>
                    <span class="text-sm font-medium">的积分</span>
                </div>
                <div class="flex items-baseline gap-1">
                    <span class="text-4xl font-black tracking-tight drop-shadow-sm" id="myPoints">--</span>
                </div>
            </div>
            
            <div class="relative z-10 flex flex-col items-end gap-2 text-right">
                <div class="text-sm font-medium opacity-90">🏆 成功次数</div>
                <div class="text-3xl font-black text-yellow-300 drop-shadow-md" id="highScoreDisplay">--</div>
            </div>
        </div>

        <div class="w-full flex justify-between items-end px-2">
            <div class="text-xs text-gray-500 flex flex-col gap-1 font-medium">
                <span class="flex items-center gap-1">✨ 免费游玩</span>
                <span class="flex items-center gap-1">🎯 误差需在 <b class="text-rose-500">±100ms</b> 内</span>
            </div>
            <button onclick="openRewardsModal()" class="bg-gradient-to-r from-amber-400 to-orange-400 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md shadow-amber-200 flex items-center gap-1.5 active:scale-95 transition-transform animate-float">
                <span>🎁</span>成就奖励
            </button>
        </div>

        <div class="game-container" id="gameBox">
            
            <!-- Target Display -->
            <div class="absolute top-8 w-full text-center z-10">
                <div class="text-slate-400 text-sm font-bold mb-1 tracking-widest">目标时间</div>
                <div class="text-3xl font-black text-rose-400 font-mono tabular-nums tracking-wider" id="targetDisplay">-.---s</div>
            </div>

            <!-- Timer Display -->
            <div class="z-10 mt-4">
                <div class="timer-display font-mono font-black text-sky-400 tabular-nums tracking-wider" id="timerDisplay">0.000</div>
            </div>

            <!-- Big Red Button -->
            <div class="absolute bottom-12 w-full flex justify-center z-20">
                <button id="actionBtn" onclick="handleAction()" class="hit-btn w-32 h-32 rounded-full border-4 border-red-900/50 flex items-center justify-center text-white font-black text-2xl tracking-widest">
                    开始
                </button>
            </div>
            
            <!-- Countdown Overlay -->
            <div id="countdownOverlay" class="absolute inset-0 bg-black/60 flex items-center justify-center z-30 hidden">
                <span id="countdownText" class="text-8xl font-black text-white drop-shadow-lg animate-pop">3</span>
            </div>

            <!-- Result Overlay -->
            <div id="resultOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-40 hidden p-6 text-center">
                <h2 id="resultTitle" class="text-3xl font-black mb-2 animate-pop text-white">挑战成功!</h2>
                <div class="text-slate-300 text-sm mb-4">你的成绩</div>
                <div id="resultTime" class="text-5xl font-mono font-black text-sky-400 mb-2 tabular-nums">5.023s</div>
                <div id="resultDiff" class="text-lg font-bold text-rose-400 mb-8 bg-rose-500/20 px-4 py-1 rounded-full border border-rose-500/30">误差: +0.023s</div>
                
                <button onclick="resetGameUI()" class="bg-gradient-to-r from-sky-400 to-blue-500 active:scale-95 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-sky-500/30 transition-transform">
                    准备下一局
                </button>
            </div>

            <!-- API Loading Overlay -->
            <div id="gameLoadingOverlay" class="loading-overlay hidden">
                <div class="flex flex-col items-center gap-3">
                    <svg class="animate-spin h-10 w-10 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm font-bold text-gray-700" id="loadingText">处理中...</span>
                </div>
            </div>
        </div>
    </main>

    <div id="rewardsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-50 transition-transform flex flex-col max-h-[80vh]" id="rewardsModalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                    🏆 成功次数奖励
                </h3>
                <button onclick="closeRewardsModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto no-scrollbar flex-1 -mx-2 px-2" id="rewardsList">
                <!-- Dynamic List -->
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full shadow-lg text-sm font-medium hidden z-[70] whitespace-nowrap"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html';
        }

        document.getElementById('identityText').innerText = myIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_POINTS_FILE = `data/${myIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const MY_GAME_FILE = `data/${myIdentity === '哼哼' ? 'hyjsk' : 'qyjsk'}.json`;

        let myData = { points: 0, inventory: {}, pendingUses: [], sha: null };
        let gameData = { successCount: 0, bestDiff: 9999, claimedRewards: [], sha: null };

        const REWARD_TIERS = [
            { count: 1, points: 1 },
            { count: 3, points: 3 },
            { count: 5, points: 5 },
            { count: 7, points: 5 },
            { count: 9, points: 5 },
            { count: 10, points: 10 },
            { count: 15, points: 10 },
            { count: 20, points: 15 },
            { count: 25, points: 15 },
            { count: 30, points: 20 },
            { count: 35, points: 20 },
            { count: 40, points: 25 },
            { count: 45, points: 25 },
            { count: 50, points: 30 },
            { count: 60, points: 30 },
            { count: 70, points: 40 },
            { count: 80, points: 40 },
            { count: 90, points: 40 },
            { count: 100, points: 50 }
        ];

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null };
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                console.error("Fetch error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update error:", error);
                return { success: false };
            }
        }

        async function refreshData() {
            document.getElementById('myPoints').innerText = '...';
            document.getElementById('highScoreDisplay').innerText = '...';

            const [pointsRes, gameRes] = await Promise.all([
                fetchFile(MY_POINTS_FILE),
                fetchFile(MY_GAME_FILE)
            ]);

            if (pointsRes.data && !pointsRes.error) {
                myData = { ...myData, ...pointsRes.data, sha: pointsRes.sha };
                if(typeof myData.points !== 'number') myData.points = 0;
            }

            if (gameRes.data && !gameRes.error) {
                gameData = { ...gameData, ...gameRes.data, sha: gameRes.sha };
                if(typeof gameData.successCount !== 'number') gameData.successCount = 0;
                if(typeof gameData.bestDiff !== 'number') gameData.bestDiff = 9999;
                if(!Array.isArray(gameData.claimedRewards)) gameData.claimedRewards = [];
            } else if (gameRes.data === null) {
                gameData = { successCount: 0, bestDiff: 9999, claimedRewards: [], sha: null };
            }

            document.getElementById('myPoints').innerText = myData.points;
            document.getElementById('highScoreDisplay').innerText = gameData.successCount;
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

        let currentState = 'IDLE';
        let targetSeconds = 0;
        let startTimestamp = 0;
        let animationFrameId;

        const targetDisplay = document.getElementById('targetDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const actionBtn = document.getElementById('actionBtn');

        function formatTime(ms) {
            return (ms / 1000).toFixed(3);
        }

        function generateTarget() {
            return Math.floor(Math.random() * 9) + 4; 
        }

        function resetGameUI() {
            currentState = 'IDLE';
            targetSeconds = generateTarget();
            targetDisplay.innerText = `${targetSeconds}.000s`;
            targetDisplay.classList.remove('text-slate-500');
            targetDisplay.classList.add('text-rose-400');
            timerDisplay.innerText = "0.000";
            timerDisplay.style.opacity = "1";
            
            actionBtn.innerText = "开始";
            actionBtn.classList.remove('disabled');
            document.getElementById('resultOverlay').classList.add('hidden');
        }

        async function handleAction() {
            if (currentState === 'IDLE') {
                await startChallenge();
            } else if (currentState === 'RUNNING') {
                stopChallenge();
            }
        }

        async function startChallenge() {
            startCountdown();
        }

        function startCountdown() {
            currentState = 'COUNTDOWN';
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownText = document.getElementById('countdownText');
            countdownOverlay.classList.remove('hidden');
            
            let count = 3;
            countdownText.innerText = count;
            countdownText.classList.remove('animate-pop');
            void countdownText.offsetWidth; 
            countdownText.classList.add('animate-pop');

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                    countdownText.classList.remove('animate-pop');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('animate-pop');
                } else {
                    clearInterval(countInterval);
                    countdownOverlay.classList.add('hidden');
                    startGameLoop();
                }
            }, 1000);
        }

        function startGameLoop() {
            currentState = 'RUNNING';
            actionBtn.classList.remove('disabled');
            actionBtn.innerText = "暂停!";
            
            startTimestamp = performance.now();
            updateTimer();
        }

        function updateTimer() {
            if (currentState !== 'RUNNING') return;

            const now = performance.now();
            const elapsed = now - startTimestamp;
            
            if (elapsed > (targetSeconds * 1000 + 5000)) {
                stopChallenge();
                return;
            }

            let displayValue = formatTime(elapsed);
            let isVisible = true;

            if (targetSeconds > 3 && elapsed > 3000) {
                const remainder = elapsed % 3000;
                isVisible = remainder < 200;
            }

            if (isVisible) {
                timerDisplay.innerText = displayValue;
                timerDisplay.style.opacity = "1";
            } else {
                timerDisplay.innerText = "-.---";
                timerDisplay.style.opacity = "0.3";
            }

            animationFrameId = requestAnimationFrame(updateTimer);
        }

        async function stopChallenge() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            currentState = 'FINISHED';
            actionBtn.classList.add('disabled');

            const finalTimeMs = performance.now() - startTimestamp;
            const diffMs = finalTimeMs - (targetSeconds * 1000);
            const absDiff = Math.abs(diffMs);
            const isSuccess = absDiff <= 100; 

            timerDisplay.innerText = formatTime(finalTimeMs);
            timerDisplay.style.opacity = "1";

            const resultTitle = document.getElementById('resultTitle');
            const resultTime = document.getElementById('resultTime');
            const resultDiff = document.getElementById('resultDiff');
            const resultOverlay = document.getElementById('resultOverlay');

            resultTime.innerText = formatTime(finalTimeMs) + 's';
            
            let sign = diffMs > 0 ? '+' : '';
            resultDiff.innerText = `误差: ${sign}${(diffMs/1000).toFixed(3)}s`;

            if (isSuccess) {
                resultTitle.innerText = "🎉 挑战成功!";
                resultTitle.className = "text-3xl font-black mb-2 animate-pop text-green-400";
                resultDiff.className = "text-lg font-bold text-green-400 mb-8 bg-green-500/20 px-4 py-1 rounded-full border border-green-500/30";
                
                await handleSuccessRecord(absDiff, targetSeconds);
            } else {
                resultTitle.innerText = "💥 挑战失败";
                resultTitle.className = "text-3xl font-black mb-2 animate-pop text-rose-500";
                resultDiff.className = "text-lg font-bold text-rose-400 mb-8 bg-rose-500/20 px-4 py-1 rounded-full border border-rose-500/30";
                
                if (absDiff <= 200) {
                    showToast("就差一点点了！再接再厉");
                }
            }

            resultOverlay.classList.remove('hidden');
        }

        async function handleSuccessRecord(diffMs, targetVal) {
            const overlay = document.getElementById('gameLoadingOverlay');
            document.getElementById('loadingText').innerText = "记录成绩中...";
            overlay.classList.remove('hidden');

            const freshGameRes = await fetchFile(MY_GAME_FILE);
            
            let latestCount = (freshGameRes.data?.successCount || 0) + 1;
            let latestBestDiff = freshGameRes.data?.bestDiff ?? 9999;
            
            if (diffMs < latestBestDiff) {
                latestBestDiff = diffMs;
            }

            const updateGameRes = await updateFile(MY_GAME_FILE, {
                successCount: latestCount,
                bestDiff: latestBestDiff,
                claimedRewards: freshGameRes.data?.claimedRewards || []
            }, freshGameRes.sha, `Success record: target ${targetVal}s, diff ${diffMs.toFixed(0)}ms`);
            
            overlay.classList.add('hidden');

            if (updateGameRes.success) {
                gameData.successCount = latestCount;
                gameData.bestDiff = latestBestDiff;
                gameData.sha = updateGameRes.sha;
                document.getElementById('highScoreDisplay').innerText = latestCount;
                showToast("🏆 成功记录已保存！");
            } else {
                showToast("成绩上传失败，但算你赢啦");
            }
        }

        function openRewardsModal() {
            renderRewards();
            const modal = document.getElementById('rewardsModal');
            const content = document.getElementById('rewardsModalContent');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-50');
                content.classList.add('scale-100');
            });
        }

        function closeRewardsModal() {
            const modal = document.getElementById('rewardsModal');
            const content = document.getElementById('rewardsModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-50');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function renderRewards() {
            const list = document.getElementById('rewardsList');
            let html = '';
            
            REWARD_TIERS.forEach(tier => {
                const isClaimed = gameData.claimedRewards && gameData.claimedRewards.includes(tier.count);
                const canClaim = !isClaimed && gameData.successCount >= tier.count;
                
                let btnHtml = '';
                if (isClaimed) {
                    btnHtml = `<button disabled class="text-[11px] font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-400 cursor-not-allowed">已领取</button>`;
                } else if (canClaim) {
                    // Added claim-btn class to identify these easily
                    btnHtml = `<button onclick="claimReward(this, ${tier.count}, ${tier.points})" class="claim-btn text-[11px] font-bold px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 active:scale-95 text-white shadow-md transition-all">领取</button>`;
                } else {
                    btnHtml = `<div class="text-[11px] font-medium text-gray-400 px-2 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>未解锁</div>`;
                }
                
                html += `
                <div class="flex justify-between items-center bg-gray-50 border border-gray-100 rounded-xl p-3 mb-2 transition-colors ${canClaim ? 'border-amber-200 bg-amber-50/30' : ''}">
                    <div>
                        <div class="font-bold text-gray-700 text-sm">累计成功 ${tier.count} 次</div>
                        <div class="text-[11px] text-amber-600 font-medium flex items-center gap-1 mt-0.5">🪙 奖励 ${tier.points} 积分</div>
                    </div>
                    <div>
                        ${btnHtml}
                    </div>
                </div>
                `;
            });
            list.innerHTML = html;
        }

        async function claimReward(btn, countThreshold, rewardPoints) {
            // FIX: Disable ALL buttons immediately to prevent duplicate requests / SHA conflicts
            const allClaimBtns = document.querySelectorAll('.claim-btn');
            allClaimBtns.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.classList.remove('active:scale-95'); // Remove click effect visually
            });

            btn.innerText = "领取中...";

            try {
                const freshGameRes = await fetchFile(MY_GAME_FILE);
                if (freshGameRes.error) throw new Error("网络错误");
                
                let latestClaimed = freshGameRes.data?.claimedRewards || [];
                if (latestClaimed.includes(countThreshold)) {
                    gameData.claimedRewards = latestClaimed; 
                    throw new Error("该奖励已领取！");
                }
                
                let latestSuccessCount = freshGameRes.data?.successCount || 0;
                if (latestSuccessCount < countThreshold) {
                    throw new Error("成功次数未达到要求！");
                }

                const freshPointsRes = await fetchFile(MY_POINTS_FILE);
                if (freshPointsRes.error) throw new Error("获取积分失败");

                let latestPoints = freshPointsRes.data?.points || 0;
                let newPoints = latestPoints + rewardPoints;

                const pointsUpdateRes = await updateFile(MY_POINTS_FILE, {
                    ...freshPointsRes.data,
                    points: newPoints
                }, freshPointsRes.sha, `Reaction game reward (Count ${countThreshold}): +${rewardPoints}`);

                if (!pointsUpdateRes.success) throw new Error("积分发放失败");

                latestClaimed.push(countThreshold);
                const gameUpdateRes = await updateFile(MY_GAME_FILE, {
                    ...freshGameRes.data,
                    claimedRewards: latestClaimed
                }, freshGameRes.sha, `Claimed reward for success count ${countThreshold}`);

                myData.points = newPoints;
                myData.sha = pointsUpdateRes.sha;
                gameData.claimedRewards = latestClaimed;
                if (gameUpdateRes.success) gameData.sha = gameUpdateRes.sha;

                document.getElementById('myPoints').innerText = myData.points;
                showToast(`🎉 成功领取 ${rewardPoints} 积分！`);

            } catch (err) {
                showToast(err.message || "领取失败，请重试");
            } finally {
                // FIX: Whether successful or failed, unconditionally re-render the list 
                // to correctly restore the button states based on the latest data.
                renderRewards();
            }
        }

        window.onload = function() {
            resetGameUI();
            refreshData(); 
        };
        
    </script>
</body>
</html>
