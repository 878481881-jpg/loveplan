<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱股市 📈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { background-color: #f43f5e; color: white; border-color: #f43f5e; box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.2); }
        .tab-inactive { background-color: white; color: #6b7280; border-color: #e5e7eb; }

        .time-btn-active { background-color: #fdf2f8; color: #db2777; border-color: #fbcfe8; font-weight: bold; }
        .time-btn-inactive { background-color: #fafafa; color: #9ca3af; border-color: #f3f4f6; }

        .text-up { color: #ef4444; } 
        .text-down { color: #10b981; } 
        
        /* 隐藏数字输入框自带的上下小箭头 */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* 走势图交互点样式 */
        .chart-point { cursor: pointer; transition: all 0.2s; }
        .chart-point:hover { stroke-width: 4px; r: 8px; }
        .chart-point.active { stroke-width: 3px; r: 6px; stroke: #db2777; fill: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 pb-20">
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">

        </a>

        </button>

            <div class="relative z-10 flex justify-between items-end">

    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800/95 backdrop-blur text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!myIdentity) {
            localStorage.setItem('loveGacha_myIdentity', '演示用户');
        }

        const safeIdentity = myIdentity || '演示用户';
        document.getElementById('identityText').innerText = safeIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_FILE = `data/${safeIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const STOCK_FILE = 'data/laczgp.json';
        
        let myData = { 
            points: 1000, 
            inventory: {}, 
            stocks: { love_growth: 0 }, 
            tradeHistory: [], 
            sha: null 
        }; 
        let stockData = { 
            currentPrice: 1.0000, 
            history: [], 
            lastUpdatePeriod: "", 
            sha: null 
        };
        
        // 调整了 tradeState, 增加了 inputVal 和 maxInput 用于区分输入值和实际股数
        let tradeState = { type: 'buy', inputVal: 0, qty: 0, maxInput: 0, price: 0 };
        let chartState = { range: '30d', activePointIndex: -1, currentChartData: [] };

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function getPeriodString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const hour = date.getHours();
            let period = 0;
            if (hour >= 6 && hour < 12) period = 6;
            else if (hour >= 12 && hour < 18) period = 12;
            else if (hour >= 18) period = 18;
            
            return `${dateStr}_${period}`;
        }

        function getCurrentPeriodString() { return getPeriodString(new Date()); }

        function parsePeriod(periodStr) {
            if (!periodStr) return new Date();
            const parts = periodStr.split('_');
            if (parts.length !== 2) return new Date();
            const datePart = parts[0];
            const hourPart = parts[1];
            const datePieces = datePart.split('-');
            if (datePieces.length !== 3) return new Date();
            const [y, m, d] = datePieces;
            return new Date(y, m - 1, d, parseInt(hourPart), 0, 0, 0);
        }

        function formatTime(timestamp, formatType) {
            const d = new Date(timestamp);
            const MM = String(d.getMonth() + 1).padStart(2, '0');
            const DD = String(d.getDate()).padStart(2, '0');
            const HH = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            if (formatType === 'time') return `${HH}:${mm}`;
            if (formatType === 'date') return `${MM}-${DD}`;
            return `${MM}-${DD} ${HH}:${mm}`;
        }

        setInterval(() => {
            const now = new Date();
            const hour = now.getHours();
            let nextHour = 24;
            if (hour < 6) nextHour = 6;
            else if (hour < 12) nextHour = 12;
            else if (hour < 18) nextHour = 18;

            const nextTime = new Date(now);
            if (nextHour === 24) {
                nextTime.setDate(now.getDate() + 1);
                nextTime.setHours(0, 0, 0, 0);
            } else {
                nextTime.setHours(nextHour, 0, 0, 0);
            }

            const diff = nextTime - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('timeToNext').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        window.onload = async function() {
            setChartRange('30d');
            await refreshData();
        };

        async function fetchFile(filePath) {
            if (!GITHUB_TOKEN) {
                console.warn("无 GitHub Token，使用本地模拟数据");
                const currentPeriod = getCurrentPeriodString();
                
                let mockHistory = [];
                let startPrice = 1.0000;
                let now = new Date();
                let cursorDate = new Date(now.getTime() - 30 * 24 * 3600 * 1000);
                cursorDate.setHours(0,0,0,0);

                while (cursorDate <= now) {
                    const hours = [0, 6, 12, 18];
                    for(let h of hours) {
                        let stepDate = new Date(cursorDate);
                        stepDate.setHours(h);
                        if (stepDate > now) break;
                        
                        const fluctuationPercent = ((Math.random() * 3) - 1); 
                        startPrice = startPrice * (1 + (fluctuationPercent / 100));
                        if(startPrice < 0.01) startPrice = 0.01;
                        
                        mockHistory.push({
                            timestamp: stepDate.getTime(),
                            price: parseFloat(startPrice.toFixed(4))
                        });
                    }
                    cursorDate.setDate(cursorDate.getDate() + 1);
                }

                const mockStock = {
                    currentPrice: mockHistory[mockHistory.length-1].price, 
                    lastUpdatePeriod: currentPeriod,
                    history: mockHistory
                };

                let mockTradeHistory = [];
                if(mockHistory.length > 20) {
                     mockTradeHistory.push({
                         timestamp: mockHistory[mockHistory.length - 20].timestamp,
                         type: 'buy', price: mockHistory[mockHistory.length - 20].price, qty: 100
                     });
                     mockTradeHistory.push({
                         timestamp: mockHistory[mockHistory.length - 5].timestamp,
                         type: 'sell', price: mockHistory[mockHistory.length - 5].price, qty: 50
                     });
                }

                const mockUser = { 
                    points: 5000, 
                    stocks: {love_growth: 50}, 
                    tradeHistory: mockTradeHistory
                };

                return new Promise(resolve => {
                    setTimeout(() => {
                        resolve({ data: filePath === STOCK_FILE ? mockStock : mockUser, sha: "mock", is404: false });
                    }, 800); 
                });
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null, is404: true };
                if (!response.ok) throw new Error('Network response not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha, is404: false };
            } catch (error) {
                console.error("Fetch Error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            if (!GITHUB_TOKEN) return { success: true, sha: "mock" }; 

            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update Error:", error);
                return { success: false };
            }
        }

        async function refreshData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');

            const [myRes, stockRes] = await Promise.all([
                fetchFile(MY_FILE), fetchFile(STOCK_FILE)
            ]);

            if (myRes.error || stockRes.error) {
                showToast("获取数据失败，请检查网络");
                document.getElementById('loadingView').classList.add('hidden');
                return;
            }

            if (myRes.data) {
                myData = { ...myData, ...myRes.data, sha: myRes.sha };
                if(typeof myData.points !== 'number') myData.points = 0;
                if(!myData.stocks) myData.stocks = { love_growth: 0 };
                if(!myData.tradeHistory) myData.tradeHistory = []; 
            }

            let needUpdateStock = false;
            let newPrice = 1.0000;
            const currentPeriod = getCurrentPeriodString();
            const currentDate = new Date();

            if (stockRes.is404 || !stockRes.data) {
                stockData = {
                    currentPrice: 1.0000, 
                    lastUpdatePeriod: currentPeriod,
                    history: [{ timestamp: parsePeriod(currentPeriod).getTime(), price: 1.0000 }],
                    sha: null
                };
                needUpdateStock = true;
            } else {
                stockData = { ...stockData, ...stockRes.data, sha: stockRes.sha };
                newPrice = stockData.currentPrice;
                
                if (stockData.lastUpdatePeriod !== currentPeriod) {
                    let lastDate = parsePeriod(stockData.lastUpdatePeriod);
                    
                    if (currentDate.getTime() - lastDate.getTime() > 30 * 24 * 60 * 60 * 1000) {
                        lastDate = new Date(currentDate.getTime() - 30 * 24 * 60 * 60 * 1000);
                        lastDate = parsePeriod(getPeriodString(lastDate)); 
                    }

                    while (getPeriodString(lastDate) !== currentPeriod) {
                        lastDate.setHours(lastDate.getHours() + 6, 0, 0, 0);
                        const fluctuationPercent = parseFloat(((Math.random() * 3) - 1).toFixed(2));
                        
                        newPrice = newPrice * (1 + (fluctuationPercent / 100));
                        newPrice = parseFloat(newPrice.toFixed(4));
                        if (newPrice <= 0.0001) newPrice = 0.0001; 
                        
                        stockData.history.push({ 
                            timestamp: lastDate.getTime(), price: newPrice 
                        });
                    }
                    
                    stockData.currentPrice = newPrice;
                    stockData.lastUpdatePeriod = currentPeriod;
                    
                    if (stockData.history.length > 1000) { 
                        stockData.history = stockData.history.slice(-1000);
                    }
                    needUpdateStock = true;
                }
            }

            if (needUpdateStock && GITHUB_TOKEN) {
                document.getElementById('loadingView').querySelector('p').innerText = "计算最新行情中...";
                const res = await updateFile(STOCK_FILE, {
                    currentPrice: stockData.currentPrice,
                    lastUpdatePeriod: stockData.lastUpdatePeriod,
                    history: stockData.history
                }, stockData.sha, "System: Auto update love stock price");
                
                if (res.success) stockData.sha = res.sha;
            }

            updateUI();
            
            chartState.activePointIndex = -1;
            drawChart();

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
        }

        function drawChart() {
            const svg = document.getElementById('stockChart');
            const history = stockData.history;
            
            if (!history || history.length < 1) {
                svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#9ca3af" font-size="12">暂无数据</text>`;
                return;
            }

            const nowTs = Date.now();
            let timeLimit = 0;
            if (chartState.range === '1d') timeLimit = nowTs - 24 * 3600 * 1000;
            else if (chartState.range === '3d') timeLimit = nowTs - 3 * 24 * 3600 * 1000;
            else if (chartState.range === '7d') timeLimit = nowTs - 7 * 24 * 3600 * 1000;
            else if (chartState.range === '30d') timeLimit = nowTs - 30 * 24 * 3600 * 1000;

            let chartData = history.filter(d => d.timestamp >= timeLimit);
            
            if (chartData.length < 2 && history.length >= 2) {
                chartData = history.slice(-2); 
            } else if (chartData.length === 1) {
                 chartData = [
                     { timestamp: chartData[0].timestamp - 3600000, price: chartData[0].price },
                     chartData[0]
                 ];
            }
            chartState.currentChartData = chartData;

            if (chartState.activePointIndex === -1) {
                updateDefaultTooltip();
            }

            const width = 800;  
            const height = 300; 
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.setAttribute('preserveAspectRatio', 'none'); 
            
            const pad = { top: 30, right: 65, bottom: 30, left: 15 }; 
            const innerW = width - pad.left - pad.right;
            const innerH = height - pad.top - pad.bottom;

            const prices = chartData.map(d => d.price);
            let minPrice = Math.min(...prices);
            let maxPrice = Math.max(...prices);
            
            const priceMargin = (maxPrice - minPrice) * 0.1 || 0.05; 
            minPrice = minPrice - priceMargin;
            maxPrice = maxPrice + priceMargin;
            const priceRange = maxPrice - minPrice;

            const minTs = chartData[0].timestamp;
            const maxTs = chartData[chartData.length - 1].timestamp;
            const tsRange = maxTs - minTs;

            const mapX = (ts) => pad.left + ((ts - minTs) / tsRange) * innerW;
            const mapY = (price) => pad.top + innerH - ((price - minPrice) / priceRange) * innerH;

            let svgHtml = '';

            for (let i = 0; i <= 4; i++) {
                const yPrice = maxPrice - (priceRange * (i / 4)); 
                const yPos = mapY(yPrice);
                
                svgHtml += `<line x1="${pad.left}" y1="${yPos}" x2="${width - pad.right}" y2="${yPos}" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="4 4" />`;
                svgHtml += `<text x="${width - pad.right + 10}" y="${yPos + 4}" fill="#9ca3af" font-size="12" font-family="monospace">${yPrice.toFixed(4)}</text>`;
            }

            const xPoints = [
                { ts: minTs, align: 'start', offset: 0 },
                { ts: minTs + tsRange / 2, align: 'middle', offset: 0 },
                { ts: maxTs, align: 'end', offset: 0 }
            ];
            xPoints.forEach((pt, i) => {
                let xPos = mapX(pt.ts);
                const format = chartState.range === '1d' ? 'time' : 'date';
                const label = formatTime(pt.ts, format);
                svgHtml += `<text x="${xPos}" y="${height - 5}" fill="#9ca3af" font-size="12" text-anchor="${pt.align}">${label}</text>`;
            });

            let pathCmds = chartData.map((d, i) => {
                return `${i === 0 ? 'M' : 'L'} ${mapX(d.timestamp)} ${mapY(d.price)}`;
            }).join(' ');

            const isUp = chartData[chartData.length-1].price >= chartData[0].price;
            const strokeColor = isUp ? '#ef4444' : '#10b981';
            const fillId = isUp ? 'gradUp' : 'gradDown';

            svgHtml += `
                <defs>
                    <linearGradient id="gradUp" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
                    </linearGradient>
                    <linearGradient id="gradDown" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
                    </linearGradient>
                </defs>
            `;

            const fillPath = `${pathCmds} L ${mapX(maxTs)} ${pad.top + innerH} L ${mapX(minTs)} ${pad.top + innerH} Z`;
            svgHtml += `<path d="${fillPath}" fill="url(#${fillId})" />`;
            
            svgHtml += `<path d="${pathCmds}" fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300"/>`;

            if (myData.tradeHistory && myData.tradeHistory.length > 0) {
                const visibleTrades = myData.tradeHistory.filter(t => t.timestamp >= minTs && t.timestamp <= maxTs);
                
                visibleTrades.forEach(trade => {
                    let matchedNode = chartData[0]; 
                    for (let i = chartData.length - 1; i >= 0; i--) {
                        if (chartData[i].timestamp <= trade.timestamp) {
                            matchedNode = chartData[i];
                            break;
                        }
                    }

                    if (matchedNode) {
                        const cx = mapX(matchedNode.timestamp);
                        const cy = mapY(matchedNode.price);
                        
                        const isBuy = trade.type === 'buy';
                        const bgColor = isBuy ? '#ef4444' : '#10b981'; 
                        const label = isBuy ? 'B' : 'S';
                        
                        svgHtml += `
                            <circle cx="${cx}" cy="${cy}" r="10" fill="${bgColor}" stroke="#fff" stroke-width="2" />
                            <text x="${cx}" y="${cy + 4}" fill="#fff" font-size="12" font-weight="900" font-family="Arial" text-anchor="middle">${label}</text>
                        `;
                    }
                });
            }

            chartData.forEach((d, i) => {
                const cx = mapX(d.timestamp);
                const cy = mapY(d.price);
                const isActive = chartState.activePointIndex === i;
                
                svgHtml += `<circle cx="${cx}" cy="${cy}" r="${isActive ? 5 : 2}" fill="${isActive ? '#fff' : strokeColor}" stroke="${strokeColor}" stroke-width="${isActive ? 2 : 0}" style="pointer-events: none;" class="transition-all duration-200"/>`;
                
                if (isActive) {
                    svgHtml += `<line x1="${cx}" y1="${pad.top}" x2="${cx}" y2="${pad.top + innerH}" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4" style="pointer-events: none;"/>`;
                }

                svgHtml += `<circle cx="${cx}" cy="${cy}" r="30" fill="transparent" class="chart-point" 
                                onclick="handleChartClick(${i})" 
                                ontouchstart="handleChartClick(${i})" />`;
            });

            svg.innerHTML = svgHtml;
        }

        function handleChartClick(index) {
            if (chartState.activePointIndex === index) {
                chartState.activePointIndex = -1;
                drawChart();
                return;
            }

            chartState.activePointIndex = index;
            drawChart(); 
            
            const data = chartState.currentChartData[index];
            const prevData = index > 0 ? chartState.currentChartData[index - 1] : null;
            
            const tooltip = document.getElementById('chartTooltip');
            const timeStr = formatTime(data.timestamp, 'full');
            
            let changeHtml = `<span class="text-gray-400 font-bold">--</span>`;
            if (prevData) {
                const change = data.price - prevData.price;
                const percent = (change / prevData.price) * 100;
                if (change > 0) {
                    changeHtml = `<span class="text-up font-bold">涨 +${change.toFixed(4)} (+${percent.toFixed(2)}%)</span>`;
                } else if (change < 0) {
                    changeHtml = `<span class="text-down font-bold">跌 ${change.toFixed(4)} (${percent.toFixed(2)}%)</span>`;
                } else {
                    changeHtml = `<span class="text-gray-500 font-bold">平 0.00%</span>`;
                }
            } else {
                changeHtml = `<span class="text-gray-400 text-xs bg-gray-100 px-2 py-0.5 rounded-full">无上期数据</span>`;
            }

            tooltip.innerHTML = `
                <div class="flex-1">
                    <div class="text-[10px] text-gray-500 mb-0.5">${timeStr}</div>
                    <div class="text-2xl font-black font-mono text-gray-800 tracking-tighter">${data.price.toFixed(4)}</div>
                </div>
                <div class="text-right flex flex-col justify-center items-end border-l border-gray-200 pl-4">
                    <div class="text-[10px] text-gray-400 mb-1">与上阶段比</div>
                    ${changeHtml}
                </div>
            `;
            
            tooltip.classList.add('scale-[1.02]');
            setTimeout(() => tooltip.classList.remove('scale-[1.02]'), 150);
        }

        function changeTradeInput(type) {
            let delta = 0;
            if (type === 'subLarge') delta = -100;
            else if (type === 'subSmall') delta = -10;
            else if (type === 'addSmall') delta = 10;
            else if (type === 'addLarge') delta = 100;

            let newVal = tradeState.inputVal + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > tradeState.maxInput) newVal = tradeState.maxInput;
            tradeState.inputVal = Math.floor(newVal);
            updateTradeUI();
        }

        function handleManualInput(val) {
            let num = parseInt(val, 10);
            if (isNaN(num)) {
                tradeState.inputVal = 0;
            } else {
                if (num > tradeState.maxInput) num = tradeState.maxInput;
                if (num < 0) num = 0;
                tradeState.inputVal = num;
                if (parseInt(val, 10) > tradeState.maxInput) {
                    document.getElementById('tradeQtyDisplay').value = num;
                }
            }
            updateTradeUI();
        }

        function handleManualBlur(val) {
            let num = parseInt(val, 10);
            if (isNaN(num) || num <= 0) {
                let defaultVal = Math.ceil(tradeState.price);
                tradeState.inputVal = tradeState.maxInput >= defaultVal ? defaultVal : (tradeState.maxInput > 0 ? tradeState.maxInput : 0);
            } else {
                tradeState.inputVal = num;
            }
            updateTradeUI();
        }

        function updateTradeUI() {
            document.getElementById('tradeQtyDisplay').value = tradeState.inputVal;
            
            const totalLabel = document.getElementById('tradeTotalPrice');
            const hint = document.getElementById('tradeActualCostHint');
            
            let shares = parseFloat((tradeState.inputVal / tradeState.price).toFixed(2));
            
            if (tradeState.type === 'buy') {
                tradeState.qty = shares; 
                const actualCost = (tradeState.qty * tradeState.price).toFixed(2);
                
                totalLabel.innerText = `${tradeState.qty.toFixed(2)} 股`;
                totalLabel.classList.remove('text-green-600');
                totalLabel.classList.add('text-red-500');

                hint.classList.remove('hidden');
                hint.innerText = `实际消耗: -${actualCost} 积分`;
            } else {
                tradeState.qty = shares;
                // 防止因精度导致的无法清仓问题
                if (tradeState.inputVal >= tradeState.maxInput) {
                    tradeState.qty = parseFloat((myData.stocks.love_growth || 0).toFixed(2));
                }
                const actualRev = (tradeState.qty * tradeState.price).toFixed(2);
                
                totalLabel.innerText = `${tradeState.qty.toFixed(2)} 股`;
                totalLabel.classList.remove('text-red-500');
                totalLabel.classList.add('text-green-600');

                hint.classList.remove('hidden');
                hint.innerText = `实际可得: +${actualRev} 积分`;
            }
        }

        async function executeTrade() {
            if (tradeState.qty <= 0) {
                return showToast("输入金额无效或余额不足");
            }
            
            const totalCost = parseFloat((tradeState.qty * tradeState.price).toFixed(2));
            
            if (tradeState.type === 'buy') {
                if (myData.points < totalCost) return showToast("积分不足！");
                myData.points -= totalCost;
                myData.stocks.love_growth = parseFloat(((myData.stocks.love_growth || 0) + tradeState.qty).toFixed(2));
            } else {
                if ((myData.stocks.love_growth || 0) < tradeState.qty) return showToast("持仓不足！");
                myData.stocks.love_growth = parseFloat(((myData.stocks.love_growth || 0) - tradeState.qty).toFixed(2));
                myData.points += totalCost;
            }

            myData.points = parseFloat(myData.points.toFixed(2));

            if (!myData.tradeHistory) myData.tradeHistory = [];
            myData.tradeHistory.push({
                timestamp: Date.now(),
                type: tradeState.type,
                price: tradeState.price,
                qty: tradeState.qty
            });

            closeModal('tradeModal', 'tradeModalContent');
            showToast("正在提交交易请求...");

            const action = tradeState.type === 'buy' ? 'Buy' : 'Sell';
            const res = await updateFile(MY_FILE, myData, myData.sha, `${action} ${tradeState.qty} LOVE.GRW at ${tradeState.price}`);

            if (res.success) {
                if(res.sha !== 'mock') myData.sha = res.sha;
                updateUI();
                drawChart(); 
                showToast(`🎉 ${tradeState.type === 'buy' ? '买入' : '兑换'}成功！`);
                if(tradeState.type === 'buy') switchTab('portfolio');
            } else {
                if (tradeState.type === 'buy') {
                    myData.points += totalCost;
                    myData.stocks.love_growth -= tradeState.qty;
                } else {
                    myData.stocks.love_growth += tradeState.qty;
                    myData.points -= totalCost;
                }
                myData.tradeHistory.pop(); 
                showToast("网络拥堵，交易失败，请重试");
                updateUI();
                drawChart();
            }
        }

        function switchTab(tabName) {
            const tabs = ['market', 'portfolio'];
            tabs.forEach(name => {
                const btn = document.getElementById(`tab_${name}`);
                const view = document.getElementById(`view_${name}`);
                if (name === tabName) {
                    btn.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-active";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-inactive";
                    view.classList.add('hidden');
                }
            });
            if(tabName === 'market') drawChart();
        }

        function openModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            });
        }

        function closeModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        let toastTimeout;
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            
            toast.classList.remove('toast-animate');
            void toast.offsetWidth; 
            toast.classList.add('toast-animate'); 
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
