<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱股市 📈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { background-color: #f43f5e; color: white; border-color: #f43f5e; box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.2); }
        .tab-inactive { background-color: white; color: #6b7280; border-color: #e5e7eb; }

        .time-btn-active { background-color: #fdf2f8; color: #db2777; border-color: #fbcfe8; font-weight: bold; }
        .time-btn-inactive { background-color: #fafafa; color: #9ca3af; border-color: #f3f4f6; }

        .text-up { color: #ef4444; } 
        .text-down { color: #10b981; } 
        
        /* 走势图交互点样式 */
        .chart-point { cursor: pointer; transition: all 0.2s; }
        .chart-point:hover { stroke-width: 4px; r: 6px; }
        .chart-point.active { stroke-width: 4px; r: 6px; stroke: #db2777; fill: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 pb-20">
    
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 active:scale-95 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-black text-rose-500 flex items-center justify-center gap-2 drop-shadow-sm">
                📈 恋爱股市
            </h1>
        </div>
        <button onclick="refreshData()" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 active:scale-95 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <!-- 顶部资产卡片 -->
        <div class="w-full bg-gradient-to-r from-rose-400 to-pink-500 rounded-3xl p-5 shadow-lg text-white mb-6 relative overflow-hidden border border-white/20">
            <div class="absolute -right-4 -bottom-4 text-7xl opacity-10 transform rotate-12">💰</div>
            <div class="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIvPjwvc3ZnPg==')] opacity-30"></div>
            
            <div class="relative z-10 flex justify-between items-end">
                <div>
                    <p class="text-xs text-rose-100 mb-1 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                        可用资金 (<span id="identityText">-</span>)
                    </p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-4xl font-black tracking-tight" id="myPoints">--</span>
                        <span class="text-sm font-bold text-rose-100">积分</span>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-rose-100 mb-0.5">持仓总市值</p>
                    <p class="text-lg font-bold" id="portfolioValue">--</p>
                </div>
            </div>
        </div>

        <div class="flex gap-2 w-full mb-6 p-1 bg-gray-100 rounded-full shadow-sm border border-rose-50">
            <button onclick="switchTab('market')" id="tab_market" class="flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-active">股票大盘</button>
            <button onclick="switchTab('portfolio')" id="tab_portfolio" class="flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-inactive">我的持仓</button>
        </div>

        <div id="loadingView" class="w-full flex flex-col items-center py-12 animate-fade-in">
            <div class="w-12 h-12 border-4 border-rose-200 border-t-rose-500 rounded-full animate-spin mb-4"></div>
            <p class="text-rose-400 font-bold tracking-widest text-sm">连接交易所...</p>
        </div>

        <div id="contentView" class="w-full hidden">
            
            <!-- 1. 大盘视图 -->
            <div id="view_market" class="w-full animate-fade-in">
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-4 relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-black text-gray-800 tracking-tight">恋爱成长 <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md font-mono align-middle">LOVE.GRW</span></h2>
                            <p class="text-xs text-gray-400 mt-1">每个时间段 (0,6,12,18点) 报价</p>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-black tracking-tighter" id="currentPrice">--</div>
                            <div class="text-sm font-bold flex items-center justify-end gap-1" id="priceChange">
                                <span>--</span> (<span>--</span>)
                            </div>
                        </div>
                    </div>

                    <!-- 选中节点信息展示区 -->
                    <div id="chartTooltip" class="bg-gray-50/80 rounded-xl p-4 mb-3 border border-gray-100 flex items-center min-h-[64px] text-sm text-gray-400 font-medium">
                        点击图表节点查看详情
                    </div>

                    <!-- K线图/走势图容器 -->
                    <div class="w-full h-56 bg-white rounded-xl relative overflow-hidden border border-gray-100 mb-4">
                        <svg id="stockChart" class="w-full h-full" style="touch-action: none;"></svg>
                    </div>

                    <!-- 时间范围选择器 -->
                    <div class="flex gap-2 w-full mb-5">
                        <button onclick="setChartRange('1d')" id="range_1d" class="flex-1 py-2 rounded-xl text-sm transition-all border time-btn-active">当天</button>
                        <button onclick="setChartRange('3d')" id="range_3d" class="flex-1 py-2 rounded-xl text-sm transition-all border time-btn-inactive">三天</button>
                        <button onclick="setChartRange('7d')" id="range_7d" class="flex-1 py-2 rounded-xl text-sm transition-all border time-btn-inactive">七天</button>
                        <button onclick="setChartRange('30d')" id="range_30d" class="flex-1 py-2 rounded-xl text-sm transition-all border time-btn-inactive">一个月</button>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="promptTrade('sell')" class="flex-1 py-3 bg-green-50 text-green-600 border border-green-200 rounded-2xl font-bold shadow-sm active:scale-95 transition-all text-lg tracking-widest">卖出</button>
                        <button onclick="promptTrade('buy')" class="flex-1 py-3 bg-red-500 text-white rounded-2xl font-bold shadow-md shadow-red-200 active:scale-95 transition-all text-lg tracking-widest">买入</button>
                    </div>
                </div>
                
                <div class="text-center text-xs text-gray-400 mt-2 flex items-center justify-center gap-1 mb-4">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    距下次报价刷新还有 <span id="timeToNext" class="font-mono text-rose-500 font-bold">--:--</span>
                </div>
            </div>

            <!-- 2. 持仓视图 -->
            <div id="view_portfolio" class="w-full animate-fade-in hidden">
                <div class="bg-white rounded-3xl p-1 shadow-sm border border-gray-100 flex flex-col gap-1" id="portfolioList">
                    <!-- 持仓列表由JS渲染 -->
                </div>
                <div class="mt-4 px-2">
                    <h3 class="text-sm font-bold text-gray-700 mb-2 pl-2 border-l-4 border-rose-400">历史交易记录</h3>
                    <div id="tradeHistoryList" class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col divide-y divide-gray-50">
                        <!-- 历史记录由JS渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <div id="tradeModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform" id="tradeModalContent">
            <div class="flex items-center justify-between mb-5 pb-4 border-b border-gray-100">
                <div>
                    <h3 id="tradeTitle" class="font-black text-xl tracking-tight text-gray-800">买入 恋爱成长</h3>
                    <p class="text-xs text-gray-500 mt-1 font-mono">当前价: <span id="tradeUnitPrice" class="font-bold text-gray-800"></span></p>
                </div>
                <div id="tradeIcon" class="w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold"></div>
            </div>
            
            <div class="mb-6">
                <div class="flex justify-between text-xs text-gray-500 mb-2 font-medium">
                    <span>交易数量 (股)</span>
                    <span id="tradeMaxHint">最大可买: --</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-2xl border border-gray-200">
                    <button onclick="changeTradeQty(-10)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-500 rounded-xl shadow-sm border border-gray-100 active:scale-95 transition text-xs font-bold">-10</button>
                    <button onclick="changeTradeQty(-1)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-600 rounded-xl shadow-sm border border-gray-200 active:scale-95 transition text-lg font-bold">-</button>
                    <span id="tradeQtyDisplay" class="flex-1 text-2xl font-black text-gray-800 text-center font-mono">1</span>
                    <button onclick="changeTradeQty(1)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-600 rounded-xl shadow-sm border border-gray-200 active:scale-95 transition text-lg font-bold">+</button>
                    <button onclick="changeTradeQty(10)" class="w-10 h-10 flex items-center justify-center bg-white text-gray-500 rounded-xl shadow-sm border border-gray-100 active:scale-95 transition text-xs font-bold">+10</button>
                </div>
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 flex justify-between items-center mb-6 border border-gray-100">
                <span class="text-sm text-gray-600 font-bold" id="tradeTotalLabel">预计总额</span>
                <span class="text-xl font-black tracking-tight" id="tradeTotalPrice">--</span>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('tradeModal', 'tradeModalContent')" class="flex-1 py-3.5 bg-gray-100 text-gray-600 rounded-2xl font-bold hover:bg-gray-200 transition-colors">取消</button>
                <button id="confirmTradeBtn" class="flex-1 py-3.5 text-white rounded-2xl font-bold shadow-md transition-all text-lg tracking-widest">确认</button>
            </div>
        </div>
    </div>

    <script>
        // --- 初始化与鉴权 ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        // 测试环境防崩溃，若无缓存默认初始化一个身份 (生产环境可解开跳转限制)
        if (!myIdentity) {
            localStorage.setItem('loveGacha_myIdentity', '哼哼');
            // window.location.href = 'index.html'; 
        }

        const safeIdentity = myIdentity || '哼哼';
        document.getElementById('identityText').innerText = safeIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_FILE = `data/${safeIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const STOCK_FILE = 'data/laczgp.json';
        
        // --- 状态管理 ---
        let myData = { 
            points: 0, 
            inventory: {}, 
            stocks: { love_growth: 0 }, 
            tradeHistory: [], // 新增交易历史数组
            sha: null 
        }; 
        let stockData = { 
            currentPrice: 1.0000, 
            history: [], 
            lastUpdatePeriod: "", 
            sha: null 
        };
        
        let tradeState = { type: 'buy', qty: 1, maxQty: 0, price: 0 };
        let chartState = { range: '1d', activePointIndex: -1, currentChartData: [] };

        // --- 工具函数 ---
        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function getPeriodString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const hour = date.getHours();
            let period = 0;
            if (hour >= 6 && hour < 12) period = 6;
            else if (hour >= 12 && hour < 18) period = 12;
            else if (hour >= 18) period = 18;
            
            return `${dateStr}_${period}`;
        }

        function getCurrentPeriodString() { return getPeriodString(new Date()); }

        function parsePeriod(periodStr) {
            const [datePart, hourPart] = periodStr.split('_');
            const [y, m, d] = datePart.split('-');
            return new Date(y, m - 1, d, parseInt(hourPart), 0, 0, 0);
        }

        function formatTime(timestamp, formatType) {
            const d = new Date(timestamp);
            const MM = String(d.getMonth() + 1).padStart(2, '0');
            const DD = String(d.getDate()).padStart(2, '0');
            const HH = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            if (formatType === 'time') return `${HH}:${mm}`;
            if (formatType === 'date') return `${MM}-${DD}`;
            return `${MM}-${DD} ${HH}:${mm}`;
        }

        // 倒计时更新
        setInterval(() => {
            const now = new Date();
            const hour = now.getHours();
            let nextHour = 24;
            if (hour < 6) nextHour = 6;
            else if (hour < 12) nextHour = 12;
            else if (hour < 18) nextHour = 18;

            const nextTime = new Date(now);
            if (nextHour === 24) {
                nextTime.setDate(now.getDate() + 1);
                nextTime.setHours(0, 0, 0, 0);
            } else {
                nextTime.setHours(nextHour, 0, 0, 0);
            }

            const diff = nextTime - now;
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('timeToNext').innerText = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        window.onload = async function() {
            await refreshData();
        };

        // --- GitHub API 交互 ---
        async function fetchFile(filePath) {
            // 简单模拟模式，如果无TOKEN，直接返回模拟数据供预览
            if (!GITHUB_TOKEN) {
                console.warn("无 Token，进入本地预览模式");
                const mockStock = {
                    currentPrice: 1.25, lastUpdatePeriod: getCurrentPeriodString(),
                    history: Array.from({length: 40}, (_,i) => ({ 
                        timestamp: Date.now() - (40-i)*6*3600*1000, 
                        price: 1 + Math.sin(i/3)*0.3 + (i/100) 
                    }))
                };
                const mockUser = { points: 1000, stocks: {love_growth: 100}, tradeHistory: [
                    {timestamp: Date.now() - 48*3600*1000, type:'buy', price: 1.1, qty: 50},
                    {timestamp: Date.now() - 12*3600*1000, type:'sell', price: 1.3, qty: 10}
                ]};
                return { data: filePath === STOCK_FILE ? mockStock : mockUser, sha: "mock", is404: false };
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null, is404: true };
                if (!response.ok) throw new Error('Network response not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha, is404: false };
            } catch (error) {
                console.error("Fetch Error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            if (!GITHUB_TOKEN) return { success: true, sha: "mock" }; // 本地模拟

            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update Error:", error);
                return { success: false };
            }
        }

        async function refreshData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');

            const [myRes, stockRes] = await Promise.all([
                fetchFile(MY_FILE), fetchFile(STOCK_FILE)
            ]);

            if (myRes.error || stockRes.error) {
                showToast("获取数据失败，请检查网络");
                document.getElementById('loadingView').classList.add('hidden');
                return;
            }

            // 个人数据处理
            if (myRes.data) {
                myData = { ...myData, ...myRes.data, sha: myRes.sha };
                if(typeof myData.points !== 'number') myData.points = 0;
                if(!myData.stocks) myData.stocks = { love_growth: 0 };
                if(!myData.tradeHistory) myData.tradeHistory = []; 
            }

            // 股票数据处理与刷新逻辑
            let needUpdateStock = false;
            let newPrice = 1.0000;
            const currentPeriod = getCurrentPeriodString();
            const currentDate = new Date();

            if (stockRes.is404 || !stockRes.data) {
                stockData = {
                    currentPrice: 1.0000, lastUpdatePeriod: currentPeriod,
                    history: [{ timestamp: parsePeriod(currentPeriod).getTime(), price: 1.0000 }],
                    sha: null
                };
                needUpdateStock = true;
            } else {
                stockData = { ...stockData, ...stockRes.data, sha: stockRes.sha };
                newPrice = stockData.currentPrice;
                
                if (stockData.lastUpdatePeriod !== currentPeriod) {
                    let lastDate = parsePeriod(stockData.lastUpdatePeriod);
                    
                    if (currentDate.getTime() - lastDate.getTime() > 30 * 24 * 60 * 60 * 1000) {
                        lastDate = new Date(currentDate.getTime() - 30 * 24 * 60 * 60 * 1000);
                        lastDate = parsePeriod(getPeriodString(lastDate)); 
                    }

                    while (getPeriodString(lastDate) !== currentPeriod) {
                        lastDate.setHours(lastDate.getHours() + 6, 0, 0, 0);
                        const fluctuationPercent = parseFloat(((Math.random() * 3) - 1).toFixed(2));
                        newPrice = newPrice * (1 + (fluctuationPercent / 100));
                        newPrice = parseFloat(newPrice.toFixed(4));
                        if (newPrice <= 0.0001) newPrice = 0.0001; 
                        
                        stockData.history.push({ 
                            timestamp: lastDate.getTime(), price: newPrice 
                        });
                    }
                    
                    stockData.currentPrice = newPrice;
                    stockData.lastUpdatePeriod = currentPeriod;
                    
                    if (stockData.history.length > 500) { // 保留更多用于长图展示
                        stockData.history = stockData.history.slice(-500);
                    }
                    needUpdateStock = true;
                }
            }

            if (needUpdateStock && GITHUB_TOKEN) {
                document.getElementById('loadingView').querySelector('p').innerText = "计算最新行情...";
                const res = await updateFile(STOCK_FILE, {
                    currentPrice: stockData.currentPrice,
                    lastUpdatePeriod: stockData.lastUpdatePeriod,
                    history: stockData.history
                }, stockData.sha, "System: Update stock price");
                
                if (res.success) stockData.sha = res.sha;
                else {
                    const latestStock = await fetchFile(STOCK_FILE);
                    if (!latestStock.error && latestStock.data) {
                         stockData = { ...stockData, ...latestStock.data, sha: latestStock.sha };
                    }
                }
            }

            updateUI();
            
            // 重置图表选中状态并画图
            chartState.activePointIndex = -1;
            document.getElementById('chartTooltip').innerHTML = '<div class="text-xs text-gray-400 font-medium">点击图表节点查看详情</div>';
            drawChart();

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('myPoints').innerText = Number(myData.points).toFixed(2);
            
            const shares = myData.stocks.love_growth || 0;
            const portfolioValue = (shares * stockData.currentPrice).toFixed(2);
            document.getElementById('portfolioValue').innerText = shares > 0 ? portfolioValue : '--';

            const cp = document.getElementById('currentPrice');
            const pc = document.getElementById('priceChange');
            cp.innerText = stockData.currentPrice.toFixed(4);
            
            let prevPrice = stockData.currentPrice;
            if (stockData.history.length > 1) {
                prevPrice = stockData.history[stockData.history.length - 2].price;
            } else if (stockData.history.length === 1 && stockData.history[0].price !== stockData.currentPrice) {
                 prevPrice = stockData.history[0].price;
            }

            const changeAmount = stockData.currentPrice - prevPrice;
            const changePercent = prevPrice > 0 ? (changeAmount / prevPrice * 100) : 0;

            if (changeAmount > 0) {
                cp.className = "text-4xl font-black tracking-tighter text-up";
                pc.className = "text-sm font-bold flex items-center justify-end gap-1 text-up";
                pc.innerHTML = `<span>+${changeAmount.toFixed(4)}</span> (<span>+${changePercent.toFixed(2)}%</span>)`;
            } else if (changeAmount < 0) {
                cp.className = "text-4xl font-black tracking-tighter text-down";
                pc.className = "text-sm font-bold flex items-center justify-end gap-1 text-down";
                pc.innerHTML = `<span>${changeAmount.toFixed(4)}</span> (<span>${changePercent.toFixed(2)}%</span>)`;
            } else {
                cp.className = "text-4xl font-black tracking-tighter text-gray-500";
                pc.className = "text-sm font-bold flex items-center justify-end gap-1 text-gray-400";
                pc.innerHTML = `<span>0.0000</span> (<span>0.00%</span>)`;
            }

            renderPortfolio();
        }

        function renderPortfolio() {
            const list = document.getElementById('portfolioList');
            const shares = myData.stocks.love_growth || 0;
            
            if (shares <= 0) {
                list.innerHTML = `
                    <div class="p-8 text-center flex flex-col items-center">
                        <div class="text-4xl opacity-40 mb-3">🕸️</div>
                        <p class="text-gray-400 text-sm font-medium">当前没有持有股票</p>
                        <button onclick="switchTab('market')" class="mt-4 px-5 py-2 bg-rose-50 text-rose-500 rounded-xl text-xs font-bold active:scale-95 transition">去市场逛逛</button>
                    </div>
                `;
            } else {
                const totalValue = (shares * stockData.currentPrice).toFixed(2);
                list.innerHTML = `
                    <div class="p-4 rounded-2xl bg-white flex justify-between items-center relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-rose-400 to-pink-500"></div>
                        <div class="pl-2">
                            <h3 class="font-bold text-gray-800 flex items-center gap-2">
                                恋爱成长 <span class="bg-pink-50 text-pink-500 text-[10px] px-2 py-0.5 rounded-full font-mono">LOVE.GRW</span>
                            </h3>
                            <div class="flex items-end gap-4 mt-2">
                                <div><p class="text-[10px] text-gray-400">持有数量 (股)</p><p class="font-mono font-bold text-lg text-gray-700">${shares}</p></div>
                                <div><p class="text-[10px] text-gray-400">现值估算 (积分)</p><p class="font-mono font-bold text-lg text-pink-600">${totalValue}</p></div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="promptTrade('sell')" class="px-4 py-1.5 bg-green-50 text-green-600 border border-green-200 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition">卖出</button>
                            <button onclick="promptTrade('buy')" class="px-4 py-1.5 bg-red-50 text-red-500 border border-red-200 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition">加仓</button>
                    </div>
                </div>
            `;
            }

            // 渲染历史交易记录
            const historyList = document.getElementById('tradeHistoryList');
            if (myData.tradeHistory && myData.tradeHistory.length > 0) {
                // 倒序显示，最新的在前面
                const reversedHistory = [...myData.tradeHistory].reverse().slice(0, 20); // 最多展示20条
                let hHtml = '';
                reversedHistory.forEach(record => {
                    const isBuy = record.type === 'buy';
                    const color = isBuy ? 'text-red-500' : 'text-green-500';
                    const bg = isBuy ? 'bg-red-50' : 'bg-green-50';
                    hHtml += `
                        <div class="px-4 py-3 flex justify-between items-center text-sm">
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 rounded-full ${bg} ${color} flex justify-center items-center font-bold text-xs">
                                    ${isBuy ? '买' : '卖'}
                                </span>
                                <div>
                                    <p class="font-medium text-gray-700">恋爱成长</p>
                                    <p class="text-[10px] text-gray-400 font-mono">${formatTime(record.timestamp, 'full')}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-bold ${color} font-mono">${isBuy ? '+' : '-'}${record.qty} 股</p>
                                <p class="text-[10px] text-gray-500 font-mono">@ ${record.price.toFixed(4)}</p>
                            </div>
                        </div>
                    `;
                });
                historyList.innerHTML = hHtml;
            } else {
                historyList.innerHTML = `<div class="p-6 text-center text-xs text-gray-400">暂无交易记录</div>`;
            }
        }

        function setChartRange(range) {
            chartState.range = range;
            const ranges = ['1d', '3d', '7d', '30d'];
            ranges.forEach(r => {
                const btn = document.getElementById(`range_${r}`);
                if (r === range) {
                    btn.className = "flex-1 py-2 rounded-xl text-sm transition-all border time-btn-active";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl text-sm transition-all border time-btn-inactive";
                }
            });
            chartState.activePointIndex = -1; 
            document.getElementById('chartTooltip').innerHTML = '点击图表节点查看详情';
            drawChart();
        }

        function drawChart() {
            const svg = document.getElementById('stockChart');
            const history = stockData.history;
            
            if (history.length < 2) {
                svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#9ca3af" font-size="12">暂无数据</text>`;
                return;
            }

            // 1. 过滤时间范围内的数据
            const nowTs = Date.now();
            let timeLimit = 0;
            if (chartState.range === '1d') timeLimit = nowTs - 24 * 3600 * 1000;
            else if (chartState.range === '3d') timeLimit = nowTs - 3 * 24 * 3600 * 1000;
            else if (chartState.range === '7d') timeLimit = nowTs - 7 * 24 * 3600 * 1000;
            else if (chartState.range === '30d') timeLimit = nowTs - 30 * 24 * 3600 * 1000;

            let chartData = history.filter(d => d.timestamp >= timeLimit);
            
            if (chartData.length < 2) {
                const idx = history.findIndex(d => d.timestamp >= timeLimit);
                if (idx > 0) {
                    chartData = history.slice(Math.max(0, idx - 2)); 
                } else {
                    chartData = history.slice(-5);
                }
            }
            chartState.currentChartData = chartData;

            // 2. 设置坐标系与画布尺寸
            const width = 800;  
            const height = 400; 
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            
            // 调整 Padding 以适应右侧 Y 轴和底部 X 轴
            const pad = { top: 40, right: 80, bottom: 40, left: 10 }; 
            const innerW = width - pad.left - pad.right;
            const innerH = height - pad.top - pad.bottom;

            const prices = chartData.map(d => d.price);
            let minPrice = Math.min(...prices);
            let maxPrice = Math.max(...prices);
            
            const priceMargin = (maxPrice - minPrice) * 0.1 || 0.05; 
            minPrice = minPrice - priceMargin;
            maxPrice = maxPrice + priceMargin;
            const priceRange = maxPrice - minPrice;

            let minTs = chartData[0].timestamp;
            let maxTs = chartData[chartData.length - 1].timestamp;
            // 处理单点时间区间防除0
            if (minTs === maxTs) {
                minTs -= 3600000;
                maxTs += 3600000;
            }
            const tsRange = maxTs - minTs;

            const mapX = (ts) => pad.left + ((ts - minTs) / tsRange) * innerW;
            const mapY = (price) => pad.top + innerH - ((price - minPrice) / priceRange) * innerH;

            // 3. 构建 SVG 内容
            let svgHtml = '';

            // --- 绘制坐标轴文本 (精准贴合截图设计) ---
            // Y轴文字 (右侧4个均分点)
            for (let i = 0; i <= 3; i++) {
                const yPrice = maxPrice - (priceRange * (i / 3)); 
                const yPos = mapY(yPrice);
                svgHtml += `<text x="${width - pad.right + 15}" y="${yPos + 5}" fill="#9ca3af" font-size="16" font-family="monospace">${yPrice.toFixed(4)}</text>`;
            }

            // X轴文本 (底部首、尾、中)
            const xPoints = [
                { ts: minTs, align: 'start' },
                { ts: minTs + tsRange / 2, align: 'middle' },
                { ts: maxTs, align: 'end' }
            ];
            xPoints.forEach((pt, i) => {
                let xPos = mapX(pt.ts);
                if (i === 2) xPos = width - pad.right; // 防止最后一个字溢出
                const format = chartState.range === '1d' ? 'time' : 'date';
                const label = formatTime(pt.ts, format);
                svgHtml += `<text x="${xPos}" y="${height - 10}" fill="#9ca3af" font-size="16" text-anchor="${pt.align}">${label}</text>`;
            });

            // --- 绘制趋势折线和渐变背景 ---
            let pathCmds = chartData.map((d, i) => {
                return `${i === 0 ? 'M' : 'L'} ${mapX(d.timestamp)} ${mapY(d.price)}`;
            }).join(' ');

            const isUp = chartData[chartData.length-1].price >= chartData[0].price;
            const strokeColor = isUp ? '#ef4444' : '#10b981'; 
            const fillId = isUp ? 'gradUp' : 'gradDown';

            svgHtml += `
                <defs>
                    <linearGradient id="gradUp" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
                        <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
                    </linearGradient>
                    <linearGradient id="gradDown" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
                        <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
                    </linearGradient>
                </defs>
            `;

            // 填充区域
            const fillPath = `${pathCmds} L ${mapX(maxTs)} ${pad.top + innerH} L ${mapX(minTs)} ${pad.top + innerH} Z`;
            svgHtml += `<path d="${fillPath}" fill="url(#${fillId})" />`;
            // 折线
            svgHtml += `<path d="${pathCmds}" fill="none" stroke="${strokeColor}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`;

            // --- 绘制个人交易买卖点 ---
            if (myData.tradeHistory && myData.tradeHistory.length > 0) {
                const visibleTrades = myData.tradeHistory.filter(t => t.timestamp >= minTs && t.timestamp <= maxTs);
                
                visibleTrades.forEach(trade => {
                    const cx = mapX(trade.timestamp);
                    const cy = mapY(trade.price);
                    const color = trade.type === 'buy' ? '#ef4444' : '#10b981'; 
                    const label = trade.type === 'buy' ? 'B' : 'S';
                    
                    svgHtml += `
                        <circle cx="${cx}" cy="${cy}" r="10" fill="${color}" stroke="#fff" stroke-width="2" />
                        <text x="${cx}" y="${cy + 4}" fill="#fff" font-size="12" font-weight="bold" font-family="Arial" text-anchor="middle">${label}</text>
                    `;
                });
            }

            // --- 绘制交互透明节点 ---
            chartData.forEach((d, i) => {
                const cx = mapX(d.timestamp);
                const cy = mapY(d.price);
                const isActive = chartState.activePointIndex === i;
                
                svgHtml += `<circle cx="${cx}" cy="${cy}" r="4" fill="${strokeColor}" opacity="${isActive ? 0 : 0.5}" pointer-events="none"/>`;
                
                svgHtml += `<circle cx="${cx}" cy="${cy}" r="24" fill="transparent" class="chart-point ${isActive ? 'active' : ''}" 
                                onclick="handleChartClick(${i})" />`;
            });

            svg.innerHTML = svgHtml;
        }

        function handleChartClick(index) {
            chartState.activePointIndex = index;
            drawChart(); 
            
            const data = chartState.currentChartData[index];
            const prevData = index > 0 ? chartState.currentChartData[index - 1] : null;
            
            const tooltip = document.getElementById('chartTooltip');
            const timeStr = formatTime(data.timestamp, 'full');
            
            let changeHtml = `<span class="text-gray-400">--</span>`;
            if (prevData) {
                const change = data.price - prevData.price;
                const percent = (change / prevData.price) * 100;
                if (change > 0) {
                    changeHtml = `<span class="text-up font-bold">涨 +${percent.toFixed(2)}%</span>`;
                } else if (change < 0) {
                    changeHtml = `<span class="text-down font-bold">跌 ${percent.toFixed(2)}%</span>`;
                } else {
                    changeHtml = `<span class="text-gray-500 font-bold">平 0.00%</span>`;
                }
            } else {
                changeHtml = `<span class="text-gray-500 text-[10px] bg-gray-100 px-1 py-0.5 rounded">首个记录点</span>`;
            }

            // 重新布局弹出的详情展示
            tooltip.innerHTML = `
                <div class="flex-1 flex flex-col justify-center">
                    <div class="text-xs text-gray-500 mb-0.5">${timeStr}</div>
                    <div class="text-xl font-black font-mono text-gray-800">${data.price.toFixed(4)}</div>
                </div>
                <div class="text-right flex flex-col justify-center items-end">
                    <div class="text-[10px] text-gray-400 mb-1">与上阶段比</div>
                    ${changeHtml}
                </div>
            `;
        }

        function promptTrade(type) {
            tradeState.type = type;
            tradeState.price = stockData.currentPrice;
            tradeState.qty = 1;

            const title = document.getElementById('tradeTitle');
            const icon = document.getElementById('tradeIcon');
            const maxHint = document.getElementById('tradeMaxHint');
            const btn = document.getElementById('confirmTradeBtn');

            document.getElementById('tradeUnitPrice').innerText = tradeState.price.toFixed(4);

            if (type === 'buy') {
                title.innerText = "买入 恋爱成长";
                icon.innerHTML = "💰";
                icon.className = "w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold bg-red-50 text-red-500 border border-red-100";
                
                tradeState.maxQty = Math.floor(myData.points / tradeState.price);
                maxHint.innerText = `最大可买: ${tradeState.maxQty} 股`;
                
                document.getElementById('tradeTotalLabel').className = "text-sm font-bold text-red-500";
                document.getElementById('tradeTotalPrice').className = "text-2xl font-black tracking-tight text-red-500";
                
                btn.innerText = "确认买入";
                btn.className = "flex-1 py-3.5 bg-red-500 text-white rounded-2xl font-bold shadow-md shadow-red-200 active:scale-95 transition-all text-lg tracking-widest";
            } else {
                title.innerText = "卖出 恋爱成长";
                icon.innerHTML = "💸";
                icon.className = "w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold bg-green-50 text-green-500 border border-green-100";
                
                tradeState.maxQty = myData.stocks.love_growth || 0;
                maxHint.innerText = `最大可卖: ${tradeState.maxQty} 股`;
                
                document.getElementById('tradeTotalLabel').className = "text-sm font-bold text-green-600";
                document.getElementById('tradeTotalPrice').className = "text-2xl font-black tracking-tight text-green-600";
                
                btn.innerText = "确认卖出";
                btn.className = "flex-1 py-3.5 bg-green-500 text-white rounded-2xl font-bold shadow-md shadow-green-200 active:scale-95 transition-all text-lg tracking-widest";
            }

            if(tradeState.maxQty === 0) tradeState.qty = 0;

            updateTradeUI();
            btn.onclick = executeTrade;
            openModal('tradeModal', 'tradeModalContent');
        }

        function changeTradeQty(delta) {
            let newQty = tradeState.qty + delta;
            if (newQty < 1 && tradeState.maxQty > 0) newQty = 1;
            if (newQty < 0) newQty = 0;
            if (newQty > tradeState.maxQty) newQty = tradeState.maxQty;
            tradeState.qty = newQty;
            updateTradeUI();
        }

        function updateTradeUI() {
            document.getElementById('tradeQtyDisplay').innerText = tradeState.qty;
            const total = (tradeState.qty * tradeState.price).toFixed(2);
            document.getElementById('tradeTotalPrice').innerText = tradeState.type === 'buy' ? `-${total}` : `+${total}`;
        }

        async function executeTrade() {
            if (tradeState.qty <= 0) return showToast("无效的交易数量");
            
            const totalCost = parseFloat((tradeState.qty * tradeState.price).toFixed(2));
            
            // 本地数据更新
            if (tradeState.type === 'buy') {
                if (myData.points < totalCost) return showToast("积分不足！");
                myData.points -= totalCost;
                myData.stocks.love_growth = (myData.stocks.love_growth || 0) + tradeState.qty;
            } else {
                if ((myData.stocks.love_growth || 0) < tradeState.qty) return showToast("持仓不足！");
                myData.stocks.love_growth -= tradeState.qty;
                myData.points += totalCost;
            }

            myData.points = parseFloat(myData.points.toFixed(2));

            // 记录交易历史
            if (!myData.tradeHistory) myData.tradeHistory = [];
            myData.tradeHistory.push({
                timestamp: Date.now(),
                type: tradeState.type,
                price: tradeState.price,
                qty: tradeState.qty
            });

            closeModal('tradeModal', 'tradeModalContent');
            showToast("正在提交交易请求...");

            const latestMy = await fetchFile(MY_FILE);
            if (latestMy.sha) myData.sha = latestMy.sha;

            const action = tradeState.type === 'buy' ? 'Buy' : 'Sell';
            const res = await updateFile(MY_FILE, myData, myData.sha, `${action} ${tradeState.qty} LOVE.GRW at ${tradeState.price}`);

            if (res.success) {
                if(res.sha !== 'mock') myData.sha = res.sha;
                updateUI();
                drawChart(); // 刷新图表以显示新的买卖点
                showToast(`🎉 ${tradeState.type === 'buy' ? '买入' : '卖出'}成功！`);
                if(tradeState.type === 'buy') switchTab('portfolio');
            } else {
                // 失败回滚
                if (tradeState.type === 'buy') {
                    myData.points += totalCost;
                    myData.stocks.love_growth -= tradeState.qty;
                } else {
                    myData.stocks.love_growth += tradeState.qty;
                    myData.points -= totalCost;
                }
                myData.tradeHistory.pop(); // 移除刚刚加入的历史
                showToast("网络拥堵，交易失败，请重试");
                updateUI();
                drawChart();
            }
        }

        // --- 视图切换辅助 ---
        function switchTab(tabName) {
            const tabs = ['market', 'portfolio'];
            tabs.forEach(name => {
                const btn = document.getElementById(`tab_${name}`);
                const view = document.getElementById(`view_${name}`);
                if (name === tabName) {
                    btn.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-active";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2.5 rounded-full text-sm font-bold transition-all tab-inactive";
                    view.classList.add('hidden');
                }
            });
            if(tabName === 'market') drawChart();
        }

        function openModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            });
        }

        function closeModal(bgId, contentId) {
            const modal = document.getElementById(bgId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        let toastTimeout;
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            
            toast.classList.remove('toast-animate');
            void toast.offsetWidth; 
            toast.classList.add('toast-animate'); 
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
