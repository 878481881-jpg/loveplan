<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日签到 📅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            /* 完全继承 shop.html 的背景样式 */
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 pb-20">
    
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-500 flex items-center justify-center gap-2">
                📅 每日签到
            </h1>
        </div>
        <div class="w-9 h-9"></div> <!-- 占位保持居中 -->
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <div class="w-full bg-gradient-to-r from-rose-400 to-pink-500 rounded-2xl p-4 shadow-md text-white flex justify-between items-center mb-6 relative overflow-hidden">
            <div class="absolute -right-2 -top-2 text-6xl opacity-20">🪙</div>
            <div class="relative z-10">
                <p class="text-xs text-rose-100 mb-1">当前身份: <span id="identityText">-</span></p>
                <div class="flex items-baseline gap-1">
                    <span class="text-3xl font-bold" id="myPoints">--</span>
                    <span class="text-sm">积分</span>
                </div>
            </div>
            <button onclick="refreshData()" class="relative z-10 bg-white/20 hover:bg-white/30 backdrop-blur-sm p-2 rounded-full transition-colors flex items-center gap-1 text-sm font-bold">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                刷新状态
            </button>
        </div>

        <div class="w-full bg-white rounded-2xl p-4 shadow-sm border border-rose-100 mb-6 text-center animate-fade-in relative overflow-hidden">
            <h3 class="font-bold text-gray-800 text-sm mb-3">今日打卡进度 (<span id="progressText" class="text-rose-500">0/3</span>)</h3>
            <div class="w-full bg-gray-100 rounded-full h-3 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-rose-400 to-pink-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p class="text-xs text-gray-500" id="bonusHint">全部完成可额外获得 4 积分奖励哦！</p>
        </div>

        <div id="loadingView" class="w-full flex flex-col items-center py-10 animate-fade-in">
            <div class="text-4xl animate-bounce mb-3">🕒</div>
            <p class="text-rose-400 font-bold">正在拉取时钟数据...</p>
        </div>

        <div id="contentView" class="w-full hidden space-y-4 animate-fade-in">
            <!-- 动态渲染的任务卡片会放在这里 -->
        </div>

    </main>

    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-[70] whitespace-nowrap"></div>

    <!-- 签到成功弹窗 (完全复刻 shop.html 风格) -->
    <div id="successModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-95 transition-transform text-center relative overflow-hidden" id="successModalContent">
            <div class="text-6xl mb-4 animate-pop">🎉</div>
            <h3 class="font-bold text-gray-800 text-xl mb-2" id="modalTitle">签到成功！</h3>
            <p class="text-sm text-gray-500 mb-6" id="modalDesc">获得 2 积分</p>
            
            <button onclick="closeModal()" class="w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow-md hover:bg-rose-600 transition-colors">
                开心收下
            </button>
        </div>
    </div>

    <script>
        // ----------------- 基础配置与鉴权 -----------------
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; // 没登录退回首页
        }

        document.getElementById('identityText').innerText = myIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_FILE = `data/${myIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const QD_FILE = 'data/qd.json';

        // ----------------- 签到任务配置 -----------------
        const tasksConfig = [
            { id: 'morning', name: '早起签到', icon: '🌅', timeStr: '05:00 - 08:00', sh: 5, sm: 0, eh: 8, em: 0 },
            { id: 'lunch', name: '按时午饭', icon: '🍱', timeStr: '11:30 - 13:00', sh: 11, sm: 30, eh: 13, em: 0 },
            { id: 'night', name: '早睡签到', icon: '🌙', timeStr: '21:00 - 23:00', sh: 21, sm: 0, eh: 23, em: 0 }
        ];

        let myData = { points: 0, inventory: {}, pendingUses: [], sha: null }; 
        let qdData = { "哼哼": { morning: 0, lunch: 0, night: 0 }, "亲亲": { morning: 0, lunch: 0, night: 0 }, sha: null };

        // 编码解码工具
        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        window.onload = async function() {
            await refreshData();
        };

        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (response.status === 404) return { data: null, sha: null };
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                console.error("Fetch Error:", error);
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            try {
                const dataToSave = { ...contentObj };
                delete dataToSave.sha; // 移除 sha 防止污染 json
                
                const contentBase64 = utf8_to_b64(JSON.stringify(dataToSave, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                console.error("Update Error:", error);
                return { success: false };
            }
        }

        function isToday(timestamp) {
            if (!timestamp || timestamp === 0) return false;
            const date = new Date(timestamp);
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function checkTimeStatus(sh, sm, eh, em) {
            const now = new Date();
            const currentTotal = now.getHours() * 60 + now.getMinutes();
            const startTotal = sh * 60 + sm;
            const endTotal = eh * 60 + em;

            if (currentTotal < startTotal) return 'future'; // 未开始
            if (currentTotal > endTotal) return 'past';     // 已错过
            return 'now';                                   // 进行中
        }

        async function refreshData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');

            const [myRes, qdRes] = await Promise.all([
                fetchFile(MY_FILE), fetchFile(QD_FILE)
            ]);

            if (myRes.error || qdRes.error) {
                showToast("获取数据失败，请检查网络或Token");
                return;
            }

            if (myRes.data) {
                myData = { ...myData, ...myRes.data, sha: myRes.sha };
                if(typeof myData.points !== 'number') myData.points = 50;
            }
            if (qdRes.data) {
                qdData = { ...qdData, ...qdRes.data, sha: qdRes.sha };
            }
            
            if (!qdData[myIdentity]) {
                qdData[myIdentity] = { morning: 0, lunch: 0, night: 0 };
            }

            document.getElementById('myPoints').innerText = myData.points;
            renderTasks();

            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
        }

        function renderTasks() {
            const view = document.getElementById('contentView');
            let completedCount = 0;
            
            const html = tasksConfig.map(task => {
                const ts = qdData[myIdentity][task.id];
                const doneToday = isToday(ts);
                const timeStatus = checkTimeStatus(task.sh, task.sm, task.eh, task.em);
                
                if (doneToday) completedCount++;

                let btnHtml = '';
                let statusText = '';
                let bgClass = 'bg-white';

                if (doneToday) {
                    btnHtml = `<button disabled class="px-5 py-2.5 bg-gray-100 text-gray-400 rounded-xl text-sm font-bold shadow-inner flex items-center gap-1 cursor-not-allowed">已签到 ✅</button>`;
                    statusText = `<span class="text-rose-500 text-xs font-bold bg-rose-50 px-2 py-0.5 rounded-md">今日达成</span>`;
                    bgClass = 'bg-rose-50/30';
                } else if (timeStatus === 'future') {
                    btnHtml = `<button disabled class="px-5 py-2.5 bg-gray-100 text-gray-400 rounded-xl text-sm font-bold cursor-not-allowed">未到时间</button>`;
                } else if (timeStatus === 'past') {
                    btnHtml = `<button disabled class="px-5 py-2.5 bg-gray-50 border border-gray-200 text-gray-400 rounded-xl text-sm font-bold cursor-not-allowed opacity-70">已错过 🥲</button>`;
                } else {
                    btnHtml = `<button onclick="doCheckIn('${task.id}')" class="px-6 py-2.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-xl text-sm font-bold shadow-md hover:scale-105 active:scale-95 transition-transform">立即签到</button>`;
                    statusText = `<span class="text-orange-500 text-xs font-bold animate-pulse">进行中 🏃</span>`;
                }

                return `
                <div class="${bgClass} rounded-2xl p-4 border border-rose-100 shadow-sm flex items-center justify-between transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-rose-50 rounded-xl flex items-center justify-center text-3xl flex-shrink-0">${task.icon}</div>
                        <div>
                            <h4 class="font-bold text-gray-800 text-base flex items-center gap-2">
                                ${task.name} 
                                ${statusText}
                            </h4>
                            <p class="text-[11px] text-gray-500 mt-0.5 font-mono bg-gray-50 inline-block px-1.5 rounded border border-gray-100">🕒 ${task.timeStr}</p>
                        </div>
                    </div>
                    <div>
                        ${btnHtml}
                    </div>
                </div>`;
            }).join('');

            view.innerHTML = html;

            // 更新进度条 UI
            document.getElementById('progressText').innerText = `${completedCount}/3`;
            document.getElementById('progressBar').style.width = `${(completedCount / 3) * 100}%`;
            
            if (completedCount === 3) {
                document.getElementById('bonusHint').innerHTML = `<span class="text-rose-500 font-bold">✨ 哇！今日大满贯，已获得额外 4 积分奖励！</span>`;
            } else {
                document.getElementById('bonusHint').innerText = "全部完成可额外获得 4 积分奖励哦！";
            }
        }

        async function doCheckIn(taskId) {
            const task = tasksConfig.find(t => t.id === taskId);
            if(!task) return;

            const timeStatus = checkTimeStatus(task.sh, task.sm, task.eh, task.em);
            if (timeStatus !== 'now') {
                showToast("抱歉，当前不在签到时间范围内哦~");
                refreshData(); 
                return;
            }

            if (isToday(qdData[myIdentity][taskId])) {
                showToast("今天已经签过到了哦~");
                return;
            }

            showToast("正在提交签到...");
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('contentView').classList.add('hidden');

            const latestQd = await fetchFile(QD_FILE);
            if(latestQd.data) {
                qdData = { ...qdData, ...latestQd.data, sha: latestQd.sha };
                if (!qdData[myIdentity]) qdData[myIdentity] = { morning: 0, lunch: 0, night: 0 };
            }

            // 更新时间戳
            qdData[myIdentity][taskId] = Date.now();

            // 计算积分
            let pointsToAdd = 2;
            let isAllDone = false;
            
            const mToday = isToday(qdData[myIdentity].morning);
            const lToday = isToday(qdData[myIdentity].lunch);
            const nToday = isToday(qdData[myIdentity].night);

            if (mToday && lToday && nToday) {
                pointsToAdd += 4; // 大满贯奖励
                isAllDone = true;
            }

            const qdRes = await updateFile(QD_FILE, qdData, qdData.sha, `${myIdentity} checked in ${taskId}`);
            
            if (!qdRes.success) {
                showToast("签到数据保存失败，请重试");
                refreshData();
                return;
            }
            qdData.sha = qdRes.sha;

            const latestMy = await fetchFile(MY_FILE);
            if(latestMy.data) {
                myData = { ...myData, ...latestMy.data, sha: latestMy.sha };
            }

            myData.points += pointsToAdd;
            const myRes = await updateFile(MY_FILE, myData, myData.sha, `Add ${pointsToAdd} pts for ${taskId} checkin`);
            
            if (!myRes.success) {
                showToast("签到成功，但积分发放可能因为网络延迟失败了...");
                refreshData();
                return;
            }
            myData.sha = myRes.sha;

            document.getElementById('myPoints').innerText = myData.points;
            renderTasks();
            
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');

            // 弹出提示
            document.getElementById('modalTitle').innerText = isAllDone ? '大满贯签到！' : '签到成功！';
            document.getElementById('modalDesc').innerText = isAllDone 
                ? `恭喜完成今日所有打卡，获得 2 积分 + 额外 4 积分奖励！` 
                : `获得 2 积分，继续保持哦~`;
            
            const modal = document.getElementById('successModal');
            const content = document.getElementById('successModalContent');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            });
        }

        function closeModal() {
            const modal = document.getElementById('successModal');
            const content = document.getElementById('successModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

        setInterval(() => {
            if (document.getElementById('contentView').classList.contains('hidden') === false) {
                renderTasks();
            }
        }, 60000);

    </script>
</body>
</html>
