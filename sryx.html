<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏大厅 - 我们的恋爱ing 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hover-spin-slow:hover {
            animation: spin-slow 3s linear infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .hover-wiggle:hover {
            animation: wiggle 0.5s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4 relative">
    
    <!-- 左上角「返回主页」按钮 -->
    <div class="fixed top-4 left-4 md:top-6 md:left-6 z-50">
        <a href="index.html" class="flex items-center gap-1 md:gap-1.5 bg-white/90 backdrop-blur-sm px-4 py-2 md:px-5 md:py-2.5 rounded-full shadow-sm border-2 border-rose-100 text-rose-500 hover:bg-rose-50 hover:shadow-md transition-all group">
            <span class="text-base md:text-lg group-hover:-translate-x-1 transition-transform">👈</span>
            <span class="text-xs md:text-sm font-bold">返回主页</span>
        </a>
    </div>

    <!-- 主菜单容器 -->
    <div class="flex flex-col items-center w-full max-w-2xl mt-12 md:mt-0 relative z-10">
        <header class="text-center mb-10 md:mb-12 animate-float">
            <div class="inline-block bg-white/80 backdrop-blur-md px-6 py-2 rounded-full border-2 border-rose-100 mb-4 shadow-sm">
                <span class="text-rose-500 font-bold tracking-widest text-sm">COUPLE GAMES</span>
            </div>
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-rose-500 mb-3 drop-shadow-sm">
                🎮 游戏大厅 🕹️
            </h1>
            <p class="text-rose-400 text-sm sm:text-base md:text-lg font-medium">
                属于我们的双人游乐园
            </p>
        </header>

        <!-- 游戏列表网格 -->
        <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 mb-8 px-2">
            
            <!-- 你画我猜 卡片 -->
            <a href="nhwc.html" class="group flex flex-col items-center justify-center py-8 px-6 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-[2rem] shadow-md hover:shadow-xl transform hover:-translate-y-2 transition-all duration-300 text-center relative overflow-hidden border border-rose-300/50">
                <!-- 背景装饰 -->
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl group-hover:scale-150 transition-transform duration-500"></div>
                
                <span class="text-5xl md:text-6xl mb-4 hover-wiggle drop-shadow-md">🎨</span>
                <h2 class="text-xl md:text-2xl font-black tracking-wide mb-2">你画我猜</h2>
                <p class="text-rose-100 text-xs md:text-sm font-medium">看看谁才是真正的灵魂画手</p>
                
                <div class="mt-5 px-4 py-1.5 bg-white/20 backdrop-blur-sm rounded-full text-xs font-bold border border-white/30 group-hover:bg-white/30 transition-colors">
                    进入游戏 🚀
                </div>
            </a>

            <!-- 五子棋 卡片 (修正了用户提供的 .gtml 后缀) -->
            <a href="wzq.html" class="group flex flex-col items-center justify-center py-8 px-6 bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-[2rem] shadow-md hover:shadow-xl transform hover:-translate-y-2 transition-all duration-300 text-center relative overflow-hidden border border-rose-300/50">
                <!-- 背景装饰 -->
                <div class="absolute bottom-0 left-0 -mb-4 -ml-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl group-hover:scale-150 transition-transform duration-500"></div>
                
                <span class="text-5xl md:text-6xl mb-4 hover-wiggle drop-shadow-md">♟️</span>
                <h2 class="text-xl md:text-2xl font-black tracking-wide mb-2">五子棋</h2>
                <p class="text-rose-100 text-xs md:text-sm font-medium">黑白交错的智力与默契对决</p>
                
                <div class="mt-5 px-4 py-1.5 bg-white/20 backdrop-blur-sm rounded-full text-xs font-bold border border-white/30 group-hover:bg-white/30 transition-colors">
                    进入游戏 🚀
                </div>
            </a>

            <!-- 敬请期待 占位卡片 (占据两列宽度) -->
            <div class="sm:col-span-2 flex flex-col items-center justify-center py-8 px-6 bg-white/50 backdrop-blur-sm border-2 border-dashed border-rose-200 text-rose-300 rounded-[2rem] text-center shadow-sm">
                <span class="text-4xl mb-3 opacity-60 hover-spin-slow">🚧</span>
                <h2 class="text-lg font-bold tracking-wide mb-1 opacity-80">更多游戏待解锁</h2>
                <p class="text-xs font-medium opacity-60">正在快马加鞭开发中，敬请期待...</p>
            </div>
            
        </div>
    </div>

</body>
</html>
