<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共同日记本 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #fdf2f8; background-image: radial-gradient(#fbcfe8 1px, transparent 1px); background-size: 20px 20px; overflow-x: hidden; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f472b6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4">
    
    <header class="text-center mb-6 max-w-md animate-float">
        <h1 class="text-3xl md:text-4xl font-bold text-rose-500 mb-2 drop-shadow-sm">
            💌 我们的心动盲盒
        </h1>
        <p class="text-rose-400 text-sm md:text-base">
            记录属于我们的心动瞬间
        </p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 选项卡导航 (样式不变，改为超链接跳转) -->
        <div class="flex space-x-4 mb-6 w-full justify-center">
            <a href="index.html" class="px-6 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50">返回首页</a>
            <a href="diary.html" class="px-6 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all">共同日记</a>
            <a href="task.html" class="px-6 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50">每日任务</a>
        </div>

        <div id="diaryView" class="w-full flex flex-col items-center transition-opacity duration-300 w-full max-w-md">
            <!-- 填写日记区 -->
            <div class="w-full bg-white/80 backdrop-blur-sm rounded-2xl p-4 shadow-sm border-2 border-rose-100 mb-4">
                <textarea id="diaryInput" rows="3" class="w-full px-4 py-3 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400 resize-none text-gray-700 placeholder-rose-300" placeholder="今天发生了什么开心的事？记录下来吧..."></textarea>
                <button onclick="saveDiary()" id="saveDiaryBtn" class="mt-3 w-full py-2.5 bg-gradient-to-r from-emerald-400 to-teal-400 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition">写进日记本 ✍️</button>
            </div>
            
            <!-- 日记展示区 -->
            <div class="w-full flex gap-3 h-[50vh] min-h-[300px]">
                <div class="flex-1 bg-white rounded-2xl p-3 shadow-sm border-2 border-rose-100 flex flex-col overflow-hidden">
                    <h3 class="text-sm font-bold text-emerald-500 mb-2 text-center pb-2 border-b border-rose-50" id="myDiaryTitle">我的日记</h3>
                    <div id="myDiaryList" class="flex-1 overflow-y-auto space-y-3 pr-1 custom-scrollbar"></div>
                </div>
                <div class="flex-1 bg-white rounded-2xl p-3 shadow-sm border-2 border-rose-100 flex flex-col overflow-hidden">
                    <h3 class="text-sm font-bold text-rose-500 mb-2 text-center pb-2 border-b border-rose-50" id="partnerDiaryTitle">TA的日记</h3>
                    <div id="partnerDiaryList" class="flex-1 overflow-y-auto space-y-3 pr-1 custom-scrollbar"></div>
                </div>
            </div>
        </div>
        
        <div class="mt-12 text-center">
            <!--a href="index.html" class="text-gray-400 text-xs underline hover:text-rose-400 transition-colors block mb-2">
                返回首页 / 切换身份 (当前: <span id="currentIdentityLabel">-</span>)
            </a-->
    </div>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; // 强制鉴权
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('currentIdentityLabel').innerText = myIdentity;
        document.getElementById('myDiaryTitle').innerText = `${myIdentity}的日记`;
        document.getElementById('partnerDiaryTitle').innerText = `${partnerIdentity}的日记`;
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_H_RJ = 'data/Hrj.json'; 
        const FILE_Q_RJ = 'data/Qrj.json'; 

        let dataHRj = { diaries: [] }, dataQRj = { diaries: [] }, shaHRj = null, shaQRj = null;
        let pollInterval = null;

        window.onload = async function() {
            await fetchAllData();
            renderDiaryUI();
            startPolling();
        };

        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (response.status === 404) return { data: {}, sha: null }; 
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(contentStr || '{}'), sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update diary data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (!response.ok) return { success: false, sha: sha };
                
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        async function fetchAllData() {
            const [resH, resQ] = await Promise.all([fetchFile(FILE_H_RJ), fetchFile(FILE_Q_RJ)]);
            
            if (resH.authError || resQ.authError) { showToast("Token失效，请重新登录"); setTimeout(()=>window.location.href='index.html', 1500); return false; }
            if (resH.error || resQ.error) return false;
            
            dataHRj = resH.data; shaHRj = resH.sha; dataQRj = resQ.data; shaQRj = resQ.sha;
            if (!dataHRj.diaries) dataHRj.diaries = []; if (!dataQRj.diaries) dataQRj.diaries = [];
            return true;
        }

        function startPolling() { if (pollInterval) clearInterval(pollInterval); pollInterval = setInterval(async () => { if(await fetchAllData()) renderDiaryUI(); }, 100000); }

        function renderDiaryUI() {
            const myDataRj = myIdentity === '哼哼' ? dataHRj : dataQRj;
            const partnerDataRj = myIdentity === '哼哼' ? dataQRj : dataHRj;

            const renderEntries = (containerId, diaries, isSelf) => {
                const container = document.getElementById(containerId);
                if (!diaries || diaries.length === 0) { container.innerHTML = '<p class="text-xs text-gray-400 text-center mt-6">还没有记录哦~</p>'; return; }
                
                container.innerHTML = diaries.map(entry => {
                    const bgClass = isSelf ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100';
                    const timeClass = isSelf ? 'text-emerald-500' : 'text-rose-400';
                    return `<div class="p-3 rounded-xl border ${bgClass} break-words animate-fade-in shadow-sm"><div class="text-[10px] font-bold ${timeClass} mb-1.5 flex items-center gap-1"><span>🕒</span> ${entry.time}</div><div class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${entry.content}</div></div>`;
                }).join('');
            };

            renderEntries('myDiaryList', myDataRj.diaries, true);
            renderEntries('partnerDiaryList', partnerDataRj.diaries, false);
        }

        async function saveDiary() {
            const input = document.getElementById('diaryInput'), text = input.value.trim(), btn = document.getElementById('saveDiaryBtn');
            if (!text) { showToast("日记内容不能为空哦~"); return; }
            btn.innerText = "正在保存..."; btn.disabled = true;

            const myDataRj = myIdentity === '哼哼' ? dataHRj : dataQRj, myPathRj = myIdentity === '哼哼' ? FILE_H_RJ : FILE_Q_RJ;
            let myShaRj = myIdentity === '哼哼' ? shaHRj : shaQRj;

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            
            myDataRj.diaries.unshift({ time: timeStr, content: text }); renderDiaryUI();

            const upRes = await updateFile(myPathRj, myDataRj, myShaRj);
            if (upRes.success) {
                if (myIdentity === '哼哼') shaHRj = upRes.sha; else shaQRj = upRes.sha;
                showToast("日记保存成功！📔"); input.value = ""; 
            } else {
                showToast("保存失败"); myDataRj.diaries.shift(); renderDiaryUI();
            }
            btn.innerText = "写进日记本 ✍️"; btn.disabled = false;
        }

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.remove('hidden'); toast.classList.add('toast-animate'); setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-animate'); }, 3000); }
    </script>
</body>
</html>
