            innerSVG += `<g><polygon points="${props.tail}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" /></g>`;

            let bodyPts = props.body.split(',');
            let bTopL_x = parseFloat(bodyPts[0]), bTopL_y = parseFloat(bodyPts[1]); let bTopR_x = parseFloat(bodyPts[2]), bTopR_y = parseFloat(bodyPts[3]);
            let bBotR_x = parseFloat(bodyPts[4]), bBotR_y = parseFloat(bodyPts[5]); let bBotL_x = parseFloat(bodyPts[6]), bBotL_y = parseFloat(bodyPts[7]);
            let thighR = (bBotR_x - 100) * 0.65; let thighY = bBotL_y - thighR * 0.8;
            
            innerSVG += `<circle cx="${bBotL_x + thighR*0.5}" cy="${thighY}" r="${thighR}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" />`;
            innerSVG += `<path d="M ${bBotL_x - 10} ${bBotL_y + 10} Q ${bBotL_x + thighR*0.5} ${bBotL_y + 20} ${bBotL_x + thighR} ${bBotL_y}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            innerSVG += `<circle cx="${bBotR_x - thighR*0.5}" cy="${thighY}" r="${thighR}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" />`;
            innerSVG += `<path d="M ${bBotR_x + 10} ${bBotR_y + 10} Q ${bBotR_x - thighR*0.5} ${bBotR_y + 20} ${bBotR_x - thighR} ${bBotR_y}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;

            innerSVG += `<path d="M ${bTopL_x} ${bTopL_y} Q 100 ${bTopL_y + 20} ${bTopR_x} ${bTopR_y} L ${bBotR_x - thighR*0.8} ${bBotR_y} L ${bBotL_x + thighR*0.8} ${bBotL_y} Z" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" opacity="0.95" />`;
            if (props.armorOpacity > 0.01) { 
                let chestY = bTopL_y + 15; let armorW = (bTopR_x - bTopL_x) * 0.9;
                innerSVG += `<polygon points="${100 - armorW/2},${chestY} 100,${chestY+25} ${100 + armorW/2},${chestY} 100,${chestY-5}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="1.5" opacity="${props.armorOpacity}" stroke-linejoin="round" />`; 
            }

            innerSVG += `<polygon points="${props.pawL}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            innerSVG += `<polygon points="${props.pawR}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;

            let pL = props.pawL.split(','); let pR = props.pawR.split(',');
            innerSVG += `<path d="M ${bTopL_x + (100 - bTopL_x)*0.3} ${bTopL_y + 15} L ${pL[0]} ${pL[1]} L ${pL[2]} ${pL[3]} L 95 ${bTopL_y + 25} Z" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>`;
            innerSVG += `<path d="M ${bTopR_x - (bTopR_x - 100)*0.3} ${bTopR_y + 15} L ${pR[2]} ${pR[3]} L ${pR[0]} ${pR[1]} L 105 ${bTopR_y + 25} Z" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>`;

            innerSVG += `<polygon points="${props.earL}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            innerSVG += `<polygon points="${props.earR}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            innerSVG += `<polygon points="${props.head}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            
            if (props.fangLength > 0.01) { 
                let jawY = parseFloat(props.head.split(',')[11]) - 5; 
                innerSVG += `<polygon points="85,${jawY} 80,${jawY + 12 * props.fangLength} 95,${jawY}" fill="var(--c-stroke)" stroke-linejoin="round" />`;
                innerSVG += `<polygon points="115,${jawY} 120,${jawY + 12 * props.fangLength} 105,${jawY}" fill="var(--c-stroke)" stroke-linejoin="round" />`; 
            }
            
            let corePts = props.core.split(',');
            innerSVG += `<g><polygon points="${props.core}" fill="var(--c-visor)" opacity="${isNightTime ? 0.4 : 0.9}" stroke-linejoin="round" /><polygon points="${props.core}" fill="#ffffff" opacity="${isNightTime ? 0.3 : 0.8}" stroke="var(--c-visor)" stroke-width="1.5" stroke-linejoin="round" /></g>`;
            
            let noseBotY = parseFloat(corePts[7]); let tipY = noseBotY - (noseBotY - parseFloat(corePts[1])) * 0.3;
            innerSVG += `<polygon points="93,${tipY} 107,${tipY} 100,${noseBotY}" fill="#0f172a" stroke="var(--c-stroke)" stroke-width="1.5" stroke-linejoin="round"/>`;
            innerSVG += `<path d="M 100 ${noseBotY} L 100 ${noseBotY + 5} M 88 ${noseBotY + 2} Q 94 ${noseBotY + 10} 100 ${noseBotY + 5} Q 106 ${noseBotY + 10} 112 ${noseBotY + 2}" fill="none" stroke="var(--c-stroke)" stroke-width="2" stroke-linecap="round" />`;

            let vPts = props.visor.split(','); let eyeCy = (parseFloat(vPts[1]) + parseFloat(vPts[5])) / 2;
            innerSVG += `<g><polygon points="${props.visor}" fill="#0f172a" stroke="var(--c-stroke)" stroke-width="2" stroke-linejoin="round" /><polygon points="${props.visor}" fill="var(--c-visor)" opacity="${isNightTime ? 0.3 : 0.7}" stroke-linejoin="round" />${(props.eyeSize > 0.1 && !isNightTime) ? `<circle cx="85" cy="${eyeCy}" r="${props.eyeSize}" fill="#fff" opacity="0.9" /><circle cx="115" cy="${eyeCy}" r="${props.eyeSize}" fill="#fff" opacity="0.9" />` : ''}</g>`;
            
            let headTopY = parseFloat(props.head.split(',')[1]);
            if (props.crownScale > 0) { 
                let s = props.crownScale; let crownY = headTopY + 5;
                innerSVG += `<g transform="translate(100, ${crownY})"><polygon points="-15,0 -${25 * s},-${35 * s} -${10 * s},-${10 * s}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round"/><polygon points="-${20 * s},-${20 * s} -${35 * s},-${55 * s} -${25 * s},-${15 * s}" fill="var(--c-visor)" opacity="0.9"/><polygon points="15,0 ${25 * s},-${35 * s} ${10 * s},-${10 * s}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round"/><polygon points="${20 * s},-${20 * s} ${35 * s},-${55 * s} ${25 * s},-${15 * s}" fill="var(--c-visor)" opacity="0.9"/></g>`;
            }

            let collarY = bTopL_y - 5; let collarBot = collarY + 15; let cWidth = bTopR_x - bTopL_x + 10;
            if (equipped.includes('cwsbxq')) innerSVG += `<g><path d="M ${100 - cWidth/2} ${collarY} Q 100 ${collarBot+5} ${100 + cWidth/2} ${collarY}" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="${collarBot-2}" r="6" fill="#10b981" stroke="#047857" stroke-width="1.5" /><circle cx="100" cy="${collarBot-2}" r="3" fill="#fff" /></g>`;
            if (equipped.includes('cwsbgl')) innerSVG += `<g><path d="M 100 ${collarBot-2} Q 130 180 180 250" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" /></g>`;
            if (equipped.includes('cwsbyj')) innerSVG += `<g><polygon points="${props.visor}" fill="#831843" fill-opacity="0.8" stroke="#ec4899" stroke-width="3" stroke-linejoin="round" /></g>`;

            return { innerSVG, cMain, cStroke, cVisor, cGlow };
        }

        class Player {
            constructor() {
                this.x = GAME_WIDTH / 2;
                this.y = GAME_HEIGHT / 2;
                this.radius = 20; 
                
                this.baseSpeed = 180; 
                
                this.importedLevel = externalPetLevel;
                const statBonus = (this.importedLevel - 1) * 0.01; 
                
                this.baseMaxHp = 100 * (1 + statBonus);
                this.maxHp = this.baseMaxHp;
                this.hp = this.maxHp;
                this.shield = 0; 
                this.maxShield = 0;
                
                this.baseDmgMult = 1 + statBonus;
                
                this.level = 1;
                this.exp = 0;
                this.expToNext = 50; 
                
                this.pickupRadius = 100; 
                
                this.facing = 1; 
                this.lastDx = 1; 
                this.lastDy = 0;
                this.isMoving = false;

                this.regenTimer = 1.0; 
                this.auraTimer = 0;

                this.skills = { LASER: { level: 1, cooldownTimer: 0 } };
                
                this.hitTimer = 0;

                this.petCanvas = document.createElement('canvas');
                this.petCanvas.width = 175;
                this.petCanvas.height = 225;
                this.imageLoaded = false;
                
                const petImage = new Image();
                petImage.onload = () => {
                    const oCtx = this.petCanvas.getContext('2d');
                    oCtx.drawImage(petImage, 0, 0, 175, 225);
                    this.imageLoaded = true;
                };
                
                const equipped = globalPetData && globalPetData.equipped ? globalPetData.equipped : [];
                const { innerSVG, cMain, cStroke, cVisor } = getPetSVG(this.importedLevel, false, equipped);
                const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 300 400" width="350" height="450"><style>:root { --c-main: ${cMain}; --c-stroke: ${cStroke}; --c-visor: ${cVisor}; }</style>${innerSVG}</svg>`;
                petImage.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            }

            get speed() { 
                const mult = this.skills['SPEED'] ? WEAPONS['SPEED'].levels[this.skills['SPEED'].level - 1].val : 1.0;
                return this.baseSpeed * mult; 
            }
            get magnetRadius() { 
                const mult = this.skills['MAGNET'] ? WEAPONS['MAGNET'].levels[this.skills['MAGNET'].level - 1].val : 1.0;
                return this.pickupRadius * mult; 
            }

            update(dt) {
                let dx = 0, dy = 0;
                
                if (isAutoBattle) {
                    let targetX = null, targetY = null;
                    if (loots.length > 0) {
                        targetX = loots[0].x; targetY = loots[0].y;
                    } else {
                        let nearestGem = null; let minDist = Infinity;
                        expGems.forEach(g => {
                            if (!g.collected) {
                                let d = Math.hypot(g.x - this.x, g.y - this.y);
                                if (d < minDist) { minDist = d; nearestGem = g; }
                            }
                        });
                        if (nearestGem) {
                            targetX = nearestGem.x; targetY = nearestGem.y;
                        } else if (enemies.length > 0) {
                            let nearestE = null; let minDistE = Infinity;
                            enemies.forEach(e => {
                                let d = Math.hypot(e.x - this.x, e.y - this.y);
                                if (d < minDistE) { minDistE = d; nearestE = e; }
                            });
                            if (nearestE) { 
                                targetX = nearestE.x; targetY = nearestE.y;
                            }
                        }
                    }

                    let baseDx = 0, baseDy = 0;
                    if (targetX !== null && targetY !== null) {
                        let tx = targetX - this.x; let ty = targetY - this.y;
                        let tLen = Math.hypot(tx, ty);
                        if (tLen > 0) { baseDx = tx / tLen; baseDy = ty / tLen; }
                    }
                    
                    let repX = 0, repY = 0;
                    const dangerZone = 90;
                    enemies.forEach(e => {
                        let edx = this.x - e.x;
                        let edy = this.y - e.y;
                        let dist = Math.hypot(edx, edy);
                        let safeDist = this.radius + e.radius + dangerZone;
                        if (dist < safeDist && dist > 0) {
                            let force = Math.pow((safeDist - dist) / safeDist, 2); 
                            repX += (edx / dist) * force;
                            repY += (edy / dist) * force;
                        }
                    });

                    dx = baseDx + repX * 2.5;
                    dy = baseDy + repY * 2.5;
                    
                    let finalLen = Math.hypot(dx, dy);
                    if (finalLen > 0) { dx /= finalLen; dy /= finalLen; }
                } else {
                    if (isUsingJoystick) { dx = joystickVector.x; dy = joystickVector.y; } 
                    else {
                        if (keys.w || keys.ArrowUp) dy -= 1;
                        if (keys.s || keys.ArrowDown) dy += 1;
                        if (keys.a || keys.ArrowLeft) dx -= 1;
                        if (keys.d || keys.ArrowRight) dx += 1;
                    }
                }

                const len = Math.hypot(dx, dy);
                this.isMoving = len > 0;
                if (this.isMoving) {
                    dx /= len; dy /= len;
                    this.lastDx = dx; this.lastDy = dy;
                    if (dx > 0) this.facing = 1;
                    else if (dx < 0) this.facing = -1;
                }

                this.x += dx * this.speed * dt;
                this.y += dy * this.speed * dt;
                
                if (this.hitTimer > 0) this.hitTimer -= dt;

                if (this.skills['REGEN']) {
                    this.regenTimer -= dt;
                    if (this.regenTimer <= 0) {
                        this.regenTimer = 1.0;
                        const healAmount = WEAPONS['REGEN'].levels[this.skills['REGEN'].level - 1].val;
                        if (this.hp < this.maxHp) {
                            this.hp = Math.min(this.maxHp, this.hp + healAmount);
                            updateHUD();
                            floatingTexts.push(new FloatingText(this.x, this.y - 30, `+${healAmount}`, '#22c55e'));
                        }
                    }
                }

                if (this.skills['AURA']) {
                    const auraStats = WEAPONS['AURA'].levels[this.skills['AURA'].level - 1];
                    this.auraTimer -= dt;
                    if (this.auraTimer <= 0) {
                        this.auraTimer = auraStats.tick;
                        const radius = 100 * auraStats.area;
                        const dmg = auraStats.baseDmg * this.baseDmgMult;
                        
                        enemies.forEach(e => {
                            if (Math.hypot(e.x - this.x, e.y - this.y) < radius + e.radius) {
                                e.takeDamage(dmg);
                            }
                        });
                        createParticles(this.x, this.y, '#a855f7', 3, 3);
                    }
                }

                this.handleWeapons(dt);
            }

            handleWeapons(dt) {
                for (const [key, skillData] of Object.entries(this.skills)) {
                    const template = WEAPONS[key];
                    if (template.type === 'passive' || key === 'AURA') continue; 
                    
                    const stats = template.levels[skillData.level - 1];

                    if (key === 'FRISBEE') {
                        const maxFrisbees = stats.amount;
                        const currentFrisbees = projectiles.filter(p => p instanceof Frisbee);
                        if (currentFrisbees.length < maxFrisbees) {
                            projectiles.push(new Frisbee(this, currentFrisbees.length));
                        } else if (currentFrisbees.length > maxFrisbees) {
                            currentFrisbees[currentFrisbees.length - 1].active = false;
                        }
                        continue;
                    }

                    skillData.cooldownTimer -= dt;
                    if (skillData.cooldownTimer <= 0) {
                        this.fireWeapon(key, stats);
                        skillData.cooldownTimer = stats.cd;
                    }
                }
            }

            fireWeapon(type, stats) {
                const dmg = stats.baseDmg * this.baseDmgMult;
                const area = stats.area || 1;
                const amount = stats.amount || 1;
                
                if (type === 'LASER') {
                    let targets = [...enemies].sort((a,b) => Math.hypot(this.x-a.x, this.y-a.y) - Math.hypot(this.x-b.x, this.y-b.y)).slice(0, amount);
                    targets.forEach(t => {
                        if (Math.hypot(this.x-t.x, this.y-t.y) < 500 * area) {
                            projectiles.push(new LaserProjectile(this.x, this.y, t.x, t.y, dmg, area));
                        }
                    });
                    if(targets.length > 0) createParticles(this.x, this.y, '#22d3ee', 5, 2);
                } 
                else if (type === 'BARK') {
                    projectiles.push(new SonicBark(this.x, this.y, 100 * area, dmg, amount));
                }
                else if (type === 'MISSILE') {
                    for(let i = 0; i < amount; i++) projectiles.push(new MissileProjectile(this.x, this.y, dmg, area));
                }
                else if (type === 'MINE') {
                    for(let i = 0; i < amount; i++) {
                        const offsetX = (Math.random() - 0.5) * 60;
                        const offsetY = (Math.random() - 0.5) * 60;
                        projectiles.push(new MineEntity(this.x + offsetX, this.y + offsetY, dmg, area));
                    }
                }
                else if (type === 'DART') {
                    let baseAngle = Math.atan2(this.lastDy, this.lastDx);
                    for(let i = 0; i < amount; i++) {
                        let angleOffset = (i - (amount-1)/2) * 0.3; // 扇形散开
                        let a = baseAngle + angleOffset;
                        let dirX = Math.cos(a); let dirY = Math.sin(a);
                        projectiles.push(new DartProjectile(this.x, this.y, dirX, dirY, dmg, area));
                    }
                }
            }

            takeDamage(amount) {
                if (this.hitTimer > 0) return; 
                
                if (this.shield > 0) {
                    if (this.shield >= amount) {
                        this.shield -= amount;
                        amount = 0;
                    } else {
                        amount -= this.shield;
                        this.shield = 0;
                    }
                }
                
                if (amount > 0) {
                    this.hp -= amount;
                }
                
                this.hitTimer = 0.5; 
                updateHUD();
                
                document.getElementById('gameCanvas').style.transform = `translate(${(Math.random()-0.5)*10}px, ${(Math.random()-0.5)*10}px)`;
                setTimeout(() => document.getElementById('gameCanvas').style.transform = 'none', 100);

                if (this.hp <= 0) triggerGameOver();
            }

            gainExp(amount) {
                this.exp += amount;
                if (this.exp >= this.expToNext) {
                    this.exp -= this.expToNext;
                    this.level++;
                    this.expToNext = Math.floor(this.expToNext * 1.1 + 20); 
                    triggerLevelUp();
                }
                updateHUD();
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.skills['AURA']) {
                    const auraStats = WEAPONS['AURA'].levels[this.skills['AURA'].level - 1];
                    const radius = 100 * auraStats.area;
                    ctx.save();
                    ctx.rotate(gameTime * 2); 
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.15)'; 
                    ctx.fill();
                    
                    ctx.setLineDash([15, 10, 5, 10]);
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 0.8, 0, Math.PI*2);
                    ctx.setLineDash([5, 15]);
                    ctx.strokeStyle = 'rgba(216, 180, 254, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }
                
                if (this.shield > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 15, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(56, 189, 248, 0.6)`;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.fillStyle = `rgba(56, 189, 248, 0.1)`;
                    ctx.fill();
                }
                
                ctx.shadowBlur = 0;
                if (this.pickupRadius !== this.magnetRadius) {
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.1)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.magnetRadius, 0, Math.PI*2);
                    ctx.stroke();
                }

                ctx.save();
                let bobY = 0;
                let rot = 0;
                if (this.isMoving) {
                    bobY = -Math.abs(Math.sin(gameTime * 15)) * 8; 
                    rot = Math.sin(gameTime * 10) * 0.08; 
                }
                ctx.translate(0, bobY);
                ctx.rotate(rot);
                ctx.scale(this.facing, 1);
                
                if (this.hitTimer > 0 && Math.floor(this.hitTimer * 10) % 2 === 0) ctx.globalAlpha = 0.5;

                if (this.imageLoaded) {
                    const w = this.radius * 4;
                    const h = this.radius * 4 * (225/175);
                    ctx.drawImage(this.petCanvas, -w * 0.45, -h * 0.6, w, h);
                } else {
                    ctx.fillStyle = 'rgba(6, 182, 212, 0.2)';
                    ctx.strokeStyle = '#22d3ee';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                }
                ctx.restore(); 
                ctx.restore(); 
            }
        }

        class Enemy {
            constructor(x, y, typeLevel) {
                this.x = x; this.y = y;
                this.radius = 12 + typeLevel * 2;
                this.baseSpeed = 60 + Math.random() * 40;
                
                let hpScale = difficultyMultiplier;
                if (player && player.level >= 15) {
                    hpScale *= 1.5 + (player.level - 10) * 0.5;
                }
                
                this.maxHp = Math.floor(10 * typeLevel * hpScale);
                this.hp = this.maxHp;
                
                this.damage = 10 + typeLevel * 3;
                this.color = typeLevel === 1 ? '#ef4444' : (typeLevel === 2 ? '#d946ef' : '#f59e0b');
                
                this.expValue = Math.floor(10 * typeLevel * Math.pow(difficultyMultiplier, 0.6)); 
            }

            update(dt) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist > 0) {
                    this.x += (dx / dist) * this.baseSpeed * dt;
                    this.y += (dy / dist) * this.baseSpeed * dt;
                }

                if (dist < this.radius + player.radius) {
                    player.takeDamage(this.damage);
                    this.x -= (dx / dist) * 10; this.y -= (dy / dist) * 10;
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                createParticles(this.x, this.y, this.color, 3, 2);
                floatingTexts.push(new FloatingText(this.x, this.y - 15, Math.floor(amount).toString(), '#fff'));

                if (this.hp <= 0) {
                    killCount++;
                    updateHUD();
                    expGems.push(new ExpGem(this.x, this.y, this.expValue));
                    createParticles(this.x, this.y, this.color, 10, 4);
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                
                const points = 5 + Math.floor(this.radius % 3);
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2 + (gameTime * 2); 
                    const r = (i % 2 === 0) ? this.radius : this.radius * 0.6; 
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                ctx.restore();
            }
        }

        class Boss extends Enemy {
            constructor(x, y, diff) {
                super(x, y, 1);
                this.radius = 50; 
                this.baseSpeed = 70; 
                
                let hpScale = diff;
                if (player && player.level >= 10) {
                    hpScale *= 3 + (player.level - 10) * 0.8;
                }
                
                this.maxHp = Math.floor(1000 * hpScale); 
                this.hp = this.maxHp;
                
                this.damage = 40 + (diff * 10); 
                this.color = '#dc2626'; 
                
                this.expValue = Math.floor(400 * Math.pow(diff, 0.8)); 
                this.isBoss = true;
            }
            takeDamage(amount) {
                super.takeDamage(amount);
                if (this.hp <= 0) {
                    document.getElementById('bossUI').classList.add('hidden');
                    bossEntity = null;
                    createParticles(this.x, this.y, '#f59e0b', 100, 8);
                    loots.push(new BossLoot(this.x, this.y)); 
                    showToast("🎉 核心病毒已消除，掉落了高级道具！");
                } else {
                    const pct = Math.max(0, (this.hp / this.maxHp) * 100);
                    document.getElementById('bossHpBar').style.width = `${pct}%`;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                const scale = 1.3 + Math.sin(gameTime * 5) * 0.1;
                ctx.scale(scale, scale);
                
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                for (let i = 0; i < 16; i++) {
                    const angle = (i / 16) * Math.PI * 2 + (gameTime * 3);
                    const r = (i % 2 === 0) ? this.radius : this.radius * 0.4;
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI*2);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.restore();
            }
        }

        class BossLoot {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 25;
                this.active = true;
                this.floatY = 0;
            }
            update(dt) {
                this.floatY = Math.sin(gameTime * 4) * 10;
                let dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < player.pickupRadius + this.radius) {
                    this.collect();
                }
            }
            collect() {
                this.active = false;
                let effect = Math.floor(Math.random() * 3);
                
                if (effect === 0) {
                    expGems.forEach(gem => gem.collected = true);
                    showToast("🎁 获得BOSS道具：吸收全部经验！");
                } else if (effect === 1) {
                    player.shield = player.maxHp * 0.5;
                    player.maxShield = player.maxHp * 0.5;
                    showToast("🛡️ 获得BOSS道具：50%生命护盾！");
                } else {
                    let heal = player.maxHp * 0.3;
                    player.hp = Math.min(player.maxHp, player.hp + heal);
                    showToast(`💚 获得BOSS道具：回复 ${Math.floor(heal)} HP！`);
                    floatingTexts.push(new FloatingText(player.x, player.y - 30, `+${Math.floor(heal)}`, '#22c55e'));
                }
                
                updateHUD();
                createParticles(this.x, this.y, '#fbbf24', 30, 6);
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y + this.floatY);
                
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#f59e0b';
                
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(18, 0);
                ctx.lineTo(0, 18);
                ctx.lineTo(-18, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#fff";
                ctx.font = '16px "Noto Sans SC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("🎁", 0, 0);
                
                ctx.restore();
            }
        }

        class ExpGem {
            constructor(x, y, value) {
                this.x = x; this.y = y; this.value = value;
                this.radius = 6; this.collected = false; this.speed = 0;
            }
            update(dt) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < player.magnetRadius || this.collected) {
                    this.collected = true;
                    this.speed += 800 * dt; 
                    this.x += (dx / dist) * this.speed * dt;
                    this.y += (dy / dist) * this.speed * dt;

                    if (dist < player.radius) {
                        player.gainExp(this.value);
                        this.hp = -1; 
                    }
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                const hue = (gameTime * 200) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
                ctx.rotate(gameTime * 3);
                ctx.fillRect(-this.radius, -this.radius, this.radius*2, this.radius*2);
                ctx.restore();
            }
        }

        class DartProjectile {
            constructor(x, y, dirX, dirY, damage, areaMult = 1.0) {
                this.x = x; this.y = y;
                this.vx = dirX; this.vy = dirY;
                this.speed = 400;
                this.damage = damage;
                this.radius = 20 * areaMult;
                this.active = true;
                this.state = 'forward'; 
                this.maxDist = 350 * areaMult;
                this.distTraveled = 0;
                this.angle = 0;
                this.hitEnemies = new Set();
            }
            update(dt) {
                this.angle += 15 * dt; 
                
                if (this.state === 'forward') {
                    this.x += this.vx * this.speed * dt;
                    this.y += this.vy * this.speed * dt;
                    this.distTraveled += this.speed * dt;
                    if (this.distTraveled >= this.maxDist) {
                        this.state = 'returning';
                        this.hitEnemies.clear(); 
                    }
                } else {
                    let dx = player.x - this.x;
                    let dy = player.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < player.radius + this.radius) {
                        this.active = false;
                        return;
                    }
                    this.x += (dx / dist) * this.speed * 1.5 * dt; 
                    this.y += (dy / dist) * this.speed * 1.5 * dt;
                }

                enemies.forEach(e => {
                    if (!this.hitEnemies.has(e)) {
                        if (Math.hypot(e.x - this.x, e.y - this.y) < this.radius + e.radius) {
                            e.takeDamage(this.damage);
                            this.hitEnemies.add(e);
                        }
                    }
                });
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.fillStyle = '#3b82f6';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-15, -15);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-15, 15);
                ctx.closePath();
                ctx.fill();
                
                ctx.strokeStyle = '#93c5fd';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
        }

        class LaserProjectile {
            constructor(x, y, tx, ty, damage, areaMult = 1.0) {
                this.x = x; this.y = y;
                const dx = tx - x; const dy = ty - y;
                const dist = Math.hypot(dx, dy);
                this.vx = (dx / dist); this.vy = (dy / dist);
                this.length = 400 * areaMult; 
                this.damage = damage;
                this.width = 6 * areaMult; 
                this.lifeTime = 0.2; 
                this.active = true;
                this.checkHit();
            }
            checkHit() {
                const p1x = this.x, p1y = this.y;
                const p2x = this.x + this.vx * this.length;
                const p2y = this.y + this.vy * this.length;
                
                enemies.forEach(e => {
                    const num = Math.abs((p2y - p1y)*e.x - (p2x - p1x)*e.y + p2x*p1y - p2y*p1x);
                    const den = this.length;
                    const distToLine = num / den;
                    
                    if (distToLine < e.radius + this.width) {
                        const dot = (e.x - p1x)*this.vx + (e.y - p1y)*this.vy;
                        if (dot > 0 && dot < this.length) e.takeDamage(this.damage);
                    }
                });
            }
            update(dt) { this.lifeTime -= dt; if (this.lifeTime <= 0) this.active = false; }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.vx * this.length, this.y + this.vy * this.length);
                ctx.strokeStyle = `rgba(34, 211, 238, ${this.lifeTime / 0.2})`; 
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.lifeTime / 0.2})`;
                ctx.lineWidth = this.width * 0.4;
                ctx.stroke();
                ctx.restore();
            }
        }

        class SonicBark {
            constructor(x, y, maxRadius, damage, pulses = 1) {
                this.x = x; this.y = y;
                this.maxRadius = maxRadius;
                this.radius = 10;
                this.damage = damage;
                this.maxLife = 0.3; this.lifeTime = this.maxLife;
                this.pulses = pulses; this.active = true;
                this.hitList = new Set();
                this.colorPrefix = '244, 63, 94'; 
            }
            update(dt) {
                this.lifeTime -= dt;
                const progress = 1 - (this.lifeTime / this.maxLife);
                this.radius = this.maxRadius * Math.pow(Math.max(0, progress), 0.5); 
                
                enemies.forEach(e => {
                    if (!this.hitList.has(e)) {
                        const dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < this.radius + e.radius && dist > this.radius - 20) {
                            e.takeDamage(this.damage); this.hitList.add(e);
                        }
                    }
                });
                if (this.lifeTime <= 0) {
                    this.pulses--;
                    if (this.pulses > 0) { this.lifeTime = this.maxLife; this.hitList.clear(); } 
                    else { this.active = false; }
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(${this.colorPrefix}, ${Math.max(0, this.lifeTime / this.maxLife)})`;
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Frisbee {
            constructor(owner, index) {
                this.owner = owner; this.index = index;
                this.angle = index * Math.PI; 
                this.orbitRadius = 80; this.radius = 15;
                this.speed = 3; this.damage = 10;
                this.active = true; this.x = 0; this.y = 0;
            }
            update(dt) {
                const skill = this.owner.skills['FRISBEE'];
                if (!skill) { this.active = false; return; }
                const stats = WEAPONS['FRISBEE'].levels[skill.level - 1];
                
                this.damage = stats.baseDmg * this.owner.baseDmgMult;
                this.orbitRadius = 80 * (stats.area || 1);
                this.radius = 15 * (stats.area || 1);
                this.speed = stats.speed || 3;

                this.angle += this.speed * dt;
                
                const currentFrisbees = projectiles.filter(p => p instanceof Frisbee);
                const trueIndex = currentFrisbees.indexOf(this);
                if (trueIndex !== -1) {
                    const offset = (Math.PI * 2 / currentFrisbees.length) * trueIndex;
                    this.x = this.owner.x + Math.cos(this.angle + offset) * this.orbitRadius;
                    this.y = this.owner.y + Math.sin(this.angle + offset) * this.orbitRadius;
                }

                enemies.forEach(e => {
                    if (Math.hypot(e.x - this.x, e.y - this.y) < this.radius + e.radius) {
                        if(Math.random() < 0.1) e.takeDamage(this.damage); 
                    }
                });
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * -4);
                
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(167, 139, 250, 0.4)'; ctx.fill();
                ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.beginPath(); ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius); ctx.stroke();
                ctx.restore();
            }
        }

        class MissileProjectile {
            constructor(x, y, damage, areaMult = 1.0) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 200; 
                this.vy = -100 - Math.random() * 100;
                this.speed = 300; this.damage = damage;
                this.radius = 6; this.explosionRadius = 60 * areaMult;
                this.active = true; this.lifeTime = 5.0; 
                this.target = this.findTarget();
                this.angle = Math.atan2(this.vy, this.vx);
            }
            findTarget() {
                let closest = null; let minDist = Infinity;
                for (const e of enemies) {
                    const dist = Math.hypot(this.x - e.x, this.y - e.y);
                    if (dist < minDist) { minDist = dist; closest = e; }
                }
                return closest;
            }
            update(dt) {
                this.lifeTime -= dt;
                if (this.lifeTime <= 0) { this.explode(); return; }
                
                if (!this.target || this.target.hp <= 0) this.target = this.findTarget();
                
                if (this.target) {
                    const dx = this.target.x - this.x; const dy = this.target.y - this.y;
                    const desiredAngle = Math.atan2(dy, dx);
                    
                    let diff = desiredAngle - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.angle += Math.sign(diff) * Math.min(Math.abs(diff), 4.0 * dt);
                }
                
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.x += this.vx * dt; this.y += this.vy * dt;
                
                if (Math.random() < 0.3) createParticles(this.x, this.y, '#f59e0b', 1, 2);
                
                for (const e of enemies) {
                    if (Math.hypot(this.x - e.x, this.y - e.y) < e.radius + this.radius) { this.explode(); break; }
                }
            }
            explode() {
                this.active = false;
                createParticles(this.x, this.y, '#ef4444', 15, 4);
                let hitAny = false;
                enemies.forEach(e => {
                    if (Math.hypot(e.x - this.x, e.y - this.y) < this.explosionRadius + e.radius) {
                        e.takeDamage(this.damage); hitAny = true;
                    }
                });
                if (hitAny) {
                    const bark = new SonicBark(this.x, this.y, this.explosionRadius, 0, 1);
                    bark.colorPrefix = '245, 158, 11'; 
                    projectiles.push(bark);
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.fillStyle = '#f59e0b'; ctx.fillRect(-8, -4, 16, 8);
                ctx.fillStyle = '#ef4444'; ctx.fillRect(8, -3, 4, 6); 
                ctx.restore();
            }
        }

        class MineEntity {
            constructor(x, y, damage, areaMult = 1.0) {
                this.x = x; this.y = y;
                this.damage = damage; this.explosionRadius = 80 * areaMult;
                this.active = true; this.lifeTime = 10.0; 
                this.armTimer = 0.5; this.radius = 8;
            }
            update(dt) {
                this.lifeTime -= dt;
                if (this.lifeTime <= 0) { this.explode(); return; }
                if (this.armTimer > 0) { this.armTimer -= dt; return; }
                
                for (const e of enemies) {
                    if (Math.hypot(this.x - e.x, this.y - e.y) < e.radius + this.radius + 15) { this.explode(); break; }
                }
            }
            explode() {
                this.active = false;
                createParticles(this.x, this.y, '#22d3ee', 20, 5);
                enemies.forEach(e => {
                    if (Math.hypot(e.x - this.x, e.y - this.y) < this.explosionRadius + e.radius) { e.takeDamage(this.damage); }
                });
                const bark = new SonicBark(this.x, this.y, this.explosionRadius, 0, 1);
                bark.colorPrefix = '34, 211, 238'; 
                projectiles.push(bark);
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.armTimer > 0) ctx.globalAlpha = 0.5;
                
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fillStyle = '#0f172a'; ctx.fill();
                ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2; ctx.stroke();
                
                if (Math.floor(gameTime * 5) % 2 === 0 && this.armTimer <= 0) {
                    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2);
                    ctx.fillStyle = '#ef4444'; ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, size, speedX, speedY, life) {
                this.x = x; this.y = y; this.color = color; this.size = size;
                this.vx = speedX; this.vy = speedY; this.life = life; this.maxLife = life;
            }
            update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.life = 0.8; this.maxLife = 0.8; this.vy = -30;
                this.x += (Math.random() - 0.5) * 20;
            }
            update(dt) { this.y += this.vy * dt; this.life -= dt; }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.text.includes('+') ? '20px' : '16px'} "Noto Sans SC"`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function createParticles(x, y, color, count, size) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle( x, y, color, Math.random() * size + 1, (Math.random() - 0.5) * 150, (Math.random() - 0.5) * 150, 0.2 + Math.random() * 0.4 ));
            }
        }

        function initGame() {
            player = new Player();
            enemies = []; projectiles = []; expGems = []; loots = []; particles = []; floatingTexts = [];
            killCount = 0; gameTime = 0; difficultyMultiplier = 1.0;
            enemySpawnRate = 1200; enemySpawnTimer = 0;
            nextBossTime = 60; bossEntity = null;
            document.getElementById('bossUI').classList.add('hidden');
            updateHUD();
        }

        function startGame() {
            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');
            initGame(); currentState = GameState.PLAYING;
            lastTime = performance.now();
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        async function triggerGameOver() {
            currentState = GameState.GAME_OVER;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('hud').classList.remove('flex');
            document.getElementById('menuOverlay').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            
            const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            const timeStr = `${m}:${s}`;
            
            document.getElementById('finalTime').innerText = timeStr;
            document.getElementById('finalKills').innerText = killCount;
            document.getElementById('finalLevel').innerText = `Lv.${player.level}`;

            const restartBtn = document.getElementById('restartBtn');
            
            // 自动上传战绩
            if (GITHUB_TOKEN && myIdentity) {
                restartBtn.innerText = "数据上传中...";
                restartBtn.disabled = true;
                
                try {
                    await saveGameRecord(timeStr, Math.floor(gameTime), killCount, player.level);
                } catch (e) { console.error("战绩保存失败", e); }
                
                restartBtn.innerText = "系统重启 (RESTART)";
                restartBtn.disabled = false;
            } else {
                restartBtn.disabled = false;
            }
        }

        function resetGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }

        // ================== 倍速、暂停与自动战斗 ==================
        function cycleGameSpeed() {
            if (currentState !== GameState.PLAYING && currentState !== GameState.PAUSED) return;
            gameSpeedMultiplier += 1;
            if (gameSpeedMultiplier > 5) gameSpeedMultiplier = 1;
            document.getElementById('speedBtn').innerHTML = `▶️ ${gameSpeedMultiplier}X 倍速`;
        }

        function togglePause() {
            const menuOverlay = document.getElementById('menuOverlay');
            const pauseScreen = document.getElementById('pauseScreen');
            
            if (currentState === GameState.PLAYING) {
                currentState = GameState.PAUSED;
                menuOverlay.classList.remove('hidden');
                pauseScreen.classList.remove('hidden');
                pauseScreen.classList.add('flex', 'flex-col', 'items-center', 'justify-center');
            } else if (currentState === GameState.PAUSED) {
                currentState = GameState.PLAYING;
                menuOverlay.classList.add('hidden');
                pauseScreen.classList.add('hidden');
                pauseScreen.classList.remove('flex', 'flex-col', 'items-center', 'justify-center');
                lastTime = performance.now(); 
                requestAnimationFrame(gameLoop);
            }
        }

        function toggleAutoBattle() {
            isAutoBattle = !isAutoBattle;
            const btn = document.getElementById('autoBtn');
            if (isAutoBattle) {
                btn.innerHTML = '🤖 自动: 开';
                btn.classList.add('bg-green-700/80', 'text-white');
                btn.classList.remove('bg-slate-800/90', 'text-green-400');
            } else {
                btn.innerHTML = '🤖 自动: 关';
                btn.classList.remove('bg-green-700/80', 'text-white');
                btn.classList.add('bg-slate-800/90', 'text-green-400');
            }
        }
        // ====================================================

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden'); t.classList.add('animate-fade-in');
            setTimeout(() => { t.classList.add('hidden'); t.classList.remove('animate-fade-in'); }, 3500);
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const spawnDist = Math.max(GAME_WIDTH, GAME_HEIGHT) / 2 + 100; 
            const x = player.x + Math.cos(angle) * spawnDist;
            const y = player.y + Math.sin(angle) * spawnDist;

            let type = 1;
            if (difficultyMultiplier > 1.5 && Math.random() < 0.3) type = 2;
            if (difficultyMultiplier > 2.5 && Math.random() < 0.1) type = 3;

            enemies.push(new Enemy(x, y, type));
        }

        function spawnBoss() {
            const angle = Math.random() * Math.PI * 2;
            const spawnDist = Math.max(GAME_WIDTH, GAME_HEIGHT) / 2 + 150;
            bossEntity = new Boss(player.x + Math.cos(angle) * spawnDist, player.y + Math.sin(angle) * spawnDist, difficultyMultiplier);
            enemies.push(bossEntity);
            
            const ui = document.getElementById('bossUI');
            ui.classList.remove('hidden');
            document.getElementById('bossHpBar').style.width = '100%';
            showToast("⚠️ 极度危险：核心病毒已入侵！");
        }

        function updateHUD() {
            const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;
            document.getElementById('killCountDisplay').innerText = killCount;
            document.getElementById('levelDisplay').innerText = player.level;
            document.getElementById('expText').innerText = `${player.exp} / ${player.expToNext}`;
            document.getElementById('expBar').style.width = `${Math.min(100, (player.exp / player.expToNext) * 100)}%`;
            
            let shieldText = player.shield > 0 ? ` (+${Math.floor(player.shield)}🛡️)` : '';
            document.getElementById('hpText').innerText = `${Math.floor(player.hp)} / ${Math.floor(player.maxHp)}${shieldText}`;

            const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
            const hpBarEl = document.getElementById('hpBar');
            hpBarEl.style.width = `${hpPct}%`;
            
            if (hpPct < 30) {
                hpBarEl.classList.replace('from-rose-600', 'from-red-600');
                hpBarEl.classList.replace('to-rose-400', 'to-red-500');
                hpBarEl.style.boxShadow = '0 0 15px rgba(220,38,38,0.8)';
            } else {
                hpBarEl.classList.replace('from-red-600', 'from-rose-600');
                hpBarEl.classList.replace('to-red-500', 'to-rose-400');
                hpBarEl.style.boxShadow = '0 0 10px rgba(244,63,94,0.5)';
            }
        }

        function triggerLevelUp() {
            currentState = GameState.LEVEL_UP;
            isUsingJoystick = false; joystickVector = {x:0, y:0}; joystickBase.style.display = 'none';

            document.getElementById('menuOverlay').classList.remove('hidden');
            const levelScreen = document.getElementById('levelUpScreen');
            levelScreen.classList.remove('hidden'); levelScreen.classList.add('flex');
            
            const container = document.getElementById('upgradeOptions');
            container.innerHTML = '';

            const validOptions = Object.keys(WEAPONS);
            const options = validOptions.sort(() => 0.5 - Math.random()).slice(0, 3);

            if (options.length === 0) { player.hp = player.maxHp; applyUpgrade(null); return; }

            options.forEach(key => {
                const weapon = WEAPONS[key];
                const currentLvl = player.skills[key] ? player.skills[key].level : 0;
                let nextLvl = currentLvl + 1;
                
                if (nextLvl > weapon.levels.length) {
                    let prev = weapon.levels[weapon.levels.length - 1];
                    let next = { ...prev };
                    
                    let descTags = ["【突破】"];
                    
                    if (weapon.type === 'active' || key === 'AURA') {
                         const dmgMult   = 1.20; 
                         const cdMult    = 0.95; 
                         const minCd     = 0.2;  
                         const areaMult  = 1.1; 
                         const speedMult = 1.1; 
                         const tickMult  = 0.90; 
                         const minTick   = 0.1; 
                         const amountPerLevels = 3; 
                         
                         next.baseDmg = Math.floor(prev.baseDmg * dmgMult) + 1;
                         descTags.push("伤害+20%");

                         if (next.cd) {
                             next.cd = Math.max(minCd, prev.cd * cdMult);
                             descTags.push("冷却-5%");
                         }
                         if (next.area) {
                             next.area = prev.area * areaMult;
                             descTags.push("范围+10%");
                         }
                         if (next.speed) {
                             next.speed = prev.speed * speedMult;
                             descTags.push("速度+10%");
                         }
                         if (next.tick) {
                             next.tick = Math.max(minTick, prev.tick * tickMult);
                             descTags.push("频率+10%");
                         }
                         
                         if (next.amount && amountPerLevels > 0) {
                             const overMaxLvl = nextLvl - weapon.maxLevel;
                             if (overMaxLvl % amountPerLevels === 0) {
                                 next.amount = prev.amount + 1;
                                 descTags.push("数量+1");
                             }
                         }
                    } else {
                         if (key === 'MAGNET') { 
                             next.val += 0.3;  
                             descTags.push("拾取范围+30%"); 
                         }
                         else if (key === 'SPEED') { 
                             next.val += 0.05; 
                             descTags.push("移动速度+5%"); 
                         }
                         else if (key === 'REGEN') { 
                             next.val += 3;    
                             descTags.push("生命回复+3/秒"); 
                         }
                         else if (key === 'MAX_HP') { 
                             next.val += 0.2;  
                             descTags.push("最大生命+20%"); 
                         }
                    }
                    
                    next.desc = descTags.join(" ");
                    weapon.levels.push(next);
                }

                const statsInfo = weapon.levels[nextLvl - 1];
                let title = currentLvl === 0 ? `获取: ${weapon.name}` : `升级: ${weapon.name} (Lv.${nextLvl}${nextLvl > (weapon.maxLevel || 5) ? ' MAX+' : ''})`;

                let oldDesc = currentLvl > 0 ? weapon.levels[currentLvl - 1].desc : "";
                let newDesc = statsInfo.desc;
                
                let descHTML = currentLvl === 0 
                    ? `<p class="text-xs text-cyan-300 mt-2 leading-relaxed">${newDesc}</p>` 
                    : `<p class="text-xs text-slate-500 mt-1 line-through decoration-rose-500/80">${oldDesc}</p>
                       <p class="text-xs text-cyan-300 mt-1 font-bold leading-relaxed">➡️ ${newDesc}</p>`;

                const btn = document.createElement('button');
                btn.className = "flex items-start gap-4 p-3 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-xl transition-all text-left group";
                btn.onclick = () => applyUpgrade(key);
                
                btn.innerHTML = `
                    <div class="text-3xl bg-slate-900 p-2 rounded-lg border border-slate-700 group-hover:border-cyan-400 group-hover:shadow-[0_0_10px_rgba(34,211,238,0.5)] transition-all flex items-center justify-center">${weapon.icon}</div>
                    <div class="flex-1">
                        <h3 class="font-bold text-cyan-300 text-lg">${title}</h3>
                        ${descHTML}
                    </div>
                `;
                container.appendChild(btn);
            });

            if (isAutoBattle) {
                setTimeout(() => {
                    if (currentState === GameState.LEVEL_UP && options.length > 0) {
                        const randomOption = options[Math.floor(Math.random() * options.length)];
                        applyUpgrade(randomOption);
                    }
                }, 800);
            }
        }

        function applyUpgrade(key) {
            if (key) {
                if (!player.skills[key]) {
                    player.skills[key] = { level: 1, cooldownTimer: WEAPONS[key].levels[0].cd || 0 };
                } else {
                    player.skills[key].level++;
                }

                if (key === 'MAX_HP') {
                    const oldMax = player.maxHp;
                    const mult = WEAPONS['MAX_HP'].levels[player.skills['MAX_HP'].level - 1].val;
                    player.maxHp = player.baseMaxHp * mult;
                    const hpDiff = player.maxHp - oldMax;
                    player.hp += hpDiff; 
                    updateHUD();
                    floatingTexts.push(new FloatingText(player.x, player.y - 30, `+${Math.floor(hpDiff)}`, '#22c55e'));
                }
            }

            document.getElementById('levelUpScreen').classList.add('hidden');
            document.getElementById('levelUpScreen').classList.remove('flex');
            document.getElementById('menuOverlay').classList.add('hidden');
            
            currentState = GameState.PLAYING;
            lastTime = performance.now(); 
        }

        function gameLoop(timestamp) {
            if (currentState !== GameState.PLAYING) {
                if (currentState !== GameState.PAUSED) {
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
                return;
            }

            const realDt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (realDt > 0.1) return requestAnimationFrame(gameLoop); 
            
            const dt = realDt * gameSpeedMultiplier;
            gameTime += dt;
            
            difficultyMultiplier = 1 + (gameTime / 50);
            
            let baseRate = Math.max(300, 1000 - (gameTime * 1));
            let baseCount = Math.floor(2 + (difficultyMultiplier * 0.6));

            if (player.level < 5) {
                baseRate = 1500 - (player.level * 200); 
                baseCount = 1 + Math.floor(player.level / 2); 
            }

            enemySpawnRate = baseRate;
            enemySpawnTimer += dt * 1000;
            
            if (enemySpawnTimer > enemySpawnRate) {
                enemySpawnTimer = 0;
                for(let i=0; i<baseCount; i++) spawnEnemy();
            }

            if (gameTime >= nextBossTime) {
                spawnBoss();
                nextBossTime += 60; 
            }

            player.update(dt);
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].update(dt);
                if (!projectiles[i].active) projectiles.splice(i, 1);
            }
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(dt);
                if (enemies[i].hp <= 0) enemies.splice(i, 1);
            }
            for (let i = expGems.length - 1; i >= 0; i--) {
                expGems[i].update(dt);
                if (expGems[i].hp === -1) expGems.splice(i, 1); 
            }
            for (let i = loots.length - 1; i >= 0; i--) {
                loots[i].update(dt);
                if (!loots[i].active) loots.splice(i, 1);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update(dt);
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            if (Math.floor(gameTime) > Math.floor(gameTime - dt)) updateHUD();

            document.body.style.backgroundPosition = `${-player.x}px ${-player.y}px`;
            
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.save();
            const cameraOffsetX = (GAME_WIDTH / 2) - player.x;
            const cameraOffsetY = (GAME_HEIGHT / 2) - player.y;
            ctx.translate(cameraOffsetX, cameraOffsetY);

            loots.forEach(loot => loot.draw(ctx));
            expGems.forEach(gem => gem.draw(ctx));
            projectiles.filter(p => p instanceof Frisbee).forEach(p => p.draw(ctx));
            enemies.forEach(enemy => enemy.draw(ctx));
            
            player.draw(ctx);
            
            projectiles.filter(p => !(p instanceof Frisbee)).forEach(p => p.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            floatingTexts.forEach(t => t.draw(ctx));

            ctx.restore(); 

            animationFrameId = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
