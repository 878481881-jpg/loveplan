<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博宠物无双 🐾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #0f172a; 
            background-image: radial-gradient(#1e293b 1px, transparent 1px); 
            background-size: 30px 30px;
            overflow: hidden; 
            touch-action: none; 
            color: #f8fafc;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        .interactive { pointer-events: auto; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-10px); } 
            100% { transform: translateY(0px); } 
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .progress-bar { transition: width 0.2s linear; }

        #joystickZone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 30;
            touch-action: none;
        }
        #joystickBase {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2) inset;
        }
        #joystickStick {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }

        .cyber-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="transition-none">

    <canvas id="gameCanvas"></canvas>

    <div id="joystickZone" class="interactive lg:hidden"></div>
    <div id="joystickBase" class="pointer-events-none z-[35]"><div id="joystickStick"></div></div>

    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-rose-600/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-[0_0_20px_rgba(244,63,94,0.5)] text-sm font-bold hidden z-[100] tracking-widest border border-rose-400 transition-all"></div>

    <div class="ui-layer flex flex-col justify-between p-4">
        <div id="hud" class="hidden flex-col gap-2 transition-opacity relative z-40">
            <div id="bossUI" class="hidden w-full max-w-md mx-auto mb-4 animate-pulse">
                <div class="text-center text-red-500 font-black tracking-widest drop-shadow-md text-lg mb-1">🔴 核心病毒入侵 🔴</div>
                <div class="w-full bg-slate-900 rounded-full h-4 border-2 border-red-900 overflow-hidden shadow-[0_0_20px_rgba(220,38,38,0.8)]">
                    <div id="bossHpBar" class="bg-gradient-to-r from-red-700 to-red-400 h-full w-full transition-all duration-200"></div>
                </div>
            </div>

            <div class="flex justify-between items-center w-full max-w-md mx-auto">
                <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                    <span class="text-xl">⏱️</span>
                    <span id="timeDisplay" class="font-black text-cyan-400 font-mono tracking-wider">00:00</span>
                </div>
                <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                    <span class="text-xl">👾</span>
                    <span id="killCountDisplay" class="font-black text-rose-400 font-mono">0</span>
                </div>
            </div>

            <!-- 控制面板：自动战斗、倍速与暂停 -->
            <div class="flex justify-between items-center w-full max-w-md mx-auto mt-2 pointer-events-auto gap-2">
                <button id="autoBtn" onclick="toggleAutoBattle()" class="flex-1 bg-slate-800/90 px-3 py-1.5 rounded-full border border-green-700 text-green-400 font-bold text-xs shadow-[0_0_10px_rgba(34,197,94,0.2)] active:scale-95 transition-all flex items-center justify-center gap-1">
                    🤖 自动: 关
                </button>
                <button id="speedBtn" onclick="cycleGameSpeed()" class="flex-1 bg-slate-800/90 px-3 py-1.5 rounded-full border border-cyan-700 text-cyan-400 font-bold text-xs shadow-[0_0_10px_rgba(34,211,238,0.2)] active:scale-95 transition-transform flex items-center justify-center gap-1">
                    ▶️ 1X 倍速
                </button>
                <button id="pauseBtn" onclick="togglePause()" class="flex-1 bg-slate-800/90 px-3 py-1.5 rounded-full border border-yellow-700 text-yellow-400 font-bold text-xs shadow-[0_0_10px_rgba(250,204,21,0.2)] active:scale-95 transition-transform flex items-center justify-center gap-1">
                    ⏸️ 暂停
                </button>
            </div>

            <div class="w-full max-w-md mx-auto mt-2 relative">
                <div class="flex justify-between text-xs font-bold text-cyan-300 absolute -top-4 w-full px-1 z-10 drop-shadow-md">
                    <span>Lv.<span id="levelDisplay">1</span></span>
                    <span id="expText">0 / 100</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-3 border border-slate-600 overflow-hidden shadow-inner">
                    <div id="expBar" class="bg-gradient-to-r from-cyan-600 to-cyan-300 h-full rounded-full progress-bar shadow-[0_0_10px_rgba(34,211,238,0.5)]" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="w-full max-w-md mx-auto mt-5 relative">
                <div class="flex justify-between text-xs font-bold text-rose-300 absolute -top-4 w-full px-1 z-10 drop-shadow-md">
                    <span>HP</span>
                    <span id="hpText">100 / 100</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 border border-slate-600 overflow-hidden">

                        <polygon points="10,20 30,10 40,30 20,40" fill="rgba(6,182,212,0.2)" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>

        </div>

            <p class="text-slate-400 mb-6">连接断开...</p>
            
            <div class="bg-slate-800 p-4 rounded-xl mb-6 border border-slate-700 space-y-2">

                ▶ 继续游戏 (RESUME)
            </button>
        </div>
    </div>

        let touchId = null;
        let jBaseX = 0, jBaseY = 0;
        const maxStickDist = 50;

        joystickZone.addEventListener('touchstart', e => {
            if (currentState !== GameState.PLAYING) return;
            e.preventDefault();
            if (touchId !== null) return; 
            
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            isUsingJoystick = true;

            jBaseX = touch.clientX; jBaseY = touch.clientY;
            joystickBase.style.left = jBaseX + 'px';
            joystickBase.style.top = jBaseY + 'px';
            joystickBase.style.display = 'block';
            joystickStick.style.transform = `translate(-50%, -50%)`;
            updateJoystickVector(touch.clientX, touch.clientY);
        }, {passive: false});

        joystickZone.addEventListener('touchmove', e => {
            if (currentState !== GameState.PLAYING || touchId === null) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    updateJoystickVector(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    break;
                }
            }
        }, {passive: false});

        const handleTouchEnd = (e) => {
            if (touchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchId) {
                    touchId = null; isUsingJoystick = false;
                    joystickVector = { x: 0, y: 0 };
                    joystickBase.style.display = 'none';
                    joystickStick.style.transform = `translate(-50%, -50%)`;
                    break;
                }
            }
        };
        joystickZone.addEventListener('touchend', handleTouchEnd);
        joystickZone.addEventListener('touchcancel', handleTouchEnd);

        function updateJoystickVector(tx, ty) {
            let dx = tx - jBaseX; let dy = ty - jBaseY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxStickDist) { dx = (dx / dist) * maxStickDist; dy = (dy / dist) * maxStickDist; }
            joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            let norm = Math.hypot(dx, dy);
            if (norm > 0) { joystickVector.x = dx / maxStickDist; joystickVector.y = dy / maxStickDist; } 
            else { joystickVector = { x: 0, y: 0 }; }
        }

        // ================== GitHub 数据读取与写入核心逻辑 ==================
        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (response.status === 404) return { data: {}, sha: null }; 
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(contentStr || '{}'), sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update game record`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (!response.ok) return { success: false, sha: sha };
                
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        async function saveGameRecord(timeStr, timeSec, kills, level) {
            if (!GITHUB_TOKEN || !myIdentity) return;
            const myPath = myIdentity === '哼哼' ? FILE_H_GECAO : FILE_Q_GECAO;
            const myData = myIdentity === '哼哼' ? dataH : dataQ;
            let mySha = myIdentity === '哼哼' ? shaH : shaQ;

            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const record = { timeStr, timeSec, kills, level, date: dateStr };

            if (!myData.history) myData.history = [];
            myData.history.unshift(record);
            if (myData.history.length > 50) myData.history.pop(); 

            if (!myData.highest || timeSec > myData.highest.timeSec || (timeSec === myData.highest.timeSec && kills > myData.highest.kills)) {
                myData.highest = record;
            }

            const res = await updateFile(myPath, myData, mySha);
            if (res.success) {
                if (myIdentity === '哼哼') shaH = res.sha; else shaQ = res.sha;
            }
            renderLeaderboard(); 
        }

        function getInterpolatedPet(level) {
            let t = 0; let p1, p2;
            if (level < 20) { p1 = basePoses[0]; p2 = basePoses[1]; t = (level - 1) / 19; } 
            else if (level < 60) { p1 = basePoses[1]; p2 = basePoses[2]; t = (level - 20) / 40; } 
            else if (level < 100) { p1 = basePoses[2]; p2 = basePoses[3]; t = (level - 60) / 40; }
            else if (level < 150) { p1 = basePoses[3]; p2 = basePoses[4]; t = (level - 100) / 50; }
            else if (level <= 200) { p1 = basePoses[4]; p2 = basePoses[5]; t = (level - 150) / 50; }
            else { p1 = basePoses[5]; p2 = basePoses[5]; t = 1; }
            t = t * t * (3 - 2 * t);
            return { 
                head: lerpArray(p1.head, p2.head, t).join(','), earL: lerpArray(p1.earL, p2.earL, t).join(','), 
                earR: lerpArray(p1.earR, p2.earR, t).join(','), visor: lerpArray(p1.visor, p2.visor, t).join(','), 
                core: lerpArray(p1.core, p2.core, t).join(','), body: lerpArray(p1.body, p2.body, t).join(','), 
                pawL: lerpArray(p1.pawL, p2.pawL, t).join(','), pawR: lerpArray(p1.pawR, p2.pawR, t).join(','), 
                tail: lerpArray(p1.tail, p2.tail, t).join(','), eyeSize: lerp(p1.eyeSize, p2.eyeSize, t), 
                wingScale: lerp(p1.wingScale, p2.wingScale, t), fangLength: lerp(p1.fangLength, p2.fangLength, t), 
                armorOpacity: lerp(p1.armorOpacity, p2.armorOpacity, t), crownScale: Math.max(0, lerp(p1.crownScale, p2.crownScale, t)) 
            };
        }
