<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心愿存钱罐 🐷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05), 0 2px 4px -1px rgba(225, 29, 72, 0.03);
        }

        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, margin 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.expanded {
            max-height: 500px;
            opacity: 1;
            margin-top: 1rem;
        }
        .chevron { transition: transform 0.3s ease; }
        .chevron.expanded { transform: rotate(180deg); }
        
        .progress-bar-stripes {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 relative">

    <!-- 全局加载遮罩 -->
    <div id="globalLoader" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <svg class="animate-spin h-10 w-10 text-rose-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-rose-600 font-medium" id="loaderText">正在同步数据...</span>
    </div>
    
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-500 flex items-center justify-center gap-2">
               <span>🐷</span> 心愿存钱罐 <span>🐷</span>
            </h1>
        </div>
        <div class="w-9 h-9"></div> 
    </header>
    
    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="moqi.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">默契挑战</a>
        <a href="wishfund.html" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">心愿存钱罐</a>
    </div>        

    <div class="w-full max-w-md glass-panel rounded-2xl p-4 mb-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-rose-200 to-pink-300 flex items-center justify-center text-xl shadow-sm border-2 border-white">
                <span id="myAvatar">🐰</span>
            </div>
            <div>
                <div class="text-xs text-gray-500 mb-0.5">我的身份</div>
                <div class="font-bold text-rose-600" id="myIdentityName">加载中...</div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-gray-500 mb-0.5">我的可用积分 🪙</div>
            <div class="font-black text-2xl text-amber-500 drop-shadow-sm flex items-center justify-end gap-1">
                <span id="myPoints">--</span>
            </div>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col items-center pb-20">
        
        <div class="w-full flex justify-between items-end mb-4 px-2">
            <h2 class="text-lg font-bold text-gray-800">我们的心愿清单 📜</h2>
            <button onclick="openAddModal()" class="text-sm bg-rose-100 text-rose-600 px-3 py-1 rounded-full font-bold hover:bg-rose-200 transition-colors flex items-center gap-1 shadow-sm">
                <span>➕</span> 新增心愿
            </button>
        </div>

        <div id="wishListContainer" class="w-full space-y-4">
            <!-- 心愿卡片将由 JS 动态生成 -->
        </div>

    </main>

    <!-- 添加心愿弹窗 -->
    <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md mx-auto shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 flex flex-col overflow-hidden" id="addModalContent">
            <div class="p-6 relative">
                <button onclick="closeAddModal()" class="absolute top-4 right-4 text-gray-300 hover:text-gray-500 bg-gray-50 rounded-full p-1.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 class="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2"><span>✨</span> 许下新的共同心愿</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 mb-1 block">心愿名称</label>
                        <input type="text" id="newWishName" class="w-full px-4 py-3 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 bg-gray-50" placeholder="例如：三亚五日游 / 买个大烤箱">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 mb-1 block">目标积分</label>
                        <input type="number" id="newWishTarget" class="w-full px-4 py-3 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 bg-gray-50" placeholder="设定一个合理的积分目标吧">
                    </div>
                    
                    <button onclick="confirmAddWish()" class="w-full mt-4 py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center">
                        创建心愿存钱罐
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 捐赠积分弹窗 -->
    <div id="donateModal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md mx-auto shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 flex flex-col overflow-hidden" id="donateModalContent">
            <div class="p-6 relative text-center">
                <button onclick="closeDonateModal()" class="absolute top-4 right-4 text-gray-300 hover:text-gray-500 bg-gray-50 rounded-full p-1.5 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                
                <div class="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">🪙</div>
                <h3 class="font-bold text-gray-800 text-lg mb-1">存入积分</h3>
                <p class="text-xs text-gray-500 mb-6" id="donateTargetName">目标加载中...</p>
                
                <div class="relative max-w-[200px] mx-auto mb-6">
                    <input type="number" id="donateAmount" class="w-full px-4 py-3 text-center text-2xl font-black text-rose-500 border-b-2 border-rose-200 focus:border-rose-500 focus:outline-none bg-transparent" placeholder="0">
                    <div class="absolute right-0 bottom-2">
                        <button onclick="setDonateMax()" class="text-xs bg-rose-50 text-rose-500 px-2 py-1 rounded font-bold">ALL</button>
                    </div>
                </div>
                
                <button onclick="confirmDonate()" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center">
                    确认存入金库
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <script>
        // --- 1. 配置与身份验证 ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity'); 

        if (!GITHUB_TOKEN || !myIdentity) {
            document.body.innerHTML = '<div class="flex h-screen items-center justify-center text-rose-500 font-bold text-center p-4">未检测到登录信息，请从原系统登录。<br><br>为了演示，本页面将强行赋予 "哼哼" 身份体验。</div>';
            setTimeout(() => {
                localStorage.setItem('loveGacha_githubToken', 'DEMO_TOKEN');
                localStorage.setItem('loveGacha_myIdentity', '哼哼');
                window.location.reload();
            }, 2000);
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('myIdentityName').innerText = myIdentity;
        document.getElementById('myAvatar').innerText = myIdentity === '哼哼' ? '🐰' : '🐱';
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_CK_H = 'data/hck.json'; 
        const FILE_CK_Q = 'data/qck.json'; 
        const FILE_FUND = 'data/cqg.json'; // 存钱罐公共文件
        
        const myCkPath = myIdentity === '哼哼' ? FILE_CK_H : FILE_CK_Q;

        let myCkData = { points: 20 };
        let myCkSha = null;
        
        // 核心存钱罐数据结构
        let fundData = { wishFunds: [] }; 
        let fundSha = null;

        let currentDonateGoalId = null;

        // --- 2. 核心网络请求 (带错误抛出) ---
        async function fetchFile(filePath) {
            if (GITHUB_TOKEN === 'DEMO_TOKEN') return { data: null, sha: 'mock_sha_' + Math.random() };
            try {
                const ts = new Date().getTime();
                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${ts}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (res.status === 404) return { data: null, sha: null }; 
                if (!res.ok) throw new Error('API Error');
                
                const result = await res.json();
                const content = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(content || '{}'), sha: result.sha };
            } catch (e) {
                console.warn("读取失败，使用本地测试数据", e);
                return { data: null, sha: 'mock_sha_' + Math.random() };
            }
        }

        async function updateFile(filePath, dataObj, sha) {
            if (GITHUB_TOKEN === 'DEMO_TOKEN') return { success: true, sha: 'mock_sha_' + Math.random() };
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))); 
                const body = { message: `Wish fund update ${new Date().getTime()}`, content: content };
                if (sha && !sha.startsWith('mock_sha')) body.sha = sha;

                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', 
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('Update failed');
                const result = await res.json();
                return { success: true, sha: result.content.sha };
            } catch (e) {
                console.error("保存云端失败:", e);
                // 修复：如实返回失败状态，以便上层逻辑回滚
                return { success: false, sha: null }; 
            }
        }

        // --- 3. 页面初始化加载 ---
        window.onload = async function() {
            showLoader("正在开启金库大门...");
            await fetchAllData();
            hideLoader();
            renderUI();
        };

        async function fetchAllData() {
            const [meCk, fundRes] = await Promise.all([
                fetchFile(myCkPath), fetchFile(FILE_FUND)
            ]);
            
            myCkData = Object.assign({ points: 20 }, meCk.data);
            myCkSha = meCk.sha;
            
            // 数据结构迁移与兼容
            let rawFund = fundRes.data || {};
            if (rawFund.wishFunds && Array.isArray(rawFund.wishFunds)) {
                // 已经是新版多目标结构
                fundData = rawFund;
            } else if (rawFund.targetPoints) {
                // 兼容旧版单一结构，自动转换为列表第一个元素
                fundData = {
                    wishFunds: [{
                        id: 1,
                        targetName: rawFund.targetName || "神秘大奖",
                        targetPoints: rawFund.targetPoints,
                        currentTotal: rawFund.currentTotal || 0,
                        contributions: rawFund.contributions || { "哼哼": 0, "亲亲": 0 },
                        status: "ongoing"
                    }]
                };
            } else {
                // 空数据初始化
                fundData = { wishFunds: [] };
            }
            fundSha = fundRes.sha;
        }

        // --- 4. 界面渲染 ---
        function renderUI() {
            document.getElementById('myPoints').innerText = myCkData.points;
            
            const container = document.getElementById('wishListContainer');
            if (fundData.wishFunds.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel p-8 rounded-2xl text-center text-gray-500 flex flex-col items-center">
                        <span class="text-4xl mb-3">🪹</span>
                        <p class="text-sm font-bold mb-1">还没有建立任何心愿</p>
                        <p class="text-xs">点击右上角"新增心愿"开始存钱吧~</p>
                    </div>`;
                return;
            }

            let html = '';
            fundData.wishFunds.forEach((goal) => {
                const percent = Math.min(100, Math.floor((goal.currentTotal / goal.targetPoints) * 100));
                
                // 计算各自贡献比例用于彩色进度条
                let myContrib = goal.contributions[myIdentity] || 0;
                let partnerContrib = goal.contributions[partnerIdentity] || 0;
                let myPercent = (goal.currentTotal > 0) ? (myContrib / goal.targetPoints) * 100 : 0;
                let partnerPercent = (goal.currentTotal > 0) ? (partnerContrib / goal.targetPoints) * 100 : 0;
                
                // 超出 100% 的视觉处理
                if (myPercent + partnerPercent > 100) {
                    const ratio = 100 / (myPercent + partnerPercent);
                    myPercent *= ratio;
                    partnerPercent *= ratio;
                }

                const isCompleted = percent >= 100;
                const statusBadge = isCompleted 
                    ? `<span class="bg-emerald-100 text-emerald-600 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2">已达成 🎉</span>` 
                    : `<span class="bg-rose-50 text-rose-500 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2 border border-rose-100">进行中</span>`;

                html += `
                <div class="glass-panel rounded-2xl overflow-hidden w-full transition-all duration-300">
                    <!-- 标题栏 (点击折叠/展开) -->
                    <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-white/50 transition-colors" onclick="toggleWish(${goal.id})">
                        <div class="flex-1 flex items-center">
                            <span class="text-2xl mr-3">${isCompleted ? '🎊' : '🐖'}</span>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm flex items-center">
                                    ${goal.targetName} ${statusBadge}
                                </h3>
                                <p class="text-[10px] text-gray-400 mt-0.5">进度: ${percent}% (${goal.currentTotal} / ${goal.targetPoints} 积分)</p>
                            </div>
                        </div>
                        <div class="text-gray-400 p-2">
                            <svg class="w-5 h-5 chevron transition-transform duration-300" id="chevron-${goal.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    
                    <!-- 详情内容 (默认折叠) -->
                    <div class="accordion-content px-4 pb-4" id="content-${goal.id}">
                        <div class="border-t border-rose-100/50 pt-4 mt-1">
                            
                            <!-- 进度条 -->
                            <div class="relative w-full h-4 bg-gray-100 rounded-full overflow-hidden mb-3 shadow-inner">
                                <div class="absolute left-0 top-0 h-full bg-rose-400 progress-bar-stripes transition-all duration-700 ease-out" style="width: ${myPercent}%"></div>
                                <div class="absolute top-0 h-full bg-blue-300 progress-bar-stripes transition-all duration-700 ease-out" style="left: ${myPercent}%; width: ${partnerPercent}%"></div>
                            </div>

                            <!-- 贡献详情 -->
                            <div class="flex justify-between text-xs mb-5">
                                <div class="flex items-center gap-1.5 text-rose-600 font-medium">
                                    <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
                                    ${myIdentity}: ${myContrib}
                                </div>
                                <div class="flex items-center gap-1.5 text-blue-500 font-medium">
                                    ${partnerIdentity}: ${partnerContrib}
                                    <div class="w-2.5 h-2.5 rounded-full bg-blue-300"></div>
                                </div>
                            </div>
                            
                            <!-- 交互按钮 -->
                            ${!isCompleted ? `
                                <button onclick="openDonateModal(${goal.id})" class="w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-sm flex justify-center items-center gap-2">
                                    <span>💰 存入积分</span>
                                </button>
                            ` : `
                                <div class="w-full py-3 bg-emerald-50 border border-emerald-200 text-emerald-600 font-bold rounded-xl text-center text-sm flex justify-center items-center gap-2">
                                    <span>🌟 你们已经达成这个心愿啦！</span>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- 5. 交互逻辑 (手风琴) ---
        function toggleWish(id) {
            const content = document.getElementById(`content-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            
            // 关闭其他已打开的 (可选：如果你只想每次展开一个)
            /*
            document.querySelectorAll('.accordion-content').forEach(el => {
                if (el.id !== `content-${id}`) el.classList.remove('expanded');
            });
            document.querySelectorAll('.chevron').forEach(el => {
                if (el.id !== `chevron-${id}`) el.classList.remove('expanded');
            });
            */
            
            content.classList.toggle('expanded');
            chevron.classList.toggle('expanded');
        }

        // --- 6. 交互逻辑 (新增心愿) ---
        function openAddModal() {
            document.getElementById('newWishName').value = '';
            document.getElementById('newWishTarget').value = '';
            
            const modal = document.getElementById('addModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('addModalContent').classList.remove('translate-y-full', 'sm:scale-95');
            }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('addModal');
            modal.classList.add('opacity-0');
            document.getElementById('addModalContent').classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function confirmAddWish() {
            const name = document.getElementById('newWishName').value.trim();
            const target = parseInt(document.getElementById('newWishTarget').value);

            if (!name) return showToast("心愿名称不能为空哦~");
            if (isNaN(target) || target <= 0) return showToast("请输入合理的目标积分数目");

            closeAddModal();
            showLoader("正在创建新心愿...");

            const newGoal = {
                id: Date.now(),
                targetName: name,
                targetPoints: target,
                currentTotal: 0,
                contributions: { "哼哼": 0, "亲亲": 0 },
                status: "ongoing"
            };

            // 创建副本以防失败
            const backupFunds = [...fundData.wishFunds];
            fundData.wishFunds.unshift(newGoal); // 放在最前面

            const res = await updateFile(FILE_FUND, fundData, fundSha);
            hideLoader();

            if (res.success) {
                fundSha = res.sha;
                showToast("✨ 新心愿创建成功！");
                renderUI();
                setTimeout(() => toggleWish(newGoal.id), 100); // 自动展开新建的
            } else {
                fundData.wishFunds = backupFunds; // 回滚
                showToast("网络出错，创建失败，请稍后再试");
            }
        }

        // --- 7. 交互逻辑 (存入积分 - 核心修复区) ---
        function openDonateModal(goalId) {
            currentDonateGoalId = goalId;
            const goal = fundData.wishFunds.find(g => g.id === goalId);
            if (!goal) return;

            document.getElementById('donateTargetName').innerText = `目标: ${goal.targetName}`;
            document.getElementById('donateAmount').value = '';
            
            const modal = document.getElementById('donateModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('donateModalContent').classList.remove('translate-y-full', 'sm:scale-95');
            }, 10);
        }

        function closeDonateModal() {
            const modal = document.getElementById('donateModal');
            modal.classList.add('opacity-0');
            document.getElementById('donateModalContent').classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function setDonateMax() {
            // 最多存入当前拥有的积分，或者目标还差的积分，取最小值
            const goal = fundData.wishFunds.find(g => g.id === currentDonateGoalId);
            if (!goal) return;
            const remaining = goal.targetPoints - goal.currentTotal;
            const max = Math.min(myCkData.points, remaining > 0 ? remaining : myCkData.points);
            document.getElementById('donateAmount').value = max;
        }

        async function confirmDonate() {
            const amount = parseInt(document.getElementById('donateAmount').value);
            
            if (isNaN(amount) || amount <= 0) return showToast("请输入正确的积分数量");
            if (amount > myCkData.points) return showToast("余额不足，赚够了再来哦~");
            if (!currentDonateGoalId) return showToast("找不到目标心愿");

            const goalIndex = fundData.wishFunds.findIndex(g => g.id === currentDonateGoalId);
            if (goalIndex === -1) return showToast("目标不存在");
            
            const goal = fundData.wishFunds[goalIndex];
            closeDonateModal();
            showLoader("正在将积分安全押送至金库...");

            // --- 修复核心：先在本地预操作 ---
            myCkData.points -= amount;
            goal.contributions[myIdentity] += amount;
            goal.currentTotal += amount;

            // --- 步骤 1：串行上传 公共存钱罐数据 ---
            const fundRes = await updateFile(FILE_FUND, fundData, fundSha);
            
            if (!fundRes.success) {
                // 如果存钱罐上传失败，立刻回滚本地数据！积分原封不动退回！
                myCkData.points += amount;
                goal.contributions[myIdentity] -= amount;
                goal.currentTotal -= amount;
                hideLoader();
                return showToast("哎呀，网络波动，金库门没打开，请重试！积分已退回。");
            }
            // 存钱罐成功，记录新的 sha
            fundSha = fundRes.sha;

            // --- 步骤 2：存钱罐上传成功后，再更新个人积分状态 ---
            const meRes = await updateFile(myCkPath, myCkData, myCkSha);
            hideLoader();

            if (meRes.success) {
                // 两边都成功
                myCkSha = meRes.sha;
                showToast(`🎉 成功存入 ${amount} 积分！`);
                renderUI();
                
                // 庆祝动画：如果刚好达标
                if (goal.currentTotal >= goal.targetPoints && (goal.currentTotal - amount) < goal.targetPoints) {
                    setTimeout(() => { showToast(`🎊 太棒了！你们共同完成了心愿：${goal.targetName}！`); }, 800);
                }
            } else {
                // 极小概率异常：存钱罐更新了，但个人积分文件没更新成功
                // 此时刷新页面，重新拉取最新数据即可校准
                showToast("同步出现小延迟，正在自动校准数据...");
                setTimeout(() => window.location.reload(), 2000);
            }
        }

        // --- 8. 工具函数 ---
        function showLoader(text) {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

    </script>
</body>
</html>
