<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>全息雷霆战机</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #22d3ee;
            --neon-blue: #3b82f6;
            --neon-rose: #f43f5e;
            --neon-amber: #fbbf24;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(34, 211, 238, 0.25);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #050b14; 
            overscroll-behavior: none;
            touch-action: none;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(34, 211, 238, 0.04) 50%, rgba(34, 211, 238, 0.04));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bar-transition { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease; }

        @keyframes float-score {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); filter: brightness(1.5); }
        }
        .floating-score {
            position: absolute;
            color: var(--neon-cyan);
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 12px rgba(34,211,238,0.6);
            pointer-events: none;
            z-index: 100;
            animation: float-score 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes screen-flash {
            0% { background: transparent; }
            10% { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
            30% { background: rgba(225, 29, 72, 0.6); }
            100% { background: transparent; }
        }
        .flash-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
            animation: screen-flash 0.8s ease-out forwards;
        }
        
        #gameCanvas {
            position: absolute; top: 0; left: 0;
            z-index: 10;
        }

        .skill-btn {
            position: relative;
            flex: 1;
            aspect-ratio: 1;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, filter 0.3s, background-color 0.2s;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .skill-btn:active { transform: scale(0.92); }
        .skill-btn:hover { background: rgba(30, 41, 59, 0.9); }
        .skill-btn.used { filter: grayscale(100%); pointer-events: none; border-color: transparent; box-shadow: none !important; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .no-arrows::-webkit-outer-spin-button,
        .no-arrows::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .no-arrows { -moz-appearance: textfield; }

        .loader-ring {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(34, 211, 238, 0.1);
            border-radius: 50%;
            border-top-color: var(--neon-cyan);
            animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .modal-enter { opacity: 0; pointer-events: none; }
        .modal-enter-active { opacity: 1; pointer-events: auto; transition: opacity 0.4s ease; }
        .modal-scale-enter { transform: scale(0.92); opacity: 0; }
        .modal-scale-active { transform: scale(1); opacity: 1; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s; }
        
        .text-gradient-cyan { background: linear-gradient(135deg, #67e8f9, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-rose { background: linear-gradient(135deg, #fca5a5, #e11d48); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-amber { background: linear-gradient(135deg, #fde047, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col pb-[env(safe-area-inset-bottom)]">
    
    <div id="globalLoader" class="fixed inset-0 z-[9999] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center transition-opacity duration-400">
        <div class="loader-ring mb-6 shadow-[0_0_20px_rgba(34,211,238,0.6)]"></div>
        <div class="text-cyan-400 font-mono text-sm tracking-widest uppercase animate-pulse drop-shadow-[0_0_8px_cyan]" id="loaderText">系统初始化中...</div>
    </div>

    <header class="flex-none w-full flex justify-between items-center z-20 px-4 py-3 h-14 bg-slate-900/70 backdrop-blur-lg border-b border-cyan-900/40 shadow-[0_4px_25px_rgba(0,0,0,0.6)]">
        <a href="index.html" class="w-8 h-8 flex items-center justify-center bg-slate-800/90 text-cyan-400 rounded-full shadow-lg border border-cyan-700/50 hover:bg-slate-700 hover:border-cyan-400 hover:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="font-black text-base md:text-lg tracking-[0.2em] text-gradient-cyan flex items-center gap-2 drop-shadow-lg">
            <span>⚡</span> 全息雷霆 <span>⚡</span>
        </h1>
        <div class="flex items-center gap-2">
            <button id="autoBtn" class="w-8 h-8 flex items-center justify-center bg-slate-800/90 text-slate-500 font-mono font-black text-[10px] rounded-full shadow-lg border border-slate-700/50 hover:bg-slate-700 hover:text-cyan-400 hover:border-cyan-400 hover:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all active:scale-95 cursor-pointer z-50" title="自动战斗">
                AUTO
            </button>
            <button id="rushBtn" class="w-8 h-8 flex items-center justify-center bg-slate-800/90 text-rose-400 font-mono font-black text-xs rounded-full shadow-lg border border-rose-700/50 hover:bg-slate-700 hover:border-rose-400 hover:shadow-[0_0_10px_rgba(244,63,94,0.3)] transition-all active:scale-95 cursor-pointer z-50" title="快速战斗 (10s内放出本关所有敌人)">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            </button>
            <button id="pauseBtn" class="w-8 h-8 flex items-center justify-center bg-slate-800/90 text-cyan-400 rounded-full shadow-lg border border-cyan-700/50 hover:bg-slate-700 hover:border-cyan-400 hover:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all active:scale-95 cursor-pointer z-50">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button id="speedBtn" class="w-8 h-8 flex items-center justify-center bg-slate-800/90 text-cyan-400 font-mono font-black text-xs rounded-full shadow-lg border border-cyan-700/50 hover:bg-slate-700 hover:border-cyan-400 hover:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all active:scale-95 cursor-pointer z-50">
                x1
            </button>
        </div>
    </header>

    <div class="scanline"></div>

    <main id="mainContainer" class="flex-1 min-h-0 w-full relative flex flex-col mx-auto max-w-md">
        <canvas id="gameCanvas"></canvas>

        <div id="uiLayer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-2 pb-5">
            
            <div id="waveDisplayContainer" class="absolute top-2 right-2 flex flex-col items-end opacity-0 transition-opacity duration-500 pointer-events-none z-10 mt-1 mr-1">
                <div class="glass-panel px-3 py-1.5 rounded-xl border border-cyan-500/50 shadow-[0_0_15px_rgba(34,211,238,0.2)] flex items-center gap-1.5 transform skew-x-12">
                    <span class="text-[9px] md:text-[10px] text-cyan-300 font-bold transform -skew-x-12 tracking-widest">WAVE</span>
                    <span class="text-xs md:text-sm font-mono font-black text-white drop-shadow-md transform -skew-x-12" id="waveDisplay">1 / 10</span>
                </div>
            </div>

            <div id="bossHpContainer" class="w-full px-4 mt-3 transition-all duration-700 transform -translate-y-12 opacity-0">
                <div class="glass-panel p-2 rounded-2xl border-t-2 border-t-rose-500 shadow-[0_0_25px_rgba(225,29,72,0.45)]">
                    <div class="flex justify-between items-end mb-1.5 px-2">
                        <span class="text-[11px] font-black text-rose-500 tracking-widest drop-shadow-[0_0_6px_rgba(225,29,72,0.9)] uppercase" id="bossNameDisplay">Ω-级 异常实体</span>
                        <span class="text-[10px] font-mono text-rose-300 font-bold" id="bossHpText">100%</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-3 border border-slate-700 overflow-hidden relative shadow-inner">
                        <div id="bossHpBar" class="h-full bg-gradient-to-r from-rose-800 via-rose-500 to-rose-400 bar-transition shadow-[0_0_18px_#f43f5e]" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div id="hud" class="w-full flex justify-between items-start gap-4 transition-opacity duration-400 opacity-0 pointer-events-none mt-2 px-1">
                <div class="glass-panel p-2.5 rounded-xl flex-1 max-w-[240px] transform -skew-x-12 border-l-4 border-l-cyan-400 shadow-xl">
                    <div class="flex justify-between items-end mb-1.5 transform skew-x-12 px-1">
                        <span class="text-[10px] md:text-xs text-cyan-300 font-bold tracking-wider truncate max-w-[55%]" id="playerNameDisplay">驾驶员</span>
                        <span class="text-xs font-mono font-black text-white drop-shadow-[0_0_4px_rgba(255,255,255,0.8)]" id="scoreDisplay">000000</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-4 border border-slate-700 overflow-hidden transform skew-x-12 relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]">
                        <div id="hpBar" class="h-full bg-gradient-to-r from-cyan-700 via-cyan-400 to-cyan-200 bar-transition shadow-[0_0_12px_#22d3ee]" style="width: 100%;"></div>
                        <div id="hpText" class="absolute inset-0 flex items-center justify-center text-[10px] font-mono text-white font-black z-10 drop-shadow-md mix-blend-difference">100 / 100</div>
                    </div>
                </div>

                <div id="waveWarning" class="glass-panel px-4 py-1.5 rounded-xl border border-rose-500/60 text-rose-400 font-black tracking-widest text-sm md:text-base opacity-0 transition-opacity duration-500 transform skew-x-12 shadow-[0_0_20px_rgba(225,29,72,0.35)] mt-1">
                    高能警告
                </div>
            </div>

            <div id="bottomControls" class="w-full flex justify-between items-end gap-3 px-2 transition-opacity duration-400 opacity-0 pointer-events-none mb-1">
                <button id="btn_summon" class="skill-btn group border-blue-800/40 shadow-[0_0_15px_rgba(59,130,246,0.2)] pointer-events-auto" onclick="useSkill('summon')">
                    <div class="absolute inset-0 bg-gradient-to-t from-blue-900/50 to-transparent pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <span class="text-2xl md:text-3xl drop-shadow-lg z-10 mb-1.5 transform group-active:scale-90 transition-transform">🛸</span>
                    <span class="text-[9px] font-bold text-blue-300 z-10 tracking-widest">僚机支援</span>
                    <div id="cd_summon" class="absolute inset-0 bg-slate-950/80 flex items-center justify-center font-mono font-black text-cyan-400 text-xl z-20 backdrop-blur-[2px] hidden"></div>
                </button>
                <button id="btn_invinc" class="skill-btn group border-amber-800/40 shadow-[0_0_15px_rgba(245,158,11,0.2)] pointer-events-auto" onclick="useSkill('invinc')">
                    <div class="absolute inset-0 bg-gradient-to-t from-amber-900/50 to-transparent pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <span class="text-2xl md:text-3xl drop-shadow-lg z-10 mb-1.5 transform group-active:scale-90 transition-transform">✨</span>
                    <span class="text-[9px] font-bold text-amber-300 z-10 tracking-widest">能量护体</span>
                    <div id="cd_invinc" class="absolute inset-0 bg-slate-950/80 flex items-center justify-center font-mono font-black text-cyan-400 text-xl z-20 backdrop-blur-[2px] hidden"></div>
                </button>
                <button id="btn_shield" class="skill-btn group border-green-800/40 shadow-[0_0_15px_rgba(16,185,129,0.2)] pointer-events-auto" onclick="useSkill('shield')">
                    <div class="absolute inset-0 bg-gradient-to-t from-green-900/50 to-transparent pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <span class="text-2xl md:text-3xl drop-shadow-lg z-10 mb-1.5 transform group-active:scale-90 transition-transform">🛡️</span>
                    <span class="text-[9px] font-bold text-green-300 z-10 tracking-widest">治愈护盾</span>
                    <div id="cd_shield" class="absolute inset-0 bg-slate-950/80 flex items-center justify-center font-mono font-black text-cyan-400 text-xl z-20 backdrop-blur-[2px] hidden"></div>
                </button>
                <button id="btn_burst" class="skill-btn group border-rose-800/40 shadow-[0_0_20px_rgba(225,29,72,0.25)] pointer-events-auto" onclick="useSkill('burst')">
                    <div class="absolute inset-0 bg-gradient-to-t from-rose-900/60 to-transparent pointer-events-none opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <span class="text-2xl md:text-3xl drop-shadow-[0_0_10px_rgba(244,63,94,0.9)] z-10 mb-1.5 transform group-active:scale-90 transition-transform">🔥</span>
                    <span class="text-[10px] font-black text-rose-400 tracking-widest z-10 text-shadow-sm">火力全开</span>
                    <div id="cd_burst" class="absolute inset-0 bg-slate-950/80 flex items-center justify-center font-mono font-black text-cyan-400 text-xl z-20 backdrop-blur-[2px] hidden"></div>
                </button>
            </div>
        </div>

        <div id="startMenu" class="absolute inset-0 z-30 flex flex-col items-center justify-center px-5 bg-slate-950/85 backdrop-blur-md modal-enter modal-enter-active">
            <div class="glass-panel p-8 rounded-3xl w-full max-w-[340px] flex flex-col items-center gap-6 border border-cyan-800/50 shadow-[0_0_50px_rgba(34,211,238,0.2)] modal-scale-enter modal-scale-active relative overflow-hidden" id="startMenuContent">
                
                <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                <div class="absolute bottom-0 left-0 w-40 h-40 bg-blue-500/10 rounded-full blur-2xl -ml-16 -mb-16 pointer-events-none"></div>

                <div class="text-center z-10 w-full">
                    <h1 class="text-gradient-cyan font-black text-4xl tracking-[0.15em] drop-shadow-[0_0_20px_rgba(34,211,238,0.6)] mb-2">
                        全息雷霆
                    </h1>
                    <div class="inline-flex items-center gap-2 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-700/50 shadow-inner">
                        <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                        <p id="playerLevelDisplay" class="text-slate-300 font-mono text-[10px] tracking-widest uppercase">数据同步完毕</p>
                    </div>
                </div>
                
                <div class="w-full bg-slate-900/90 rounded-2xl p-4 border border-slate-700/80 flex flex-col items-center shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)] z-10">
                     <span class="text-slate-500 text-[10px] font-black tracking-[0.2em] mb-2 flex items-center gap-2 whitespace-nowrap">
                         <span class="w-4 h-[1px] bg-slate-600"></span> 当前作战区域 <span class="w-4 h-[1px] bg-slate-600"></span>
                     </span>
                     <p id="gameLevelDisplay" class="text-gradient-rose font-black text-lg md:text-xl tracking-[0.1em] drop-shadow-[0_0_10px_rgba(225,29,72,0.4)] whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">-- / --</p>
                </div>

                <!-- 战斗模式选择卡 -->
                <div class="w-full flex bg-slate-900/80 rounded-xl p-1 border border-slate-700/50 shadow-inner z-10 gap-1 -mt-2 mb-1">
                    <button id="tabNormal" onclick="setBattleMode('normal')" class="flex-1 py-2 rounded-lg text-xs font-black tracking-widest transition-all bg-cyan-600/30 text-cyan-300 border border-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.2)]">
                        普通战
                    </button>
                    <button id="tabBoss" onclick="setBattleMode('boss')" class="flex-1 py-2 rounded-lg text-xs font-black tracking-widest transition-all text-slate-500 hover:text-slate-300 border border-transparent">
                        BOSS战
                    </button>
                </div>

                <div class="w-full flex gap-3 z-10 mt-1">
                    <button onclick="openUpgradeModal()" class="w-full py-3.5 bg-slate-800/80 hover:bg-slate-700 text-cyan-300 text-sm font-bold tracking-[0.15em] rounded-xl border border-cyan-800/60 transition-all active:scale-95 shadow-[0_0_15px_rgba(34,211,238,0.15)] flex justify-center items-center gap-2">
                        <span class="text-lg">🛠️</span>
                        <span>系统强化</span>
                    </button>
                </div>

                <div class="w-full flex gap-3 z-10">
                    <button id="btnStart" class="flex-1 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black tracking-widest rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.5)] transition-all active:scale-95 border border-cyan-400/50 text-base md:text-lg flex items-center justify-center gap-1 z-10">
                        <span>启动引擎</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </button>
                    <button id="btnSweep" class="flex-1 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black tracking-widest rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.5)] transition-all active:scale-95 border border-purple-400/50 text-base md:text-lg flex items-center justify-center gap-1 z-10">
                        <span>一键扫荡</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="upgradeModal" class="absolute inset-0 z-50 flex-col items-center justify-center px-4 bg-slate-950/90 backdrop-blur-xl transition-opacity duration-400 opacity-0 pointer-events-none">
            <div class="glass-panel p-4 rounded-2xl w-[94%] max-w-[360px] flex flex-col gap-3 border border-cyan-500/40 shadow-[0_0_60px_rgba(34,211,238,0.25)] max-h-[85vh] min-h-0 transform scale-95 transition-transform duration-400 relative overflow-hidden" id="upgradeModalContent">
                
                <div class="absolute top-0 right-0 w-40 h-40 bg-cyan-500/5 rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex-none flex justify-between items-center border-b border-slate-700/60 pb-3 z-10">
                    <h2 class="text-xl font-black text-cyan-400 tracking-widest drop-shadow-[0_0_10px_rgba(34,211,238,0.6)] flex items-center gap-2 whitespace-nowrap">
                        <span class="text-lg">🛠️</span> 系统强化
                    </h2>
                    <div class="flex items-center gap-2 shrink-0">
                        <button id="btnResetUpgrade" onclick="resetUpgrades()" class="bg-rose-900/80 hover:bg-rose-800 text-rose-300 px-2 py-1.5 rounded-lg border border-rose-700/50 shadow-[0_0_10px_rgba(225,29,72,0.2)] transition-all active:scale-95 text-[10px] font-black tracking-widest">
                            重置强化
                        </button>
                        <div class="bg-slate-900/90 px-3 py-1.5 rounded-xl border border-amber-700/50 shadow-inner flex items-center gap-1.5 shrink-0">
                            <span class="text-[9px] text-slate-400 font-bold tracking-wider">得分</span>
                            <span class="text-gradient-amber font-mono text-sm font-black drop-shadow-[0_0_5px_rgba(251,191,36,0.5)]" id="currentPointsDisplay">0</span>
                        </div>
                    </div>
                </div>
                
                <div id="upgradeContent" class="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col gap-2.5 pr-1 z-10">
                </div>
                
                <button onclick="closeUpgradeModal()" class="flex-none w-full mt-1 py-3 bg-slate-800/90 hover:bg-slate-700 text-slate-300 text-sm font-black tracking-widest rounded-xl transition-all active:scale-95 border border-slate-600 shadow-lg z-10">
                    返回指挥中心
                </button>
            </div>
        </div>

        <div id="gameOverMenu" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-5 bg-slate-950/90 backdrop-blur-xl transition-all duration-500 opacity-0 pointer-events-none">
            <div class="glass-panel p-8 rounded-[2rem] w-full max-w-[360px] flex flex-col items-center gap-6 border border-cyan-800/50 shadow-[0_0_60px_rgba(34,211,238,0.15)] transform scale-95 transition-all duration-500 relative overflow-hidden" id="resultContent">

        let gameState = 'start'; 
        let score = 0;

        // --- 新增：战斗模式切换 ---
        let currentBattleMode = 'normal';

        let player;

        let audioCtx = null;

        // Auto battle toggle event listener
        const autoBtn = document.getElementById('autoBtn');
        autoBtn.addEventListener('click', () => {

        // Rush button: release all remaining waves of the entire level within 10 seconds
        const rushBtn = document.getElementById('rushBtn');
        rushBtn.addEventListener('click', () => {
            if (gameState !== 'playing' || isRushing || bossSpawned) return;
            isRushing = true;
            rushBtn.classList.replace('text-rose-400', 'text-slate-500');
            rushBtn.classList.replace('border-rose-700/50', 'border-slate-700/50');
            rushBtn.classList.remove('hover:border-rose-400', 'hover:shadow-[0_0_10px_rgba(244,63,94,0.3)]');
            showFloatingText(width/2, height/2, "快速战斗已启动：10s内放出本关所有敌人！", "text-rose-500 font-black text-xl drop-shadow-[0_0_15px_rgba(225,29,72,0.9)] text-center");
            
            if (stageConfig && stageConfig.waves) {
                let rushDuration = 10000; // 10 seconds window
                // Reset current wave progress so remaining waves span the full 10 seconds
                enemiesSpawnedInCurrentWave = 0;
                let remainingWavesCount = stageConfig.waves.length - currentWaveIndex;
                if (remainingWavesCount > 0) {
                    let timePerWave = rushDuration / remainingWavesCount;
                    for (let i = currentWaveIndex; i < stageConfig.waves.length; i++) {
                        stageConfig.waves[i].time = gameTime + (i - currentWaveIndex) * timePerWave;
                        stageConfig.waves[i].spawnInterval = Math.max(30, timePerWave / stageConfig.waves[i].count);
                    }
                } else {
                    bossSpawned = true;
                }
            }
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playShootSound(isPlayer) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            
            if (isPlayer) {
                if (now - lastShootTimePlayer < 0.05) return; 
                lastShootTimePlayer = now;
            } else {
                if (now - lastShootTimeEnemy < 0.05) return;
                lastShootTimeEnemy = now;
            }
            
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (isPlayer) {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                    gainNode.gain.setValueAtTime(0.015, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gainNode.gain.setValueAtTime(0.01, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch(e) {}
        }

        function playHitSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            if (now - lastHitTime < 0.02) return; 
            lastHitTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gainNode.gain.setValueAtTime(0.03, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                
                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        const OWNER_REPO = '878481881-jpg/loveplan';
        let GITHUB_TOKEN = null;
        try {
            GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        } catch (e) {
            console.warn("localStorage access denied", e);
        }
        
        let myIdentity = '哼哼'; 
        try {
            const storedIdentity = localStorage.getItem('loveGacha_myIdentity');
            if (storedIdentity) myIdentity = storedIdentity;
        } catch(e) {}

        let globalPetData = null;
        let globalPetSha = null;
        let playerLevel = 1;
        let playerName = '神性机体';
        let equipped = [];

        let upgradeFile = 'data/ltzj/hsj.json';
        if (myIdentity === '亲亲' || myIdentity.includes('qs')) {
            upgradeFile = 'data/ltzj/qsj.json';
        }

        let currentStage = 1;
        let totalStages = 10; 
        let stageConfig = null;
        
        let upgradeData = { attr: { hp: 0, atk: 0, def: 0 }, skill: { summon: 0, invinc: 0, shield: 0, burst: 0 }, currentLevel: 1, score: 0 };
        let upgradeSha = null;

        const speedBtn = document.getElementById('speedBtn');
        if (speedBtn) {
            speedBtn.addEventListener('click', () => {
                gameSpeedMultiplier++;
                if (gameSpeedMultiplier > 5) gameSpeedMultiplier = 1;
                
                speedBtn.innerText = `x${gameSpeedMultiplier}`;
                
                if (gameSpeedMultiplier === 1) {
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-cyan-400 font-mono font-black text-xs rounded-full shadow-lg border border-cyan-700/50 hover:bg-slate-700 hover:border-cyan-400 hover:shadow-[0_0_10px_rgba(34,211,238,0.3)] transition-all active:scale-95 cursor-pointer z-50";
                } else if (gameSpeedMultiplier === 2) {
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-amber-400 font-mono font-black text-xs rounded-full shadow-[0_0_10px_rgba(251,191,36,0.3)] border border-amber-400 hover:bg-slate-700 transition-all active:scale-95 cursor-pointer z-50";
                } else {
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-rose-400 font-mono font-black text-xs rounded-full shadow-[0_0_15px_rgba(244,63,94,0.5)] border border-rose-400 hover:bg-slate-700 transition-all active:scale-95 cursor-pointer z-50";
                }
            });
        }

        function showLoader(text) {
            loaderText.innerText = text;
            globalLoader.style.display = 'flex';
            void globalLoader.offsetWidth;
            globalLoader.style.opacity = '1';
        }
        function hideLoader() {
            globalLoader.style.opacity = '0';
            setTimeout(() => { globalLoader.style.display = 'none'; }, 400);
        }

        async function fetchGithubFile(path) {
            if (!GITHUB_TOKEN) return null;
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${path}?t=${new Date().getTime()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (response.ok) {
                    const result = await response.json();
                    const parsed = JSON.parse(decodeURIComponent(escape(atob(result.content.replace(/\s/g, '')))));
                    return { data: parsed, sha: result.sha };
                }
            } catch(e) { console.warn(`获取文件失败: ${path}`); }
            return null;
        }

        async function updateGithubFile(path, newData, sha) {
            if (!GITHUB_TOKEN) return false;
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update ${path}`, content: encodedContent };
                if (sha) body.sha = sha;
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${path}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (response.ok) {
                    const result = await response.json();
                    return result.content.sha;
                }
            } catch (error) { console.error(`更新文件失败: ${path}`, error); }
            return false;
        }

        function getMaxExp(level) { return level >= 200 ? 999999 : Math.floor(100 + (level - 1) * 8); }
        function addExpAndLevelUp(amount) {
            if (!globalPetData) return;
            globalPetData.exp = (globalPetData.exp || 0) + amount;
            let currentMaxExp = getMaxExp(globalPetData.level);
            while (globalPetData.exp >= currentMaxExp && globalPetData.level < 200) {
                globalPetData.exp -= currentMaxExp; globalPetData.level += 1; currentMaxExp = getMaxExp(globalPetData.level);
            }
            if (globalPetData.level >= 200) { globalPetData.level = 200; globalPetData.exp = currentMaxExp; }
            playerLevel = globalPetData.level; 
        }

        async function loadGameData() {
            showLoader("同步核心数据...");
            try {
                btnStart.disabled = true;
                
                const petRes = await fetchGithubFile('data/cw.json');
                if (petRes && petRes.data) {
                    globalPetData = petRes.data; globalPetSha = petRes.sha;
                    if(globalPetData.level) playerLevel = globalPetData.level;
                    if(globalPetData.name) playerName = globalPetData.name;
                    if(globalPetData.equipped) equipped = globalPetData.equipped;
                }
                playerLevelDisplay.innerText = `Lv.${playerLevel} [${playerName}] 已连接`;
                playerNameDisplay.innerText = playerName;

                const gqRes = await fetchGithubFile('data/ltzj/gq.json');
                if (gqRes && gqRes.data) {
                    totalStages = gqRes.data.totalLevels || 10;
                }
                
                const upgRes = await fetchGithubFile(upgradeFile);
                if (upgRes && upgRes.data) {
                    upgradeData = upgRes.data;
                    if (!upgradeData.attr) upgradeData.attr = { hp: 0, atk: 0, def: 0 };
                    if (!upgradeData.skill) upgradeData.skill = { summon: 0, invinc: 0, shield: 0, burst: 0 };
                    if (!upgradeData.score) upgradeData.score = 0;
                    
                    if (upgradeData.currentLevel) {
                        currentStage = upgradeData.currentLevel;
                    } else {
                        upgradeData.currentLevel = 1;
                        currentStage = 1;
                    }
                    upgradeSha = upgRes.sha;
                } else {
                    upgradeData = { attr: { hp: 0, atk: 0, def: 0 }, skill: { summon: 0, invinc: 0, shield: 0, burst: 0 }, currentLevel: 1, score: 0 };
                    currentStage = 1;
                }

                document.getElementById('gameLevelDisplay').innerText = `关 ${currentStage} / 共 ${totalStages} 关`;
                btnStart.disabled = false;
            } catch (e) {
                console.error("加载数据失败", e);
                btnStart.disabled = false;
            } finally {
                hideLoader();
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => { loadGameData(); });

        let upgradeInputStates = {};

        function getUpgradeDescHtml(category, key, curr, next) {
            if (category === 'attr') {
                if (key === 'hp') return `<span class="text-slate-400">耐久上限:</span> <span class="text-cyan-300 ml-1">+${curr * 5}%</span> <span class="text-slate-600 mx-1">➔</span> <span class="text-amber-400">+${next * 5}%</span>`;
                else if (key === 'atk') return `<span class="text-slate-400">武器出力:</span> <span class="text-cyan-300 ml-1">+${curr * 5}%</span> <span class="text-slate-600 mx-1">➔</span> <span class="text-amber-400">+${next * 5}%</span>`;
                else if (key === 'def') return `<span class="text-slate-400">防御加成:</span> <span class="text-cyan-300 ml-1">${Math.min(60, curr * 5)}%</span> <span class="text-slate-600 mx-1">➔</span> <span class="text-amber-400">${Math.min(60, next * 5)}%</span>`;

        ];

        function lerp(start, end, t) { return start + (end - start) * t; }
        function lerpArray(arr1, arr2, t) { return arr1.map((val, i) => lerp(val, arr2[i], t)); }

        function getInterpolatedPet(level) {
            let t = 0; let p1, p2;
            if (level < 20) { p1 = basePoses[0]; p2 = basePoses[1]; t = (level - 1) / 19; } 
            else if (level < 60) { p1 = basePoses[1]; p2 = basePoses[2]; t = (level - 20) / 40; } 
            else if (level < 100) { p1 = basePoses[2]; p2 = basePoses[3]; t = (level - 60) / 40; }
            else if (level < 150) { p1 = basePoses[3]; p2 = basePoses[4]; t = (level - 100) / 50; }
            else if (level <= 200) { p1 = basePoses[4]; p2 = basePoses[5]; t = (level - 150) / 50; }
            else { p1 = basePoses[5]; p2 = basePoses[5]; t = 1; }
            t = t * t * (3 - 2 * t);
            return {
                head: lerpArray(p1.head, p2.head, t), earL: lerpArray(p1.earL, p2.earL, t), earR: lerpArray(p1.earR, p2.earR, t), 
                visor: lerpArray(p1.visor, p2.visor, t), core: lerpArray(p1.core, p2.core, t), 
                wingScale: lerp(p1.wingScale, p2.wingScale, t), armorOpacity: lerp(p1.armorOpacity, p2.armorOpacity, t)
            };
        }

            ctx.closePath();

        class Bullet {
            constructor(x, y, vy, color, vx = 0, owner = 'player', damage = 10, isHoming = false) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color;
                this.width = owner === 'player' ? 3 : 6; this.height = owner === 'player' ? 16 : 6;
                this.active = true; this.damage = damage; this.owner = owner;
                this.isHoming = isHoming;
                this.target = null;
                this.lifeTime = 0; // 新增：记录子弹存活时间
            }
            update(dt) {
                const timeScale = dt / 16; 
                this.lifeTime += dt; // 累加存活时间
                
                if (this.isHoming && this.owner === 'player') {
                    if (!this.target || !this.target.active) {
                        let nearest = null; let minDist = Infinity;
                        for (let i = 0; i < enemies.length; i++) {
                            let e = enemies[i];
                            if (e.active && e.y > -20 && e.y < height) {
                                let distSq = (e.x - this.x)**2 + (e.y - this.y)**2;
                                if (distSq < minDist) { minDist = distSq; nearest = e; }
                            }
                        }
                        this.target = nearest;
                    }
                    if (this.target && this.target.active) {
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        const dx = this.target.x - this.x; const dy = this.target.y - this.y;
                        const targetAngle = Math.atan2(dy, dx);
                        
                        // 动态增加转向系数：存活越久，追踪拐弯越猛，彻底打破死循环绕圈（Orbit Bug）
                        let currentTurn = 0.08 + (this.lifeTime / 1500) * 0.3;
                        const turnFactor = Math.min(0.5, currentTurn) * timeScale;
                        
                        const targetVx = Math.cos(targetAngle) * speed; const targetVy = Math.sin(targetAngle) * speed;
                        this.vx += (targetVx - this.vx) * turnFactor; this.vy += (targetVy - this.vy) * turnFactor;
                        const newSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        if (newSpeed > 0) { this.vx = (this.vx / newSpeed) * speed; this.vy = (this.vy / newSpeed) * speed; }
                    }
                }
                this.x += this.vx * timeScale; this.y += this.vy * timeScale;
                if (this.y < -50 || this.y > height + 50 || this.x < -50 || this.x > width + 50) this.active = false;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if(this.vx !== 0 || this.vy !== 0) ctx.rotate(Math.atan2(this.vy, this.vx) - Math.PI/2);
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 12; ctx.shadowColor = this.color;
                if (this.owner === 'player') {
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.fillStyle = this.color; ctx.globalAlpha = 0.7; ctx.fillRect(-this.width, -this.height/2 - 2, this.width*2, this.height + 4);
                } else {
                    ctx.beginPath(); ctx.arc(0, 0, this.width, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = this.color; ctx.globalAlpha = 0.7;
                    ctx.beginPath(); ctx.arc(0, 0, this.width + 3, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = random(0, Math.PI * 2); const speed = random(1.5, 7);
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = 1.0; this.decay = random(0.015, 0.04); this.size = random(2, 6);
            }
            update(dt) {
                const timeScale = dt / 16; this.x += this.vx * timeScale; this.y += this.vy * timeScale;
                this.vy += 0.08 * timeScale; this.life -= this.decay * timeScale;
            }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
                ctx.translate(this.x, this.y); ctx.rotate(this.life * 15);
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size); ctx.restore();
            }
        }
        function createExplosion(x, y, count, color) { for(let i=0; i<count; i++) particles.push(new Particle(x, y, color)); }

        class Player {
            constructor() {
                this.level = playerLevel;
                this.radius = 20;
                this.x = width / 2; this.y = height - 100;
                this.targetX = this.x; this.targetY = this.y;
                
                let upgHp = upgradeData?.attr?.hp || 0;
                let upgAtk = upgradeData?.attr?.atk || 0;
                let upgDef = upgradeData?.attr?.def || 0;
                const equipList = Array.isArray(equipped) ? equipped : [];
                
                let hpMult = (1 + upgHp * 0.05) * (1 + (equipList.includes('cwsbgl') ? 0.05 : 0) + (equipList.includes('cwsbbj') ? 0.02 : 0));
                let atkMult = (1 + upgAtk * 0.05) * (1 + (equipList.includes('cwsbyj') ? 0.05 : 0) + (equipList.includes('cwsbjgy') ? 0.05 : 0) + (equipList.includes('cwsbbj') ? 0.02 : 0));
                
                this.maxHp = Math.floor((500 + this.level * 35) * hpMult);
            this.hp = this.maxHp;
            this.atk = Math.floor((50 + this.level * 4.5) * atkMult);
            this.defMult = 1 - Math.min(0.6, upgDef * 0.05); 
            
            this.fireTimer = 0; this.fireRate = 150 / (1 + this.level * 0.01);
            this.shield = 0; this.invincibilityStacks = 0; this.burstTimer = 0;
            this.hitFlashTimer = 0;
            this.easing = 0.2; this.scale = 0.3;
            this.petProps = getInterpolatedPet(this.level);
                
                let baseHue = (190 + this.level * 5) % 360;
                this.colors = { main: `hsla(${baseHue}, 80%, 50%, 0.15)`, stroke: `hsl(${baseHue}, 100%, 60%)`, visor: `hsl(${(baseHue + 330) % 360}, 100%, 70%)` };
                if (this.level >= 200) { this.colors = { main: `hsla(45, 100%, 90%, 0.25)`, stroke: `#ffffff`, visor: `#fde047` }; }
            }

            update(dt) {
            const dx = this.targetX - this.x; const dy = this.targetY - this.y;
            this.tilt = dx * 0.05; this.tilt = Math.max(-0.5, Math.min(0.5, this.tilt)); 
            this.x += dx * this.easing; this.y += dy * this.easing;
            this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

            if (this.burstTimer > 0) this.burstTimer -= dt;
            if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;

            this.fireTimer += dt;
            const currentFireRate = this.burstTimer > 0 ? this.fireRate * 0.5 : this.fireRate;
                if (this.fireTimer >= currentFireRate) { this.fire(); this.fireTimer = 0; }
                this.haloRotation = (this.haloRotation || 0) + (dt / 16) * 0.02;
            }

            takeDamage(amount) {
            if (this.invincibilityStacks > 0) { 
                this.invincibilityStacks--;
                showFloatingText(this.x, this.y, "免疫", "text-amber-300 font-bold"); 
                if (this.invincibilityStacks <= 0) {
                    activeSkillDurations.invinc = 0;
                    skillCooldowns.invinc = SKILL_COOLDOWN_MAX;
                }
                return; 
            }
            
            amount = amount * (this.defMult || 1);

            if (this.shield > 0) {
                if (this.shield >= amount) { 
                    this.shield -= amount; 
                    showFloatingText(this.x, this.y, "吸收", "text-blue-300"); 
                    if (this.shield <= 0) {
                        this.shield = 0;
                        activeSkillDurations.shield = 0;
                        skillCooldowns.shield = SKILL_COOLDOWN_MAX;
                    }
                    return; 
                } else { 
                    amount -= this.shield; 
                    this.shield = 0; 
                    activeSkillDurations.shield = 0;
                    skillCooldowns.shield = SKILL_COOLDOWN_MAX;
                }
            }
            
            this.hp -= amount; 
            
            showFloatingText(this.x, this.y - 20, `-${Math.floor(amount)}`, "text-rose-500 font-black text-2xl drop-shadow-[0_0_8px_rgba(225,29,72,0.8)]");
            
            updateHUD();
            
            this.hitFlashTimer = 150;
            
            if (this.hp <= 0) { createExplosion(this.x, this.y, 50, '#38bdf8'); endGame(false); }
        }

        fire() {
                let upgBurst = upgradeData?.skill?.burst || 0;
                const isBurst = this.burstTimer > 0;
                const dmg = isBurst ? this.atk * (1 + upgBurst * 0.03) : this.atk;
                const color = isBurst ? '#f43f5e' : '#22d3ee'; 
                
                const baseN = isBurst ? 5 : 2;
                const extraLines = Math.floor(this.level / 20);
                const totalLines = baseN + extraLines;
                
                const speedMult = 1 + this.level * 0.01;
                const baseVy = (isBurst ? -20 : -18) * speedMult;

                playShootSound(true);

                for (let i = 0; i < totalLines; i++) {
                    let c = i - (totalLines - 1) / 2;
                    let x_offset = c * 12;
                    let y_offset = -20 + Math.abs(c) * 2;
                    
                    let vx = 0;
                    if (totalLines > 3) {
                        if (c < -1) vx = (c + 1) * 2;
                        else if (c > 1) vx = (c - 1) * 2;
                    }
                    
                    bullets.push(new Bullet(this.x + x_offset, this.y + y_offset, baseVy, color, vx, 'player', dmg));
                }
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.shield > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 20, 0, Math.PI*2);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
                    
                    ctx.save();
                    ctx.fillStyle = '#93c5fd';
                    ctx.font = 'bold 11px "JetBrains Mono", monospace';
                    ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 4;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText(`🛡️${Math.floor(this.shield)}`, this.radius + 25, -10);
                    ctx.restore();
                }
                if (this.invincibilityStacks > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 25, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; ctx.fill();
                    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.stroke();
                    
                    ctx.save();
                    ctx.fillStyle = '#fde047';
                    ctx.font = 'bold 11px "JetBrains Mono", monospace';
                    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 4;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText(`✨${this.invincibilityStacks}次`, this.radius + 25, 10);
                    ctx.restore();
                }
                
                let leftOffsetY = 0;
                if (this.burstTimer > 0) {
                    ctx.save();
                    ctx.fillStyle = '#fca5a5';
                    ctx.font = 'bold 11px "JetBrains Mono", monospace';
                    ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 4;
                    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    ctx.fillText(`🔥${(this.burstTimer / 1000).toFixed(1)}s`, -this.radius - 15, leftOffsetY);
                    ctx.restore();
                    leftOffsetY -= 15;
                }
                
                if (activeSkillDurations.summon > 0) {
                    ctx.save();
                    ctx.fillStyle = '#93c5fd';
                    ctx.font = 'bold 11px "JetBrains Mono", monospace';
                    ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 4;
                    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    ctx.fillText(`🛸${(activeSkillDurations.summon / 1000).toFixed(1)}s`, -this.radius - 15, leftOffsetY);
                    ctx.restore();
                }

                ctx.rotate(this.tilt);

                ctx.save(); ctx.rotate(this.haloRotation || 0);
                ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2);
                ctx.strokeStyle = this.colors.visor; ctx.lineWidth = 1.5; ctx.setLineDash([8, 15]); ctx.stroke();
                ctx.restore();

                ctx.shadowBlur = 15; ctx.shadowColor = this.colors.stroke;
                const ws = this.petProps.wingScale * this.scale;
                if (ws > 0) {
                    ctx.strokeStyle = this.colors.visor; ctx.lineWidth = 1.5; ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.beginPath(); ctx.moveTo(-20*ws, -20*ws); ctx.lineTo(-40*ws, 40*ws); ctx.lineTo(5*ws, 40*ws); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(20*ws, -20*ws); ctx.lineTo(40*ws, 40*ws); ctx.lineTo(-5*ws, 40*ws); ctx.closePath(); ctx.fill(); ctx.stroke();
                }

                ctx.lineWidth = 2; ctx.fillStyle = '#0f172a';
                drawPolygon(ctx, this.petProps.earL, this.scale); ctx.fill();
                drawPolygon(ctx, this.petProps.earR, this.scale); ctx.fill();
                drawPolygon(ctx, this.petProps.head, this.scale); ctx.fill();

                ctx.fillStyle = this.colors.main; ctx.strokeStyle = this.colors.stroke;
                drawPolygon(ctx, this.petProps.earL, this.scale); ctx.fill(); ctx.stroke();
                drawPolygon(ctx, this.petProps.earR, this.scale); ctx.fill(); ctx.stroke();
                drawPolygon(ctx, this.petProps.head, this.scale); ctx.fill(); ctx.stroke();

                ctx.fillStyle = this.colors.visor; ctx.globalAlpha = 0.8;
                drawPolygon(ctx, this.petProps.visor, this.scale); ctx.fill(); 
                ctx.globalAlpha = 1.0;

                const pulse = Math.abs(Math.sin((gameTime * 0.005) % Math.PI));
            ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + pulse * 0.5})`; ctx.strokeStyle = this.colors.visor;
            drawPolygon(ctx, this.petProps.core, this.scale, 0, 5); ctx.fill(); ctx.stroke();
            ctx.restore();

            if (this.hitFlashTimer > 0) {
                ctx.fillStyle = `rgba(244, 63, 94, ${this.hitFlashTimer / 150})`;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    class Enemy {
            constructor(type, configOverride = null) {
                this.type = type; this.active = true; this.y = -50; this.x = random(30, width - 30); this.fireTimer = 0; 
                this.hitFlashTimer = 0;
                
                let scaleHp = 1 + playerLevel * 0.8; let scaleAtk = 1 + playerLevel * 0.5;

                this.radius = 16; this.hp = 20 * scaleHp; this.def = 5; this.atk = 10 * scaleAtk;
                this.speed = random(1.5, 2.5); this.color = '#f43f5e'; this.score = 50; this.fireRate = random(1500, 2500);

                switch(type) {
                    case 0: this.radius = 16; this.speed = random(1.5, 2.8); this.color = '#f43f5e'; this.score = 20; break;
                    case 1: this.radius = 12; this.speed = random(3.5, 5.5); this.color = '#fbbf24'; this.score = 30; break;
                    case 2: this.radius = 26; this.speed = random(0.5, 1.2); this.color = '#9f1239'; this.score = 100; break;
                    case 3: this.radius = 20; this.speed = random(2.0, 3.5); this.color = '#8b5cf6'; this.score = 200; break;
                    case 4: 
                        this.radius = 48; 
                        this.speed = 0; 
                        this.color = '#e11d48'; 
                        // 根据要求：BOSS战击败BOSS获得的得分为关卡的1000倍
                        this.score = currentBattleMode === 'boss' ? currentStage * 1000 : 1000; 
                        this.x = width / 2; 
                        this.alertRadius = 200; 
                        break;
                }

                if (configOverride) {
                    if (configOverride.hp) this.hp = configOverride.hp;
                    if (configOverride.def) this.def = configOverride.def;
                    if (configOverride.atkSpeed) this.fireRate = configOverride.atkSpeed;
                    if (configOverride.atk) this.atk = configOverride.atk; // 加入对攻击力覆盖的支持
                }
                this.maxHp = this.hp;
            }

            update(dt) {
                const timeScale = dt / 16;
                if (this.type === 4) {
                    if (this.y < height * 0.15) this.y += 1 * timeScale;
                    else {
                        this.x += Math.sin(gameTime * 0.001) * 2 * timeScale;
                        this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                    }
                } else {
                    this.y += this.speed * timeScale;
                    if (this.type === 1 && player) { const dx = player.x - this.x; this.x += (dx > 0 ? 0.6 : -0.6) * timeScale; }
                }

                this.fireTimer += dt;
                if (this.active && (this.type === 4 || (this.y > 0 && this.y < height * 0.8))) {
                    if (this.fireTimer >= this.fireRate) { this.fire(); this.fireTimer = 0; }
                }
                if (this.type !== 4 && this.y > height + 50) {
                    this.y = -50;
                    this.x = random(30, width - 30);
                }

                if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
            }
            
            fire() {
                if (!player) return;
                const dx = player.x - this.x; const dy = player.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy); const dirX = dx / dist; const dirY = dy / dist;
                const bulletSpeed = 4.5 + (playerLevel * 0.02);
                
                playShootSound(false);

                if (this.type === 0) {
                    bullets.push(new Bullet(this.x, this.y + this.radius, dirY * bulletSpeed, '#f43f5e', dirX * bulletSpeed, 'enemy', this.atk));
                } else if (this.type === 1) {
                    bullets.push(new Bullet(this.x, this.y + this.radius, bulletSpeed * 1.5, '#fbbf24', 0, 'enemy', this.atk));
                } else if (this.type === 2) {
                    const baseAngle = Math.atan2(dy, dx);
                    for (let i = -2; i <= 2; i++) {
                        const angle = baseAngle + i * 0.25; 
                        bullets.push(new Bullet(this.x, this.y + this.radius, Math.sin(angle) * bulletSpeed * 0.8, '#9f1239', Math.cos(angle) * bulletSpeed * 0.8, 'enemy', this.atk));
                    }
                } else if (this.type === 3) {
                    const baseAngle = Math.atan2(dy, dx);
                    for (let i = -1; i <= 1; i++) {
                        const angle = baseAngle + i * 0.3; 
                        bullets.push(new Bullet(this.x, this.y + this.radius, Math.sin(angle) * bulletSpeed * 0.9, '#8b5cf6', Math.cos(angle) * bulletSpeed * 0.9, 'enemy', this.atk));
                    }
                } else if (this.type === 4) {
                    for (let i = 0; i < 8; i++) {
                        const angle = (Math.PI * 2 / 8) * i + (gameTime * 0.001);
                        bullets.push(new Bullet(this.x, this.y + this.radius, Math.sin(angle) * bulletSpeed * 0.6, '#e11d48', Math.cos(angle) * bulletSpeed * 0.6, 'enemy', this.atk));
                    }
                    bullets.push(new Bullet(this.x, this.y + this.radius, dirY * bulletSpeed * 1.2, '#fde047', dirX * bulletSpeed * 1.2, 'enemy', this.atk * 1.5));
                }
            }

            takeDamage(amount) {
                const actualDamage = Math.max(1, amount - this.def);
                this.hp -= actualDamage;
                this.hitFlashTimer = 60;
                
                showFloatingText(this.x + random(-25, 25), this.y + random(-15, 5), `-${Math.floor(actualDamage)}`, "text-white font-black text-lg drop-shadow-md");

                if (this.type === 4) updateBossHpUI(this.hp, this.maxHp);

                if (this.hp <= 0) {
                    this.active = false; score += this.score; updateScoreUI();
                    createExplosion(this.x, this.y, this.radius * 2.5, this.color);
                    createExplosion(this.x, this.y, this.radius, '#fff'); 
                    showFloatingText(this.x, this.y, `+${this.score}`);
                    
                    if (this.type === 4) {
                        document.getElementById('bossHpContainer').classList.add('opacity-0', '-translate-y-12');
                        setTimeout(() => endGame(true), 1800);
                    }
                }
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                
                if (this.type === 4) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, this.alertRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(225, 29, 72, ${0.4 + Math.abs(Math.sin(gameTime*0.003))*0.2})`; 
                    ctx.lineWidth = 2;
                    ctx.setLineDash([15, 10]); 
                    ctx.stroke();
                    ctx.fillStyle = `rgba(225, 29, 72, 0.08)`;
                    ctx.fill();
                    ctx.restore();
                }

                ctx.shadowBlur = 15; ctx.shadowColor = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = 2.5; ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                if (this.type === 0) {
                    ctx.moveTo(0, 16); ctx.lineTo(16, -10); ctx.lineTo(-16, -10);
                } else if (this.type === 1) {
                    ctx.moveTo(0, 15); ctx.lineTo(9, -6); ctx.lineTo(0, -15); ctx.lineTo(-9, -6);
                } else if (this.type === 2) {
                    for (let i = 0; i < 6; i++) {
                        const angle = i * Math.PI / 3 + Math.PI/6;
                        if (i===0) ctx.moveTo(Math.cos(angle) * 22, Math.sin(angle) * 22); 
                        else ctx.lineTo(Math.cos(angle) * 22, Math.sin(angle) * 22);
                    }
                } else if (this.type === 3) {
                    ctx.moveTo(0, 20); ctx.lineTo(15, 5); ctx.lineTo(20, -10); ctx.lineTo(0, -5); ctx.lineTo(-20, -10); ctx.lineTo(-15, 5);
                } else if (this.type === 4) {
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(225, 29, 72, ${0.5 + Math.abs(Math.sin(gameTime*0.005))*0.5})`; ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.8, gameTime*0.002, gameTime*0.002 + Math.PI); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 1.2, -gameTime*0.001, -gameTime*0.001 + Math.PI); ctx.stroke();
                }
                ctx.closePath();
                if(this.type !== 4) { 
                    ctx.fill(); ctx.stroke(); 
                    const hpPct = Math.max(0, this.hp / this.maxHp);
                    const barW = this.radius * 2.5;
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.fillRect(-barW/2, this.radius + 6, barW, 4);
                    ctx.fillStyle = hpPct > 0.4 ? '#10b981' : '#f43f5e';
                    ctx.shadowBlur = 5; ctx.shadowColor = ctx.fillStyle;
                    ctx.fillRect(-barW/2, this.radius + 6, barW * hpPct, 4);
                }
                
                if (this.hitFlashTimer > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.1, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function executeAutoBattleLogic(dt) {
            let targetX = width / 2;
            let targetY = height - 120;

            let nearestEnemy = null;
            let minDist = Infinity;
            
            for (let e of enemies) {
                if (!e.active) continue;
                let distSq = (e.x - player.x)**2 + (e.y - player.y)**2;
                if (distSq < minDist) {
                    minDist = distSq;
                    nearestEnemy = e;
                }
            }

            if (nearestEnemy) {
                targetX = nearestEnemy.x;
                if (nearestEnemy.type === 4) {
                    let safeDist = nearestEnemy.alertRadius + player.radius + 60;
                    targetX = nearestEnemy.x; 
                    targetY = nearestEnemy.y + safeDist; 
                } else {
                    targetY = height - 150;
                }
            }

            let repelX = 0;
            let repelY = 0;
            let dangerCount = 0;

            for (let b of bullets) {
                if (b.owner === 'enemy' && b.active) {
                    let dx = player.x - b.x;
                    let dy = player.y - b.y;
                    let distSq = dx*dx + dy*dy;
                    let dangerRadius = 120;
                    if (distSq < dangerRadius * dangerRadius) {
                        let dist = Math.sqrt(distSq);
                        let force = (dangerRadius - dist) / dangerRadius;
                        repelX += (dx / dist) * force * 180;
                        repelY += (dy / dist) * force * 180;
                        dangerCount++;
                    }
                }
            }

            for (let e of enemies) {
                if (!e.active || e.type === 4) continue;
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let distSq = dx*dx + dy*dy;
                let dangerRadius = e.radius + player.radius + 60;
                if (distSq < dangerRadius * dangerRadius) {
                    let dist = Math.sqrt(distSq);
                    let force = (dangerRadius - dist) / dangerRadius;
                    repelX += (dx / dist) * force * 250;
                    repelY += (dy / dist) * force * 250;
                    dangerCount++;
                }
            }

            let finalTargetX = targetX + repelX;
            let finalTargetY = targetY + repelY;

            finalTargetX = Math.max(player.radius + 10, Math.min(width - player.radius - 10, finalTargetX));
            finalTargetY = Math.max(height * 0.2, Math.min(height - player.radius - 20, finalTargetY));

            player.targetX += (finalTargetX - player.targetX) * 0.15;
            player.targetY += (finalTargetY - player.targetY) * 0.15;

            if (player.hp / player.maxHp < 0.6) {
                useSkill('shield');
            }
            if (dangerCount >= 3 || bossSpawned) {
                useSkill('invinc');
            }
            if (enemies.length > 0) {
                useSkill('summon');
                useSkill('burst');
            }
        }

        let currentWaveIndex = 0; let waveSpawnTimer = 0; let enemiesSpawnedInCurrentWave = 0; let bossSpawned = false;
        
        function updateGame(dt) {
            gameTime += dt;
            
            for (let key in activeSkillDurations) {
                if (activeSkillDurations[key] > 0) {
                    activeSkillDurations[key] -= dt;
                    if (activeSkillDurations[key] <= 0) {
                        activeSkillDurations[key] = 0;
                        skillCooldowns[key] = SKILL_COOLDOWN_MAX;
                        if (key === 'summon') {
                            wingmen.forEach(w => w.active = false);
                            wingmen = [];
                        }
                    }
                }
            }

            for (let key in skillCooldowns) {
                const cdElement = document.getElementById(`cd_${key}`);
                const btnElement = document.getElementById(`btn_${key}`);
                
                if (skillCooldowns[key] > 0) {
                    skillCooldowns[key] -= dt;
                    btnElement.classList.add('used');
                    cdElement.classList.remove('hidden');
                    cdElement.innerText = Math.ceil(skillCooldowns[key] / 1000);
                } else if (activeSkillDurations[key] > 0) {
                    btnElement.classList.add('used');
                    cdElement.classList.add('hidden');
                } else {
                    btnElement.classList.remove('used');
                    cdElement.classList.add('hidden');
                    skillCooldowns[key] = 0;
                }
            }

            if (stageConfig && !bossSpawned) {
                if (currentWaveIndex < stageConfig.waves.length) {
                    const wave = stageConfig.waves[currentWaveIndex];
                    if (gameTime >= wave.time) {
                        waveSpawnTimer += dt;
                        const spawnInt = wave.spawnInterval || 1000;
                        if (waveSpawnTimer >= spawnInt && enemiesSpawnedInCurrentWave < wave.count) {
                            waveSpawnTimer = 0; enemiesSpawnedInCurrentWave++;
                            enemies.push(new Enemy(wave.type || 0, wave));
                        }
                        if (enemiesSpawnedInCurrentWave >= wave.count) {
                            currentWaveIndex++; enemiesSpawnedInCurrentWave = 0; waveSpawnTimer = 0;
                            if (currentWaveIndex < stageConfig.waves.length && !isRushing) {
                                showFloatingText(width/2, height/3, `波次 ${currentWaveIndex+1}`, "text-cyan-400 text-4xl font-black drop-shadow-[0_0_15px_cyan]");
                            }
                            updateWaveUI();
                        }
                    }
                } else {
                    if (enemies.length === 0) {
                        bossSpawned = true;
                        updateWaveUI();
                        waveWarning.classList.remove('opacity-0'); 
                        waveWarning.innerText = "高能反应：主宰接近！";
                        setTimeout(() => {
                            waveWarning.classList.add('opacity-0');
                            const boss = new Enemy(4, stageConfig.boss); enemies.push(boss);
                            const hpContainer = document.getElementById('bossHpContainer');
                            hpContainer.classList.remove('hidden');
                            setTimeout(() => hpContainer.classList.remove('opacity-0', '-translate-y-12'), 100);
                            updateBossHpUI(boss.maxHp, boss.maxHp);
                        }, 2500);
                    }
                }
            }

            if (isAutoBattle && player && gameState === 'playing') {
                executeAutoBattleLogic(dt);
            }

            stars.forEach(star => star.update(dt));
            if (player) player.update(dt);
            wingmen.forEach(w => w.update(dt));

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.update(dt);
                if (!b.active) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; e.update(dt);
                if (e.active) {
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.owner === 'player' && b.active) {
                            if (Math.abs(b.x - e.x) < e.radius + b.width && Math.abs(b.y - e.y) < e.radius + b.height) {
                                e.takeDamage(b.damage); b.active = false;
                                createExplosion(b.x, b.y, 2, b.color); 
                                playHitSound();
                                if (!e.active) break;
                            }
                        }
                    }
                }
                if (e.active && player) {
                    if (e.type === 4) {
                        const dx = player.x - e.x;
                        const dy = player.y - e.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < e.alertRadius + player.radius && !isAutoBattle) {
                            const angle = Math.atan2(dy, dx);
                            const safeDist = e.alertRadius + player.radius;
                            player.x = e.x + Math.cos(angle) * safeDist;
                            player.y = e.y + Math.sin(angle) * safeDist;
                            player.targetX = player.x;
                            player.targetY = player.y;
                        }
                    }
                    
                    const distSq = (player.x - e.x)**2 + (player.y - e.y)**2;
                    if (distSq < (player.radius + e.radius - 5)**2) {
                        player.takeDamage(e.hp); 
                        if (e.type !== 4) {
                            e.takeDamage(e.hp); 
                        } else {
                            const knockbackDist = player.radius + e.radius + 30;
                            const dx = player.x - e.x;
                            const dy = player.y - e.y;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            player.targetX = e.x + (dx / dist) * knockbackDist;
                            player.targetY = e.y + (dy / dist) * knockbackDist;
                        }
                    }
                }
                if (!e.active) enemies.splice(i, 1);
            }
            
            if (player) {
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.owner === 'enemy' && b.active) {
                        if (Math.abs(b.x - player.x) < player.radius * 0.8 && Math.abs(b.y - player.y) < player.radius * 0.8) {
                            player.takeDamage(b.damage); 
                            b.active = false;
                            createExplosion(b.x, b.y, 3, b.color);
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.update(dt);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawGame() {
            ctx.fillStyle = '#050b14'; ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.06)'; ctx.lineWidth = 1;
            const gridSize = 40; const offset = (gameTime / 25) % gridSize;
            ctx.beginPath();
            for(let x = 0; x <= width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y = 0; y <= height + gridSize; y += gridSize) { ctx.moveTo(0, y + offset - gridSize); ctx.lineTo(width, y + offset - gridSize); }
            ctx.stroke();

            stars.forEach(star => star.draw(ctx));
            bullets.forEach(b => b.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            wingmen.forEach(w => w.draw(ctx));
            if (player) player.draw(ctx);
        }

        function loop(timestamp) {
            const dt = timestamp - lastTime; lastTime = timestamp;
            if (gameState === 'playing') {
                const safeDt = Math.min(dt, 32);
                for(let i = 0; i < gameSpeedMultiplier; i++) {
                    updateGame(safeDt);
                }
            }
            drawGame();
            requestAnimationFrame(loop);
        }

        function setPlayerTarget(e) {
            if (gameState !== 'playing' || !player || isAutoBattle) return;
            if (e.target.id !== 'gameCanvas') return;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
            else { clientX = e.clientX; clientY = e.clientY; }
            const rect = mainContainer.getBoundingClientRect();
            player.targetX = clientX - rect.left; player.targetY = clientY - rect.top - 40; 
        }

        window.addEventListener('mousemove', setPlayerTarget);
        window.addEventListener('touchmove', (e) => { 
            if(e.target.id === 'gameCanvas') { e.preventDefault(); }
            setPlayerTarget(e); 
        }, { passive: false });
        window.addEventListener('touchstart', (e) => { 
            if(gameState === 'playing') setPlayerTarget(e); 
        }, { passive: false });

            } else {
                hpBar.classList.replace('from-rose-700', 'from-cyan-700'); 
                hpBar.classList.replace('via-rose-500', 'via-cyan-400'); 
                hpBar.classList.replace('to-rose-300', 'to-cyan-200');
                hpBar.style.boxShadow = '0 0 12px #22d3ee';
                uiHUD.children[0].classList.add('border-l-cyan-400'); uiHUD.children[0].classList.remove('border-l-rose-500');
            }
        }
