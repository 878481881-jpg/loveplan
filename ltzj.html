        window.useSkill = function(skillName) {
            if (gameState !== 'playing' || !player) return;
            if (skillCooldowns[skillName] > 0 || activeSkillDurations[skillName] > 0) return;
            
            if (skillName === 'summon') {
                let duration = 20000;
                activeSkillDurations.summon = duration;
                wingmen.push(new Wingman(player, -45)); wingmen.push(new Wingman(player, 45));
                createExplosion(player.x - 45, player.y, 20, '#60a5fa');
                createExplosion(player.x + 45, player.y, 20, '#60a5fa');
                showFloatingText(player.x, player.y - 35, "支援抵达!", "text-blue-400 font-bold text-2xl drop-shadow-[0_0_10px_rgba(96,165,250,0.9)]");
            } else if (skillName === 'invinc') {
                let upgInvinc = upgradeData?.skill?.invinc || 0;
                let stacks = 10 + upgInvinc;
                activeSkillDurations.invinc = 9999999;
                player.invincibilityStacks = stacks;
                createExplosion(player.x, player.y, 35, '#fbbf24');
                showFloatingText(player.x, player.y - 35, "护体启动!", "text-amber-400 font-bold text-2xl drop-shadow-[0_0_10px_rgba(251,191,36,0.9)]");
            } else if (skillName === 'shield') {
                let duration = 9999999; 
                activeSkillDurations.shield = duration;
                let upgShield = upgradeData?.skill?.shield || 0;
                let healAmount = player.maxHp * (0.3 + upgShield * 0.05);
                let actualHeal = Math.min(healAmount, player.maxHp - player.hp);
                player.hp += actualHeal; 
                player.shield = player.maxHp * (0.5 + upgShield * 0.05);
                updateHUD(); 
                createExplosion(player.x, player.y, 40, '#10b981');
                showFloatingText(player.x, player.y - 35, `+${Math.floor(actualHeal)}`, "text-green-400 font-black text-4xl drop-shadow-[0_0_15px_rgba(16,185,129,0.9)]");
                setTimeout(() => showFloatingText(player.x, player.y - 70, "能量重塑!", "text-cyan-300 font-bold text-2xl drop-shadow-[0_0_10px_rgba(34,211,238,0.9)]"), 400);
            } else if (skillName === 'burst') {
                let duration = 20000;
                activeSkillDurations.burst = duration;
                player.burstTimer = duration;
                createExplosion(player.x, player.y, 60, '#f43f5e');
                showFloatingText(player.x, player.y - 40, `火力全开! 20s`, "text-rose-500 font-black text-3xl drop-shadow-[0_0_20px_rgba(244,63,94,1)] whitespace-nowrap");
                const flash = document.createElement('div'); flash.className = 'flash-overlay';
                document.body.appendChild(flash); setTimeout(() => flash.remove(), 800);
            }
            
            document.getElementById(`btn_${skillName}`).classList.add('used');
        };

        function generateStageConfig(stage) {
            let waves = [];
            let totalWaves = 3 + Math.floor(stage / 5);
            let currentTime = 2000;
            
            for (let i = 0; i < totalWaves; i++) {
                let type = i % 3;
                let loopIndex = Math.floor(i / 3);
                let extraCount = loopIndex * 5;
                
                let waveConf = {
                    time: currentTime,
                    type: type
                };
                
                if (type === 0) {
                    waveConf.count = 10 + stage * 3 + extraCount;
                    waveConf.hp = 500 + stage * 100;
                    waveConf.def = stage * 8;
                    waveConf.atkSpeed = Math.max(500, 2000 - stage * 50);
                    waveConf.spawnInterval = Math.max(100, 2000 - stage * 100);
                } else if (type === 1) {
                    waveConf.count = 8 + stage * 2 + extraCount;
                    waveConf.hp = 800 + stage * 200;
                    waveConf.def = stage * 12;
                    waveConf.atkSpeed = Math.max(500, 2000 - stage * 50);
                    waveConf.spawnInterval = Math.max(100, 2000 - stage * 100);
                } else if (type === 2) {
                    waveConf.count = 5 + stage * 1 + extraCount;
                    waveConf.hp = 1000 + stage * 700;
                    waveConf.def = stage * 8;
                    waveConf.atkSpeed = Math.max(500, 2000 - stage * 50);
                    waveConf.spawnInterval = Math.max(100, 2000 - stage * 100);
                }
                
                waves.push(waveConf);
                currentTime += waveConf.count * waveConf.spawnInterval + 3000; 
            }
            
            let type3WaveCount = Math.floor(stage / 10);
            for (let j = 0; j < type3WaveCount; j++) {
                let waveConf = {
                    time: currentTime,
                    type: 3,
                    count: Math.floor(2 + stage * 0.1),
                    hp: 5000 + stage * 3000,
                    def: stage * 10,
                    atkSpeed: Math.max(1000, 3000 - stage * 50),
                    spawnInterval: Math.max(500, 2000 - stage * 100)
                };
                waves.push(waveConf);
                currentTime += waveConf.count * waveConf.spawnInterval + 3000;
            }
            
            let boss = {
                hp: 20000 + stage * 50000,
                def: 50 + stage * 15,
                atkSpeed: Math.max(200, 2000 - stage * 100)
            };
            
            return {
                rewardExp: stage * 5,
                waves: waves,
                boss: boss
            };
        }

        let isVictoryFlag = false;

                } else if (gameSpeedMultiplier === 2) {
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-amber-400 font-mono font-black text-xs rounded-full shadow-[0_0_10px_rgba(251,191,36,0.3)] border border-amber-400 hover:bg-slate-700 transition-all active:scale-95 cursor-pointer z-50";
                } else {
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-rose-400 font-mono font-black text-xs rounded-full shadow-[0_0_15px_rgba(244,63,94,0.5)] border border-rose-400 hover:bg-slate-700 transition-all active:scale-95 cursor-pointer z-50";
                }
            }
            
            isRushing = false;

            score = 0; gameTime = 0; currentWaveIndex = 0; waveSpawnTimer = 0; enemiesSpawnedInCurrentWave = 0; bossSpawned = false;
            player = new Player(); bullets = []; enemies = []; particles = []; wingmen = [];

                     setTimeout(() => showFloatingText(width/2, height/2, "自动战斗 已就绪", "text-cyan-400 font-bold text-xl drop-shadow-[0_0_10px_cyan]"), 1000);
                }

                    if (sweepStatusText) sweepStatusText.innerText = `扫荡中 - 区域 ${currentStage}`;
                    const rushBtnElement = document.getElementById('rushBtn');
                    if (rushBtnElement) rushBtnElement.click();

        }

                bgGlow.className = "absolute inset-0 opacity-20 pointer-events-none blur-3xl transition-colors duration-1000 bg-cyan-500";
                
                let gainedExp = stageConfig ? (stageConfig.rewardExp || 50) : 50;
                document.getElementById('rewardExpText').innerText = `+${gainedExp}`;
                expContainer.classList.remove('opacity-0', 'hidden');
                
                showLoader("上传作战日志...");
                
                if (globalPetData) {
                    addExpAndLevelUp(gainedExp);
                    globalPetData.lastUpdated = new Date().getTime();
                    const newSha = await updateGithubFile('data/cw.json', globalPetData, globalPetSha);
                    if (newSha) globalPetSha = newSha;
                }
                
                upgradeData.score = (upgradeData.score || 0) + score;
                if (currentStage < totalStages) {
                    currentStage++;
                }
                
                upgradeData.currentLevel = currentStage;
                const newUpgradeSha = await updateGithubFile(upgradeFile, upgradeData, upgradeSha);
                if (newUpgradeSha) upgradeSha = newUpgradeSha;
                
                hideLoader();
                
                if (isSweeping) {
                    setTimeout(() => {
                        if (isSweeping && !document.getElementById('btnRestart').disabled) {
                            document.getElementById('btnRestart').click();

                    }, 1500);
                }

            } else {
                isSweeping = false;
                hideSweepPanel();
                resultTitle.innerText = "机体损毁";
                resultTitle.className = "text-4xl font-black tracking-widest text-rose-500 drop-shadow-[0_0_15px_rgba(244,63,94,0.8)]";
                resultDesc.innerText = "生命体征微弱，强制脱离";
                btnRestart.innerText = "返回主页面";

                bgGlow.className = "absolute inset-0 opacity-20 pointer-events-none blur-3xl transition-colors duration-1000 bg-rose-500";
                
                expContainer.classList.add('opacity-0');
                setTimeout(() => expContainer.classList.add('hidden'), 300);

            btnRestart.disabled = false;
            document.getElementById('finalScore').innerText = padScore(score);
            
            uiGameOverMenu.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('resultContent').classList.replace('scale-95', 'scale-100');
            }, 50);
        }

        if (document.getElementById('btnRestart')) {
            document.getElementById('btnRestart').addEventListener('click', function() {
                if (this.disabled) return;
                this.disabled = true; 
                
                const resultContent = document.getElementById('resultContent');
                resultContent.classList.replace('scale-100', 'scale-95');
                uiGameOverMenu.classList.add('opacity-0', 'pointer-events-none');
                
                setTimeout(() => {
                    this.disabled = false;
                    uiStartMenu.classList.remove('modal-enter');
                    uiStartMenu.classList.add('modal-enter-active');
                    document.getElementById('startMenuContent').classList.replace('scale-95', 'scale-100');
                    
                    loadGameData().then(() => {
                        if (isSweeping) {
                            setTimeout(() => {
                                if (isSweeping) executeStartGame();
                            }, 500);
                        }
                    });
                }, 500);
            });
        }

        async function executeStartGame() {
            showLoader("构建作战区域...");
            try {
                if(btnStart) btnStart.disabled = true;
                const btnSweep = document.getElementById('btnSweep');
                if(btnSweep) btnSweep.disabled = true;

                const stageRes = await fetchGithubFile(`data/ltzj/${currentStage}.json`);
                if (stageRes && stageRes.data) {
                    stageConfig = stageRes.data;
                } else {
                    console.warn("未获取到云端数据，切换至动态作战协议");
                    stageConfig = generateStageConfig(currentStage);
                }
                
                // ===== 处理BOSS战模式配置覆盖 =====
                if (currentBattleMode === 'boss') {
                    stageConfig.waves = []; // 清空普通敌人波数，直接打BOSS
                    
                    // ==========================================
                    // 在这里修改 BOSS战 的核心数值倍率：
                    // ==========================================
                    const bossHpMult = 5; // BOSS血量倍率 (默认100倍)
                    const bossAtkMult = 5;  // BOSS攻击力倍率 (默认5倍)
                    const bossDefMult = 5;  // BOSS防御力倍率 (默认5倍)
                    // ==========================================
                    
                    // 动态计算该BOSS在当前关卡的基础攻击力，再乘倍率
                    let scaleAtk = 1 + playerLevel * 0.5;
                    let baseBossAtk = 10 * scaleAtk;
                    
                    stageConfig.boss.hp = (stageConfig.boss.hp || 20000) * bossHpMult;
                    stageConfig.boss.def = (stageConfig.boss.def || 50) * bossDefMult;
                    stageConfig.boss.atk = baseBossAtk * bossAtkMult;
                    
                    // BOSS战通关经验加成（可选，默认提高10倍）
                    stageConfig.rewardExp = (stageConfig.rewardExp || 50) * 1; 
                }

            } catch (err) {
                console.error("引擎通信失败, 启用离线动态协议:", err);
                stageConfig = generateStageConfig(currentStage);
                
                // 异常回退时也保证应用BOSS模式逻辑
                if (currentBattleMode === 'boss') {
                    stageConfig.waves = [];
                    const bossHpMult = 100;
                    const bossAtkMult = 5;
                    const bossDefMult = 5;
                    let scaleAtk = 1 + playerLevel * 0.5;
                    let baseBossAtk = 10 * scaleAtk;
                    stageConfig.boss.hp *= bossHpMult;
                    stageConfig.boss.def *= bossDefMult;
                    stageConfig.boss.atk = baseBossAtk * bossAtkMult;
                }
            } finally {
                if(btnStart) btnStart.disabled = false;
                const btnSweep = document.getElementById('btnSweep');
                if(btnSweep) btnSweep.disabled = false;
                hideLoader();
                startGame();
            }
        }

        if (btnStart) {
            btnStart.addEventListener('click', () => {
                isSweeping = false;
                hideSweepPanel();
                executeStartGame();
            });
        }

        const btnSweep = document.getElementById('btnSweep');
        if (btnSweep) {
            btnSweep.addEventListener('click', () => {
                isSweeping = true;
                showSweepPanel();
                
                if (!isAutoBattle) {
                    isAutoBattle = true;
                    autoBtn.classList.replace('text-slate-500', 'text-cyan-400');
                    autoBtn.classList.replace('border-slate-700/50', 'border-cyan-400');
                    autoBtn.classList.add('shadow-[0_0_10px_rgba(34,211,238,0.3)]');
                }
                
                gameSpeedMultiplier = 5;
                if (speedBtn) {
                    speedBtn.innerText = `x5`;
                    speedBtn.className = "w-8 h-8 flex items-center justify-center bg-slate-800/90 text-rose-400 font-mono font-black text-xs rounded-full shadow-[0_0_15px_rgba(244,63,94,0.5)] border border-rose-400 hover:bg-slate-700 transition-all active:scale-95 cursor-pointer z-50";
                }
                
                executeStartGame();
            });
        }

        requestAnimationFrame((timestamp) => { lastTime = timestamp; loop(timestamp); });
    </script>
</body>
</html>
