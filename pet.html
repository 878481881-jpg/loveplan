<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的儿子 💗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-10px); } 
            100% { transform: translateY(0px); } 
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes bounce-pet {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        .animate-pet { animation: bounce-pet 2s infinite ease-in-out; }

        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 20px); } 
            10% { opacity: 1; transform: translate(-50%, 0); } 
            90% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out forwards; }

        /* 火苗呼吸动画 */
        @keyframes fire-breathe {
            0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4)); }
            50% { transform: scale(1.1) translateY(-10px); filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.8)); }
        }
        .animate-fire { animation: fire-breathe 2s ease-in-out infinite alternate; }

        /* 进度条动画 */
        .progress-bar { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* 纯CSS火焰效果 */
        .flame-base {
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
            box-shadow: 0 0 20px rgba(255, 150, 0, 0.4);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes flicker-1 { 
            0%, 100% { transform: rotate(-45deg) scale(1) skewX(0deg); } 
            50% { transform: rotate(-45deg) scale(1.05) skewX(2deg); } 
        }
        @keyframes flicker-2 { 
            0%, 100% { transform: rotate(-45deg) scale(0.95) skewX(0deg); } 
            50% { transform: rotate(-45deg) scale(1.1) skewX(-2deg); } 
        }
        @keyframes flicker-3 { 
            0%, 100% { transform: rotate(-45deg) scale(1) skewX(1deg); } 
            50% { transform: rotate(-45deg) scale(0.9) skewX(-1deg); } 
        }
        @keyframes float-spark { 
            0% { opacity: 0; transform: translateY(0) scale(0.5); } 
            30% { opacity: 1; } 
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); } 
        }
        .sparkle { 
            border-radius: 50%; 
            position: absolute; 
            animation: float-spark 1.5s linear infinite; 
        }
        .sun-base {
            border-radius: 50%;
            box-shadow: 0 0 30px #fcd34d, 0 0 60px #fb923c, inset 0 0 20px #fff;
        }
        @keyframes pulse-sun { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
        }
        
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 pb-24">
    
    <header class="text-center mb-6 max-w-md animate-float">
        <h1 class="text-3xl md:text-4xl font-bold text-rose-500 mb-2 drop-shadow-sm flex items-center justify-center gap-2">
            🐾 我们的儿子 
        </h1>
        <p class="text-rose-400 text-sm md:text-base">
            一起用心呵护属于我们的小生命
        </p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 选项卡导航 -->
        <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
            <a href="index.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">返回首页</a>
            <a href="pet.html" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">宠物乐园</a>
        </div>

        <!-- 状态层：加载中 -->
        <div id="loadingView" class="w-full flex flex-col items-center py-12">
            <div class="text-4xl animate-bounce mb-4">🐾</div>
            <p class="text-rose-400 font-medium">正在唤醒小可爱...</p>
        </div>

        <!-- 状态层：领养宠物 -->
        <div id="adoptView" class="w-full hidden flex-col items-center transition-opacity duration-300 animate-fade-in">
            <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-rose-100 w-full relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-rose-300 to-pink-400"></div>
                <h2 class="text-xl font-bold text-rose-500 text-center mb-4">🏠 领养我们的火苗</h2>
                <p class="text-gray-500 text-sm text-center mb-6">目前还没有小火苗哦，快来领养一团属于你们的生命之火吧！</p>
                
                <div class="flex justify-center gap-4 mb-6" id="petSelector">
                    <!-- 默认选择火苗 -->
                    <button class="pet-select-btn p-3 border-2 border-rose-500 rounded-2xl bg-rose-100 transition-all cursor-default relative flex justify-center items-center h-16 w-16 overflow-hidden">
                        <div class="w-full h-full relative flex justify-center items-end pb-1">
                            <div class="absolute w-8 h-8 bg-red-400 flame-base bottom-1"></div>
                            <div class="absolute w-4 h-4 bg-yellow-300 flame-base bottom-2"></div>
                        </div>
                        <span class="absolute -top-2 -right-2 text-xs bg-rose-500 text-white px-2 py-0.5 rounded-full shadow-sm z-10">专属</span>
                    </button>
                </div>
                
                <input type="text" id="petNameInput" placeholder="给小火苗起个名字..." class="w-full px-4 py-3 text-center border-2 border-rose-200 rounded-xl focus:outline-none focus:border-rose-500 text-gray-700 font-bold mb-6 placeholder-rose-300">
                
                <button onclick="adoptPet()" id="adoptBtn" class="w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold rounded-full shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    💕 确认领养
                </button>
            </div>
        </div>

        <!-- 状态层：宠物主界面 -->
        <div id="petView" class="w-full hidden flex-col items-center transition-opacity duration-300 animate-fade-in">
            
            <!-- 宠物展示区 -->
            <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-rose-100 w-full relative mb-6 overflow-hidden">
                <!-- 宠物信息 -->
                <div class="flex justify-between items-start mb-2 relative z-10">
                    <div>
                        <h2 id="displayPetName" class="text-2xl font-bold text-gray-800 flex items-center gap-2">小火苗</h2>
                        <p class="text-rose-400 text-sm font-medium mt-1">Lv.<span id="displayPetLevel">1</span> <span class="text-gray-400 text-xs ml-1" id="displayPetStatus">微弱</span></p>
                    </div>
                    <div class="bg-rose-50 px-3 py-1 rounded-full border border-rose-100">
                        <span class="text-xs text-rose-500 font-bold">EXP: <span id="displayPetExp">0</span>/<span id="displayMaxExp">100</span></span>
                    </div>
                </div>

                <!-- 宠物动画区 -->
                <div class="py-12 flex justify-center items-center relative min-h-[320px]">
                    <!-- 动态光晕背景 -->
                    <div id="glowEffect" class="absolute w-48 h-48 bg-orange-300 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-pulse transition-all duration-1000"></div>
                    
                    <!-- 纯代码生成的动态宠物 (扩大了容器边界防溢出) -->
                    <div id="petVisualizer" class="z-10 cursor-pointer w-64 h-64 relative flex items-end justify-center pb-10 transition-transform duration-300" onclick="petInteraction()">
                        <!-- 火焰层将由 JS 动态注入 -->
                    </div>
                    
                    <!-- 交互漂浮文字 -->
                    <div id="interactionText" class="absolute top-4 text-orange-500 font-bold opacity-0 transition-opacity z-20"></div>
                </div>

                <!-- 状态条 -->
            <div class="space-y-4 relative z-10">
                <!-- 饱食度 -->
                    <div>
                        <div class="flex justify-between text-xs mb-1 font-medium text-gray-500">
                            <span>🪵 燃料值 (饱食)</span>
                            <span id="valHunger">80/100</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                            <div id="barHunger" class="bg-orange-500 h-2.5 rounded-full progress-bar" style="width: 80%"></div>
                        </div>
                    </div>
                    <!-- 心情 -->
                    <div>
                        <div class="flex justify-between text-xs mb-1 font-medium text-gray-500">
                            <span>🎵 活力值 (心情)</span>
                            <span id="valMood">80/100</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                            <div id="barMood" class="bg-rose-400 h-2.5 rounded-full progress-bar" style="width: 80%"></div>
                        </div>
                    </div>
                    <!-- 清洁度/温度 -->
                    <div>
                        <div class="flex justify-between text-xs mb-1 font-medium text-gray-500">
                            <span>💧 稳定度 (防暴走)</span>
                            <span id="valClean">80/100</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                            <div id="barClean" class="bg-sky-400 h-2.5 rounded-full progress-bar" style="width: 80%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作区 -->
            <div class="grid grid-cols-4 gap-2 w-full mb-8">
                <button id="btn_feed" onclick="doAction('feed')" class="flex flex-col items-center justify-center p-2 bg-white rounded-2xl shadow-sm border border-orange-100 hover:shadow-md transform hover:-translate-y-1 transition-all">
                    <span class="text-xl mb-1">🪵</span>
                    <span class="text-[10px] font-bold text-orange-600">喂柴火</span>
                    <span id="count_feed" class="text-[9px] text-gray-400 mt-1 font-medium">剩余: -</span>
                </button>
                <button id="btn_fan" onclick="doAction('fan')" class="flex flex-col items-center justify-center p-2 bg-white rounded-2xl shadow-sm border border-rose-100 hover:shadow-md transform hover:-translate-y-1 transition-all">
                    <span class="text-xl mb-1">💨</span>
                    <span class="text-[10px] font-bold text-rose-600">吹扇子</span>
                    <span id="count_fan" class="text-[9px] text-gray-400 mt-1 font-medium">剩余: -</span>
                </button>
                <button id="btn_water" onclick="doAction('water')" class="flex flex-col items-center justify-center p-2 bg-white rounded-2xl shadow-sm border border-sky-100 hover:shadow-md transform hover:-translate-y-1 transition-all">
                    <span class="text-xl mb-1">💧</span>
                    <span class="text-[10px] font-bold text-sky-600">降降温</span>
                    <span id="count_water" class="text-[9px] text-gray-400 mt-1 font-medium">剩余: -</span>
                </button>
                <button id="btn_sing" onclick="doAction('sing')" class="flex flex-col items-center justify-center p-2 bg-white rounded-2xl shadow-sm border border-purple-100 hover:shadow-md transform hover:-translate-y-1 transition-all">
                    <span class="text-xl mb-1">🎵</span>
                    <span class="text-[10px] font-bold text-purple-600">唱首歌</span>
                    <span id="count_sing" class="text-[9px] text-gray-400 mt-1 font-medium">剩余: -</span>
                </button>
            </div>

            <!-- 动态日志区 -->
            <div class="w-full bg-white rounded-2xl p-4 shadow-sm border-2 border-gray-50">
                <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                    <span>📖</span> 陪伴日记
                </h3>
                <div id="logContainer" class="space-y-3 max-h-48 overflow-y-auto no-scrollbar">
                    <!-- 日志项将由 JS 生成 -->
                </div>
                <div id="emptyLog" class="text-center py-4 text-xs text-gray-400 hidden">
                    还没有互动记录，快去照顾小可爱吧~
                </div>
            </div>

        </div>
    </main>

    <!-- 全局提示框 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap"></div>

    <script>
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html'; // 强制鉴权
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        
        // 文件路径定义
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_PET = 'data/cw.json'; 
        const FILE_H_ACT = 'data/Hcw.json'; 
        const FILE_Q_ACT = 'data/Qcw.json'; 

        // 全局状态
        let petData = null;
        let petSha = null;
        let myActData = [];
        let myActSha = null;
        let partnerActData = [];
        let partnerActSha = null;
        
        let maxActionsPerDay = 1; // 默认每人每项操作每日 1 次
        
        let selectedPetEmoji = '🔥'; // 默认基础类型
        let isProcessing = false; // 防止重复点击

        // 动态计算每一级所需的经验值 (线性递增：每级增加8点)
        function getMaxExp(level) {
            if (level >= 100) return 999999; 
            return Math.floor(100 + (level - 1) * 8);
        }

        window.onload = async function() {
            await initData();
        };

        async function fetchFile(filePath) {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${timestamp}`, {
                    method: 'GET', 
                    headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (response.status === 404) return { data: null, sha: null }; // 文件不存在
                if (!response.ok) return { error: true };
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                
                let parsedData = null;
                try {
                    parsedData = JSON.parse(contentStr);
                } catch(e) {
                    parsedData = filePath.includes('cw.json') ? {} : []; // 根据文件类型给默认空值
                }
                return { data: parsedData, sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update ${filePath} from pet.html`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', 
                    headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(body)
                });
                if (response.status === 401 || response.status === 403) return { authError: true };
                if (!response.ok) {
                    // 如果是 409 冲突，说明数据在其他地方被修改了
                    if(response.status === 409) return { conflict: true };
                    return { success: false, sha: sha };
                }
                
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        async function initData() {
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('adoptView').classList.add('hidden');
            document.getElementById('petView').classList.add('hidden');

            const myPath = myIdentity === '哼哼' ? FILE_H_ACT : FILE_Q_ACT;
            const partnerPath = myIdentity === '哼哼' ? FILE_Q_ACT : FILE_H_ACT;
            const partnerTaskPath = myIdentity === '哼哼' ? 'data/q.json' : 'data/h.json'; // 对方的盲盒任务文件

            const [resPet, resMy, resPartner, resPartnerTask] = await Promise.all([
                fetchFile(FILE_PET),
                fetchFile(myPath),
                fetchFile(partnerPath),
                fetchFile(partnerTaskPath)
            ]);

            if (resPet.authError) {
                showToast("Token失效，请重新登录"); 
                setTimeout(()=>window.location.href='index.html', 1500); 
                return;
            }

            petData = (resPet.data && Object.keys(resPet.data).length > 0) ? resPet.data : null;
            petSha = resPet.sha;
            
            myActData = Array.isArray(resMy.data) ? resMy.data : [];
            myActSha = resMy.sha;
            
            partnerActData = Array.isArray(resPartner.data) ? resPartner.data : [];
            partnerActSha = resPartner.sha;

            // 联动盲盒任务：如果对方今日完成了任务，当前用户的操作次数上限 +1
            const todayStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
            if (!resPartnerTask.error && resPartnerTask.data && resPartnerTask.data[todayStr] && resPartnerTask.data[todayStr].myTaskCompleted) {
                maxActionsPerDay = 2; // 获得额外次数
            }

            document.getElementById('loadingView').classList.add('hidden');

            if (!petData) {
                // 没有宠物，显示领养界面
                document.getElementById('adoptView').classList.remove('hidden');
                document.getElementById('adoptView').classList.add('flex');
            } else {
                // 有宠物，计算随时间流逝的状态并渲染
                calculateTimeDecay();
                renderPetUI();
                renderLogs();
                updateActionCounts(); // 渲染每日剩余操作次数
                document.getElementById('petView').classList.remove('hidden');
                document.getElementById('petView').classList.add('flex');
            }
        }

        // 程序化渲染从1到100级的视觉进化
        function renderPetVisual(level) {
            const container = document.getElementById('petVisualizer');
            let html = '';

            // 10个颜色阶层，每10级突破一次颜色境界
            const tiers = [
                { f1: '#fb923c', f2: '#fef08a', f3: '#ffffff', glow: 'rgba(251, 146, 60, 0.4)' },   // 1-10: 凡火 (橙黄)
                { f1: '#ef4444', f2: '#fb923c', f3: '#fef08a', glow: 'rgba(239, 68, 68, 0.4)' },   // 11-20: 烈火 (红橙)
                { f1: '#e11d48', f2: '#f472b6', f3: '#fed7aa', glow: 'rgba(225, 29, 72, 0.4)' },   // 21-30: 灵火 (玫瑰)
                { f1: '#9333ea', f2: '#d946ef', f3: '#f9a8d4', glow: 'rgba(147, 51, 234, 0.4)' },  // 31-40: 幽冥火 (紫)
                { f1: '#4f46e5', f2: '#a78bfa', f3: '#c7d2fe', glow: 'rgba(79, 70, 229, 0.4)' },   // 41-50: 星辰火 (靛蓝)
                { f1: '#2563eb', f2: '#22d3ee', f3: '#a5f3fc', glow: 'rgba(37, 99, 235, 0.4)' },   // 51-60: 极寒冰火 (蓝青)
                { f1: '#0d9488', f2: '#34d399', f3: '#bbf7d0', glow: 'rgba(13, 148, 136, 0.4)' },  // 61-70: 碧落炎 (青绿)
                { f1: '#16a34a', f2: '#a3e635', f3: '#fef08a', glow: 'rgba(22, 163, 74, 0.4)' },   // 71-80: 生命之火 (绿黄)
                { f1: '#ca8a04', f2: '#fde047', f3: '#ffffff', glow: 'rgba(202, 138, 4, 0.5)' },   // 81-90: 耀斑 (金)
                { f1: '#f3f4f6', f2: '#ffffff', f3: '#dbeafe', glow: 'rgba(255, 255, 255, 0.7)' }  // 91-100: 永恒星核 (白)
            ];

            const tierIdx = Math.min(9, Math.floor((level - 1) / 10));
            const t = tiers[tierIdx];

            // 1. 无缝尺寸缩放 (从 1 倍缓慢膨胀到 2.5 倍)
            const scale = 0.8 + (level / 100) * 1.7;
            
            // 2. 随等级加快的燃烧频率
            const speed1 = Math.max(0.5, 1.8 - (level / 100) * 1.0);
            const speed2 = Math.max(0.4, 1.4 - (level / 100) * 0.8);
            const speed3 = Math.max(0.3, 1.2 - (level / 100) * 0.7);

            // 包裹层应用整体缩放
            html += `<div class="relative flex justify-center items-end transition-transform duration-700" style="transform: scale(${scale}); transform-origin: bottom center;">`;

            // 高等级法阵/外环 (Level > 40 解锁)
            if (level > 40) {
                const ringScale = 1 + ((level - 40) / 60) * 0.5;
                html += `<div class="absolute border-2 border-dashed rounded-full opacity-30 bottom-[-10px] animate-[spin_8s_linear_infinite]" style="width: 80px; height: 80px; border-color: ${t.f1}; transform: scale(${ringScale})"></div>`;
            }
            if (level > 80) {
                const ringScale2 = 1 + ((level - 80) / 20) * 0.5;
                html += `<div class="absolute border-4 border-dotted rounded-full opacity-40 bottom-[-15px] animate-[spin_12s_linear_infinite_reverse]" style="width: 100px; height: 100px; border-color: ${t.f2}; transform: scale(${ringScale2})"></div>`;
            }

            // 三层核心火焰
            html += `<div class="absolute flame-base opacity-90 bottom-2" style="width:40px; height:40px; background-color:${t.f1}; box-shadow: 0 0 ${10 + level/3}px ${t.glow}; animation: flicker-1 ${speed1}s infinite ease-in-out"></div>`;
            html += `<div class="absolute flame-base opacity-95 bottom-4" style="width:26px; height:26px; background-color:${t.f2}; animation: flicker-2 ${speed2}s infinite ease-in-out"></div>`;
            html += `<div class="absolute flame-base bottom-6" style="width:14px; height:14px; background-color:${t.f3}; animation: flicker-3 ${speed3}s infinite ease-in-out"></div>`;

            // 动态火星 (随等级增加数量，10级以上才出现)
            const numSparks = level >= 10 ? Math.floor(level / 8) : 0;
            for(let i = 0; i < numSparks; i++) {
                const offsetX = (Math.random() * 40) - 20; // -20 to 20
                const offsetY = 15 + (Math.random() * 25);
                const delay = Math.random() * 2;
                const dur = 0.8 + Math.random();
                const sparkColor = (i % 2 === 0) ? t.f2 : t.f3;
                html += `<div class="sparkle absolute rounded-full" style="width: 5px; height: 5px; background-color: ${sparkColor}; left: calc(50% + ${offsetX}px); bottom: ${offsetY}px; animation-delay: ${delay}s; animation-duration: ${dur}s"></div>`;
            }

            // 满级神性光辉
            if (level >= 95) {
                html += `<div class="absolute rounded-full bottom-3 mix-blend-overlay animate-pulse" style="width: 30px; height: 30px; background-color: white; box-shadow: 0 0 20px white"></div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        async function adoptPet() {
            if (isProcessing) return;
            const nameInput = document.getElementById('petNameInput').value.trim();
            if (!nameInput) {
                showToast("给小火苗起个名字吧！");
                return;
            }

            isProcessing = true;
            const btn = document.getElementById('adoptBtn');
            btn.innerHTML = '<span class="animate-spin">⏳</span> 孕育中...';

            // 初始化宠物数据
            const newPetData = {
                name: nameInput,
                baseEmoji: '🔥', // 基础属性记录为火苗
                level: 1,
                exp: 0,
                hunger: 80,
                mood: 80,
                clean: 100,
                adoptedBy: myIdentity,
                adoptedAt: new Date().getTime(),
                lastUpdated: new Date().getTime()
            };

            const upRes = await updateFile(FILE_PET, newPetData, petSha);
            
            if (upRes.success) {
                petData = newPetData;
                petSha = upRes.sha;
                
                // 记录领养日志
                await logAction('adopt', `点燃了生命之火：${nameInput}`);
                
                showToast("点火成功！🎉");
                document.getElementById('adoptView').classList.add('hidden');
                document.getElementById('adoptView').classList.remove('flex');
                renderPetUI();
                renderLogs();
                document.getElementById('petView').classList.remove('hidden');
                document.getElementById('petView').classList.add('flex');
            } else {
                showToast("领养失败，可能TA已经偷偷领养啦，刷新看看！");
            }
            
            btn.innerHTML = '💕 确认领养';
            isProcessing = false;
        }

        async function doAction(type) {
            if (isProcessing || !petData) return;
            
            // 计算当前操作今日已使用的次数
            const todayStart = new Date().setHours(0, 0, 0, 0);
            const currentUsedCount = myActData.filter(log => log.action === type && log.time >= todayStart).length;
            
            if (currentUsedCount >= maxActionsPerDay) {
                showToast(`今日【${getActionName(type)}】次数已用完啦！${maxActionsPerDay === 1 ? '(提醒TA完成每日任务可解锁额外1次哦)' : ''}`);
                return;
            }
            
            isProcessing = true;

            // 重新获取最新宠物数据防止冲突
            const latestPetRes = await fetchFile(FILE_PET);
            if (!latestPetRes.error && latestPetRes.data) {
                petData = latestPetRes.data;
                petSha = latestPetRes.sha;
                calculateTimeDecay(); // 补算时间流逝
            }

            let logMsg = "";
            let expGain = 0;
            let success = false;

            if (type === 'feed') {
                if (petData.hunger >= 100) { showToast(`${petData.name} 燃料充足，再加要爆啦！`); isProcessing = false; return; }
                petData.hunger = Math.min(100, petData.hunger + 25);
                petData.mood = Math.min(100, petData.mood + 5);
                petData.clean = Math.max(0, petData.clean - 5); // 烧火会降低一点稳定度
                expGain = 15;
                logMsg = "添了一把 🪵，火光更亮了";
                showInteractionText("+25 🪵");
                success = true;
            } 
            else if (type === 'fan') {
                if (petData.hunger < 20) { showToast(`燃料不足，吹风会熄灭的！`); isProcessing = false; return; }
                petData.mood = Math.min(100, petData.mood + 20);
                petData.hunger = Math.max(0, petData.hunger - 15); // 吹风消耗燃料
                expGain = 10;
                logMsg = "用力吹了 💨，火苗开心地跳跃";
                showInteractionText("+20 💨");
                success = true;
            }
            else if (type === 'water') {
                if (petData.clean >= 100) { showToast(`${petData.name} 状态很稳定！`); isProcessing = false; return; }
                petData.clean = Math.min(100, petData.clean + 30);
                petData.mood = Math.max(0, petData.mood - 5); // 浇水会稍微影响心情
                expGain = 5;
                logMsg = "滴了点 💧 降温，火势稳定下来了";
                showInteractionText("+30 💧");
                success = true;
            }
            else if (type === 'sing') {
                petData.mood = Math.min(100, petData.mood + 15);
                petData.clean = Math.min(100, petData.clean + 5); // 唱歌能平稳情绪
                expGain = 8;
                logMsg = "唱了一首 🎵，气氛变得温馨";
                showInteractionText("+15 🎵");
                success = true;
            }

            if (success) {
                petData.exp += expGain;
                
                // 动态计算所需经验，支持跨级连续升级
                let currentMaxExp = getMaxExp(petData.level);
                let leveledUp = false;
                
                while (petData.exp >= currentMaxExp && petData.level < 100) {
                    petData.exp -= currentMaxExp;
                    petData.level += 1;
                    currentMaxExp = getMaxExp(petData.level);
                    leveledUp = true;
                }
                
                // 满级锁定保护
                if (petData.level >= 100) {
                    petData.level = 100;
                    petData.exp = currentMaxExp; // 满级后经验条呈现全满状态
                }
                
                if (leveledUp) {
                    logMsg += ` (火苗进化了! Lv.${petData.level})`;
                    showToast(`🎉 ${petData.name} 突破到了 ${petData.level} 级！形态发生变化！`);
                    
                    // 升级时的特效反馈
                    const visualEl = document.getElementById('petVisualizer');
                    visualEl.style.transform = 'scale(1.5)';
                    visualEl.style.filter = 'drop-shadow(0 0 30px #fbbf24)';
                    setTimeout(() => {
                        visualEl.style.transform = '';
                        visualEl.style.filter = '';
                    }, 1000);
                }
                
                petData.lastUpdated = new Date().getTime();

                // 保存数据
                renderPetUI(); // 先乐观更新 UI
                
                const upPetRes = await updateFile(FILE_PET, petData, petSha);
                if (upPetRes.success) {
                    petSha = upPetRes.sha;
                    await logAction(type, logMsg);
                } else if (upPetRes.conflict) {
                    showToast("数据冲突，TA刚才可能也操作了，页面已刷新");
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showToast("操作保存失败网络异常");
                }
            }
            isProcessing = false;
        }

        async function logAction(action, desc) {
            const newLog = {
                id: new Date().getTime(),
                user: myIdentity,
                action: action,
                desc: desc,
                time: new Date().getTime()
            };
            
            myActData.push(newLog);
            updateActionCounts(); // 乐观更新按钮剩余次数 UI

            // 保持日志数量不超过 50 条
            if (myActData.length > 50) myActData = myActData.slice(myActData.length - 50);

            const myPath = myIdentity === '哼哼' ? FILE_H_ACT : FILE_Q_ACT;
            const upLogRes = await updateFile(myPath, myActData, myActSha);
            
            if (upLogRes.success) {
                myActSha = upLogRes.sha;
                renderLogs();
            }
        }

        function calculateTimeDecay() {
            if (!petData || !petData.lastUpdated) return;
            const now = new Date().getTime();
            // 计算距离上次更新过去了多少小时
            const hoursPassed = (now - petData.lastUpdated) / (1000 * 60 * 60);
            
            if (hoursPassed >= 1) {
                // 每过去一小时：消耗2点饱食度，1点心情和稳定度
                petData.hunger = Math.max(0, petData.hunger - Math.floor(hoursPassed * 2));
                petData.mood = Math.max(0, petData.mood - Math.floor(hoursPassed * 1));
                petData.clean = Math.max(0, petData.clean - Math.floor(hoursPassed * 1));
                
                // 将更新时间往前推移，但这里不立即向云端保存，等下一次用户产生互动时一并保存，减少API请求
                petData.lastUpdated = now;
            }
        }

        // 程序化渲染从1到100级的视觉进化
        function renderPetVisual(pet) {
            const level = pet.level;
            const container = document.getElementById('petVisualizer');
            let html = '';

            // 10个颜色阶层，低饱和度莫兰迪/马卡龙色系，融入粉嫩背景
            const tiers = [
                { f1: '#fde68a', f2: '#fef08a', f3: '#fef9c3', glow: 'rgba(253, 230, 138, 0.5)' }, // 1-10: 柔和暖黄
                { f1: '#fdba74', f2: '#fed7aa', f3: '#ffedd5', glow: 'rgba(253, 186, 116, 0.4)' }, // 11-20: 蜜桃浅橙
                { f1: '#fca5a5', f2: '#fecaca', f3: '#fee2e2', glow: 'rgba(252, 165, 165, 0.4)' }, // 21-30: 樱花浅粉
                { f1: '#f472b6', f2: '#fbcfe8', f3: '#fce7f3', glow: 'rgba(244, 114, 182, 0.4)' }, // 31-40: 玫瑰薄雾
                { f1: '#c084fc', f2: '#e9d5ff', f3: '#f3e8ff', glow: 'rgba(192, 132, 252, 0.4)' }, // 41-50: 薰衣草紫
                { f1: '#818cf8', f2: '#c7d2fe', f3: '#e0e7ff', glow: 'rgba(129, 140, 248, 0.4)' }, // 51-60: 雾霾鸢尾蓝
                { f1: '#93c5fd', f2: '#bfdbfe', f3: '#dbeafe', glow: 'rgba(147, 197, 253, 0.4)' }, // 61-70: 冰川浅蓝
                { f1: '#5eead4', f2: '#99f6e4', f3: '#ccfbf1', glow: 'rgba(94, 234, 212, 0.4)' }, // 71-80: 薄荷海月青
                { f1: '#86efac', f2: '#bbf7d0', f3: '#dcfce3', glow: 'rgba(134, 239, 172, 0.4)' }, // 81-90: 抹茶新绿
                { f1: '#d8b4fe', f2: '#fbcfe8', f3: '#bfdbfe', glow: 'rgba(255, 255, 255, 0.6)' }  // 91-100: 极光柔彩
            ];

            const tierIdx = Math.min(9, Math.floor((level - 1) / 10));
            const t = tiers[tierIdx];

            // --- 尺寸随等级平滑变大 (整体尺寸翻倍) ---
            // 基础缩放从 1.4 (Lv1) 到 3.2 (Lv100)，极限放大
            let scale = 1.4 + (level / 100) * 1.8; 
            let opacity = 0.95;
            
            if (pet.hunger < 30) { scale *= 0.8; opacity = 0.7; } 
            else if (pet.hunger >= 80) { scale *= 1.1; }

            let speedMult = 1;
            let sparksMult = 1;
            if (pet.mood < 30) { speedMult = 1.3; sparksMult = 0; } 
            else if (pet.mood >= 80) { speedMult = 0.8; sparksMult = 1.5; }

            let filterStyle = '';
            if (pet.clean < 30) {
                // 暴走状态：失色清冷，快速闪烁
                filterStyle = 'grayscale(0.6) hue-rotate(-20deg) opacity(0.8)'; 
                speedMult *= 0.6;
            }

            const speed1 = Math.max(0.6, (1.8 - (level / 100) * 0.8) * speedMult);
            const speed2 = Math.max(0.5, (1.4 - (level / 100) * 0.6) * speedMult);
            const speed3 = Math.max(0.4, (1.2 - (level / 100) * 0.5) * speedMult);

            // 内部固定容器，依靠外层 transform 缩放
            html += `<div class="relative flex justify-center items-end transition-all duration-700" style="transform: scale(${scale}); transform-origin: bottom center; filter: ${filterStyle}; opacity: ${opacity}; width: 80px; height: 80px;">`;

            // 【阶段 5】外围双层星环法阵 (Lv >= 80 解锁) - 夸张化
            if (level >= 80) {
                // 外层点状虚线反向旋转
                html += `<div class="absolute border-2 border-dotted rounded-full opacity-60 bottom-0 animate-[spin_8s_linear_infinite_reverse]" style="width: 80px; height: 80px; border-color: ${t.f1};"></div>`;
                // 内层能量缺口正向旋转
                html += `<div class="absolute border-t-4 border-b-4 border-transparent rounded-full opacity-50 bottom-1 animate-[spin_5s_linear_infinite]" style="width: 72px; height: 72px; border-left-color: ${t.f2}; border-right-color: ${t.f2};"></div>`;
            }

            // 【阶段 6】神圣基座与脉冲光晕 (Lv >= 90 解锁) - 满级夸张特效
            if (level >= 90) {
                html += `<div class="absolute rounded-full bottom-[-8px] animate-pulse" style="width: 100px; height: 20px; background: radial-gradient(ellipse, ${t.f1} 0%, transparent 60%); opacity: 0.6; box-shadow: 0 0 40px ${t.glow};"></div>`;
                html += `<div class="absolute rounded-full bottom-2 animate-pulse" style="width: 80px; height: 80px; background: radial-gradient(circle, ${t.glow} 0%, transparent 70%); opacity: 0.8; mix-blend-mode: overlay;"></div>`;
            }

            // 【基础形态】中央主火焰 (全等级存在) 
            html += `<div class="absolute flame-base bottom-3" style="width:40px; height:40px; background-color:${t.f1}; box-shadow: 0 0 20px ${t.glow}; opacity: 0.9; animation: flicker-1 ${speed1}s infinite ease-in-out"></div>`;
            html += `<div class="absolute flame-base bottom-5" style="width:26px; height:26px; background-color:${t.f2}; opacity: 0.95; animation: flicker-2 ${speed2}s infinite ease-in-out"></div>`;
            html += `<div class="absolute flame-base bottom-7" style="width:14px; height:14px; background-color:${t.f3}; animation: flicker-3 ${speed3}s infinite ease-in-out"></div>`;

            // 【阶段 2】左侧伴生副焰 (Lv > 20 解锁) 
            if (level > 20) {
                html += `<div class="absolute flame-base bottom-2" style="width:24px; height:24px; left: 10px; background-color:${t.f1}; opacity: 0.8; animation: flicker-2 ${speed1 * 1.1}s infinite ease-in-out alternate-reverse"></div>`;
                html += `<div class="absolute flame-base bottom-4" style="width:14px; height:14px; left: 16px; background-color:${t.f2}; opacity: 0.9; animation: flicker-3 ${speed2 * 1.2}s infinite ease-in-out"></div>`;
            }

            // 【阶段 3】右侧伴生副焰，形成莲花簇 (Lv > 40 解锁)
            if (level > 40) {
                html += `<div class="absolute flame-base bottom-2" style="width:24px; height:24px; right: 10px; background-color:${t.f1}; opacity: 0.8; animation: flicker-3 ${speed1 * 1.3}s infinite ease-in-out alternate"></div>`;
                html += `<div class="absolute flame-base bottom-4" style="width:14px; height:14px; right: 16px; background-color:${t.f2}; opacity: 0.9; animation: flicker-1 ${speed2 * 1.1}s infinite ease-in-out"></div>`;
            }

            // 【阶段 4】内部双层异向星核晶体 (Lv > 60 解锁)
            if (level > 60) {
                html += `<div class="absolute bottom-8 w-4 h-4 bg-white opacity-80 rounded-sm animate-[spin_4s_linear_infinite]" style="box-shadow: 0 0 10px white; animation-duration: ${speed3}s;"></div>`;
                html += `<div class="absolute bottom-8 w-4 h-4 bg-${t.f2} opacity-70 rounded-sm rotate-45 animate-[spin_5s_linear_infinite_reverse]" style="animation-duration: ${speed2}s;"></div>`;
            }

            // 动态火星 (火星变大、数量增多、扩散更广)
            const numSparks = level >= 10 ? Math.floor((level / 6) * sparksMult) : 0;
            for(let i = 0; i < numSparks; i++) {
                const spread = 20 + (level / 100) * 15; 
                const offsetX = (Math.random() * spread * 2) - spread; 
                const offsetY = 25 + (Math.random() * 30); 
                const delay = Math.random() * 2;
                const dur = 1.0 + Math.random() * 1.5;
                const sparkColor = (i % 2 === 0) ? t.f2 : t.f3;
                const sparkSize = 2 + Math.random() * 3; // 2~5px 的更明显火星
                html += `<div class="sparkle absolute rounded-full opacity-80" style="width: ${sparkSize}px; height: ${sparkSize}px; background-color: ${sparkColor}; left: calc(50% + ${offsetX}px); bottom: ${offsetY}px; animation-delay: ${delay}s; animation-duration: ${dur}s; box-shadow: 0 0 ${sparkSize}px ${sparkColor};"></div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function getActionName(type) {
            if (type === 'feed') return '喂柴火';
            if (type === 'fan') return '吹扇子';
            if (type === 'water') return '降降温';
            if (type === 'sing') return '唱首歌';
            return type;
        }

        // 更新按钮上的剩余次数，以及当次数用尽时置灰按钮
        function updateActionCounts() {
            const todayStart = new Date().setHours(0, 0, 0, 0);
            const actions = ['feed', 'fan', 'water', 'sing'];
            
            actions.forEach(act => {
                const used = myActData.filter(log => log.action === act && log.time >= todayStart).length;
                const remain = Math.max(0, maxActionsPerDay - used);
                const countEl = document.getElementById(`count_${act}`);
                const btnEl = document.getElementById(`btn_${act}`);
                
                if (countEl) {
                    countEl.innerText = `剩余: ${remain}/${maxActionsPerDay}`;
                    if (remain === 0) {
                        countEl.classList.replace('text-gray-400', 'text-red-400');
                        btnEl.classList.add('opacity-60', 'grayscale');
                        btnEl.classList.remove('hover:shadow-md', 'hover:-translate-y-1');
                    } else {
                        countEl.classList.replace('text-red-400', 'text-gray-400');
                        btnEl.classList.remove('opacity-60', 'grayscale');
                        btnEl.classList.add('hover:shadow-md', 'hover:-translate-y-1');
                    }
                }
            });
        }

        function renderPetUI() {
            if (!petData) return;
            
            document.getElementById('displayPetName').innerText = petData.name;
            
            renderPetVisual(petData);
            
            const tierIdx = Math.min(9, Math.floor((petData.level - 1) / 10));
            const glowColors = ['bg-yellow-100', 'bg-orange-100', 'bg-red-100', 'bg-pink-100', 'bg-purple-100', 'bg-indigo-100', 'bg-blue-100', 'bg-teal-100', 'bg-green-100', 'bg-gray-100'];
            
            // 光晕大小翻倍扩张 (基础 12rem, 最高 24rem)，匹配翻倍的火苗
            let glowSize = 12 + (petData.level / 100) * 12; 
            if (petData.hunger < 30) glowSize *= 0.8; 
            else if (petData.hunger >= 80) glowSize *= 1.1; 
            
            const glowEl = document.getElementById('glowEffect');
            glowEl.style.width = `${glowSize}rem`;
            glowEl.style.height = `${glowSize}rem`;
            glowEl.style.filter = petData.clean < 30 ? 'blur(25px) grayscale(0.5)' : 'blur(25px)';
            glowEl.className = `absolute ${glowColors[tierIdx]} rounded-full mix-blend-multiply opacity-40 animate-pulse transition-all duration-1000`;

            document.getElementById('displayPetLevel').innerText = petData.level;
            document.getElementById('displayPetExp').innerText = petData.level >= 100 ? "MAX" : Math.floor(petData.exp);
            document.getElementById('displayMaxExp').innerText = petData.level >= 100 ? "MAX" : getMaxExp(petData.level);
            
            // 状态描述随等级进化而改变
            let statusText = "燃烧中";
            if (petData.hunger < 30) statusText = "快要熄灭";
            else if (petData.clean < 30) statusText = "火势失控";
            else if (petData.mood < 30) statusText = "火光黯淡";
            else if (petData.level >= 100) statusText = "永恒星核";
            else if (petData.level >= 80) statusText = "太阳耀斑";
            else if (petData.level >= 60) statusText = "元素幽炎";
            else if (petData.level >= 40) statusText = "通灵魔火";
            else if (petData.level >= 20) statusText = "狂暴烈焰";
            else if (petData.level >= 10) statusText = "熊熊燃烧";
            document.getElementById('displayPetStatus').innerText = statusText;

            // 更新进度条颜色和宽度
            updateBar('Hunger', petData.hunger, 'bg-orange-500');
            updateBar('Mood', petData.mood, 'bg-rose-400');
            updateBar('Clean', petData.clean, 'bg-sky-400');
        }

        function updateBar(idPrefix, value, colorClass) {
            const bar = document.getElementById(`bar${idPrefix}`);
            const valTxt = document.getElementById(`val${idPrefix}`);
            
            valTxt.innerText = `${Math.floor(value)}/100`;
            bar.style.width = `${value}%`;
            
            // 移除旧颜色
            bar.className = `h-2.5 rounded-full progress-bar ${colorClass}`;
            if (value < 30) {
                bar.classList.add('bg-red-500');
                bar.classList.remove(colorClass);
            }
        }

        function renderLogs() {
            const container = document.getElementById('logContainer');
            const empty = document.getElementById('emptyLog');
            
            // 合并并按时间倒序排序
            const allLogs = [...myActData, ...partnerActData].sort((a, b) => b.time - a.time);
            
            container.innerHTML = '';
            
            if (allLogs.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                
                allLogs.slice(0, 20).forEach(log => {
                    const date = new Date(log.time);
                    const timeStr = `${date.getMonth()+1}-${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                    
                    const isMe = log.user === myIdentity;
                    const nameColor = isMe ? 'text-rose-500' : 'text-blue-500';
                    
                    // 匹配新的操作图标
                    let actionIcon = '✨';
                    if (log.action === 'feed') actionIcon = '🪵';
                    else if (log.action === 'fan') actionIcon = '💨';
                    else if (log.action === 'water') actionIcon = '💧';
                    else if (log.action === 'sing') actionIcon = '🎵';
                    else if (log.action === 'adopt') actionIcon = '🔥';

                    const item = document.createElement('div');
                    item.className = "flex items-start gap-3 bg-gray-50 p-2 rounded-xl text-sm animate-fade-in";
                    item.innerHTML = `
                        <div class="text-xl pt-0.5">${actionIcon}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <span class="font-bold ${nameColor}">${log.user}</span>
                                <span class="text-xs text-gray-400">${timeStr}</span>
                            </div>
                            <p class="text-gray-600">${log.desc}</p>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
        }

        function showInteractionText(text) {
            const el = document.getElementById('interactionText');
            el.innerText = text;
            el.style.opacity = '1';
            el.style.transform = 'translateY(-30px)';
            el.style.transition = 'all 0.5s ease';
            
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(0)';
            }, 1000);
        }

        function petInteraction() {
            const petEl = document.getElementById('petVisualizer');
            petEl.style.transform = 'scale(1.2) translateY(-15px)';
            setTimeout(() => {
                petEl.style.transform = '';
            }, 300);
            
            const words = ["噼啪噼啪~", "呼呼...", "好温暖！", "燃烧吧！", "亮晶晶✨", "充满能量！"];
            showInteractionText(words[Math.floor(Math.random() * words.length)]);
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

    </script>
</body>
</html>
