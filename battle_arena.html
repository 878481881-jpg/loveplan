<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>全息宠物战斗系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #0f172a; 
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.8) 1px, transparent 1px);
            background-size: 30px 30px;
            overscroll-behavior-y: none;
            touch-action: pan-x pan-y;
            color: #e2e8f0;
        }
        
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 255, 255, 0.1) 50%, rgba(0, 255, 255, 0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.3;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 状态条过渡与护盾特效 */
        .hp-bar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease; }
        
        .shield-bar { 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), left 0.3s cubic-bezier(0.4, 0, 0.2, 1), right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), inset 0 0 5px rgba(0,0,0,0.2);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(148, 163, 184, 0.4) 4px, rgba(148, 163, 184, 0.4) 8px);
            border-radius: inherit;
        }

        .ep-bar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 基础悬浮动画 */
        @keyframes mech-hover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .anim-mech { animation: mech-hover 4s ease-in-out infinite; }
        .anim-mech-enemy { animation: mech-hover 4.5s ease-in-out infinite; animation-delay: -2s; }

        /* 伤害数字漂浮 */
        @keyframes float-damage {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            15% { opacity: 1; transform: translateY(-20px) scale(1.5); }
            30% { transform: translateY(-30px) scale(1.2); }
            80% { opacity: 1; transform: translateY(-50px) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
        }
        .damage-text {
            position: absolute;
            animation: float-damage 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            font-weight: 900;
            text-shadow: 0 0 5px black, 0 0 10px black;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

        /* 1. 能量爪击 */
        @keyframes attack-claw-right {
            0% { transform: translateX(0) scale(1); filter: brightness(1); }
            15% { transform: translateX(-15px) scale(0.95); filter: brightness(1.2); }
            30% { transform: translateX(90px) scale(1.1) skewX(-10deg); filter: brightness(2) drop-shadow(0 0 15px cyan); z-index: 20; }
            70% { transform: translateX(50px) scale(1) skewX(0); }
            100% { transform: translateX(0) scale(1); filter: brightness(1); }
        }
        .anim-attack-right { animation: attack-claw-right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes attack-claw-left {
            0% { transform: translateX(0) scale(1); filter: brightness(1); }
            15% { transform: translateX(15px) scale(0.95); filter: brightness(1.2); }
            30% { transform: translateX(-90px) scale(1.1) skewX(10deg); filter: brightness(2) drop-shadow(0 0 15px red); z-index: 20; }
            70% { transform: translateX(-50px) scale(1) skewX(0); }
            100% { transform: translateX(0) scale(1); filter: brightness(1); }
        }
        .anim-attack-left { animation: attack-claw-left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* 2. 暴力强击 */
        @keyframes strike-heavy-right {
            0% { transform: translateX(0) scale(1); filter: brightness(1); }
            40% { transform: translateX(-30px) scale(0.9) rotate(-5deg); filter: brightness(0.8) sepia(0.5); }
            50% { transform: translateX(100px) scale(1.2) rotate(10deg); filter: brightness(2.5) drop-shadow(0 0 30px orange); z-index: 20; }
            80% { transform: translateX(20px) scale(1.05); }
            100% { transform: translateX(0) scale(1); }
        }
        .anim-strike-right { animation: strike-heavy-right 0.8s cubic-bezier(0.5, -0.5, 0.1, 1.5); }

        @keyframes strike-heavy-left {
            0% { transform: translateX(0) scale(1); filter: brightness(1); }
            40% { transform: translateX(30px) scale(0.9) rotate(5deg); filter: brightness(0.8) sepia(0.5); }
            50% { transform: translateX(-100px) scale(1.2) rotate(-10deg); filter: brightness(2.5) drop-shadow(0 0 30px orange); z-index: 20; }
            80% { transform: translateX(-20px) scale(1.05); }
            100% { transform: translateX(0) scale(1); }
        }
        .anim-strike-left { animation: strike-heavy-left 0.8s cubic-bezier(0.5, -0.5, 0.1, 1.5); }

        /* 受击动画分类 */
        @keyframes hit-light {
            0%, 100% { transform: translateX(0); filter: invert(0); }
            25% { transform: translateX(-8px) rotate(-3deg); filter: invert(0.5) sepia(1) hue-rotate(-50deg); }
            50% { transform: translateX(8px) rotate(3deg); }
            75% { transform: translateX(-5px); }
        }
        .anim-hit-light { animation: hit-light 0.3s ease-out; }

        @keyframes hit-heavy {
            0%, 100% { transform: translateX(0) scale(1); filter: invert(0); }
            15% { transform: translateX(-15px) scale(0.9) skewX(-10deg); filter: invert(0.8) sepia(1) hue-rotate(-50deg) saturate(10); }
            30% { transform: translateX(15px) scale(1.1) skewX(10deg); }
            45% { transform: translateX(-10px) scale(0.95); }
            60% { transform: translateX(10px) scale(1.05); }
            80% { transform: translateX(-5px) scale(1); }
        }
        .anim-hit-heavy { animation: hit-heavy 0.5s ease-out; }

        /* 3. 巨型旋风 */
        @keyframes tornado-spin {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.1) rotate(180deg) translateY(-10px); filter: hue-rotate(90deg) blur(2px); }
            50% { transform: scale(1.3) rotate(360deg) translateY(-20px); filter: hue-rotate(180deg) blur(4px) drop-shadow(0 0 20px purple); z-index: 20; }
            80% { transform: scale(1.1) rotate(540deg) translateY(-10px); filter: hue-rotate(90deg) blur(1px); }
            100% { transform: scale(1) rotate(720deg); }
        }
        .anim-tornado { animation: tornado-spin 0.8s ease-in-out; }

        /* 4. 治愈护盾 & 增益基础 */
        @keyframes buff-powerup {
            0% { filter: drop-shadow(0 0 0px #60a5fa); transform: translateY(0) scale(1); }
            30% { filter: drop-shadow(0 0 40px #60a5fa) brightness(1.8); transform: translateY(-15px) scale(1.1); }
            100% { filter: drop-shadow(0 0 10px #60a5fa); transform: translateY(0) scale(1); }
        }
        .anim-buff { animation: buff-powerup 0.8s ease-out; z-index: 30; }

        /* 5. 火力全开 */
        @keyframes aura-pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5)) brightness(1); }
            50% { filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.9)) brightness(1.3) contrast(1.1); }
        }
        .aura-burst { animation: aura-pulse 2s infinite ease-in-out; }

        /* 6. 天穹爆炎 */
        .anim-ult-bg {
            background-color: #000 !important;
            background-image: none !important;
            transition: background-color 0.1s;
        }

        @keyframes explode-burst {
            0% { filter: brightness(1) drop-shadow(0 0 0 red); transform: scale(1); }
            10% { filter: brightness(3) sepia(1) hue-rotate(-50deg) saturate(10) drop-shadow(0 0 50px red); transform: scale(1.3) rotate(5deg); }
            30% { transform: scale(0.8) rotate(-5deg); filter: brightness(2); }
            100% { filter: brightness(1) drop-shadow(0 0 0 red); transform: scale(1); }
        }
        .anim-explode { animation: explode-burst 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 30; }

        @keyframes instakill-shake {
            0%, 100% { transform: translate(0, 0) scale(1); filter: invert(0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-20px, 20px) scale(0.8) skewX(15deg); filter: invert(1) drop-shadow(0 0 80px red); }
            20%, 40%, 60%, 80% { transform: translate(20px, -20px) scale(1.3) skewX(-15deg); filter: invert(0) blur(2px); }
        }
        .anim-instakill { animation: instakill-shake 1.2s cubic-bezier(.36,.07,.19,.97) both; }

        /* 全屏核爆闪光 */
        @keyframes screen-flash {
            0% { background: transparent; }
            10% { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
            30% { background: rgba(255, 50, 50, 0.5); }
            100% { background: transparent; }
        }
        .flash-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
            animation: screen-flash 1s ease-out forwards;
        }

        /* 能量护体：六边形能量场 */
        .energy-body-active::after {
            content: '';
            position: absolute;
            inset: -20%;
            border: 3px solid #2dd4bf;
            border-radius: 40%;
            border-style: dashed;
            animation: spin 3s linear infinite;
            filter: drop-shadow(0 0 10px #2dd4bf);
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 50;
        }

    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col pb-[env(safe-area-inset-bottom)]">
    <div class="scanline"></div>

    <!-- 头部 -->
    <header class="flex-none w-full flex justify-between items-center z-20 px-4 py-3 h-14">
        <a href="pet.html" class="w-8 h-8 flex items-center justify-center bg-slate-800 text-cyan-400 rounded-full shadow-lg border border-cyan-800 hover:bg-slate-700 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-cyan-400 font-black text-base md:text-lg tracking-widest drop-shadow-[0_0_8px_rgba(34,211,238,0.5)] flex items-center gap-2">
            <span>⚡</span> 虚拟竞技场 <span>⚡</span>
        </h1>
        <div class="w-8 h-8"></div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 min-h-0 w-full relative flex flex-col">
        
        <!-- 关卡选择界面 -->
        <div id="levelSelectMenu" class="absolute inset-0 z-10 flex flex-col items-center justify-center px-4">
            <h2 class="text-cyan-400 font-bold text-lg md:text-xl mb-4 drop-shadow-[0_0_5px_cyan] flex items-center gap-2"><span>🎯</span> 选择挑战目标</h2>
            <div class="glass-panel p-3 md:p-4 rounded-2xl w-full max-w-md border border-slate-600 shadow-lg flex flex-col max-h-[70%]">
                <div id="levelGrid" class="grid grid-cols-4 gap-2 md:gap-3 overflow-y-auto no-scrollbar p-1 flex-1">
                    <!-- 动态填充 -->
                </div>
            </div>
        </div>

        <!-- 战斗主区域 -->
        <div id="battleArena" class="absolute inset-0 flex flex-col items-center hidden pb-2 px-2 md:px-4">
            
            <!-- 顶部状态栏 -->
            <div class="flex-none w-full max-w-lg flex justify-between items-start gap-2 z-10 mt-2">
                
                <!-- 玩家状态 -->
                <div class="flex-1 glass-panel rounded-xl p-2 md:p-3 shadow-lg border-l-4 border-l-cyan-400 transform -skew-x-3">
                    <div class="flex justify-between items-end mb-1 transform skew-x-3">
                        <span class="font-bold text-cyan-400 text-sm md:text-base drop-shadow-[0_0_5px_rgba(34,211,238,0.8)] truncate max-w-[60%]" id="playerName">我的儿子</span>
                        <span class="text-[10px] md:text-xs text-slate-400 font-bold bg-slate-800 px-1.5 py-0.5 rounded" id="playerLevel">Lv.1</span>
                    </div>
                    
                    <!-- 优化后的护盾与HP层叠结构 -->
                    <div class="w-full bg-slate-900 rounded-full h-2 md:h-3 border border-slate-700 overflow-hidden transform skew-x-3 relative">
                        <div id="playerHpBar" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 hp-bar absolute left-0 top-0 z-10" style="width: 100%;"></div>
                        <div id="playerShieldBar" class="h-full shield-bar absolute top-0 z-20" style="left: 100%; width: 0%;"></div>
                        <div id="playerShieldEffect" class="absolute inset-0 bg-cyan-300 opacity-0 transition-opacity duration-300 pointer-events-none z-30" style="mix-blend-mode: overlay;"></div>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-1 md:h-1.5 border border-slate-700 overflow-hidden transform skew-x-3 relative mt-1">
                        <div id="playerEpBar" class="h-full bg-gradient-to-r from-amber-400 to-yellow-500 ep-bar absolute left-0 top-0" style="width: 100%;"></div>
                    </div>
                    <div class="flex justify-between text-[9px] md:text-[10px] mt-1 font-mono text-slate-300 transform skew-x-3">
                        <span id="playerHpText">-- / --</span>
                        <span class="text-amber-400 font-bold">EP: <span id="playerEpText">--</span>/<span id="playerMaxEpText">100</span></span>
                    </div>
                </div>

                <div class="font-black text-xl md:text-2xl text-slate-500 self-center italic px-1 drop-shadow-md">VS</div>

                <!-- 敌人状态 -->
                <div class="flex-1 glass-panel rounded-xl p-2 md:p-3 shadow-lg border-r-4 border-r-rose-500 transform skew-x-3">
                    <div class="flex justify-between items-end mb-1 transform -skew-x-3">
                        <span class="text-[10px] md:text-xs text-slate-400 font-bold bg-slate-800 px-1.5 py-0.5 rounded" id="enemyLevel">Lv.--</span>
                        <span class="font-bold text-rose-500 text-sm md:text-base drop-shadow-[0_0_5px_rgba(244,63,94,0.8)] truncate max-w-[60%] text-right" id="enemyName">狂化实体</span>
                    </div>
                    
                    <!-- 敌方血条与护盾白条 -->
                    <div class="w-full bg-slate-900 rounded-full h-2 md:h-3 border border-slate-700 overflow-hidden transform -skew-x-3 relative flex justify-end">
                        <div id="enemyHpBar" class="h-full bg-gradient-to-l from-rose-500 to-orange-500 hp-bar absolute right-0 top-0 z-10" style="width: 100%;"></div>
                        <div id="enemyShieldBar" class="h-full shield-bar absolute top-0 z-20" style="right: 100%; width: 0%;"></div>
                        <div id="enemyShieldEffect" class="absolute inset-0 bg-rose-300 opacity-0 transition-opacity duration-300 pointer-events-none z-30" style="mix-blend-mode: overlay;"></div>
                    </div>
                    
                    <div class="w-full bg-slate-900 rounded-full h-1 md:h-1.5 border border-slate-700 overflow-hidden transform -skew-x-3 relative flex justify-end mt-1">
                        <div id="enemyEpBar" class="h-full bg-gradient-to-l from-amber-400 to-yellow-500 ep-bar absolute right-0 top-0" style="width: 100%;"></div>
                    </div>
                    
                    <div class="flex justify-between text-[9px] md:text-[10px] mt-1 font-mono text-slate-300 transform -skew-x-3 flex-row-reverse">
                        <span id="enemyHpText">-- / --</span>
                        <span class="text-amber-400 font-bold">EP: <span id="enemyEpText">--</span>/<span id="enemyMaxEpText">100</span></span>
                    </div>
                </div>
            </div>

            <!-- 中间战斗舞台: 加入 min-h-0 防止挤爆容器，取消 aspect-square，改为自适应高度 -->
            <div class="flex-1 min-h-0 w-full max-w-md relative flex items-center justify-between px-1 md:px-2 overflow-visible mt-2 mb-2">
                <!-- 玩家宠物 -->
                <div id="playerContainer" class="relative z-10 w-[45%] h-[90%] flex items-center justify-center anim-mech">
                    <div class="absolute bottom-0 w-[80%] h-[20%] bg-cyan-500 rounded-full mix-blend-screen opacity-30 filter blur-md"></div>
                    <div id="playerShieldVisual" class="absolute w-[110%] h-[110%] rounded-full border-2 border-cyan-400 bg-cyan-900/30 opacity-0 transition-all duration-300 shadow-[0_0_20px_cyan_inset]" style="pointer-events: none; transform: scale(0.8);"></div>
                    <div id="playerVisualizer" class="w-full h-full flex items-center justify-center relative"></div>
                    <div id="playerSummonVis" class="absolute left-[-20%] top-[10%] w-[40%] h-[40%] opacity-0 transition-opacity duration-500 pointer-events-none z-20"></div>
                </div>

                <!-- 敌人宠物 -->
                <div id="enemyContainer" class="relative z-10 w-[45%] h-[90%] flex items-center justify-center anim-mech-enemy">
                    <div class="absolute bottom-0 w-[80%] h-[20%] bg-rose-500 rounded-full mix-blend-screen opacity-30 filter blur-md"></div>
                    <div id="enemyShieldVisual" class="absolute w-[110%] h-[110%] rounded-full border-2 border-rose-400 bg-rose-900/30 opacity-0 transition-all duration-300 shadow-[0_0_20px_red_inset]" style="pointer-events: none; transform: scale(0.8);"></div>
                    <div id="enemyVisualizer" class="w-full h-full flex items-center justify-center relative" style="transform: scaleX(-1);"></div>
                    <div id="enemySummonVis" class="absolute right-[-20%] top-[10%] w-[40%] h-[40%] opacity-0 transition-opacity duration-500 pointer-events-none z-20"></div>
                </div>
            </div>
            
            <!-- 底部操作与日志区 -->
            <div class="flex-none w-full max-w-md z-10 flex flex-col gap-2">
                <!-- 战斗日志 -->
                <div class="glass-panel h-16 md:h-20 rounded-xl p-2 overflow-y-auto no-scrollbar text-[10px] md:text-xs font-mono flex flex-col-reverse shadow-inner border border-slate-700/50" id="battleLog">
                    <div class="text-slate-400 text-center py-2">等待信号接入...</div>
                </div>

                <!-- 技能面板 (扩充为 4列×2行) -->
                <div class="grid grid-cols-4 gap-1.5 md:gap-2" id="controlPanel">
                    <button onclick="useSkill('attack')" id="btn_attack" class="skill-btn relative flex flex-col items-center justify-center py-1 md:py-2 bg-slate-800 rounded-xl border border-slate-600 shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:grayscale">
                        <span class="text-base md:text-xl mb-0.5 drop-shadow-md">⚔️</span>
                        <span class="text-[7px] md:text-[9px] font-bold text-slate-200">能量爪击</span>
                        <div class="absolute bottom-0.5 right-1 text-[6px] md:text-[8px] text-cyan-400 font-mono">0EP</div>
                        <div id="lock_attack" class="absolute inset-0 bg-black/70 flex items-center justify-center text-[9px] md:text-[10px] font-bold text-red-500 hidden z-10 rounded-xl backdrop-blur-[1px]">Lv.1</div>
                    </button>

                    <button onclick="useSkill('strike')" id="btn_strike" class="skill-btn relative flex flex-col items-center justify-center py-1 md:py-2 bg-slate-800 rounded-xl border border-orange-900/50 shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:grayscale overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-t from-orange-900/20 to-transparent pointer-events-none"></div>
                        <span class="text-base md:text-xl mb-0.5 drop-shadow-md">🥊</span>
                        <span class="text-[7px] md:text-[9px] font-bold text-orange-400">暴力强击</span>
                        <div class="absolute bottom-0.5 right-1 text-[6px] md:text-[8px] text-amber-300 font-mono">30EP</div>
                        <div id="lock_strike" class="absolute inset-0 bg-black/80 flex items-center justify-center text-[9px] md:text-[10px] font-bold text-red-500 hidden z-10 rounded-xl backdrop-blur-[1px]">Lv.5</div>
                    </button>

                    <button onclick="useSkill('shield')" id="btn_shield" class="skill-btn relative flex flex-col items-center justify-center py-1 md:py-2 bg-slate-800 rounded-xl border border-blue-900/50 shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:grayscale overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-t from-blue-900/20 to-transparent pointer-events-none"></div>
                        <span class="text-base md:text-xl mb-0.5 drop-shadow-md">🛡️</span>
                        <span class="text-[7px] md:text-[9px] font-bold text-blue-400">治愈护盾</span>
                        <div class="absolute bottom-0.5 right-1 text-[6px] md:text-[8px] text-blue-200 font-mono">40EP</div>
                        <div id="lock_shield" class="absolute inset-0 bg-black/80 flex items-center justify-center text-[9px] md:text-[10px] font-bold text-red-500 hidden z-10 rounded-xl backdrop-blur-[1px]">Lv.10</div>
                    </button>

                    <button onclick="useSkill('tornado')" id="btn_tornado" class="skill-btn relative flex flex-col items-center justify-center py-1 md:py-2 bg-slate-800 rounded-xl border border-purple-900/50 shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:grayscale overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-t from-purple-900/20 to-transparent pointer-events-none"></div>
                        <span class="text-base md:text-xl mb-0.5 drop-shadow-md">🌪️</span>
                        <span class="text-[7px] md:text-[9px] font-bold text-purple-400">巨型旋风</span>
                        <div class="absolute bottom-0.5 right-1 text-[6px] md:text-[8px] text-purple-300 font-mono">50EP</div>
                        <div id="lock_tornado" class="absolute inset-0 bg-black/80 flex items-center justify-center text-[9px] md:text-[10px] font-bold text-red-500 hidden z-10 rounded-xl backdrop-blur-[1px]">Lv.20</div>
                    </button>
                    
                    <!-- 新增技能：能量护体 -->

    <!-- 全局特效层 -->
    <div id="globalFxLayer"></div>

    <script>
        // ==========================================
        // 0. API 与 宠物神性形态算法
        // ==========================================
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_PET = 'data/cw.json'; 

        let globalPetData = null;
        let globalPetSha = null;

        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${new Date().getTime()}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (!response.ok) return { error: true };
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                let parsedData = null;
                try { parsedData = JSON.parse(contentStr); } catch(e) { }
                return { data: parsedData, sha: result.sha };
            } catch (error) { return { error: true }; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update ${filePath} from Battle Arena`, content: encodedContent };
                if (sha) body.sha = sha;
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false };
                const result = await response.json(); return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false }; }
        }

        function getMaxExp(level) { return level >= 200 ? 999999 : Math.floor(100 + (level - 1) * 8); }
        function addExpAndLevelUp(amount) {
            if (!globalPetData) return;
            globalPetData.exp = (globalPetData.exp || 0) + amount;
            let currentMaxExp = getMaxExp(globalPetData.level);
            while (globalPetData.exp >= currentMaxExp && globalPetData.level < 200) {
                globalPetData.exp -= currentMaxExp; globalPetData.level += 1; currentMaxExp = getMaxExp(globalPetData.level);
            }
            if (globalPetData.level >= 200) { globalPetData.level = 200; globalPetData.exp = currentMaxExp; }
        }

        function lerp(start, end, t) { return start + (end - start) * t; }
        function lerpArray(arr1, arr2, t) { return arr1.map((val, i) => lerp(val, arr2[i], t)); }

        const basePoses = [
            /* 0: Lv 1 */ { level: 1, head: [70,75, 130,75, 150,105, 125,135, 75,135, 50,105], earL: [60,75, 20,90, 30,125, 65,100], earR: [140,75, 180,90, 170,125, 135,100], visor: [70,85, 130,85, 140,100, 125,110, 75,110, 60,100], core: [100,150, 110,160, 100,170, 90,160], eyeSize: 6, wingScale: 0, fangLength: 0, armorOpacity: 0, crownScale: 0 },
            /* 1: Lv 20 */ { level: 20, head: [70,60, 130,60, 145,95, 110,135, 90,135, 55,95], earL: [65,65, 30,25, 35,50, 50,85], earR: [135,65, 170,25, 165,50, 150,85], visor: [70,88, 130,88, 140,95, 100,105, 100,105, 60,95], core: [100,140, 115,155, 100,170, 85,155], eyeSize: 0, wingScale: 0, fangLength: 0, armorOpacity: 0, crownScale: 0 },
            /* 2: Lv 60 */ { level: 60, head: [60,50, 140,50, 160,95, 125,150, 75,150, 40,95], earL: [65,55, 15,15, 20,40, 45,90], earR: [135,55, 185,15, 180,40, 155,90], visor: [45,80, 155,80, 145,95, 100,115, 100,115, 55,95], core: [100,145, 120,165, 100,185, 80,165], eyeSize: 0, wingScale: 0.8, fangLength: 0.8, armorOpacity: 0.8, crownScale: 0 },
            /* 3: Lv 100 */ { level: 100, head: [55,45, 145,45, 165,100, 130,160, 70,160, 35,100], earL: [60,50, 10,10, 15,35, 40,95], earR: [140,50, 190,10, 185,35, 160,95], visor: [35,75, 165,75, 150,95, 100,125, 100,125, 50,95], core: [100,140, 125,165, 100,190, 75,165], eyeSize: 0, wingScale: 1.2, fangLength: 1.2, armorOpacity: 1, crownScale: 1 },
            /* 4: Lv 150 */ { level: 150, head: [45,35, 155,35, 175,90, 135,165, 65,165, 25,90], earL: [50,40, -10,0, -5,25, 30,85], earR: [150,40, 210,0, 205,25, 170,85], visor: [20,70, 180,70, 160,95, 100,135, 100,135, 40,95], core: [100,135, 135,165, 100,200, 65,165], eyeSize: 0, wingScale: 2.0, fangLength: 2.0, armorOpacity: 1, crownScale: 2.5 },
            /* 5: Lv 200 */ { level: 200, head: [30,20, 170,20, 190,80, 140,175, 60,175, 10,80], earL: [40,25, -30,-20, -20,15, 20,75], earR: [160,25, 230,-20, 220,15, 180,75], visor: [5,60, 195,60, 170,100, 100,150, 100,150, 30,100], core: [100,125, 150,165, 100,220, 50,165], eyeSize: 0, wingScale: 3.5, fangLength: 3.2, armorOpacity: 1, crownScale: 5 }
        ];

        function getInterpolatedPet(level) {
            let t = 0; let p1, p2;
            if (level < 20) { p1 = basePoses[0]; p2 = basePoses[1]; t = (level - 1) / 19; } 
            else if (level < 60) { p1 = basePoses[1]; p2 = basePoses[2]; t = (level - 20) / 40; } 
            else if (level < 100) { p1 = basePoses[2]; p2 = basePoses[3]; t = (level - 60) / 40; }
            else if (level < 150) { p1 = basePoses[3]; p2 = basePoses[4]; t = (level - 100) / 50; }
            else if (level <= 200) { p1 = basePoses[4]; p2 = basePoses[5]; t = (level - 150) / 50; }
            else { p1 = basePoses[5]; p2 = basePoses[5]; t = 1; }
            t = t * t * (3 - 2 * t);
            return {
                head: lerpArray(p1.head, p2.head, t).join(','), earL: lerpArray(p1.earL, p2.earL, t).join(','), earR: lerpArray(p1.earR, p2.earR, t).join(','), visor: lerpArray(p1.visor, p2.visor, t).join(','), core: lerpArray(p1.core, p2.core, t).join(','), eyeSize: lerp(p1.eyeSize, p2.eyeSize, t), wingScale: lerp(p1.wingScale, p2.wingScale, t), fangLength: lerp(p1.fangLength, p2.fangLength, t), armorOpacity: lerp(p1.armorOpacity, p2.armorOpacity, t), crownScale: Math.max(0, lerp(p1.crownScale, p2.crownScale, t))
            };
        }

        function renderEntityVisual(containerId, level, theme = 'cyan', equipped = []) {
            const container = document.getElementById(containerId);
            const props = getInterpolatedPet(level);
            
            let cMain, cStroke, cVisor, cGlow;
            if (theme === 'cyan') {
                let baseHue = (190 + level * 5) % 360;
                cMain = `hsla(${baseHue}, 80%, 50%, 0.15)`; cStroke = `hsl(${baseHue}, 100%, 60%)`; cVisor = `hsl(${(baseHue + 330) % 360}, 100%, 70%)`; cGlow = `hsla(${baseHue}, 100%, 60%, 0.6)`;
                if (level >= 200) { cMain = `hsla(45, 100%, 90%, 0.25)`; cStroke = `#ffffff`; cVisor = `#fde047`; cGlow = `hsla(45, 100%, 70%, 1)`; }
                else if (level >= 150) { cMain = `hsla(280, 100%, 40%, 0.25)`; cStroke = `#f43f5e`; cVisor = `#c084fc`; cGlow = `hsla(340, 100%, 60%, 0.9)`; }
                else if (level >= 100) { cMain = `hsla(190, 100%, 40%, 0.2)`; cStroke = `#2dd4bf`; cVisor = `#60a5fa`; cGlow = `hsla(200, 100%, 60%, 0.8)`; }
            } else {
                let baseHue = 340 + Math.random()*20;
                cMain = `hsla(${baseHue}, 90%, 40%, 0.15)`; cStroke = `hsl(${baseHue}, 100%, 50%)`; cVisor = `hsl(${(baseHue + 30) % 360}, 100%, 70%)`; cGlow = `hsla(${baseHue}, 100%, 60%, 0.6)`;
                if (level >= 200) { cMain = `hsla(0, 100%, 20%, 0.4)`; cStroke = `#ff0000`; cVisor = `#ffaaaa`; cGlow = `hsla(0, 100%, 50%, 1)`; } 
                else if (level >= 150) { cMain = `hsla(260, 100%, 20%, 0.4)`; cStroke = `#9333ea`; cVisor = `#f87171`; cGlow = `hsla(280, 100%, 50%, 0.9)`; } 
                else if (level >= 100) { cMain = `hsla(320, 100%, 30%, 0.3)`; cStroke = `#e11d48`; cVisor = `#fbbf24`; cGlow = `hsla(340, 100%, 50%, 0.8)`; } 
            }

            let innerSVG = `
            <defs>
                <linearGradient id="laserGradL-${containerId}" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="var(--c-stroke)" stop-opacity="1" /><stop offset="100%" stop-color="var(--c-stroke)" stop-opacity="0" /></linearGradient>
                <linearGradient id="laserGradR-${containerId}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--c-stroke)" stop-opacity="1" /><stop offset="100%" stop-color="var(--c-stroke)" stop-opacity="0" /></linearGradient>
                <linearGradient id="mechGradient-${containerId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a" /><stop offset="100%" stop-color="#1e293b" /></linearGradient>
            </defs>`;

            if (props.wingScale > 0.01) {
                innerSVG += `<g opacity="0.7" stroke="var(--c-visor)" stroke-width="2" fill="none" stroke-linejoin="round" filter="drop-shadow(0 0 8px var(--c-visor))">
                        <polygon points="100,100 ${100 - 50*props.wingScale},${100 - 50*props.wingScale} ${100 - 80*props.wingScale},${100 - 15*props.wingScale}"/>
                        <polygon points="100,100 ${100 + 50*props.wingScale},${100 - 50*props.wingScale} ${100 + 80*props.wingScale},${100 - 15*props.wingScale}"/>
                        <polygon points="100,100 ${100 - 60*props.wingScale},${100 + 10*props.wingScale} ${100 - 75*props.wingScale},${100 + 35*props.wingScale}"/>
                        <polygon points="100,100 ${100 + 60*props.wingScale},${100 + 10*props.wingScale} ${100 + 75*props.wingScale},${100 + 35*props.wingScale}"/>
                    </g>`;
                if (level >= 150) {
                    let extraWingScale = props.wingScale * 0.85;
                    innerSVG += `
                    <g opacity="0.5" stroke="var(--c-stroke)" stroke-width="1.5" fill="none" stroke-linejoin="round" transform="translate(100, 100) rotate(25) translate(-100, -100)" filter="drop-shadow(0 0 10px var(--c-stroke))">
                        <polygon points="100,100 ${100 - 50*extraWingScale},${100 - 50*extraWingScale} ${100 - 80*extraWingScale},${100 - 15*extraWingScale}"/><polygon points="100,100 ${100 + 50*extraWingScale},${100 - 50*extraWingScale} ${100 + 80*extraWingScale},${100 - 15*extraWingScale}"/>
                    </g>
                    <g opacity="0.5" stroke="var(--c-stroke)" stroke-width="1.5" fill="none" stroke-linejoin="round" transform="translate(100, 100) rotate(-25) translate(-100, -100)" filter="drop-shadow(0 0 10px var(--c-stroke))">
                        <polygon points="100,100 ${100 - 50*extraWingScale},${100 - 50*extraWingScale} ${100 - 80*extraWingScale},${100 - 15*extraWingScale}"/><polygon points="100,100 ${100 + 50*extraWingScale},${100 - 50*extraWingScale} ${100 + 80*extraWingScale},${100 - 15*extraWingScale}"/>
                    </g>`;
                }
            }
            innerSVG += `<polygon points="${props.earL}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" /><polygon points="${props.earR}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            if (props.armorOpacity > 0.01) { innerSVG += `<polygon points="50,110 35,130 60,140" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="1.5" opacity="${props.armorOpacity}" stroke-linejoin="round" /><polygon points="150,110 165,130 140,140" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="1.5" opacity="${props.armorOpacity}" stroke-linejoin="round" />`; }
            innerSVG += `<polygon points="${props.head}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round" />`;
            if (props.fangLength > 0.01) { innerSVG += `<polygon points="80,140 75,${140 + 12 * props.fangLength} 90,140" fill="var(--c-stroke)" stroke-linejoin="round" filter="drop-shadow(0 0 3px var(--c-stroke))"/><polygon points="120,140 125,${140 + 12 * props.fangLength} 110,140" fill="var(--c-stroke)" stroke-linejoin="round" filter="drop-shadow(0 0 3px var(--c-stroke))"/>`; }
            
            if (level >= 10) { const h = Math.min((level-10)*0.5, 15); innerSVG += `<polygon points="100,${60-h} 90,60 110,60" fill="var(--c-visor)" stroke="var(--c-stroke)" stroke-width="1.5" stroke-linejoin="round"/>`; }
            innerSVG += `<g class="cyber-visor"><polygon points="${props.visor}" fill="#0f172a" stroke="var(--c-stroke)" stroke-width="2" stroke-linejoin="round" /><polygon points="${props.visor}" fill="var(--c-visor)" opacity="0.6" filter="drop-shadow(0 0 10px var(--c-visor))" stroke-linejoin="round" />${(props.eyeSize > 0.1) ? `<circle cx="85" cy="95" r="${props.eyeSize}" fill="#fff" opacity="0.9" filter="drop-shadow(0 0 5px #fff)" /><circle cx="115" cy="95" r="${props.eyeSize}" fill="#fff" opacity="0.9" filter="drop-shadow(0 0 5px #fff)" />` : `<circle cx="100" cy="98" r="2.5" fill="#fff" opacity="0.9" filter="drop-shadow(0 0 3px #fff)"/>`}</g>`;
            
            innerSVG += `<polyline points="75,125 90,130 110,130 125,125" fill="none" stroke="var(--c-stroke)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.7" />`;
            
            const coreAnimDur = level >= 150 ? '0.5s' : '2s';
            innerSVG += `<g class="animate-pulse" style="transform-origin: 100px 165px; animation-duration: ${coreAnimDur};"><polygon points="${props.core}" fill="var(--c-visor)" filter="drop-shadow(0 0 20px var(--c-visor))" opacity="0.9" stroke-linejoin="round" /><polygon points="${props.core}" fill="#ffffff" opacity="0.8" stroke="var(--c-visor)" stroke-width="2" stroke-linejoin="round" /></g>`;
            
            if (props.crownScale > 0) { 
                let s = props.crownScale;
                innerSVG += `
                <g transform="translate(100, 65)" filter="drop-shadow(0 0 15px var(--c-stroke))">
                    <polygon points="-15,0 -${25 * s},-${35 * s} -${10 * s},-${10 * s}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
                    <polygon points="-${20 * s},-${20 * s} -${35 * s},-${55 * s} -${25 * s},-${15 * s}" fill="var(--c-visor)" opacity="0.9">
                        <animateTransform attributeName="transform" type="translate" values="0,0; -5,-5; 0,0" dur="2s" repeatCount="indefinite"/>
                    </polygon>
                    <polygon points="15,0 ${25 * s},-${35 * s} ${10 * s},-${10 * s}" fill="var(--c-main)" stroke="var(--c-stroke)" stroke-width="2.5" stroke-linejoin="round"/>
                    <polygon points="${20 * s},-${20 * s} ${35 * s},-${55 * s} ${25 * s},-${15 * s}" fill="var(--c-visor)" opacity="0.9">
                        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-5; 0,0" dur="2s" repeatCount="indefinite"/>
                    </polygon>
                    ${s > 2 ? `
                    <polygon points="-8,-20 0,-${70 * s} 8,-20" fill="url(#laserGradL-${containerId})" opacity="0.8">
                        <animateTransform attributeName="transform" type="scale" values="1,1; 1,1.2; 1,1" dur="1.5s" repeatCount="indefinite"/>
                    </polygon>
                    <circle cx="0" cy="-${75 * s}" r="${3 * s}" fill="#fff" filter="drop-shadow(0 0 10px #fff)">
                        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite"/>
                    </circle>
                    ` : ''}
                </g>`;
                
                if (level >= 100) {
                    let haloY = 15 - props.crownScale * 8;
                    let haloR = 45 + (level - 100) * 0.5;
                    innerSVG += `
                    <ellipse cx="100" cy="${haloY}" rx="${haloR}" ry="${haloR * 0.2}" fill="none" stroke="var(--c-stroke)" stroke-width="2" opacity="0.8" filter="drop-shadow(0 0 10px var(--c-visor))"/>
                    <g transform="translate(100, ${haloY})">
                        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${level >= 150 ? 2 : 4}s" repeatCount="indefinite" />
                        <ellipse cx="0" cy="0" rx="${haloR + 8}" ry="${(haloR + 8) * 0.2}" fill="none" stroke="var(--c-visor)" stroke-width="2" stroke-dasharray="10 30" filter="drop-shadow(0 0 8px var(--c-visor))"/>
                        <polygon points="-${haloR+15},0 -${haloR+35},0 -${haloR+15},5" fill="var(--c-stroke)" opacity="0.9" />
                        <polygon points="${haloR+15},0 ${haloR+35},0 ${haloR+15},-5" fill="var(--c-stroke)" opacity="0.9" />
                    </g>`;
                }
            }

            if (level >= 120) {
                let fDist = 70 + (level - 120) * 0.3;
                innerSVG += `
                <g fill="var(--c-visor)" opacity="0.9" filter="drop-shadow(0 0 10px var(--c-visor))">
                    <polygon points="${100-fDist},70 ${100-fDist-8},90 ${100-fDist},110 ${100-fDist+8},90">

        async function initApp() {

        function initLevelSelection() {

            for (let i = 10; i <= 200; i += 10) levels.push(i);
            
            levels.forEach(lv => {
                const btn = document.createElement('button');

        function startBattle(enemyLevel) {

            let atkMult = 1 + (equipped.includes('cwsbyj') ? 0.05 : 0) + (equipped.includes('cwsbjgy') ? 0.05 : 0) + (equipped.includes('cwsbbj') ? 0.02 : 0);
            let defMult = 1 + (equipped.includes('cwsbtk') ? 0.05 : 0) + (equipped.includes('cwsbbj') ? 0.02 : 0);

            battleState.player.maxHp = Math.floor(calcMaxHp(battleState.player.level) * hpMult);
            battleState.player.hp = battleState.player.maxHp;
            battleState.player.atk = Math.floor(calcAtk(battleState.player.level) * atkMult); 
            battleState.player.def = Math.floor(calcDef(battleState.player.level) * defMult);
            battleState.player.maxEnergy = Math.floor(150 * energyMult);
            battleState.player.energy = battleState.player.maxEnergy; 
            battleState.player.dot = 0; battleState.player.shield = 0; battleState.player.usedBurst = false;
            battleState.player.energyBodyTurns = 0; battleState.player.cooldowns = {}; battleState.player.usedSummon = false;

        function updateStatsUI(targetId) {
            const entity = battleState[targetId];
            const hpBar = document.getElementById(entity.barId); 
            const hpText = document.getElementById(entity.textId);
            const epBar = document.getElementById(entity.epBarId); 
            const epText = document.getElementById(entity.epTextId);
            const maxEpText = document.getElementById(targetId + 'MaxEpText');
            
            // 护盾白条元素
            const shieldBar = document.getElementById(targetId + 'ShieldBar');
            
            const hpPct = Math.max(0, (entity.hp / entity.maxHp) * 100);
            const shieldPct = Math.max(0, (entity.shield / entity.maxHp) * 100);
            
            hpBar.style.width = `${hpPct}%`; 
            
            // 带护盾数字的血量文本显示
            if (entity.shield > 0) {
                hpText.innerHTML = `${Math.floor(entity.hp)} <span class="text-white drop-shadow-[0_0_3px_white] font-black">+${Math.floor(entity.shield)}</span> / ${entity.maxHp}`;
            } else {
                hpText.innerText = `${Math.floor(entity.hp)} / ${entity.maxHp}`;
            }

            // 更新护盾条偏移与宽度，使其接在血条末端。溢出则向左延展盖住血条。
            if (shieldBar) {
                let offset = hpPct;
                let width = shieldPct;
                if (offset + width > 100) {
                    offset = 100 - width;
                    if (offset < 0) { offset = 0; width = 100; } // 超出总宽度部分截断
                }
                shieldBar.style.width = `${width}%`;
                if (targetId === 'player') {
                    shieldBar.style.left = `${offset}%`;
                } else {
                    shieldBar.style.right = `${offset}%`;
                }
            }
            
            if (hpPct < 20) {
                hpBar.classList.replace('from-cyan-500', 'from-red-600'); hpBar.classList.replace('to-blue-500', 'to-red-500');
            } else if (targetId === 'player') {
                hpBar.classList.replace('from-red-600', 'from-cyan-500'); hpBar.classList.replace('to-red-500', 'to-blue-500');
            }
            const epPct = Math.max(0, (entity.energy / entity.maxEnergy) * 100);
            epBar.style.width = `${epPct}%`; epText.innerText = Math.floor(entity.energy);
            if (maxEpText) maxEpText.innerText = entity.maxEnergy;
        }

        function createDamageText(targetEl, textOrDamage, isCrit, isHeal = false, customColor = null) {
            const el = document.createElement('div');
            let color = customColor || (isHeal ? 'text-green-400' : 'text-red-500');
            let prefix = isHeal ? '+' : (typeof textOrDamage === 'number' ? '-' : '');
            let size = isCrit ? 'text-3xl md:text-4xl' : 'text-xl md:text-2xl';
            
            if(isCrit && !isHeal && !customColor) color = 'text-amber-400';
            el.className = `damage-text ${color} ${size}`;
            el.innerText = typeof textOrDamage === 'number' ? `${prefix}${Math.floor(textOrDamage)}${isCrit ? '!' : ''}` : textOrDamage;
            
            const offsetX = (Math.random() - 0.5) * 50;
            el.style.left = `calc(50% + ${offsetX}px)`;
            el.style.top = '30%';
            
            targetEl.appendChild(el); setTimeout(() => el.remove(), 1200);
        }

                <polygon points="20,50 50,20 80,50 50,80" fill="rgba(16, 185, 129, 0.3)" stroke="#34d399" stroke-width="3"/>
                <circle cx="50" cy="50" r="8" fill="#fff" filter="drop-shadow(0 0 5px #fff)"/>
                <circle cx="50" cy="50" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4">
                    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
                </circle>
            </svg>`;
            el.style.opacity = '1';
        }

        async function executeAction(attackerId, defenderId, skillKey) {
            battleState.isAnimating = true;
            const attacker = battleState[attackerId]; const defender = battleState[defenderId];
            const skill = SKILLS[skillKey];
            
            const attackerEl = document.getElementById(attacker.containerId);
            const defenderEl = document.getElementById(defender.containerId);
            
            attacker.energy -= skill.cost; updateStatsUI(attackerId);
            addLog(`${attacker.name} ${skill.log}`, attackerId === 'player' ? 'text-cyan-300' : 'text-rose-300');

            if (skill.type === 'buff' || skill.type === 'buff_special' || skill.type === 'summon') {
                attackerEl.classList.add('anim-buff');
                
                if (skillKey === 'shield') {
                    const healAmt = attacker.maxHp * skill.heal;
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmt);
                    createDamageText(attackerEl, healAmt, false, true);
                    
                    let shieldAmt = attacker.maxHp * skill.shield;
                    if (attacker.usedBurst) shieldAmt *= 1.3; // 火力全开护盾增益
                    attacker.shield += shieldAmt; // 护盾叠加
                    
                    const shieldVis = document.getElementById(`${attackerId}ShieldVisual`);
                    if(shieldVis) { shieldVis.style.opacity = '1'; shieldVis.style.transform = 'scale(1)'; shieldVis.style.filter = 'drop-shadow(0 0 10px currentColor)'; }
                } 
                else if (skillKey === 'burst') {
                    const addedHp = Math.floor(attacker.maxHp * 0.2);
                    attacker.maxHp += addedHp; attacker.hp += addedHp; 
                    attacker.atk = Math.floor(attacker.atk * 1.5); attacker.def = Math.floor(attacker.def * 1.5);
                    attacker.usedBurst = true;
                    addLog(`动力炉超载！(HP+20%, 攻防+50%, 护盾效能+30%)`, "text-yellow-400 font-bold");
                    createDamageText(attackerEl, "火力全开!", true, true, "text-yellow-400");
                    document.getElementById(`${attackerId}Visualizer`).classList.add('aura-burst');
                }
                else if (skillKey === 'energy_body') {
                    attacker.energyBodyTurns = 2;
                    attacker.cooldowns['energy_body'] = skill.cd;
                    attackerEl.classList.add('energy-body-active');
                    createDamageText(attackerEl, "护体启动!", false, true, "text-teal-300");
                }
                else if (skillKey === 'summon') {
                    attacker.usedSummon = true;
                    createDamageText(attackerEl, "支援抵达!", false, true, "text-emerald-400");
                    renderSummonVisual(attackerId);
                }
                
                updateStatsUI(attackerId);
                await new Promise(r => setTimeout(r, 800));
                attackerEl.classList.remove('anim-buff');
            } 
            else if (skill.type === 'damage' || skill.type === 'damage_ultimate' || skill.type === 'damage_true') {
                let animClass = ''; let hitClass = 'anim-hit-light';
                let isTrueDamage = (skill.type === 'damage_true');
                
                if (skillKey === 'attack') { animClass = attackerId === 'player' ? 'anim-attack-right' : 'anim-attack-left'; } 
                else if (skillKey === 'strike') { animClass = attackerId === 'player' ? 'anim-strike-right' : 'anim-strike-left'; hitClass = 'anim-hit-heavy'; } 
                else if (skillKey === 'tornado') { animClass = 'anim-tornado'; hitClass = 'anim-hit-heavy'; } 
                else { animClass = attackerId === 'player' ? 'anim-attack-right' : 'anim-attack-left'; }
                
                attackerEl.classList.add(animClass);
                await new Promise(r => setTimeout(r, animClass.includes('strike') ? 400 : 250)); 
                
                let isCrit = false; let critMult = 1; let variance = 0.9 + Math.random() * 0.2;
                let multiplier = skill.multiplier || 1; let isInstaKill = false;
                let strikeBonus = 0;

                // 攻击逻辑分支
                if (skillKey === 'attack') {
                    let roll = Math.random();
                    if (roll < 0.10) { isCrit = true; critMult = 3; addLog("【精准破甲】3倍真实伤害！", "text-amber-400 font-bold"); }
                    else if (roll < 0.30) { isCrit = true; critMult = 2; addLog("【弱点打击】2倍真实伤害！", "text-amber-400 font-bold"); }
                } else {
                    if (Math.random() < 0.2) { isCrit = true; critMult = 1.5; }
                }

                // 暴力强击护盾引爆逻辑
                if (skillKey === 'strike' && attacker.shield > 0) {
                    strikeBonus = attacker.shield;
                    attacker.shield = 0;
                    updateStatsUI(attackerId); // 立即更新攻击者护盾消失
                    const shieldVis = document.getElementById(`${attackerId}ShieldVisual`);
                    if (shieldVis) { shieldVis.style.opacity = '0'; shieldVis.style.transform = 'scale(0.8)'; }
                    addLog(`引爆全部护盾，附加 ${Math.floor(strikeBonus)} 点动能伤害！`, "text-orange-400 font-bold");
                }
                
                if (skillKey === 'ultimate') {
                    document.body.classList.add('anim-ult-bg');
                    const flash = document.createElement('div'); flash.className = 'flash-overlay'; document.getElementById('globalFxLayer').appendChild(flash);
                    setTimeout(() => { document.body.classList.remove('anim-ult-bg'); flash.remove(); }, 1000);
                    
                    if (Math.random() < 0.2) isInstaKill = true;
                    else if (Math.random() < 0.3) { multiplier = 6; addLog("【爆炎双倍】触发！核心产生核聚变！", "text-rose-400 font-bold"); }
                }

                let actualDamage = 0;
                let rawDamage = (attacker.atk * multiplier * critMult * variance) + strikeBonus;

                if (isInstaKill) {
                    actualDamage = defender.hp + defender.shield; 
                    addLog(`【绝杀】触发！目标被彻底抹除！`, "text-red-500 font-black");
                    defenderEl.classList.add('anim-instakill');
                } else {
                    if (isTrueDamage) {
                        actualDamage = rawDamage; // 真实伤害无视防御
                        defenderEl.classList.add('anim-hit-light');
                    } else {
                        actualDamage = Math.max(1, rawDamage - defender.def);
                        if (skillKey === 'ultimate') defenderEl.classList.add('anim-explode'); else defenderEl.classList.add(hitClass);
                    }
                    
                    // 能量护体：所有伤害强制变 1 (包括真实伤害)
                    if (defender.energyBodyTurns > 0) {
                        actualDamage = 1;
                        addLog(`【能量护体】偏转了攻击，伤害强制降为1！`, "text-teal-300 font-bold");
                    }
                }
                
                // 护盾抵消伤害逻辑 (真实伤害和绝杀不可被护盾抵消)
                if (defender.shield > 0 && !isInstaKill) {
                    if (isTrueDamage) {
                        addLog("真实伤害直接穿透了护盾屏障！", "text-red-400 font-bold");
                    } else {
                        const shieldVis = document.getElementById(`${defenderId}ShieldVisual`);
                        if (defender.shield >= actualDamage) {
                            defender.shield -= actualDamage; actualDamage = 0;
                            createDamageText(defenderEl, "-0 (抵消)", false, false, "text-blue-300");
                            if (shieldVis) shieldVis.style.opacity = Math.max(0.2, defender.shield / defender.maxHp);
                        } else {
                            actualDamage -= defender.shield; defender.shield = 0;
                            if (shieldVis) { shieldVis.style.opacity = '0'; shieldVis.style.transform = 'scale(0.8)'; }
                        }
                    }
                }

                if (actualDamage > 0) {
                    defender.hp = Math.max(0, defender.hp - actualDamage);
                    if (isInstaKill) createDamageText(defenderEl, "秒！", true, false, "text-rose-500");
                    else createDamageText(defenderEl, actualDamage, isCrit);
                }
                
                if (skillKey === 'tornado' && !isInstaKill && defender.hp > 0) {
                    defender.dot = skill.dot;
                    addLog(`目标被卷入装甲撕裂旋风，持续流血！`, "text-purple-400");
                }

                updateStatsUI(defenderId);
                setTimeout(() => defenderEl.classList.remove(hitClass, 'anim-explode', 'anim-instakill'), 1000);
                await new Promise(r => setTimeout(r, 400));
                attackerEl.classList.remove(animClass);
            }

            // 执行伙伴协同攻击
            if (attacker.usedSummon && defender.hp > 0) {
                await triggerSummonAttack(attackerId, defenderId);
            }

            if (defender.hp <= 0) {
                defenderEl.style.transition = "all 1s ease-in";
                defenderEl.style.filter = "grayscale(1) brightness(0.1)";
                defenderEl.style.transform = attackerId === 'player' ? "rotate(90deg) scale(0.5) translateY(50px)" : "rotate(-90deg) scale(0.5) translateY(50px)"; 
                battleState.turn = 'end';
                setTimeout(() => showResult(attackerId === 'player'), 1200);
                return;
            }

            battleState.isAnimating = false;
            nextTurn();
        }
        
        async function triggerSummonAttack(attackerId, defenderId) {
            const attacker = battleState[attackerId];
            const defender = battleState[defenderId];
            
            // 召唤物属性计算 (等级与本体相同，属性取本体的50%)
            const sLvl = attacker.level;
            const sAtk = Math.floor(attacker.atk * 0.5);
            const sMaxHp = Math.floor(attacker.maxHp * 0.5);
            
            addLog(`${attacker.name} 的浮游单元正在锁定目标...`, "text-emerald-300");
            const summonEl = document.getElementById(`${attackerId}SummonVis`);
            if (summonEl) {
                summonEl.classList.add(attackerId === 'player' ? 'anim-attack-right' : 'anim-attack-left');
                await new Promise(r => setTimeout(r, 250));
            }

            // --- 召唤物技能池与 AI ---
            // 自动筛选召唤物可以释放的技能 (过滤掉火力全开、能量护体等自身特化BUFF)
            let sSkills = ['attack'];
            if (sLvl >= SKILLS.strike.req) sSkills.push('strike');
            if (sLvl >= SKILLS.shield.req) sSkills.push('shield');
            if (sLvl >= SKILLS.tornado.req) sSkills.push('tornado');
            if (sLvl >= SKILLS.ultimate.req) sSkills.push('ultimate');
            
            // 召唤物随机选择一个技能
            let chosenKey = sSkills[Math.floor(Math.random() * sSkills.length)];
            let skill = SKILLS[chosenKey];
            
            addLog(`=> 战术单元协同施放了【${skill.name}】！`, "text-emerald-400 font-bold");

            // --- 召唤物技能效果执行 ---
            if (skill.type === 'buff') {
                // 若召唤物释放了【治愈护盾】，则基于召唤物的最大生命值 (sMaxHp) 为本体加血和护盾
                const healAmt = sMaxHp * skill.heal;
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmt);
                createDamageText(document.getElementById(attacker.containerId), healAmt, false, true);
                
                let shieldAmt = sMaxHp * skill.shield;
                attacker.shield += shieldAmt; 
                const shieldVis = document.getElementById(`${attackerId}ShieldVisual`);
                if(shieldVis) { shieldVis.style.opacity = '1'; shieldVis.style.transform = 'scale(1)'; }
                updateStatsUI(attackerId);
                
            } else {
                // 若召唤物释放攻击技能
                let isTrueDamage = (chosenKey === 'attack');
                let isCrit = false; let critMult = 1; let variance = 0.9 + Math.random() * 0.2;
                let multiplier = skill.multiplier || 1; let isInstaKill = false;
                
                // 判定暴击和特殊效果
                if (chosenKey === 'attack') {
                    let roll = Math.random();
                    if (roll < 0.10) { isCrit = true; critMult = 3; }
                    else if (roll < 0.30) { isCrit = true; critMult = 2; }
                } else if (chosenKey === 'ultimate') {
                    if (Math.random() < 0.2) isInstaKill = true;
                    else if (Math.random() < 0.3) multiplier = 6;
                } else {
                    if (Math.random() < 0.2) { isCrit = true; critMult = 1.5; }
                }

                // 召唤物基础攻击力为 sAtk
                let rawDamage = sAtk * multiplier * critMult * variance;
                let actualDamage = 0;

                if (isInstaKill) {
                    actualDamage = defender.hp + defender.shield; 
                    addLog(`战术单元触发了【绝杀】！`, "text-red-500 font-black");
                    document.getElementById(defender.containerId).classList.add('anim-instakill');
                } else {
                    if (isTrueDamage) {
                        actualDamage = rawDamage; // 真实伤害
                    } else {
                        actualDamage = Math.max(1, rawDamage - defender.def); // 普通物理伤害减去防御
                    }
                    // 能量护体减伤
                    if (defender.energyBodyTurns > 0) actualDamage = 1;
                }

                // 护盾抵消伤害逻辑 (真实伤害穿透)
                if (defender.shield > 0 && !isInstaKill) {
                    if (isTrueDamage) {
                        // 穿透护盾不处理
                    } else {
                        const shieldVis = document.getElementById(`${defenderId}ShieldVisual`);
                        if (defender.shield >= actualDamage) {
                            defender.shield -= actualDamage; actualDamage = 0;
                            createDamageText(document.getElementById(defender.containerId), "-0 (抵消)", false, false, "text-blue-300");
                            if (shieldVis) shieldVis.style.opacity = Math.max(0.2, defender.shield / defender.maxHp);
                        } else {
                            actualDamage -= defender.shield; defender.shield = 0;
                            if (shieldVis) { shieldVis.style.opacity = '0'; shieldVis.style.transform = 'scale(0.8)'; }
                        }
                    }
                }
                
                // 扣除HP
                if (actualDamage > 0) {
                    defender.hp = Math.max(0, defender.hp - actualDamage);
                    if (isInstaKill) createDamageText(document.getElementById(defender.containerId), "秒！", true, false, "text-rose-500");
                    else createDamageText(document.getElementById(defender.containerId), actualDamage, isCrit);
                    document.getElementById(defender.containerId).classList.add('anim-hit-light');
                }

                // 巨型旋风附加流血 (比例按照被攻击者自身血量计算，保持一致)
                if (chosenKey === 'tornado' && !isInstaKill && defender.hp > 0) {
                    defender.dot = skill.dot;
                }

                updateStatsUI(defenderId);
            }

            if (summonEl) setTimeout(() => summonEl.classList.remove('anim-attack-right', 'anim-attack-left', 'anim-hit-light'), 300);
            await new Promise(r => setTimeout(r, 400));
        }

        async function nextTurn() {
            if (battleState.turn === 'end') return;
            
            battleState.turn = battleState.turn === 'player' ? 'enemy' : 'player';
            const activeEntity = battleState[battleState.turn];
            
            activeEntity.energy = Math.min(activeEntity.maxEnergy, activeEntity.energy + 10 + Math.floor(activeEntity.level/5));
            
            // 状态倒计时与CD刷新
            if (activeEntity.energyBodyTurns > 0) {
                activeEntity.energyBodyTurns--;
                if (activeEntity.energyBodyTurns <= 0) {
                    document.getElementById(activeEntity.containerId).classList.remove('energy-body-active');
                    addLog(`${activeEntity.name} 的能量护体已失效。`, "text-slate-500");
                }
            }
            for (let k in activeEntity.cooldowns) {
                if (activeEntity.cooldowns[k] > 0) activeEntity.cooldowns[k]--;
            }
            
            if (activeEntity.dot > 0) {
                let dotDamage = Math.floor(activeEntity.maxHp * activeEntity.dot);
                
                if (activeEntity.energyBodyTurns > 0) dotDamage = 1;

                if (activeEntity.shield > 0) {
                    const shieldVis = document.getElementById(`${battleState.turn}ShieldVisual`);
                    if (activeEntity.shield >= dotDamage) {
                        activeEntity.shield -= dotDamage; dotDamage = 0;
                        if (shieldVis) shieldVis.style.opacity = Math.max(0.2, activeEntity.shield / activeEntity.maxHp);
                    } else {
                        dotDamage -= activeEntity.shield; activeEntity.shield = 0;
                        if (shieldVis) { shieldVis.style.opacity = '0'; shieldVis.style.transform = 'scale(0.8)'; }
                    }
                }

                if (dotDamage > 0) {
                    activeEntity.hp -= dotDamage;
                }
                
                addLog(`${activeEntity.name} 受到撕裂伤害`, "text-purple-400");
                createDamageText(document.getElementById(activeEntity.containerId), Math.floor(activeEntity.maxHp * activeEntity.dot), false, false, 'text-purple-500');
                
                if (activeEntity.hp <= 0) {
                    updateStatsUI(battleState.turn);
                    const loserEl = document.getElementById(activeEntity.containerId);
                    loserEl.style.transition = "all 1s ease-in";
                    loserEl.style.filter = "grayscale(1) brightness(0.1)";
                    loserEl.style.transform = battleState.turn === 'enemy' ? "rotate(90deg) scale(0.5)" : "rotate(-90deg) scale(0.5)";
                    battleState.turn = 'end';
                    setTimeout(() => showResult(battleState.turn !== 'player'), 1200);
                    return;
                }
            }
            
            updateStatsUI(battleState.turn);

            if (battleState.turn === 'player') {
                battleState.round++; updateActionUI(); addLog(`--- 第 ${battleState.round} 回合开始 ---`, "text-slate-500");
            } else {
                updateActionUI(); setTimeout(enemyAiAct, 1000);
            }
        }

        function updateActionUI() {
            Object.keys(SKILLS).forEach(key => {
                const btn = document.getElementById(`btn_${key}`);
                const lock = document.getElementById(`lock_${key}`);
                const cdOverlay = document.getElementById(`cd_${key}`);
                const skill = SKILLS[key];
                if (!btn) return;

                if (battleState.player.level < skill.req) {
                    btn.disabled = true; if(lock) lock.classList.remove('hidden');
                } else {
                    if(lock) lock.classList.add('hidden');
                    const isPlayerTurn = battleState.turn === 'player' && !battleState.isAnimating;
                    const notEnoughEp = battleState.player.energy < skill.cost;
                    const alreadyBurst = key === 'burst' && battleState.player.usedBurst;
                    const alreadySummoned = key === 'summon' && battleState.player.usedSummon;
                    const onCooldown = battleState.player.cooldowns[key] > 0;
                    
                    if (cdOverlay) {
                        if (onCooldown) { cdOverlay.classList.remove('hidden'); cdOverlay.innerText = battleState.player.cooldowns[key]; }
                        else { cdOverlay.classList.add('hidden'); }
                    }

                    btn.disabled = !isPlayerTurn || notEnoughEp || alreadyBurst || alreadySummoned || onCooldown;
                }
            });
        }

        window.useSkill = function(skillKey) {
            if (battleState.turn !== 'player' || battleState.isAnimating) return;
            const skill = SKILLS[skillKey];
            if (battleState.player.energy < skill.cost) return; 
            if (battleState.player.cooldowns[skillKey] > 0) return;
            updateActionUI(); executeAction('player', 'enemy', skillKey);
        }

        function enemyAiAct() {
            const enemy = battleState.enemy; const hpPct = enemy.hp / enemy.maxHp;
            let availableSkills = Object.keys(SKILLS).filter(key => {
                const sk = SKILLS[key];
                if (enemy.level < sk.req) return false;
                if (enemy.energy < sk.cost) return false;
                if (key === 'burst' && enemy.usedBurst) return false;
                if (key === 'summon' && enemy.usedSummon) return false;
                if (enemy.cooldowns[key] > 0) return false;
                return true;
            });
            if (availableSkills.length === 0) availableSkills = ['attack']; 

            let chosenSkill = 'attack';
            if (availableSkills.includes('ultimate') && Math.random() < 0.6) chosenSkill = 'ultimate'; 
            else if (availableSkills.includes('burst') && Math.random() < 0.8) chosenSkill = 'burst'; 
            else if (availableSkills.includes('summon') && Math.random() < 0.9) chosenSkill = 'summon';
            else if (availableSkills.includes('energy_body') && hpPct < 0.4 && Math.random() < 0.8) chosenSkill = 'energy_body';
            else if (availableSkills.includes('shield') && hpPct < 0.5 && Math.random() < 0.7) chosenSkill = 'shield'; 
            else if (availableSkills.includes('tornado') && Math.random() < 0.5) chosenSkill = 'tornado'; 
            else if (availableSkills.includes('strike') && Math.random() < 0.6) chosenSkill = 'strike';
            else chosenSkill = availableSkills[Math.floor(Math.random() * availableSkills.length)];

            executeAction('enemy', 'player', chosenSkill);
        }

        async function showResult(isWin) {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultContent');
            const title = document.getElementById('resultTitle');
            const desc = document.getElementById('resultDesc');
            const exp = document.getElementById('rewardExp');

            let gainedExp = 10;
            if (isWin) {
                title.innerText = "VICTORY";
                title.className = "text-3xl md:text-4xl font-black mb-2 tracking-widest text-cyan-400 drop-shadow-[0_0_10px_cyan]";
                desc.innerText = "强悍的战斗力，敌方实体已被彻底粉碎。";
                gainedExp = battleState.enemy.level * 2;
                exp.innerText = `+${gainedExp}`; exp.className = "text-2xl md:text-3xl font-mono text-cyan-300";
            } else {
                title.innerText = "DEFEATED";
                title.className = "text-3xl md:text-4xl font-black mb-2 tracking-widest text-rose-500 drop-shadow-[0_0_10px_red]";
                desc.innerText = "机体严重受损，安全协议已强制切断连接。";
                gainedExp = 10; exp.innerText = "+10"; exp.className = "text-2xl md:text-3xl font-mono text-rose-300";
            }

            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);

            if (globalPetData && GITHUB_TOKEN) {
                const btnReturn = document.getElementById("btnReturn");
                const originalText = btnReturn.innerText;
                btnReturn.innerText = "正在同步战斗数据..."; btnReturn.disabled = true; 
                
                addExpAndLevelUp(gainedExp); globalPetData.lastUpdated = new Date().getTime();
                const upRes = await updateFile(FILE_PET, globalPetData, globalPetSha);
                if (upRes.success) globalPetSha = upRes.sha;
                
                btnReturn.innerText = originalText; btnReturn.disabled = false;
            }
        }

        window.onload = initApp;

    </script>
