<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱档案馆 🏛️💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fff1f2; /* rose-50 */
            background-image: 
                radial-gradient(#fecdd3 1px, transparent 1px),
                radial-gradient(#fecdd3 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow-x: hidden; 
        }
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-8px); } 
            100% { transform: translateY(0px); } 
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translate(-50%, 20px); } 
            10% { opacity: 1; transform: translate(-50%, 0); } 
            90% { opacity: 1; transform: translate(-50%, 0); } 
            100% { opacity: 0; transform: translate(-50%, -20px); } 
        }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f472b6; }

        /* 隐藏日期选择器的默认图标以自定义 */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.5) sepia(1) saturate(5) hue-rotate(300deg);
        }

        /* 选项卡激活样式 */
        .tab-active {
            background-color: #f43f5e; /* rose-500 */
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.4);
        }
        .tab-inactive {
            background-color: white;
            color: #f43f5e;
            border: 1px solid #fecdd3;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-6 px-4">
    <!-- 头部 -->
    <header class="text-center mb-6 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 hover:bg-rose-50 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-rose-600 flex items-center justify-center gap-2 drop-shadow-sm">
               🏛️ 恋爱档案馆 💖
            </h1>
        </div>
        <div class="w-9 h-9"></div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- 选项卡导航 -->
        <div class="flex space-x-2 mb-6 w-full justify-center bg-white/50 p-1.5 rounded-full backdrop-blur-sm border border-rose-100 shadow-sm">
            <button onclick="switchTab('archive')" id="tabBtn-archive" class="tab-active flex-1 py-2 rounded-full text-sm transition-all duration-300">档案馆</button>
            <button onclick="switchTab('record')" id="tabBtn-record" class="tab-inactive flex-1 py-2 rounded-full text-sm transition-all duration-300">记录事件</button>
            <button onclick="switchTab('reflection')" id="tabBtn-reflection" class="tab-inactive flex-1 py-2 rounded-full text-sm transition-all duration-300">事件感悟</button>
        </div>

        <!-- 视图 1: 档案馆 -->
        <div id="view-archive" class="w-full transition-opacity duration-300 animate-fade-in block">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-sm font-bold text-rose-500">全部记忆档案</span>
                <select id="sortSelect" onchange="renderArchive()" class="text-xs bg-white text-rose-500 border border-rose-200 rounded-full px-3 py-1.5 shadow-sm outline-none focus:ring-2 focus:ring-rose-300 cursor-pointer">
                    <option value="time">按时间 (新到旧) 🕒</option>
                    <option value="stars">按星级 (高到低) ⭐</option>
                </select>
            </div>
            
            <div id="archiveList" class="w-full flex flex-col gap-4 pb-10">
            </div>
        </div>

        <!-- 视图 2: 记录事件 -->
        <div id="view-record" class="w-full transition-opacity duration-300 animate-fade-in hidden">
            <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-sm border-2 border-rose-100 mb-4">
                <h2 class="text-lg font-bold text-rose-600 mb-4 flex items-center gap-2">✍️ 记录新的心动瞬间</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-rose-400 mb-1">事件标题 🏷️</label>
                        <input type="text" id="eventTitle" class="w-full px-3 py-2 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 bg-rose-50/30 text-gray-700 placeholder-rose-200" placeholder="给这个瞬间起个名字吧...">
                    </div>

                    <!-- 发生时间 -->
                    <div>
                        <label class="block text-xs font-bold text-rose-400 mb-1">发生时间 🕰️</label>
                        <input type="datetime-local" id="eventTime" class="w-full px-3 py-2 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 bg-rose-50/30 text-gray-700">
                    </div>

                    <!-- 事件分类 -->
                    <div>
                        <label class="block text-xs font-bold text-rose-400 mb-1">事件分类 🏷️</label>
                        <div class="flex flex-wrap gap-2" id="categoryContainer">
                            <!-- 分类由 JS 渲染 -->
                        </div>
                    </div>

                    <!-- 星级 -->
                    <div>
                        <label class="block text-xs font-bold text-rose-400 mb-1">重要指数 ⭐</label>
                        <div class="flex gap-2 text-2xl cursor-pointer" id="starContainer">
                            <span onclick="setStars(1)" id="star-1" class="text-gray-300 hover:scale-125 transition-transform">★</span>
                            <span onclick="setStars(2)" id="star-2" class="text-gray-300 hover:scale-125 transition-transform">★</span>
                            <span onclick="setStars(3)" id="star-3" class="text-gray-300 hover:scale-125 transition-transform">★</span>
                            <span onclick="setStars(4)" id="star-4" class="text-gray-300 hover:scale-125 transition-transform">★</span>
                            <span onclick="setStars(5)" id="star-5" class="text-gray-300 hover:scale-125 transition-transform">★</span>
                        </div>
                    </div>

                    <!-- 初始描述/感悟 -->
                    <div>
                        <label class="block text-xs font-bold text-rose-400 mb-1">事件描述 📝</label>
                        <textarea id="eventDesc" rows="3" class="w-full px-3 py-2 text-sm border-2 border-rose-100 rounded-xl focus:outline-none focus:border-rose-400 resize-none text-gray-700 placeholder-rose-200 bg-rose-50/30" placeholder="写下事件的经过或者你此刻的感受..."></textarea>
                    </div>

                    <button onclick="saveNewEvent()" id="saveEventBtn" class="mt-2 w-full py-3 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center gap-2">
                        封存入档 📦
                    </button>
                </div>
            </div>
        </div>

        <!-- 视图 3: 事件感悟 -->
        <div id="view-reflection" class="w-full transition-opacity duration-300 animate-fade-in hidden">
            <div class="bg-white/80 backdrop-blur-sm rounded-xl p-3 mb-4 border border-blue-100 text-xs text-blue-500 shadow-sm flex items-center gap-2">
                <span>💡</span>
                <p>点击事件标题，即可为过去的档案补充各自的专属感悟。</p>
            </div>
            
            <div id="reflectionList" class="w-full flex flex-col gap-4 pb-10">
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-xs mb-2">你是: <span id="currentIdentityLabel" class="font-bold text-rose-400">-</span></p>
        </div>
    </main>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap"></div>

    <script>
        // === 配置与状态 ===
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity') || '哼哼'; // 默认回退方便测试
        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_DAG = 'data/dag.json'; // 两位共用的数据文件

        let dagData = { events: [] };
        let dagSha = null;
        let pollInterval = null;
        
        let currentTab = 'archive';
        let newEventStars = 5; // 默认5星
        let newEventCategory = '日常小确幸'; // 默认分类

        const CATEGORIES = [
            { id: '小甜蜜', icon: '✨' },
            { id: '争吵与和好', icon: '🤝' },
            { id: '其他', icon: '📌' }
        ];

        document.getElementById('currentIdentityLabel').innerText = myIdentity;

        // 设置默认时间为当前时间
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('eventTime').value = now.toISOString().slice(0, 16);

        // === 初始化逻辑 ===
        window.onload = async function() {
            if (!GITHUB_TOKEN) {
                showToast("未检测到Token，请返回首页登录");
                // window.location.href = 'index.html'; // 取消注释以强制跳转
            }
            
            initCategorySelector();
            setStars(5); // 初始渲染星星
            
            showToast("正在拉取档案库...");
            await fetchDagData();
            
            renderAllViews();
            startPolling();
        };

        // === 视图控制 ===
        function switchTab(tabId) {
            currentTab = tabId;
            
            if (tabId === 'archive' || tabId === 'reflection') {
                expandedItems.clear();
            }

            // 更新按钮样式
            ['archive', 'record', 'reflection'].forEach(id => {
                const btn = document.getElementById(`tabBtn-${id}`);
                const view = document.getElementById(`view-${id}`);
                
                if (id === tabId) {
                    btn.classList.remove('tab-inactive');
                    btn.classList.add('tab-active');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('tab-inactive');
                    view.classList.add('hidden');
                }
            });

            // 切换时重新渲染对应内容
            renderAllViews();
        }

        function initCategorySelector() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = CATEGORIES.map(cat => `
                <button onclick="setCategory('${cat.id}')" id="catBtn_${cat.id}" 
                    class="text-xs px-3 py-1.5 rounded-full transition-all border ${cat.id === newEventCategory ? 'bg-rose-500 text-white border-rose-500 shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:border-rose-300'}">
                    ${cat.icon} ${cat.id}
                </button>
            `).join('');
        }

        function setCategory(catId) {
            newEventCategory = catId;
            initCategorySelector(); // 重新渲染状态
        }

        function setStars(count) {
            newEventStars = count;
            for (let i = 1; i <= 5; i++) {
                const starEl = document.getElementById(`star-${i}`);
                if (i <= count) {
                    starEl.classList.remove('text-gray-300');
                    starEl.classList.add('text-amber-400');
                    starEl.innerText = '★';
                } else {
                    starEl.classList.remove('text-amber-400');
                    starEl.classList.add('text-gray-300');
                    starEl.innerText = '☆';
                }
            }
        }

        // === GitHub 数据交互 ===
        async function fetchDagData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_DAG}?t=${timestamp}`, {
                    method: 'GET', 
                    headers: { 
                        'Accept': 'application/vnd.github.v3+json', 
                        'Authorization': `Bearer ${GITHUB_TOKEN}` 
                    }
                });
                
                if (response.status === 404) {
                    // 文件不存在则初始化
                    dagData = { events: [] };
                    dagSha = null;
                    return true;
                }
                
                if (!response.ok) throw new Error('Fetch failed');
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                dagData = JSON.parse(contentStr || '{"events":[]}');
                dagSha = result.sha;
                
                // 确保数据结构完整
                if (!dagData.events) dagData.events = [];
                
                return true;
            } catch (error) { 
                console.error("读取错误:", error);
                return false; 
            }
        }

        async function updateDagData() {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(dagData, null, 2)))); 
                const body = { message: `Update love archive data`, content: encodedContent };
                if (dagSha) body.sha = dagSha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_DAG}`, {
                    method: 'PUT', 
                    headers: { 
                        'Accept': 'application/vnd.github.v3+json', 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`, 
                        'Content-Type': 'application/json' 
                    }, 
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) throw new Error('Update failed');
                
                const result = await response.json();
                dagSha = result.content.sha;
                return true;
            } catch (error) { 
                console.error("更新错误:", error);
                return false; 
            }
        }

        function startPolling() { 
            if (pollInterval) clearInterval(pollInterval); 
            pollInterval = setInterval(async () => { 
                const success = await fetchDagData();
                if(success) renderAllViews(); 
            }, 15000); // 每15秒同步一次
        }

        // === 辅助函数 ===
        function formatTimestamp(ts) {
            const date = new Date(ts);
            const yyyy = date.getFullYear();
            const MM = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const HH = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}-${MM}-${dd} ${HH}:${mm}`;
        }

        function getCategoryIcon(catId) {
            const cat = CATEGORIES.find(c => c.id === catId);
            return cat ? cat.icon : '📌';
        }

        function renderStarsHtml(count) {
            let html = '';
            for(let i=0; i<5; i++) {
                if(i < count) html += '<span class="text-amber-400">★</span>';
                else html += '<span class="text-gray-300">☆</span>';
            }
            return html;
        }

        let expandedItems = new Set();

        function toggleExpand(id) {
            if (expandedItems.has(id)) {
                expandedItems.delete(id);
            } else {
                expandedItems.add(id);
            }
            // 根据当前所在视图重新渲染
            if (currentTab === 'archive') {
                renderArchive();
            } else if (currentTab === 'reflection') {
                renderReflections();
            }
        }

        function renderAllViews() {
            if (currentTab === 'archive') renderArchive();
            else if (currentTab === 'reflection') renderReflections();
        }

        // === 视图 1: 渲染档案馆 ===
        function renderArchive() {
            const container = document.getElementById('archiveList');
            const sortMode = document.getElementById('sortSelect').value;
            
            if (!dagData.events || dagData.events.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-2xl border border-dashed border-rose-200">
                        <span class="text-4xl">🗂️</span>
                        <p class="text-sm text-gray-400 mt-2">档案馆还是空的，快去记录你们的第一次心动吧~</p>
                    </div>`;
                return;
            }

            // 克隆数组用于排序，避免直接修改原数据顺序
            let displayEvents = [...dagData.events];
            
            if (sortMode === 'time') {
                // 按发生时间，新到旧 (时间戳大到小)
                displayEvents.sort((a, b) => b.happenTime - a.happenTime);
            } else if (sortMode === 'stars') {
                // 按星级，高到低，同星级按时间
                displayEvents.sort((a, b) => {
                    if (b.stars !== a.stars) return b.stars - a.stars;
                    return b.happenTime - a.happenTime;
                });
            }

            container.innerHTML = displayEvents.map(event => {
                const hasMyReflection = event.reflections && event.reflections[myIdentity];
                const hasPartnerReflection = event.reflections && event.reflections[partnerIdentity];
                const isExpanded = expandedItems.has(`archive_${event.id}`);
                const title = event.title || '未命名瞬间';
                
                return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-rose-100 relative overflow-hidden group transition-all">
                    <!-- 折叠头部 (点击展开/收起) -->
                    <div class="cursor-pointer flex flex-col gap-2" onclick="toggleExpand('archive_${event.id}')">
                        <div class="flex justify-between items-start">
                            <div class="font-bold text-rose-600 text-base break-words pr-2 flex-1">${title}</div>
                            <div class="text-sm tracking-widest bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100 shrink-0">${renderStarsHtml(event.stars)}</div>
                        </div>
                        
                        <div class="flex justify-between items-center text-xs text-gray-500">
                            <div class="flex items-center gap-2">
                                <span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded font-bold border border-rose-100 shrink-0">
                                    ${getCategoryIcon(event.type)} ${event.type}
                                </span>
                                <span>${formatTimestamp(event.happenTime)}</span>
                            </div>
                            <span class="text-rose-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">▼</span>
                        </div>
                        
                        <!-- 感悟小标签 (折叠时显示) -->
                        ${!isExpanded && (hasMyReflection || hasPartnerReflection) ? `
                            <div class="mt-1 flex gap-1.5 overflow-x-auto custom-scrollbar">
                                ${hasMyReflection ? `<span class="shrink-0 text-[9px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded border border-blue-100">哼哼 已感悟</span>` : ''}
                                ${hasPartnerReflection ? `<span class="shrink-0 text-[9px] bg-pink-50 text-pink-500 px-1.5 py-0.5 rounded border border-pink-100">亲亲 已感悟</span>` : ''}
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- 展开的详细内容 -->
                    <div class="overflow-hidden transition-all duration-300 ease-in-out ${isExpanded ? 'max-h-[1000px] mt-4 opacity-100' : 'max-h-0 opacity-0'}">
                        <!-- 简述 -->
                        <div class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed border-l-2 border-rose-300 pl-3 bg-rose-50/50 py-2 rounded-r-lg">
                            ${event.description}
                        </div>
                        
                        <!-- 双方感悟详情 -->
                        ${(hasMyReflection || hasPartnerReflection) ? `
                            <div class="mt-4 pt-3 border-t border-rose-100 flex flex-col gap-3">
                                ${hasPartnerReflection ? `
                                    <div class="bg-pink-50/60 p-2.5 rounded-xl border border-pink-100 relative">
                                        <span class="absolute -top-2 left-3 bg-pink-100 text-pink-600 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${partnerIdentity} 的感悟</span>
                                        <p class="text-sm text-gray-700 mt-2 whitespace-pre-wrap">${hasPartnerReflection}</p>
                                    </div>
                                ` : ''}
                                
                                ${hasMyReflection ? `
                                    <div class="bg-blue-50/60 p-2.5 rounded-xl border border-blue-100 relative">
                                        <span class="absolute -top-2 right-3 bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${myIdentity} 的感悟</span>
                                        <p class="text-sm text-gray-700 mt-2 whitespace-pre-wrap">${hasMyReflection}</p>
                                    </div>
                                ` : ''}
                            </div>
                        ` : `
                            <div class="mt-3 text-xs text-gray-400 text-center italic">还没有人写下感悟，去“事件感悟”里补充吧~</div>
                        `}
                    </div>
                </div>
                `;
            }).join('');
        }

        // === 视图 2: 保存新事件 ===
        async function saveNewEvent() {
            const titleInput = document.getElementById('eventTitle').value.trim();
            const timeInput = document.getElementById('eventTime').value;
            const descInput = document.getElementById('eventDesc').value.trim();
            const btn = document.getElementById('saveEventBtn');

            if (!titleInput) { showToast("请填写事件标题哦"); return; }
            if (!timeInput) { showToast("请填写发生时间哦"); return; }
            if (!descInput) { showToast("请简述一下事件内容"); return; }

            const happenTimeTs = new Date(timeInput).getTime();
            const eventId = Date.now(); // 用当前真实时间戳作为唯一ID

            const newEvent = {
                id: eventId,
                title: titleInput,
                happenTime: happenTimeTs,
                createTime: Date.now(),
                creator: myIdentity,
                type: newEventCategory,
                stars: newEventStars,
                description: descInput,
                reflections: {} // 初始感悟为空，双方后续可添加
            };

            btn.innerText = "正在封存..."; btn.disabled = true;

            // 插入数据 (默认放到开头，实际展示靠排序)
            dagData.events.unshift(newEvent);

            const success = await updateDagData();
            
            if (success) {
                showToast("🎉 档案封存成功！");
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventDesc').value = '';
                // 切换回档案馆查看
                setTimeout(() => switchTab('archive'), 800);
            } else {
                showToast("保存失败，请检查网络重试");
                dagData.events.shift(); // 回滚
            }
            
            btn.innerHTML = "封存入档 📦"; btn.disabled = false;
        }

        // === 视图 3: 渲染事件感悟 ===
        function renderReflections() {
            const container = document.getElementById('reflectionList');
            
            if (!dagData.events || dagData.events.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-400 py-10">档案馆空空如也，先去记录事件吧~</p>`;
                return;
            }

            // 按发生时间排序 (新到旧)
            let displayEvents = [...dagData.events].sort((a, b) => b.happenTime - a.happenTime);

            container.innerHTML = displayEvents.map(event => {
                const myReflection = (event.reflections && event.reflections[myIdentity]) || '';
                const partnerReflection = (event.reflections && event.reflections[partnerIdentity]) || '';
                const isExpanded = expandedItems.has(`reflect_${event.id}`);
                const title = event.title || '未命名瞬间';
                
                return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border-2 border-blue-50 flex flex-col transition-all group">
                    <!-- 折叠头部 (点击展开/收起) -->
                    <div class="cursor-pointer flex flex-col gap-1.5" onclick="toggleExpand('reflect_${event.id}')">
                        <div class="flex justify-between items-start">
                             <div class="font-bold text-blue-600 text-sm break-words pr-2">${title}</div>
                             <span class="text-blue-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">▼</span>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-gray-400">
                             <span class="bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100">${getCategoryIcon(event.type)} ${event.type}</span>
                             <span>${formatTimestamp(event.happenTime)}</span>
                        </div>
                        
                        <!-- 状态小绿点/红点 -->
                        ${!isExpanded ? `
                             <div class="text-[10px] mt-1 flex gap-2">
                                 <span class="${myReflection ? 'text-green-500' : 'text-gray-300'}">${myReflection ? '✓ 我已写' : '○ 我未写'}</span>
                                 <span class="${partnerReflection ? 'text-pink-500' : 'text-gray-300'}">${partnerReflection ? '✓ Ta已写' : '○ Ta未写'}</span>
                             </div>
                        ` : ''}
                    </div>

                    <!-- 展开的内容 (填写与展示区) -->
                    <div class="overflow-hidden transition-all duration-300 ease-in-out ${isExpanded ? 'max-h-[1000px] mt-3 opacity-100' : 'max-h-0 opacity-0'}">
                        
                        <!-- 事件概览 -->
                        <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100 mb-3 text-xs text-gray-500 line-clamp-3">
                            ${event.description}
                        </div>

                        <div class="flex flex-col gap-3">
                            <!-- Ta的感悟 -->
                            ${partnerReflection ? `
                                <div class="bg-pink-50/50 p-3 rounded-xl border border-pink-100 relative">
                                    <span class="absolute -top-2 left-3 bg-pink-100 text-pink-600 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${partnerIdentity} 的感悟</span>
                                    <p class="text-sm text-gray-700 mt-2 whitespace-pre-wrap">${partnerReflection}</p>
                                </div>
                            ` : `
                                <div class="text-center py-2 border border-dashed border-pink-100 rounded-xl bg-pink-50/30">
                                    <span class="text-xs text-pink-300">Ta 还在酝酿中... 💭</span>
                                </div>
                            `}

                            <!-- 我的感悟 -->
                            <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100 relative">
                                <span class="absolute -top-2 right-3 bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${myIdentity} 的感悟</span>
                                
                                <textarea id="ref_input_${event.id}" rows="2" 
                                    class="w-full mt-2 bg-white px-3 py-2 text-sm border border-blue-100 rounded-lg focus:outline-none focus:border-blue-300 resize-none text-gray-700" 
                                    placeholder="写下你对这件事的感悟或回忆...">${myReflection}</textarea>
                                
                                <div class="flex justify-end mt-2">
                                    <button onclick="saveReflection(${event.id})" id="ref_btn_${event.id}" 
                                        class="text-xs bg-blue-500 text-white px-4 py-1.5 rounded-lg shadow-sm hover:bg-blue-600 transition flex items-center gap-1">
                                        ${myReflection ? '更新 ✍️' : '保存 💾'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function saveReflection(eventId) {
            const inputEl = document.getElementById(`ref_input_${eventId}`);
            const btnEl = document.getElementById(`ref_btn_${eventId}`);
            const text = inputEl.value.trim();
            
            if (!text) {
                showToast("感悟内容不能为空哦");
                return;
            }

            // 查找事件
            const eventIndex = dagData.events.findIndex(e => e.id === eventId);
            if (eventIndex === -1) return;

            // 确保 reflections 对象存在
            if (!dagData.events[eventIndex].reflections) {
                dagData.events[eventIndex].reflections = {};
            }

            // 保存旧内容用于失败回滚
            const oldReflection = dagData.events[eventIndex].reflections[myIdentity];
            
            // 更新本地数据
            dagData.events[eventIndex].reflections[myIdentity] = text;

            btnEl.innerText = "保存中...";
            btnEl.disabled = true;

            const success = await updateDagData();

            if (success) {
                showToast("✅ 感悟保存成功！");
                btnEl.innerText = "更新感悟 ✍️";
                // 不强制全量重新渲染，以免打断用户滚动，只更新按钮状态即可
            } else {
                showToast("保存失败，请检查网络");
                // 回滚
                if (oldReflection) {
                    dagData.events[eventIndex].reflections[myIdentity] = oldReflection;
                } else {
                    delete dagData.events[eventIndex].reflections[myIdentity];
                }
                btnEl.innerText = oldReflection ? '更新感悟 ✍️' : '保存感悟 💾';
            }
            btnEl.disabled = false;
        }

        // === 工具函数 ===
        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
