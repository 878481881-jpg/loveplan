<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>默契大转盘 🎰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05), 0 2px 4px -1px rgba(225, 29, 72, 0.03);
        }

        /* 动态生成的转盘背景 */
        .wheel-bg {
            background: conic-gradient(from -22.5deg, 
                #fce7f3 0deg 45deg,      /* 吉星高照 */
                #fecdd3 45deg 90deg,     /* 破财消灾 */
                #fef08a 90deg 135deg,    /* 专属偏爱 */
                #bfdbfe 135deg 180deg,   /* 淘气小偷 */
                #ffedd5 180deg 225deg,   /* 欧气爆棚 */
                #e5e7eb 225deg 270deg,   /* 非酋附体 */
                #e0e7ff 270deg 315deg,   /* 好事成双 */
                #fef9c3 315deg 360deg    /* 保底真香 */
            );
        }
        
        /* 扇形文字定位 */
        .slice-text {
            position: absolute;
            top: 10%;
            left: 50%;
            transform-origin: 50% 100%; /* 以中心点旋转 */
            margin-left: -30px; /* 宽度的一半 */
            width: 60px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #4b5563;
            height: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 relative">

    <!-- 全局加载遮罩 -->
    <div id="globalLoader" class="fixed inset-0 bg-white/80 backdrop-blur-md z-[100] flex flex-col items-center justify-center hidden">
        <svg class="animate-spin h-12 w-12 text-rose-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-rose-600 font-bold tracking-wider" id="loaderText">正在连接运气中心...</span>
    </div>
    
    <header class="text-center mb-4 max-w-md mt-2 w-full flex justify-between items-center px-2">
        <a href="index.html" class="p-2.5 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 hover:bg-rose-50 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div class="animate-float">
            <h1 class="text-2xl font-black text-rose-500 flex items-center justify-center gap-2 drop-shadow-sm">
               <span>🎰</span> 默契大转盘
            </h1>
        </div>
        <div class="w-10 h-10"></div> <!-- 占位保持居中 -->
    </header>

    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="index.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">返回首页</a>
        <a href="moqi_2.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">默契考验</a>
        <a href="#" class="px-5 py-2 bg-gradient-to-r from-rose-400 to-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">大转盘</a>
    </div>

    <div class="w-full max-w-md glass-panel rounded-2xl p-4 mb-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-rose-200 to-pink-300 flex items-center justify-center text-xl shadow-sm border-2 border-white">
                <span id="myAvatar">🐰</span>
            </div>
            <div>
                <div class="text-xs text-gray-500 font-medium mb-0.5">我的身份</div>
                <div class="font-bold text-rose-600 tracking-wide" id="myIdentityName">加载中...</div>
            </div>
        </div>
        <div class="text-right bg-rose-50 px-4 py-2 rounded-xl border border-rose-100">
            <div class="text-xs text-rose-400 font-bold mb-0.5">当前积分</div>
            <div class="font-black text-2xl text-amber-500 drop-shadow-sm flex items-center justify-end gap-1">
                🪙 <span id="myPoints">--</span>
            </div>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col items-center flex-1">
        
        <!-- 转盘容器 -->
        <div class="relative w-[300px] h-[300px] mb-8">
            <!-- 顶部的指针 -->
            <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 z-20 drop-shadow-md text-rose-600">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L22 10L12 22L2 10L12 2Z" />
                </svg>
            </div>

            <!-- 外边框装饰 -->
            <div class="absolute inset-0 rounded-full border-[8px] border-rose-200 shadow-xl z-10 pointer-events-none box-border flex items-center justify-center">
                 <!-- 内部灯泡点缀 -->
                 <div class="w-full h-full rounded-full border-2 border-white/50 border-dashed animate-[spin_10s_linear_infinite]"></div>
            </div>

            <!-- 旋转主体 -->
            <div id="wheel" class="w-full h-full rounded-full wheel-bg transition-transform duration-[4000ms] cubic-bezier(0.1, 0, 0.15, 1) relative overflow-hidden shadow-inner" style="transform: rotate(0deg);">
                <!-- JS 动态注入文字 -->
            </div>

            <!-- 中心抽奖按钮 -->
            <button id="spinBtn" onclick="spinWheel()" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-gradient-to-b from-white to-rose-100 rounded-full z-20 shadow-[0_4px_15px_rgba(225,29,72,0.3)] border-4 border-white flex flex-col items-center justify-center transition-transform hover:scale-105 active:scale-95 disabled:opacity-80 disabled:cursor-not-allowed">
                <span class="text-xl font-black text-rose-500 tracking-widest ml-1">抽</span>
                <span id="spinCostText" class="text-[10px] text-gray-400 font-bold mt-0.5">加载中</span>
            </button>
        </div>

        <!-- 状态与规则提示 -->
        <div class="flex w-full justify-between items-center mb-6 px-2">
            <div class="bg-white/80 px-4 py-2 rounded-full text-xs font-bold text-gray-500 shadow-sm border border-rose-100 flex items-center gap-1.5">
                <span class="text-rose-400">📅</span> 今日剩余次数：<span id="remainCount" class="text-rose-600 text-sm">--</span> / 5
            </div>
            <div class="text-xs text-gray-400 font-medium bg-white/50 px-3 py-1.5 rounded-full border border-gray-100">
                ⚠️ 每日 0 点重置
            </div>
        </div>

        <!-- 抽奖历史 -->
        <div class="w-full bg-white/70 p-1.5 rounded-2xl shadow-sm border border-rose-100 backdrop-blur-sm flex-1 flex flex-col min-h-[200px]">
            <div class="w-full text-left px-3 py-3 border-b border-rose-50 flex justify-between items-center">
                <h3 class="text-sm font-bold text-rose-500 flex items-center gap-1.5">
                    <span>📜</span> 我的抽奖记录
                </h3>
            </div>
            <div id="historyList" class="w-full space-y-0 max-h-[250px] overflow-y-auto no-scrollbar p-2 flex-1">
                <!-- 由 JS 渲染 -->
                <div class="text-center text-gray-400 text-xs py-8">暂无记录，快去试试手气吧~</div>
            </div>
        </div>

    </main>

    <!-- 结果展示弹窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl w-full max-w-[280px] p-6 flex flex-col items-center text-center transform scale-95 transition-transform duration-300 shadow-2xl relative overflow-hidden" id="resultModalContent">
            <!-- 装饰背景 -->
            <div class="absolute -top-10 -right-10 w-24 h-24 bg-rose-100 rounded-full blur-xl opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-amber-100 rounded-full blur-xl opacity-50"></div>
            
            <div id="resultIcon" class="text-5xl mb-4 relative z-10 animate-bounce">🎁</div>
            <h2 id="resultTitle" class="text-xl font-black mb-1 text-gray-800 relative z-10">抽奖结果</h2>
            <p id="resultDesc" class="text-sm font-bold text-rose-500 mb-6 relative z-10">...</p>
            
            <button onclick="closeResultModal()" class="w-full py-3 bg-gradient-to-r from-rose-400 to-rose-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm active:scale-95 relative z-10">
                开心收下
            </button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-12 left-1/2 transform -translate-x-1/2 bg-gray-800/95 backdrop-blur text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <script>
        // ----------------------------------------------------
        // 1. 基础配置与身份验证
        // ----------------------------------------------------
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity'); // '哼哼' 或 '亲亲'

        if (!GITHUB_TOKEN || !myIdentity) {
            document.body.innerHTML = '<div class="flex h-screen items-center justify-center text-rose-500 font-bold text-center p-4">未检测到登录信息，请从原系统登录。</div>';
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('myIdentityName').innerText = myIdentity;
        document.getElementById('myAvatar').innerText = myIdentity === '哼哼' ? '🐰' : '🐱';
        
        // 仓库配置
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_CK_H = 'data/hck.json'; // 哼哼积分
        const FILE_CK_Q = 'data/qck.json'; // 亲亲积分
        const FILE_DZP_H = 'data/hdzp.json'; // 哼哼转盘数据
        const FILE_DZP_Q = 'data/qdzp.json'; // 亲亲转盘数据
        
        const myCkPath = myIdentity === '哼哼' ? FILE_CK_H : FILE_CK_Q;
        const partnerCkPath = myIdentity === '哼哼' ? FILE_CK_Q : FILE_CK_H;
        const myDzpPath = myIdentity === '哼哼' ? FILE_DZP_H : FILE_DZP_Q;

        // 全局状态
        let myCkData = { points: 0 };
        let myDzpData = { date: '', count: 0, history: [] };
        
        let isSpinning = false;
        let currentRotation = 0; // 记录转盘当前角度，保证连续旋转不回退

        // 转盘奖项配置 (8个，按顺时针在转盘上的位置排列 0-7)
        // 每个切片占 45 度 (360 / 8)
        const prizes = [
            { id: 0, title: "吉星高照", desc: "+3分", me: 3, partner: 0, icon: "🌟" },
            { id: 1, title: "破财消灾", desc: "-3分", me: -3, partner: 0, icon: "💸" },
            { id: 2, title: "专属偏爱", desc: "TA+3分", me: 0, partner: 3, icon: "💌" },
            { id: 3, title: "淘气小偷", desc: "偷TA 3分", me: 3, partner: -3, icon: "🥷" },
            { id: 4, title: "欧气爆棚", desc: "+5分", me: 5, partner: 0, icon: "💎" },
            { id: 5, title: "非酋附体", desc: "-5分", me: -5, partner: 0, icon: "🌚" },
            { id: 6, title: "好事成双", desc: "+2分", me: 2, partner: 0, icon: "✌️" },
            { id: 7, title: "保底真香", desc: "+1分", me: 1, partner: 0, icon: "🍬" }
        ];

        // ----------------------------------------------------
        // 2. 核心网络通讯 (防缓存、防冲突机制)
        // ----------------------------------------------------
        window.onload = async function() {
            initWheelUI();
            showLoader("正在连接运气中心...");
            await fetchAllData();
            hideLoader();
            renderUI();
        };

        // 强力读取函数，附带时间戳和防缓存头，击穿 GitHub 缓存
        async function fetchFile(filePath) {
            try {
                const ts = new Date().getTime();
                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${ts}`, {
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                
                if (res.status === 404) return { data: {}, sha: null }; 
                if (!res.ok) throw new Error('API Error');
                
                const result = await res.json();
                const content = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(content || '{}'), sha: result.sha };
            } catch (e) {
                console.error("读取失败", e);
                return { data: {}, sha: null };
            }
        }

        async function updateFile(filePath, dataObj, sha) {
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))); 
                const body = { message: `Tacit wheel update ${new Date().getTime()}`, content: content };
                if (sha) body.sha = sha;

                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', 
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('Update failed');
                const result = await res.json();
                return { success: true, sha: result.content.sha };
            } catch (e) {
                console.error("保存失败", e);
                return { success: false, sha: null };
            }
        }

        // 获取并清洗数据，结合本地存储实现双重校验防白嫖
        async function fetchAllData() {
            const [meCk, meDzp] = await Promise.all([
                fetchFile(myCkPath), fetchFile(myDzpPath)
            ]);
            
            // 【数据隔离1】强制清理积分数据，绝不允许混入对象
            myCkData = { points: 20 }; // 默认兜底
            if (meCk.data && typeof meCk.data.points !== 'undefined') {
                myCkData.points = parseInt(meCk.data.points) || 0;
            }
            
            // 获取转盘数据
            let remoteDzp = Object.assign({ date: '', count: 0, history: [] }, meDzp.data);
            
            // 【双重校验】对抗刷新导致的缓存回退
            const todayStr = new Date().toLocaleDateString();
            let localDzpStr = localStorage.getItem(`loveGacha_dzp_${myIdentity}`);
            let localDzp = localDzpStr ? JSON.parse(localDzpStr) : { date: '', count: 0 };
            
            // 日期不符则清零
            if (remoteDzp.date !== todayStr) { remoteDzp.count = 0; remoteDzp.history = []; }
            if (localDzp.date !== todayStr) { localDzp.count = 0; }
            
            // 取本地和远端中，已抽奖次数更大的作为真实数据 (防止网络缓存导致次数变少)
            myDzpData.date = todayStr;
            myDzpData.count = Math.max(parseInt(remoteDzp.count) || 0, parseInt(localDzp.count) || 0);
            myDzpData.history = remoteDzp.history || [];
            
            // 同步回本地
            localStorage.setItem(`loveGacha_dzp_${myIdentity}`, JSON.stringify(myDzpData));
        }

        // ----------------------------------------------------
        // 3. UI 渲染与转盘绘制
        // ----------------------------------------------------
        function initWheelUI() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            
            // 生成8个扇形的文字标签
            prizes.forEach((prize, index) => {
                const angle = index * 45; 
                const el = document.createElement('div');
                el.className = 'slice-text';
                // 旋转元素使其对准对应的色块区域
                el.style.transform = `rotate(${angle}deg)`;
                
                el.innerHTML = `
                    <span class="text-xs font-black tracking-widest text-gray-800 drop-shadow-sm mb-1">${prize.title}</span>
                    <span class="text-[10px] font-bold ${prize.me < 0 || prize.partner < 0 ? 'text-gray-500' : 'text-rose-600'} bg-white/70 px-1.5 py-0.5 rounded-md border border-white/50 shadow-sm">${prize.desc}</span>
                `;
                wheel.appendChild(el);
            });
        }

        function renderUI() {
            // 更新积分展示
            document.getElementById('myPoints').innerText = myCkData.points;
            
            // 更新次数限制展示
            const remain = Math.max(0, 5 - myDzpData.count);
            document.getElementById('remainCount').innerText = remain;
            
            // 更新按钮状态
            const isFree = (myDzpData.count === 0);
            const btnCostText = document.getElementById('spinCostText');
            if (remain <= 0) {
                btnCostText.innerText = "明日再来";
                btnCostText.className = "text-[10px] text-gray-500 font-bold mt-0.5";
            } else if (isFree) {
                btnCostText.innerText = "今日首抽免费";
                btnCostText.className = "text-[10px] text-emerald-500 font-bold mt-0.5 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100";
            } else {
                btnCostText.innerText = "消耗 1 积分";
                btnCostText.className = "text-[10px] text-rose-400 font-bold mt-0.5";
            }

            // 更新历史记录列表
            const hList = document.getElementById('historyList');
            if (!myDzpData.history || myDzpData.history.length === 0) {
                hList.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">暂无记录，快去试试手气吧~</div>`;
            } else {
                hList.innerHTML = myDzpData.history.map(item => `
                    <div class="px-3 py-2.5 border-b border-gray-50 text-xs flex justify-between items-center bg-white/40 hover:bg-white/80 transition-colors rounded-lg mb-1">
                        <span class="text-gray-400 font-medium">${item.time}</span>
                        <span class="font-bold text-gray-700 bg-white px-2 py-1 rounded shadow-sm border border-gray-100">${item.desc}</span>
                    </div>
                `).join('');
            }
        }

        // ----------------------------------------------------
        // 4. 核心抽奖逻辑 (防白嫖、即时保存)
        // ----------------------------------------------------
        async function spinWheel() {
            if (isSpinning) return;
            
            const remain = 5 - myDzpData.count;
            if (remain <= 0) {
                showToast("今天的 5 次机会已经用完啦，明天再来吧！");
                return;
            }

            const isFree = (myDzpData.count === 0);
            if (!isFree && myCkData.points < 1) {
                showToast("积分不足 1 🪙，先去答题赚点积分吧！");
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').classList.add('opacity-80', 'scale-95');

            // 1. 抽取结果
            const prizeIndex = Math.floor(Math.random() * 8);
            const prize = prizes[prizeIndex];

            // 2. 计算并执行旋转动画
            // 每次固定多转 5 圈 (360*5)，加上目标奖项需要回退的角度
            // 因为转盘按顺时针绘制，0号在正上方，要让目标停在正上方，需反向旋转 (360 - 角度)
            const extraSpins = 360 * 5; 
            const targetAngle = 360 - (prizeIndex * 45); 
            currentRotation += extraSpins + targetAngle - (currentRotation % 360); 
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // 3. 本地即时预扣除，制造安全锁 (防止狂按刷新)
            if (!isFree) myCkData.points -= 1;
            myDzpData.count += 1;
            
            const historyObj = {
                id: Date.now(),
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                desc: `${prize.title} (${prize.desc})`
            };
            myDzpData.history.unshift(historyObj); // 添加到头部
            if (myDzpData.history.length > 30) myDzpData.history.pop(); // 最多保留30条
            
            renderUI();
            // 上本地锁
            localStorage.setItem(`loveGacha_dzp_${myIdentity}`, JSON.stringify({
                date: myDzpData.date,
                count: myDzpData.count
            }));

            // 4. 动画期间【隐蔽、即时地】请求 API 同步数据
            let apiSuccess = false;
            const uploadPromise = (async () => {
                try {
                    // A. 【绝对安全策略】在这一秒重新拉取最新的 ck，防止旧 sha 导致冲突
                    const latestCk = await fetchFile(myCkPath);
                    let newPts = parseInt(latestCk.data.points);
                    if(isNaN(newPts)) newPts = 0; // 防御性清洗
                    
                    if (!isFree) newPts -= 1; // 扣除门票
                    newPts += prize.me; // 增加奖项带来的自身积分变化
                    newPts = Math.max(0, newPts); // 积分不为负
                    
                    const upCk = await updateFile(myCkPath, { points: newPts }, latestCk.sha);
                    if (!upCk.success) throw new Error("My CK Update failed");

                    // B. 【更新对方积分】(例如偷取，或专属偏爱)
                    if (prize.partner !== 0) {
                        const lPartnerCk = await fetchFile(partnerCkPath);
                        let pPts = parseInt(lPartnerCk.data.points);
                        if(isNaN(pPts)) pPts = 0;
                        
                        pPts += prize.partner;
                        pPts = Math.max(0, pPts); // 防御：对方积分最低扣到 0
                        
                        const upPartner = await updateFile(partnerCkPath, { points: pPts }, lPartnerCk.sha);
                        if (!upPartner.success) throw new Error("Partner CK Update failed");
                    }

                    // C. 【更新次数与历史记录】
                    const latestDzp = await fetchFile(myDzpPath);
                    let newDzp = { ...latestDzp.data }; // 继承可能有用的远端字段
                    newDzp.date = myDzpData.date;
                    newDzp.count = myDzpData.count; // 写入刚刚加过的次数
                    newDzp.history = myDzpData.history;
                    
                    const upDzp = await updateFile(myDzpPath, newDzp, latestDzp.sha);
                    if (!upDzp.success) throw new Error("DZP Update failed");

                    return true;
                } catch (error) {
                    console.error("API Error during spin:", error);
                    return false;
                }
            })();

            // 5. 等待动画结束 (4000ms)，结算界面并确保请求完成
            setTimeout(async () => {
                document.getElementById('spinBtn').classList.remove('opacity-80', 'scale-95');
                
                // 等待请求结束（网络慢的情况下可能会出现loading）
                apiSuccess = await uploadPromise;

                if (apiSuccess) {
                    // 刷新一下显示最新状态
                    await fetchAllData();
                    renderUI();
                    showResultModal(prize);
                } else {
                    // 极其罕见的失败情况：撤销本地预扣除，恢复状态
                    showToast("网络连接不稳定，这把不算，积分已返还 😥");
                    if (!isFree) myCkData.points += 1;
                    myDzpData.count = Math.max(0, myDzpData.count - 1);
                    myDzpData.history.shift(); // 移除刚才那条记录
                    
                    // 恢复本地锁
                    localStorage.setItem(`loveGacha_dzp_${myIdentity}`, JSON.stringify({
                        date: myDzpData.date, count: myDzpData.count
                    }));
                    renderUI();
                }
                
                isSpinning = false;
            }, 4100); 
        }

        // ----------------------------------------------------
        // 5. 通用工具与弹窗组件
        // ----------------------------------------------------
        function showResultModal(prize) {
            const modal = document.getElementById('resultModal');
            document.getElementById('resultIcon').innerText = prize.icon;
            
            let titleColor = "text-gray-800";
            if(prize.me > 0) titleColor = "text-emerald-500";
            if(prize.me < 0) titleColor = "text-gray-500";
            if(prize.partner > 0) titleColor = "text-amber-500";
            
            document.getElementById('resultTitle').className = `text-xl font-black mb-1 relative z-10 ${titleColor}`;
            document.getElementById('resultTitle').innerText = prize.title;
            
            let descHtml = '';
            if (prize.me !== 0) descHtml += `你的积分 <span class="font-bold text-lg">${prize.me > 0 ? '+'+prize.me : prize.me}</span><br>`;
            if (prize.partner > 0) descHtml += `TA的积分 <span class="font-bold text-lg text-amber-500">+${prize.partner}</span><br>太有爱啦~`;
            if (prize.partner < 0) descHtml += `TA的积分 <span class="font-bold text-lg text-gray-500">${prize.partner}</span><br>嘿嘿，被你顺走了`;
            if (prize.me === 0 && prize.partner === 0) descHtml = "平平安安就是福~";
            
            document.getElementById('resultDesc').innerHTML = descHtml;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('resultModalContent').classList.remove('scale-95');
            }, 10);
        }

        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            document.getElementById('resultModalContent').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function showLoader(text) {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

    </script>
</body>
</html>
