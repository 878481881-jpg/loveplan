<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘 🎡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow-x: hidden; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.05), 0 2px 4px -1px rgba(225, 29, 72, 0.03);
        }

        /* 转盘样式更新为图片布局 */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
            border-radius: 50%;
            /* 外圈粉色粗边框效果 */
            padding: 12px;
            background: #ffcce0;
            box-shadow: inset 0 0 10px rgba(255, 153, 204, 0.3), 0 10px 20px rgba(225, 29, 72, 0.15);
        }
        
        .wheel-inner-border {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            /* 虚线内边框效果 */
            border: 2px dashed #fff;
            padding: 4px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1); /* 优雅的减速效果 */
            transform: rotate(0deg);
            /* 8个扇形的背景色，对应图片柔和色调 */
            background: conic-gradient(
                #fff0f5 0deg 45deg,    /* 1. 吉星高照 +3 (浅粉) */
                #ffe4e1 45deg 90deg,   /* 2. 破财消灾 -3 (粉灰) */
                #fffacd 90deg 135deg,  /* 3. 专属偏爱 TA+3 (浅黄) */
                #d3ebff 135deg 180deg, /* 4. 淘气小偷 偷3 (浅蓝) */
                #ffebd2 180deg 225deg, /* 5. 欧气爆棚 +5 (浅橙) */
                #f0f4f8 225deg 270deg, /* 6. 非酋附体 -5 (浅灰) */
                #e6e6fa 270deg 315deg, /* 7. 好事成双 +2 (浅紫) */
                #ffffe0 315deg 360deg  /* 8. 保底真香 +1 (浅黄白) */
            );
        }
        
        /* 定位文字 */
        .wheel-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            text-align: center;
            width: 120px;
            /* 调整向外偏移量使文字靠近边缘 */
            padding-top: 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .wheel-text-title {
            font-size: 14px;
            font-weight: 900;
            color: #374151;
            /* 文字沿圆弧方向轻微旋转，但由于用 rotate 定位，这里保持默认即可 */
        }

        .wheel-text-score {
            font-size: 11px;
            font-weight: 700;
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .score-red { color: #e11d48; }
        .score-gray { color: #6b7280; }

        /* 顶部菱形指针 */
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 24px;
            height: 24px;
            background: #e11d48;
            border-radius: 4px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(225, 29, 72, 0.4);
        }
        
        /* 中心抽奖按钮 */
        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86px;
            height: 86px;
            background: #fff;
            border-radius: 50%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1), inset 0 0 15px rgba(255,200,200,0.3);
            border: 4px solid #ffedf5;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .wheel-center-btn:active {
            transform: translate(-50%, -48%) scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .wheel-center-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
            filter: grayscale(0.5);
        }

        .center-btn-text {
            font-size: 26px;
            font-weight: 900;
            color: #e11d48;
            line-height: 1;
            margin-bottom: 2px;
        }
        
        .center-btn-sub {
            font-size: 10px;
            font-weight: 700;
            color: #059669; /* 默认免费绿色 */
            background: #ecfdf5;
            padding: 2px 6px;
            border-radius: 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 relative">

    <!-- 全局加载遮罩 -->
    <div id="globalLoader" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <svg class="animate-spin h-10 w-10 text-rose-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span class="text-rose-600 font-medium" id="loaderText">正在连接转盘...</span>
    </div>
    
    <header class="text-center mb-4 max-w-md animate-float mt-2 w-full flex justify-between items-center px-2">
        <a href="javascript:history.back()" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-black text-rose-500 flex items-center justify-center gap-2">
               <span>🎰</span> 默契大转盘
            </h1>
        </div>
        <div class="w-9 h-9"></div> 
    </header>

    <!-- 导航栏 -->
    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="index.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-100 transition-all text-sm whitespace-nowrap">返回首页</a>
        <a href="moqi.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-100 transition-all text-sm whitespace-nowrap">默契考验</a>
        <a href="wheel.html" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">大转盘</a>
    </div>
    
    <!-- 顶部状态栏 -->
    <div class="w-full max-w-md bg-white/90 backdrop-blur-sm rounded-3xl p-4 mb-8 flex justify-between items-center shadow-sm border border-rose-100">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-pink-200 flex items-center justify-center text-2xl shadow-inner border-2 border-white">
                <span id="myAvatar">🐰</span>
            </div>
            <div>
                <div class="text-xs text-gray-500 mb-0.5 font-bold">我的身份</div>
                <div class="font-black text-rose-500 text-lg leading-none" id="myIdentityName">哼哼</div>
            </div>
        </div>
        <div class="bg-rose-50 px-4 py-2.5 rounded-2xl border border-rose-100 text-right flex flex-col items-center justify-center min-w-[80px]">
            <div class="text-[10px] text-rose-400 font-bold mb-0.5">当前积分</div>
            <div class="font-black text-2xl text-amber-500 drop-shadow-sm flex items-center gap-1 leading-none">
                <span class="text-lg">🪙</span><span id="myPoints">--</span>
            </div>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col items-center">
        
        <!-- 抽奖区域 -->
        <div class="w-full pt-4 pb-2 flex flex-col items-center relative overflow-hidden mb-6">
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel-inner-border">
                    <div class="wheel" id="wheel">
                        <!-- 动态生成扇形文字 -->
                    </div>
                </div>
                
                <!-- 中心抽奖按钮 -->
                <button id="centerSpinBtn" class="wheel-center-btn" onclick="startSpin()">
                    <span class="center-btn-text">抽</span>
                    <span id="centerBtnSubText" class="center-btn-sub">今日首抽免费</span>
                </button>
            </div>
        </div>

        <!-- 底部状态信息栏 -->
        <div class="w-full flex justify-between items-center px-1 mb-6">
            <div class="bg-white/90 backdrop-blur-sm px-4 py-2.5 rounded-2xl shadow-sm border border-rose-100 flex items-center gap-1.5 text-sm font-bold text-gray-700">
                <span>📅</span> 
                今日剩余次数: 
                <span id="remainCount" class="text-rose-500 text-base mx-1">5</span>
                <span class="text-gray-400 font-normal">/ 5</span>
            </div>
            <div class="bg-white/90 backdrop-blur-sm px-4 py-2.5 rounded-2xl shadow-sm border border-rose-100 flex items-center gap-1.5 text-xs text-gray-500">
                <span class="text-amber-500 font-bold">⚠️</span> 每日 0 点重置
            </div>
        </div>

        <!-- 历史记录区域 -->
        <div class="w-full bg-white/90 backdrop-blur-sm rounded-3xl p-5 mb-8 shadow-sm border border-rose-100 mt-2">
            <div class="text-left mb-4 flex justify-between items-end border-b border-rose-50 pb-3">
                <h3 class="text-base font-black text-rose-500 flex items-center gap-2">
                    <span>📜</span> 我的抽奖记录
                </h3>
            </div>
            <div id="historyList" class="w-full space-y-3 min-h-[100px] flex flex-col justify-center">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

    </main>

    <!-- 结果展示弹窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl w-full max-w-[320px] p-6 flex flex-col items-center text-center transform scale-95 transition-transform duration-300 relative overflow-hidden">
            <div id="resultDeco" class="absolute -top-10 -right-10 text-8xl opacity-10 rotate-12">🎁</div>
            <div id="resultIcon" class="text-6xl mb-4 animate-bounce relative z-10">🎉</div>
            <h2 id="resultTitle" class="text-2xl font-bold mb-2 text-rose-500 relative z-10">小确幸</h2>
            <div id="resultDesc" class="text-base font-medium text-gray-600 mb-6 relative z-10 bg-gray-50 px-4 py-2 rounded-lg w-full">获得 3 积分</div>
            <button onclick="closeResultModal()" class="w-full py-3 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 transition-colors shadow-md relative z-10">
                开心收下
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium hidden z-[70] whitespace-nowrap border border-gray-700"></div>

    <script>
        // --- 1. 配置与身份验证 ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity'); 

        if (!GITHUB_TOKEN || !myIdentity) {
            document.body.innerHTML = '<div class="flex h-screen items-center justify-center text-rose-500 font-bold text-center p-4">未检测到登录信息。<br><br>将启用本地演示模式...</div>';
            setTimeout(() => {
                localStorage.setItem('loveGacha_githubToken', 'DEMO_TOKEN');
                localStorage.setItem('loveGacha_myIdentity', '哼哼');
                window.location.reload();
            }, 1500);
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('myAvatar').innerText = myIdentity === '哼哼' ? '🐰' : '🐱';
        document.getElementById('myIdentityName').innerText = myIdentity;
        
        // 仓库配置
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_CK_H = 'data/hck.json'; 
        const FILE_CK_Q = 'data/qck.json'; 
        const FILE_DZ_H = 'data/hdzp.json'; // 哼哼的大转盘记录
        const FILE_DZ_Q = 'data/qdzp.json'; // 亲亲的大转盘记录
        
        const myCkPath = myIdentity === '哼哼' ? FILE_CK_H : FILE_CK_Q;
        const partnerCkPath = myIdentity === '哼哼' ? FILE_CK_Q : FILE_CK_H;
        const myDzPath = myIdentity === '哼哼' ? FILE_DZ_H : FILE_DZ_Q;
        const partnerDzPath = myIdentity === '哼哼' ? FILE_DZ_Q : FILE_DZ_H;

        // --- 2. 转盘奖项配置 (8个) ---
        // 注意：顺序必须与CSS的 conic-gradient 严格对应
        const prizes = [
            { id: 0, name: "吉星高照", desc: "获得 3 积分",   shortDesc: "+3分", scoreClass: "score-red",  myChange: 3,  partnerChange: 0 },
            { id: 1, name: "破财消灾", desc: "减少 3 积分",   shortDesc: "-3分", scoreClass: "score-gray", myChange: -3, partnerChange: 0 },
            { id: 2, name: "专属偏爱", desc: "TA获得 3 积分", shortDesc: "TA+3分", scoreClass: "score-red",  myChange: 0,  partnerChange: 3 },
            { id: 3, name: "淘气小偷", desc: "偷取TA 3 积分", shortDesc: "偷TA 3分", scoreClass: "score-gray", myChange: 3,  partnerChange: -3 },
            { id: 4, name: "欧气爆棚", desc: "获得 5 积分",   shortDesc: "+5分", scoreClass: "score-red",  myChange: 5,  partnerChange: 0 },
            { id: 5, name: "非酋附体", desc: "减少 5 积分",   shortDesc: "-5分", scoreClass: "score-gray", myChange: -5, partnerChange: 0 },
            { id: 6, name: "好事成双", desc: "获得 2 积分",   shortDesc: "+2分", scoreClass: "score-red",  myChange: 2,  partnerChange: 0 },
            { id: 7, name: "保底真香", desc: "获得 1 积分",   shortDesc: "+1分", scoreClass: "score-red",  myChange: 1,  partnerChange: 0 }
        ];

        // 全局状态
        let myCkData = { points: 0 };
        let partnerCkData = { points: 0 };
        let myDzData = { lastDate: '', dailySpins: 0, history: [] };
        let partnerDzData = { lastDate: '', dailySpins: 0, history: [] };
        
        let fileShas = {}; // 存储4个文件的SHA
        let isSpinning = false;
        let currentRotation = 0; // 累计旋转角度

        // 简化的GitHub API读取
        async function fetchFile(filePath) {
            try {
                const ts = new Date().getTime();
                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${ts}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                
                if (res.status === 404) return { data: null, sha: null }; 
                if (!res.ok) throw new Error('API Error');
                
                const result = await res.json();
                const content = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                return { data: JSON.parse(content || '{}'), sha: result.sha };
            } catch (e) {
                console.warn(`[Mock] 读取 ${filePath} 失败，使用本地测试数据`);
                return { data: null, sha: 'mock_sha_' + Math.random() };
            }
        }

        // 简化的GitHub API写入
        async function updateFile(filePath, dataObj, shaKey) {
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))); 
                const body = { message: `Wheel update ${new Date().getTime()}`, content: content };
                if (fileShas[shaKey] && !fileShas[shaKey].startsWith('mock_sha')) {
                    body.sha = fileShas[shaKey];
                }

                const res = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', 
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('Update failed');
                const result = await res.json();
                fileShas[shaKey] = result.content.sha; // 更新SHA
                return true;
            } catch (e) {
                console.warn(`[Mock] 写入 ${filePath} 失败，模拟成功`);
                fileShas[shaKey] = 'mock_sha_' + Math.random();
                return true;
            }
        }

        window.onload = async function() {
            initWheelUI();
            showLoader("正在同步数据...");
            await fetchAllData();
            checkDailyReset();
            hideLoader();
            renderUI();
        };

        function initWheelUI() {
            const wheel = document.getElementById('wheel');
            let html = '';
            // 每一个奖项占据 45 度。
            // 为了让文字居中指向外侧，需要设置旋转角度，并稍微向内平移
            prizes.forEach((prize, i) => {
                const angle = i * 45 + 22.5; 
                html += `
                    <div class="wheel-text" style="transform: rotate(${angle}deg) translate(-50%, -130px);">
                        <div class="wheel-text-title" style="transform: rotate(90deg)">
                            <div style="writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px;">${prize.name}</div>
                        </div>
                        <div class="wheel-text-score ${prize.scoreClass}" style="transform: rotate(90deg) translateX(5px)">
                            ${prize.shortDesc}
                        </div>
                    </div>
                `;
            });
            
            // 针对文字排版的特殊处理：
            // 我们希望文字是沿着半径方向的。
            // 在上面的布局中，文字容器的中心通过 rotate 放在了正确角度。
            // 接着将内部文字内容旋转90度，使其沿半径方向排列。
            
            // 重新编写生成逻辑以更好地适应图片中的横向/径向排列
            html = '';
            prizes.forEach((prize, i) => {
                const angle = i * 45 + 22.5;
                // 计算每个区块内容容器的定位。
                // 容器初始在圆心(top:50%, left:50%)。
                // 先 rotate 到该区块的中线角度，然后 translateY 把它推到靠近边缘的位置。
                // 因为默认 translateY 是向上(0度方向)，所以直接推移。
                html += `
                    <div class="absolute top-1/2 left-1/2 flex flex-col items-center justify-center gap-1.5" 
                         style="transform: translate(-50%, -50%) rotate(${angle}deg) translateY(-100px); width: 60px;">
                         <span class="wheel-text-title font-bold text-gray-800 text-[13px] leading-tight" style="transform: rotate(180deg); writing-mode: vertical-rl; text-orientation: mixed;">
                            ${prize.name}
                         </span>
                         <span class="wheel-text-score ${prize.scoreClass} text-[10px] font-black bg-white/90 px-2 py-0.5 rounded-full shadow-sm" style="transform: rotate(180deg);">
                            ${prize.shortDesc}
                         </span>
                    </div>
                `;
            });
            wheel.innerHTML = html;
        }

        async function fetchAllData() {
            const [meCk, pCk, meDz, pDz] = await Promise.all([
                fetchFile(myCkPath), fetchFile(partnerCkPath),
                fetchFile(myDzPath), fetchFile(partnerDzPath)
            ]);
            
            myCkData = meCk.data || { points: 20 };
            partnerCkData = pCk.data || { points: 20 };
            myDzData = meDz.data || { lastDate: '', dailySpins: 0, history: [] };
            partnerDzData = pDz.data || { lastDate: '', dailySpins: 0, history: [] };
            
            fileShas['myCk'] = meCk.sha;
            fileShas['pCk'] = pCk.sha;
            fileShas['myDz'] = meDz.sha;
            fileShas['pDz'] = pDz.sha;
        }

        function checkDailyReset() {
            const today = new Date().toLocaleDateString();
            if (myDzData.lastDate !== today) {
                myDzData.lastDate = today;
                myDzData.dailySpins = 0;
            }
            if (partnerDzData.lastDate !== today) {
                partnerDzData.lastDate = today;
                partnerDzData.dailySpins = 0;
            }
        }

        function renderUI() {
            document.getElementById('myPoints').innerText = myCkData.points;
            
            const remainedSpins = 5 - myDzData.dailySpins;
            document.getElementById('remainCount').innerText = remainedSpins;
            
            const centerBtn = document.getElementById('centerSpinBtn');
            const subText = document.getElementById('centerBtnSubText');

            if (myDzData.dailySpins >= 5) {
                centerBtn.classList.add('disabled');
                subText.innerText = "明日再来";
                subText.className = "center-btn-sub bg-gray-100 text-gray-500";
            } else if (myDzData.dailySpins === 0) {
                centerBtn.classList.remove('disabled');
                subText.innerText = "今日首抽免费";
                subText.className = "center-btn-sub bg-emerald-50 text-emerald-600";
            } else {
                centerBtn.classList.remove('disabled');
                subText.innerText = "消耗 1 积分";
                subText.className = "center-btn-sub bg-rose-50 text-rose-500";
            }

            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            
            // 合并双方的历史记录并按时间倒序排列
            let combined = [];
            if(myDzData.history) combined.push(...myDzData.history.map(h => ({...h, owner: 'me'})));
            if(partnerDzData.history) combined.push(...partnerDzData.history.map(h => ({...h, owner: 'partner'})));
            
            // 过滤：对方的记录中，只显示那些包含"偷取"或我受益的记录 (交互类)
            // 根据需求：“如果对方偷取积分了，这里也要显示”
            combined = combined.filter(item => {
                if (item.owner === 'me') return true; 
                // 对方的记录中，标记了 interaction=true 的才显示
                if (item.owner === 'partner' && item.isInteraction) return true;
                return false;
            });

            // 按时间倒序
            combined.sort((a, b) => b.timestamp - a.timestamp);

            if (combined.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 text-sm py-8">暂无记录，快去试试手气吧~</div>`;
                return;
            }

            let html = '';
            // 只显示最近20条
            combined.slice(0, 20).forEach(item => {
                const isMe = item.owner === 'me';
                const timeStr = new Date(item.timestamp).toLocaleString([], {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                
                // 颜色逻辑
                let bgColor = isMe ? 'bg-white' : 'bg-rose-50';
                let icon = isMe ? '🎡' : '🐾';
                let titleColor = isMe ? 'text-gray-700' : 'text-rose-600';
                let titlePrefix = isMe ? '我抽中了' : 'TA的行为';

                if (!isMe) {
                    icon = item.type === 'steal' ? '😱' : '🎁';
                }

                html += `
                    <div class="${bgColor} p-3 rounded-xl shadow-sm border border-gray-100 flex items-start gap-3">
                        <div class="text-2xl mt-1">${icon}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-0.5">
                                <span class="text-xs font-bold ${titleColor}">${titlePrefix}：${item.prizeName || '互动'}</span>
                                <span class="text-[10px] text-gray-400">${timeStr}</span>
                            </div>
                            <div class="text-sm font-medium text-gray-600">${item.desc}</div>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        async function startSpin() {
            if (isSpinning) return;
            
            if (myDzData.dailySpins >= 5) {
                showToast("今日次数已用完啦！明天再来吧~"); return;
            }
            
            const cost = myDzData.dailySpins === 0 ? 0 : 1;
            
            if (cost > 0 && myCkData.points < cost) {
                showToast("积分不足，快去挑战默契题赚积分吧！"); return;
            }

            // 先扣除费用（视觉上）
            if (cost > 0) {
                myCkData.points -= cost;
                document.getElementById('myPoints').innerText = myCkData.points;
            }

            isSpinning = true;
            document.getElementById('centerSpinBtn').classList.add('disabled');

            // 随机决定奖项 (0-7)
            // 简单的随机，如果不想要某些奖项太频繁，可以加权，这里使用均匀随机
            const prizeIndex = Math.floor(Math.random() * prizes.length);
            const selectedPrize = prizes[prizeIndex];

            // 计算旋转角度
            // 每个扇形 45 度。指针在顶部 (0度)。
            // 扇形 i 的中心角度是 i * 45 + 22.5 度。
            // 要让扇形 i 停在正上方，转盘需要旋转的角度为:  360 - (i * 45 + 22.5)
            const baseSpins = 5 * 360; // 转 5 圈
            const targetOffset = 360 - (prizeIndex * 45 + 22.5);
            
            // 为了让动画连续，加上上次的旋转基数（去掉余数）
            const currentBase = Math.floor(currentRotation / 360) * 360;
            currentRotation = currentBase + baseSpins + targetOffset;

            // 开始动画
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // 等待动画结束 (4秒)
            setTimeout(() => {
                handleSpinResult(selectedPrize, cost);
            }, 4000);
        }

        async function handleSpinResult(prize, costPaid) {
            showLoader("正在保存结果...");

            // 1. 结算积分
            myCkData.points += prize.myChange;
            partnerCkData.points += prize.partnerChange;

            // 防负数处理（可选，目前允许负数，如果有需要解开注释）
            // if(myCkData.points < 0) myCkData.points = 0;
            // if(partnerCkData.points < 0) partnerCkData.points = 0;

            // 2. 更新次数
            myDzData.dailySpins += 1;

            // 3. 构建历史记录
            const timestamp = Date.now();
            let myMsg = `消耗 ${costPaid} 积分，结果：${prize.desc}`;
            let pMsg = "";
            let isInteraction = false;
            let type = 'normal';

            if (prize.name === "顺手牵羊") {
                myMsg = `消耗 ${costPaid} 积分，成功偷取TA 3积分！😈`;
                pMsg = `被TA的【顺手牵羊】偷走了 3 积分 😭`;
                isInteraction = true;
                type = 'steal';
            } else if (prize.name === "福泽伴侣") {
                myMsg = `消耗 ${costPaid} 积分，触发福泽，送给TA 3积分 👼`;
                pMsg = `收到TA转盘送来的【福泽伴侣】 3 积分！🥰`;
                isInteraction = true;
                type = 'gift';
            }

            // 保存我的记录
            if (!myDzData.history) myDzData.history = [];
            myDzData.history.push({
                timestamp: timestamp,
                prizeName: prize.name,
                desc: myMsg,
                type: 'normal'
            });
            // 保持数组不过大
            if(myDzData.history.length > 50) myDzData.history.shift();

            // 如果涉及对方，保存到对方的记录中
            let needsUpdatePartnerDz = false;
            if (isInteraction) {
                if (!partnerDzData.history) partnerDzData.history = [];
                partnerDzData.history.push({
                    timestamp: timestamp,
                    prizeName: prize.name,
                    desc: pMsg,
                    type: type,
                    isInteraction: true // 标记以便在我的页面也能渲染这条属于对方视角的通知
                });
                if(partnerDzData.history.length > 50) partnerDzData.history.shift();
                needsUpdatePartnerDz = true;
            }

            // 4. 上传数据
            const promises = [];
            promises.push(updateFile(myCkPath, myCkData, 'myCk'));
            promises.push(updateFile(myDzPath, myDzData, 'myDz'));
            
            // 如果对方积分变动，保存对方积分
            if (prize.partnerChange !== 0) {
                promises.push(updateFile(partnerCkPath, partnerCkData, 'pCk'));
            }
            if (needsUpdatePartnerDz) {
                promises.push(updateFile(partnerDzPath, partnerDzData, 'pDz'));
            }

            await Promise.all(promises);

            hideLoader();
            renderUI();
            showResultModal(prize);
            isSpinning = false;
            
            // 恢复按钮状态 (除非次数用尽)
            if (myDzData.dailySpins < 5) {
                document.getElementById('centerSpinBtn').classList.remove('disabled');
            }
        }

        function showResultModal(prize) {
            const modal = document.getElementById('resultModal');
            document.getElementById('resultIcon').innerText = prize.icon;
            document.getElementById('resultTitle').innerText = prize.name;
            document.getElementById('resultDesc').innerText = prize.desc;
            
            // 根据吉凶改变标题颜色
            const titleEl = document.getElementById('resultTitle');
            if (prize.myChange > 0 || prize.partnerChange > 0) {
                titleEl.className = 'text-2xl font-bold mb-2 text-rose-500 relative z-10';
            } else if (prize.myChange < 0) {
                titleEl.className = 'text-2xl font-bold mb-2 text-gray-500 relative z-10';
            } else {
                titleEl.className = 'text-2xl font-bold mb-2 text-amber-500 relative z-10';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('scale-95');
            }, 10);
        }

        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function showLoader(text) {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').classList.remove('hidden');
        }
        function hideLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
