<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>默契大转盘 🎡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-pink: #f43f5e;
            --brand-pink-light: #fda4af;
            --bg-pink: #fff1f2;
            --wheel-border: #fce7f3;
        }

        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: var(--bg-pink); 
            background-image: radial-gradient(#fecdd3 1px, transparent 1px); 
            background-size: 24px 24px; 
            overflow-x: hidden;
            color: #333;
        }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(10px, -20px) scale(1.1); } 66% { transform: translate(-10px, 10px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        .animate-blob { animation: blob 5s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px -5px rgba(244, 63, 94, 0.2), 
                        0 0 0 6px white, 
                        0 0 0 12px var(--wheel-border);
            background: white;
            padding: 4px;
        }

        .wheel-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1); 
        }

        .wheel-pointer-container {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-pointer-svg {
            width: 36px;
            height: 44px;
            filter: drop-shadow(0 4px 4px rgba(244, 63, 94, 0.3));
        }

        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            background: white;
            border-radius: 50%;
            z-index: 10;
            border: 4px solid var(--wheel-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1), inset 0 2px 5px rgba(244, 63, 94, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .wheel-center-btn:active {
            transform: translate(-50%, -50%) scale(0.92);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* 禁用状态 */
        .wheel-center-btn.disabled {
            filter: grayscale(1);
            opacity: 0.8;
            cursor: not-allowed;
        }

        .spin-text-main {
            color: var(--brand-pink);
            font-size: 20px;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 1px;
        }
        
        .spin-text-sub {
            color: #10b981;
            font-size: 10px;
            font-weight: bold;
        }
        
        .points-card {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            border-radius: 20px;
            box-shadow: 0 8px 20px -6px rgba(244, 63, 94, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .points-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .history-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px -5px rgba(0,0,0,0.05);
            border: 1px solid rgba(244, 63, 94, 0.05);
        }

        .history-item {
            animation: fadeIn 0.4s ease-out forwards;
            background: #fcfcfc;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            margin-bottom: 8px;
            padding: 12px 16px;
        }
        
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            border-radius: 50%; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 pb-24">

    <!-- Header Area -->
    <header class="w-full max-w-md flex justify-between items-center mb-6 relative">
        <a href="index.html" class="w-10 h-10 bg-white text-rose-500 rounded-full shadow-sm flex items-center justify-center border border-rose-50 active:scale-95 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-black text-rose-500 flex items-center gap-2 absolute left-1/2 transform -translate-x-1/2">
            🎡 默契大转盘
        </h1>
        <div class="w-10 h-10"></div>
    </header>
    
    <!-- 导航栏 -->
    <div class="flex space-x-3 mb-6 w-full justify-center overflow-x-auto no-scrollbar py-2">
        <a href="wheel.html" class="px-5 py-2 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm whitespace-nowrap">幸运转盘</a>
        <a href="moqi.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-100 transition-all text-sm whitespace-nowrap">默契考验</a>
        <a href="flybird.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">笨鸟先飞</a>
        <a href="eyes.html" class="px-5 py-2 bg-white text-rose-500 rounded-full font-bold shadow-sm border border-rose-200 transition-all hover:bg-rose-50 text-sm whitespace-nowrap">眼疾手快</a>
    </div>

    <main class="w-full max-w-md flex flex-col items-center relative gap-6">
        
        <!-- Points Card -->
        <div class="points-card w-full p-5 text-white flex justify-between items-center">
            <div class="relative z-10">
                <div class="flex items-center gap-1.5 opacity-90 mb-1">
                    <span class="text-sm font-medium">我的小金库</span>
                    <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full backdrop-blur-sm" id="identityText">-</span>
                </div>
                <div class="flex items-baseline gap-1 mt-1">
                    <span class="text-4xl font-black tracking-tight drop-shadow-sm" id="myPoints">--</span>
                    <span class="text-sm font-medium opacity-90">积分</span>
                </div>
            </div>
            
            <div class="relative z-10 flex flex-col items-end h-full justify-between">
                <div class="text-4xl opacity-20 absolute -top-2 -right-2 transform rotate-12">🎰</div>
                <button onclick="refreshData()" class="bg-white/20 hover:bg-white/30 active:scale-95 backdrop-blur-md p-2 rounded-full transition-all mt-6 shadow-sm border border-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>

        <!-- Info Bar (Cost & Rules) -->
        <div class="w-full flex justify-between items-center px-2">
            <div class="text-xs text-gray-500 flex flex-col gap-1 font-medium">
                <span class="flex items-center gap-1">✨ 每次抽奖消耗 <b class="text-rose-500">1</b> 积分</span>
                <span class="flex items-center gap-1">🎁 隐藏大奖随机掉落</span>
            </div>
            <!-- Limit Badge: Dynamic state -->
            <div id="spinLimitBadge" class="bg-rose-50 text-rose-500 px-3 py-1.5 rounded-full text-xs font-bold border border-rose-100 shadow-sm flex items-center gap-1 transition-colors">
                <span>今日可用: -/5</span>
            </div>
        </div>

        <!-- Wheel Area -->
        <div class="wheel-wrapper mt-4" id="wheelBox">
            
            <div class="wheel-pointer-container">
                <svg class="wheel-pointer-svg" viewBox="0 0 40 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 50L4.41154 23.75C1.86015 19.4755 1.54282 14.2863 3.56586 9.77196C5.5889 5.25758 9.70494 2 14.6644 2H25.3356C30.2951 2 34.4111 5.25758 36.4341 9.77196C38.4572 14.2863 38.1398 19.4755 35.5885 23.75L20 50Z" fill="white" stroke="#fce7f3" stroke-width="2"/>
                    <path d="M20 46L6.5 23C4.5 19.5 4.5 15 6 11.5C7.5 8 11 5 15 5H25C29 5 32.5 8 34 11.5C35.5 15 35.5 19.5 33.5 23L20 46Z" fill="#f43f5e"/>
                    <circle cx="20" cy="14" r="5" fill="white"/>
                </svg>
            </div>
            
            <div id="wheelContainer" class="wheel-inner" style="transform: rotate(0deg);">
                <!-- JS Dynamic content -->
            </div>
            
            <div class="wheel-center-btn" onclick="startSpin()" id="spinBtn">
                <span class="spin-text-main">抽奖</span>
                <span class="spin-text-sub mt-0.5">1积分</span>
            </div>
            
            <!-- Loading overlay during network requests -->
            <div id="wheelLoadingOverlay" class="loading-overlay hidden">
                <svg class="animate-spin h-8 w-8 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>

        <!-- History Area -->
        <div class="history-card w-full p-5 mt-4">
            <div class="flex justify-between items-center mb-4 px-1">
                <h3 class="font-bold text-gray-800 flex items-center gap-2 text-base">
                    <span>📜</span> 幸运日记本
                </h3>
                <span class="text-[10px] font-medium text-gray-400 bg-gray-100 px-2 py-1 rounded-md">仅保存本地</span>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto no-scrollbar" id="historyList"></div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full shadow-lg text-sm font-medium hidden z-[70] whitespace-nowrap"></div>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform scale-50 transition-transform text-center relative overflow-hidden" id="resultModalContent">
            <!-- Decorative Blobs -->
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-rose-200 rounded-full mix-blend-multiply filter blur-2xl opacity-60 animate-blob"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-yellow-100 rounded-full mix-blend-multiply filter blur-2xl opacity-60 animate-blob animation-delay-2000"></div>
            
            <h3 class="font-bold text-gray-800 text-lg mb-5 relative z-10 flex items-center justify-center gap-2" id="resultTitle">
                🎉 抽奖结果
            </h3>
            
            <div class="mb-6 relative z-10 flex flex-col items-center">
                <div class="text-7xl animate-pop mb-4 filter drop-shadow-md" id="resultIcon">🎁</div>
                <h4 class="font-black text-2xl text-gray-800 mb-2" id="resultName">神秘奖励</h4>
                
                <div class="flex gap-2 items-center justify-center" id="resultDescContainer"></div>
            </div>
            
            <div class="bg-gray-50/80 border border-gray-100 rounded-xl p-3 mb-6 relative z-10" id="resultExtraBox">
                <p class="text-[11px] text-gray-500 font-medium" id="resultExtra">数据已自动同步至云端</p>
            </div>
            
            <button onclick="closeResultModal()" class="relative z-10 w-full py-3 bg-gradient-to-r from-rose-400 to-rose-500 text-white rounded-xl font-bold shadow-md shadow-rose-200 hover:shadow-lg active:scale-95 transition-all">
                开心收下
            </button>
        </div>
    </div>

    <script>
        // --- Config & Auth ---
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity');

        if (!GITHUB_TOKEN || !myIdentity) {
            window.location.href = 'index.html';
        }

        const partnerIdentity = (myIdentity === '哼哼') ? '亲亲' : '哼哼';
        document.getElementById('identityText').innerText = myIdentity;

        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const MY_FILE = `data/${myIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const PARTNER_FILE = `data/${partnerIdentity === '哼哼' ? 'hck' : 'qck'}.json`;
        const SCWP_FILE = 'data/scwp.json';
        
        // 新增：每日抽奖限制文件路径
        const LIMIT_FILE = `data/${myIdentity === '哼哼' ? 'hdzp' : 'qdzp'}.json`;
        const MAX_DAILY_SPINS = 5;

        let myData = { points: 0, inventory: {}, pendingUses: [], sha: null };
        let partnerData = { points: 0, inventory: {}, pendingUses: [], sha: null };
        let myLimitData = { timestamps: [], sha: null };
        let mallItems = [];

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        // --- Wheel Configuration (11 slices) ---
        const wheelSlices = [
            { id: 1, name: "微小确幸", icon: "🍬", type: 'self', val: 3, color: '#fef3c7', textColor: '#92400e' },
            { id: 2, name: "欧气爆棚", icon: "✨", type: 'self', val: 5, color: '#fee2e2', textColor: '#991b1b' },
            { id: 3, name: "破财消灾", icon: "💸", type: 'self', val: -5, color: '#f3e8ff', textColor: '#6b21a8' },
            { id: 4, name: "顺手牵羊", icon: "🦊", type: 'steal', val: 3, color: '#e0e7ff', textColor: '#3730a3' },
            { id: 5, name: "天降福运", icon: "🎊", type: 'self', val: 2, color: '#fef9c3', textColor: '#854d0e' },
            { id: 6, name: "运气欠佳", icon: "💣", type: 'self', val: -6, color: '#fce7f3', textColor: '#9d174d' },
            { id: 7, name: "拱手送福", icon: "🎁", type: 'partner', val: 3, color: '#dcfce7', textColor: '#166534' },
            { id: 8, name: "喜气洋洋", icon: "🎉", type: 'self', val: 1, color: '#ffedd5', textColor: '#9a3412' },
            { id: 9, name: "好运来", icon: "🍀", type: 'self', val: 10, color: '#e0f2fe', textColor: '#075985' },
            { id: 10, name: "大意失荆州", icon: "😱", type: 'self', val: -10, color: '#fee2e2', textColor: '#991b1b' },
            { id: 11, name: "隐藏大奖", icon: "👑", type: 'item', val: 0, color: '#fbcfe8', textColor: '#be185d' }
        ];

        let currentDegree = 0;
        let isSpinning = false;
        
        function initWheel() {
            const container = document.getElementById('wheelContainer');
            const numSlices = wheelSlices.length;
            const sliceAngle = 360 / numSlices;
            const halfSlice = sliceAngle / 2;

            let gradientParts = [];
            for (let i = 0; i < numSlices; i++) {
                const start = i * sliceAngle;
                const end = (i + 1) * sliceAngle;
                gradientParts.push(`${wheelSlices[i].color} ${start}deg ${end}deg`);
            }
            container.style.background = `conic-gradient(from -${halfSlice}deg, ${gradientParts.join(', ')})`;

            container.innerHTML = '';
            wheelSlices.forEach((slice, i) => {
                const sliceAngleDeg = i * sliceAngle;
                
                const el = document.createElement('div');
                el.className = 'absolute top-0 left-1/2 w-16 h-1/2 -ml-8 flex flex-col items-center pt-3 origin-bottom z-10';
                el.style.transform = `rotate(${sliceAngleDeg}deg)`;

                const iconEl = document.createElement('div');
                iconEl.className = 'text-[22px] mb-1 filter drop-shadow-sm';
                iconEl.innerText = slice.icon;

                const textEl = document.createElement('div');
                textEl.className = 'text-[11px] font-bold text-center leading-[1.15] tracking-wide';
                textEl.style.color = slice.textColor;
                
                if (slice.name.length > 4) {
                    textEl.innerHTML = slice.name.substring(0, Math.ceil(slice.name.length/2)) + '<br>' + slice.name.substring(Math.ceil(slice.name.length/2));
                } else {
                    textEl.innerText = slice.name;
                }

                el.appendChild(iconEl);
                el.appendChild(textEl);
                container.appendChild(el);
            });

            for (let i = 0; i < numSlices; i++) {
                const line = document.createElement('div');
                const lineAngle = (i * sliceAngle) - halfSlice;
                line.className = 'absolute top-0 left-1/2 w-px h-1/2 origin-bottom bg-white/40 z-20';
                line.style.transform = `rotate(${lineAngle}deg)`;
                container.appendChild(line);
            }
        }

        
        // 计算今天已经抽了多少次
        function getTodaySpinCount() {
            if (!myLimitData.timestamps) return 0;
            const today = new Date().toDateString();
            return myLimitData.timestamps.filter(ts => new Date(ts).toDateString() === today).length;
        }

        // 更新剩余次数 UI
        function updateLimitUI() {
            const count = getTodaySpinCount();
            const remain = Math.max(0, MAX_DAILY_SPINS - count);
            const badge = document.getElementById('spinLimitBadge');
            const spinBtn = document.getElementById('spinBtn');
            
            if (badge) {
                badge.innerHTML = `<span>今日可用: ${remain}/${MAX_DAILY_SPINS}</span>`;
                if (remain === 0) {
                    badge.className = "bg-gray-100 text-gray-500 px-3 py-1.5 rounded-full text-xs font-bold border border-gray-200 shadow-sm flex items-center gap-1 transition-colors";
                    spinBtn.classList.add('disabled');
                } else {
                    badge.className = "bg-rose-50 text-rose-500 px-3 py-1.5 rounded-full text-xs font-bold border border-rose-100 shadow-sm flex items-center gap-1 transition-colors";
                    spinBtn.classList.remove('disabled');
                }
            }
        }

        async function startSpin() {
            if (isSpinning) return;
            
            // 检查今日次数限制
            const todayCount = getTodaySpinCount();
            if (todayCount >= MAX_DAILY_SPINS) {
                showToast("🎡 今天已经转过5次啦，明天再来吧！");
                return;
            }
            
            if (myData.points < 1) {
                showToast("🪙 积分不够啦，快去赚点积分再来！");
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').style.opacity = '0.7';
            
            const overlay = document.getElementById('wheelLoadingOverlay');
            overlay.classList.remove('hidden');

            const targetIndex = Math.floor(Math.random() * wheelSlices.length);
            const prize = wheelSlices[targetIndex];
            
            let droppedItem = null;
            if (prize.type === 'item') {
                if (mallItems && mallItems.length > 0) {
                    droppedItem = mallItems[Math.floor(Math.random() * mallItems.length)];
                } else {
                    droppedItem = { name: "10积分(补偿)", icon: "🪙", desc: "网络原因道具迷路了" };
                }
            }

            const saveSuccess = await preSaveResult(prize, droppedItem);
            
            overlay.classList.add('hidden');

            if (!saveSuccess) {
                isSpinning = false;
                document.getElementById('spinBtn').style.opacity = '1';
                showToast("网络同步失败，请检查网络后重试");
                return;
            }

            document.getElementById('myPoints').innerText = myData.points; 

            const sliceAngle = 360 / wheelSlices.length;
            const targetSliceAngle = targetIndex * sliceAngle; 
            const spins = 6 * 360; 
            let targetDegree = currentDegree + spins;
            
            const currentMod = targetDegree % 360;
            const desiredMod = (360 - targetSliceAngle) % 360;
            
            let diff = desiredMod - currentMod;
            if (diff < 0) diff += 360;
            targetDegree += diff;

            currentDegree = targetDegree;

            const container = document.getElementById('wheelContainer');
            container.style.transform = `rotate(${currentDegree}deg)`;
            
            container.addEventListener('transitionend', function handler() {
                container.removeEventListener('transitionend', handler);
                onSpinComplete(prize, droppedItem);
            });
        }

        async function preSaveResult(prize, droppedItem) {
            // ==========================================
            // 1. 先扣除使用次数并记录时间戳
            // ==========================================
            const freshLimitRes = await fetchFile(LIMIT_FILE);
            let latestTimestamps = [];
            if (freshLimitRes.data && Array.isArray(freshLimitRes.data.timestamps)) {
                latestTimestamps = freshLimitRes.data.timestamps;
            }
            
            latestTimestamps.push(Date.now());
            // 防止文件无限增大，仅保留最近50条记录
            if (latestTimestamps.length > 50) {
                latestTimestamps = latestTimestamps.slice(-50);
            }
            
            const limitUpdate = await updateFile(LIMIT_FILE, { timestamps: latestTimestamps }, freshLimitRes.sha, `Wheel spin log: ${new Date().toLocaleString()}`);
            if (!limitUpdate.success) return false;
            
            // 更新本地限制数据并刷新UI
            myLimitData.timestamps = latestTimestamps;
            myLimitData.sha = limitUpdate.sha;
            updateLimitUI();

            // ==========================================
            // 2. 更新积分及奖品
            // ==========================================
            let finalSelfPoints = myData.points - 1;
            let finalPartnerPoints = partnerData.points;
            let finalInventory = { ...myData.inventory };
            let recordText = '';

            if (prize.type === 'self') {
                finalSelfPoints += prize.val;
                recordText = `${prize.name}`;
            } 
            else if (prize.type === 'partner') {
                finalPartnerPoints += prize.val;
                recordText = `${prize.name}`;
            } 
            else if (prize.type === 'steal') {
                finalSelfPoints += prize.val;
                finalPartnerPoints -= prize.val;
                recordText = `${prize.name}`;
            }
            else if (prize.type === 'item') {
                if (droppedItem.name === "10积分(补偿)") {
                    finalSelfPoints += 10;
                } else {
                    finalInventory[droppedItem.id] = (finalInventory[droppedItem.id] || 0) + 1;
                }
                recordText = `隐藏大奖 - ${droppedItem.name}`;
            }

            const freshMyRes = await fetchFile(MY_FILE);
            if (freshMyRes.error) return false;
            
            let latestSelfPoints = (freshMyRes.data?.points || 0) - 1;
            if (prize.type === 'self' || prize.type === 'steal') latestSelfPoints += prize.val;
            if (prize.type === 'item' && droppedItem.name === "10积分(补偿)") latestSelfPoints += 10;
            
            let latestInventory = freshMyRes.data?.inventory || {};
            if (prize.type === 'item' && droppedItem.name !== "10积分(补偿)") {
                latestInventory[droppedItem.id] = (latestInventory[droppedItem.id] || 0) + 1;
            }

            const selfUpdate = await updateFile(MY_FILE, { 
                points: latestSelfPoints, 
                inventory: latestInventory, 
                pendingUses: freshMyRes.data?.pendingUses || myData.pendingUses 
            }, freshMyRes.sha, `Wheel spin: ${prize.name}`);

            if (!selfUpdate.success) return false;

            if (prize.type === 'partner' || prize.type === 'steal') {
                const freshPartnerRes = await fetchFile(PARTNER_FILE);
                if (!freshPartnerRes.error) {
                    let latestPartnerPoints = freshPartnerRes.data?.points || 0;
                    if (prize.type === 'partner') latestPartnerPoints += prize.val;
                    if (prize.type === 'steal') latestPartnerPoints -= prize.val;

                    const partnerUpdate = await updateFile(PARTNER_FILE, {
                        points: latestPartnerPoints,
                        inventory: freshPartnerRes.data?.inventory || partnerData.inventory,
                        pendingUses: freshPartnerRes.data?.pendingUses || partnerData.pendingUses
                    }, freshPartnerRes.sha, `Wheel effect from ${myIdentity}: ${prize.name}`);
                    
                    if (partnerUpdate.success) {
                        partnerData.points = latestPartnerPoints;
                        partnerData.sha = partnerUpdate.sha;
                    }
                }
            }

            myData.points = latestSelfPoints;
            myData.inventory = latestInventory;
            myData.sha = selfUpdate.sha;

            saveHistory(prize, recordText, droppedItem);
            
            return true;
        }

        function onSpinComplete(prize, droppedItem) {
            document.getElementById('spinBtn').style.opacity = '1';
            isSpinning = false;
            
            renderHistory(); 
            showResultModal(prize, droppedItem);
        }

        async function fetchFile(filePath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) return { data: null, sha: null };
                if (!response.ok) throw new Error('Network response was not ok');
                
                const result = await response.json();
                const contentStr = b64_to_utf8(result.content);
                return { data: JSON.parse(contentStr), sha: result.sha };
            } catch (error) {
                return { error: true };
            }
        }

        async function updateFile(filePath, contentObj, sha, message) {
            try {
                const contentBase64 = utf8_to_b64(JSON.stringify(contentObj, null, 2));
                const body = { message: message, content: contentBase64 };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Update failed');
                const res = await response.json();
                return { success: true, sha: res.content.sha };
            } catch (error) {
                return { success: false };
            }
        }

        async function refreshData() {
            document.getElementById('myPoints').innerText = '...';

            const [myRes, partnerRes, scwpRes, limitRes] = await Promise.all([
                fetchFile(MY_FILE), fetchFile(PARTNER_FILE), fetchFile(SCWP_FILE), fetchFile(LIMIT_FILE)
            ]);

            if (scwpRes.data && Array.isArray(scwpRes.data)) {
                mallItems = scwpRes.data;
            }

            if (myRes.data && !myRes.error) {
                myData = { ...myData, ...myRes.data, sha: myRes.sha };
                if(typeof myData.points !== 'number') myData.points = 0;
            }
            if (partnerRes.data && !partnerRes.error) {
                partnerData = { ...partnerData, ...partnerRes.data, sha: partnerRes.sha };
                if(typeof partnerData.points !== 'number') partnerData.points = 0;
            }
            
            if (limitRes.data && !limitRes.error) {
                myLimitData = { ...limitRes.data, sha: limitRes.sha };
                if (!myLimitData.timestamps) myLimitData.timestamps = [];
            } else if (limitRes.data === null) {
                // 文件不存在初始化为空数组
                myLimitData = { timestamps: [], sha: null };
            }

            document.getElementById('myPoints').innerText = myData.points;
            updateLimitUI();
            renderHistory();
        }

        function saveHistory(prize, text, droppedItem) {
            let history = JSON.parse(localStorage.getItem('loveGacha_wheelHistory') || '[]');
            let badges = [];
            if (prize.type === 'self') badges.push({ text: `我 ${prize.val > 0 ? '+'+prize.val : prize.val}`, color: prize.val > 0 ? 'text-rose-500' : 'text-gray-500' });
            if (prize.type === 'partner') badges.push({ text: `TA +${prize.val}`, color: 'text-green-500' });
            if (prize.type === 'steal') badges.push({ text: `我 +${prize.val}, TA -${prize.val}`, color: 'text-purple-500' });
            if (prize.type === 'item') badges.push({ text: '获得道具', color: 'text-amber-500' });

            history.unshift({
                id: Date.now(),
                icon: prize.icon,
                text: text,
                badges: badges,
                time: new Date().getTime()
            });
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('loveGacha_wheelHistory', JSON.stringify(history));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('loveGacha_wheelHistory') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">还没有抽奖记录哦，快去试一把！</div>`;
                return;
            }

            list.innerHTML = history.map(item => {
                const dateStr = new Date(item.time).toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                const badgesHtml = (item.badges || []).map(b => 
                    `<span class="${b.color} font-bold bg-gray-100/50 px-2 py-0.5 rounded text-xs">${b.text}</span>`
                ).join('');

                return `
                <div class="history-item flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="text-2xl">${item.icon}</div>
                        <div>
                            <div class="font-bold text-gray-700 text-sm mb-0.5">${item.text}</div>
                            <div class="text-[10px] text-gray-400">${dateStr}</div>
                        </div>
                    </div>
                    <div class="flex gap-1">
                        ${badgesHtml}
                    </div>
                </div>`;
            }).join('');
        }

        function showResultModal(prize, droppedItem) {
            const iconEl = document.getElementById('resultIcon');
            const nameEl = document.getElementById('resultName');
            const containerEl = document.getElementById('resultDescContainer');
            
            containerEl.innerHTML = ''; 

            if (prize.type === 'item' && droppedItem) {
                iconEl.innerText = droppedItem.icon;
                nameEl.innerText = `获得: ${droppedItem.name}`;
                
                const badge = document.createElement('span');
                badge.className = "text-sm font-bold text-amber-600 bg-amber-50 border border-amber-100 px-3 py-1 rounded-full";
                badge.innerText = "道具已存入仓库";
                containerEl.appendChild(badge);
            } else {
                iconEl.innerText = prize.icon;
                nameEl.innerText = prize.name;
                
                if (prize.type === 'self') {
                    const badge = document.createElement('span');
                    const isPositive = prize.val > 0;
                    badge.className = `text-sm font-bold px-3 py-1 rounded-full border ${isPositive ? 'text-rose-500 bg-rose-50 border-rose-100' : 'text-gray-600 bg-gray-50 border-gray-200'}`;
                    badge.innerText = `我 ${isPositive ? '+' : ''}${prize.val} 积分`;
                    containerEl.appendChild(badge);
                }
                if (prize.type === 'partner') {
                    const badge = document.createElement('span');
                    badge.className = "text-sm font-bold text-green-600 bg-green-50 border border-green-100 px-3 py-1 rounded-full";
                    badge.innerText = `TA +${prize.val} 积分`;
                    containerEl.appendChild(badge);
                }
                if (prize.type === 'steal') {
                    const badge1 = document.createElement('span');
                    badge1.className = "text-sm font-bold text-purple-600 bg-purple-50 border border-purple-100 px-3 py-1 rounded-full";
                    badge1.innerText = `我 +${prize.val}`;
                    containerEl.appendChild(badge1);
                    
                    const badge2 = document.createElement('span');
                    badge2.className = "text-sm font-bold text-gray-500 bg-gray-100 border border-gray-200 px-3 py-1 rounded-full";
                    badge2.innerText = `TA -${prize.val}`;
                    containerEl.appendChild(badge2);
                }
            }

            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultModalContent');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-50');
                content.classList.add('scale-100');
            });
        }

        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-50');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }

        window.onload = function() {
            initWheel(); 
            refreshData(); 
        };
    </script>
</body>
