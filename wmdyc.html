<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我们的第一次 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #fdf2f8; 
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px); 
            background-size: 20px 20px; 
            overflow: hidden; 
        }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
        .toast-animate { animation: slideUpFade 3s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 0px; width: 0px; }
        
        #imageViewerModal { touch-action: none; }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col items-center">
    
    <!-- 顶部导航栏 -->
    <div class="z-40 w-full max-w-md bg-[#fdf2f8]/95 backdrop-blur-md pt-5 pb-3 px-4 shadow-sm border-b border-rose-100/50 shrink-0">
        <header class="text-center mb-4 w-full flex justify-between items-center px-1">
            <a href="index.html" class="p-2 bg-white text-rose-500 rounded-full shadow-sm border border-rose-100 transition-transform hover:scale-110 flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div class="flex-1 flex justify-center">
                <h1 class="text-xl font-bold text-rose-500 flex items-center justify-center gap-2 drop-shadow-sm">
                   <span>💖</span> 我们的第一次 <span>✨</span>
                </h1>
            </div>
            <div class="w-9 h-9 flex-shrink-0"></div>
        </header>

        <!-- 顶层主选项卡 -->
        <div class="flex space-x-2 w-full justify-center bg-white p-1 rounded-full shadow-sm border border-rose-100">
            <button id="tabListBtn" onclick="switchMainTab('list')" class="flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm">第一次回忆</button>
            <button id="tabUploadBtn" onclick="switchMainTab('upload')" class="flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50">发布</button>
        </div>
    </div>

    <main class="w-full max-w-md flex flex-col flex-1 px-4 mt-3 mb-4 overflow-hidden relative">
        
        <!-- 视图 1：第一次列表 -->
        <div id="listView" class="w-full h-full flex flex-col transition-opacity duration-300">
            <div class="flex justify-end items-center mb-3 w-full bg-white/90 p-2 rounded-xl shadow-sm border border-rose-100 backdrop-blur-sm shrink-0">
                <span class="text-xs text-rose-400 font-bold mr-2">排序方式:</span>
                <select id="sortSelect" onchange="renderEvents()" class="text-xs bg-rose-50 border border-rose-100 text-rose-500 rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-300 shadow-sm shrink-0 font-medium">
                    <option value="asc">时间顺序 (最早到最晚)</option>
                    <option value="desc">时间逆序 (最晚到最早)</option>
                </select>
            </div>

            <div class="w-full flex-1 bg-white/60 p-3 rounded-2xl shadow-sm border border-rose-100/60 backdrop-blur-md overflow-y-auto custom-scrollbar">
                <div id="eventsList" class="w-full pb-6 flex flex-col space-y-4">
                    <!-- JS动态渲染事件列表 -->
                </div>
            </div>
        </div>

        <!-- 视图 2：发布第一次 -->
        <div id="uploadView" class="w-full h-full flex flex-col hidden transition-opacity duration-300 overflow-y-auto custom-scrollbar pb-6">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-sm border-2 border-rose-100 shrink-0">
                
                <!-- 图片上传区 -->
                <div id="uploadArea" class="w-full h-40 border-2 border-dashed border-rose-300 rounded-xl bg-rose-50 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-100 transition-colors mb-5 relative overflow-hidden" onclick="document.getElementById('imageInput').click()">
                    <div id="uploadPlaceholder" class="flex flex-col items-center pointer-events-none">
                        <span class="text-4xl mb-2">📸</span>
                        <span class="text-sm font-bold text-rose-400">添加纪念图片 (可选)</span>
                    </div>
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                    <button id="clearImageBtn" onclick="clearImage(event)" class="hidden absolute top-2 right-2 bg-white/90 text-rose-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold z-20 hover:bg-rose-500 hover:text-white transition-colors backdrop-blur-sm">×</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

                <div class="space-y-4">
                    <!-- 发布人 -->
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600">发布人</span>
                        <span id="uploaderName" class="text-sm text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full flex items-center gap-1">👦 <span id="uploaderText"></span></span>
                    </div>
                    
                    <!-- 发生时间 -->
                    <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600">发生时间 <span class="text-rose-500">*</span></span>
                        <input type="date" id="formDate" class="text-sm bg-rose-50 border border-rose-200 text-rose-500 rounded-lg px-3 py-1.5 focus:outline-none focus:border-rose-400 font-medium">
                    </div>

                    <!-- 事件标题 -->
                    <div class="flex flex-col border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600 mb-2">我们的第一次... <span class="text-rose-500">*</span></span>
                        <input type="text" id="formTitle" placeholder="例如：第一次牵手 / 第一次看电影" class="w-full text-sm bg-rose-50 border border-rose-200 text-gray-700 rounded-lg px-3 py-2 focus:outline-none focus:border-rose-400 font-medium">
                    </div>

                    <!-- 详情描述 -->
                    <div class="flex flex-col border-b border-rose-100 pb-2">
                        <span class="text-sm font-bold text-gray-600 mb-2">详细回忆</span>
                        <textarea id="formDetail" rows="3" placeholder="写下当时的感受、有趣的小插曲..." class="w-full text-sm bg-rose-50 border border-rose-200 text-gray-700 rounded-lg px-3 py-2 focus:outline-none focus:border-rose-400 font-medium resize-none"></textarea>
                    </div>
                </div>

                <!-- 进度条 -->
                <div id="progressContainer" class="hidden w-full mt-5">
                    <div class="flex justify-between text-xs text-rose-500 mb-1.5 font-bold">
                        <span id="progressTitle">🚀 正在封存回忆...</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-rose-100 rounded-full h-2 shadow-inner overflow-hidden">
                        <div id="progressBar" class="bg-rose-500 h-2 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button onclick="submitEvent()" id="submitBtn" class="mt-6 w-full py-3.5 bg-gradient-to-r from-rose-400 to-pink-500 text-white text-[15px] font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2 tracking-wider">
                    发布回忆 🚀
                </button>
            </div>
        </div>
    </main>

    <!-- 图片大图查看器 -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-0 transition-opacity opacity-0" onclick="closeImageViewer()">
        <div id="imageViewerLoader" class="absolute inset-0 flex items-center justify-center z-40 hidden pointer-events-none">
            <div class="w-10 h-10 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <button class="absolute top-6 right-6 text-white hover:text-rose-400 text-3xl font-bold z-50 bg-black/40 rounded-full w-12 h-12 flex items-center justify-center backdrop-blur-sm" onclick="closeImageViewer(event)">&times;</button>
        <div id="imageContainer" class="w-full h-full flex items-center justify-center overflow-hidden">
            <img id="fullSizeImage" src="" class="max-w-none max-h-none object-contain transform transition-transform duration-100 ease-out relative z-30" onclick="event.stopPropagation()">
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium hidden z-50 whitespace-nowrap backdrop-blur-md border border-gray-700"></div>

    <script>
        // 基础配置：与相册保持一致，使用同样的Token，但使用新的数据文件
        const GITHUB_TOKEN = localStorage.getItem('loveGacha_githubToken');
        const myIdentity = localStorage.getItem('loveGacha_myIdentity') || '游客';
        document.getElementById('uploaderText').innerText = myIdentity;
        
        // 默认设置为今天的日期
        document.getElementById('formDate').valueAsDate = new Date();
        
        const OWNER_REPO = '878481881-jpg/loveplan'; 
        const FILE_EVENTS = 'data/FirstTimes.json';  // 新的独立数据文件
        
        let eventsData = { events: [] };
        let eventsSha = null;

        let currentImageDataUrl = null; 
        let currentImageBase64 = null;
        let currentImageExt = 'jpg';

        // 缩放和拖拽变量
        let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0, lastDistance = 0;

        window.onload = async function() {
            if (!GITHUB_TOKEN) { showToast("未检测到Token，仅支持预览"); }
            await fetchEventsData();
            renderEvents();
        };

        function switchMainTab(tab) {
            const views = {
                'list': document.getElementById('listView'),
                'upload': document.getElementById('uploadView')
            };
            const btns = {
                'list': document.getElementById('tabListBtn'),
                'upload': document.getElementById('tabUploadBtn')
            };

            for (const key in views) {
                if (key === tab) {
                    views[key].classList.remove('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-rose-500 text-white rounded-full font-bold shadow-md transition-all text-sm";
                } else {
                    views[key].classList.add('hidden');
                    btns[key].className = "flex-1 py-1.5 bg-transparent text-rose-500 rounded-full font-bold transition-all text-sm hover:bg-rose-50";
                }
            }

            if (tab === 'list') renderEvents();
        }

        // 图片选择与清理
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                showToast("图片不能超过10MB哦~");
                event.target.value = ''; return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageDataUrl = e.target.result;
                currentImageBase64 = currentImageDataUrl.split(',')[1];
                currentImageExt = file.name.split('.').pop() || 'jpg';
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('clearImageBtn').classList.remove('hidden');
                const imgEl = document.getElementById('imagePreview');
                imgEl.src = currentImageDataUrl;
                imgEl.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        function clearImage(event) {
            event.stopPropagation(); 
            currentImageBase64 = null;
            currentImageDataUrl = null;
            document.getElementById('imageInput').value = '';
            const imgEl = document.getElementById('imagePreview');
            imgEl.src = ''; imgEl.classList.add('hidden');
            document.getElementById('clearImageBtn').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
        }

        // 获取 Github 数据[cite: 1]
        async function fetchEventsData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${FILE_EVENTS}?t=${timestamp}`, {
                    method: 'GET', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}` }
                });
                if (response.status === 404) {
                    eventsData = { events: [] };
                    return true;
                }
                if (!response.ok) return false;
                
                const result = await response.json();
                const contentStr = decodeURIComponent(escape(atob(result.content.replace(/\s/g, ''))));
                eventsData = JSON.parse(contentStr || '{"events":[]}');
                eventsSha = result.sha;
                return true;
            } catch (error) { return false; }
        }

        async function updateFile(filePath, newData, sha) {
            try {
                const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))); 
                const body = { message: `Update first-time data`, content: encodedContent };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER_REPO}/contents/${filePath}`, {
                    method: 'PUT', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                if (!response.ok) return { success: false, sha: sha };
                const result = await response.json();
                return { success: true, sha: result.content.sha };
            } catch (error) { return { success: false, sha: sha }; }
        }

        function uploadMediaToGithubWithProgress(base64Data, extension, folderName, prefix) {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const filename = `${prefix}_${timestamp}.${extension}`;
                const path = `${folderName}/${filename}`; 

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', `https://api.github.com/repos/${OWNER_REPO}/contents/${path}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
                xhr.setRequestHeader('Authorization', `Bearer ${GITHUB_TOKEN}`);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.upload.onprogress = function(event) {
                    if (event.lengthComputable) {
                        const percentComplete = Math.floor((event.loaded / event.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressText').innerText = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.content.download_url);
                    } else { reject(new Error('Upload failed')); }
                };
                xhr.onerror = function() { reject(new Error('Network error')); };
                xhr.send(JSON.stringify({ message: `Upload first-time image ${filename}`, content: base64Data }));
            });
        }

        function generateThumbnailBase64(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const MAX_WIDTH = 400; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]);
                };
                img.src = dataUrl;
            });
        }

        // 提交表单[cite: 1] 
        async function submitEvent() {
            const dateStr = document.getElementById('formDate').value;
            const title = document.getElementById('formTitle').value.trim();
            const detail = document.getElementById('formDetail').value.trim();
            
            if (!dateStr || !title) {
                showToast("时间和标题是必填的哦！"); return;
            }
            if (!GITHUB_TOKEN) {
                showToast("未配置Token，无法上传！"); return;
            }

            const btn = document.getElementById('submitBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressTitle = document.getElementById('progressTitle');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                let uploadedThumbUrl = null;
                let uploadedImageUrl = null;
                
                // 如果有图片，先走图片上传逻辑
                if (currentImageBase64) {
                    progressContainer.classList.remove('hidden');
                    document.getElementById('progressBar').style.width = '0%';
                    document.getElementById('progressText').innerText = '0%';
                    
                    btn.innerText = "压缩图片中...";
                    const thumbBase64 = await generateThumbnailBase64(currentImageDataUrl);
                    
                    btn.innerText = "上传缩略图中...";
                    progressTitle.innerText = "🚀 正在上传缩略图...";
                    uploadedThumbUrl = await uploadMediaToGithubWithProgress(thumbBase64, 'jpg', 'firsttimes', 'thumb');
                    
                    btn.innerText = "上传原图中...";
                    progressTitle.innerText = "🚀 正在上传高清原图...";
                    document.getElementById('progressBar').style.width = '0%';
                    document.getElementById('progressText').innerText = '0%';
                    uploadedImageUrl = await uploadMediaToGithubWithProgress(currentImageBase64, currentImageExt, 'firsttimes', 'origin');
                }

                btn.innerText = "正在同步数据...";
                
                const newEvent = {
                    id: Date.now(),
                    date: dateStr, // YYYY-MM-DD
                    title: title,
                    detail: detail,
                    uploader: myIdentity,
                    url: uploadedImageUrl,
                    thumbUrl: uploadedThumbUrl, 
                    timestamp: Date.now()
                };

                if (!eventsData.events) eventsData.events = [];
                eventsData.events.push(newEvent); // 先加入数组

                const upRes = await updateFile(FILE_EVENTS, eventsData, eventsSha);
                
                if (upRes.success) {
                    eventsSha = upRes.sha;
                    showToast("回忆封存成功！🎉");
                    
                    // 重置表单
                    clearImage({stopPropagation: () => {}}); 
                    document.getElementById('formTitle').value = '';
                    document.getElementById('formDetail').value = '';
                    document.getElementById('formDate').valueAsDate = new Date();
                    
                    switchMainTab('list'); 
                } else {
                    showToast("数据保存失败，请稍后重试");
                    eventsData.events.pop(); // 失败回滚
                }
            } catch (error) {
                console.error(error);
                showToast("保存失败，请检查网络");
            } finally {
                btn.innerHTML = "发布回忆 🚀"; 
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                progressContainer.classList.add('hidden');
            }
        }

        // 渲染列表页
        function renderEvents() {
            const container = document.getElementById('eventsList');
            const sortMode = document.getElementById('sortSelect').value;
            
            if (!eventsData.events || eventsData.events.length === 0) {
                container.innerHTML = `<div class="w-full text-center text-sm text-gray-400 py-10 mt-10">还没有记录任何“第一次”哦，快去发布吧~ 💖</div>`;
                return;
            }

            // 拷贝一份数据用于排序展示
            let displayList = [...eventsData.events];
            
            // 排序逻辑：根据输入的日期字符转时间戳排序
            displayList.sort((a, b) => {
                const timeA = new Date(a.date).getTime();
                const timeB = new Date(b.date).getTime();
                if (sortMode === 'asc') return timeA - timeB; // 时间顺序
                return timeB - timeA; // 时间逆序
            });

            let html = '';

            displayList.forEach((item, index) => {
                // 格式化日期显示，比如 2026-05-20
                const dateObj = new Date(item.date);
                const displayDate = `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
                const displayThumb = item.thumbUrl || item.url;
                
                // 图片部分HTML
                let imageHtml = '';
                if (displayThumb) {
                    imageHtml = `
                    <div class="w-full h-40 overflow-hidden cursor-zoom-in" onclick="openImageViewer('${displayThumb}', '${item.url}')">
                        <img src="${displayThumb}" loading="lazy" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-500">
                    </div>`;
                }

                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-rose-100/60 animate-fade-in overflow-hidden relative">
                        ${imageHtml}
                        <div class="p-4">
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <h3 class="text-rose-600 font-bold text-lg leading-tight flex-1">${item.title}</h3>
                                <div class="bg-rose-50 border border-rose-100 text-rose-500 text-[11px] px-2 py-1 rounded-md font-mono font-bold shrink-0 shadow-sm">
                                    ${displayDate}
                                </div>
                            </div>
                            
                            ${item.detail ? `<p class="text-gray-600 text-sm mb-3 bg-gray-50 p-2.5 rounded-lg border border-gray-100 whitespace-pre-wrap">${item.detail}</p>` : ''}
                            
                            <div class="flex items-center justify-between text-xs text-gray-400 mt-2 border-t border-rose-50 pt-2">
                                <div class="flex items-center gap-1">
                                    <span>发布人:</span>
                                    <span class="font-bold text-rose-400 flex items-center gap-0.5">👦 ${item.uploader}</span>
                                </div>
                                <span class="font-mono scale-90 origin-right opacity-60">ID: ${item.id}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- 图片大图查看器及其缩放手势控制代码 (复用 photowall 的逻辑)[cite: 1] ---
        function openImageViewer(thumbUrl, fullUrl) {
            const modal = document.getElementById('imageViewerModal');
            const img = document.getElementById('fullSizeImage');
            const loader = document.getElementById('imageViewerLoader');
            
            scale = 1; pointX = 0; pointY = 0;
            setTransform();
            
            img.src = thumbUrl || fullUrl;
            img.onload = function() {
                const container = document.getElementById('imageContainer');
                const ratioX = container.clientWidth / img.naturalWidth;
                const ratioY = container.clientHeight / img.naturalHeight;
                const initialScale = Math.min(ratioX, ratioY, 1);
                img.style.width = (img.naturalWidth * initialScale) + 'px';
                img.style.height = (img.naturalHeight * initialScale) + 'px';
            };

            if (thumbUrl && thumbUrl !== fullUrl) {
                loader.classList.remove('hidden');
                const highResImg = new Image();
                highResImg.onload = () => { img.src = fullUrl; loader.classList.add('hidden'); };
                highResImg.onerror = () => { loader.classList.add('hidden'); showToast("原图加载失败"); };
                highResImg.src = fullUrl;
            } else { loader.classList.add('hidden'); }

            modal.classList.remove('hidden');
            requestAnimationFrame(() => { modal.classList.remove('opacity-0'); });
            setupZoomAndPan();
        }

        function closeImageViewer(event) {
            if(event) event.stopPropagation();
            const modal = document.getElementById('imageViewerModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('fullSizeImage').src = '';
            }, 300);
            removeZoomAndPan();
        }
        
        function setTransform() { document.getElementById('fullSizeImage').style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

        function handlePointerDown(e) {
            e.preventDefault(); panning = true;
            if (e.touches && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastDistance = Math.sqrt(dx * dx + dy * dy);
            } else {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - pointX; startY = clientY - pointY;
            }
        }

        function handlePointerMove(e) {
            e.preventDefault(); if (!panning) return;
            if (e.touches && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                scale += (distance - lastDistance) * 0.01;
                scale = Math.min(Math.max(0.5, scale), 5);
                lastDistance = distance; setTransform();
            } else if (panning) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                pointX = clientX - startX; pointY = clientY - startY; setTransform();
            }
        }

        function handlePointerUp(e) { e.preventDefault(); panning = false; }
        function handleWheel(e) {
            e.preventDefault();
            scale += Math.sign(e.deltaY) * -0.1;
            scale = Math.min(Math.max(0.5, scale), 5);
            setTransform();
        }

        function setupZoomAndPan() {
            const container = document.getElementById('imageContainer');
            container.addEventListener('mousedown', handlePointerDown);
            container.addEventListener('mousemove', handlePointerMove);
            container.addEventListener('mouseup', handlePointerUp);
            container.addEventListener('mouseleave', handlePointerUp);
            container.addEventListener('wheel', handleWheel, { passive: false });
            container.addEventListener('touchstart', handlePointerDown, { passive: false });
            container.addEventListener('touchmove', handlePointerMove, { passive: false });
            container.addEventListener('touchend', handlePointerUp);
            container.addEventListener('touchcancel', handlePointerUp);
        }
        
        function removeZoomAndPan() {
            const container = document.getElementById('imageContainer');
            container.removeEventListener('mousedown', handlePointerDown);
            container.removeEventListener('mousemove', handlePointerMove);
            container.removeEventListener('mouseup', handlePointerUp);
            container.removeEventListener('mouseleave', handlePointerUp);
            container.removeEventListener('wheel', handleWheel);
            container.removeEventListener('touchstart', handlePointerDown);
            container.removeEventListener('touchmove', handlePointerMove);
            container.removeEventListener('touchend', handlePointerUp);
            container.removeEventListener('touchcancel', handlePointerUp);
        }

        function showToast(msg) { 
            const toast = document.getElementById('toast'); 
            toast.innerText = msg; 
            toast.classList.remove('hidden'); 
            toast.classList.add('toast-animate'); 
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-animate'); 
            }, 3000); 
        }
    </script>
</body>
</html>
